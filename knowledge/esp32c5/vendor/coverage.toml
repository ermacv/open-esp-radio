# ESP32-C5 vendor coverage decisions: the vendor code locations that the
# ESP32-C5 vendor-comparison scenario of a stack outside this repository (the
# analog-register I2C transport of the pinned `libphy.a` against its own, over
# the v1.0 ROM) never reached, each with the reason, and how this port stands
# against it.
#
# The reviewed coverage exclusions of that stack, state of 2026-10-16, in the
# format of `../../esp32s31/vendor/coverage.toml`, whose header defines the
# fields. `reason` keeps that review's wording; "production" there means that
# stack. The provenance check reads the function names the decisions cite.
schema = 1

[[decision]]
id = 1
area = "PHY analog I2C: C library memset"
decision = "not-needed"
reason = """
the C library `memset` that `phy_i2c_init1` calls to clear its six 44-byte \
stack arrays: the function then stores every byte of each array explicitly, \
so no cleared byte reaches a command, and the other length and alignment \
paths of `memset` belong to the C library, not to the PHY"""
port_status = "none"
port = []
[[decision.place]]
function = "memset"

[[decision]]
id = 2
area = "PHY analog I2C: pre-write busy wait of the masked write"
decision = "covered-differently"
reason = """
the pre-write busy wait of the constant-propagated `phy_chip_i2c_writeReg` \
copy `phy_i2c_writeReg_Mask` calls: the same wait the compared writeReg leaf \
covers on a busy port, while the preceding read of `phy_i2c_writeReg_Mask` \
polled the same host idle before this write"""
port_status = "partial"
port = [
    "portable/espressif/analog/src/lib.rs AnalogRegisterBus",
    "portable/espressif/analog/src/lib.rs FieldWrite",
]
review = """
the chip-independent field write, which observes each command's completion \
before the next, is present; the ESP32-C5 bus that implements \
`AnalogRegisterBus` is not in this repository"""
[[decision.place]]
function = "phy_chip_i2c_writeReg.constprop.2"
start = 0x40
end = 0x44
