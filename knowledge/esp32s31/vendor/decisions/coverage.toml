# Reviewed coverage exclusions of every ESP32-S31 scenario: vendor locations
# the comparisons never reach, each with its reason. Vendor runtime helpers
# inside the PHY closures: their paths depend on operand magnitudes, alignment
# and diagnostic formatting, not on driver behavior; production has its own
# Rust arithmetic, copies and no vendor console output, and the comparisons
# observe the helpers only through the PHY effects that use their results.
# Vendor configurations production rejects fail-closed have no production path
# to compare.
#
# A place names a vendor `function`: the whole function, a `diagnostic`
# output function, or offsets `start` up to `end`. A shard depends only on the
# decisions with a place in one of its closure functions.

[[decision]]
