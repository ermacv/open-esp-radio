[[decision]]
id = 66
area = "Modem clock: interrupt-context critical section"
decision = "covered-differently"
reason = """
the vendor's interrupt-context critical section (`xPortInIsrContext`): the \
ESP-IDF modem clock driver takes its spinlock through the ISR variant \
inside an interrupt; production's lease runs the selection in task context \
only, during the Controller clock transition (reviewed with the Bluetooth \
owner)"""
port_status = "present"
port = ["chips/esp32s31/hal/src/domain.rs select_bluetooth_low_power_clock"]
review = """
the predecessor named a shared radio lease as the task-context owner; this \
repository has no such lease, the selection belongs to `RadioDomain`"""
