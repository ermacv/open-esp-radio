[[decision]]
id = 68
area = "Modem clock: Wi-Fi low-power sources other than RC slow and 32 kHz crystal"
decision = "not-needed"
reason = """
Wi-Fi low-power clock sources other than the RC slow oscillator and the 32 \
kHz crystal: the only ESP-IDF selection for the Wi-Fi module is \
`esp_perip_clk_init`, which picks the 32 kHz crystal when the RTC slow \
clock runs from it and the RC slow oscillator otherwise, so the RC fast, \
main crystal, RC 32 kHz and external 32 kHz arms and the out-of-range \
assertion have no caller; production admits exactly the two sources \
(`WifiLowPowerClockSource`)"""
port_status = "present"
port = [
    "chips/esp32s31/pac/src/modem/shared_clock.rs WifiLowPowerClockSource",
]
[[decision.place]]
function = "modem_clock_hal_select_wifi_lpclk_source"
