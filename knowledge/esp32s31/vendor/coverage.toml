# ESP32-S31 vendor coverage decisions: the vendor code locations the
# predecessor's vendor-comparison scenarios never reached, each with the
# reason, and how this port stands against it.
#
# Carried from the predecessor's reviewed coverage exclusions (state of
# 2026-10-16). `reason` keeps the predecessor's wording; "production" there
# means the predecessor's Rust stack. Data only: nothing reads this file.
#
# Fields of a `[[decision]]`:
# - `id`: stable number in the predecessor's order.
# - `area`: the vendor area in a few words.
# - `decision`:
#   - `covered-differently`: the port has the behaviour through its own
#     mechanism (a typed error or owner, a bounded poll, a single owner in
#     place of a critical section);
#   - `not-needed`: the port needs no counterpart (vendor diagnostics,
#     compiler or C runtime code, arguments or branches no admitted input
#     reaches, requests the port rejects as outside its profile, vendor roles
#     with no owner here);
#   - `deferred`: a radio capability the port does not implement yet; a
#     change that adds it reopens the decision.
# - `closes_in` (only for `deferred`): the slice or wave that closes it
#   (W2–W6, the second block, the coexistence or Bluetooth LE block, PHY
#   slicing), or `unscheduled`. Each slot is the owner's (2026-10-18).
# - `port_status`: `present` (every listed item exists in this repository),
#   `partial` (some of the counterpart exists only in the predecessor; see
#   `review`), `predecessor-only`, or `none` (nothing to cover).
# - `port`: current items, as "<file> <item>", that implement, bound or
#   reject the path; a file alone names a module.
# - `review`: optional; where this repository disagrees with the reason or a
#   claim could not be checked.
#
# A `[[decision.place]]` names a vendor `function`: the whole function, a
# `diagnostic` output function, or byte offsets `start` up to `end` inside it,
# in the pinned artifacts of `artifacts.toml`. `note` keeps the predecessor's
# comment on that place.
schema = 1

