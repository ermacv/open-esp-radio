schema = 6

# Every linked function without a compiler frame record (`-Z emit-stack-sizes`)
# needs exactly one review there: assembly, vector data or compiler runtime.
coverage_policy = "../../family/platform/layout/stack-coverage.toml"

# Reject implicit copies/moves large enough to hide owner graphs or buffers in
# compiler temporaries. The lint is enforced while building the final fat-LTO
# selected runtime image.
max_move_bytes = 4096

# Default PSRAM task allocations, indexed by the platform hart geometry.
# A contained hart has an explicit zero allocation.
default_task_stack_bytes = { 0 = 0x30000, 1 = 0 }

# Each used hart's SRAM interrupt stack is sized from its proven bound:
# `align16(ceil(bound * (100 + irq_stack_margin_percent) / 100))` plus its
# guard (`irq_stack_guard_bytes` below, unless the image declines it). An image whose bound for a hart is not proven declares that stack's
# size itself (`[package.metadata.open-radio] irq-stack`). What limits a
# stack is the SRAM it is placed in.
irq_stack_margin_percent = 10
# The guard below each used hart's interrupt stack, by hart: a NAPOT region
# the runtime watches with debug trigger 2, a power of two of at least 16
# bytes. Hart 0's stack is rounded up so that hart 1's guard above it is
# aligned. An image declines the guard (`[package.metadata.open-radio]
# irq-stack-guard = "declined"`): then no guard bytes, no rounding and no
# arming code; an overflow of hart 0's stack runs below the SRAM's start and
# one of hart 1's into the top of hart 0's stack.
irq_stack_guard_bytes = { 0 = 4096, 1 = 1024 }
# What the first, analysis-only link places for every used interrupt stack:
# only large enough to link and to be analysed. No size is gated against it,
# and the second link's allocation does not depend on it.
analysis_irq_stack_bytes = 0x8000

# Each stack is bounded from the function that runs on it from its top: the
# worst-case call chain of that root, from the image's machine code and the
# pinned ROM, must leave the stack's storage `minimum_free_bytes`. A root that
# reaches indirect sites no fact resolves (the executor's task polls, trait
# objects) has a partial bound: it passes with its unresolved sites listed in
# the report, and the part it proves must fit. The same reserves are the
# absolute headroom runtime stack painting holds every exercised workload to.

# `_runtime_start` switches to the top of this stack (`_runtime_stack_bootstrap`)
# and tail-calls `runtime_main`, which runs the boot hart's executor.
[core.0.task_stack]
root = "runtime_main"
bottom_symbol = "__runtime_cpu0_task_stack_bottom"
top_symbol = "__runtime_cpu0_task_stack_top"
minimum_free_bytes = 16384

# The dedicated SRAM interrupt stacks are sized from their bound and
# `irq_stack_margin_percent` above; there is no separate fixed free-byte
# reserve.
# The IRQ sum includes three complete exception entry/handler bounds, from
# staged-runtime::trap::MAX_EXCEPTION_FRAMES and _runtime_exception_frames.
# fatal::reset_platform_once admits one reset attempt; with intact SRAM,
# entry and local mask code, stop/hook reentry plus a reset fault add at most
# two frames above the first. Link-time sizing retains the existing margin.
[core.0.interrupt_stack]

# Hart 1 runs only in an image that declares it (`[package.metadata.open-radio]
# harts`): its generated entry `_runtime_start_h1` switches to the top of this
# stack and tail-calls `runtime_secondary_main_h1`, the image's root
# (`secondary_entry!`), which installs its interrupt stack and the common
# exception path, reports ready and runs the image's hart-1 main. Its bound
# must be proven. The default allocation above stays zero:
# every image that does not declare hart 1 keeps both stacks unused, and the
# image gate proves no starter, route or storage admits it. `launch_bytes` is
# what a declaring image links before a proven bound sizes the stack.
[core.1.task_stack]
launch = "declared"
root = "runtime_secondary_main_h1"
bottom_symbol = "__runtime_cpu1_task_stack_bottom"
top_symbol = "__runtime_cpu1_task_stack_top"
minimum_free_bytes = 2048
launch_bytes = 0x4000

[core.1.interrupt_stack]
launch = "declared"

# The bootstrap reset entry installs `_stack_end`..`_stack_start` and enters
# `bootstrap_main` after clearing BSS. The stack analysis starts at that Rust root.
[bootstrap_stack]
root = "bootstrap_main"
bottom_symbol = "_stack_end"
top_symbol = "_stack_start"
minimum_free_bytes = 4096
# The bootstrap jumps to stage two's entry and never uses its stack again;
# the checks verify both facts in the ELFs.
handoff = "_runtime_start"
