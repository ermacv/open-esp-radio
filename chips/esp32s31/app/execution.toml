[[wait]]
id = "hart1-boot"
waiter = ["external:hart0-boot"]
served-by = ["external:hart1-boot"]
service = "the launched hart finishes its constructors and publishes BOOTED"
held = "hart 0 keeps its interrupts disabled while polling"
bound = { kind = "boot-deadline", detail = "BOOTED_WAIT is 50 ms within BOOTED_BUDGET of 100 ms below the RTC watchdog; refusal records hart1-boot and resets" }
when = { all = ["group"] }

[[wait]]
id = "radio-request"
waiter = ["external:radio-client"]
served-by = ["task:radio-actor"]
service = "the executor polls the actor, which drains the request inbox and publishes its answer"
held = "the request owns the lent membership cell until the answer; dropping a pending request retains custody"
bound = { kind = "none", detail = "Pending::poll has no timeout; it forwards an answer or abandonment from Awaiting::poll_answer" }
active-when = { all = ["radio-started"] }
when = { all = ["wifi"] }

[[wait]]
id = "sar-sample"
waiter = ["task:radio-actor"]
served-by = ["entry:phy"]
service = "the actor yields its poll, the programmed alarm enters its handler and the reply bundle is published"
held = "the request bundle carries the PHY transaction to the handler and back"
bound = { kind = "none", detail = "Client::sample has no timeout around the reply wait; progress requires the alarm and executor" }
active-when = { all = ["radio-started"] }
when = { all = ["wifi"] }

[[wait]]
id = "network-queues"
waiter = ["task:datapath", "task:network"]
served-by = ["task:network", "task:datapath"]
service = "the actor polls eligible transmit input and returned-buffer capacity; the network polls receive data and transmit credits; a published batch flushes its notify"
held = "queue endpoints and queued frames; unsent owners stay with the caller or actor; a pending readiness wait reserves no queue credit"
bound = { kind = "none", detail = "queue readiness has no per-operation timeout; the actor polls its other sources and any armed protocol deadline in the same round" }
active-when = { all = ["radio-started"] }
when = { all = ["wifi"] }

[[wait]]
id = "network-lent-return"
waiter = ["task:datapath"]
served-by = ["task:network"]
service = "NetworkCredit::poll_count registers before checking held; lend room needs held below its limit and full return needs held == 0"
held = "the network owns each lent receive unit until drop; the actor retains the remaining receive ring and staged frames"
bound = { kind = "none", detail = "normal lend-room and return waits have no local timeout; the retiring-stop wait has its separate deadline below" }
active-when = { all = ["radio-started"] }
when = { all = ["wifi"] }

[[wait]]
id = "network-stop"
waiter = ["task:datapath"]
served-by = ["task:network"]
service = "NetworkStopState publishes stopped/lost then notifies the actor; poll_network_stop also requires all lent units returned; no_network reports absence without a consumer wait"
held = "the actor keeps its port/arena and outstanding frame custody while stopping or draining"
bound = { kind = "operation-deadline", detail = "Radio::Stopping and Radio::Draining carry a caller-selected deadline, included in the actor alarm; overdue or lost participants yield StopOutcome::Unconfirmed instead of a confirmed stop" }
active-when = { all = ["network-stopping"] }
when = { all = ["wifi"] }

[[wait]]
id = "application-send"
waiter = ["task:application", "task:group"]
served-by = ["task:group", "task:application"]
service = "the peer consumes queued data and notifies a waiting producer; group selects APPLICATION/SECOND on two harts, otherwise ordinary local wakers"
held = "the sending future keeps its value and borrows its End until capacity is ready; already queued values stay in the queue"
bound = { kind = "none", detail = "End::send has no timeout or peer-closed result; if both tasks await send with both queues full, neither operation drains its receive queue" }

[[wait]]
id = "application-receive"
waiter = ["task:application", "task:group"]
served-by = ["task:group", "task:application"]
service = "register the consumer notify, then test for input; group selects APPLICATION/SECOND on two harts, otherwise ordinary local wakers"
held = "the pending future borrows its End; it consumes no input or capacity while pending"
bound = { kind = "none", detail = "End::receive has no timeout or peer-closed result; two peers waiting on empty receive queues need an external sender or caller cancellation" }

[[wait]]
id = "mac-facts"
waiter = ["task:datapath"]
served-by = ["entry:wifi", "external:wifi-hardware"]
service = "an active port polls device events and RX work; signal polling registers the owning task then takes durable facts; service requires the routed, enabled source and executor polling"
held = "the actor/port retain installed radio, RX/TX custody and queued work while idle"
bound = { kind = "conditional-deadlines", detail = "an idle fact wait has no timeout; outstanding port, TX arena, receive and stop work can supply deadlines through Actor::deadline, so missing hardware facts do not imply every active operation waits forever" }
active-when = { all = ["radio-started"] }
when = { all = ["wifi"] }

[[wait]]
id = "console-read"
waiter = ["task:console-endpoint"]
served-by = ["entry:console_usb", "external:usb-host"]
service = "drain existing OUT FIFO bytes first; otherwise poll the signal for OUT_RECEIVED and retry the FIFO; events are enabled when Endpoint::new binds it"
held = "the read future borrows the caller buffer and the unique endpoint; unused signal facts remain in the endpoint"
bound = { kind = "none", detail = "no local timeout or disconnect result; it can remain pending without host traffic; a foreign executor returns ForeignContext" }
when = { all = ["console"] }

[[wait]]
id = "console-write"
waiter = ["task:console-endpoint"]
served-by = ["entry:console_usb", "external:usb-host"]
service = "send clears old IN_EMPTY facts before handing over a packet; completion needs a later IN_EMPTY and FIFO room; a full final packet sends a zero-length packet too"
held = "the write future borrows the input and unique endpoint; a handed-over packet remains in the hardware FIFO"
bound = { kind = "none", detail = "no local timeout or disconnect result; a host that does not read can leave it pending; flush returns immediately because write already waited" }
when = { all = ["console"] }
