# Candidate schema, checked on the host. The firmware still uses the existing
# interrupt layout and Rust declarations. See tools/image/execution/README.md.
schema = 1
chip = "esp32s31"
features = ["wifi", "group", "observe", "console", "udp"]
instrumentation = ["trace", "debug-control", "fault-injection"]
external = ["hart0-boot", "hart1-boot", "radio-client", "usb-host", "wifi-hardware"]

[[requirement]]
when = { all = ["observe"] }
instrumentation = ["trace"]

[[state]]
name = "radio-started"
when = { all = ["wifi"] }

[[state]]
name = "network-stopping"
requires = ["radio-started"]
when = { all = ["wifi"] }

[[context]]
name = "application"
hart = 0
level = 0
kind = "thread"

[[context]]
name = "app_wake"
hart = 0
level = 1
kind = "handler"

[[context]]
name = "radio_executor"
hart = 0
level = 2
kind = "interrupt-executor"
when = { all = ["wifi"] }

[[context]]
name = "radio"
hart = 0
level = 3
kind = "handler"
when = { all = ["wifi"] }

[[context]]
name = "hart1"
hart = 1
level = 0
kind = "thread"
when = { all = ["group"] }

[[context]]
name = "hart1_app"
hart = 1
level = 1
kind = "handler"
when = { all = ["group"] }

[[context]]
name = "profile"
hart = 0
level = 4
kind = "handler"
when = { all = ["observe"] }

[[context]]
name = "profile1"
hart = 1
level = 4
kind = "handler"
when = { all = ["observe", "group"] }

[[entry]]
name = "wake"
context = "app_wake"
line = 40
part = "FromCpu0Irq"
handler = "oer_chips_family_platform_executor::wake_handler::<Esp32s31, 0, FromCpu0Irq>"
sources = ["CPU_INTR_FROM_CPU_0"]
class = "hardware"

[[entry]]
name = "alarm"
context = "app_wake"
line = 41
part = "SystimerAlarm1"
handler = "oer_chips_family_platform_executor::alarm_interrupt::<SdkTasks, 1, SystimerAlarm1>"
sources = ["SYSTIMER_TARGET1"]
class = "hardware"

[[entry]]
name = "radio_alarm"
context = "radio"
line = 19
part = "oer_chips_esp32s31_hal::peripherals::system_timer::SystimerAlarm0"
handler = "oer_chips_family_platform_executor::alarm_interrupt::<wifi::RadioTasks, 0, oer_chips_esp32s31_hal::peripherals::system_timer::SystimerAlarm0>"
sources = ["SYSTIMER_TARGET0"]
class = "hardware"
when = { all = ["wifi"] }

[[entry]]
name = "phy"
context = "radio_executor"
line = 16
part = "oer_chips_esp32s31_hal::peripherals::timg0_alarm::Timg0AlarmInterrupt"
handler = "wifi::on_pilot"
sources = ["TIMERGRP0_T0"]
class = "exempt-executor-level"
reason = "SAR/PWDET steps between radio executor rounds"
when = { all = ["wifi"] }

[[entry]]
name = "radio"
context = "radio_executor"
line = 17
part = "oer_chips_esp32s31_hal::peripherals::software_interrupt::FromCpu2Irq"
handler = "oer_chips_family_platform_executor::Round<wifi::RadioTasks>"
sources = ["CPU_INTR_FROM_CPU_2"]
class = "executor"
when = { all = ["wifi"] }

[[entry]]
name = "wifi"
context = "radio"
line = 21
part = "wifi::WifiPart"
handler = "wifi::on_wifi"
sources = ["MODEM_WIFI_MAC", "MODEM_WIFI_PWR", "CPU_INTR_FROM_CPU_3"]
class = "hardware"
when = { all = ["wifi"] }

[[entry]]
name = "console_usb"
context = "app_wake"
line = 42
part = "oer_chips_esp32s31_hal::peripherals::usb_serial_jtag::ConsoleInterrupt"
handler = "console::on_usb"
sources = ["USB_SERIAL_JTAG"]
class = "hardware"
when = { all = ["console"] }

[[entry]]
name = "sampler"
context = "profile"
line = 22
part = "oer_chips_esp32s31_hal::peripherals::timg1_alarm::Timg1AlarmInterrupt"
handler = "observed::on_sampler"
sources = ["TIMERGRP1_T0"]
class = "hardware"
when = { all = ["observe"] }

[[entry]]
name = "sampler1"
context = "profile1"
line = 22
part = "oer_chips_esp32s31_hal::peripherals::timg1_alarm::Timg1Timer1Interrupt"
handler = "observed::on_sampler1"
sources = ["TIMERGRP1_T1"]
class = "hardware"
when = { all = ["observe", "group"] }

[[entry]]
name = "hart1_wake"
context = "hart1_app"
line = 40
part = "oer_chips_esp32s31_hal::peripherals::software_interrupt::FromCpu1Irq"
handler = "oer_chips_family_platform_executor::wake_handler::<Esp32s31, 1, oer_chips_esp32s31_hal::peripherals::software_interrupt::FromCpu1Irq>"
sources = ["CPU_INTR_FROM_CPU_1"]
class = "hardware"
when = { all = ["group"] }

[[entry]]
name = "hart1_alarm"
context = "hart1_app"
line = 41
part = "oer_chips_esp32s31_hal::peripherals::system_timer::SystimerAlarm2"
handler = "oer_chips_family_platform_executor::alarm_interrupt::<hart1::Hart1Tasks, 2, oer_chips_esp32s31_hal::peripherals::system_timer::SystimerAlarm2>"
sources = ["SYSTIMER_TARGET2"]
class = "hardware"
when = { all = ["group"] }

[[executor]]
name = "application"
context = "application"
entry = "wake"
swi = 0

[[executor]]
name = "radio"
context = "radio_executor"
entry = "radio"
swi = 2
when = { all = ["wifi"] }

[[executor]]
name = "hart1"
context = "hart1"
entry = "hart1_wake"
swi = 1
when = { all = ["group"] }

[[software]]
name = "wifi-doorbell"
entry = "wifi"
swi = 3
when = { all = ["wifi"] }

[[task-set]]
name = "SdkTasks"
context = "application"
observer = 0

[[task-set]]
name = "RadioTasks"
context = "radio_executor"
observer = 1
when = { all = ["wifi"] }

[[task-set]]
name = "Hart1Tasks"
context = "hart1"
observer = 2
when = { all = ["group"] }

[[task-root]]
name = "IP service, group and application on hart 0"
context = "application"
