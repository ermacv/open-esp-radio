# What the application entry's execution consists of today: each link with its
# place, its cfg, the checks that hold it and what nothing checks yet. This is
# an inventory, not a source: the code decides. `tools/test/layers/tests/
# execution_inventory.rs` fails when a link in the code has no row here.
#
# `check` names:
#   table-rules         `interrupt_table!` rules at compile time
#   router-hart         the router binds only its hart's entries
#   image-table         `tools/image/checks` reads the linked table
#   entry-names-swi     `executor_context`: the entry's source is the executor's
#   route-hart          `hart_binding::check`: route and token name one hart
#   raiser-direction    `Raising::check` on each signal's declared raisers
#   permit              affine owner, taken once
#   boot-deadline       a named boot wait under a typed failure
#   hart-metadata       `tools/image/build` resolves the image's harts
#   core-start-gate     the image gate on `[core-start]`
schema = 1

