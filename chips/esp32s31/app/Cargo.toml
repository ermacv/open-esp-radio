[package]
name = "oer-chips-esp32s31-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The ESP32-S31's application entry: its boot sequence, interrupt layout, executors and service tasks, and the peripherals, drivers and services an image takes, behind `oer`"

[features]
## The Wi-Fi station and its IP service.
wifi = []
## The USB Serial/JTAG console as the application's byte stream.
console = []
## A task group beside the application (`entry!(main, group = setup)`):
## on a chip with a second core it runs there on its own executor,
## otherwise on the application's executor.
group = []
## What the library observes of its own work.
observe = ["oer-chips-family-app/observe"]
## UDP sockets on the IP stack, each queueing up to 16 received datagrams.
udp = ["embassy-net/udp", "dep:xarxa"]
## The network core in place of the IP service, for an image to compare them.
network = [
    "dep:oer-protocols-network-core",
    "dep:oer-protocols-network-runtime",
    "dep:oer-protocols-network-wire",
    "dep:heapless",
]

[dependencies]
oer-chips-family-app = { path = "../../family/app" }

# The chip implementation runs on the chip target only.
[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
oer-portable-embassy-net = { path = "../../../portable/embassy/net" }
oer-portable-memory = { path = "../../../portable/memory" }
heapless = { version = "0.9.3", default-features = false, optional = true }
oer-protocols-network-core = { path = "../../../protocols/network/core", optional = true }
oer-protocols-network-port = { path = "../../../protocols/network/port" }
oer-protocols-network-runtime = { path = "../../../protocols/network/runtime", optional = true }
oer-protocols-network-wire = { path = "../../../protocols/network/wire", optional = true }
oer-portable-waker = { path = "../../../portable/waker" }
static_cell.workspace = true
oer-portable-embassy-time = { path = "../../../portable/embassy/time" }
oer-portable-time = { path = "../../../portable/time" }
oer-chips-family-boot = { path = "../../family/boot" }
oer-chips-esp32s31-platform-board = { path = "../platform/board" }
oer-chips-esp32s31-platform-runtime = { path = "../platform/runtime", features = ["wifi-fault", "radio-fault"] }
oer-chips-esp32s31-hal = { path = "../hal" }
oer-chips-esp32s31-radio-phy = { path = "../radio/phy" }
oer-chips-family-platform-executor = { path = "../../family/platform/executor", features = ["installations"] }
oer-chips-family-platform-interrupt-table = { path = "../../family/platform/interrupt-table" }
oer-chips-family-platform-runtime = { path = "../../family/platform/runtime" }
oer-protocols-ieee80211-core-security-cipher = { path = "../../../protocols/ieee80211/core/security/cipher" }
oer-protocols-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime" }
oer-chips-esp32s31-radio-ieee80211-station = { path = "../radio/ieee80211/station" }
oer-portable-riscv = { path = "../../../portable/riscv" }
oer-portable-trace = { path = "../../../portable/trace" }
embassy-futures = "0.1.2"
embassy-time = { workspace = true }
# The stack the IP service pins (`oer-portable-embassy-net`), with TCP sockets.
embassy-net = { git = "https://github.com/ermacv/embassy.git", rev = "5638999eb53ef5a12417a2908ee7716295285e19", default-features = false, features = ["tcp"] }
# The stack's socket receive queue at its largest, with `udp`: some 2.7 ms
# of 1400-byte datagrams at 65 Mbit/s (the revision the stack pins).
xarxa = { git = "https://github.com/ermacv/xarxa.git", rev = "fbebde557a08278386b4e4043e2781ff4b863046", default-features = false, features = ["udp-rx-queue-count-16"], optional = true }

[build-dependencies]
oer-chips-family-facts = { path = "../../family/facts" }

[lints]
workspace = true
