[package]
name = "oer-esp32s31-phy-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HIL phy vocabulary shared by images and the host"

[features]
default = []
registry = ["oer-hil-protocol/registry"]

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics" }
crc = "3.3.0"
oer-hil-protocol = { path = "../../../protocols/hil/protocol", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

[dev-dependencies]
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }

[lints]
workspace = true
