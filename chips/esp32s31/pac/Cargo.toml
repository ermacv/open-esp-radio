[package]
name = "oer-esp32s31-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ESP32-S31 PAC: the exact hardware model generated from the chip's register model"

[dependencies]
oer-espressif-analog = { path = "../../espressif/analog" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics"] }
oer-memory = { path = "../../../portable/memory" }
oer-mmio = { path = "../../../portable/mmio" }


[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
