[package]
name = "oer-esp32s31-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Closed typed ESP32-S31 radio peripheral access crate"

[features]
# Synthetic Wi-Fi observations and DMA bindings for explicit test builds.
test-support = ["oer-espressif-ieee802154-mac-values/test-support"]

[dependencies]
oer-espressif-analog = { path = "../../espressif/analog" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics"] }
oer-mmio = { path = "../../../portable/mmio" }
oer-espressif-efuse = { path = "../../espressif/efuse" }
oer-espressif-ieee802154-mac-values = { path = "../../espressif/ieee802154-mac-values" }
oer-memory = { path = "../../../portable/memory" }
oer-espressif-ieee80211-pac = { path = "../../espressif/ieee80211-pac" }
oer-esp32s31-pac-raw = { path = "../pac-raw", features = ["critical-section"] }


[target.'cfg(target_os = "linux")'.dev-dependencies]
# Anonymous host memory lets the actual generated fixed-address MMIO operations run in tests.
libc = "=0.2.189"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
