# The single pin of every ESP32-S31 vendor artifact this repository compares
# against.
#
# Each artifact names its upstream source and SHA-256. A fetch places every
# fetchable artifact at `target/vendor/<source>/<revision>/<path>` and
# verifies it; every comparison authenticates its inputs against this file.
# Changing a pin means changing this file, and production follows the
# pinned behaviour. Historical hashes in reviewed register evidence and
# reference notes record the artifact a fact was observed in; they are not
# pins.
schema = 1

[[source]]
id = "esp-phy-lib"
kind = "git"
repository = "https://github.com/espressif/esp-phy-lib"
revision = "20f1db053a0e6cb9f1c09d255c43bf42483041d0"

