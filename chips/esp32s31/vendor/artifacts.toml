# ESP-IDF sources of the IEEE 802.15.4 host comparison: the driver's
# translation units and every header they include. Fetched file by file, so
# `target/vendor/esp-idf/<revision>/` mirrors the checkout's layout.
[[source]]
id = "esp-idf"
kind = "git"
repository = "https://github.com/espressif/esp-idf"
revision = "4d59230ddff16327812782151ef0afef202dc6d7"

# ESP-IDF's `esp_phy` component at the same revision, read for the vendor PHY
# path (enable, tracking and modem retention) and compiled by no host
# comparison; kept apart from the IEEE 802.15.4 sources. Its prebuilt library
# submodule is `esp-phy-lib`.
[[source]]
id = "esp-idf-phy"
kind = "git"
repository = "https://github.com/espressif/esp-idf"
revision = "4d59230ddff16327812782151ef0afef202dc6d7"

# The vendor link environment: the vendor firmware project
# phy-tracking-reference, built against the pins above; never fetched. The
# recipe is the pin, so its outputs carry no SHA-256, and `path` is where
# each output lies below the repository root.
[[source]]
id = "phy-tracking-reference"
kind = "firmware"
image = "phy-tracking-reference"


# The vendor SVD the register import reads for block geometry: the
# ermacv/esp-pacs fork's ESP32-S31 base SVD (Apache-2.0), before the
# fork's svdtools patches.
[[source]]
id = "esp-pacs"
kind = "git"
repository = "https://github.com/ermacv/esp-pacs"
revision = "a1f6cf68e199f4ee469dbc7cff9de5539e81d7da"

