[package]
name = "oer-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
# The BLE driver enables its controller-memory engine; Wi-Fi images keep
# their code-generation identity.
bluetooth-engine = []
## Hart 1 runs code: `Cores::start` exists. No image enables it, and
## the crate refuses it, as the staged runtime does: its critical-section
## masks only the current hart, so a second running hart needs a cross-hart
## lock without spinning first.
cpu1-runs = []
# Synthetic Wi-Fi observations and DMA bindings for explicit test builds.
test-support = ["oer-espressif-ieee802154-engine/test-support"]

[dependencies]
oer-esp32s31-knowledge = { path = "../knowledge" }
oer-espressif-efuse = { path = "../../espressif/efuse" }
oer-espressif-watchdog = { path = "../../espressif/watchdog" }
oer-espressif-boot = { path = "../../espressif/boot" }
oer-mmio = { path = "../../../portable/mmio" }
oer-interrupt-table = { path = "../../../portable/interrupt-table" }
oer-riscv = { path = "../../../portable/riscv" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
pin-project = "1.1.13"
oer-espressif-analog = { path = "../../espressif/analog" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-memory = { path = "../../../portable/memory" }
oer-time = { path = "../../../portable/time" }
oer-esp32s31-pac = { path = "../pac" }
oer-espressif-coex = { path = "../../espressif/coex" }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154-engine" }
oer-espressif-ieee802154-mac-values = { path = "../../espressif/ieee802154-mac-values" }
oer-espressif-modem-clock = { path = "../../espressif/modem-clock" }
oer-radio-coex = { path = "../../../protocols/radio/coex" }
oer-espressif-usb-serial-jtag = { path = "../../espressif/usb-serial-jtag" }

[build-dependencies]
oer-espressif-facts = { path = "../../espressif/facts" }

[dev-dependencies]
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154-engine", features = ["test-support"] }
oer-espressif-ieee802154-mac-values = { path = "../../espressif/ieee802154-mac-values", features = ["test-support"] }
critical-section = { version = "1.2.0", features = ["std"] }
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }
oer-mmio = { path = "../../../portable/mmio" }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
