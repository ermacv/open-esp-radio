[package]
name = "oer-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
# Synthetic Wi-Fi observations and DMA bindings for explicit test builds.
test-support = ["oer-esp32s31-pac/test-support", "oer-espressif-ieee802154-engine/test-support"]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
pin-project = "1.1.13"
vcell = "0.1.3"
oer-espressif-analog = { path = "../../espressif/analog" }
oer-memory = { path = "../../../portable/memory" }
oer-time = { path = "../../../portable/time" }
oer-esp32s31-pac = { path = "../pac" }
oer-espressif-coex = { path = "../../espressif/coex" }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154-engine" }
oer-espressif-modem-clock = { path = "../../espressif/modem-clock" }
oer-radio-coex = { path = "../../../protocols/radio/coex" }

[dev-dependencies]
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154-engine", features = ["test-support"] }
critical-section = { version = "1.2.0", features = ["std"] }
oer-esp32s31-pac = { path = "../pac", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
