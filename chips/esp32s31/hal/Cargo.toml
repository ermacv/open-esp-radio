[package]
name = "oer-chips-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
# The BLE driver enables its controller-memory engine; Wi-Fi images keep
# their code-generation identity.
bluetooth-engine = []
# Synthetic Wi-Fi observations and DMA bindings for explicit test builds.
test-support = ["oer-chips-family-radio-power/test-support"]

[dependencies]
oer-chips-family-radio-bluetooth-ports = { path = "../../family/radio/bluetooth/ports" }
oer-chips-family-radio-phy = { path = "../../family/radio/phy" }
oer-chips-family-radio-power = { path = "../../family/radio/power" }
oer-chips-esp32s31-knowledge = { path = "../knowledge" }
oer-chips-family-drivers-efuse = { path = "../../family/drivers/efuse" }
oer-chips-family-drivers-watchdog = { path = "../../family/drivers/watchdog" }
oer-chips-family-boot = { path = "../../family/boot" }
oer-chips-family-drivers-system-timer = { path = "../../family/drivers/system-timer" }
oer-chips-family-drivers-pmu = { path = "../../family/drivers/pmu" }
oer-portable-mmio = { path = "../../../portable/mmio" }
oer-chips-family-platform-interrupt-table = { path = "../../family/platform/interrupt-table" }
oer-portable-riscv = { path = "../../../portable/riscv" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
pin-project = "1.1.13"
oer-chips-family-drivers-regi2c = { path = "../../family/drivers/regi2c" }
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
oer-portable-memory = { path = "../../../portable/memory" }
oer-portable-time = { path = "../../../portable/time" }
oer-chips-esp32s31-pac = { path = "../pac" }
oer-chips-family-radio-coex = { path = "../../family/radio/coex" }
oer-chips-family-radio-ieee802154-values = { path = "../../family/radio/ieee802154/values" }
oer-chips-family-radio-modem-clock = { path = "../../family/radio/modem-clock" }
oer-protocols-radio-coex = { path = "../../../protocols/radio/coex" }
oer-chips-family-drivers-usb-serial-jtag = { path = "../../family/drivers/usb-serial-jtag" }
# The HAL implements the family platform contracts and selects its chip.
oer-chips-family-platform-port = { path = "../../family/platform/port", features = ["esp32s31"] }

[build-dependencies]
oer-chips-family-facts = { path = "../../family/facts" }

[dev-dependencies]
oer-chips-family-radio-power = { path = "../../family/radio/power", features = ["test-support"] }
oer-portable-time-virtual = { path = "../../../portable/time-virtual" }
oer-protocols-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }
critical-section = { version = "1.2.0", features = ["std"] }
oer-tools-test-ui-cases = { path = "../../../tools/test/ui-cases" }
oer-portable-mmio = { path = "../../../portable/mmio" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
