[package]
name = "oer-esp32s31-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Ownership and async HAL boundaries for the ESP32-S31 radio"

[features]
# The BLE driver enables its controller-memory engine; Wi-Fi images keep
# their code-generation identity.
bluetooth-engine = []
# Synthetic Wi-Fi observations and DMA bindings for explicit test builds.
test-support = ["oer-espressif-radio/test-support"]

[dependencies]
oer-espressif-bluetooth-engine = { path = "../../family/bluetooth-engine" }
oer-espressif-phy = { path = "../../family/phy" }
oer-espressif-radio = { path = "../../family/radio" }
oer-esp32s31-knowledge = { path = "../knowledge" }
oer-espressif-efuse = { path = "../../family/efuse" }
oer-espressif-watchdog = { path = "../../family/watchdog" }
oer-espressif-boot = { path = "../../family/boot" }
oer-mmio = { path = "../../../portable/mmio" }
oer-espressif-interrupt-table = { path = "../../family/interrupt-table" }
oer-riscv = { path = "../../../portable/riscv" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
pin-project = "1.1.13"
oer-espressif-analog = { path = "../../family/analog" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-memory = { path = "../../../portable/memory" }
oer-time = { path = "../../../portable/time" }
oer-esp32s31-pac = { path = "../pac" }
oer-espressif-coex = { path = "../../family/coex" }
oer-espressif-ieee802154-mac-values = { path = "../../family/ieee802154-mac-values" }
oer-espressif-modem-clock = { path = "../../family/modem-clock" }
oer-radio-coex = { path = "../../../protocols/radio/coex" }
oer-espressif-usb-serial-jtag = { path = "../../family/usb-serial-jtag" }
# The HAL implements the family platform contracts and selects its chip.
oer-espressif-platform-port = { path = "../../family/platform-port", features = ["esp32s31"] }

[build-dependencies]
oer-espressif-facts = { path = "../../family/facts" }

[dev-dependencies]
oer-espressif-radio = { path = "../../family/radio", features = ["test-support"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }
critical-section = { version = "1.2.0", features = ["std"] }
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }
oer-mmio = { path = "../../../portable/mmio" }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
