[package]
name = "oer-chips-esp32s31-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Value-owned S31 Typical AES key unwrap over HAL atoms"

[dependencies]
oer-chips-esp32s31-hal = { path = "../hal" }
oer-portable-crypto = { path = "../../../portable/crypto" }
oer-portable-time = { path = "../../../portable/time" }
zeroize = { version = "1.9.0", default-features = false }

[dev-dependencies]
oer-portable-crypto = { path = "../../../portable/crypto", features = ["test-support"] }
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }

[lints]
workspace = true
