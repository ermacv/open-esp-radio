[package]
name = "oer-esp32s31-bluetooth-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 Bluetooth hardware engine: controller HAL and time, BLE PHY, interrupts and scheduler primitives"

[dependencies]
oer-bluetooth-hci = { path = "../../../../protocols/bluetooth/hci" }
oer-bluetooth-le-radio = { path = "../../../../protocols/bluetooth/le/radio" }
oer-bluetooth-le-port = { path = "../../../../protocols/bluetooth/le/port" }
oer-bluetooth-le-ll = { path = "../../../../protocols/bluetooth/le/ll" }
oer-radio-port = { path = "../../../../protocols/radio/port" }
oer-memory = { path = "../../../../portable/memory" }
oer-sync = { path = "../../../../portable/sync" }
oer-esp32s31-radio-client = { path = "../../radio/client", features = ["bluetooth"] }
embassy-futures = "0.1.2"
oer-esp32s31-hal = { path = "../../hal", features = ["bluetooth-engine"] }
oer-esp32s31-phy = { path = "../../phy" }
oer-time = { path = "../../../../portable/time" }
oer-espressif-interrupt-table = { path = "../../../espressif/interrupt-table" }

[dev-dependencies]
oer-time-virtual = { path = "../../../../portable/time-virtual" }
atomic-waker = "1.1.2"
bytemuck = { version = "1.25.2", default-features = false }
oer-test-ui-cases = { path = "../../../../tools/test/ui-cases" }
oer-esp32s31-hal = { path = "../../hal", features = ["test-support"] }

# Host tests need the std implementation; chip doctests build without it.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
tempfile = "=3.27.0"
oer-espressif-interrupt-table = { path = "../../../espressif/interrupt-table", features = ["host-signal"] }
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

