[package]
name = "oer-esp32s31-instrumentation-hil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HIL health vocabulary shared by images and the host"

[features]
default = []
registry = ["oer-hil-protocol/registry"]

[dependencies]
oer-hil-protocol = { path = "../../../protocols/hil/protocol", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
oer-esp32s31-instrumentation = { path = "../instrumentation" }
oer-memory = { path = "../../../portable/memory" }

[lints]
workspace = true
