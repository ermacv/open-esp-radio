[package]
name = "oer-chips-esp32s31-ieee80211-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Role-neutral ESP32-S31 Wi-Fi device composition"

[dependencies]
oer-portable-wire = { path = "../../../../portable/wire" }
oer-portable-sync = { path = "../../../../portable/sync" }
oer-portable-events = { path = "../../../../portable/events" }
atomic-waker = "1.1.2"
heapless = "0.9.2"
pin-project = "1.1.13"
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.0", default-features = false }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
oer-chips-family-coex = { path = "../../../family/coex" }
oer-chips-esp32s31-hal = { path = "../../hal" }
oer-chips-esp32s31-phy = { path = "../../phy" }
oer-chips-esp32s31-radio-client = { path = "../../radio/client" }
oer-protocols-ieee80211-contracts-port = { path = "../../../../protocols/ieee80211/contracts/port" }
oer-portable-memory = { path = "../../../../portable/memory" }
oer-protocols-radio-port = { path = "../../../../protocols/radio/port" }
oer-protocols-ieee80211-wire = { path = "../../../../protocols/ieee80211/wire" }
oer-protocols-ieee80211-contracts-security = { path = "../../../../protocols/ieee80211/contracts/security" }
oer-protocols-radio-regulatory = { path = "../../../../protocols/radio/regulatory" }
oer-portable-time = { path = "../../../../portable/time" }
oer-chips-family-interrupt-table = { path = "../../../family/interrupt-table" }

[target.'cfg(oer_debug_control)'.dependencies]
oer-chips-family-staged-runtime = { path = "../../../family/staged-runtime" }
oer-portable-trace = { path = "../../../../portable/trace" }

[features]
default = []
test-support = ["oer-chips-esp32s31-hal/test-support", "oer-chips-family-interrupt-table/host-signal"]

[dev-dependencies]
oer-portable-embassy-net = { path = "../../../../portable/embassy/net" }
oer-chips-esp32s31-hal = { path = "../../hal", features = ["test-support"] }
oer-protocols-ieee80211-wire = { path = "../../../../protocols/ieee80211/wire", features = ["test-support"] }
oer-chips-family-ieee80211-policy = { path = "../../../family/ieee80211-policy" }
oer-protocols-ieee80211-core-upper-mac = { path = "../../../../protocols/ieee80211/core/upper-mac" }
oer-protocols-ieee80211-testing-conformance = { path = "../../../../protocols/ieee80211/testing/conformance" }

oer-chips-family-interrupt-table = { path = "../../../family/interrupt-table", features = ["host-signal"] }
oer-portable-time-virtual = { path = "../../../../portable/time-virtual" }
oer-tools-test-ui-cases = { path = "../../../../tools/test/ui-cases" }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[[test]]
name = "mac"
required-features = ["test-support"]

[package.metadata.open-radio]
test-feature-sets = ["test-support"]
