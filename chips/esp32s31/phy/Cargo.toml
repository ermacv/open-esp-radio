[package]
name = "oer-esp32s31-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Allocation-free Rust ESP32-S31 PHY state machines"

[features]
radio-health = []

[dependencies]
oer-espressif-phy = { path = "../../espressif/phy" }
oer-espressif-analog = { path = "../../espressif/analog" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-time = { path = "../../../portable/time" }
oer-cooperate = { path = "../../../portable/cooperate" }
oer-memory = { path = "../../../portable/memory" }
oer-espressif-interrupt-table = { path = "../../espressif/interrupt-table" }
pin-project-lite = "0.2.17"
oer-esp32s31-hal = { path = "../hal" }

[dev-dependencies]
oer-espressif-interrupt-table = { path = "../../espressif/interrupt-table", features = ["host-signal"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-esp32s31-hal = { path = "../hal", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
