[package]
name = "oer-esp32s31-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free Rust ESP32-S31 PHY state machines"

[features]
default = []
# Retain value-only RF measurements in registration and role start reports.
registration-diagnostics = []
# Let a diagnostic image set the vendor's temperature-tracking debug policy,
# which forces the RFPLL and calibration tracking branches.
tracking-diagnostics = []

[dependencies]
oer-espressif-analog = { path = "../../../portable/espressif/analog" }
oer-base-time = { path = "../../../portable/base/time" }
oer-esp32s31-hal = { path = "../hal" }

[dev-dependencies]
oer-base-time-virtual = { path = "../../../portable/base/time-virtual" }
pin-project-lite = "0.2.17"
oer-esp32s31-hal = { path = "../hal", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
