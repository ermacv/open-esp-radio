# Words that a write transaction of the ESP32-S31 radio PAC and pinned esp-hal
# both store to, with how the two writers are kept from racing. `cargo registers
# check shared-words` finds the shared words from policy/api.toml,
# published/radio.svd, the pinned esp-hal sources with the clock and reset
# writers of its esp-metadata-generated file (peripheral aliases resolved)
# and the platform PAC sources, and
# fails on a shared word without an entry or an entry for a word no longer
# shared. Reviewed against esp-hal 4fd4ba9b (first review: 9fe1c752, by the
# PHY owner).
#
# coordination:
#   shared-lock           both writers store only under the named lock
#   disjoint-lifecycle    esp-hal stores only where no radio owner exists
#   unreached-esp-hal-path  esp-hal's storing function has no caller here
#   whole-word-stores     both sides store whole words, no read-modify-write
#   radio-reads-only      the radio view is read-only in the publication and no
#                         API transaction stores to it (checked); esp-hal alone writes
schema = 1

[[word]]
address = 0x20109c04
radio = "MODEM_SYSCON_RADIO.CLK_CONF"
esp_hal = "MODEM_SYSCON.clk_conf in regi2c_enable_block (soc/esp32s31/regi2c.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal sets clk_i2c_mst_sel_160m on each of its own regi2c reads and writes. On the ESP32-S31 at 4fd4ba9b those are rtc::init's I2C_DIG_REG writes inside esp_hal::init, and rtc_cntl::brownout::configure, which the bootstrap calls once after esp_hal::init and which borrows the I2C_ANA_MST singleton (5d3a63e5b); the clock tree's PLL enables make no regi2c access. The radio's handoff consumes I2C_ANA_MST, so brownout::configure cannot run while a radio owner exists, and the radio partitions exist only after esp_hal::init."

[[word]]
address = 0x20109c0c
radio = "MODEM_SYSCON_RADIO.CLK_CONF_POWER_ST"
esp_hal = "MODEM_SYSCON.clk_conf_power_st in modem_clock_domain_power_state_icg_map_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only by modem_clock_domain_power_state_icg_map_init at the end of rtc::init inside esp_hal::init (esp-hal 4fd4ba9b), which ORs in the modem clock-domain ICG maps before any radio owner exists."


[[word]]
