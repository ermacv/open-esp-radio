# Words that a write transaction of the ESP32-S31 radio PAC and pinned esp-hal
# both store to, with how the two writers are kept from racing. `cargo registers
# check shared-words` finds the shared words from policy/api.toml,
# published/radio.svd, the pinned esp-hal sources with the clock and reset
# writers of its esp-metadata-generated file (peripheral aliases resolved)
# and the platform PAC sources, and
# fails on a shared word without an entry or an entry for a word no longer
# shared. Reviewed against esp-hal 4fd4ba9b (first review: 9fe1c752, by the
# PHY owner).
#
# coordination:
#   shared-lock           both writers store only under the named lock
#   disjoint-lifecycle    esp-hal stores only where no radio owner exists
#   unreached-esp-hal-path  esp-hal's storing function has no caller here
#   whole-word-stores     both sides store whole words, no read-modify-write
schema = 1

[[word]]
address = 0x20109c04
radio = "MODEM_SYSCON_RADIO.CLK_CONF"
esp_hal = "MODEM_SYSCON.clk_conf in regi2c_enable_block (soc/esp32s31/regi2c.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal sets clk_i2c_mst_sel_160m on each of its own regi2c reads and writes. On the ESP32-S31 at 4fd4ba9b those are rtc::init's I2C_DIG_REG writes inside esp_hal::init, and rtc_cntl::brownout::configure, which the bootstrap calls once after esp_hal::init and which borrows the I2C_ANA_MST singleton (5d3a63e5b); the clock tree's PLL enables make no regi2c access. The radio's handoff consumes I2C_ANA_MST, so brownout::configure cannot run while a radio owner exists, and the radio partitions exist only after esp_hal::init."

[[word]]
address = 0x20109c0c
radio = "MODEM_SYSCON_RADIO.CLK_CONF_POWER_ST"
esp_hal = "MODEM_SYSCON.clk_conf_power_st in modem_clock_domain_power_state_icg_map_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only by modem_clock_domain_power_state_icg_map_init at the end of rtc::init inside esp_hal::init (esp-hal 4fd4ba9b), which ORs in the modem clock-domain ICG maps before any radio owner exists."

[[word]]
address = 0x2010f004
radio = "MODEM_LPCON_SHARED_CLOCK.LP_TIMER_CONF"
esp_hal = "MODEM_LPCON.lp_timer_conf in configure_ble_lp_clk_impl (soc/esp32s31/clocks.rs)"
coordination = "unreached-esp-hal-path"
reason = "The fork sets ble_lp_clk: None in every ESP32-S31 CPU clock preset (esp-hal 4fd4ba9b soc/esp32s31/clocks.rs, UPSTREAM.md 'Changed in fork: BLE_LP_CLK'), so the BLE_LP_CLK node is never configured, configure_ble_lp_clk_impl is not reached and the radio's select_bluetooth_low_power_clock is the only writer."

[[word]]
address = 0x2010f00c
radio = "MODEM_LPCON_SHARED_CLOCK.WIFI_LP_CLK_CONF"
esp_hal = "MODEM_LPCON.wifi_lp_clk_conf in configure_wifi_lp_clock (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "clock::init calls configure_wifi_lp_clock on the ESP32-S31 (cfg(esp32s31)) inside esp_hal::init, after ClockConfig::configure: it selects RC_SLOW and divider 0, before any radio owner exists. Nothing else in esp-hal 4fd4ba9b writes the word, so the radio's selection is its only runtime writer. (The 9fe1c752 review called the path unreached; the same call existed there.)"

[[word]]
address = 0x2010f014
radio = "MODEM_LPCON_SHARED_CLOCK.MODEM_32K_CLK_CONF"
esp_hal = "MODEM_LPCON.modem_32k_clk_conf in configure_wifi_lp_clock and configure_ble_lp_clk_impl"
coordination = "unreached-esp-hal-path"
reason = "esp-hal 4fd4ba9b writes it only for an XTAL32K source: configure_wifi_lp_clock (called by esp_hal::init) only under use_xtal32k with lp_slow_clk Xtal32k, and configure_ble_lp_clk_impl not at all, since the BLE_LP_CLK node is not configured. ESP_HAL_CONFIG_USE_XTAL32K keeps its default (off) in this repository."

[[word]]
address = 0x2010f020
radio = "MODEM_LPCON_SHARED_CLOCK.CLK_CONF_POWER_ST"
esp_hal = "MODEM_LPCON.clk_conf_power_st in modem_clock_domain_power_state_icg_map_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only by modem_clock_domain_power_state_icg_map_init at the end of rtc::init inside esp_hal::init (esp-hal 4fd4ba9b), which ORs in the modem clock-domain ICG maps before any radio owner exists."

[[word]]
address = 0x2070401c
radio = "PMU_RADIO.HP_ACTIVE_HP_CK_POWER"
esp_hal = "PMU.hp_active_hp_ck_power in enable_cpll_clk_impl and the MPLL enable (soc/esp32s31/clocks.rs)"
coordination = "disjoint-lifecycle"
reason = "The CPLL writes happen only in the CPU clock configuration of esp_hal::init, and not at all when the CPU already runs from CPLL (ac0aef951). The MPLL writes happen only when the MPLL reference count crosses zero: once in the bootstrap (Psram::new) and once in each stage-two esp_hal instance, when Psram::from_existing_mapping takes its never-released reference (adopt_live_mpll, e6364e164) during PSRAM adoption. Images adopt PSRAM right after esp_hal::init and before they build the radio root (platform README order; no type enforces it yet), so the radio's own PlatformClock::Mpll reference never crosses zero."

[[word]]
address = 0x207040f8
radio = "PMU_RADIO.IMM_SLEEP_SYSCLK"
esp_hal = "PMU.imm_sleep_sysclk in update_hp_system_config (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only through HpSystemInit::init_default in rtc::init (esp_hal::init, esp-hal 4fd4ba9b); the ESP32-S31 sleep driver (rtc_cntl/sleep/esp32s31.rs) does not touch it. Both sides store whole trigger words."

[[word]]
address = 0x20704104
radio = "PMU_RADIO.IMM_MODEM_ICG"
esp_hal = "PMU.imm_modem_icg in update_hp_system_config (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "Written only through HpSystemInit::init_default in rtc::init (esp_hal::init, esp-hal 4fd4ba9b); the ESP32-S31 sleep driver (rtc_cntl/sleep/esp32s31.rs) does not touch it. Both sides store whole trigger words."

[[word]]
address = 0x20704208
radio = "PMU_RADIO.ANA_PERI_PWR_CTRL"
esp_hal = "PMU.ana_peri_pwr_ctrl in pmu_init (rtc_cntl/rtc/esp32s31.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal 2b665dd writes rstb/xpd_perif_i2c only in rtc::init before take_radio. After handoff the HAL radio owner alone controls TSENS/SAR-I2C: last temperature release after RF close clears XPD; first acquire asserts RSTB low, settles 1 us, enables XPD and releases RSTB before TSENS clock/reset/enable. General PHY open-I2C initialization remains under the same owner. No esp-hal runtime consumer of PERIF_I2C or indirect regi2c is reachable in our S31 images after take_radio; bootstrap/PSRAM setup precedes handoff and the retained PSRAM MPLL reference cannot cross zero."

[[word]]
address = 0x2071003c
radio = "LP_PERICLKRST_RNG.RNG_CTRL (typed block)"
esp_hal = "LP_PERI.rng_ctrl in rng_ll_enable (soc/esp32s31/trng.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal 1f646c5 enables the TRNG clock and pulses its reset in rng_ll_enable, called from pre_init inside esp_hal::init and from TrngSource::new, which takes the RNG singleton. The entropy handoff consumes RNG and LP_PERI after esp_hal::init, so TrngSource::new cannot run while the entropy owner exists; the owner only reads the word."

[[word]]
address = 0x20814000
radio = "TRNG.CONF (typed block)"
esp_hal = "RNG.conf in rng_ll_enable (soc/esp32s31/trng.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal 1f646c5 configures the noise source, health-test cutoffs and output in rng_ll_enable, called from pre_init inside esp_hal::init and from TrngSource::new, which takes the RNG singleton. The entropy handoff consumes RNG after esp_hal::init, so TrngSource::new cannot run while the entropy owner exists; the owner only reads the word."

[[word]]
address = 0x20814004
radio = "TRNG.DEBUG_CONF (typed block)"
esp_hal = "RNG.debug_conf in rng_ll_enable (soc/esp32s31/trng.rs)"
coordination = "disjoint-lifecycle"
reason = "esp-hal 1f646c5 sets the startup-test limit and starts the startup test in rng_ll_enable, called from pre_init inside esp_hal::init and from TrngSource::new, which takes the RNG singleton. The entropy handoff consumes RNG after esp_hal::init, so TrngSource::new cannot run while the entropy owner exists; the owner only reads the word."
