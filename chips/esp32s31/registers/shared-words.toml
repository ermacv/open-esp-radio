[[word]]
address = 0x20585210
radio = "IEEE802154_INTERRUPT_ROUTE.CORE0_ROUTE"
esp_hal = "INTERRUPT_CORE0.core_0_intr_map[132] in map_raw and reinitialize_vectoring_after_handoff (interrupt/mod.rs)"
coordination = "radio-reads-only"
reason = "The radio's IEEE802154_INTERRUPT_ROUTE view is read-only in the publication, so its typed block has no writer, and no API transaction stores to the word; the radio PAC only reads it to classify the route. esp-hal's interrupt table is the only writer: setup_interrupts and reinitialize_vectoring_after_handoff (called from the staged runtime's Handoff::adopt) map every source, MODEM_ZB_MAC included, to disabled, and the table's InterruptRoutes owner (oer-espressif-esp-hal-irq) routes MODEM_ZB_MAC when an image's table binds it (esp-hal 1f646c5 interrupt/mod.rs)."

