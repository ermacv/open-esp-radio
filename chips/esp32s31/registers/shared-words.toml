radio = "SYSTIMER_COUNTER.UNIT0_OP"
esp_hal = "SYSTIMER.unit_op in Unit::read_count (timer/systimer.rs)"
coordination = "whole-word-stores"
reason = "esp-hal's Instant::now (its delays and drivers) strobes UPDATE with a whole-word write (esp-hal 1f646c5); the shared counter block strobes UPDATE alone, also a whole-word write. Neither reads back, and each reader repeats LO, HI, LO until the two LO reads agree, so a strobe between them only relatches the newer count."

