coordination = "unreached-esp-hal-path"
reason = "force_sar_power and the SarPowerGuard that calls it are compiled only for any(esp32c5, esp32c6, esp32c61, esp32h2) (esp-hal 1f646c5 analog/adc/dig_ctrl.rs); the ESP32-S31 takes the empty branch, so esp-hal has no writer of the word on this chip."
