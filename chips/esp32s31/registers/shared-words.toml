radio = "SYSTIMER.CONF"
esp_hal = "SYSTIMER.conf in Unit::configure, Alarm and the ETM enable (timer/systimer.rs)"
coordination = "unreached-esp-hal-path"
reason = "Every esp-hal writer of CONF is a method of SystemTimer, its Unit or Alarm, which only SystemTimer::new(SYSTIMER) makes (esp-hal 1f646c5); the time driver's handoff consumes the SYSTIMER singleton, so none is reachable. The comparator owner is the only runtime writer."

[[word]]
