description = "The vendor HE SU formatter copies bits 26:25 and 28 into the second HE SU vector word (HE_SU_SIGNAL_A2_LENGTH.BITS_5_7_OPAQUE) and clears that word's bit 8 when bits 27:25 are 0b100; every ordinary vendor TX path writes zero here."

