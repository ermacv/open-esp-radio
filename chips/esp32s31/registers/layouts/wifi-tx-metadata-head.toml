description = "Set by the HE S-MPDU preparation before DMA publication: selects the single-MPDU container geometry, with the delimiter accounted for by the hardware insertion."

[[layout.bytes.fields]]
name = "BITS_25_28_OPAQUE"
opaque = true
bits = "28:25"
