[[layout.bytes]]
fields = []
name = "BYTE_000C_OPAQUE"
opaque = true
offset = 0x0c
size = 4
access = "owned"
description = "Named ISO TX helpers use the low 15 bits at +0x0c as a result with unproduced sentinel 0x7fff; they decode configured-length error at bit 1 and maximum-length error at bit 2 only after sentinel replacement. ISO reset clears +0x08..+0x0b and arms the sentinel while preserving bit 15. These identities are direct for the matched ISO format; transfer to ordinary TX is inference. The open ordinary TX owner clears/reuses this storage and does not decode these results; zero alone does not prove an armed ISO result was produced. SOURCE: VENDOR_BLE_ISO_TX_RESULT."

