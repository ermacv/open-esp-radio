schema = 1

[layout]
name = "WIFI_TX_DMA_DESCRIPTOR"
description = """
The 12-byte node the Wi-Fi TX DMA engine follows: the control word, the
buffer address and the link to the next node of a chain."""
size = 12
align = 4
same-geometry-as = "WIFI_RX_DMA_DESCRIPTOR"

[layout.review]
sources = ["PROMOTED_LMAC_TX", "PROMOTED_TX_AMPDU", "HIL_OPEN_STA_RATE_CONTROL_2026_07_30"]
provenance = "derived"
accuracy = "exact"
completeness = "partial"
naming = "descriptive"

[[layout.words]]
name = "CONTROL"
offset = 0x00
access = "shared"

[[layout.words.fields]]
name = "TX_OWNED"
bits = "31"
writer = "cpu"
description = "Set by software to hand the descriptor to the MAC; the vendor's `owner` (SOURCE: BLOB_LIBPP_TX_METADATA_ENTRY_20261117). Whether the TX engine checks it as the RX walker checks OWNER is not verified."

[[layout.words.fields]]
name = "TX_LAST"
bits = "30"
writer = "cpu"
description = "Set on the last descriptor of a chain and cleared on the others, as this driver builds TX chains; the vendor's `eof` (SOURCE: BLOB_LIBPP_TX_METADATA_ENTRY_20261117); not the RX RX_DONE."

[[layout.words.fields]]
name = "SOSF"
bits = "29"
writer = "cpu"
description = "The vendor's `sosf`, as its receive descriptor's bit 29 is named; the vendor's prepend sets it on a frame's first descriptor on one path. This driver writes zero. Its effect is not established."

[[layout.words.fields]]
name = "LENGTH"
bits = "27:14"
writer = "cpu"
description = "The populated source bytes of the buffer."

[[layout.words.fields]]
name = "SIZE"
bits = "13:0"
writer = "cpu"
description = "The buffer's capacity in bytes."

[[layout.words]]
name = "BUFFER"
offset = 0x04
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The buffer's address."
placement = ["dma-window"]

[[layout.words]]
name = "NEXT"
offset = 0x08
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The next descriptor's address, or zero at the end."
points-to = "WIFI_TX_DMA_DESCRIPTOR"

[[review]]
entity = "WIFI_TX_DMA_DESCRIPTOR"
sources = ["PROMOTED_LMAC_TX", "PROMOTED_TX_AMPDU", "HIL_OPEN_STA_RATE_CONTROL_2026_07_30"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"

[[review]]
entity = "WIFI_TX_DMA_DESCRIPTOR.CONTROL.SOSF"
sources = ["BLOB_LIBPP_TX_METADATA_ENTRY_20261117"]
naming = "vendor"
provenance = "observed"
accuracy = "positional"
completeness = "unknown"
