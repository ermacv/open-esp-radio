schema = 1

[layout]
name = "BLE_BUFFER_HEADER"
description = "Common physical RX, TX and DTM controller buffer header. Packet fields address byte allocations; successor and backlink fields link headers. The completion gate controls handover, whose protocol is outside this layout."
size = 24
align = 4

[layout.review]
sources = ["BLOB_LIBBLE_MEMORY_BUFFER_HEADER"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

[layout.review.opaque]
sources = ["BLOB_LIBBLE_MEMORY_BUFFER_HEADER"]
provenance = "reviewed"
accuracy = "positional"
completeness = "unknown"
naming = "opaque"

[[layout.words]]
name = "NEXT"
offset = 0x00
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "ADDRESS"
bits = "19:0"
writer = "cpu"
description = "A graph link; zero denotes no link."
points-to = "BLE_BUFFER_HEADER"
encoding = "ble-compressed"

[[layout.words]]
name = "PACKET_BASE"
offset = 0x04
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "ADDRESS"
bits = "19:0"
writer = "cpu"
description = "Byte-buffer base, including its RX or TX prefix; zero means a packetless cursor."
placement = ["dma-window"]
encoding = "ble-compressed"

[[layout.words]]
name = "PDU_TARGET"
offset = 0x08
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "ADDRESS"
bits = "19:0"
writer = "cpu"
description = "TX byte-buffer target at packet +0x10; unused in the RX baseline. The high lanes retain the exact RX/TX allocation profile."
placement = ["dma-window"]
encoding = "ble-compressed"

[[layout.words.fields]]
name = "BIT_21_OPAQUE"
opaque = true
bits = "21"
writer = "cpu"
description = "Cited allocation profile sets this bit relative to the defined zero allocation image; meaning remains unknown."

[[layout.words.fields]]
name = "BIT_23_OPAQUE"
opaque = true
bits = "23"
writer = "cpu"
description = "Cited allocation profile sets this bit relative to the defined zero allocation image; meaning remains unknown."

[[layout.words.fields]]
name = "BIT_31_OPAQUE"
opaque = true
bits = "31"
writer = "cpu"
description = "Cited allocation profile sets this bit relative to the defined zero allocation image; meaning remains unknown."

[[layout.words]]
name = "COMPLETION"
offset = 0x0c
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "DONE"
bits = "31"
writer = "phased"
phases = [{ name = "arm", writer = "cpu" }, { name = "complete", writer = "hardware" }]
description = "CPU clears on arm; controller sets when the buffer completes."

[[layout.words]]
name = "ALLOCATION"
offset = 0x10
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "TERMINAL"
bits = "0"
writer = "cpu"
description = "Software rotation/terminal marker used while recycling a retained cursor."

[[layout.words.fields]]
name = "LLID"
bits = "2:1"
writer = "cpu"
description = "Software completion metadata for a connection TX packet."

[[layout.words.fields]]
name = "PAYLOAD_CAPACITY"
bits = "10:3"
writer = "cpu"
description = "TX payload allocation capacity, excluding the packet prefix."

[[layout.words]]
name = "PREVIOUS"
offset = 0x14
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "Full CPU address of the predecessor header; this software backlink is not compressed."
points-to = "BLE_BUFFER_HEADER"

[[review]]
entity = "BLE_BUFFER_HEADER"
sources = ["BLOB_LIBBLE_MEMORY_BUFFER_HEADER"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"
