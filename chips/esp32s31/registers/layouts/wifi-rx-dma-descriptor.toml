schema = 1

[layout]
name = "WIFI_RX_DMA_DESCRIPTOR"
description = """
The 12-byte node the Wi-Fi RX DMA walker follows: the control word, the
buffer address and the link to the next node."""
size = 12
align = 4

[layout.review]
sources = ["ROM_REV0_WDEV_APPEND_RX_BLOCKS", "ROM_REV0_HAL_MAC_RX_LAST_DESCRIPTOR", "HIL_W1_RX_WALKER_2026_10_18", "HIL_OPEN_RX_LIVE_APPEND_2026_07_27"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

[layout.review.opaque]
sources = ["ROM_REV0_WDEV_APPEND_RX_BLOCKS", "HIL_W1_RX_WALKER_2026_10_18"]
provenance = "observed"
accuracy = "exact"
completeness = "unknown"
naming = "opaque"

[[layout.words]]
name = "CONTROL"
offset = 0x00
access = "shared"

[[layout.words.fields]]
name = "OWNER"
bits = "31"
writer = "cpu"
description = "1: the walker may fill this descriptor; it stops at one with 0 without writing it, and a reload doorbell after the bit is set again resumes it there. The hardware checks it and never clears it: completion is RX_DONE. It does not check the bit of LAST when a doorbell follows LAST's link."

[[layout.words.fields]]
name = "RX_DONE"
bits = "30"
writer = "hardware"
description = "Set by the hardware on a receive unit's terminal descriptor when the unit completes; a walk is delimited by it through the saved LAST. Software clears it on rearm."

[[layout.words.fields]]
name = "BIT_29_OPAQUE"
opaque = true
bits = "29"
writer = "cpu"
description = "Vendor sosf bit, cleared on rearm. The acronym and its hardware effects are not established."

[[layout.words.fields]]
name = "LENGTH"
bits = "27:14"
writer = "hardware"
description = "Software arms LENGTH with SIZE. On the measured three-node beacon chains, terminal LENGTH is 12 for SIZE=128; first and intermediate nodes retain the armed LENGTH=128 image. That unchanged image does not prove a hardware writeback or distinguish a filled nonterminal from an untouched node."

[[layout.words.fields]]
name = "SIZE"
bits = "13:0"
writer = "cpu"
description = "The buffer's capacity in bytes."

[[layout.words]]
name = "BUFFER"
offset = 0x04
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The buffer's address."
placement = ["dma-window"]

[[layout.words]]
name = "NEXT"
offset = 0x08
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The next descriptor's address, or zero at the end."
points-to = "WIFI_RX_DMA_DESCRIPTOR"

