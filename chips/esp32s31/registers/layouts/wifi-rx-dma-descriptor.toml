schema = 1

[layout]
name = "WIFI_RX_DMA_DESCRIPTOR"
description = """
The 12-byte node the Wi-Fi RX DMA walker follows: the control word, the
buffer address and the link to the next node. Buffers can receive repeated
writes without visible CONTROL or walker-cursor commit. A changed leading
word alone is not established as a consumption or accepted-frame predicate.
In 23 sampled uncommitted-write clusters on one board, the current NEXT
head's leading word stays unchanged and changes start at its linked successor;
this does not establish whole-head freshness or general detach/recycle safety."""
size = 12
align = 4

[layout.review]
sources = ["HW18_RX_HEAD_LEADING_PRESERVATION_20261027", "HW18_RX_OWNER_BARRIER_20261027", "HW18_RX_COMMITTED_PREFIX_20261027", "HW18_RX_FCS_CORRELATION_20261027", "HW18_RX_UNCOMMITTED_WRITES_20261027", "ROM_REV0_WDEV_APPEND_RX_BLOCKS", "ROM_REV0_HAL_MAC_RX_LAST_DESCRIPTOR", "HIL_W1_RX_WALKER_2026_10_18", "HIL_OPEN_RX_LIVE_APPEND_2026_07_27"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

[layout.review.opaque]
sources = ["ROM_REV0_WDEV_APPEND_RX_BLOCKS", "HIL_W1_RX_WALKER_2026_10_18"]
provenance = "observed"
accuracy = "exact"
completeness = "unknown"
naming = "opaque"

[[layout.words]]
name = "CONTROL"
offset = 0x00
access = "shared"

[[layout.words.fields]]
name = "OWNER"
bits = "31"
writer = "cpu"
description = "1: the walker may fill this descriptor; 0 is the CPU barrier. A bounded live-store experiment leaves every word at and beyond the first CPU-owned barrier unchanged while preceding buffers receive repeated writes and buffer-full/FCS counters rise. This supports the barrier on one s31-b rev0 board, with three channel-13 beacons, first barrier at node 12, FCS=9 and buffer-full=8; it is not a universal prefetch or detach-release proof. A reload doorbell after the bit is set again resumes there. Hardware completion is RX_DONE, not OWNER clearing. It does not check the bit of LAST when a doorbell follows LAST's link."

[[layout.words.fields]]
name = "RX_DONE"
bits = "30"
writer = "hardware"
description = "Set by the hardware on a receive unit's terminal descriptor when the unit completes; a walk is delimited by it through the saved LAST. Software clears it on rearm."

[[layout.words.fields]]
name = "SOSF"
bits = "29"
writer = "phased"
phases = [{ name = "arm-rearm", writer = "cpu" }, { name = "receive", writer = "hardware" }]
description = "Vendor diagnostic name for CONTROL bit 29. Software explicitly clears it during RX descriptor initialization and append/rearm. Its acronym, physical effect, frame-boundary role and hardware writeback are unestablished. The possible hardware writer in the receive phase is conservative, not an observed store. It remains zero in all recorded HW18 R1/R2/R3 control samples; setting it to one on hardware is untested. It is not an established completion or ownership predicate. SOURCE: BLOB_RX_DESCRIPTOR_VENDOR_NAMES_20261027, BLOB_RX_DESCRIPTOR_CPU_INIT_REARM_20261027, BLOB_RX_DESCRIPTOR_TERMINAL_CONSUMER_20261027."

[[layout.words.fields]]
name = "OFFSET"
bits = "28"
writer = "phased"
phases = [{ name = "arm-rearm", writer = "cpu" }, { name = "receive", writer = "hardware" }]
description = "Vendor diagnostic name for CONTROL bit 28. The inspected vendor RX initialization stores preserve its prior value; append/rearm also preserves it, including an incoming one. This does not establish an initial value, a supported one-valued mode, physical units, relation to the separate RX-control-buffer byte displacement, or hardware writeback. The possible hardware writer in the receive phase is conservative, not an observed store. It remains zero in all recorded HW18 R1/R2/R3 control samples; setting it to one on hardware is untested. It is not an established completion or ownership predicate. SOURCE: BLOB_RX_DESCRIPTOR_VENDOR_NAMES_20261027, BLOB_RX_DESCRIPTOR_CPU_INIT_REARM_20261027, BLOB_RX_DESCRIPTOR_TERMINAL_CONSUMER_20261027."

[[layout.words.fields]]
name = "LENGTH"
bits = "27:14"
writer = "hardware"
description = "Received byte count on a terminal descriptor. Software arms LENGTH with SIZE; an unchanged nonterminal value establishes neither a hardware writeback nor consumption or accepted-frame membership."

[[layout.words.fields]]
name = "SIZE"
bits = "13:0"
writer = "cpu"
description = "The buffer's capacity in bytes."

[[layout.words]]
name = "BUFFER"
offset = 0x04
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The buffer's address."
placement = ["dma-window"]

[[layout.words]]
name = "NEXT"
offset = 0x08
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The next descriptor's address, or zero at the end."
points-to = "WIFI_RX_DMA_DESCRIPTOR"

