schema = 1

[layout]
name = "WIFI_RX_DMA_DESCRIPTOR"
description = """
The 12-byte node the Wi-Fi RX DMA walker follows: the control word, the
buffer address and the link to the next node. Buffers can receive repeated
writes without visible CONTROL or walker-cursor commit. A changed leading
word alone is not established as a consumption or accepted-frame predicate."""
size = 12
align = 4

[layout.review]
sources = ["HW18_RX_UNCOMMITTED_WRITES_20261027", "ROM_REV0_WDEV_APPEND_RX_BLOCKS", "ROM_REV0_HAL_MAC_RX_LAST_DESCRIPTOR", "HIL_W1_RX_WALKER_2026_10_18", "HIL_OPEN_RX_LIVE_APPEND_2026_07_27"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

[layout.review.opaque]
sources = ["ROM_REV0_WDEV_APPEND_RX_BLOCKS", "HIL_W1_RX_WALKER_2026_10_18"]
provenance = "observed"
accuracy = "exact"
completeness = "unknown"
naming = "opaque"

[[layout.words]]
name = "CONTROL"
offset = 0x00
access = "shared"

[[layout.words.fields]]
name = "OWNER"
bits = "31"
writer = "cpu"
description = "1: the walker may fill this descriptor; it stops at one with 0 without writing it, and a reload doorbell after the bit is set again resumes it there. The hardware checks it and never clears it: completion is RX_DONE. It does not check the bit of LAST when a doorbell follows LAST's link."

[[layout.words.fields]]
name = "RX_DONE"
bits = "30"
writer = "hardware"
description = "Set by the hardware on a receive unit's terminal descriptor when the unit completes; a walk is delimited by it through the saved LAST. Software clears it on rearm."

[[layout.words.fields]]
name = "SOSF"
bits = "29"
writer = "cpu"
description = "Vendor sosf bit, cleared on rearm. Its acronym, hardware effects and relation to frame boundaries are unknown. It stayed zero on all sampled nodes in the single 32-by-128-byte, three-beacon capture; that observation does not establish behavior for other formats or errors."

[[layout.words.fields]]
name = "OFFSET"
bits = "28"
writer = "cpu"
description = "Vendor offset bit. Software initializes it through the control image; its encoding, units, hardware write behavior and effect are unknown. It is not an independently established completion marker."

[[layout.words.fields]]
name = "LENGTH"
bits = "27:14"
writer = "hardware"
description = "Received byte count on a terminal descriptor. Software arms LENGTH with SIZE; an unchanged nonterminal value establishes neither a hardware writeback nor consumption or accepted-frame membership."

[[layout.words.fields]]
name = "SIZE"
bits = "13:0"
writer = "cpu"
description = "The buffer's capacity in bytes."

[[layout.words]]
name = "BUFFER"
offset = 0x04
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The buffer's address."
placement = ["dma-window"]

[[layout.words]]
name = "NEXT"
offset = 0x08
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The next descriptor's address, or zero at the end."
points-to = "WIFI_RX_DMA_DESCRIPTOR"

