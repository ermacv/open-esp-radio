[[layout.words.fields]]
name = "BITS_2_13_OPAQUE"
opaque = true
bits = "13:2"
writer = "cpu"
description = "The vendor set_connected_dev helper replaces bit 13 from its third argument while preserving the other byte-one bits. The connected-device helper association is direct; its physical filtering effect is inference. Bits 12:2 remain unidentified. The open accept-list owner constructs this range as zero and has no connected-device setter. SOURCE: VENDOR_BLE_DEVICE_CONNECTED_TAG."

[[layout.words.fields]]
name = "RANDOM"
bits = "14"
writer = "cpu"
description = "Address type is random."

[[layout.words.fields]]
name = "VALID"
bits = "15"
writer = "cpu"
description = "Entry is valid."

[[layout.words.fields]]
name = "ADDRESS_LOW"
bits = "31:16"
writer = "cpu"
description = "First two address bytes."

[[layout.words]]
name = "ADDRESS_HIGH"
offset = 0x04
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "VALUE"
bits = "31:0"
writer = "cpu"
description = "Remaining four address bytes."

