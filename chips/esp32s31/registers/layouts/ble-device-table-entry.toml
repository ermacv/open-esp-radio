schema = 1

[layout]
name = "BLE_DEVICE_TABLE_ENTRY"
description = "One eight-byte device-table entry shared by the filter accept list and periodic list; the separate 64-byte IRK resolving-list allocation has another format. Address bytes are least significant first."
size = 8
align = 4

[layout.review]
sources = ["BLOB_LIBBLE_DEVICE_TABLE"]
provenance = "reviewed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

[layout.review.opaque]
sources = ["BLOB_LIBBLE_DEVICE_TABLE"]
provenance = "reviewed"
accuracy = "positional"
completeness = "unknown"
naming = "opaque"

[[layout.words]]
name = "FLAGS_AND_ADDRESS"
offset = 0x00
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "PERIODIC_LIST_MEMBER"
bits = "0"
writer = "cpu"
description = "Membership flag used by the vendor periodic-list add/remove/clear helpers. This is distinct from the separate IRK resolving list; the physical filtering effect remains unqualified. SOURCE: VENDOR_BLE_DEVICE_LIST_FLAGS."

[[layout.words.fields]]
name = "ACCEPT_LIST_MEMBER"
bits = "1"
writer = "cpu"
description = "Entry belongs to the filter accept list."

[[layout.words.fields]]
name = "BITS_2_12_OPAQUE"
opaque = true
bits = "12:2"
writer = "cpu"
description = "Observed remaining device-entry flags; meanings are unidentified."

[[layout.words.fields]]
name = "CONNECTED_DEVICE_TAG"
bits = "13"
writer = "cpu"
description = "Marker replaced from argument2 bit0 by the connected-device helper; the other entry-byte bits are preserved. A hardware filtering effect is not established."

[[layout.words.fields]]
name = "RANDOM"
bits = "14"
writer = "cpu"
description = "Address type is random."

[[layout.words.fields]]
name = "VALID"
bits = "15"
writer = "cpu"
description = "Entry is valid."

[[layout.words.fields]]
name = "ADDRESS_LOW"
bits = "31:16"
writer = "cpu"
description = "First two address bytes."

[[layout.words]]
name = "ADDRESS_HIGH"
offset = 0x04
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "VALUE"
bits = "31:0"
writer = "cpu"
description = "Remaining four address bytes."

