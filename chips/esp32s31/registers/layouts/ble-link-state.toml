[layout]
name = "BLE_LINK_STATE"
description = "Physical link-state format used by advertising, connectable advertising, scanning, connection and DTM. The same lanes have mode-dependent roles; RECEIVE_CONTEXT documents the scanner-policy/connection-time overlap. Software advsm flags belong to a separate software object, not to this hardware allocation."
size = 132
align = 4

