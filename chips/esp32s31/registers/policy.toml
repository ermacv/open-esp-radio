# A line's pending byte stored whole as 0x01: run 241 stored exactly this
# byte (one volatile byte write, no read of the word), which entered the
# edge-triggered line once and left the line's other three bytes unchanged.
# Bits 7:1, unassigned in the header, are written zero; the run read only
# bit 0 and did not observe them.
[[fixed-register-images]]
name = "pend_line"
register = "CLIC.IP%s"
value = 0x01
whole-word = true
sources = ["HW_S31_CLIC_LINE_BYTES_20261119", "ESP_IDF_4D59230D_S31_CLIC"]

# The same byte stored whole as 0x00, the line's pending bit cleared. Bits
# 7:1 are written zero as by the pend; the header names only bit 0. The
# 2026-11-19 runs stored this image after a pend of an enabled edge line in
# a handler above it (no entry, the bit read clear, a hundred trials), before
# a task line's bind (no entry after its enable) and on each hart's own copy
# (the other hart's unchanged).
[[fixed-register-images]]
name = "clear_line"
register = "CLIC.IP%s"
value = 0x00
whole-word = true
sources = ["HW_S31_LEVEL_TASK_WAKE_20261119", "HW_S31_CLIC_PENDING_PER_HART_20261119", "ESP_IDF_4D59230D_S31_CLIC", "HW_S31_CLIC_LINE_BYTES_20261119"]

