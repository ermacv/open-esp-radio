# The ESP32-S31 ownership policy (schema 6) over the chip root `chip.toml`:
# partitions of parts, unclaimed words, value domains and transactions.
# Format: tools/registers/model/README.md, "Ownership policy".
schema = 6
chip = "esp32s31"

[[partitions]]
name = "SocPeripherals"
member = "soc"
description = "The bootstrap SoC initializer: access-path filters, the LP TRNG clock, reset, sampling, conditioning and health tests, and the system timer's bus and function clocks the boot's monotonic clock needs. Core containment is owned by CoreControlPeripherals."

[[partitions.parts]]
name = "LpApmFilter"
instance = "LP_APM"
registers = ["FUNC_CTRL"]
sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_LP_APM_REG_H_L990"]

[[partitions.parts]]
name = "HpApmFilter"
instance = "HP_APM"
registers = ["FUNC_CTRL"]
sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_HP_APM_REG_H_L1950"]

[[partitions.parts]]
name = "HpMemApmFilter"
instance = "HP_MEM_APM"
registers = ["FUNC_CTRL"]
sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_HP_MEM_APM_REG_H_L1214"]

[[partitions.parts]]
name = "TrngInit"
instance = "TRNG"
registers = ["CONF", "DEBUG_CONF", "DATE"]
sources = ["ESP_IDF_4D59230D_HAL_ESP32S31_INCLUDE_HAL_RNG_LL_H_L163"]

[[partitions.parts]]
name = "LpPericlkrstRngInit"
instance = "LP_PERICLKRST"
registers = ["RNG_CTRL"]
sources = ["ESP_IDF_4D59230D_HAL_ESP32S31_INCLUDE_HAL_RNG_LL_H_L163"]

[[partitions.parts]]
name = "HpSysClkrstSystimer"
instance = "HP_SYS_CLKRST"
registers = ["SYSTIMER_CTRL0"]

[[partitions]]
name = "UsbSerialJtagPeripherals"
member = "usb_serial_jtag"
description = "The USB Serial/JTAG console: its data FIFO, interrupts and pads, written by the early writer before the console's driver exists and by the driver after."

[[partitions.parts]]
name = "UsbSerialJtagTask"
instance = "USB_DEVICE"
registers = ["EP1", "EP1_CONF", "INT_RAW", "INT_ST", "INT_ENA"]

[[partitions.parts]]
name = "UsbSerialJtagIrq"
instance = "USB_DEVICE"
interrupt = "USB_SERIAL_JTAG"
registers = ["INT_CLR"]
observes = ["INT_ST"]
irq-side = true
description = "The interrupt handler reads INT_ST and acknowledges exactly what it read in INT_CLR; the task owns the FIFO, its configuration and the interrupt enables, which the handler never touches."
sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"]

[[partitions.parts]]
name = "UsbSerialJtagPads"
instance = "USB_DEVICE"
registers = ["CONF0"]

[[partitions]]
name = "CoreControlPeripherals"
member = "core_control"
description = "Core control: each HP core's stall request and stall status, HP core 1's clocks and global reset and each core's software CPU reset, the HP core 1 boot address and the system reset trigger, written by the cores' owner and the fatal path."

[[partitions.parts]]
name = "PmuCpuStall"
instance = "PMU"
registers = ["CPU_STALL_SW"]

[[partitions.parts]]
name = "HpSysCoreStallStatus"
instance = "HP_SYS"
registers = ["HP_CPU_CORESTALLED_ST"]

[[partitions.parts]]
name = "HpSysClkrstCore"
instance = "HP_SYS_CLKRST"
registers = ["HPCORE%s_CTRL0"]

[[partitions.parts]]
name = "LpAonClkrstCoreReset"
instance = "LP_AON_CLKRST"
registers = ["LP_AONCLKRST_HPCORE%s_RESET_CTRL"]

[[partitions.parts]]
name = "LpSysCoreControl"
instance = "LP_SYS"
registers = ["LP_SYSTEM_REG_SYS_CTRL", "LP_SYSTEM_REG_BOOT_ADDR_HP_CORE%s"]

[[partitions]]
name = "Uart0ClockPeripherals"
member = "uart0_clock"
description = "UART0's function clock, which the boot ROM prints through after a software reset, written once by the fatal path's reset."

[[partitions.parts]]
name = "HpSysClkrstUart0"
instance = "HP_SYS_CLKRST"
registers = ["UART0_CTRL0"]

[[partitions]]
name = "EfusePeripherals"
member = "efuse"
description = "The eFuse controller's read words of the factory MAC and the chip revision, read once by the factory identity."

[[partitions.parts]]
name = "Efuse"
instance = "EFUSE"
registers = ["RD_MAC_SYS0", "RD_MAC_SYS1", "RD_MAC_SYS3"]

[[partitions]]
name = "EntropyPeripherals"
member = "entropy"
description = "The conditioned TRNG output and error word, with read-only views of the configuration held by the bootstrap SoC initializer."

[[partitions.parts]]
name = "Trng"
instance = "TRNG"
registers = ["INT_RAW", "CRC_SYNC_DATA"]
observes = ["CONF", "DEBUG_CONF"]
description = "The entropy owner reads the conditioned output and health status; only the bootstrap initializer configures sampling and health tests."
sources = ["ESP_IDF_4D59230D_S31_TRNG"]

[[partitions]]
name = "ResetCausePeripherals"
member = "reset_cause"
description = "The reset-cause words of both HP cores, read by the reset-cause owner."

[[partitions.parts]]
name = "LpAonResetCause"
instance = "LP_AON_CLKRST"
registers = ["LP_AONCLKRST_HPCORE%s_RESET_CAUSE"]

[[partitions]]
name = "WatchdogPeripherals"
member = "watchdog"
description = "The main watchdogs and clock/reset words of both timer groups, and the RTC and super watchdogs, owned by the watchdog owners. Group reset cannot escape the watchdog owner's lifetime."

[[partitions.parts]]
name = "Timg0Wdt"
instance = "TIMG0"
registers = ["WDTCONFIG0", "WDTCONFIG1", "WDTCONFIG2", "WDTFEED", "WDTWPROTECT"]

[[partitions.parts]]
name = "Timg1Wdt"
instance = "TIMG1"
registers = ["WDTCONFIG0", "WDTCONFIG1", "WDTCONFIG2", "WDTFEED", "WDTWPROTECT"]

[[partitions.parts]]
name = "HpSysClkrstTimg0"
instance = "HP_SYS_CLKRST"
registers = ["TIMERGRP0_CTRL0"]
sources = ["ESP_IDF_4D59230D_S31_TIMER0_LL"]

[[partitions.parts]]
name = "HpSysClkrstTimg1"
instance = "HP_SYS_CLKRST"
registers = ["TIMERGRP1_CTRL0"]

[[partitions.parts]]
name = "LpWdt"
instance = "LP_WDT"
registers = ["CONFIG0", "CONFIG1", "FEED", "WPROTECT"]

[[partitions.parts]]
name = "LpWdtSwd"
instance = "LP_WDT"
registers = ["SWD_CONFIG", "SWD_WPROTECT"]

[[partitions]]
name = "TimerGroup0Peripherals"
member = "timer_group0"
description = "Timer group zero's movable T0 program owner (counter, alarm, load and whole ENA word) and permanent interrupt owner (whole RAW/ST words and only T0 CLR). Each word has one owner. WatchdogPeripherals retains the group clock/reset word."

[[partitions.parts]]
name = "Timg0Timer0"
instance = "TIMG0"
registers = ["T0CONFIG", "T0LO", "T0HI", "T0UPDATE", "T0ALARMLO", "T0ALARMHI", "T0LOADLO", "T0LOADHI", "T0LOAD", "INT_ENA_TIMERS"]
sources = ["ESP_IDF_4D59230D_S31_TIMER0_LL", "HW7_S31_TIMG0_20261026"]

[[partitions.parts]]
name = "Timg0InterruptBank"
instance = "TIMG0"
registers = ["INT_RAW_TIMERS", "INT_ST_TIMERS"]
triggers = [{ register = "INT_CLR_TIMERS", fields = ["T0_INT_CLR"] }]
interrupt = "TIMERGRP0_T0"
irq-side = true
description = "The group's whole raw/masked status words and T0's acknowledgement strobe; the program owner holds the enable word. T0 is the only interrupt consumer; the watchdog uses reset actions, and T1/WDT CLR strobes remain unclaimed."
sources = ["ESP_IDF_4D59230D_S31_TIMER0_LL", "HW7_S31_TIMG0_20261026"]

[[partitions]]
name = "SystemTimerPeripherals"
member = "system_timer"
description = "The system timer: the comparators the time driver programs and the shared counter latch every context reads."

[[partitions.parts]]
name = "Systimer"
instance = "SYSTIMER"
registers = ["CONF", "UNIT0_LOAD_HI", "UNIT0_LOAD_LO", "UNIT0_LOAD", "TARGET%s_HI", "TARGET%s_LO", "TARGET%s_CONF", "COMP%s_LOAD", "INT_ENA", "INT_RAW", "INT_ST"]
description = "Exclusive unit-zero programming and comparator owner; the shared counter part only latches and reads. SOURCE: ESP_IDF_4D59230D_S31_SYSTIMER_LL."
sources = ["ESP_IDF_4D59230D_S31_SYSTIMER_LL"]

[[partitions.parts]]
name = "SystimerCounter"
instance = "SYSTIMER"
registers = ["UNIT0_OP", "UNIT0_VALUE_HI", "UNIT0_VALUE_LO"]
shared = true
description = "The counter latch of system timer unit zero, which every context reads for the current time."
sources = ["ESP_IDF_4D59230D_S31_SYSTIMER", "ESP_IDF_4D59230D_S31_SYSTIMER_LL"]

[[partitions.parts]]
name = "SystimerAlarm0"
instance = "SYSTIMER"
triggers = [{ register = "INT_CLR", fields = ["TARGET0_INT_CLR"] }]
interrupt = "SYSTIMER_TARGET0"
irq-side = true
description = "Comparator 0's alarm handler strobes its own acknowledgement bit, zero in the others; the time driver owns the comparator's configuration and enable."
sources = ["ESP_IDF_4D59230D_S31_SYSTIMER"]

[[partitions.parts]]
name = "SystimerAlarm1"
instance = "SYSTIMER"
triggers = [{ register = "INT_CLR", fields = ["TARGET1_INT_CLR"] }]
interrupt = "SYSTIMER_TARGET1"
irq-side = true
description = "Comparator 1's alarm handler strobes its own acknowledgement bit, zero in the others; the time driver owns the comparator's configuration and enable."
sources = ["ESP_IDF_4D59230D_S31_SYSTIMER"]

[[partitions.parts]]
name = "SystimerAlarm2"
instance = "SYSTIMER"
triggers = [{ register = "INT_CLR", fields = ["TARGET2_INT_CLR"] }]
interrupt = "SYSTIMER_TARGET2"
irq-side = true
description = "Comparator 2's alarm handler strobes its own acknowledgement bit, zero in the others; the time driver owns the comparator's configuration and enable."
sources = ["ESP_IDF_4D59230D_S31_SYSTIMER"]

[[partitions]]
name = "SoftwareInterrupt0Peripherals"
member = "software_interrupt_0"
description = "Software interrupt line 0, owned by the line's owner (an executor or the radio doorbell)."

[[partitions.parts]]
name = "FromCpu0"
instance = "HP_SYS"
interrupt = "CPU_INTR_FROM_CPU_0"
registers = ["HP_CPU_INT_FROM_CPU_0"]
shared = true
description = "Software interrupt line 0: wakers raise it from every context and its handler lowers it."
sources = ["ESP_IDF_4D59230D_S31_FROM_CPU"]

[[partitions]]
name = "SoftwareInterrupt1Peripherals"
member = "software_interrupt_1"
description = "Software interrupt line 1, owned by the line's owner (an executor or the radio doorbell)."

[[partitions.parts]]
name = "FromCpu1"
instance = "HP_SYS"
interrupt = "CPU_INTR_FROM_CPU_1"
registers = ["HP_CPU_INT_FROM_CPU_1"]
shared = true
description = "Software interrupt line 1: wakers raise it from every context and its handler lowers it."
sources = ["ESP_IDF_4D59230D_S31_FROM_CPU"]

[[partitions]]
name = "SoftwareInterrupt2Peripherals"
member = "software_interrupt_2"
description = "Software interrupt line 2, owned by the line's owner (an executor or the radio doorbell)."

[[partitions.parts]]
name = "FromCpu2"
instance = "HP_SYS"
interrupt = "CPU_INTR_FROM_CPU_2"
registers = ["HP_CPU_INT_FROM_CPU_2"]
shared = true
description = "Software interrupt line 2: wakers raise it from every context and its handler lowers it."
sources = ["ESP_IDF_4D59230D_S31_FROM_CPU"]

[[partitions]]
name = "SoftwareInterrupt3Peripherals"
member = "software_interrupt_3"
description = "Software interrupt line 3, owned by the line's owner (an executor or the radio doorbell)."

[[partitions.parts]]
name = "FromCpu3"
instance = "HP_SYS"
interrupt = "CPU_INTR_FROM_CPU_3"
registers = ["HP_CPU_INT_FROM_CPU_3"]
shared = true
description = "Software interrupt line 3: wakers raise it from every context and its handler lowers it."
sources = ["ESP_IDF_4D59230D_S31_FROM_CPU"]

[[partitions]]
name = "InterruptMatrixPeripherals"
member = "interrupt_matrix"
description = "The interrupt matrix route and pending words and the CLIC configuration and line words, which the interrupt table writes and checks."

[[partitions.parts]]
name = "Clic"
instance = "CLIC"
registers = ["CTRL%s", "INT_INFO"]
observes = ["INT_CONFIG"]
description = "The router owns line writes and reads implemented geometry and the configuration whose sole writer is ClicObserver during partition split."
sources = ["ESP_IDF_4D59230D_S31_CLIC"]

[[partitions.parts]]
name = "ClicObserver"
instance = "CLIC"
registers = ["INT_CONFIG", "INT_THRESH"]
observes = ["CTRL%s"]
description = "The CLIC's level bits, set once when the root splits the partition, and hart 0's lines as a fatal path reads them after the other hart stopped; it writes no line."
sources = ["ESP_IDF_4D59230D_S31_CLIC"]

[[partitions.parts]]
name = "InterruptCore0"
instance = "INTERRUPT_CORE0"
registers = ["ROUTE%s"]

[[partitions.parts]]
name = "InterruptCore0Observer"
instance = "INTERRUPT_CORE0"
registers = ["INTERRUPT_DATE"]
observes = ["ROUTE%s"]
read-only = true
description = "Hart 0's routes as a fatal path reads them after the other hart stopped, and the matrix's version word; it writes nothing."
sources = ["ESP_IDF_4D59230D_S31_INTERRUPT_MATRIX"]

[[partitions.parts]]
name = "InterruptCore0Status"
instance = "INTERRUPT_CORE0"
registers = ["INT_STATUS_REG_0", "INT_STATUS_REG_1", "INT_STATUS_REG_2", "INT_STATUS_REG_3", "INT_STATUS_REG_4", "INT_STATUS_REG_5"]
shared = true
description = "The pending sources at INTERRUPT_CORE0, which every context polls."
sources = ["ESP_IDF_4D59230D_S31_INTERRUPT_MATRIX"]

[[partitions.parts]]
name = "InterruptCore1"
instance = "INTERRUPT_CORE1"
registers = ["ROUTE%s"]

[[partitions.parts]]
name = "InterruptCore1Status"
instance = "INTERRUPT_CORE1"
registers = ["INT_STATUS_REG_0", "INT_STATUS_REG_1", "INT_STATUS_REG_2", "INT_STATUS_REG_3", "INT_STATUS_REG_4", "INT_STATUS_REG_5"]
shared = true
description = "The pending sources at INTERRUPT_CORE1, which every context polls."
sources = ["ESP_IDF_4D59230D_S31_INTERRUPT_MATRIX"]

