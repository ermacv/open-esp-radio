class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_C_NANDFLASH_PE_FAIL_INT interrupt. 1: Triggered when NAND FLASH SPI SEQ found P/E_FAIL bits is err when RDSR. 0: Others."

[[registers.fields]]
name = "NANDFLASH_ECC_ERR_INT_RAW"
