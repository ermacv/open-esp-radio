[[registers]]
name = "BYTE_08_OPAQUE"
offset = 0x8
width = 8
description = "Observed 0x00 in s31-b run hw15-20261027-opaque-07 after the documented probe-specific modem/I2C power-reset, six-map OR and timing/register-mode prefix, without analog byte writes or PHY calibration. Serial, combined parallel and final serial reads replace distinct nonzero command DATA seeds with this value. This is a conditional observation, not a reset value, general read-safe epoch or physical bit meaning. Pinned phy_i2c_init1 initialization code 0xbf, also published through phy_i2c_init2 parallel initialization and phy_i2c_master_cmd_mem_init encoding. The inspected historical PHY uses 0xbb; the directly observed byte-value change is 0xbb to 0xbf, without an established electrical interpretation. SOURCE: VENDOR_PHY_ANALOG_INITIALIZATION_CODES."

