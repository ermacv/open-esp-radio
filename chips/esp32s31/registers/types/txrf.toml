class = "unknown"
description = "Pinned phy_i2c_init1 initialization code 0xbf, also published through phy_i2c_init2 parallel initialization and phy_i2c_master_cmd_mem_init encoding. The inspected historical PHY uses 0xbb; the directly observed byte-value change is 0xbb to 0xbf, without an established electrical interpretation. SOURCE: VENDOR_PHY_ANALOG_INITIALIZATION_CODES."

