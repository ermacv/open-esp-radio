# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "IEEE802154"
description = "The IEEE 802.15.4 MAC at IEEE802154_REG_BASE.\n\nWords 0x0-0x180: Dedicated ESP32-S31 IEEE 802.15.4 MAC aperture at 0x20103000. This selective foundation publishes only register geometry exercised by the pinned public common/chip LL accessors. The public struct and register headers still carry TODO ZB-93 pending an authoritative regdesc CSV, so untouched DTM, timing, debug-selector and modem-sleep words remain deliberately absent and no reset values are claimed.\n\nWord 0x88: One independently bounded shared-baseband reset-idle status word. The complete Bluetooth bbmac_idle_for_swrst leaf proves the exact predicate, but its location inside another protocol aperture prevents Bluetooth-exclusive ownership."
sources = ["S31_REG_BASE", "ESP_IDF_7B9CC1AC_S31_IEEE802154_STRUCT", "ESP_IDF_7B9CC1AC_S31_IEEE802154_REG", "esp-idf-7b9cc1ac-ieee802154-common-ll", "ESP_IDF_7B9CC1AC_S31_IEEE802154_LL", "BLOB_LIBBTBB_BBMAC_IDLE_FOR_SWRST"]

