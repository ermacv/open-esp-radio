# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "BT_BB"
description = "The Bluetooth baseband (BTBB) with its AGC (BTAGC) and the shared ZBBB window. Known only from vendor binaries.\n\nWords 0x0-0x1c4: Bluetooth baseband control and status words recovered from complete, named bt_bb_v2.o accessors in the ESP32-S31 vendor library. Field geometry and argument-to-field transforms are exact. ARGUMENT_N labels deliberately retain unknown C signature semantics rather than inventing a hardware meaning.\n\nWord 0x10: One physical baseband timing word reached by the common BTBB initializer. The named vendor leaf carries a historical Zigbee prefix, but the current evidence proves only the exact shared initialization transaction and does not grant protocol-exclusive ownership.\n\nWords 0x18-0x464: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown.\n\nWords 0x94-0x1fc: Bluetooth direction-finding control words recovered from complete, independently named CTE accessors in the ESP32-S31 vendor baseband library. Only fields touched by those accessors are described; untouched bits remain unassigned.\n\nWord 0xb4: Receive sample-dump words programmed by complete librftest adctrig and set_dump_mode. Dumped words are read back from 0x2f060000 as signed ten-bit components in bits 9:0 and 19:10 (complete print_dump_data and sampledeal); that aperture is not radio MMIO.\n\nWord 0x130: The halfword antenna-map window of the Bluetooth direction-finding block, which the vendor CTE setter stores halfword by halfword. Kept for bit-use coverage: its registers are not 32 bits wide, so no typed owner exists.\n\nWords 0x800-0x900: Sparse BTAGC words absent from the public platform PAC.\n\nWords 0xc00-0xc38: Independently bounded words in the ZBBB window touched by complete Bluetooth baseband receive-setup and reset-idle leaves. Names describe only those exact operations; they do not claim that the physical block is owned exclusively by Bluetooth or assign a wider ZBBB protocol meaning."
sources = ["BLOB_LIBBTBB_BT_BB_V2_ACCESSORS", "BLOB_LIBBTBB_BLE_TX_CONFIG_CHECK", "BLOB_LIBBTBB_BBMAC_IDLE_FOR_SWRST", "BLOB_LIBBTBB_CHANNEL_POWER_CONTROL", "BLOB_LIBBTBB_GAUSSIAN_COEFFICIENTS", "BLOB_LIBBTBB_BT_TX_SET", "BLOB_LIBBTBB_BT_AGC_RESTART_SET", "BLOB_LIBBTBB_SHARED_TX_TIMING_INIT", "S31_MMIO_MODEM_RADIO_CORE_LOW", "BLOB_LIBBTBB_BT_CTE_ACCESSORS", "BLOB_LIBRFTEST_ADCTRIG", "BLOB_LIBRFTEST_SET_DUMP_MODE", "BLOB_LIBRFTEST_PRINT_DUMP_DATA", "ESP_IDF_25FE69F_S31_PHY_RETENTION", "BLOB_LIBPHY_PHY_DEBUG_REG_CHECK", "BLOB_LIBBTBB_BT_BB_V2_RX_SET_SLICE", "BLOB_LIBBTBB_BT_AGC_BASIC_RUNTIME", "BLOB_LIBBTBB_BT_RX_SETUP", "BLOB_LIBBTBB_SHARED_RX_INIT", "BLOB_LIBBTBB_BT_BB_V2_INIT"]

[[interrupt-outputs]]
name = "PRIMARY"
description = "The baseband interrupt."
sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_INCLUDE_SOC_INTERRUPTS_H_L144"]

[[interrupt-outputs]]
name = "NMI"
description = "The baseband's non-maskable interrupt."
sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_INCLUDE_SOC_INTERRUPTS_H_L145"]

