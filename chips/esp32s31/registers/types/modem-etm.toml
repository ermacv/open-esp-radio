# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "MODEM_ETM"
description = "The modem event-task matrix at DR_REG_MODEM_ETM_BASE.\n\nWords 0x0-0x10: ESP32-S31 modem event-task matrix at MODEM_BASE + 0x8800, shared by the IEEE 802.15.4 and Bluetooth lifecycles. The public IEEE 802.15.4 driver names the channel-enable, set and clear words and the per-channel event/task pair at an eight-byte stride, and programs channels zero and one; the BTDM runtime programs channels four through seven through the same words. Channel bits and identifiers without a reviewed user remain absent and no reset values are claimed.\n\nWord 0x11c: Narrow owner for the otherwise isolated word at 0x2010891C. Complete ESP32-S31 BLE PHY initialization writes complete image 0x20 before initializing the BLE hardware accelerator and complete image 0x40 after the surrounding BTMAC and accelerator sequence. Resource IDs 49/50 directly explain these separate one-hot writes through an indexed helper; a SET/CLEAR resource command family is inferred, while physical gate identities and readback behavior remain unknown. SOURCE: VENDOR_BLE_ETM_RESOURCE_COMMANDS.\n\nWord 0x144: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown."
sources = ["ESP_IDF_ESP32S31_MODEM_REG_BASE", "ESP_IDF_7B9CC1AC_S31_IEEE802154_REG", "ESP_IDF_7B9CC1AC_IEEE802154_DRIVER_ETM", "BLOB_LIBBTDM_RUNTIME_CONTROL", "BLOB_LIBBLE_CONTROLLER_OPERATIONAL_GAPS", "BLOB_LIBBTDM_RUNTIME_OPERATIONAL_GAPS", "BLOB_LIBBLE_PHY_INIT_REGISTERS", "S31_MMIO_MODEM_RADIO_CORE_LOW", "VENDOR_BLE_ETM_RESOURCE_COMMANDS"]

