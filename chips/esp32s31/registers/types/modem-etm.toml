class = "read-only"
description = "Channel 6 is enabled."

[[registers.fields]]
name = "CH7"
bits = "7"
class = "read-only"
description = "Channel 7 is enabled."

[[registers]]
name = "CHANNEL_ENABLE_SET"
offset = 0x4
description = "Channel-enable set word. Its fields are write-trigger: writing 1 enables that channel and writing 0 has no effect, as in the ESP32-S31 SoC ETM of identical layout. This semantics is not yet verified on the modem ETM hardware. The IEEE 802.15.4 driver writes the word back after reading it with the selected channel bit added; the BTDM runtime writes complete channel images."

[[registers.fields]]
name = "CH0"
bits = "0"
class = "write-trigger"
description = "Writing 1 enables channel 0."

