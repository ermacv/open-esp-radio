[[registers.fields]]
name = "SLV_ST_END"
bits = "3"
class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_S_SLV_ST_END_INT interrupt. 1: Triggered when spi0_slv_st is changed from non idle state to idle state. It means that SPI_CS raises high. 0: Others"

[[registers.fields]]
name = "MST_ST_END"
bits = "4"
class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_S_MST_ST_END_INT interrupt. 1: Triggered when spi0_mst_st is changed from non idle state to idle state. 0: Others."

[[registers.fields]]
name = "ECC_ERR"
bits = "5"
class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_S_ECC_ERR_INT interrupt. When SPI_FMEM_S_ECC_ERR_INT_EN is set and  SPI_SMEM_S_ECC_ERR_INT_EN is cleared, this bit is triggered when the error times of SPI0/1 ECC read flash are equal or bigger than SPI_MEM_S_ECC_ERR_INT_NUM. When SPI_FMEM_S_ECC_ERR_INT_EN is cleared and  SPI_SMEM_S_ECC_ERR_INT_EN is set, this bit is triggered when the error times of SPI0/1 ECC read external RAM are equal or bigger than SPI_MEM_S_ECC_ERR_INT_NUM. When SPI_FMEM_S_ECC_ERR_INT_EN and SPI_SMEM_S_ECC_ERR_INT_EN are set, this bit is triggered when the total error times of SPI0/1 ECC read external RAM and flash are equal or bigger than SPI_MEM_S_ECC_ERR_INT_NUM. When SPI_FMEM_S_ECC_ERR_INT_EN and  SPI_SMEM_S_ECC_ERR_INT_EN are cleared, this bit will not be triggered."

[[registers.fields]]
name = "PMS_REJECT"
bits = "6"
class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_S_PMS_REJECT_INT interrupt. 1: Triggered when SPI1 access is rejected. 0: Others."

[[registers.fields]]
name = "AXI_RADDR_ERR"
bits = "7"
class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_S_AXI_RADDR_ERR_INT interrupt. 1: Triggered when AXI read address is invalid by compared to MMU configuration. 0: Others."

[[registers.fields]]
name = "AXI_WR_FLASH_ERR"
bits = "8"
class = "write-one-to-clear"
description = "The raw bit for SPI_MEM_S_AXI_WR_FALSH_ERR_INT interrupt. 1: Triggered when AXI write flash request is received. 0: Others."

[[registers.fields]]
