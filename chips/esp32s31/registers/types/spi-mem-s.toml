[[registers]]
name = "CMD"
offset = 0x0
description = "SPI0 FSM status register"
reset = { value = 0x0 }
reserved = { mask = 0xfffbff00, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SPI_MEM_S_REG_H"] }

[[registers.fields]]
name = "MST_ST"
bits = "3:0"
class = "read-only"
description = "The current status of SPI0 master FSM: spi0_mst_st. 0: idle state, 1:SPI0_GRANT , 2: program/erase suspend state, 3: SPI0 read data state, 4: wait cache/EDMA sent data is stored in SPI0 TX FIFO, 5: SPI0 write data state."

[[registers.fields]]
name = "SLV_ST"
bits = "7:4"
class = "read-only"
description = "The current status of SPI0 slave FSM: mspi_st. 0: idle state, 1: preparation state, 2: send command state, 3: send address state, 4: wait state, 5: read data state, 6:write data state, 7: done state, 8: read data end state."

[[registers.fields]]
name = "USR"
bits = "18"
class = "read-only"
description = "SPI0 USR_CMD start bit, only used when SPI_MEM_S_AXI_REQ_EN is cleared.  An operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable."

[[registers]]
name = "CTRL"
offset = 0x8
description = "SPI0 control register."
reset = { value = 0x802c200c }
reserved = { mask = 0x3e439c80, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SPI_MEM_S_REG_H"] }

[[registers.fields]]
name = "WDUMMY_DQS_ALWAYS_OUT"
bits = "0"
class = "plain"
description = "In the dummy phase of an MSPI write data transfer when accesses to flash, the level of SPI_DQS is output by the MSPI controller."

[[registers.fields]]
name = "WDUMMY_ALWAYS_OUT"
bits = "1"
class = "plain"
description = "In the dummy phase of an MSPI write data transfer when accesses to flash, the level of SPI_IO[7:0] is output by the MSPI controller."

[[registers.fields]]
name = "FDUMMY_RIN"
bits = "2"
class = "plain"
description = "In an MSPI read data transfer when accesses to flash, the level of SPI_IO[7:0] is output by the MSPI controller in the first half part of dummy phase. It is used to mask invalid SPI_DQS in the half part of dummy phase."

[[registers.fields]]
name = "FDUMMY_WOUT"
bits = "3"
class = "plain"
description = "In an MSPI write data transfer when accesses to flash, the level of SPI_IO[7:0] is output by the MSPI controller in the second half part of dummy phase. It is used to pre-drive flash."

[[registers.fields]]
name = "FDOUT_OCT"
bits = "4"
class = "plain"
description = "Apply 8 signals during write-data phase 1:enable 0: disable"

[[registers.fields]]
name = "FDIN_OCT"
bits = "5"
class = "plain"
description = "Apply 8 signals during read-data phase 1:enable 0: disable"

[[registers.fields]]
name = "FADDR_OCT"
bits = "6"
class = "plain"
description = "Apply 8 signals during address phase 1:enable 0: disable"

[[registers.fields]]
name = "FCMD_QUAD"
bits = "8"
class = "plain"
description = "Apply 4 signals during command phase 1:enable 0: disable"

[[registers.fields]]
name = "FCMD_OCT"
bits = "9"
class = "plain"
description = "Apply 8 signals during command phase 1:enable 0: disable"

[[registers.fields]]
name = "FASTRD_MODE"
bits = "13"
class = "plain"
description = "This bit enable the bits: SPI_MEM_S_FREAD_QIO, SPI_MEM_S_FREAD_DIO, SPI_MEM_S_FREAD_QOUT and SPI_MEM_S_FREAD_DOUT. 1: enable 0: disable."

[[registers.fields]]
name = "FREAD_DUAL"
bits = "14"
class = "plain"
description = "In the read operations, read-data phase apply 2 signals. 1: enable 0: disable."

[[registers.fields]]
name = "Q_POL"
bits = "18"
class = "plain"
description = "The bit is used to set MISO line polarity, 1: high 0, low"

[[registers.fields]]
name = "D_POL"
bits = "19"
class = "plain"
description = "The bit is used to set MOSI line polarity, 1: high 0, low"

[[registers.fields]]
name = "FREAD_QUAD"
bits = "20"
class = "plain"
description = "In the read operations read-data phase apply 4 signals. 1: enable 0: disable."

[[registers.fields]]
name = "WP_REG"
bits = "21"
class = "plain"
description = "Write protect signal output when SPI is idle.  1: output high, 0: output low."

[[registers.fields]]
name = "FREAD_DIO"
bits = "23"
class = "plain"
description = "In the read operations address phase and read-data phase apply 2 signals. 1: enable 0: disable."

[[registers.fields]]
name = "FREAD_QIO"
bits = "24"
class = "plain"
description = "In the read operations address phase and read-data phase apply 4 signals. 1: enable 0: disable."

[[registers.fields]]
name = "DQS_IE_ALWAYS_ON"
bits = "30"
class = "plain"
description = "When accesses to flash, 1: the IE signals of pads connected to SPI_DQS are always 1. 0: Others."

[[registers.fields]]
name = "DATA_IE_ALWAYS_ON"
bits = "31"
class = "plain"
description = "When accesses to flash, 1: the IE signals of pads connected to SPI_IO[7:0] are always 1. 0: Others."

[[registers]]
name = "CTRL1"
offset = 0xc
description = "SPI0 control1 register."
reset = { value = 0x28c00000 }
reserved = { mask = 0x3ffffc, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SPI_MEM_S_REG_H"] }

[[registers.fields]]
name = "CLK_MODE"
bits = "1:0"
class = "plain"
description = "SPI clock mode bits. 0: SPI clock is off when CS inactive 1: SPI clock is delayed one cycle after CS inactive 2: SPI clock is delayed two cycles after CS inactive 3: SPI clock is always on."

[[registers.fields]]
name = "AR_SIZE0_1_SUPPORT_EN"
bits = "22"
class = "plain"
description = "1: MSPI supports ARSIZE 0~3. When ARSIZE =0~2, MSPI read address is 4*n and reply the real AXI read data back. 0: When ARSIZE 0~1, MSPI reply SLV_ERR."

[[registers.fields]]
name = "AW_SIZE0_1_SUPPORT_EN"
bits = "23"
class = "plain"
description = "1: MSPI supports AWSIZE 0~3. 0: When AWSIZE 0~1, MSPI reply SLV_ERR."

[[registers.fields]]
name = "RRESP_ECC_ERR_EN"
bits = "24"
class = "plain"
description = "1: RRESP is SLV_ERR when there is a ECC error in AXI read data. 0: RRESP is OKAY when there is a ECC error in AXI read data. The ECC error information is recorded in SPI_MEM_S_ECC_ERR_ADDR_REG."

[[registers.fields]]
name = "AR_SPLICE_EN"
bits = "25"
class = "plain"
description = "Set this bit to enable AXI Read Splice-transfer."

[[registers.fields]]
name = "AW_SPLICE_EN"
bits = "26"
class = "plain"
description = "Set this bit to enable AXI Write Splice-transfer."

[[registers.fields]]
name = "RAM0_EN"
bits = "27"
class = "read-only"
description = "When SPI_MEM_S_DUAL_RAM_EN is 0 and SPI_MEM_S_RAM0_EN is 1, only EXT_RAM0 will be accessed. When SPI_MEM_S_DUAL_RAM_EN is 0 and SPI_MEM_S_RAM0_EN is 0, only EXT_RAM1 will be accessed. When SPI_MEM_S_DUAL_RAM_EN is 1,  EXT_RAM0 and EXT_RAM1 will be accessed at the same time."

[[registers.fields]]
name = "DUAL_RAM_EN"
bits = "28"
class = "read-only"
description = "Set this bit to enable DUAL-RAM mode, EXT_RAM0 and EXT_RAM1 will be accessed at the same time."

[[registers.fields]]
name = "FAST_WRITE_EN"
bits = "29"
class = "plain"
description = "Set this bit to write data faster, do not wait write data has been stored in tx_bus_fifo_l2. It will wait 4*T_clk_ctrl to insure the write data has been stored in  tx_bus_fifo_l2."

[[registers.fields]]
name = "RXFIFO_RST"
bits = "30"
class = "write-trigger"
description = "The synchronous reset signal for SPI0 RX AFIFO and all the AES_MSPI SYNC FIFO to receive signals from AXI.  Set this bit to reset these FIFO."

[[registers.fields]]
name = "TXFIFO_RST"
bits = "31"
class = "write-trigger"
description = "The synchronous reset signal for SPI0 TX AFIFO and all the AES_MSPI SYNC FIFO to send signals to AXI. Set this bit to reset these FIFO."

[[registers]]
name = "CTRL2"
offset = 0x10
description = "SPI0 control2 register."
reset = { value = 0x2c21 }
reserved = { mask = 0xff8000, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SPI_MEM_S_REG_H"] }

[[registers.fields]]
name = "CS_SETUP_TIME"
bits = "4:0"
class = "plain"
description = "(cycles-1) of prepare phase by SPI Bus clock, this bits are combined with SPI_MEM_S_CS_SETUP bit."

[[registers.fields]]
name = "CS_HOLD_TIME"
bits = "9:5"
class = "plain"
description = "SPI CS signal is delayed to inactive by SPI bus clock, this bits are combined with SPI_MEM_S_CS_HOLD bit."

[[registers.fields]]
name = "ECC_CS_HOLD_TIME"
bits = "12:10"
class = "plain"
description = "SPI_MEM_S_CS_HOLD_TIME + SPI_MEM_S_ECC_CS_HOLD_TIME is the SPI0 CS hold cycle in ECC mode when accessed flash."

[[registers.fields]]
name = "ECC_SKIP_PAGE_CORNER"
bits = "13"
class = "plain"
description = "1: SPI0 and SPI1 skip page corner when accesses flash. 0: Not skip page corner when accesses flash."

[[registers.fields]]
name = "ECC_16TO18_BYTE_EN"
bits = "14"
class = "plain"
description = "Set this bit to enable SPI0 and SPI1 ECC 16 bytes data with 2 ECC bytes mode when accesses flash."

[[registers.fields]]
name = "SPLIT_TRANS_EN"
bits = "24"
class = "plain"
description = "Set this bit to enable SPI0 split one AXI read flash transfer into two SPI transfers when one transfer will cross flash or EXT_RAM page corner, valid no matter whether there is an ECC region or not."

[[registers.fields]]
name = "CS_HOLD_DELAY"
bits = "30:25"
class = "plain"
description = "These bits are used to set the minimum CS high time tSHSL between SPI burst transfer when accesses to flash. tSHSL is (SPI_MEM_S_CS_HOLD_DELAY[5:0] + 1) MSPI core clock cycles."

[[registers.fields]]
name = "SYNC_RESET"
bits = "31"
class = "write-trigger"
description = "The spi0_mst_st and spi0_slv_st will be reset."

[[registers]]
name = "CLOCK"
offset = 0x14
description = "SPI clock division control register."
reset = { value = 0x30103 }
reserved = { mask = 0x7f000000, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SPI_MEM_S_REG_H"] }

[[registers.fields]]
name = "CLKCNT_L"
bits = "7:0"
class = "plain"
description = "In the master mode it must be equal to SPI_MEM_S_CLKCNT_N."

[[registers.fields]]
name = "CLKCNT_H"
bits = "15:8"
class = "plain"
description = "In the master mode it must be floor((SPI_MEM_S_CLKCNT_N+1)/2-1)."

[[registers.fields]]
name = "CLKCNT_N"
bits = "23:16"
class = "plain"
description = "In the master mode it is the divider of spi_mem_clk. So spi_mem_clk frequency is system/(SPI_MEM_S_CLKCNT_N+1)"

[[registers.fields]]
name = "CLK_EQU_SYSCLK"
bits = "31"
class = "plain"
description = "1: 1-division mode, the frequency of SPI bus clock equals to that of MSPI module clock."

