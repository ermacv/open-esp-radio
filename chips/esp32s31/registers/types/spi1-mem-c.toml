[[registers.fields]]
name = "SPI_FMEM_HYPERBUS_DUMMY_2X"
bits = "27"
class = "read-only"
description = "Set this bit to enable the vary dummy function in SPI HyperBus mode, when SPI0 accesses flash or SPI1 accesses flash or sram."

[[registers.fields]]
