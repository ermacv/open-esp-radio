[[registers]]
name = "EP1"
offset = 0x0
description = "FIFO access for the CDC-ACM data IN and OUT endpoints. FIFO access for the CDC-ACM data IN and OUT endpoints: a write appends a byte to the IN FIFO, a read takes one from the OUT FIFO."
reset = { value = 0x0 }
reserved = { mask = 0xffffff00, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_USB_SERIAL_JTAG_REG_H", "ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }
fifo = { sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_USB_SERIAL_JTAG_REG_H_L16", "ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_USB_SERIAL_JTAG_STRUCT_H_L30"] }

[[registers.fields]]
name = "RDWR_BYTE"
bits = "7:0"
class = "plain"
description = "Write and read byte data to/from UART Tx/Rx FIFO through this field. When USB_SERIAL_JTAG_SERIAL_IN_EMPTY_INT is set, then user can write data (up to 64 bytes) into UART Tx FIFO. When USB_SERIAL_JTAG_SERIAL_OUT_RECV_PKT_INT is set, user can check USB_SERIAL_JTAG_OUT_EP1_WR_ADDR USB_SERIAL_JTAG_OUT_EP0_RD_ADDR to know how many data is received, then read data from UART Rx FIFO. One byte of the IN or OUT FIFO."

[[registers]]
name = "EP1_CONF"
offset = 0x4
description = "Configuration and control registers for the CDC-ACM FIFOs. Configuration and status of the CDC-ACM FIFOs."
reset = { value = 0x2 }
reserved = { mask = 0xfffffff8, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_USB_SERIAL_JTAG_REG_H", "ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

[[registers.fields]]
name = "WR_DONE"
bits = "0"
class = "write-trigger"
description = "Set this bit to indicate writing byte data to UART Tx FIFO is done. Writing one hands the bytes in the IN FIFO to the host as one packet; an empty FIFO sends a zero-length packet."

[[registers.fields]]
name = "SERIAL_IN_EP_DATA_FREE"
bits = "1"
class = "read-only"
description = "1'b1: Indicate UART Tx FIFO is not full and can write data into in. After writing USB_SERIAL_JTAG_WR_DONE, this bit would be 0 until data in UART Tx FIFO is read by USB Host. The IN FIFO has room for a byte. After WR_DONE it stays clear until the host has read the packet."

[[registers.fields]]
name = "SERIAL_OUT_EP_DATA_AVAIL"
bits = "2"
class = "read-only"
description = "1'b1: Indicate there is data in UART Rx FIFO. The OUT FIFO holds a byte to read."

