# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "COEX"
description = "The coexistence block: its timer bank and external coexistence control. Known only from vendor binaries.\n\nWords 0x0-0xc: Six-entry coexistence timer bank. Complete libcoexist leaves address entry index as 0x2010f400 + index*0x10. The 48-event libcoexist[coexist_core.o]::coex_core_timer_idx_get table of the pinned archive returns timer indices zero through five or 0xff; index five is used only by the PHY grant-protect event 48.\n\nWords 0x9c-0xd8: External coexistence control beside the coexistence timer bank. The complete hal_external_coexist.o leaves of the pinned libcoexist address these words at 0x2010f49c, 0x2010f4a0, 0x2010f4a4, 0x2010f4d0 and 0x2010f4d8 through fresh-read RMW operations; the GPIO matrix routing of the request, priority, grant and TX-line signals belongs to the platform, not to this block.\n\nWords 0xb4-0xb8: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown."
sources = ["BLOB_LIBCOEX_HW_TIMER", "BLOB_LIBCOEX_PHY_GRANT_PROTECT", "BLOB_LIBCOEX_EXTERNAL", "S31_MMIO_COEX_EXTERNAL"]

