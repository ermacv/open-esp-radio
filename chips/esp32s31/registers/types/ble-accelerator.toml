# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "BLE_ACCELERATOR"
description = "The BLE hardware accelerator: encryption and resolving-list engines. Known only from vendor binaries.\n\nWords 0x0-0xd0: Sparse ESP32-S31 BLE hardware-accelerator view. Complete ble_hw.c operations independently prove encryption and resolving-list engines in this physical block; complete BLE PHY initialization proves three additional initialization words. Cross-chip objects provide function identities only. Addresses, field geometry, values, ordering and predicates all come from ESP32-S31 bytes.\n\nWords 0x30-0xc0: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown."
sources = ["BLOB_LIBBLE_PHY_INIT_REGISTERS", "BLOB_LIBBLE_HW_ENCRYPT_BLOCK", "BLOB_LIBBLE_HW_RESOLV_LIST_SEARCH", "S31_MMIO_MODEM_RADIO_CORE_LOW"]

