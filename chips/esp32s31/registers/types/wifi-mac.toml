[[registers]]
name = "PLCP1%s"
offset = 0x1364
dim = { count = 4, stride = 0x7c }
description = "Per-queue second PLCP/vector word. Complete dbg_read_key_entry independently names bits 22:17 as KEY_ENTRY_INDEX and bits 24:23 as BSSID_SELECT. Complete libpp[hal_mac_tx.o]::mac_tx_set_plcp1 sets bit 29 for the guarded HT branch when descriptor word1 bit 15 selects 40-MHz channel width; the same selector is copied into HT-SIG1 CBW. A synchronous vendor raw HE20 MCS0 DCM capture used descriptor rate 0x1a and published 0x0401a000, proving that explicit DCM retains the ordinary 0x1a+MCS HE descriptor-code domain."

[[registers.fields]]
name = "LEGACY_SIGNAL"
bits = "11:0"
class = "plain"
description = "Twelve-bit legacy PLCP SIGNAL/length value. Non-legacy formatters leave this field zero."
write-range = { min = 0x0, max = 0xfff }

[[registers.fields]]
name = "RATE"
values = [{ name = "DSSS_1M_LONG", value = 0 }, { name = "DSSS_2M_LONG", value = 1 }, { name = "CCK_5M5_LONG", value = 2 }, { name = "CCK_11M_LONG", value = 3 }, { name = "DSSS_2M_SHORT", value = 5 }, { name = "CCK_5M5_SHORT", value = 6 }, { name = "CCK_11M_SHORT", value = 7 }, { name = "OFDM_48M", value = 8 }, { name = "OFDM_24M", value = 9 }, { name = "OFDM_12M", value = 10 }, { name = "OFDM_6M", value = 11 }, { name = "OFDM_54M", value = 12 }, { name = "OFDM_36M", value = 13 }, { name = "OFDM_18M", value = 14 }, { name = "OFDM_9M", value = 15 }, { name = "HT_LONG_MCS0", value = 16 }, { name = "HT_LONG_MCS1", value = 17 }, { name = "HT_LONG_MCS2", value = 18 }, { name = "HT_LONG_MCS3", value = 19 }, { name = "HT_LONG_MCS4", value = 20 }, { name = "HT_LONG_MCS5", value = 21 }, { name = "HT_LONG_MCS6", value = 22 }, { name = "HT_LONG_MCS7", value = 23 }, { name = "HT_SHORT_MCS0", value = 26 }, { name = "HT_SHORT_MCS1", value = 27 }, { name = "HT_SHORT_MCS2", value = 28 }, { name = "HT_SHORT_MCS3", value = 29 }, { name = "HT_SHORT_MCS4", value = 30 }, { name = "HT_SHORT_MCS5", value = 31 }, { name = "HT_SHORT_MCS6", value = 0 }, { name = "HT_SHORT_MCS7", value = 1 }, { name = "HE_MCS0", value = 26 }, { name = "HE_MCS1", value = 27 }, { name = "HE_MCS2", value = 28 }, { name = "HE_MCS3", value = 29 }, { name = "HE_MCS4", value = 30 }, { name = "HE_MCS5", value = 31 }, { name = "HE_MCS6", value = 0 }, { name = "HE_MCS7", value = 1 }, { name = "HE_MCS8", value = 2 }, { name = "HE_MCS9", value = 3 }]
bits = "16:12"
class = "plain"
description = "Five-bit MAC rate selector published by complete libpp[hal_mac_tx.o]::mac_tx_set_plcp1."
write-range = { min = 0x0, max = 0x1f }

