[[registers]]
name = "PROTECTION%s"
offset = 0xd34
dim = { count = 4, stride = 0x10 }
description = "Canonical WDEVTXQ_CONF2. Complete dbg_read_txq_conf2 names the three ten-bit lanes TXQ_MIN_MPDU_LEN for CBW20, CBW40 and CBW80, followed by SW_CTS at bit 30 and SW_RTS at bit 31. For HT, complete libpp[hal_mac_tx.o]::mac_tx_set_htsig copies peer state offset 0x82 into all three lanes; complete rcUpdateAMPDUParam derives that value from the HT A-MPDU minimum MPDU start-spacing code. For HE, complete libpp[pp_he.o]::ppCalDeliNum stores the rate/GI/DCM/density-specific minimum subframe byte count at descriptor offset 0x28 and complete libpp[hal_mac_tx.o]::mac_tx_set_hesig copies that halfword into all three lanes. The HE init suffix clears only SW_CTS in this same word, preserving SW_RTS and all three spacing lanes. A coherent hardware-owned vendor HT queue contained 0x0280a028, exactly three copies of negotiated value 40. Open HE20 MCS9 HIL with 16-us density proved value 230: fixed snapshot 0x31 lost all 32 MPDUs, while three copies of 230 received a full first-attempt BlockAck with 43 empty delimiters per non-final subframe. The descriptor-count RMWs target the separate queue-vector word at 0x20105504-q*0x7c."

[[registers.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW20"
bits = "9:0"
class = "plain"
description = "First copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
write-range = { min = 0x0, max = 0x3ff }

[[registers.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW40"
bits = "19:10"
class = "plain"
description = "Second copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
write-range = { min = 0x0, max = 0x3ff }

[[registers.fields]]
