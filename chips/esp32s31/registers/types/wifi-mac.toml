[[registers]]
name = "HE_RTS_CONTROL%s"
offset = 0x1368
dim = { count = 4, stride = 0x7c }
description = "Complete hal_he_set_tx_protection optionally replaces this word with a sixteen-bit HE byte threshold and bit 16 set, clearing the disabled flag and all upper state. With no threshold publication request it leaves this word untouched. HE Operation peer programming independently sets bit 17 in all four physical queue vectors when the encoded RTS threshold is disabled."

[[registers.fields]]
name = "RTS_THRESHOLD_BYTES"
bits = "15:0"
class = "plain"
description = "Low sixteen bits of hal_he_set_tx_protection argument a4. Complete libpp[pp_he.o]::ppCalTxHEAMPDULength stores the libpp[if_hwctrl.o]::ic_get_he_rts_threshold_bytes result at descriptor offset 0x34; libpp[hal_mac_tx.o]::mac_tx_set_plcp0 loads the same word into a4. This is a PHY-specific length threshold in bytes, not a frame Duration/NAV value."
write-range = { min = 0x0, max = 0xffff }

[[registers.fields]]
name = "RTS_THRESHOLD_VALID"
bits = "16"
class = "plain"
description = "Set by the complete whole-word byte-threshold publication when argument a3 is nonzero."

[[registers.fields]]
name = "HE_RTS_DISABLED"
bits = "17"
class = "plain"

[[registers]]
name = "PTI%s"
offset = 0x136c
dim = { count = 4, stride = 0x7c }
description = "Complete libpp[hal_mac.o]::mac_tx_set_pti publishes the original packet PTI independently into four lanes, then loads descriptor byte offset 0x22 once and passes it as argument six to hal_set_tx_pti, which publishes it as COUNT bits 31:20. This count is independent of the A-MPDU descriptor count written by libpp[hal_mac_tx.o]::mac_tx_set_mplen to HT_DESCRIPTOR_COUNTS. For vendor Authentication and Association, libnet80211[ieee80211_output.o]::ieee80211_set_tx_pti event six maps through coex_pti_tab to packet PTI one; the independent scheduler field also resolves to one through the unsigned-minimum clamp against event-one PTI five. Vendor and open HIL both used 0x00111110, including the hardware-qualified 32-MPDU open profile."

[[registers.fields]]
name = "TXOP"
bits = "0"
class = "plain"
description = "Complete libpp[hal_mac_tx.o]::hal_mac_tx_set_ppdu sets or clears this bit from descriptor word-zero bit 29 before libpp[hal_mac.o]::mac_tx_set_pti publishes the four coexistence lanes. The bit is independent of those lanes and must not retain the preceding queue transaction's value."

[[registers.fields]]
name = "PTI_0"
bits = "7:4"
class = "plain"
write-range = { min = 0x0, max = 0xf }

[[registers.fields]]
name = "PTI_1"
bits = "11:8"
class = "plain"
write-range = { min = 0x0, max = 0xf }

[[registers.fields]]
name = "PTI_2"
bits = "15:12"
class = "plain"
write-range = { min = 0x0, max = 0xf }

[[registers.fields]]
name = "PTI_3"
bits = "19:16"
class = "plain"
write-range = { min = 0x0, max = 0xf }

[[registers.fields]]
name = "COUNT"
bits = "31:20"
class = "plain"
description = "Descriptor metadata byte 0x22 passed to hal_set_tx_pti; not the A-MPDU MPDU/descriptor count."
value-range = { min = 0x0, max = 0xfff, sources = ["BLOB_LIBPP_HAL_COEX_RUNTIME", "BLOB_LIBPP_HAL_MAC_TX"] }

[[registers]]
name = "HE_CONTROL%s"
offset = 0x1370
dim = { count = 4, stride = 0x7c }
description = "Per-queue four-byte HT-Control/HE-Control image at 0x201054e4-logical_queue*0x7c. Complete hal_he_get_htc reads the whole word. Complete libpp[hal_mac_ctl.o]::hal_he_set_htc writes the supplied word before independently selecting whether this software image overrides the hardware-generated HE-Control value."

[[registers.fields]]
name = "VALUE"
bits = "31:0"
class = "plain"
description = "Complete four-byte HE-Control image. Its A-Control subfields depend on the control ID; keep the finite protocol interpretation in the handwritten IEEE 802.11 layer rather than exposing overlapping mode-dependent SVD fields."
write-range = { min = 0x0, max = 0xffffffff }

[[registers]]
name = "HT_SIGNAL%s"
offset = 0x1374
dim = { count = 4, stride = 0x7c }
description = "Complete libpp[hal_mac_tx.o]::mac_tx_set_htsig (size 0x23c) writes the packed HT-SIG1/HT-SIG2 queue image here for non-HE rates 16..35. Complete dbg_read_tx_sig independently prints the low MCS nibble and sixteen-bit length. The formatter copies descriptor word1 bit 15 to HT-SIG1 bit 7, whose standard meaning is CBW: zero selects 20 MHz and one selects 40 MHz. The exact vendor single-MPDU HT20 MCS0 callback image carried HT_SIGNAL=0x07006e00 for length 0x6e, confirming MCS zero, CBW20 and aggregate bit zero. Open HIL qualified the same single formatter at HT20 MCS0 LGI and HT40 MCS7 SGI. The independent two-MPDU HT20 MCS7/SGI capture carried 0x8f0c2e07 for aggregate length 0x0c2e, confirming aggregate bit one. The open direct-DMA A-MPDU path then received complete BlockAck for four separate HT40 MCS7/SGI two-MPDU submissions."

[[registers.fields]]
name = "MCS"
values = [{ name = "MCS_0", value = 0 }, { name = "MCS_1", value = 1 }, { name = "MCS_2", value = 2 }, { name = "MCS_3", value = 3 }, { name = "MCS_4", value = 4 }, { name = "MCS_5", value = 5 }, { name = "MCS_6", value = 6 }, { name = "MCS_7", value = 7 }]
bits = "6:0"
class = "plain"
description = "Seven-bit standard HT-SIG1 MCS selector. The reviewed open 1T1R path uses MCS0 through MCS7."
write-range = { min = 0x0, max = 0x7f }

[[registers.fields]]
name = "CBW40"
bits = "7"
class = "plain"
description = "Standard HT-SIG1 channel-width bit: zero selects 20 MHz and one selects 40 MHz."

[[registers.fields]]
name = "LENGTH"
bits = "23:8"
class = "plain"
description = "Sixteen-bit HT length printed by complete dbg_read_tx_sig."
