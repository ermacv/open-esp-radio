description = "Third copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
write-range = { min = 0x0, max = 0x3ff }

[[registers.fields]]
name = "SOFTWARE_RTS"
bits = "31"
class = "plain"
description = "Complete dbg_read_txq_conf2 passes bit 31 as the SW_RTS format argument at sp+4; hal_he_set_tx_protection updates this bit from its enable argument. Bounded HT40 MCS7 SGI diagnostics observe hardware-generated RTS to the data receiver followed by CTS, data and ACK/BlockAck, including control frames on both 20-MHz halves. Ordinary protected admission and the complete automatic NAV algorithm remain separate contracts."

[[registers.fields]]
name = "SOFTWARE_CTS"
bits = "30"
class = "plain"
description = "Complete dbg_read_txq_conf2 passes bit 30 as the SW_CTS format argument at sp+8. Bounded HT40 MCS7 SGI diagnostics observe hardware-generated CTS addressed to the transmitter before unicast data, on both 20-MHz halves. This establishes the request in that profile; it does not qualify the full ordinary protected-publication lifecycle."

