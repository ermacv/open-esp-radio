[[registers]]
name = "RX_BLOCK_ACK_ENTRY%s_CONTROL"
offset = 0x178
dim = { count = 8, stride = 0x24 }
description = "Configuration word in one of eight reverse-addressed ordinary receive BlockAck banks. Physical array index zero is logical hardware index seven; complete hal_agreement_add_rx_ba writes logical index zero at 0x20104274 and subtracts 0x24 per index. Delete clears VALID, clears both load bitmaps, sets VALID once, then clears this complete word. Element i is the vendor's entry 7−i. SOURCE: HW11_S31_BLOCK_ACK_20261027 covers quiet direct/staging readback only, not live agreement acceptance or hardware-owned opaque-bit evolution. Ordinary CURRENT_SEQUENCE stayed zero after SSN load 0x123, and the extra latched agreement was empty; quiet zeros do not establish a permanently-zero invariant."

[[registers.fields]]
name = "ENABLE"
bits = "0"
class = "plain"
description = "Complete add sets this bit in every installed ordinary receive BlockAck entry."

[[registers.fields]]
name = "BITS_1_11_OPAQUE"
bits = "11:1"
class = "plain"
description = "Bits preserved by reads but cleared by every reviewed zero-based ordinary-entry publication."

[[registers.fields]]
name = "TID"
bits = "15:12"
class = "plain"
description = "Traffic identifier passed to complete hal_agreement_add_rx_ba without the extra staging path's index transform. The field is four bits wide, while complete ht_recv_action_ba_addba_request rejects values with bit three set and therefore admits TIDs zero through seven."
value-range = { min = 0x0, max = 0xf, sources = ["BLOB_LIBPP_HAL_MAC_RX_BLOCK_ACK"] }

[[registers.fields]]
name = "BITS_16_29_OPAQUE"
