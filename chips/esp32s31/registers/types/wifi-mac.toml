bits = "19:0"
class = "plain"
description = "Low twenty bits of the owned TX descriptor address; the DMA window supplies the high address bits."
pointer = { points-to = "WIFI_TX_DMA_DESCRIPTOR", placement = "dma-window", encoding = { width = 0x14, shift = 0x0, low-bits = true }, sources = ["PROMOTED_LMAC_TX", "BLOB_LIBPP_HAL_MAC_TX"] }

[[registers.fields]]
name = "BITS_20_21_OPAQUE"
bits = "21:20"
class = "plain"
description = "Recovered PLCP0 control image; libpp[hal_mac_tx.o]::mac_tx_set_plcp0 initializes these two bits to binary 10 for the ordinary direct legacy path."
write-range = { min = 0x0, max = 0x3 }

[[registers.fields]]
name = "BIT_22_OPAQUE"
bits = "22"
class = "plain"
description = "PLCP setup sets this bit. Vendor mac_tx_set_txop_q changes it only with a reserved TXOP slot 0/1/2: it sets the bit when the head software-descriptor flags [7:6] equal two and clears it for zero, one or three. Initialized/released index three preserves the PLCP bit. All inspected ordinary unfragmented frame classes, including CCMP, have flags [7:6] zero; successful software fragment chains have two before the final fragment and three on the final fragment. Cipher/key selectors are in the separate descriptor word +0x10. The open legacy/HT/HE formatter sets bit 22 unconditionally; its missing reserved-slot adjustment is a known vendor difference. The recorded 2026-07-29 open HIL A/B observed roughly 28 percent raw ACK timeouts with the bit set and 1395/2325 attempts (60 percent) with it cleared; that observation does not establish a per-cipher mapping or physical meaning. The effect of the reserved-slot adjustment on air remains unqualified. SOURCE: VENDOR_WIFI_TXOP_DESCRIPTOR_CLASS."

[[registers.fields]]
name = "BIT_23_OPAQUE"
bits = "23"
class = "plain"
description = "Recovered PLCP0 control image; libpp[hal_mac_tx.o]::mac_tx_set_plcp0 initializes this bit to zero for the ordinary direct legacy path."

[[registers.fields]]
name = "PLCP_FORMAT"
values = [{ name = "NO_RESPONSE", value = 0 }, { name = "ACK_RESPONSE", value = 1 }, { name = "BLOCK_ACK_RESPONSE", value = 2 }, { name = "HT_SINGLE_MPDU", value = 1 }, { name = "HT_AMPDU", value = 2 }, { name = "HE_SMPDU", value = 1 }, { name = "HE_AMPDU", value = 5 }]
bits = "26:24"
class = "plain"
description = "Three-bit format selector derived by complete libpp[hal_mac_tx.o]::mac_tx_set_plcp0 from vendor descriptor flags. For the bounded plain legacy roots, libpp[pp.o]::ppTxProtoProc maps the address-one I/G bit to descriptor flag 0x2: group traffic retains format zero, while an ordinary individual-address descriptor with zero flags selects format one. Exact vendor callback images select format one for both non-A-MPDU HT20 MCS0 and HE20 MCS0 DCM S-MPDU frames; the owned open paths receive ACK at the same format. Independently captured HT and HE A-MPDU images select aggregate format two or five respectively. Format three has an instruction-exact descriptor branch but its higher-level meaning remains open. A legacy-only single-variable A/B temporarily correlated format one with status five and format zero with one authentication response, but format-zero repetitions failed; that experiment is retained as evidence that completion status alone is not a protocol-success oracle, not as an override of the complete blob mapping."
write-range = { min = 0x0, max = 0x7 }

