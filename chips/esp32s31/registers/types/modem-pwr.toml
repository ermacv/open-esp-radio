[[registers]]
name = "WORD_0038_OPAQUE"
offset = 0x38
description = "A nonzero complete word selects the common timer handler. Measured isolated rollover (2), compare/software (0x40000) and combined (0x40002) status images are named, each raising source 127; independent masking/clear removed their respective lanes. Other causes, the output equation, collision priority and source exhaustiveness remain unknown. SOURCE: BLOB_LIBBTDM_LP_CONTROLS_CURRENT (L5), HW_BLE_LP_CAUSES_2026_10_26, HW2_S31_LP_GATES_20261026, HW2_S31_LP_PENDING_20261026, HW2_S31_LP_STOP_WRAP_20261026. The tested BLE-timer/controller reset transactions did not silence these lanes; LP-clock-off read images are unqualified even when matrix 127 stays high. SOURCE: HW6_S31_LP_RESET_RETENTION_20261026. After the separately tested probe's hart0 HP system reset, real compare, natural rollover, both and quiet scenarios all read zero at the next ROM-loader entry before prepare, with matrix source127 low. Clock-only access restoration did not recover the old causes. A fresh software publication and bit18 enable gave 0x40000/source127 high. The LP source selector/divider remained zero during this access-gate restoration; a separate both-pending/quiet follow-up restored the LP XTAL/divider without acknowledge, prepare or start and still read zero through 4096 cycles. SOURCE: HW13_S31_BLE_LP_HP_RESTORE_20261026. This establishes the next-entry view, not the instantaneous reset state or all production boot paths. SOURCE: HW13_S31_BLE_LP_HP_RESET_20261026."

