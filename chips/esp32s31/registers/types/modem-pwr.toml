description = "The Wi-Fi power interrupt. ENABLE is at offset 0x8b4, RAW at 0x8b8, STATUS at 0x8bc and CLEAR at 0x8c0. Hardware output/mask/clear observations qualify only the explicitly tested causes."
sources = ["BLOB_LIBPP_HAL_PWR_INTERRUPT", "BLOB_LIBPP_S31_PWR_IRQ_SERVICE_20261027", "HW8_S31_WIFI_TSF_MASK_20261026"]

