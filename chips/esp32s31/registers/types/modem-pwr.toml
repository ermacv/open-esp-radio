description = "Complete initialization writes the finite image 0xFFFFFFFF. With both measured LP causes positively pending and enabled, this complete all-ones image cleared their bytes(+0x24/+0x2c), status and source 127; a fresh software-only case also cleared. Per-bit semantics, untested sources and readback remain unknown. SOURCE: HW9_S31_LP_CLEAR34_20261027. The same all-ones image also clears positively witnessed bytes1c/20. Bit18 delivery remains enabled afterward, demonstrated by fresh software pending without another enable. The tested sleep17 and sleep16 flags do not reassert merely because the counter is past their targets during4096 cycles. SOURCE: HW16_S31_LP_SLEEP_LANES_20261026; HW16_S31_LP_DELIVERY_20261026."

