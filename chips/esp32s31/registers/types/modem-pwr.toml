[[registers]]
name = "WORD_002C_OPAQUE"
offset = 0x2c
description = "The low byte is sampled for software epoch rollover. Acknowledgement stores a reviewed whole-word zero, not a W1C image; the measured rollover-only state (a single natural wrap with compare disabled) set this byte to one and independently raised status 2/source 127. Whole-word zero lowered that cause. Two natural wraps without acknowledgement left one visible byte-one indication; one subsequent zero cleared it and status/output, with no second credit observed over 4096 cycles. A retained first-wrap sample therefore does not protect a later wrap from that zero. Arbitrary larger wrap counts and coincident set/clear priority remain unknown. SOURCE: BLOB_LIBBTDM_LP_PENDING_WORDS_CURRENT (L6/L7), HW_BLE_LP_CAUSES_2026_10_26, HW2_S31_LP_STOP_WRAP_20261026, HW8_S31_LP_TWO_WRAPS_20261026. The tested BLE-timer and controller resets retained compare-disabled rollover delivery, also after LP-clock restoration without rearming. SOURCE: HW6_S31_LP_RESET_RETENTION_20261026. A positive pending byte was cleared by whole-word zero while delivery was disabled; enabling its lane afterward did not redeliver. SOURCE: HW9_S31_LP_MASKED_ZERO_20261027. One positively pending natural rollover, alone and with compare, read zero at the next ROM-loader entry after the probe's HP system reset and after clock-only access restoration, while the LP source selector/divider stayed zero. That first experiment acknowledged pending before source-clock restoration. A separate both-pending/quiet follow-up restored the LP XTAL/divider before any acknowledge, prepare or start; pending/cause/counter/output still read zero through 4096 cycles. SOURCE: HW13_S31_BLE_LP_HP_RESTORE_20261026. This is distinct from the earlier BLE-timer/controller reset retention; no immediate reset-edge or POR value is established. SOURCE: HW13_S31_BLE_LP_HP_RESET_20261026. On s31-c, exactly two natural wraps without intermediate acknowledgement again leave byte2c=1/cause2/source127 high. A retained nonzero first-wrap sample conditionally triggers one whole-word zero after the independently observed second crossing; byte/cause/output remain0 through4096 further cycles. No visible second credit or arbitrary wrap-capacity guarantee follows. SOURCE: HW22_S31_LP_TWO_WRAPS_20261027. The pinned handler stores complete zero at +0x20 and +0x52; the counter helper also stores complete zero at +0x32. These stores write bits 31:8 as zero without establishing their individual meaning or clearing behavior. SOURCE: BLOB_BX16_LIBBTDM_LP_IMAGE_LANES_20261027."

