[[registers]]
name = "RUNTIME_TIMER_START_COMMAND"
offset = 0x0
description = "Complete current leaf writes finite image 1; an instruction-identical public same-chip predecessor identifies the operation as r_btdm_hal_rtc_start."

[[registers.fields]]
name = "COMMAND"
bits = "31:0"
class = "write-only"
description = "Complete command image that starts the BTDM runtime timer. After the tested +0x4 image 1 it resumed the retained low-counter phase rather than resetting it. SOURCE: HW2_S31_LP_STOP_WRAP_20261026."
values = [{ name = "START", value = 1, description = "Start the runtime timer during controller hardware enable." }]
write-values-only = true

[[registers]]
name = "WORD_0004_OPAQUE"
offset = 0x4
description = "Complete runtime functions write finite image 1. On the tested live counter it froze the low counter and START resumed the retained phase, while already-pending status and output 127 remained asserted. It is not an all-cause interrupt stop. SOURCE: HW2_S31_LP_STOP_WRAP_20261026."

[[registers.fields]]
name = "BITS_0_31_OPAQUE"
bits = "31:0"
class = "write-only"

[[registers]]
name = "WORD_0008_OPAQUE"
offset = 0x8
description = "Complete initialization writes the finite image 1."

[[registers.fields]]
name = "BITS_0_31_OPAQUE"
bits = "31:0"
class = "write-only"

[[registers]]
name = "WORD_0010_OPAQUE"
offset = 0x10
description = "Observed complete command images 2 during initialization and 0x00040000 after runtime compare or software-pending publication; the tested additive delivery behavior is qualified below. After an all-ones disable, image 2 redelivered an already-pending natural rollover as status 2/source 127, while image 0x40000 redelivered the retained software cause as status 0x40000. This is not an exhaustive output equation or a production-clock guarantee. SOURCE: BLOB_LIBBTDM_LP_CONTROLS_CURRENT (L1/L3-L7); HW2_S31_LP_GATES_20261026. Both tested delivery lanes survived BLE-timer and full production controller resets; restoring LP clocks recovered delivery without rearming. This is behavioral enable retention, not command-register readback. SOURCE: HW6_S31_LP_RESET_RETENTION_20261026. Across the separately tested hart0 HP system reset and next ROM-loader entry, fresh software pending remained silent until another bit18 enable command. In the both-pending and quiet follow-up, after restoring source clocks, CONTROL_25 and START, a natural wrap without a new bit1 enable left pending/status/output zero; enabling bit1 followed by a fresh natural wrap produced pending1/status2/source127 high. Both delivery lanes therefore required a new enable in the tested post-HP-reset setup. SOURCE: HW13_S31_BLE_LP_HP_RESTORE_20261026. This is behavioral delivery evidence, not enable-register readback. SOURCE: HW13_S31_BLE_LP_HP_RESET_20261026. Image2 then image0x40000 independently add the tested delivery enables; the second does not replace the first. SOURCE: HW16_S31_LP_DELIVERY_20261026."

[[registers.fields]]
name = "BIT_1_OPAQUE"
bits = "1"
class = "write-only"
description = "Image 2 redelivered the tested retained natural-rollover cause after all-ones disable, producing status 2/source 127 independently of the software-pending lane. Other effects remain unknown. SOURCE: BLOB_LIBBTDM_LP_CONTROLS_CURRENT (L1/L3-L7); HW2_S31_LP_GATES_20261026."

[[registers.fields]]
name = "BIT_18_OPAQUE"
bits = "18"
class = "write-only"
description = "Enable/redeliver the tested compare or software-pending byte at +0x24 as status0x40000/source127, without clearing the byte. This command adds the bit18 delivery enable without removing enabled rollover delivery; +0x14 bit18 suppresses it while retaining pending. The post-HP-reset setup requires a new enable. These are behavioral delivery observations, not command-register readback or an exhaustive output equation. SOURCE: HW2_S31_LP_PENDING_20261026; HW16_S31_LP_DELIVERY_20261026; HW13_S31_BLE_LP_HP_RESTORE_20261026; BLOB_LIBBTDM_LP_CONTROLS_CURRENT."

[[registers]]
name = "WORD_0014_OPAQUE"
offset = 0x14
description = "Complete runtime functions write finite images 0xFFFFFFFF and 0x00040000. In the tested two-cause state, all-ones lowered status/output while retaining both pending bytes for independent redelivery; bit 18 alone suppressed only the compare/software lane. Other causes remain unqualified. SOURCE: HW2_S31_LP_GATES_20261026. After the tested reset sequences and clock restoration, all-ones again suppressed the positive software and rollover lanes while retaining pending bytes. SOURCE: HW6_S31_LP_QUIET_20261026."

[[registers.fields]]
name = "BITS_0_17_OPAQUE"
bits = "17:0"
class = "write-only"
description = "Observed source use; the individual hardware meaning is unknown."

[[registers.fields]]
name = "BIT_18_OPAQUE"
bits = "18"
class = "write-only"
description = "Observed 0x00040000 compare-disable command; internal action unknown, including the full output equation. The observed image lowers delivery of an already-pending +0x24 cause without clearing that byte; re-enable redelivers it. It does not suppress the observed rollover cause. SOURCE: BLOB_LIBBTDM_LP_COMPARE_DISABLE_CURRENT (L3/L9); HW2_S31_LP_PENDING_20261026; HW2_S31_LP_STOP_WRAP_20261026."

[[registers.fields]]
name = "BITS_19_31_OPAQUE"
bits = "31:19"
class = "write-only"
description = "Observed source use; the individual hardware meaning is unknown."

[[registers]]
name = "WORD_001C_OPAQUE"
offset = 0x1c
description = "One complete runtime function reads the complete word and writes the finite zero image. Inner state encoding remains unknown. In a sourced sleep16 setup, a positively witnessed+0x64 target crossing set the low byte to1 under each tested mode58 control0/4 combination. +0x44 image 0x10000 retained the byte; whole-word zero cleared it. No127/129 route is established with the delivery bank disabled. SOURCE: HW9_S31_LP_SLEEP16_20261027. With known delivery bits1/18 enabled, the positive sleep16 flag still leaves status/output127 low. Whole-word all-ones+34 clears it. SOURCE: HW16_S31_LP_SLEEP_LANES_20261026. R1/R2 logged only bits7:0; bits31:8 were not captured and their effects are unqualified."

[[registers.fields]]
name = "BITS_0_7_OPAQUE"
bits = "7:0"
class = "plain"
description = "Observed source use; the individual hardware meaning is unknown."

[[registers]]
name = "WORD_0020_OPAQUE"
offset = 0x20
description = "Complete state word read by runtime functions and cleared by two complete paths. In the tested setup with advancing completed BTLC captures, digital/ETM clocks live, ETM channels6/7 enabled and the ETM bit11 command issued, a future+68 crossing with sleep17 enabled and sleep0/16 disabled sets the low byte to1. +44 bit17 retains it; whole-word all-ones+34 clears it. A crossing while sleep17 is disabled leaves no visible flag for late enable; a fresh enabled future target is positive. The BTLC/ETM prerequisites were not varied independently. This qualifies a local comparator flag, not a completed PMU sleep/wake transition. SOURCE: HW16_S31_LP_SLEEP_LANES_20261026. R1/R2 logged only bits7:0; bits31:8 were not captured and their effects are unqualified."

[[registers.fields]]
name = "BITS_0_7_OPAQUE"
bits = "7:0"
class = "plain"
description = "Observed source use; the individual hardware meaning is unknown."

[[registers]]
name = "WORD_0024_OPAQUE"
offset = 0x24
description = "The low byte is sampled for software timer work. Reviewed whole-word stores publish zero to acknowledge it and one to request software work; upper-byte meanings remain unknown. With the bit-18 command enabled, the tested byte-one publication raised status 0x40000/source 127, and whole-word zero lowered it. Masking retained the byte for redelivery. SOURCE: BLOB_LIBBTDM_LP_PENDING_WORDS_CURRENT (L4/L6/L7); HW2_S31_LP_PENDING_20261026. The tested BLE-timer and controller resets retained this software-pending delivery, including recovery after LP-clock restoration without republishing or rearming. SOURCE: HW6_S31_LP_RESET_RETENTION_20261026. In a phased local compare experiment, a cause arriving after an earlier byte-zero read was removed by a later whole-word zero; clear before expiry still allowed the subsequent cause. This is not a coincident set/clear priority measurement. SOURCE: HW8_S31_LP_PHASED_ACK_20261026. A positive pending byte was cleared by whole-word zero while delivery was disabled; enabling its lane afterward did not redeliver. SOURCE: HW9_S31_LP_MASKED_ZERO_20261027. A positively pending real compare, alone and with rollover, read zero at the next ROM-loader entry after the probe's HP system reset. Clock-only access restoration without LP prepare, reset, clear, start or enable did not recover it. Fresh software pending then read one and delivered only after bit18 enable. The immediate reset-edge state and ROM initialization effects are not separated. SOURCE: HW13_S31_BLE_LP_HP_RESET_20261026. With CONTROL0=1/CONTROL4=0 and XTAL/divider1, a retained nonzero software-pending sample followed by a new near compare (independently witnessed by CONTROL2 changing 0 to1) then conditional whole-word zero removed byte24/cause/output; CONTROL2 remained1. A zero sample skips the store and preserves the arrival, and zero before expiry permits the later compare. The delayed phases establish loss of the newer coalesced pending indication, not coincident arbitration or an execution of the production handler. SOURCE: HW22_S31_LP_CONDITIONAL_ACK_20261027. The pinned handler acknowledges with a complete zero store at +0x10; the immediate-deadline publisher stores complete one at +0x38. Both write bits 31:8 as zero. No meaning, reset value or per-bit side effect is established for those upper lanes. SOURCE: BLOB_BX16_LIBBTDM_LP_IMAGE_LANES_20261027."

