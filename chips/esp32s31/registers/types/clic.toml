# The curated ESP32-S31 CLIC block, sourced from the pinned S31 header.
schema = 3

[type]
name = "CLIC"
description = "The core-local interrupt controller (CLIC) of the hart that accesses it.\n\nWords 0x0-0x1000: The core-local interrupt controller of the hart that accesses it, as 32-bit words: each line's word holds its pending, enable, attribute and control bytes. Invariant: every vectored line is level-triggered, so a write of the word that changes its enable or control writes back the pending bit read without losing or inventing an interrupt (SOURCE: ESP_HAL_1F646C5_CLIC_LEVEL_LINES). INT_CONFIG holds the number of level bits of each line's control byte."
sources = ["ESP_IDF_4D59230D_S31_CLIC"]

[review]
sources = ["ESP_IDF_4D59230D_S31_CLIC"]
provenance = "observed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

[[registers]]
name = "INT_CONFIG"
offset = 0x0
description = "The controller's configuration: how many bits of a line's control byte are its level. SOURCE: ESP_IDF_4D59230D_S31_CLIC, lines 20-38: MNLBITS resets to zero; HAL must write its selected level bits."
reset = { value = 1, mask = 0x7f }

[[registers.fields]]
name = "NVBITS"
bits = "0"
class = "read-only"
description = "Set: the controller implements hardware vectoring."

[[registers.fields]]
name = "MNLBITS"
bits = "4:1"
class = "plain"
description = "Machine mode: the number of high bits of a line's control byte that are its level, at most 8."

[[registers.fields]]
name = "NMBITS"
bits = "6:5"
class = "read-only"
description = "The number of privilege-mode bits of a line's attribute."

[[registers]]
name = "INT_INFO"
offset = 0x4
description = "Implemented CLIC geometry and version. SOURCE: ESP_IDF_4D59230D_S31_CLIC, lines 40-59."
reset = { value = 0x00600030, mask = 0x01ffffff }

[[registers.fields]]
name = "NUM_INT"
bits = "12:0"
class = "read-only"
description = "Number of interrupt inputs, including reserved core-local inputs."

[[registers.fields]]
name = "VERSION"
bits = "20:13"
class = "read-only"
description = "Implementation revision in the low nibble, CLIC architecture version in the high nibble."

[[registers.fields]]
name = "CTLBITS"
bits = "24:21"
class = "read-only"
description = "Implemented high bits of each line's CLICINTCTL byte."

[[registers]]
name = "INT_THRESH"
offset = 0x8
description = "Legacy MMIO machine threshold; runtime uses the standard mintthresh CSR. SOURCE: ESP_IDF_4D59230D_S31_CLIC, lines 61-67: R/W, reset zero."
reset = { value = 0, mask = 0xff000000 }

[[registers.fields]]
name = "CPU_INT_THRESH"
bits = "31:24"
class = "plain"
description = "Legacy machine interrupt threshold."

[[registers]]
name = "CTRL%s"
offset = 0x1000
dim = { count = 48, stride = 0x4 }
description = "Line %s: pending, enable, attribute and level control. SOURCE: ESP_IDF_4D59230D_S31_CLIC, lines 70-116: CTL resets to 0x1f, ATTR_MODE to 0b11, other described fields to zero; unassigned bits have no claimed reset."
reset = { value = 0x1fc00000, mask = 0xffc70101 }

[[registers.fields]]
name = "IP"
bits = "0"
class = "plain"
description = "The line's pending bit; for a level-triggered line it follows the source."

[[registers.fields]]
name = "IE"
bits = "8"
class = "plain"
description = "Enables the line."

[[registers.fields]]
name = "ATTR_SHV"
bits = "16"
class = "plain"
description = "Selects hardware vectoring for the line."

[[registers.fields]]
name = "ATTR_TRIG"
values = [{ name = "POSITIVE_LEVEL", value = 0 }, { name = "POSITIVE_EDGE", value = 1 }, { name = "NEGATIVE_LEVEL", value = 2 }, { name = "NEGATIVE_EDGE", value = 3 }]
bits = "18:17"
class = "plain"
description = "Trigger: bit 0 clear is level, set is edge; bit 1 selects the negative polarity."

[[registers.fields]]
name = "ATTR_MODE"
bits = "23:22"
class = "read-only"
description = "Machine privilege mode, fixed at 0b11. SOURCE: ESP_IDF_4D59230D_S31_CLIC, lines 79-84."

[[registers.fields]]
name = "CTL"
bits = "31:24"
class = "plain"
description = "Level and priority control; with three level bits a level-n line holds 0x1f | (n - 1) << 5."
