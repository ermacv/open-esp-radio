# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "FE"
description = "The radio front end at DR_REG_FE_BASE: PHY front-end control, data and coexistence words, the PHY table memory command port and the PBus.\n\nWord 0x10: Sparse FECOEX words absent from the public platform PAC.\n\nWords 0x1c-0x874: Frequency-memory, hardware channel-switch, NRX and channel-bandwidth registers recovered from complete finite ROM/blob bodies. Names retain UNKNOWN where the instructions prove a field but not its electrical meaning. One physical word has one identity even when a bit has different mode-dependent roles.\n\nWords 0x400-0x800: OPAQUE PHY clock-gate registers recovered from complete no-call ROM/blob leaves.\n\nWords 0x40c-0xc20: PHY/baseband configuration registers recovered from complete rev0 ROM bodies and complete pinned libphy leaves. Operation-derived fields keep UNKNOWN where neither public documentation nor an independent symbol establishes the electrical meaning.\n\nWords 0x430-0x440: Sparse FEDATA words absent from the public platform PAC.\n\nWord 0x434: RX-DCO calibration control word recovered from complete pinned S31 blob and rev0 ROM calibration bodies.\n\nWords 0x44c-0x8d0: DC/IQ estimator configuration, signed result and activity registers recovered from complete S31 rev0 ROM bodies and the complete pinned phy_check_rx_sat blob leaf. Unknown electrical roles remain explicit.\n\nWords 0x470-0x474: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown.\n\nWords 0x834-0x840: Sparse FECTRL antenna words absent from the public platform PAC.\n\nWords 0x844-0x854: Shared PHY table-memory command, data and PBUS group-boundary aperture. The same command/data words have mode-dependent PBUS-memory, TX-CFR and gain-memory meanings; fields are named only where the complete bodies prove a common or mode-independent identity.\n\nWords 0x884-0x8a4: PBus command, mode, status/clock/force and packed result windows recovered from complete rev0 ROM bodies and their address/shift jump tables. The blob debug printer independently names selector/path groups: RFRX is selector 0 paths 1/2; BB is selector 1 paths 1/2; DCO is selectors 2/3 paths 1/2; RFTX is selector 4 paths 1/2 and selector 5 path 1.\n\nWord 0x8bc: OPAQUE PHY AGC, PBus-pulse, antenna, RX-compensation, DC-memory, post-initialization and 11b-control registers recovered from complete, finite rev0 ROM/blob bodies. One physical register has one identity even when independent bodies prove different fields. Names describe their proven operation role, not an unevidenced electrical identity.\n\nWord 0x8cc: Receive sample-dump words programmed by complete librftest adctrig and set_dump_mode. Dumped words are read back from 0x2f060000 as signed ten-bit components in bits 9:0 and 19:10 (complete print_dump_data and sampledeal); that aperture is not radio MMIO.\n\nWords 0xc14-0xc1c: Sparse FEDATA_WIFI words absent from the public platform PAC."
sources = ["ESP_IDF_25FE69F_S31_PHY_RETENTION", "BLOB_LIBPHY_PHY_DEBUG_REG_CHECK", "BLOB_LIBBTBB_COEX_PTI_V2", "ROM_REV0_PHY_FREQUENCY_CHANNEL", "BLOB_LIBPHY_PHY_BB_INIT", "BLOB_LIBPHY_REGISTER_CHIPV7_PHY", "ROM_REV0_PHY_OPEN_FE_BB_CLK", "ROM_REV0_PHY_FE_REG_INIT", "BLOB_LIBPHY_PHY_CLOSE_FE_BB_CLK", "ROM_REV0_PHY_REGISTER_INITIALIZATION", "ROM_REV0_PHY_POWER_DETECTOR", "ROM_REV0_PHY_IQ_COEFFICIENTS", "BLOB_LIBPHY_PHY_BASEBAND_CONFIG", "BLOB_LIBPHY_PHY_XTAL_DUTY_CAL", "ROM_REV0_PHY_RX_DCO_CAL", "ROM_REV0_PHY_IQ_ESTIMATOR", "BLOB_LIBPHY_PHY_CHECK_RX_SAT", "S31_MMIO_MODEM_RADIO_CORE_LOW", "ROM_REV0_PHY_SET_PBUS_MEM", "ROM_REV0_PHY_WRITE_PBUS_MEM", "ROM_REV0_PHY_SAVE_PBUS_REG", "BLOB_LIBPHY_PHY_SET_TX_CFR_MEM", "ROM_REV0_PHY_WRITE_GAIN_MEM", "ROM_REV0_PHY_PBUS", "BLOB_LIBPHY_PHY_DEBUG_PBUS", "ROM_REV0_PHY_AGC", "ROM_REV0_PHY_ANT_INIT", "BLOB_LIBPHY_PHY_DC_MEM_CLR", "BLOB_LIBPHY_PHY_REG_UPDATE_NEW", "BLOB_LIBPHY_PHY_SET_RX_GAIN_TABLE", "BLOB_LIBPHY_PHY_SET_RX_COMP_NEW", "BLOB_LIBRFTEST_ADCTRIG", "BLOB_LIBRFTEST_SET_DUMP_MODE", "BLOB_LIBRFTEST_PRINT_DUMP_DATA"]

