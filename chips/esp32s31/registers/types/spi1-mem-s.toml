description = "The mask value when check SUS/SUS1/SUS2 status bit. If the read status value is status_in[15:0](only status_in[7:0] is valid when only one byte of data is read out, status_in[15:0] is valid when two bytes of data are read out), SUS/SUS1/SUS2 = status_in[15:0]^ SPI1_MEM_S_PESR_END_MSK[15:0]."

[[registers.fields]]
name = "RD_SUS_2B"
