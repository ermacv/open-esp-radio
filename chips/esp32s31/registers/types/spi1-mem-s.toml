[[registers.fields]]
name = "FLASH_PE"
bits = "17"
class = "self-clearing"
description = "In user mode, it is set to indicate that program/erase operation will be triggered. The bit is combined with SPI1_MEM_S_usr bit. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "USR"
bits = "18"
class = "self-clearing"
description = "User define command enable.  An operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable."

[[registers.fields]]
name = "FLASH_HPM"
bits = "19"
class = "self-clearing"
description = "Drive Flash into high performance mode.  The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_RES"
bits = "20"
class = "self-clearing"
description = "This bit combined with reg_resandres bit releases Flash from the power-down state or high performance mode and obtains the devices ID. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_DP"
bits = "21"
class = "self-clearing"
description = "Drive Flash into power down.  An operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_CE"
bits = "22"
class = "self-clearing"
description = "Chip erase enable. Chip erase operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_BE"
bits = "23"
class = "self-clearing"
description = "Block erase enable(32KB) .  Block erase operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_SE"
bits = "24"
class = "self-clearing"
description = "Sector erase enable(4KB). Sector erase operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_PP"
bits = "25"
class = "self-clearing"
description = "Page program enable(1 byte ~256 bytes data to be programmed). Page program operation  will be triggered when the bit is set. The bit will be cleared once the operation done .1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_WRSR"
bits = "26"
class = "self-clearing"
description = "Write status register enable.   Write status operation  will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_RDSR"
bits = "27"
class = "self-clearing"
description = "Read status register-1.  Read status operation will be triggered when the bit is set. The bit will be cleared once the operation done.1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_RDID"
bits = "28"
class = "self-clearing"
description = "Read JEDEC ID . Read ID command will be sent when the bit is set. The bit will be cleared once the operation done. 1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_WRDI"
bits = "29"
class = "self-clearing"
description = "Write flash disable. Write disable command will be sent when the bit is set. The bit will be cleared once the operation done. 1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_WREN"
bits = "30"
class = "self-clearing"
description = "Write flash enable.  Write enable command will be sent when the bit is set. The bit will be cleared once the operation done. 1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

[[registers.fields]]
name = "FLASH_READ"
bits = "31"
class = "self-clearing"
description = "Read flash enable. Read flash operation will be triggered when the bit is set. The bit will be cleared once the operation done. 1: enable 0: disable. This field is only for internal debugging purposes. Do not use it in applications."

