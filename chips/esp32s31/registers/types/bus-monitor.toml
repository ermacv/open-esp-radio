# A block type of the curated ESP32-S31 register model, written from the
# vendor header's definitions of the words the HAL reads.
schema = 3

[type]
name = "BUS_MONITOR"
description = "The HP CPUs' bus monitor and assist-debug block (ESP-IDF's ASSIST_DEBUG): each core's debug-mode status. Only the debug-mode words are modeled."
sources = ["ESP_IDF_4D59230D_S31_BUS_MONITOR_DEBUG_MODE"]

[review]
sources = ["ESP_IDF_4D59230D_S31_BUS_MONITOR_DEBUG_MODE"]
provenance = "imported"
accuracy = "exact"
completeness = "partial"
naming = "vendor"

[[registers]]
name = "CORE_0_DEBUG_MODE"
offset = 0x64
description = "HP core 0's debug status."
reset = { value = 0x0, mask = 0x3 }

[[registers.fields]]
name = "CORE_0_DEBUG_MODE"
bits = "0"
class = "read-only"
description = "Whether HP core 0 is in debugging mode."

[[registers.fields]]
name = "CORE_0_DEBUG_MODULE_ACTIVE"
bits = "1"
class = "read-only"
description = "Whether HP core 0's debug module is active: a debugger is attached."

[[registers]]
name = "CORE_1_DEBUG_MODE"
offset = 0xec
description = "HP core 1's debug status."
reset = { value = 0x0, mask = 0x3 }

[[registers.fields]]
name = "CORE_1_DEBUG_MODE"
bits = "0"
class = "read-only"
description = "Whether HP core 1 is in debugging mode."

[[registers.fields]]
name = "CORE_1_DEBUG_MODULE_ACTIVE"
bits = "1"
class = "read-only"
description = "Whether HP core 1's debug module is active: a debugger is attached."
