# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "BTDM"
description = "The Bluetooth dual-mode block: BR/EDR MAC defaults and the scheduler hardware-list table. Known only from vendor binaries.\n\nWords 0x8-0xffc: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown.\n\nWord 0x1000: Sixteen-entry scheduler hardware-list table. Complete current insertion-begin, insertion-end and lifecycle bodies prove the finite entry count, 0x10-byte stride and low-20-bit compressed SRAM head. Same-chip public named header accessors independently establish the hardware-list role. The upper twelve bits and the unobserved words inside each stride remain unknown."
sources = ["S31_MMIO_MODEM_RADIO_CORE_MID", "BLOB_LIBBTDM_SCHEDULER_LIFECYCLE", "BLOB_LIBBTDM_SCHEDULER_HEAD_PUBLICATION", "PUBLIC_ESP32S31_BT_SCHEDULER_ROLES"]

[review]
sources = ["BLOB_LIBBTDM_SCHEDULER_LIFECYCLE", "BLOB_LIBBTDM_SCHEDULER_HEAD_PUBLICATION", "PUBLIC_ESP32S31_BT_SCHEDULER_ROLES"]
provenance = "observed"
accuracy = "exact"
completeness = "partial"
naming = "descriptive"

