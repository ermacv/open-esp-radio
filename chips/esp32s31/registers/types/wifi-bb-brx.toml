# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "WIFI_BB_BRX"
description = "The Wi-Fi baseband receive block at DR_REG_WIFI_BB_BRX_BASE. Known only from vendor binaries.\n\nWords 0x4-0x78: OPAQUE PHY AGC, PBus-pulse, antenna, RX-compensation, DC-memory, post-initialization and 11b-control registers recovered from complete, finite rev0 ROM/blob bodies. One physical register has one identity even when independent bodies prove different fields. Names describe their proven operation role, not an unevidenced electrical identity.\n\nWord 0x50: Sparse BRX words absent from the public platform PAC.\n\nWords 0x60-0x7c: Wi-Fi-owned PHY words: the noise-floor measurement read by Wi-Fi link policy and the low-rate receive gate of Wi-Fi rate control and 11b long-range RX. Only Wi-Fi touches these words: no PHY registration, calibration or tracking body and no Bluetooth or IEEE 802.15.4 body accesses them, so they belong to the Wi-Fi partition rather than the shared radio PHY. They share the radio-core base with the PHY oracles."
sources = ["ROM_REV0_PHY_AGC", "ROM_REV0_PHY_PBUS", "ROM_REV0_PHY_ANT_INIT", "BLOB_LIBPHY_PHY_DC_MEM_CLR", "BLOB_LIBPHY_PHY_REG_UPDATE_NEW", "BLOB_LIBPHY_PHY_SET_RX_GAIN_TABLE", "BLOB_LIBPHY_PHY_SET_RX_COMP_NEW", "ESP_IDF_25FE69F_S31_PHY_RETENTION", "BLOB_LIBPHY_PHY_DEBUG_REG_CHECK", "ROM_REV0_PHY_READ_NOISE_FLOOR", "ROM_REV0_PHY_LOW_RATE", "ROM_REV0_PHY_RX11BLR_CFG"]

[review]
sources = ["ROM_REV0_PHY_LOW_RATE"]
provenance = "observed"
accuracy = "exact"
completeness = "complete"
naming = "descriptive"

