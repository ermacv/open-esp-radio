[[registers]]
name = "CONF"
offset = 0x0
description = "Configure system timer clock Clock, unit and comparator enables."
reset = { value = 0x46000000 }
reserved = { mask = 0x3ffffd, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SYSTIMER_REG_H"] }

[[registers.fields]]
name = "ETM_EN"
bits = "1"
class = "plain"
description = "Configures whether or not to enable generation of ETM events.\\\\ 0: Disable\\\\ 1: Enable\\\\ Enables the generation of ETM events."

[[registers.fields]]
name = "TARGET2_WORK_EN"
bits = "22"
class = "plain"
description = "Configures whether or not to enable COMP2.\\\\ 0: Disable\\\\ 1: Enable\\\\ Enables comparator 2."

[[registers.fields]]
name = "TARGET1_WORK_EN"
bits = "23"
class = "plain"
description = "Enables comparator 1. Clearing WORK_EN stops the producer but retains an already-pending RAW/ST and interrupt output in the tested one-shot. Masking INT_ENA and acknowledging CLR are separate operations. SOURCE: HW7_S31_SYSTIMER_20261026."

[[registers.fields]]
name = "TARGET0_WORK_EN"
bits = "24"
class = "plain"
description = "Enables comparator 0. Clearing WORK_EN stops the producer but retains an already-pending RAW/ST and interrupt output in the tested one-shot. Masking INT_ENA and acknowledging CLR are separate operations. SOURCE: HW7_S31_SYSTIMER_20261026."

[[registers.fields]]
name = "TIMER_UNIT1_CORE1_STALL_EN"
bits = "25"
class = "plain"
description = "Configures whether or not UNIT1 is stalled when CORE1 is stalled. \\\\ 0: UNIT1 is not stalled. \\\\ 1: UNIT1 is stalled.\\\\ Stalls unit 1 while core 1 is stalled."

[[registers.fields]]
name = "TIMER_UNIT1_CORE0_STALL_EN"
bits = "26"
class = "plain"
description = "Configures whether or not UNIT1 is stalled when CORE0 is stalled. See details in SYSTIMER_TIMER_UNIT1_CORE1_STALL_EN. Stalls unit 1 while core 0 is stalled."

[[registers.fields]]
name = "TIMER_UNIT0_CORE1_STALL_EN"
bits = "27"
class = "plain"
description = "Configures whether or not UNIT0 is stalled when CORE1 is stalled. See details in SYSTIMER_TIMER_UNIT1_CORE1_STALL_EN. Stalls unit 0 while core 1 is stalled."

[[registers.fields]]
name = "TIMER_UNIT0_CORE0_STALL_EN"
bits = "28"
class = "plain"
description = "Configures whether or not UNIT0 is stalled when CORE0 is stalled. See details in SYSTIMER_TIMER_UNIT1_CORE1_STALL_EN. Stalls unit 0 while core 0 is stalled."

[[registers.fields]]
name = "TIMER_UNIT1_WORK_EN"
bits = "29"
class = "plain"
description = "Configures whether or not to enable UNIT1. \\\\ 0: Disable\\\\ 1: Enable\\\\ Enables unit 1."

[[registers.fields]]
name = "TIMER_UNIT0_WORK_EN"
bits = "30"
class = "plain"
description = "Configures whether or not to enable UNIT0. \\\\ 0: Disable\\\\ 1: Enable\\\\ Enables unit 0."

[[registers.fields]]
name = "CLK_EN"
bits = "31"
class = "plain"
description = "Configures register clock gating. \\\\ 0: Only enable needed clock for register read or write operations. \\\\ 1: Register clock is always enabled for read and write operations. \\\\ Keeps the register clock enabled for every access."

[[registers]]
name = "UNIT0_OP"
offset = 0x4
description = "Read UNIT0 value to registers Unit zero's latch strobe and its done flag."
reset = { value = 0x0 }
reserved = { mask = 0x9fffffff, sources = ["ESP_IDF_4D59230D_SOC_ESP32S31_REGISTER_SOC_SYSTIMER_REG_H"] }

[[registers.fields]]
name = "TIMER_UNIT0_VALUE_VALID"
bits = "29"
class = "write-one-to-clear"
description = "Represents UNIT0 value is synchronized and valid. Set when the latched value is synchronized and valid (R/SS/WTC: a written one clears it, so the strobe writes zero here)."

[[registers.fields]]
name = "TIMER_UNIT0_UPDATE"
bits = "30"
class = "write-trigger"
