bits = "0"
class = "write-trigger"
description = "Write 1 to clear SYSTIMER_TARGET0_INT. Clears comparator 0's interrupt. Ordered CLR/future rearm delivers a fresh expiry; with equal programmed target0/1 ticks, CLR0 preserves pending1. Seeded low32/full52 counter crossings deliver a freshly armed target0 after CLR before counting. Exact coincident arrival/clear priority remains unproved. SOURCE: HW26_S31_SYSTIMER_REARM_WRAP_20261027."

