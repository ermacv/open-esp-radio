# A block type of the curated ESP32-S31 register model: no vendor header
# or SVD describes this block.
schema = 3

[type]
name = "BT_MAC"
description = "The Bluetooth MAC (BTMAC): controller core, scheduler, interrupt bank, BLE PHY initialization and BLE hardware runtime words. Known only from vendor binaries.\n\nWords 0x0-0x36c: Bluetooth controller-core register view grouped by runtime responsibility rather than vendor object boundaries. It owns task-side scheduler, sleep-timer, controller initialization, memory-list, scan-snapshot and ISO-coexistence state reached through the 0x20101000 physical block. Interrupt programming, enable/status, acknowledgement and fault diagnostics belong exclusively to BLUETOOTH_INTERRUPT_BANK; the two scheduler words accessed by the hard handler belong exclusively to BLUETOOTH_SCHEDULER_INTERRUPT_RUNTIME.\n\nWords 0xc-0x348: Bluetooth controller interrupt programming, enable, status, acknowledgement, snapshot and diagnostic registers. This physical view is independent from the controller task lifecycle so ownership can transfer to the hard ISR without also exposing scheduler, sleep or memory-management state.\n\nWords 0x18-0xffc: Sparse source-qualified word views in the existing owned MMIO aperture; individual meanings and side effects remain unknown.\n\nWords 0x78-0x1ec: Scheduler words and the MAC diagnostic-signal pair transferred with BLUETOOTH_INTERRUPT_BANK to the primary hard handler. The source-124 reference gate samples scheduler BUSY through the diagnostic pair and can write a complete zero image to SCHEDULER_REFERENCE; the later deferred-work observation reads SCHEDULER_STATE. Task-side scheduler transactions borrow this owner for their own BUSY samples, which serializes every selector write with its value reads. Keeping this sparse physical view outside the task-side controller partition prevents either owner from manufacturing an MMIO alias.\n\nWord 0x424: Narrow late-feature owner for the command written by two complete ISO-path functions. A positional capability is intentional: the observed write strobe is exact, while the undocumented hardware action is not inferred from the software queue context.\n\nWords 0x474-0x95c: ESP32-S31 BTMAC words initialized by the complete BLE PHY register-init function. The function identity is supported by the matching ble_phy.c object layout from the ESP32-C61 ecosystem library, while every address, mask and value below comes only from the ESP32-S31 artifact. Neutral INIT names retain the exact operation without promoting the cross-chip hint to hardware truth.\n\nWord 0x550: One independently bounded Bluetooth baseband reset-idle status word. The complete bbmac_idle_for_swrst leaf proves the exact predicate but neither address adjacency nor the function name proves a wider physical block.\n\nWords 0x80c-0x810: Three positional six-byte controller address slots. A complete ESP32-S31 ble_phy.c leaf proves the selector range, pair stride, byte packing and write order. Named callers identify public-address use of slot zero and random-address use of slot one; slot two remains intentionally unnamed.\n\nWords 0x878-0x87c: Two positional write-only words used by one ble_lll_sync.c path. The source identity records software context only; the register names deliberately do not turn that context into an undocumented hardware meaning.\n\nWord 0x880: Narrow owner for the standalone BLE resolving-list base publication. The complete ESP32-S31 ble_hw.c leaf proves one compressed SRAM pointer word but does not prove that adjacent BTMAC addresses belong to the same logical block.\n\nWords 0x970-0x978: Scan-backoff state of the Link Layer scanner (Core Specification Vol 6, Part B, 4.4.3.2). Scanner start publishes the maximum upper limit and initializes the two hardware-maintained backoff words to one; a vendor test command reads those two words back as nine-bit values. Which word is the backoff count and which the upper limit is not established.\n\nWords 0x99c-0x9a4: Direction-finding ring state recovered from complete ESP32-S31 ble_hw_cte.c leaves. Ordinary advertising, scanning and connection link states retain a controller-global disabled-CTE descriptor even when IQ sampling is not requested, so the baseline pointer and ownership fields are part of the minimum standalone BLE controller.\n\nWords 0xb30-0xb94: Sparse BLE hardware status/clear and runtime-configuration view. Complete ESP32-S31 functions prove the array geometry, access directions and exact configuration images. Positional names retain unknown source and field semantics instead of promoting diagnostic strings to hardware truth.\n\nWord 0xff0: Narrow owner for the otherwise unbounded word at 0x20101FF0. Complete ESP32-S31 BLE PHY initialization writes complete image zero followed by complete image one before touching any other radio register. The same ordered writes appear at the same block offset in the named ESP32-C61 counterpart, but neither artifact proves this word's hardware action or membership in the adjacent BTMAC dump range. No wider peripheral extent is claimed."
sources = ["BLOB_LIBBTDM_SCHEDULER_REGISTERS", "BLOB_LIBBTDM_SCHEDULER_LIFECYCLE", "BLOB_LIBBTDM_SCHEDULER_HEAD_PUBLICATION", "BLOB_LIBBTDM_HAL_CONTROLLER_INIT", "BLOB_LIBBTDM_SLEEP_TIMER_REGISTERS", "BLOB_LIBBTDM_SLEEP_TIMER_SNAPSHOT", "BLOB_LIBBLE_CONTROLLER_TRANSACTION_WORDS", "BLOB_LIBBLE_MMGMT_HW_LISTS", "BLOB_LIBBLE_ISO_COEX_REGISTERS", "BLOB_LIBBLE_SCAN_HW_SNAPSHOT", "BLOB_LIBBLE_CONTROLLER_OPERATIONAL_GAPS", "BLOB_LIBBTDM_SCHEDULER_OPERATIONAL_GAPS", "PUBLIC_ESP32S31_BT_SCHEDULER_ROLES", "BLOB_LIBBTDM_SCHEDULER_WAIT_TAIL", "BLOB_LIBBLE_PHY_INIT_REGISTERS", "BLOB_LIBBTDM_CONTROLLER_IRQ", "S31_MMIO_MODEM_RADIO_CORE_LOW", "BLOB_LIBBTDM_SCHEDULER_STATUS_DIAGNOSTIC", "BLOB_LIBBLE_DIAGNOSTIC_STATUS_DUMP", "BLOB_LIBBTDM_SCHEDULER_EXECUTION_MODIFY", "BLOB_LIBBLE_ISO_SCHEDULER_NOTIFY", "BLOB_LIBBTBB_BBMAC_IDLE_FOR_SWRST", "BLOB_LIBBLE_CONTROLLER_ADDRESS_SLOTS", "BLOB_LIBBLE_SYNC_PUBLICATION", "BLOB_LIBBLE_HW_RESOLV_LIST_SET", "BLOB_LIBBLE_SCAN_BACKOFF", "BLOB_LIBBLE_SCAN_BACKOFF_READBACK", "BLOB_LIBBLE_HW_CTE_RING_CONTROL", "BLOB_LIBBLE_HW_STATUS_CLEAR", "BLOB_LIBBLE_HW_RUNTIME_CONFIG"]

