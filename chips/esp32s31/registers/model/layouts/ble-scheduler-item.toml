schema = 1

[layout]
name = "BLE_SCHEDULER_ITEM"
description = "Common scheduler item shared by all five BLE role graphs. Hardware and software list links use different encodings. Role-private values retain their positional opaque fields."
size = 96
align = 4
placement = ["dma-window"]

[[layout.words]]
name = "HARDWARE_NEXT"
offset = 0x00
access = "shared"
description = "Observed word position; unassigned bits retain their exact image."

[[layout.words.fields]]
name = "ADDRESS"
bits = "19:0"
writer = "cpu"
description = "A graph link; zero denotes no link."
points-to = "BLE_SCHEDULER_ITEM"
encoding = "ble-compressed"

[[layout.words.fields]]
name = "BITS_20_21_OPAQUE"
bits = "21:20"
writer = "cpu"
description = "Observed position; the physical meaning is not established."

[[layout.words.fields]]
name = "FLEXIBLE_START"
bits = "22"
writer = "cpu"
description = "Allow an ordinary scheduler item to start after its predecessor ends. The DTM role selection also writes this positional lane."

