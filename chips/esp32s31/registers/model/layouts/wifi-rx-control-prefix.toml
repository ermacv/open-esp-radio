schema = 1

[layout]
name = "WIFI_RX_CONTROL_PREFIX"
description = """
The fixed RX-control prefix the Wi-Fi MAC writes at the start of a received
unit's first buffer: RSSI, PHY information and the local receive time. The
dynamic tail follows it after the optional HE-SIG-B and channel information."""
size = 56
align = 1

[[layout.bytes]]
name = "RSSI"
offset = 0x00
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "VALUE"
bits = "7:0"
writer = "hardware"
description = "The frame's RSSI in dBm, a signed byte."

[[layout.bytes]]
name = "RATE"
offset = 0x01
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "RATE"
bits = "4:0"
writer = "hardware"
description = "The PHY rate code; for 802.11b the transmission rate."

[[layout.bytes]]
name = "HE_SIGA1"
offset = 0x04
size = 4
access = "owned"

[[layout.bytes.fields]]
name = "VALUE"
bits = "31:0"
writer = "hardware"
description = "HE-SIG-A1, or HT-SIG for an HT PPDU, captured verbatim."

[[layout.bytes]]
name = "RXEND_STATE"
offset = 0x08
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "VALUE"
bits = "7:0"
writer = "hardware"
description = "The reception end state: 0 successful, others a failure."

[[layout.bytes]]
name = "HE_SIGA2"
offset = 0x09
size = 2
access = "owned"

[[layout.bytes.fields]]
name = "VALUE"
bits = "15:0"
writer = "hardware"
description = "HE-SIG-A2 captured verbatim."

[[layout.bytes]]
name = "TIMESTAMP"
offset = 0x0c
size = 4
access = "owned"

[[layout.bytes.fields]]
name = "VALUE"
bits = "31:0"
writer = "hardware"
description = "The MAC local time when the frame was received, a wrapping 32-bit value."

[[layout.bytes]]
name = "HE_MU_RU_SIZE"
offset = 0x1a
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "RU_SIZE"
bits = "1:0"
writer = "hardware"
description = "The HE-MU resource unit size."

[[layout.bytes]]
name = "HE_MU_RU_POSITION"
offset = 0x1e
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "RU_POSITION"
bits = "7:4"
writer = "hardware"
description = "The HE-MU resource unit position."

[[layout.bytes]]
name = "SINGLE_MPDU"
offset = 0x1f
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "SINGLE_MPDU"
bits = "0"
writer = "hardware"
description = "1: a VHT or HE single-MPDU A-MPDU (S-MPDU)."

[[layout.bytes]]
name = "BB_FORMAT"
offset = 0x25
size = 1
access = "owned"

[[layout.bytes.fields]]
name = "BB_FORMAT"
bits = "7:4"
writer = "hardware"
description = "The PPDU format (11b, 11g, HT, VHT, HE SU, HE MU, HE ER SU, HE TB, VHT MU)."

[[layout.bytes]]
name = "CHANNEL_ESTIMATE"
offset = 0x26
size = 2
access = "owned"

[[layout.bytes.fields]]
name = "LENGTH"
bits = "9:0"
writer = "hardware"
description = "The bytes of channel information (CSI) appended after the prefix and the HE-SIG-B bytes."

[[layout.bytes.fields]]
name = "VALID"
bits = "10"
writer = "hardware"
description = "1: the channel information is valid."

[[layout.bytes]]
name = "HE_SIG_B"
offset = 0x28
size = 4
access = "owned"

[[layout.bytes.fields]]
name = "SELECTED_USER"
bits = "20:0"
writer = "hardware"
description = "The selected HE-SIG-B user field."

[[layout.bytes.fields]]
name = "LENGTH_BITS"
bits = "23:21"
writer = "hardware"
description = "The HE-SIG-B length's bits beyond whole bytes."

[[layout.bytes.fields]]
name = "LENGTH_BYTES"
bits = "30:24"
writer = "hardware"
description = "The HE-SIG-B length's whole bytes."

[[layout.bytes.fields]]
name = "PRESENT"
bits = "31"
writer = "hardware"
description = "1: the complete HE-SIG-B bytes follow the prefix."

[[layout.bytes]]
name = "HE_MU_COMMON"
offset = 0x2c
size = 4
access = "owned"

[[layout.bytes.fields]]
name = "COMMON_INFO"
bits = "30:10"
writer = "hardware"
description = "The HE-SIG-B common field."

