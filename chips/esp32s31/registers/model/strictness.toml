[[registers]]
peripheral = "SPI1"
register = "SPI_MEM_CLOCK"
reserved = 0x7f000000
# The vendor SVD lacks CLK_EQU_SYSCLK, which the header calls reserved and
# ESP-IDF's driver writes; the header's fields.
define-fields = [
    { name = "SPI_MEM_CLKCNT_L", offset = 0, width = 8, description = "The clock low period; equal to SPI_MEM_CLKCNT_N." },
    { name = "SPI_MEM_CLKCNT_H", offset = 8, width = 8, description = "The clock high period: floor((SPI_MEM_CLKCNT_N + 1) / 2 - 1)." },
    { name = "SPI_MEM_CLKCNT_N", offset = 16, width = 8, description = "The divider: the flash command port's clock runs at the system clock over SPI_MEM_CLKCNT_N + 1." },
    { name = "SPI_MEM_CLK_EQU_SYSCLK", offset = 31, width = 1, description = "The clock is the system clock, undivided." },
]
sources = ["esp-idf:components/soc/esp32s31/register/soc/spi1_mem_c_reg.h:379", "esp-idf:components/soc/esp32s31/register/soc/spi1_mem_c_struct.h:415"]
# The driver computes the undivided clock's word as bit 31 and stores the
# word in `spimem_flash_ll_set_clock`; its callers carry it between them.
[[registers.driver-writes-word]]
field = "SPI_MEM_CLK_EQU_SYSCLK"
value = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/spimem_flash_ll.h:759"
return = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/spimem_flash_ll.h:763"
store = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/spimem_flash_ll.h:551"
