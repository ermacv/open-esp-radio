# The vendor SVD's field arrays of PSRAM_MSPI0's CACHE_FCTRL, as its header's
# fields; ESP-IDF's PSRAM driver writes its AXI enable, which the header
# keeps to internal debugging.
[[registers]]
peripheral = "MEMSPI2"
register = "CACHE_FCTRL"
define-fields = [
    { name = "AXI_REQ_EN", offset = 0, width = 1, description = "Allow AXI accesses to external RAM." },
    { name = "CACHE_USR_ADDR_4BYTE", offset = 1, width = 1, description = "The header's field CACHE_USR_ADDR_4BYTE." },
    { name = "CACHE_FLASH_USR_CMD", offset = 2, width = 1, description = "The header's field CACHE_FLASH_USR_CMD." },
    { name = "FDIN_DUAL", offset = 3, width = 1, description = "The header's field FDIN_DUAL." },
    { name = "FDOUT_DUAL", offset = 4, width = 1, description = "The header's field FDOUT_DUAL." },
    { name = "FADDR_DUAL", offset = 5, width = 1, description = "The header's field FADDR_DUAL." },
    { name = "FDIN_QUAD", offset = 6, width = 1, description = "The header's field FDIN_QUAD." },
    { name = "FDOUT_QUAD", offset = 7, width = 1, description = "The header's field FDOUT_QUAD." },
    { name = "FADDR_QUAD", offset = 8, width = 1, description = "The header's field FADDR_QUAD." },
    { name = "ARB_WEI_EN", offset = 9, width = 1, description = "The header's field ARB_WEI_EN." },
    { name = "ARB_REQ0_PRI", offset = 10, width = 1, description = "The header's field ARB_REQ0_PRI." },
    { name = "ARB_REQ1_PRI", offset = 11, width = 1, description = "The header's field ARB_REQ1_PRI." },
    { name = "ARB_REQ0_WEI", offset = 12, width = 4, description = "The header's field ARB_REQ0_WEI." },
    { name = "ARB_REQ1_WEI", offset = 16, width = 4, description = "The header's field ARB_REQ1_WEI." },
    { name = "SAME_AW_AR_ADDR_CHK_EN", offset = 30, width = 1, description = "The header's field SAME_AW_AR_ADDR_CHK_EN." },
    { name = "CLOSE_AXI_INF_EN", offset = 31, width = 1, description = "Close the AXI interface to external RAM." },
]
driver-writes = [
    { field = "AXI_REQ_EN", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:289" },
]
sources = ["esp-idf:components/soc/esp32s31/register/soc/spi_mem_s_reg.h:568"]

[[registers]]
peripheral = "MEMSPI2"
register = "CACHE_SCTRL"
reserved = 0xf0003000
driver-writes = [
    { field = "CACHE_USR_SADDR_4BYTE", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:120" },
    { field = "USR_WR_SRAM_DUMMY", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:134" },
    { field = "USR_RD_SRAM_DUMMY", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:149" },
    { field = "CACHE_SRAM_USR_RCMD", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:91" },
    { field = "SRAM_RDUMMY_CYCLELEN", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:150" },
    { field = "SRAM_WDUMMY_CYCLELEN", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:135" },
    { field = "SRAM_ADDR_BITLEN", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:107" },
    { field = "CACHE_SRAM_USR_WCMD", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:74" },
    { field = "SRAM_OCT", source = "esp-idf:components/esp_hal_mspi/esp32s31/include/hal/psram_ctrlr_ll.h:244" },
