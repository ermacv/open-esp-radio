# The header calls SRAM_OCT reserved, and ESP-IDF's PSRAM driver writes it;
# the header's fields.
define-fields = [
    { name = "CACHE_USR_SADDR_4BYTE", offset = 0, width = 1, description = "The header's field CACHE_USR_SADDR_4BYTE." },
    { name = "USR_SRAM_DIO", offset = 1, width = 1, description = "The header's field USR_SRAM_DIO." },
    { name = "USR_SRAM_QIO", offset = 2, width = 1, description = "The header's field USR_SRAM_QIO." },
    { name = "USR_WR_SRAM_DUMMY", offset = 3, width = 1, description = "The header's field USR_WR_SRAM_DUMMY." },
    { name = "USR_RD_SRAM_DUMMY", offset = 4, width = 1, description = "The header's field USR_RD_SRAM_DUMMY." },
    { name = "CACHE_SRAM_USR_RCMD", offset = 5, width = 1, description = "The header's field CACHE_SRAM_USR_RCMD." },
    { name = "SRAM_RDUMMY_CYCLELEN", offset = 6, width = 6, description = "The read dummy phase's length minus one." },
    { name = "SRAM_ADDR_BITLEN", offset = 14, width = 6, description = "The address phase's length minus one." },
    { name = "CACHE_SRAM_USR_WCMD", offset = 20, width = 1, description = "The header's field CACHE_SRAM_USR_WCMD." },
    { name = "SRAM_OCT", offset = 21, width = 1, description = "The cache's external RAM access uses eight lines." },
    { name = "SRAM_WDUMMY_CYCLELEN", offset = 22, width = 6, description = "The write dummy phase's length minus one." },
]
sources = ["esp-idf:components/soc/esp32s31/register/soc/spi_mem_s_reg.h:708", "esp-idf:components/soc/esp32s31/register/soc/spi_mem_s_struct.h:753"]

