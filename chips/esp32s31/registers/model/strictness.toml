# HP_SYS_CLKRST: components/soc/esp32s31/register/soc/hp_sys_clkrst_reg.h and hp_sys_clkrst_struct.h.

# A peripheral whose semantics the headers describe only in text gets no API
# at all; a typed API is added when its driver exists.
[[no-api]]
peripheral = "GMAC"
reason = "mixed semantics described only in text (gmac_reg.h): write-one-to-clear flags in R/W fields, reads that clear another register's flags, a self-clearing flush bit; typed API added when Ethernet is used"
