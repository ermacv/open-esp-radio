[[peripherals]]
name = "WIFI_MAC_RX_CSI_CONTROL"
description = "Multifunction receive/CSI word. Complete mac_last_rxbuf_init sets bit 27; complete hal_init later replaces its low and second bytes through separate RMWs."
baseAddress = 0x20104098

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "Complete mac_last_rxbuf_init sets bit 27 after publishing all six table entries and both control groups. Complete hal_init later replaces byte zero with one, then byte one with one through a second fresh-read edge."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_7_OPAQUE"
description = "Complete hal_init replaces bits 7:0 with one."
bitOffset = 0
bitWidth = 8

