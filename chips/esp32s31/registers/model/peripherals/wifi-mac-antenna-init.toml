[[peripherals]]
name = "WIFI_MAC_ANTENNA_INIT"
description = "Complete hal_attenna_init transaction. The misspelled vendor symbol first visits eight reverse-stride queue/vector words, then updates one common word."
baseAddress = 0x201042B0

[[peripherals.registers]]

[peripherals.registers.register]
name = "COMMON_CONTROL"
description = "Complete leaf clears bit 2, then sets bit 5 through a separate fresh-read RMW."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BIT_2_OPAQUE"
description = "Cleared by the penultimate RMW of the complete leaf."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_5_OPAQUE"
description = "Set by the final RMW of the complete leaf."
bitOffset = 5
bitWidth = 1


[[peripherals.registers.register.fields]]
name = "BITS_0_1_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 0
bitWidth = 2
[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x7C
dimIndex = "0,1,2,3"
name = "BANK_CONTROL%s"
description = "Lower four unique words of the eight-word antenna traversal, at 0x201051ac..0x20105320. The upper four words are the canonical WIFI_MAC_TX_QUEUE_VECTOR.LENGTH_CONTROL array, whose decoded antenna fields occupy the same bits."
addressOffset = 0xEFC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BIT_2_OPAQUE"
description = "Cleared for all eight words in the first reverse traversal."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_3_OPAQUE"
description = "Cleared in the first RMW of each word in the second reverse traversal."
bitOffset = 3
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_4_OPAQUE"
description = "Cleared in the third RMW of each word in the second reverse traversal."
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_5_OPAQUE"
description = "Set in the middle RMW of each word in the second reverse traversal."
bitOffset = 5
bitWidth = 1


[[peripherals.registers.register.fields]]
name = "BITS_0_1_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 0
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "BITS_6_31_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 6
bitWidth = 26
