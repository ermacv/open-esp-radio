[peripherals.registers.register]
name = "BF_MODE_CONTROL"
description = "Complete hal_init_bf clears bit two, then sets bit three through a separate fresh-read RMW. Complete esp_test_bf_set_feedback proves these same physical fields are the high-selector class and parity controls for its feedback modes; this is one canonical register identity rather than an address alias."
addressOffset = 0x54
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "HIGH_SELECTOR_CLASS"
description = "For test feedback selector values eight through fourteen, set exactly when selector is greater than nine. Complete hal_init_bf clears it."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HIGH_SELECTOR_PARITY"
description = "For test feedback selector values eight through fourteen, receives selector bit zero; selectors fifteen and sixteen clear it. Complete hal_init_bf sets it."
bitOffset = 3
bitWidth = 1

