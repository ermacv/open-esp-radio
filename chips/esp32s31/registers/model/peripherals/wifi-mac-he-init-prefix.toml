[[peripherals]]
name = "WIFI_MAC_HE_INIT_PREFIX"
description = "Complete hal_he_init prefix through hal_init_tb_tx, stopping immediately before hal_init_tx_pwr. Twenty-two separate RMW edges and one final synchronization/status read."
baseAddress = 0x20104048

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_FIELD_CONTROL"
description = "Canonical RX_HE_BSS_COLOR_CONF word. Complete dbg_read_color_collision names the fields; the HE init parent replaces TIMEOUT_SECONDS bits 8:3 with 0x3c. HE Operation programming sets COLOR_BITMAP_CLEAR to clear the accumulated BSS-color collision bitmap."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "COLOR_BITMAP_CLEAR"
description = "COLOR_BITMAP_CLR in complete dbg_read_color_collision. HE Operation programming sets this bit to clear the accumulated BSS-color collision bitmap."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITMAP_CONTROL_HIGH"
description = "High bit of the two-bit BITMAP diagnostic printed by complete dbg_read_color_collision. No independent write-side meaning is currently claimed."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TIMEOUT_SECONDS"
bitOffset = 3
bitWidth = 6

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3F

[[peripherals.registers.register.fields]]
name = "COLLISION_THRESHOLD"
bitOffset = 9
bitWidth = 4


