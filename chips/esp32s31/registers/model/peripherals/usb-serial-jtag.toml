schema = 2

[[peripherals]]
name = "USB_SERIAL_JTAG"
description = "USB Serial/JTAG controller: the CDC-ACM data FIFO, its configuration and the two interrupts of the serial endpoints. The JTAG side and the other interrupt sources are not described."
baseAddress = 0x20391000

[[peripherals.registers]]
[peripherals.registers.register]
name = "EP1"
description = "FIFO access for the CDC-ACM data IN and OUT endpoints: a write appends a byte to the IN FIFO, a read takes one from the OUT FIFO."
addressOffset = 0x00
size = 32
access = "read-write"
resetValue = 0x00000000
reserved = { mask = 0xffffff00, sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

[[peripherals.registers.register.fields]]
name = "RDWR_BYTE"
description = "One byte of the IN or OUT FIFO."
bitOffset = 0
bitWidth = 8

[[peripherals.registers]]
[peripherals.registers.register]
name = "EP1_CONF"
description = "Configuration and status of the CDC-ACM FIFOs."
addressOffset = 0x04
size = 32
access = "read-write"
resetValue = 0x00000002
reserved = { mask = 0xfffffff8, sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

[[peripherals.registers.register.fields]]
name = "WR_DONE"
description = "Writing one hands the bytes in the IN FIFO to the host as one packet; an empty FIFO sends a zero-length packet."
bitOffset = 0
bitWidth = 1
access = "write-only"

[[peripherals.registers.register.fields]]
name = "SERIAL_IN_EP_DATA_FREE"
description = "The IN FIFO has room for a byte. After WR_DONE it stays clear until the host has read the packet."
bitOffset = 1
bitWidth = 1
access = "read-only"

[[peripherals.registers.register.fields]]
name = "SERIAL_OUT_EP_DATA_AVAIL"
description = "The OUT FIFO holds a byte to read."
bitOffset = 2
bitWidth = 1
access = "read-only"

[[peripherals.registers]]
[peripherals.registers.register]
name = "INT_ST"
description = "Masked interrupt status of the serial endpoints."
addressOffset = 0x0c
size = 32
access = "read-only"
resetValue = 0x00000000
reserved = { mask = 0xffff0000, sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

[[peripherals.registers.register.fields]]
name = "SERIAL_OUT_RECV_PKT_INT_ST"
description = "The OUT endpoint received a packet, and its interrupt is enabled."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SERIAL_IN_EMPTY_INT_ST"
description = "The IN endpoint became empty, and its interrupt is enabled."
bitOffset = 3
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "INT_ENA"
description = "Interrupt enables of the serial endpoints."
addressOffset = 0x10
size = 32
access = "read-write"
resetValue = 0x00000000
reserved = { mask = 0xffff0000, sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

[[peripherals.registers.register.fields]]
name = "SERIAL_OUT_RECV_PKT_INT_ENA"
description = "Enables the OUT endpoint's packet-received interrupt."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SERIAL_IN_EMPTY_INT_ENA"
description = "Enables the IN endpoint's empty interrupt."
bitOffset = 3
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "INT_CLR"
description = "Interrupt acknowledgement of the serial endpoints: writing one clears the event."
addressOffset = 0x14
size = 32
access = "write-only"
resetValue = 0x00000000
reserved = { mask = 0xffff0000, sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

# SOURCE: ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG; INT_CLR acknowledges sampled events.
modifiedWriteValues = "oneToClear"

[[peripherals.registers.register.fields]]
name = "SERIAL_OUT_RECV_PKT_INT_CLR"
description = "Writing one clears the OUT endpoint's packet-received event."
bitOffset = 2
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SERIAL_IN_EMPTY_INT_CLR"
description = "Writing one clears the IN endpoint's empty event."
bitOffset = 3
bitWidth = 1

[[peripherals]]
name = "USB_SERIAL_JTAG_PADS"
description = "USB Serial/JTAG pad configuration: the software override of the D+ and D- pull-ups and the pad enable."
baseAddress = 0x20391000

[[peripherals.registers]]
[peripherals.registers.register]
name = "CONF0"
description = "PHY and pad configuration. Only the pull-up override and the pad enable are described."
addressOffset = 0x18
size = 32
access = "read-write"
resetValue = 0x00004200
reserved = { mask = 0xfffe0001, sources = ["ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"] }

[[peripherals.registers.register.fields]]
name = "PAD_PULL_OVERRIDE"
description = "Software controls the D+ and D- pull-ups and pull-downs."
bitOffset = 8
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "DP_PULLUP"
description = "D+ pull-up, while PAD_PULL_OVERRIDE is set."
bitOffset = 9
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "DM_PULLUP"
description = "D- pull-up, while PAD_PULL_OVERRIDE is set."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "USB_PAD_ENABLE"
description = "Enables the USB pad function."
bitOffset = 14
bitWidth = 1

