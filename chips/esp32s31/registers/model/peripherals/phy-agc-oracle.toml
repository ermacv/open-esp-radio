schema = 2

[[peripherals]]
name = "PHY_AGC_ORACLE"
description = """
OPAQUE PHY AGC,
        PBus-pulse, antenna, RX-compensation, DC-memory, post-initialization
        and 11b-control registers recovered from complete, finite rev0
        ROM/blob bodies. One physical register has one identity even when
        independent bodies prove different fields. Names describe their
        proven operation role, not an unevidenced electrical identity."""
baseAddress = 0x20100000

[[peripherals.registers]]

[peripherals.registers.register]
name = "AGC_PARAMETER_CONTROL"
description = "Complete phy_agc_reg_init performs two fresh-read parameter-derived field replacements."
addressOffset = 0x8BC
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_4_11_OPAQUE"
description = "First update writes parameter byte 0x121 into bits 11:4."
bitOffset = 4
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "BITS_12_19_OPAQUE"
description = "Second update writes the low eight bits of parameter byte 0x120 plus 0x50 into bits 19:12."
bitOffset = 12
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "AGC_SHARED_CONTROL"
description = "Shared word updated by complete phy_agc_reg_init, phy_enable_agc, phy_pbus_force_mode, phy_force_rx_gain, phy_set_rx_comp_new, and the final limit tail of phy_set_rx_gain_table."
addressOffset = 0x702C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_7_OPAQUE"
description = "Complete phy_set_rx_comp_new writes 0xed into bits 7:0."
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers.register.fields]]
name = "WIFI_MAX_GAIN_INDEX"
description = "Highest Wi-Fi receive-gain table index: librftest rx_max_gain returns these bits for its Wi-Fi path. Complete phy_agc_reg_init writes parameter byte 0x121 and phy_set_rx_gain_table the final Wi-Fi RX gain index after table publication."
bitOffset = 8
bitWidth = 7

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7F

[[peripherals.registers.register.fields]]
name = "FORCED_GAIN_ENABLE"
description = "Enables the forced receive-gain index in FORCED_GAIN_INDEX. Complete phy_force_rx_gain and the Wi-Fi path of librftest force_rx_gain replace it with the low bit of their enable argument; librftest clears it and waits 5 us after writing the index before setting it. Complete phy_enable_agc and the delayed tail of phy_pbus_force_mode pulse it."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "FORCED_GAIN_INDEX"
description = "Receive-gain table index applied while FORCED_GAIN_ENABLE is set. Complete phy_force_rx_gain and the Wi-Fi path of librftest force_rx_gain write their gain argument here before the enable bit; complete phy_agc_reg_init and the delayed phy_pbus_force_mode tail write 0x32 into bits 31:24 before pulsing bit 23, so a PBus work-mode transition replaces any previously forced index."
bitOffset = 24
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "AGC_ANTENNA_CONTROL"
description = "Shared word updated independently by complete AGC enable/disable, antenna initialization and frequency-band selection bodies."
