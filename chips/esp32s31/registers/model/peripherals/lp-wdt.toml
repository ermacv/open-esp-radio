schema = 2

[[peripherals]]
name = "LP_WDT"
description = "The RTC watchdog (RWDT) of the low-power watchdog block: its configuration word and write protection. The super watchdog's words are the separate LP_WDT_SWD view."
baseAddress = 0x20801000

[[peripherals.registers]]
[peripherals.registers.register]
name = "CONFIG0"
description = "RTC watchdog enable, stage actions and reset lengths; written only while unlocked."
addressOffset = 0x00
size = 32
access = "read-write"
resetValue = 0x00013200
reserved = { mask = 0x000001ff, sources = ["ESP_IDF_4D59230D_S31_RTC_WDT"] }

[[peripherals.registers.register.fields]]
name = "WDT_PAUSE_IN_SLP"
description = "Pauses the watchdog while the chip sleeps."
bitOffset = 9
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "WDT_APPCPU_RESET_EN"
description = "Unmasks the CPU reset of the application core."
bitOffset = 10
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "WDT_PROCPU_RESET_EN"
description = "Unmasks the CPU reset of the protocol core."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "WDT_FLASHBOOT_MOD_EN"
description = "Flash boot protection: the ROM arms it; a timeout resets even while WDT_EN is clear."
bitOffset = 12
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "WDT_SYS_RESET_LENGTH"
description = "System reset signal length selector."
bitOffset = 13
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "WDT_CPU_RESET_LENGTH"
description = "CPU reset signal length selector."
bitOffset = 16
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "WDT_STG3"
description = "Timeout action of stage 3: 0 none, 1 interrupt, 2 CPU reset, 3 system reset, 4 RTC reset."
bitOffset = 19
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "WDT_STG2"
description = "Timeout action of stage 2: 0 none, 1 interrupt, 2 CPU reset, 3 system reset, 4 RTC reset."
bitOffset = 22
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "WDT_STG1"
description = "Timeout action of stage 1: 0 none, 1 interrupt, 2 CPU reset, 3 system reset, 4 RTC reset."
bitOffset = 25
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "WDT_STG0"
description = "Timeout action of stage 0: 0 none, 1 interrupt, 2 CPU reset, 3 system reset, 4 RTC reset."
bitOffset = 28
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "WDT_EN"
description = "RTC watchdog enable."
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "WPROTECT"
description = "RTC watchdog write protection: the key unlocks CONFIG0 to FEED, any other value locks them."
addressOffset = 0x18
size = 32
access = "read-write"
resetValue = 0x00000000

[[peripherals.registers.register.fields]]
name = "WDT_WKEY"
description = "Write key; 0x50D83AA1 unlocks."
bitOffset = 0
bitWidth = 32

[[peripherals]]
name = "LP_WDT_SWD"
description = "The super watchdog (SWD) of the low-power watchdog block: its configuration word and write protection."
baseAddress = 0x20801000

[[peripherals.registers]]
[peripherals.registers.register]
name = "SWD_CONFIG"
description = "Super watchdog control; written only while unlocked."
addressOffset = 0x1c
size = 32
access = "read-write"
resetValue = 0x12c00000
reserved = { mask = 0x0003fffe, sources = ["ESP_IDF_4D59230D_S31_RTC_WDT"] }

[[peripherals.registers.register.fields]]
name = "SWD_RESET_FLAG"
description = "Set when the super watchdog reset the chip."
bitOffset = 0
bitWidth = 1
access = "read-only"

[[peripherals.registers.register.fields]]
name = "SWD_AUTO_FEED_EN"
description = "The hardware feeds the super watchdog by itself."
bitOffset = 18
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SWD_RST_FLAG_CLR"
description = "Writing one clears SWD_RESET_FLAG; reads zero."
bitOffset = 19
bitWidth = 1
access = "write-only"

[[peripherals.registers.register.fields]]
name = "SWD_SIGNAL_WIDTH"
description = "Width of the super watchdog's reset signal."
bitOffset = 20
bitWidth = 10

[[peripherals.registers.register.fields]]
name = "SWD_DISABLE"
description = "Disables the super watchdog."
bitOffset = 30
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SWD_FEED"
description = "Writing one feeds the super watchdog; reads zero."
bitOffset = 31
bitWidth = 1
access = "write-only"

[[peripherals.registers]]
[peripherals.registers.register]
name = "SWD_WPROTECT"
description = "Super watchdog write protection: the key unlocks SWD_CONFIG, any other value locks it."
addressOffset = 0x20
size = 32
access = "read-write"
resetValue = 0x00000000

[[peripherals.registers.register.fields]]
name = "SWD_WKEY"
description = "Write key; 0x50D83AA1 unlocks."
bitOffset = 0
bitWidth = 32

