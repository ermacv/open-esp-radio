[[peripherals]]
name = "WIFI_MAC_TX_QUEUE_CONTROL"
description = "Four ascending physical banks represent logical EDCA queues 3,2,1,0."
baseAddress = 0x20104D34

[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x10
dimIndex = "0,1,2,3"
name = "PROTECTION%s"
description = "Canonical WDEVTXQ_CONF2. Complete dbg_read_txq_conf2 names the three ten-bit lanes TXQ_MIN_MPDU_LEN for CBW20, CBW40 and CBW80, followed by SW_CTS at bit 30 and SW_RTS at bit 31. For HT, complete libpp[hal_mac_tx.o]::mac_tx_set_htsig copies peer state offset 0x82 into all three lanes; complete rcUpdateAMPDUParam derives that value from the HT A-MPDU minimum MPDU start-spacing code. For HE, complete libpp[pp_he.o]::ppCalDeliNum stores the rate/GI/DCM/density-specific minimum subframe byte count at descriptor offset 0x28 and complete libpp[hal_mac_tx.o]::mac_tx_set_hesig copies that halfword into all three lanes. The HE init suffix clears only SW_CTS in this same word, preserving SW_RTS and all three spacing lanes. A coherent hardware-owned vendor HT queue contained 0x0280a028, exactly three copies of negotiated value 40. Open HE20 MCS9 HIL with 16-us density proved value 230: fixed snapshot 0x31 lost all 32 MPDUs, while three copies of 230 received a full first-attempt BlockAck with 43 empty delimiters per non-final subframe. The descriptor-count RMWs target the separate queue-vector word at 0x20105504-q*0x7c."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW20"
description = "First copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
bitOffset = 0
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW40"
description = "Second copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
bitOffset = 10
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "MINIMUM_MPDU_LENGTH_CBW80"
description = "Third copy of the HT peer-derived or HE rate/density-derived minimum MPDU/subframe value."
bitOffset = 20
bitWidth = 10

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x3FF

[[peripherals.registers.register.fields]]
name = "SOFTWARE_RTS"
description = "Complete dbg_read_txq_conf2 passes bit 31 as the SW_RTS format argument at sp+4; hal_he_set_tx_protection updates this bit from its enable argument. Bounded HT40 MCS7 SGI diagnostics observe hardware-generated RTS to the data receiver followed by CTS, data and ACK/BlockAck, including control frames on both 20-MHz halves. Ordinary protected admission and the complete automatic NAV algorithm remain separate contracts."
bitOffset = 31
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SOFTWARE_CTS"
description = "Complete dbg_read_txq_conf2 passes bit 30 as the SW_CTS format argument at sp+8. Bounded HT40 MCS7 SGI diagnostics observe hardware-generated CTS addressed to the transmitter before unicast data, on both 20-MHz halves. This establishes the request in that profile; it does not qualify the full ordinary protected-publication lifecycle."
bitOffset = 30
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
dim = 4
dimIncrement = 0x10
dimIndex = "0,1,2,3"
name = "CONFIG%s"
description = "Timeout, contention window, interface, AIFSN and scheduler-priority fields configured as distinct recovered RMW edges. Scheduler priority is not the original packet PTI retained in the vector bank."
addressOffset = 0x8
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "TIMEOUT"
bitOffset = 0
bitWidth = 12

[peripherals.registers.register.fields.writeConstraint.range]
