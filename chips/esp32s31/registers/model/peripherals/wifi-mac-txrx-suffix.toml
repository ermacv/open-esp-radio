schema = 2

[[peripherals]]
name = "WIFI_MAC_TXRX_SUFFIX"
description = "Eight Wi-Fi-owned direct fresh-read RMW edges after the three external HE callbacks in complete mac_txrx_init. The ninth edge reaches the independently shared physical word at 0x20104C24 and is modeled by SHARED_RADIO_INIT_CONTROL."
baseAddress = 0x20104308

[[peripherals.registers]]

[peripherals.registers.register]
name = "AUX_ENABLE"
description = "The TX/RX init suffix sets bit 1. Complete dbg_clr_hw_count reaches esp_test_clr_hw_statistics, which independently pulses bit 0 high then low while the matching core statistics-clear arm is asserted."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "HARDWARE_STATISTICS_CLEAR_PULSE"
description = "Set and then cleared by complete esp_test_clr_hw_statistics."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_1_OPAQUE"
bitOffset = 1
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "DEFAULT_IMAGE_A"
description = "Complete suffix replaces the low twelve bits with 0x0f0."
addressOffset = 0x918
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_11_OPAQUE"
bitOffset = 0
bitWidth = 12

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "GATE_CONTROL"
description = "Complete suffix sets bits 30:16 together, then sets bit 31 through a separate fresh-read edge."
addressOffset = 0x958
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_16_30_OPAQUE"
bitOffset = 16
bitWidth = 15

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0x7FFF

[[peripherals.registers.register.fields]]
name = "BIT_31_OPAQUE"
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "FIELD_CONTROL"
description = "Complete suffix replaces bits 7:4 with four."
addressOffset = 0x9A0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_4_7_OPAQUE"
bitOffset = 4
bitWidth = 4

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xF


[[peripherals.registers.register.fields]]
name = "BIT_3_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 3
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_8_12_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 8
bitWidth = 5
