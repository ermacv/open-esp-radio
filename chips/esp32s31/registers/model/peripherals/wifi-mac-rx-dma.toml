schema = 2

[[peripherals]]
name = "WIFI_MAC_RX_DMA"
description = """
Descriptor-walker registers
        recovered from complete rev0 ROM leaves and qualified with the open
        driver's rotating 32-entry RX ring."""
baseAddress = 0x20104000

[[peripherals.registers]]

[peripherals.registers.register]
name = "WORD_007C_OPAQUE"
description = "Complete mac_rxbuf_init clears the low byte immediately before publishing the descriptor base. Individual bit meanings are unknown."
addressOffset = 0x7C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_7_OPAQUE"
bitOffset = 0
bitWidth = 8

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFF


[[peripherals.registers.register.fields]]
name = "BIT_28_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 28
bitWidth = 1
[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_CONTROL"
description = "RX descriptor-walker gate, hardware-beacon reload selection and live-list append doorbell."
addressOffset = 0x80
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "APPEND_DESCRIPTOR_RELOAD"
description = "Write one after publishing old_tail.next to make a prepared live-list append visible. Hardware clears the bit after accepting the append."
bitOffset = 0
bitWidth = 1
modifiedWriteValues = "clear"

[[peripherals.registers.register.fields]]
name = "WALKER_ENABLE"
description = "Set by libpp[hal_mac.o]::hal_mac_rx_enable and cleared by libpp[hal_mac.o]::hal_mac_rx_disable; gates the RX descriptor walker."
bitOffset = 31
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_27_OPAQUE"
description = "Complete hal_mac_set_rxbuf_reload_use_hw_beacon_enable sets bit 27 through one fresh-read RMW."
bitOffset = 27
bitWidth = 1


[[peripherals.registers.register.fields]]
name = "BITS_1_26_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 1
bitWidth = 26

[[peripherals.registers.register.fields]]
name = "BITS_28_30_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 28
bitWidth = 3
[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_DESCRIPTOR_BASE"
description = "Complete first-descriptor address. The ROM and blob leaves publish the unmasked 32-bit pointer when installing a cold or repaired frontier; the selected high-address window separately completes the hardware last/next descriptor observations."
addressOffset = 0x84
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ADDRESS"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_NEXT_DESCRIPTOR"
description = "Complete hardware current/next descriptor word. The low 20 bits are the reviewed address projection; meanings of bits 31:20 remain unknown. Complete ROM rom[]::wDev_AppendRxBlocks compares the entire 32-bit word with zero after reload completion, not only ADDRESS_LOW, before it may read LAST and repair RX_DESCRIPTOR_BASE."
addressOffset = 0x88
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "ADDRESS_LOW"
bitOffset = 0
bitWidth = 20

[[peripherals.registers.register.fields]]
name = "BITS_20_31_OPAQUE"
description = "Unassigned upper state retained by the complete-word zero predicate in rom[]::wDev_AppendRxBlocks. This is deliberately exposed separately from ADDRESS_LOW so production code never reconstructs or masks a register image."
bitOffset = 20
bitWidth = 12

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_LAST_DESCRIPTOR"
description = "Low 20 bits of the last descriptor accepted by the RX walker."
addressOffset = 0x8C
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "ADDRESS_LOW"
bitOffset = 0
bitWidth = 20


[[peripherals.registers.register.fields]]
name = "BITS_20_31_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 20
bitWidth = 12
[[peripherals.registers]]

[peripherals.registers.register]
name = "WORD_0C68_OPAQUE"
description = "Complete mac_rxbuf_init sets the low twenty bits before descriptor publication."
addressOffset = 0xC68
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_19_OPAQUE"
bitOffset = 0
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "WORD_0C6C_OPAQUE"
description = "Complete mac_rxbuf_init replaces the low twenty bits with four before selecting the descriptor high window."
addressOffset = 0xC6C
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_19_OPAQUE"
bitOffset = 0
bitWidth = 20

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "RX_DESCRIPTOR_HIGH_WINDOW"
description = "High 12 descriptor-address bits shared with the low-address RX pointer registers. Complete mac_rxbuf_init and the open driver program 0x2f0 for internal SRAM."
addressOffset = 0xC70
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "ADDRESS_HIGH"
bitOffset = 20
bitWidth = 12

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFF

