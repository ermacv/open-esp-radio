schema = 2

[[peripherals]]
name = "WIFI_MAC_BEAMFORMING_FEEDBACK_TEST"
description = "Test-only beamforming-feedback selector written by complete esp_test_bf_set_feedback. The write transforms and selector branches are exact; the public meaning of selector values zero through sixteen is not present in the archive, so only bounded functional names are assigned."
baseAddress = 0x20104E00

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONFIGURATION"
description = "A zero enable argument clears ENABLE only. A nonzero argument first sets ENABLE, clears FEEDBACK_SUBMODE_B, replaces both seven-bit auxiliary arguments, then applies selector-dependent updates to the remaining submode fields. Selector sixteen replaces the complete word with ENABLE plus FEEDBACK_SUBMODE_B value one."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "AUXILIARY_ARGUMENT_LOW"
description = "Low seven-bit argument passed as esp_test_bf_set_feedback argument two."
bitOffset = 0
bitWidth = 7

[[peripherals.registers.register.fields]]
name = "AUXILIARY_ARGUMENT_HIGH"
description = "High seven-bit argument passed as esp_test_bf_set_feedback argument three."
bitOffset = 7
bitWidth = 7

[[peripherals.registers.register.fields]]
name = "FEEDBACK_SUBMODE_A"
description = "Three-bit selector-dependent field. Complete branches publish one for selector thirteen and five for selector fourteen."
bitOffset = 14
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "FEEDBACK_SELECTOR_LOW"
description = "For selectors zero through seven this field receives the three-bit selector. The higher selector classes update it only partially or clear it."
bitOffset = 17
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "FEEDBACK_SUBMODE_B"
description = "Three-bit selector-dependent field. The common enabled prefix clears it; selectors twelve and sixteen publish one."
bitOffset = 20
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "ENABLE"
description = "A nonzero enable argument sets this bit; zero clears it."
bitOffset = 23
bitWidth = 1


[[peripherals.registers.register.fields]]
name = "BITS_24_31_OPAQUE"
description = "Observed source use; the individual hardware meaning is unknown."
bitOffset = 24
bitWidth = 8
