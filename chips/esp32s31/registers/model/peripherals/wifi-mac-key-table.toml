[[peripherals]]
name = "WIFI_MAC_KEY_TABLE"
description = """
Twenty-five entries of ten 32-bit words. Complete
        hal_crypto_clr_key_entry proves the 0x28-byte stride and all ten
        ordered stores; set/get leaves prove the peer/control/key layout:
        the peer address and control word, four words of temporal key and
        four words the CCMP transaction only clears."""
baseAddress = 0x20105800

