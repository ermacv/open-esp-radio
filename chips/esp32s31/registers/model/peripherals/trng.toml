description = "Cutoff of the repetition-count health test."
bitOffset = 10
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "ADPATIVE_VALUE_C"
description = "Cutoff of the adaptive-proportion health test."
bitOffset = 19
bitWidth = 9

[[peripherals.registers.register.fields]]
name = "FIFO_RESET"
