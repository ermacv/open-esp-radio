schema = 2

[[peripherals]]
name = "LP_AON_RESET_CAUSE"
description = "Low-power always-on clock/reset registers: the reset cause of each HP core. Firmware reads them after boot; the host reads HP core 0's through JTAG after a power cycle."
baseAddress = 0x20701000

[[peripherals.registers]]
[peripherals.registers.register]
name = "HPCORE0_RESET_CAUSE"
description = "Why HP core 0 last left reset. It holds until the next reset, so a host reads it through JTAG after the core returned; the ROM reads bits 6:1 of this word for core 0."
addressOffset = 0x30
size = 32
access = "read-only"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "HPCORE0_RESET_FLAG"
description = "Set when HP core 0 left reset."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HPCORE0_RESET_CAUSE"
description = "The reset cause code: one is a power-on reset; others are system, watchdog, brown-out, USB Serial/JTAG and JTAG resets."
bitOffset = 1
bitWidth = 6

[[peripherals.registers]]
[peripherals.registers.register]
name = "HPCORE1_RESET_CAUSE"
description = "Why HP core 1 last left reset. It holds until the next reset; the ROM reads bits 6:1 of this word for any core but core 0."
addressOffset = 0x34
size = 32
access = "read-only"
resetValue = 0
reserved = { mask = 0x3fffff80, sources = ["ESP_IDF_4D59230D_S31_LP_CLKRST_HPCORE1"] }

[[peripherals.registers.register.fields]]
name = "HPCORE1_RESET_FLAG"
description = "Set when HP core 1 left reset."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "HPCORE1_RESET_CAUSE"
description = "The reset cause code, with the codes of HP core 0's cause field."
bitOffset = 1
bitWidth = 6

