[[peripherals.registers]]
[peripherals.registers.register]
name = "WORD_0204_OPAQUE"
description = "Complete operational functions independently set and clear bit zero through fresh-read RMW operations. The scheduler cancellation path sets bit zero after publishing its hardware-list index in WORD_036C_OPAQUE bits 7:4 and acknowledging interrupt source 7, waits on WORD_0324_OPAQUE and WORD_0208_OPAQUE, and clears bit zero after its skip requests. The hardware effect of bit zero is not established."
addressOffset = 0x204
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "CONTROL_0"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "WORD_0208_OPAQUE"
description = "Two complete operational functions, the scheduler cancellation paths, consume bit zero as the second wait predicate after setting WORD_0204_OPAQUE bit zero. They continue waiting while this bit is one and the diagnostic scheduler BUSY sample is set. The remaining bits and the hardware meaning of bit zero are unknown."
addressOffset = 0x208
size = 32
access = "read-only"
[[peripherals.registers.register.fields]]
name = "STATUS_0"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "SCHEDULER_LOCK_MODIFY_REQUEST"
description = "The scheduler insert-with-lock-modify path publishes START with a compressed SRAM pointer. Before and after publication it may progress whenever either START or the diagnostic scheduler BUSY sample is clear. When that publication wait ends it reports zero when BUSY is clear, otherwise the positional four-bit RESULT image returned in bits 30:27; this is not radio-item completion."
addressOffset = 0x218
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "COMPRESSED_SRAM_POINTER"
bitOffset = 0
bitWidth = 20
[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0
maximum = 0xfffff
[[peripherals.registers.register.fields]]
name = "ZERO_IMAGE_20_26"
bitOffset = 20
bitWidth = 7
[[peripherals.registers.register.fields]]
name = "RESULT"
bitOffset = 27
bitWidth = 4
[[peripherals.registers.register.fields]]
name = "START"
bitOffset = 31
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "WORD_0324_OPAQUE"
description = "The two scheduler cancellation paths read this word after setting WORD_0204_OPAQUE bit zero and wait while bit zero is clear and the diagnostic scheduler BUSY sample is set. The remaining bits and the hardware meaning of bit zero are unknown."
addressOffset = 0x324
size = 32
access = "read-only"
[[peripherals.registers.register.fields]]
name = "STATUS_0"
bitOffset = 0
bitWidth = 1

[[peripherals.registers]]
[peripherals.registers.register]
name = "WORD_036C_OPAQUE"
description = "Scheduler operational word shared by several controller paths. The scheduler insert-with-lock-modify path clears, then publishes, the zero-based hardware-list index in bits 3:0 through two distinct fresh-read field updates before publishing SCHEDULER_LOCK_MODIFY_REQUEST. The scheduler cancellation path does the same for bits 7:4 before setting WORD_0204_OPAQUE bit zero. Other fields remain unassigned."
addressOffset = 0x36C
size = 32
access = "read-write"
[[peripherals.registers.register.fields]]
name = "LOCK_MODIFY_HARDWARE_LIST_INDEX"
description = "Zero-based hardware-list index cleared and then published by scheduler insert-with-lock-modify."
