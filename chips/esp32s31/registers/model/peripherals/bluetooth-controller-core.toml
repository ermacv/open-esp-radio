schema = 2

[[peripherals]]
name = "BLUETOOTH_CONTROLLER_CORE"
description = """
Bluetooth controller-core register view grouped by runtime responsibility rather
than vendor object boundaries. It owns task-side scheduler, sleep-timer,
controller initialization, memory-list, scan-snapshot and ISO-coexistence state
reached through the 0x20101000 physical block. Interrupt programming,
enable/status, acknowledgement and fault diagnostics belong exclusively to
BLUETOOTH_INTERRUPT_BANK; the two scheduler words accessed by the hard handler
belong exclusively to BLUETOOTH_SCHEDULER_INTERRUPT_RUNTIME.
"""
baseAddress = 0x20101000

[[peripherals.registers]]
[peripherals.registers.register]
name = "SCHEDULER_CONTROL"
description = "Final hardware command of scheduler run. The complete current run prologue always returns zero after dynamic IRQ preparation and synchronous broker publication, so the following complete leaf writes finite image 1; the same-chip named predecessor identifies the composed operation as r_btdm_sched_run."
addressOffset = 0x0
size = 32
access = "write-only"
[[peripherals.registers.register.fields]]
name = "COMMAND"
description = "Complete final scheduler hardware-run command image."
bitOffset = 0
bitWidth = 32
[peripherals.registers.register.fields.writeConstraint]
useEnumeratedValues = true
[[peripherals.registers.register.fields.enumeratedValues]]
usage = "write"
[[peripherals.registers.register.fields.enumeratedValues.values]]
name = "RUN"
description = "Request scheduler execution after a hardware-list head publication."
value = 1
