minimum = 0
maximum = 0x0F
[[peripherals.registers.register.fields]]
name = "CANCELLATION_HARDWARE_LIST_INDEX"
description = "Zero-based hardware-list index cleared and then published by the scheduler cancellation path before it sets WORD_0204_OPAQUE bit zero."
