schema = 2

[[peripherals]]
name = "WIFI_MAC_TSF_LOAD"
description = "Shared TSF load and coherent station/SoftAP snapshot transaction."
baseAddress = 0x2010D814

[[peripherals.registers]]

[peripherals.registers.register]
name = "CONTROL"
description = "Complete hal_set_sta_tsf asserts bit four after writing both station TSF value words; the SoftAP path of complete hal_mac_tsf_reset asserts bit five after clearing both shared TSF value words; complete libpp[hal_tsf.o]::hal_get_sta_tsf sets then clears bit zero around its snapshot reads. Complete libpp[hal_mac.o]::hal_get_tsf_time selects station with bit zero or SoftAP with bit one, reads the shared snapshot words, then clears that selector through a fresh-read RMW. The whole select/read/release transaction must be serialized across TSF domains."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "SNAPSHOT_STATION_TSF"
description = "Complete libpp[hal_tsf.o]::hal_get_sta_tsf sets this bit before either station TSF word is sampled and clears it after the optional reads."
bitOffset = 0
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "SNAPSHOT_SOFTAP_TSF"
description = "SoftAP TSF-1 snapshot selector. Complete libpp[hal_mac.o]::hal_get_tsf_time with a nonzero argument sets this bit, reads SNAPSHOT_HIGH then SNAPSHOT_LOW, and clears this bit through a fresh-read RMW. Both readback words are shared with the station snapshot; this selector does not establish on-air beacon or probe-response timestamp insertion."
bitOffset = 1
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "LOAD_STATION_TSF"
description = "Station TSF load request asserted by the final fresh-read RMW in hal_set_sta_tsf."
bitOffset = 4
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "LOAD_SOFTAP_TSF"
description = "SoftAP TSF load request asserted after the two zero-value writes by the arg0=0 path of complete hal_mac_tsf_reset."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "LOAD_STATION_TBTT_TARGET"
description = "Complete hal_set_sta_tbtt and the index-0 TBTT start-time leaf set this bit after writing the station TBTT target."
bitOffset = 8
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
name = "VALUE_LOW"
description = "Low 32 bits written first by complete hal_set_sta_tsf."
addressOffset = 0x4
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "VALUE_HIGH"
description = "High 32 bits written second by complete hal_set_sta_tsf."
addressOffset = 0x8
size = 32
access = "write-only"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "SNAPSHOT_LOW"
description = "Shared coherently latched low 32 bits: conditionally read by complete libpp[hal_tsf.o]::hal_get_sta_tsf for station and read by complete libpp[hal_mac.o]::hal_get_tsf_time for the selected station/SoftAP domain."
addressOffset = 0xC
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "SNAPSHOT_HIGH"
description = "Shared coherently latched high 32 bits: conditionally read by complete libpp[hal_tsf.o]::hal_get_sta_tsf for station and read by complete libpp[hal_mac.o]::hal_get_tsf_time for the selected station/SoftAP domain."
addressOffset = 0x10
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "VALUE"
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "TSF_DEVIATION_CONTROL"
description = "Complete ROM leaves independently replace the TSF deviation value and set two synchronization controls; omitted bits remain semantically unknown."
addressOffset = 0x14
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "DEVIATION"
bitOffset = 0
bitWidth = 16

[[peripherals.registers.register.fields]]
name = "RX_BEACON_ABORT_SYNC_ENABLE"
bitOffset = 16
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "DEVIATION_SYNC_ENABLE"
bitOffset = 19
bitWidth = 1

