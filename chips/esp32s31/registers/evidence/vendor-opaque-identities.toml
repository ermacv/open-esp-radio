id = "VENDOR_PHY_ANALOG_INITIALIZATION_CODES"
description = "esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0 libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2. phy_i2c.o::phy_i2c_init1 writes TXRF (block0x6b host1) byte0x08=0xbf at +0x9e and byte0x0d=0x77 at +0xea. The inspected historical libphy.a sha256 51497819736295c9b33d6775495dade4c6fb39db887edfe095608c670d9ae223 writes 0xbb/0x7a at the same sites. phy_i2c_master_cmd_mem_init encodes the matching old/current changes at +0x102/+0x192; independently inspected phy_i2c_init2 parallel-array data changes the same bytes. RFPLL (block0x62 host1) byte0x0d=0x0a at phy_i2c_init1+0x1b0 and byte0x15=0x08 at +0x18c; encoding sites +0x244/+0x286 agree. The inspected old/current direct and encoded RFPLL constants agree. Values and changes are direct; individual analog electrical meanings are unknown. Report: oer-notes/research/opaque-blobray-wifi.md, A2/A3 and analog access ledger."
