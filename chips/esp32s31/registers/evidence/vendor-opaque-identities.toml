id = "VENDOR_BLE_DF_INITIAL_IMAGES"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8 libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. ble_4.o::r_sym_ble_mIskG2GvbtwJXrhsY5EZ requests a clear-on-allocation 0x1c-byte workspace with count one, then writes byte +0x08=1 and word +0x0c=1. r_sym_ble_FZU452JXpwl3LtErzDPJ installs workspace+8 in link+0x50 at +0x1a/+0x2c; the no-sample-buffer path publishes workspace+0x0c through r_sym_ble_0wJYOi1maT14CoxXAvPQ. The allocation and byte/word images are direct current-body facts; disabled ordinary-role CTE interpretation is inference. The separate six-slot hardware IQ-buffer ring is not this workspace; retained +0x1c is padding, outside the vendor allocation. Report: oer-notes/research/opaque-blobray-ble.md, BLE_DIRECTION_FINDING_WORKSPACE / CONFIGURATION / DESCRIPTOR."

