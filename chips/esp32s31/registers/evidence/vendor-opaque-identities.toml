id = "VENDOR_WIFI_SOFTAP_TSF_COUPLED_CONTROL"
description = "esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21 libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4. hal_mac.o::hal_mac_tsf_reset+0x24 clears MODEM_PWR+0x860 bits31/30, clears shared TSF load words and requests SoftAP load, then +0x56 sets31/30. hal_tsf.o::hal_disable_softap_tsf+0xe clears both. The coupled start/stop use is direct; bit30 individual physical identity remains unresolved. Report: oer-notes/research/opaque-blobray-ble.md, MODEM_PWR non-I rows."

