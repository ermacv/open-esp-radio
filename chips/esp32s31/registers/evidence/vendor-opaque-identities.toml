[[sources]]
id = "VENDOR_WIFI_RX_IDENTITIES"
description = "ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7 components/esp_wifi/include/esp_wifi_he_types.h (sha256 602abd515ad617d06d8fe01e94fdf755890e72194a56a03821fa49770544162d), lines 184-187: MAC-v3 rxmatch0/1/2 identify reception-interface matches at word bits 28/29/30, hence RX byte 3 bits 4/5/6. soc_caps.h selects MAC version 3. Pinned libpp.a (esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21, sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4) pp.o::ppRxProtoProc+0x24..0x92 and ROM copy 0x2f83278a independently use those routes. hal_debug.o::dbg_dump_rx_links+0x3e,+0x5e,+0x76,+0x8a identifies RX descriptor bit 29 as sosf. The acronym and hardware effect are not established."

[[sources]]
id = "VENDOR_WIFI_MAC_IDENTITIES"
description = "Pinned esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21 libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4. hal_pwr.o pwr_hal_set_beacon_filter_enable/broadcast_wakeup_enable/unicast_wakeup_enable+0x8,+0xe and their disable leaves identify WIFI_MAC+0x2b4 bits 0/1/2. hal_debug.o::dbg_read_imrsp_power+0x2e..0x40 and its PWR_TAB diagnostic +0x98/+0x9c name +0x408+4*n bits 23:22 sig_mode; hal_init_imrsp_power uses 0 for entries 0..5 and 2 for 6..9. Pinned librftest.a (esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, sha256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a) bb_common.o::get_rxctrl_addr+0x8..0x22 adds WIFI_MAC+0x7c low byte to the descriptor buffer address to find RX control."

[[sources]]
id = "VENDOR_NRX_QUOTIENT_SHIFT"
description = "esp-rom-elfs 20260528 esp32s31_rev0_rom.elf sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, phy_nrx_freq_set at 0x2f8280ec: loads NRX+0x848 at +0x4/+0x8, forms 80 shifted by the first high byte, signed-divides by frequency, masks low 24 bits and stores at +0x2c preserving the second high byte. RV32 variable shifts consume only bits 28:24; bits 31:29 have no established quotient role."

[[sources]]
id = "VENDOR_BLE_NAMED_IDENTITIES"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8 libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Named same-chip 31c30949541a5d3abd4043a1cb66d55aa55577dd BLE archive sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63 provides accessor-role names; current bodies independently prove masks and accesses. ble_radio_crc_config role sym_ble_4XaXjpmqvjOMHEb2H4Aw+0x10 writes BT_MAC+0x538=0x65b; packet-error-mask set/clear roles sym_ble_RLVLyTT9fe5VBSIexDJ5+0x8/+0x14 and sym_ble_H2YnFWtQL1AZhlNAxiD6+0x8/+0x18 modify +0x85c. ble_radio_cte_enable role sym_ble_0QLTh7jLx8xIT9qMwPJP+0x14/+0x22 controls +0x800 bit 21. conn_4.o::sym_conn_9o4sfTJUuO7muCutlmpa+0x10/+0x14/+0x1e (setDefaultAbortedOpcode role) and connSim_1.o::sym_connSim_Dzx5u6gHUrhrEF6GLX1p+0x38/+0x44/+0x4e (setAbortedOpcode role) identify +0x8a4/+0x8a8 as byte-wide aborted-opcode selectors; hardware matching effects remain unqualified. ble_38.o::r_sym_ble_i9ueDYrYDxBz0nBLKKMM+0x32/+0x36 inserts 0x80000000 in the resolving head, links the software successor at +4 and publishes the head; historical r_ble_ll_resolv_insert_eof_head and terminal-entry handling identify bit31 as end-of-list."

[[sources]]
id = "VENDOR_BLE_ISO_RX_ERRORS"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8 libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723, ble_62.o. Complete instruction-byte-identical matches to named ISO RX helpers in 31c30949541a5d3abd4043a1cb66d55aa55577dd (BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63): sync_err=r_sym_ble_Hja67yKHXnf531oCQ6t1; len_cfg_err=r_sym_ble_nIHGEOR1UTuZaB1vMhhM; len_max_err=r_sym_ble_I9ZxSceqXA3AE7Hy2Bnl; len_mic_err=r_sym_ble_CybO4oi9yntaJKwRI58R; crc_err=r_sym_ble_i6RbJ0EHN50GbHbzu46i; mic_err=r_sym_ble_a549OJsdn8KazByjTrkw; npi_len_err=r_sym_ble_rZXRkBR2kMKjLg5qHwEA; llid_err=r_sym_ble_aiIds6eAEMKVUmcn59aA; pwr_stop=r_sym_ble_kc1skHfr2DAVnww9CQ82. They select result bits 0/1/2/3/4/5/21/22/23 after excluding the unproduced sentinel (sync extraction +0x28, other errors +0x1e/+0x20, power-stop +0x1e). These are direct ISO-format identities; transfer to ordinary RX is inference, with no change to its admission masks."

[[sources]]
id = "ESP_IDF_4D59230D_S31_MODEM_PLL_GATE"
description = "ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7 components/hal/esp32s31/modem_clock_hal.c sha256 6348b8fb6eee516bbcaf73e3706d08ec2b87091ecca97245f2409d22da5bd75e, lines 120-135: modem_clock_hal_enable_soc_pll_source_cg makes whole-word stores to HP_SYS_CLKRST.MODEM_CONF, open 0x15 then 0x1d and close 0x2d then 0x25; the enabled predicate compares with 0x1d. hp_sys_clkrst_reg.h lines 4390-4439 names bits 0..5 APB enable, reset, source enable, source select, PLL enable, XTAL enable."

[[sources]]
id = "VENDOR_WIFI_TXOP_DESCRIPTOR_CLASS"
description = "Pinned esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21: libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4; libnet80211.a sha256 23de6b00cbc71f4cd4a43c0c6cca4aa670154f52eb43d798668e1f1507f2425d; libespnow.a sha256 f15f64b73a53b0a0a059cf5d433f7167ce520ab2df63c8a7b656712e939f0698. libpp[esf_buf.o]::esf_buf_alloc_dynamic+0xc4..0xda,+0xfa..0x102 and g_eb_list_desc templates for inspected allocation types 1/2/3/4/9/10 initialize software-descriptor flags [7:6] to zero. The inspected unfragmented plaintext, probe/auth/assoc management, pre-key EAPOL, ESP-NOW (plain and CCMP), CCMP/GCMP/TKIP/WEP data and BIP group-management paths retain zero: libnet80211[ieee80211_output.o]::ieee80211_encap_esfbuf+0x1ce..0x20a,+0x424..0x478, ieee80211_set_tx_desc+0xda..0xe6, ieee80211_send_probereq+0x270..0x280, ieee80211_send_proberesp+0xcc..0xda, ieee80211_send_mgmt+0xce..0xdc, ieee80211_output_process+0x1d0..0x1fe, ieee80211_mgmt_output+0x196..0x1be; [ieee80211_action_vendor.o]::ieee80211_construct_action_vendor_spec+0x1ca..0x208,+0x21a..0x22c; [ieee80211_crypto.o]::ieee80211_crypto_bip_encrypt+0x3e..0x20c; the named ccmp_encap/gcmp_encap/tkip_encap/wep_encap leaves do not write flags. Cipher IDs and key-selection bits belong to the separate descriptor word +0x10, not flags +0. libpp[pp.o]::ppTxFragmentProc dispatches the cipher at +0x68..0x88 and reaches the shared fragment update +0xa0..0xa8; +0x58e..0x5da creates additional class-two fragments and +0x360..0x37c makes the terminal fragment class three. Thus successful software fragmentation for plaintext/WEP/TKIP/CCMP/GCMP has flags classes two ... two, three. libpp[hal_mac_tx.o]::mac_tx_set_plcp0+0x1a..0x26,+0x6c initially sets CONTROL bit 22. mac_tx_set_txop_q first tests queue-context byte +0x1d at +0xe,+0x2e..0x30. Only reserved slot indices 0/1/2 reach the head flags [7:6] test +0x86..0x9e: class two sets bit 22 at +0xa2..0xae, classes zero/one/three clear it at +0xd0..0xda. The index-three path +0xfc..0x108 leaves CONTROL unchanged. libpp[lmac.o]::lmacInitAc+0x16,+0x46 initializes index three; lmacRequestTxopQueue+0x4..0x3c,+0x42..0x4c reserves zero/one/two; lmacReleaseTxopQueue+0x1a..0x28 restores three. lmacSetTxFrame+0xd8..0x180 can reserve a slot for unfragmented traffic too, so no fixed final bit follows from a cipher or frame class alone. The open formatter retains an unconditional set without this reserved-slot adjustment. Physical bit meaning and air behavior remain unproven; the analysis is bounded to the inspected construction paths, not an exhaustive writer proof."

[[sources]]
id = "VENDOR_WIFI_DESCRIPTOR_COUNT_PACKING"
description = "esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21, libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4, hal_mac_tx.o::mac_tx_set_hesig+0x286..0x2ac reads an eight-bit software count n and stores n | n<<7 | n<<14. Thus bit21 receives input bit7; for n<128 it is zero. mac_tx_set_htsig uses three separate seven-bit RMWs and preserves bit21. ROM same-named copies corroborate the mapping. No independent enable or physical overflow identity is established. Report: oer-notes/research/opaque-blobray-wifi.md, M6."

[[sources]]
id = "VENDOR_PHY_PBUS_GROUPS"
description = "esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2, phy_debug.o::phy_pbus_print call sites +0xe/+0x1c name RFRX, +0x7a/+0x88 BB, +0xa8/+0xb6/+0xc4/+0xd2 DCO and +0x3c/+0x4a/+0x58 RFTX. esp-rom-elfs 20260528, esp32s31_rev0_rom.elf sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. phy_pbus_rd_addr at 0x2f824192, phy_pbus_rd_shift at 0x2f8241ee and phy_pbus_rd load at 0x2f824286 establish the selected word/shift and nine-bit width. Names are group labels, not individual electrical bit identities or physical units. Report: oer-notes/research/opaque-blobray-wifi.md, F4."

[[sources]]
id = "VENDOR_PHY_DAC_SCALE"
description = "esp-rom-elfs 20260528, esp32s31_rev0_rom.elf sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. phy_dac_scale_set controls FE+0xc04 bits15:8 and23:16. phy_start_tx_tone_step at 0x2f828776 clears both lanes on the power-control path; phy_stop_tx_tone at 0x2f828878 restores both to 0xff through separate fresh-read updates when its argument is one. The DAC-scale subsystem is direct from the accessor role; units and relative path assignment remain unknown. Report: oer-notes/research/opaque-blobray-wifi.md, F7."

[[sources]]
id = "VENDOR_BLE_RX_AUXILIARY_TAG"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8, libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical named same-chip archive 31c30949541a5d3abd4043a1cb66d55aa55577dd, BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. memMgmt_4.o::r_sym_memMgmt_HzBmGkHAh4mavF5QJM0o+0x9a/+0xa0 reads RX prefix+0x18 low16 and passes it to r_sym_memMgmt_i12d5sbSaRnPvHCb07XD (historical sm_num_match candidate: weakest similar, similarity-ppm 941176, about 94.12%; not an exact-body match). The latter reads link+0x7c configuration, tests byte23 and compares halfword+24 at +0x8/+0xe. r_sym_memMgmt_232y4Maqyh8DfDo3KxfV (historical sm_num_set: weakest exact-body, similarity-ppm 960000; this is correspondence metadata, not whole-program equivalence) stores scheduler item+0x20 & 0xfff into the configuration halfword at +0x1c..0x24, with enable byte23 at +0x16. Historical enable byte22 is not the current displacement. This is a direct software tag relation; hardware production/recycling/wrap effects are unproved, and the setter CFG is partial at its null-pointer trap. Report: oer-notes/research/opaque-blobray-ble.md, RX result and auxiliary tag."

[[sources]]
id = "VENDOR_BLE_ISO_TX_RESULT"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8, libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical named same-chip archive 31c30949541a5d3abd4043a1cb66d55aa55577dd, BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. ble_62.o whole instruction-byte-identical unique matches: r_ble_lll_iso_tx_hbuf_len_cfg_err = r_sym_ble_d8WzbZ98CLVZ7bSLsM1Q; len_max_err = r_sym_ble_U08hxJdoBdvq4byjtVwq; is_updated = r_sym_ble_jteNgI0e6VavbSMgOKco; reset = r_sym_ble_3a97eetL3mDmW67wLd3o. They read prefix bytes+0x0c/+0x0d, mask low15 and use 0x7fff as the unproduced sentinel. Error extraction at +0x18/+0x1a selects bits1/2 after sentinel rejection; reset clears+8..+0xb and arms low15 while preserving bit15. Direct identities are ISO-only; ordinary-format transfer is inference. Report: oer-notes/research/opaque-blobray-ble.md, Allocation-only RX/TX bytes and Appendix C."

[[sources]]
id = "VENDOR_BLE_CRC_DIAGNOSTIC_STATE"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8, libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical named same-chip archive 31c30949541a5d3abd4043a1cb66d55aa55577dd, BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. ble_65.o::sym_ble_kEhHirlvaZ5czF3LfL3W (historical ble_radio_crc_state) reads BT_MAC+0x474 at +0xe/+0x20 after +0x470, prints a nonzero +0x474 image and derives its return from +0x470. sym_ble_fWQEObbCOK87Kp8qpiv6 (ble_radio_events_clear)+0x20 and ble_70.o::r_sym_ble_D7WjPzItc9OF8YS067Wq (historical r_ble_phy_monitor_bb_sync candidate: weakest dominant, similarity-ppm 745098, about 74.51%; not an exact match)+0x26 store zero to +0x474. libbttestmode[ble_tx_rx_test.o]::ble_rx_check_status+0xe also reads the word. The crc_state and events_clear names have exact-body, similarity-ppm 1000000 correspondences in vendor/facts/names/libble_app.toml; the monitor role has only the dominant correspondence stated above. Current zero-store/access facts are independently observed. CRC diagnostic/event state is an inference; Boolean CRC success/error and W1C semantics are unproved. Report: oer-notes/research/opaque-blobray-ble.md, BT_MAC +0x474."

[[sources]]
id = "VENDOR_BLE_ETM_RESOURCE_COMMANDS"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8, libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical named same-chip archive 31c30949541a5d3abd4043a1cb66d55aa55577dd, BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. ble_70.o::r_sym_ble_D7WjPzItc9OF8YS067Wq+0x2e calls ble_68.o::r_sym_ble_fy9eOwbFJlqEr1QO6bwO with resource49; PHY init+0x240 uses50 and +0x284 channel0. For IDs below12 the helper uses channel-enable SET+0x4. Otherwise store+0x4c uses 0x20108910+12*((id-12)>>5), bit(id-12)&31: IDs49/50 issue separate images0x20/0x40 to +0x11c. r_sym_ble_Gl4tfOumPur9GkcDoGkp+0x38/+0xce and r_sym_ble_YpJTETFGhduIAMkkBKjc+0x4c use paired 0x20108914+12*i (IDs49/50 would address+0x120). SET/CLEAR resource gating is inference, not a proved replacing state selector or assigned physical gate. No direct +0x11c read was recovered in the bounded survey. Report: oer-notes/research/opaque-blobray-ble.md, MODEM_ETM +0x11c."

