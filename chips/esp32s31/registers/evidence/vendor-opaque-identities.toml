id = "VENDOR_BLE_DEVICE_LIST_FLAGS"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8 libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. ble_68.o::r_sym_ble_CX4quJm6H0AYnGOQmQIm is the unique whole instruction-byte-identical match for r_ble_hw_periodiclist_add in same-chip named revision 31c30949541a5d3abd4043a1cb66d55aa55577dd BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. Its device-entry accesses independently associate word0 bit0 with periodic-list membership; named periodic-list remove/clear roles agree. The separately exact matched r_ble_hw_whitelist_add = r_sym_ble_s3mGfL8pOw7v42rf3Uq9 uses bit1. This is the eight-byte address table, distinct from 64-byte IRK resolving entries. Physical filtering effects remain unqualified. Report: oer-notes/research/opaque-blobray-ble.md, BLE_DEVICE_TABLE_ENTRY."

[[sources]]
id = "VENDOR_BLE_ROLE_RX_PATH_IMAGES"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8 libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Link-state argument +0x08 bits31:28 have direct role-reset images advertising 0xe, passive scanning 0x4, DTM/connection 0. Current producer roots: ble_2.o::r_sym_ble_7lsXnox2LxrGG0FmY7qR (advertising); ble_6.o::r_sym_ble_KkAldzIlkQuEkNQp1g6q (scan/initiation), stores +0x32/+0xd6/+0x198/+0x372/+0x44a; ble_3.o::r_sym_ble_bgOSnaHsEjrTC0mkupqH (connection), +0x22/+0x64/+0x18e; dtm_4.o::sym_dtm_7gOGApwmDG1TxZOfQhrh (DTM), +0x1e/+0x80/+0xf2. These are inspected current role images, not per-bit physical identities or universal role-independent modes. Report: oer-notes/research/opaque-blobray-ble.md, BLE_LINK_STATE."

