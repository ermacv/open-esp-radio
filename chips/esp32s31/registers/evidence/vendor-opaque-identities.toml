id = "VENDOR_BLE_DEVICE_CONNECTED_TAG"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8 libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; ble_68.o::r_sym_ble_Jcse7k9ztYevPpDbNxVL reads device-entry byte1 at +0x28 and writes it at +0x32 with bit5 replaced by its third argument, preserving other byte bits. The whole instruction stream uniquely matches named r_ble_hw_set_connected_dev in same-chip 31c30949541a5d3abd4043a1cb66d55aa55577dd BLE sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. This directly associates entry word0 bit13 with that helper, not a proved physical filter identity or whole-program equivalence. Bits12:2 remain unknown. Report: oer-notes/research/opaque-blobray-ble.md, BLE_DEVICE_TABLE_ENTRY."

