description = "SOURCE: s31-b rev0, hw20-20261027-rx-irq120-01-s31b, source 035c80cc98bf58c35bf80d8ddd0f556137dae27a: passive channel13, 32x128+R, 700ms, no take/recycle. New RAW5/14 arrives while masked; unmask/remask preserves and redelivers STATUS. Selected W1C5 retains14/opaque2..4, then14 clears independently. Lane24 sample is zero. No universal status equation/RAW-write contract, CPU delivery or simultaneous-clear priority. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-rx-irq120.toml (source HW20_RX_RAW_RETENTION_20261027)."

