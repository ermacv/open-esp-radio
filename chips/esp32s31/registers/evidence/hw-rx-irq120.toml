id = "HW20_RX_AUXILIARY_OBSERVATION_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: the same run hw20-20261027-rx-irq120-01-s31b, lease902, measured source035c80cc98bf58c35bf80d8ddd0f556137dae27a; /home/ermacv/dev/oer-notes/research/hw-rx-irq120.md. The three recorded enabled lane5 positives accompany the three accepted AP beacons in that250ms phase, with RX14 visible in the same or a later in-row snapshot. Seven enabled-phase FCS increments have no recorded RX5/14/24 positive in their bracketing snapshots. Total counter deltas over700ms are MPDU=END277, FCS18, buffer-full2, power-drop5, data-success7, NRX-restart1, HT-SIG1; other recorded counters zero. The two buffer-full increments occur while ENABLE=0, with already-pending5/14 and RAW24=0. No positive24 is recorded in first/tail/post-ack RAW/STATUS samples. The affine STATUS sample taken immediately before live ack is not separately logged; a cause arriving and being acknowledged entirely in that sampling gap can escape the trace. No absence-of-all24-events, physical cause identity, equivalence of5 with accepted RX, FCS-only/full-only causality, or positive24 clear/retention result is established. No controlled erroneous peer frame or deliberate full-buffer stimulus is generated."

