[[sources]]
id = "HW_RX_SUCCESS_PER_MPDU_20261118"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run b6e of tasks/144 B6 (tasks/176, 177; branch feat/probe-rx-interrupt-aggregate at 8ad047aa7, probes esp32s31-rx-chain --features laps,irq,ring1664 and esp32s31-mac-reset --features b6), one stand lease, the AX211 capture holding s31-b's A-MPDUs, s31-a's Block Acks and the injector's one burst before them. s31-b sent 1 800 A-MPDUs through the backend's RetainedDmaAmpduTx, at HT MCS7 short GI 20 MHz (8 x 1 490, 16 x 100 and 32 x 100 octets) and HT MCS0 (4 x 1 490, 16 x 100 and 32 x 100), 300 of each, all status 0 with a usable Block Ack, to s31-a holding a receive agreement for TID 0. s31-a polled RX_SUCCESS (STATUS bit 14, enabled alone, cleared through CLEAR) and LAST together with no CPU handler on the MAC's source, its largest gap between two reads 10 164 cycles (about 32 us). Over 32 462 completed units the cause rose 31 987 times; LAST advanced by 1 descriptor between two rises 31 479 times, by 2 491 times, by none 15 times: the cause is raised per completed MPDU inside an A-MPDU, not at the PPDU's end, at both rates. Two at a rise is within the poll's resolution. OFFSET and SOSF were never set; buffer-full 0. The time from an aggregate's first completed descriptor to its last was not established by this run. Details: oer-notes/research/b6-interrupt-in-aggregate-2026-11-18.md."

