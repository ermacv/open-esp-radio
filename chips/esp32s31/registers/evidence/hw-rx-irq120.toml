id = "HW20_RX_RAW_RETENTION_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: s31-b rev0, run hw20-20261027-rx-irq120-01-s31b, cargo stand lease 902, measured clean pushed source 035c80cc98bf58c35bf80d8ddd0f556137dae27a; /home/ermacv/dev/oer-notes/research/hw-rx-irq120.md. One passive channel13 RX publication, 32x128-byte nodes plus R, no CPU barriers/take/recycle/rearm. Total RX bound 700 ms: RX5/14/24 enabled and sampled-acknowledged for250ms, then all ENABLE fields masked without ack for450ms. Seven matched AP beacons are accepted, three in the enabled phase. The masked phase starts at scan7897 with RAW0x1c, STATUS0, three DONE terminals and full ENABLE classified Disabled; scan11127 still has ENABLE Disabled but RAW0x403c, STATUS0 and four DONE terminals. Thus new5/14 pending can also arrive while masked in this capture. After outer MAC/walker stop, phase162 reads full ENABLE classified Disabled and individual RX enables zero, RAW=0x403c, STATUS=0. RX unmask gives STATUS=0x4020 with unchanged RAW; remask gives STATUS=0; second unmask restores0x4020, RAW still0x403c. Selected sampled W1C5 with RX enables on changes RAW only to0x401c and STATUS to0x4000, retaining14 and opaque2/3/4. Selected W1C24 while masked uses a zero lane24 snapshot and proves nothing about a positive24. Selected W1C14 while enabled changes RAW to0x1c and STATUS to0. Final all-enable mask retains RAW0x1c. These are positive retention and independent selected5/14 clear observations, not all-lane ST=RAW&ENA, CPU delivery, simultaneous arrival/clear priority or a universal RAW-write contract. No direct RAW write is used after the initial sampled stale clear."

