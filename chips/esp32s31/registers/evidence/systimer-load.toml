id = "HW33_S31_SYSTIMER_LOAD_20261123"
description = "SOURCE: s31-a and s31-b rev0, probe esp32s31-timer-facts at 37093f940, scenario timer-facts, results timer-facts-1795441554816386287.json (s31-a) and timer-facts-1795441603894300657.json (s31-b); first round 70777b518 timer-facts-1795440377378159822.json (s31-a). Unit0 one-shot comparator1, WORK_EN1 and INT_ENA1 written once at boot and never after (read at the end: work 1/1/1, int_ena 1/1/0); comparator0 the executor's; 20 CPU cycles a tick. Alarms seen by polling INT_RAW after the COMP1_LOAD strobe. Both boards alike: a future target strobed over a target still ahead or over one reached and acknowledged raises once at its time (a, b, e: 1000 of 1000 trials each, within -32..+34 cycles). A target behind the counter at the strobe raises nothing over a target already reached and acknowledged (9, 16, 1000, 1000000 ticks behind, 1000 trials each) and raises at once, 261..266 cycles after the strobe, over a target still ahead. A strobe 7 ticks or more before a standing target's expiry replaces it; 5.25 ticks or less before, the standing alarm still comes, then the new future target's; between, either (8 trials a quarter tick, -10..+10 ticks); a new target behind gave exactly one alarm in every trial. A strobe whose loaded high word drops below the standing target's while the old low word with the new high word is passed raises an alarm at the strobe in 60..99 percent of trials, the new target's alarm following in every trial; with that mixed value ahead, one alarm. Targets 2^51-16..2^51+2^40 ahead over a target still ahead raise nothing within 200 us. A target 10 ticks behind to about +6 ticks ahead at the strobe over a reached target gives no alarm with a counter read after the strobe already at or past it; no trial had no alarm with the read still ahead (2 x 81 distances x 8 trials, each board). Hart1 loading comparator2 beside: 4909171 and 4906155 loads, as many alarms, none missed. Bounded cases on two boards, not every interleaving. Details: oer-notes/research/hw33-systimer-load-2026-11-23.md."
