# Register review uses the closed provenance/accuracy/completeness enums from
# the generic contracts crate; evidence catalogs only define source identity.
schema = 1

[[sources]]
id = "POLICY_STATION_TX_COLLISION_MASK"
description = "SOURCE: chips/esp32s31/radio/ieee80211/backend/README.md, TX queue collision: the existing station primary mask 0x19a878e0 clears bit 8, the TX queue collision service event identified by BLOB_MAC_PRIMARY_TX_COLLISION_IRQ_20261104. It remains masked until task-side handling is provided. Only per-queue collision_pending qualifies collision detach. This primary mask does not mask the secondary INT1 BSS-color event; HE initialization separately enables that source, whose service remains unimplemented in the open IRQ path."

[[sources]]
id = "POLICY_S31_PWR_BANK_CLEAR_SCOPE_20261027"
description = "SOURCE: Production policy in chips/esp32s31/registers/policy.toml, fixed-register-images clear_all_mac_power_interrupts: mask MODEM_PWR.ENABLE then write CLEAR=0xffffffff. The current-pin vendor hal_pwr_interrupt_clr_event leaf establishes full-argument forwarding only. HW8_S31_WIFI_TSF_MASK_20261026 positively qualifies the production image for a fresh masked timer 0 cause, not opaque lanes 8..16,18,20..31. All-lane acknowledgement is unqualified. Report: oer-notes/research/bx-modem-pwr-power-bank.md."
