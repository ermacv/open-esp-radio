id = "POLICY_STATION_BSS_COLOR_MASK"
description = "chips/esp32s31/ieee80211/driver/README.md, BSS-color collision: station interrupt policy keeps the HE BSS-color collision event masked until an HE consumer exists. It is not a TX queue collision; queue collision detach is qualified only by TX_COMMON.collision_pending."

