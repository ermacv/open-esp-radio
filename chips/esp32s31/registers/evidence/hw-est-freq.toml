# Calibrated comparison-probe observations; electrical scope remains explicit.
schema = 1

[[sources]]
id = "HW19_S31_EST_INDICATIONS_20261027"
description = "SOURCE: s31-a rev0, run hw19-20261027-est-freq-01, lease #903, selection151, est.json; ermacv/oer-notes research/hw-est-freq.md. A staged production full cold PHY registration preceded the two identical internal-tone estimator windows (control1000 decimal), with the existing session retaining all owners. Of 200 enabled ordered READY/pair reads, 33 read READY0/pair0 and 167 READY1/pair0; both measurements progressed to ready and produced nonzero total-power accumulators. All 200 post-disable reads were READY0/pair0. This contradicts a necessary nonzero estimator-busy interpretation for FE+0x8d0[21:20] in this epoch; reads are ordered rather than atomic. It does not establish saturation, per-chain identity, every RF condition, physical conversion latency or a worst-case bound. Saved estimator codes1/2, window2048 and both enables0 read back identically after restoration."

[[sources]]
id = "HW19_S31_FREQUENCY_SELECTION_20261027"
description = "SOURCE: s31-a rev0, run hw19-20261027-est-freq-03, lease #905, selection152, freq.json; ermacv/oer-notes research/hw-est-freq.md. One complete held-engine sheet after production full cold registration read mode0 addresses0/0x400/0 as0x67/0xda/0x67; after the separate two-fresh-RMW bit18 clear/set, read0 again returned0x67. The positive low reference is the initialized BBTOP command's block byte, not its entire three-byte command. Bit18 read0/1/0 at the selected addresses; FREQUENCY_READY remained1 at every recorded boundary and parameter/status image stayed0x25824f58. The original control image0x5080063e and read-selection/ownership fields read back identically after restoration. This supports high-bit read-data selection and refutes destruction of this low entry by the tested transitions; it does not establish every mode's memory geometry, 2048 independent slots, a universal result width, or absence/scope of a reset effect on other state."
