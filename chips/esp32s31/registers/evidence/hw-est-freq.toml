# Calibrated comparison-probe observations; electrical scope remains explicit.
schema = 1

[[sources]]
id = "HW19_S31_EST_INDICATIONS_20261027"
description = "SOURCE: s31-a rev0, run hw19-20261027-est-freq-01, lease #903, selection151, est.json; ermacv/oer-notes research/hw-est-freq.md. A staged production full cold PHY registration preceded the two identical internal-tone estimator windows (control1000 decimal), with the existing session retaining all owners. Of 200 enabled ordered READY/pair reads, 33 read READY0/pair0 and 167 READY1/pair0; both measurements progressed to ready and produced nonzero total-power accumulators. All 200 post-disable reads were READY0/pair0. This contradicts a necessary nonzero estimator-busy interpretation for FE+0x8d0[21:20] in this epoch; reads are ordered rather than atomic. It does not establish saturation, per-chain identity, every RF condition, physical conversion latency or a worst-case bound. Saved estimator codes1/2, window2048 and both enables0 read back identically after restoration."

[[sources]]
id = "HW19_S31_FREQUENCY_SELECTION_20261027"
description = "SOURCE: s31-a rev0, run hw19-20261027-est-freq-03, lease #905, selection152, freq.json; ermacv/oer-notes research/hw-est-freq.md. One complete held-engine sheet after production full cold registration read mode0 addresses0/0x400/0 as0x67/0xda/0x67; after those address transitions plus two-fresh-RMW bit18 clear/set issued from bit18=0, read0 again returned0x67. The clear was a no-op; set wrote0->1 (control0xd084003e). Address0x400->0 transitions supplied1->0 edges; this did not establish a separate reset pulse. The observed byte0x67 coincided with expected.block() in two calibrated epochs (run01 and run03). The probe adopted it from run01 after the original whole-command guard rejected it; this is an empirical reference, not an established decoding as the initialized BBTOP command's block byte. Bit18 read0/1/0 at the selected addresses; FREQUENCY_READY remained1 at every recorded boundary and parameter/status image stayed0x25824f58. The original control image0x5080063e and read-selection/ownership fields read back identically after restoration. This supports high-bit read-data selection and retention of this low entry across the tested address transitions plus clear/set from0; it does not establish every mode's memory geometry, 2048 independent slots, a universal result width, or absence/scope of a reset effect on other state."
