id = "HW12_S31_BLE_OVERFLOW_ACK_20261026"
description = "SOURCE: s31-b rev0 run hw12-20261026-ble-overflow-01, lease #871; overflow-ack.json tags 0xa20f-0xa260: baseline ENA0=0x8000, ENA1=0x1302; captured seed 0xfffffc02 crossed to 0, primary STATUS_1=2 and matrix 124 high. Masking ENA1[1] hid status/output; restoring it redelivered 2/high without another wrap. Both NRT snapshots and 133 stayed zero; copying their sampled zeros to the shared clears left primary pending. Copying primary sampled image 2 to CLEAR_1 while enabled gave 0/low, retained through 4096 cycles. Isolated W1C and mask retention are established; coincident priority, event counts and positive NRT producers are not. Report: /home/ermacv/dev/oer-notes/research/hw-ble-overflow.md; raw logs: /home/ermacv/dev/open-esp-radio/target/wt-hw12/target/hw-hw12/hw12-20261026-ble-overflow-01/."

