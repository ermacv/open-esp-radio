id = "HW12_S31_BTLC_RATE_20261026"
description = "SOURCE: s31-b rev0 run hw12-20261026-ble-overflow-01, lease #871; overflow-rate.json tags 0xa300-0xa360: CLOCK_SHIFT=3, CONFIG_24=0, CONTROL0=1; MODEM source select=1 and PLL gate=1. CPU root XTAL, divider fields 0/0/0 (nominal 40 MHz). Capture 65780 in mcycle bracket [159839759,159839829], then 305789 in [164639945,164640015]: delta 240009, interval [4800116,4800256] cycles. One-tick quantization yields 19.9996500..20.0004000 cycles/tick, nominal 1.999960..2.000035 MHz. Rate-derived 32-bit period 85.897842744..85.901063850 billion cycles, or 2147.446069..2147.526596 s at nominal 40 MHz. Seed/capture 0xfffffc02 then crossed to 0 with primary 2/124 high and NRT 0/133 low within the 200000-cycle bound. No natural full-period wait, universal divider equation or oscillator calibration. Report: /home/ermacv/dev/oer-notes/research/hw-ble-overflow.md; raw logs: /home/ermacv/dev/open-esp-radio/target/wt-hw12/target/hw-hw12/hw12-20261026-ble-overflow-01/."

