id = "HW12_S31_BLE_APB_RESET_20261026"
description = "SOURCE: s31-b rev0 run hw12-20261026-ble-overflow-01, lease #871; overflow-reset.json tags 0xa410-0xa4d0: positive overflow, ENA0=0x8000, ENA1=0x1302, STATUS_1=2, matrix 124 high. MAC assert/release preserved enables and pending/output. Following APB assert/release, every modeled ENA0/ENA1 field read zero, as did primary/NRT status and 124/133. Restoring the baseline without ack did not redeliver, including a 4096-cycle window and CONTROL0 reopen. Fresh seeded wrap then produced 2/124 high. This establishes removal of the tested pending cause, beyond masking by zero enables; no POR or ungenerated-lane pending state is established. Report: /home/ermacv/dev/oer-notes/research/hw-ble-overflow.md; raw logs: /home/ermacv/dev/open-esp-radio/target/wt-hw12/target/hw-hw12/hw12-20261026-ble-overflow-01/."
