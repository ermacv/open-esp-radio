id = "BLOB_MAC_PRIMARY_TX_COLLISION_IRQ_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. hal_mac_interrupt_get_event completely reads primary STATUS at 0x20104c48. wDev_ProcessFiq+0x17e..0x188 tests its bit 8 and calls lmacProcessCollisions, which posts ppTask event 24. The recovered ppTask jump table at +0xb4 selects +0x1a6 for event 24, calling lmacProcessCollisions_task. That task calls hal_mac_get_txq_state(0), iterates the resulting queue bitmap, disables the selected queues, clears collision state and calls lmacProcessCollision; the latter reaches lmacProcessShortRetryFail or lmacProcessLongRetryFail. hal_mac_get_txq_state(0) reads 0x20104cb4 and returns its low four bits. Separately, complete hal_mac_interrupt_get_bsscolor reads 0x20104c34 bit 12 and hal_mac_interrupt_clr_bsscolor acknowledges 0x20104c38 bit 12; wDev_ProcessFiq posts event 30 for that secondary source and ppTask selects wifi_process_bsscolor_collision. Larger callers have incomplete value semantics, and ppTask has partial control-flow coverage; the cited local tests, calls and recovered table entries are decoded, not a complete production execution proof. Primary bit 8 is a TX queue collision service event, not the HE BSS-color event. Its assertion alone establishes neither a queue identity nor DMA detachment, and no on-air consequence or hardware automatic retry is established."
