[[sources]]
id = "HIL_OPEN_RX_BLOCK_ACK_DIRECT_BANK_2026_07_30"
kind = "unattested-hil-observation"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, fully open PHY/MAC, standard psram-code-psram-data profile and FRITZ!Box 7530 FN HE20 channel 1, 2026-07-30. The AP requested TID0 RX BlockAck at starting sequence five and negotiated window sixteen. Immediately after the open driver programmed ordinary bank zero, typed PAC readback at 0x20104274 reported control 0xc0000001, peer dc:15:c8:54:bc:1e, interface zero, window sixteen, current and loaded sequences five, and zero bitmaps. After two independent 500-packet ICMP receive runs, the hardware-maintained current-sequence word advanced first to 491 and then to 992 while the loaded starting sequence remained five. This qualifies the direct-bank geometry, field packing, publication update bit and live-state/load split; it does not qualify the separate extra-SoftAP staging path."

