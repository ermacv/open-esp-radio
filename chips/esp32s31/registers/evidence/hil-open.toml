description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, complete open PHY and MAC, controlled AX211 HE20 WPA2 AP on channel 11, 2026-07-29. After HE association, WPA2, successful TID0 AddBA window 32 and one complete 30-profile HE matrix round, the typed snapshot observed MPDU 6216, end 6197, data-success 286, FCS 42, power-drop 42, HT-SIG error 8, HE-SIG-A CRC 1, ACK interrupt 25 and RTS interrupt 6. FIFO overflow, buffer full, TKIP, abort and all four hang/panic counters were zero. The color bitmap had bit 25 set, threshold one and timeout 60 seconds. Four subsequent 30-profile matrix rounds remained clean."

