description = "../esp32s31_rust open-radio-phy-prelude-hil on ESP32-S31 rev0 against the controlled Linux AX211 HE20 AP, 2026-07-29. After HE association, WPA2/CCMP setup and more than nineteen complete three-profile DCM A-MPDU rounds, two independent ten-second snapshots both reported RX_TRIGGER_COUNT=0, TB_TRANSMISSION_COUNT=0 and TB_QOS_NULL_COUNT=0. WDEVAXTBDIAG0..3 also remained all zero. This proves the typed read path and a no-Trigger baseline; it does not qualify OFDMA because this ordinary AP configuration did not schedule uplink Trigger frames."

