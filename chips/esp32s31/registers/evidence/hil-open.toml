[[sources]]
id = "HIL_OPEN_HT_AMPDU_RAW_CADENCE_2026_07_29"
kind = "unattested-hil-observation"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, standard psram-code-psram-data profile, complete open PHY and MAC, controlled Linux WPA2 AP on channel 11 HT40-, 2026-07-29. A raw protected-QoS profile retained real CCMP, Sequence Control, DMA, 30-MPDU A-MPDU and BlockAck handling but removed Embassy UDP/IP production. It delivered 63.6-76.8 Mbit/s of 1472-byte Ethernet payload at MCS7 40MHz short GI. Across 3811 original aggregates, cadence averaged 5194 us per original and 3201 us from each hardware-submit edge to completion; 5087 aggregate attempts give 1.335 attempts per original. This matches the separately retained vendor direct-TX range 59.3-75.5 Mbit/s and localizes the remaining 100-Mbit/s gap to serialized preparation/completion plus missing-BlockAck retries rather than the former 21-MPDU byte ceiling."

