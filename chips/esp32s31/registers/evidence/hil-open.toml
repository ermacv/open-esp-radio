[[sources]]
id = "HIL_OPEN_AUTH_PLCP_FORMAT_2026_07_28"
kind = "unattested-hil-observation"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on connected ESP32-S31 rev0, open PHY and MAC, 2026-07-28. Controlled A/B kept the 30-byte authentication MPDU, descriptor, PLCP1 0x22, power, rate, channel and RX policy fixed. Format one yielded completion status five with no response; format zero yielded status zero and one addressed authentication response, but later format-zero repetitions failed. Earlier repeated format-one runs had completed authentication through DHCP. Therefore this experiment proves that TX completion status is not by itself a protocol-success oracle; it does not supersede the instruction-exact libpp[hal_mac_tx.o]::mac_tx_set_plcp0 mapping."

[[sources]]
id = "HIL_OPEN_TX_POWER_CONNECTIVITY_2026_07_28"
kind = "unattested-hil-observation"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, psram-code-psram-data, open PHY and MAC, 2026-07-28. With the HIL API limit 80 quarter-dBm and resulting ordinary queue power code 20, three consecutive reset-to-network runs completed Authentication and Association on their first MAC attempts, WPA2 and DHCP. A host test then received 200 of 200 ICMP replies with 4.613 ms average RTT; the device observed four raw ACK timeouts among 215 attempts and recovered all four by retrying the same encoded MPDU. With limit 20 quarter-dBm and resulting code 5, repeated runs included complete twelve-attempt Authentication failures. This is connectivity evidence for the current open profile, not proof that the open and vendor power/gain-table encodings are equivalent; the complete vendor driver also succeeds with queue code 5, so that mismatch remains localized for investigation."

[[sources]]
id = "HIL_OPEN_LEGACY_RTS_RATE_2026_07_29"
kind = "unattested-hil-observation"
description = "../esp32s31_rust/firmware/esp32s31/app/src/open_radio_phy_prelude_hil.rs on ESP32-S31 rev0, psram-code-psram-data, open PHY and MAC, controlled Linux WPA2 AP on channel 11 HT40-, 2026-07-29. Before the vendor basic-rate mapping, fixed 54-Mbit/s data with LENGTH_CONTROL incorrectly carrying rate 54 lost 25 to 39 percent of ICMP samples. Fixed 6M and 24M each completed 200/200, while 48M completed 199/200. After restoring complete mac_tx_get_rts_rate semantics so 54M publishes basic rate 24M and derives RTS power separately, 54M completed 197/200 followed by 495/500, with 1.975-ms and 2.353-ms average RTT. Linux reported the station RX bitrate as 54.0 Mbit/s, five AP-side TX retries and one AP-side TX failure over 709 packets. This qualifies the rate-dependent LENGTH_CONTROL field and strongly localizes the former loss to the wrong basic-rate image."

