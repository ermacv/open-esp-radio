# Short PAC-only digital observations, scoped to their exact reset-isolated mode.
schema = 1

[[sources]]
id = "ROM_REV0_PHY_I2C_HOST_LANES"
description = "SOURCE: pinned esp32s31_rev0_rom.elf a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, complete instruction bodies phy_get_i2c_mst0_mask at 0x2f829fa8 (callback read selector shifted left two) and phy_i2c_paral_set_mst0 at 0x2f82a082 (OR/store first bank mask at +0x18/+0x1a, AND/store complemented second bank mask at +0x2c/+0x2e). BLOB_LIBPHY_PHY_I2C normal-profile callback mapping gives BBTOP selector4 and TXRF selector8, hence ANA_CONF2 absolute bits4 and5. The existing natural I2cAnaMst owner retains the word. ermacv/oer-notes research/hw-opaque-wave2.md documents the publication and its silicon limits."

[[sources]]
id = "HW15_S31_BBTOP_RUN05_20261027"
description = "SOURCE: stand s31-b rev0 run hw15-20261027-opaque-05, lease #890; ermacv/oer-notes research/hw-opaque-wave2.md and its archived ELF/SRAM capture. BBTOP04 reads 0x10 in serial/parallel/serial after the four absolute syscon-map settings APB6/PERI4/WIFI6/BT4, modem/I2C power-reset, timing and register-mode prefix, without analog writes. The preparation differs from the six-map OR prefix of run07 and was not independently isolated; neither a cause for the observed 0x10 versus 0x1c difference nor a reset-byte value is established."

[[sources]]
id = "HW15_S31_I2C_20261027"
description = "SOURCE: stand s31-b rev0 run hw15-20261027-opaque-07, lease #897; ermacv/oer-notes research/hw-opaque-wave2.md P-I2C and archived measured ELF/result capture. Under the documented probe-specific modem/I2C power-reset, six-map OR, timing/mode prefix, with no analog writes or calibrated PHY epoch claimed, BBTOP04 returns 0x1c and TXRF08 returns 0x00 in serial/parallel/serial reads despite DATA seeds a5/5a/3c and a5/c3/5a respectively. Correct low masks are fffffb/fffff7, combined fffff3; the other twelve host-map bits are fe8. Disabling all selectors returns ff for BBTOP04; restoring its selector returns 0x1c. Routing BBTOP to master0 while commanding master1 returns 0xff; restoring master1 returns 0x1c. Readbacks of the two map lanes are (0,1), (1,1), (1,0), demonstrating the TXRF clear is a real stored 1-to-0 edge. All ten commands complete within the 40000-CPU-cycle observer bound; ANA_CONF1 high byte reads 0 despite the sourced publication writing 0xff. This supports the tested BBTOP selector/host control and excludes unchanged command DATA for both bytes. It does not prove independent TXRF-host necessity, every bank/mode, reset-byte values, PLL readiness, physical analog meanings or uniquely minimal prerequisites."

[[sources]]
id = "HW11_S31_PLL_20261027"
description = "SOURCE: stand s31-a rev0 run hw11-20261027-opaque-02, lease #848; ermacv/oer-notes research/hw-opaque-wave1.md P0. With CPU root XTAL, divider zero and fractional numerator zero, one six-field typed RMW per sourced image read back 0x3d,0x25 and 0x15,0x1d,0x2d,0x25. PMU active ICG code stayed 2. Closed six-bit images agree; the open images differ in XTAL-enable bit 5. No running modem-counter, PLL-lock or glitch-equivalence fact follows. Reserved high bits were preserved, not observed."

[[sources]]
id = "HW11_S31_BB_20261027"
description = "SOURCE: stand s31-a rev0 run hw11-20261027-opaque-05, lease #852; ermacv/oer-notes research/hw-opaque-wave1.md BB-L. With CPU admission masked, without RF initialization, MAC disable code 15, XTAL modem source and digital BB clocks/interface enabled, control 0xc0010001 and IRQ30 set produced no status during 4096 CPU cycles. BB+0xc08 and +0x4c, MAC RAW/ST and matrix source120/123 read zero. Bit30 retained both levels. Bit29 read zero after setting it with IRQ30 enabled and disabled; this distinguishes readback from stored plain state but establishes neither a read-zero versus self-clear mechanism nor timeout clearing without a positive event. Reset31 remained zero; reset scope is untested."

[[sources]]
id = "HW11_S31_TSENS_20261027"
description = "SOURCE: stand s31-a rev0 runs hw11-20261027-opaque-02 (lease #848) and hw11-20261027-opaque-07 (lease #857); ermacv/oer-notes research/hw-opaque-wave1.md P-TSENS. Requested CLK_CONF bit9/bit23 images 11,01,10,00 each received two SAMPLE_EN rising edges with 10-us sampling under a 1-ms deadline. Run07 verifies CLK_EN=1, divider15, forced power and LP peripheral clock enabled, peripheral reset0. Both opaque bits read zero immediately after every requested image, including writes of one. OUT changed in every case and READY was always zero. Thus the readback does not establish four stored gate configurations, individual bit necessity or separate conversion/readout identities; ignored writes versus read-zero or transient commands remain unresolved. Preserve the vendor sequence."

[[sources]]
id = "HW11_S31_BLOCK_ACK_20261027"
description = "SOURCE: stand s31-a rev0 runs hw11-20261027-opaque-03 and hw11-20261027-opaque-06; ermacv/oer-notes research/hw-opaque-wave1.md P-BA. On an XTAL-sourced, non-RF-initialized, MAC-disabled path, ordinary index0 CONTROL read 0xc0003001 after publication and an extra update, opaque lanes zero. Extra index3 staging CONTROL read 0xc0003061 and policy 0x00800504 with opaque lanes zero. Extra latched readback was empty (CONTROL 0x60, peer/sequence/bitmap zero), and ordinary CURRENT_SEQUENCE remained zero despite SSN load 0x123. These are staging/quiet observations, not a successfully accepted live BA agreement or proof of a permanent zero-readback invariant. Enabling the digital BB interface in run06 did not change that limitation."
