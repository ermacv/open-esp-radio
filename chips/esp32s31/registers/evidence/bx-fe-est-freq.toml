[[sources]]
id = "BX10_S31_FE_EST_CONSUMERS_20261027"
description = "SOURCE(esp32s31): rev0 ROM, esp-rom-elfs release 20260528, sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, phy_iq_est_enable+0x14,+0x88..+0xae; esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2, phy_rx_cal.o::phy_check_rx_sat+0x14..+0x6c; same revision librftest.a sha256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a, phy_test.o::phy_iq_est_enable_new+0xb2..+0xd8 and phy_rx_sat_test+0xa8..+0xee. These readers consume FE+0x8d0[21:20] jointly. IQ-estimator consumers exit on READY and count each nonzero pair observation only on the not-ready path, not transitions. The independent saturation sampler takes 100 samples without a READY test and sets its software flag if any are nonzero; a zero batch does not clear that flag in this body. RFTEST records the raw pair beside a gain-related observation. These direct consumer facts establish no individual bit identity, busy meaning, physical saturation or hardware latch behavior. Resolved-reader enumeration is bounded by partial functions and unresolved accesses."

[[sources]]
id = "BX10_S31_FE_EST_ADMISSION_20261027"
description = "SOURCE(esp32s31): rev0 ROM, esp-rom-elfs release 20260528, sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, phy_rxdc_est_min+0x3e..+0x60 and phy_param_addr+0x4; esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2, phy_init.o::phy_get_romfunc_addr+0xc/+0x10. The binding publishes the PHY parameter pointer. A candidate first requires lower power than the retained minimum; acceptance then requires the estimator halfword at parameter+0x1ac to be zero or the software saturation byte at +0x1ae to equal one. The halfword counts nonzero not-ready observations, not edges. This establishes calibration admission, not an electrical identity for FE+0x8d0[21:20]."

[[sources]]
id = "BX10_S31_FE_FREQ_ADDRESS_20261027"
description = "SOURCE(esp32s31): rev0 ROM, esp-rom-elfs release 20260528, sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, phy_read_rf_freq_mem+0x8..+0x3c and phy_freq_i2c_mem_write+0x8..+0x3a. Both complete leaves replace FE.FREQUENCY_CONTROL[18:8] with the low eleven address bits. The read selects FE+0x30[1:0] afterward and raises/lowers FE+0x20 bit0; the write publishes data/mode at FE+0x2c before raising/lowering FE+0x1c bit20. Neither leaf calls reset or branches on mode. This establishes command-address wiring, not memory capacity, independent-cell count, universal result width or reset behavior."

[[sources]]
id = "BX10_S31_FE_FREQ_RESET_CONTEXT_20261027"
description = "SOURCE(esp32s31): rev0 ROM, esp-rom-elfs release 20260528, sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, phy_freq_module_resetn+0x4..+0x18; esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2, phy_init.o::register_chipv7_phy+0x7c..+0xa8. The complete ROM leaf clears FE+0x1c bit18, then freshly reads and sets it, preserving other lanes. It has no local mode/status test, delay or poll. Registration calls it after forcing TX/RX off, before disabling hardware frequency updates, resetting the I2C master and testing initialization state. This common prefix is not a reset around each memory transaction. The symbol name and call order establish no electrical reset target, effective edge, polarity or mode selector."

[[sources]]
id = "BX10_S31_FE_FREQ_MODE_CONSUMERS_20261027"
description = "SOURCE(esp32s31): rev0 ROM, esp-rom-elfs release 20260528, sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, phy_pll_cap_mem_update+0x2e..+0x6e, phy_wr_rf_freq_mem+0x36/+0x3c and phy_pll_dac_mem_update+0x3a (0x2f824eb4); esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2, phy_hw_freq.o::phy_bt_txpwr_freq+0x64/+0x68. The capacitor consumer requests read mode2 and consumes the low byte and result bit14, then publishes mode3. The three-word RF update publishes mode7; DAC and BT TX-power consumers publish mode1. Read selection and publication use different registers; these observations establish neither a common complete mode dictionary nor reset gating."
