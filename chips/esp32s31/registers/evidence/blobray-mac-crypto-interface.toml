id = "BLOB_MAC_CRYPTO_INTERFACE_PROFILES_20261104"
description = "SOURCE: Blobray static analysis and isolated execution, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Complete hal_crypto_enable publishes low bits 1:0=3 and bit 8=1 for API cipher types 1/2/3/4/5/9. STA/AP use bits 16/17=1/1; selector two uses 1/0 for argument two zero, otherwise 1/1. Bit 9 follows SPP, bit 28 selects WEP types 1/5, bit 31 selects SMS4 type 4, and bit 30 stays zero. Complete hal_crypto_init publishes 0x30000 to STA/AP and zero to selector two; complete hal_crypto_disable restores 0x30000 only for STA/AP and updates key validity for all selectors. Eighty-two isolated cases with explicit register-storage models return and match the reviewed images: 72 enable combinations (three selectors, six ciphers, two argument-two values, two SPP values), one cold init, three disables and six management getters. There are no call-response models or silicon cipher consumers. Only the STA/AP management getter independently extracts bit 17; low bits 0/1/8, bit 16 and bit 30 have no established individual hardware identity. libnet80211[ieee80211_supplicant.o]::esp_wifi_set_nan_key_internal+0x52e..0x546 passes selector 2, CCMP type 3, argument seven zero and SPP zero to ic_set_key. ic_set_key forwards argument seven through wDev_Insert_KeyEntry to hal_crypto_enable's argument two, producing selector-two 0x10103. The separate esp_wifi_set_key_internal+0x6..0x12 computes that argument from g_ic+0x210==0; complete esp_wifi_sta_pmf_enabled identifies that halfword as PMF state. Caller value semantics are partial although these local moves/calls are decoded. This establishes independently selected bits 16/17, a positive NAN user and a PMF-dependent generic policy; it does not extend the STA/AP management-RX name to selector two, prove TX/RX gate identities or qualify on-air crypto behavior."
