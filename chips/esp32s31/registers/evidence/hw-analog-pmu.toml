id = "HW31_S31_TSENS_INJECTION_20261027"
description = "SOURCE: stand s31-c rev0, runs hw31-20261027-pb1e-03-inject-250..264, lease #940; report /home/ermacv/dev/oer-notes/research/hw31-tsens-feest-pmuck.md, measured source e4d719ab. Historical measured selectors250..264 map to current selectors285..299 in the same order; archived run labels retain their original numbers. Fifteen separate cold omission arms compare bit23, bit9 and the ordered pair under no write, one, immediate one/zero, and repeated ones at50us and500us separation. Actual first write windows begin about22.7us after completed DAC11 publication; repeat windows are near72.8/522.8us and are recorded individually. DAC11 window530us and return DAC15 window500us have verified byte readbacks, positive ongoing OUT response before injection and continuing return response afterward. READY0 and CLK_CONF1 persist in every observed sample; at most127 records per command, no observation-failure tags. No distinct per-write or zero-controlled effect is established by these single traces; they do not identify a command, hidden latch, gate, pulse width or ignored write. Noise and variation between independent cold starts are not equivalence or qualification evidence."
