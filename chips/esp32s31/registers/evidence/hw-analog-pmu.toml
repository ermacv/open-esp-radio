id = "HW31_S31_CK_POWER_READBACK_20261027"
description = "SOURCE: stand s31-c rev0, run hw31-20261027-pb1e-02-registers, lease #933, measured selection244 (current selection284) tag0x3120; report /home/ermacv/dev/oer-notes/research/hw31-tsens-feest-pmuck.md. The existing typed CK_POWER enable image writes low4=15 and bit22=1, preserving all other lanes. Full before/after readbacks are0x44000000/0x44400000, XOR0x00400000, a subset of the sourced mask0x0040000f. Every observed lane outside that mask is unchanged, including reserved/undeclared lanes. Low4 reads0 both before and after its requested15, so a retained readable15 or any functional low-bit identity is not established. Read-zero, transient, conditional and ignored-write mechanisms remain unresolved."

