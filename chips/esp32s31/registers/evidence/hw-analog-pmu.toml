id = "HW31_S31_TSENS_COLD_DAC_20261027"
description = "SOURCE: stand s31-c rev0, runs hw31-20261027-pb1e-03-cold-240..243, lease #938; report /home/ermacv/dev/oer-notes/research/hw31-tsens-feest-pmuck.md, measured source e4d719ab. Each arm has a separate stand power-cycle/download ROM SRAM load before no opaque-one write, bit23 alone, bit9 alone or ordered bit23 then bit9. Same named SAR-I2C power/reset, LP clock/reset completed before injection, CLK_EN1, divider15, forced power and SAMPLE_EN1. DAC15 settles500us, DAC11 and DAC15 are observed54 times each through500us with verified field readback15/11/15. Late OUT after11 is143..145 and after return15 is81..82; both transitions occur in every arm including the ordered-pair positive control. READY stays0 and full CLK_CONF stays1, so bits9/23 read0 after requested ones. Requested earliest boundaries incur observer overhead; actual first read is about2.6us after completed DAC write, not an isolated analog edge. This disproves necessary explicit-one initialization for the measured forced mode, not conditional effects or ignored-write semantics; MG07 physical identities, FSM mode and lifecycle effects remain unresolved."

