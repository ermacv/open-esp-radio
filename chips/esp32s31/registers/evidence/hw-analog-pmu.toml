id = "HW31_S31_FE_COMPOSITION_20261027"
description = "SOURCE: stand s31-c rev0, run hw31-20261027-pb1e-02-registers, lease #933, measured selection244 (current selection284) tags0x3124..0x3126; report /home/ermacv/dev/oer-notes/research/hw31-tsens-feest-pmuck.md. With hardware-frequency updates disabled and channel/write strobes inactive, MEMORY_ADDRESS_HIGH is requested0 then1 (positioned bit0x40000, address bit0x400). With address-high0, CHANNEL_INDEX1/255 read back full images0x80000001/0x800000ff; with address-high1 they read0x80040001/0x800400ff. Saved fields restore to0. This establishes address-high bit and CHANNEL_INDEX1/255 composition/readback only. MEMORY_ADDRESS_LOW is written only0 and reads0 throughout, so this run supplies no discriminating evidence for that field. No memory operation, reset effect or engine geometry is qualified."

