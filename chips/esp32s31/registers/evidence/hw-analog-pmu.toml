description = "SOURCE: stand s31-c rev0, run hw31-20261027-pb1e-02-registers, lease #933, selection244 tags0x3124..0x3126; report /home/ermacv/dev/oer-notes/research/hw31-tsens-feest-pmuck.md. With hardware-frequency updates disabled and channel/write strobes inactive, typed address0 produces 0x80000000 and address0x400 produces 0x800400ff after prior byte index255. Index1/255 read back 0x80000001/0x800000ff at address0 and 0x80040001/0x800400ff at address0x400. Full saved fields restore to0. This establishes low/high address and byte-channel composition/readback only; no memory operation, reset effect or engine geometry is qualified."

