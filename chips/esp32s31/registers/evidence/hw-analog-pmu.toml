description = "SOURCE: s31-c rev0, hw31-20261027-pb1e-03-cold-240..243, sourcee4d719ab (current selectors280..283):separate cold arms omit/inject bit 23, bit 9, ordered pair in forced TSENS mode/div15. DAC15/11/15 readback holds and OUT responds in every arm; READY0/CLK_CONF1 persists despite requested ones. Explicit-one initialization is not necessary in tested forced mode; no ignored-write, physical-bit, FSM or lifecycle identity. First read includes about2.6us overhead. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-analog-pmu.toml (source HW31_S31_TSENS_COLD_DAC_20261027)."

