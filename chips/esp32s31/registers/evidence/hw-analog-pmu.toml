description = "SOURCE: stand s31-c rev0, run hw31-20261027-pb1e-02-registers, lease #933, measured selection244 (current selection284) tags0x3121..0x3123; report /home/ermacv/dev/oer-notes/research/hw31-tsens-feest-pmuck.md. CONTROL0 initially0 with ENABLE=VALID=0. Pair/bit22 cases0/0,2/0,2/1,0/1 read0,0x00200000,0x00600000,0x00400000. The only changed fields were restored from the owned saved image; full readback returned0 before completion. No descriptor address, ENABLE or VALID was published. This is disabled writable/readback evidence only, not PHY, DMA or on-air identity."

