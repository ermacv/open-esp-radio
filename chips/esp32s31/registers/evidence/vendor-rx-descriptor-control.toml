id = "BLOB_RX_DESCRIPTOR_VENDOR_NAMES_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[hal_debug.o]::dbg_dump_rx_links+0x4..0xe follows the RX head; CONTROL loads +0x3c/+0x3e, extractions +0x5c/+0x5e, masks +0x70/+0x76 and diagnostic call +0x8a identify bit28 as offset and bit29 as sosf. dbg_dump_rx_ppdu+0x9e/+0xb8/+0xcc/+0xda corroborates RX SOSF29. These vendor diagnostic spellings establish no acronym expansion, units, physical role or hardware writer."

