id = "BLOB_RX_DESCRIPTOR_CPU_INIT_REARM_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. libpp[wdev.o]::wDev_Rxbuf_Init+0x1a0/+0x1aa/+0x1c0/+0x1cc/+0x1d8/+0x21c/+0x230 preserves CONTROL28 in the inspected descriptor-field stores and explicitly clears CONTROL29 at +0x1d8. wDev_AppendRxBlocks+0x124/+0x12a/+0x132/+0x148 sets OWNER31, clears terminal30 and SOSF29, then restores LENGTH from SIZE, preserving OFFSET28 including an incoming one. rom[]::wDev_AppendRxBlocks at 0x2f838a7e agrees at +0xe0/+0xe6/+0xee/+0x104. CPU preservation establishes neither an initial allocator value nor a nonzero hardware mode or writeback."

