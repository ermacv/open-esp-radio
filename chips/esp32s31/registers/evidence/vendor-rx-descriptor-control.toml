id = "BLOB_RX_DESCRIPTOR_TERMINAL_CONSUMER_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. libpp[wdev.o]::wdevProcessRxSucDataAll+0xc2/+0xc8/+0xca/+0xd6 and rom[]::wdevProcessRxSucDataAll at 0x2f8398bc, +0x8e/+0x94/+0x96/+0xa0, select CONTROL30 for the local terminal branch. Bits28/29 from that load are unused in its local bit-flow result. This does not prove a global absence of other consumers, hardware writeback or completion ordering."
