id = "ESP_IDF_4D59230D_S31_SYSTIMER"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/systimer_reg.h sha256 51d57c950c5e19c6a6b01a7c1bf8510e848c76031a8d0e7040b0d22265a2e4b8 and components/soc/esp32s31/register/soc/reg_base.h sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d. DR_REG_SYSTIMER_BASE is 0x20399000. CONF at +0x0 (ETM_EN bit 1, TARGET2..0_WORK_EN bits 22..24, unit stall enables bits 25..28, TIMER_UNIT1_WORK_EN bit 29, TIMER_UNIT0_WORK_EN bit 30 default 1, CLK_EN bit 31; unit-1 stall enables default 1); UNIT0_OP at +0x4 (TIMER_UNIT0_VALUE_VALID bit 29 R/SS/WTC, TIMER_UNIT0_UPDATE bit 30 WT); TARGETn_HI/LO at +0x1c + 8n (20 and 32 bits); TARGETn_CONF at +0x34 + 4n (PERIOD bits 25:0, PERIOD_MODE bit 30, TIMER_UNIT_SEL bit 31); UNIT0_VALUE_HI/LO at +0x40/+0x44 (20 and 32 bits, RO); COMPn_LOAD at +0x50 + 4n (LOAD bit 0, WT); INT_ENA at +0x64 and INT_CLR at +0x6c (TARGETn bits 0..2, INT_CLR WT write-one-to-clear)."

[[sources]]
id = "ESP_IDF_4D59230D_S31_SYSTIMER_LL"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/esp_hal_systimer/esp32s31/include/hal/systimer_ll.h sha256 792130ce07bdc66b2546d57c93a6b48686fa9d62db8d8f6f90b77fa415a46ae8. systimer_ll_counter_snapshot (line 120) writes UNIT_OP.TIMER_UNIT_UPDATE one; systimer_ll_is_counter_value_valid (line 125) reads TIMER_UNIT_VALUE_VALID. No accessor writes TIMER_UNIT_VALUE_VALID: the hardware sets it when the latched value is valid, and the update strobe starts the next latch."

[[sources]]
id = "ESP_IDF_4D59230D_S31_INTERRUPT_MATRIX"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/interrupt_core0_reg.h sha256 60785a48a2b2be35670a789bf2e0a82a45f4bd85f110fc18c197de14211f311e and interrupt_core1_reg.h sha256 e7966b5cda22b0df047182c6f7758c385b95edb991cdc40d0794127fdfdaf335, with reg_base.h sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d (INTERRUPT_CORE0 at 0x20585000, INTERRUPT_CORE1 at +0x800). Each core has one route word per source 0..168 at +4*source with the CPU line in bits 5:0 and PASS_LEVEL in bits 9:8, the rest reserved; source 132 (MODEM_ZB_MAC) at +0x210. INT_STATUS_REG_0..5 at +0x2a8..+0x2bc are read-only pending bits of sources 0..168, the last word bits 8:0."

