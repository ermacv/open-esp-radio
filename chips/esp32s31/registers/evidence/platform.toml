id = "ESP_IDF_4D59230D_S31_USB_SERIAL_JTAG"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/usb_serial_jtag_reg.h sha256 3c25b77a29a35c122a88331456bec2437ee1512cf8a26ce351eb322bf8cd4bb0. EP1 at + 0x0: RDWR_BYTE 7:0 (R/W; a write appends to the IN FIFO, a read takes from the OUT FIFO). EP1_CONF at + 0x4: WR_DONE 0 (WT), SERIAL_IN_EP_DATA_FREE 1 (RO, reset one; clear after WR_DONE until the host read the FIFO), SERIAL_OUT_EP_DATA_AVAIL 2 (RO). INT_ST at + 0xc (RO), INT_ENA at + 0x10 (R/W) and INT_CLR at + 0x14 (WT): SERIAL_OUT_RECV_PKT bit 2 and SERIAL_IN_EMPTY bit 3 of sixteen interrupt bits. CONF0 at + 0x18: PAD_PULL_OVERRIDE 8, DP_PULLUP 9 (reset one), DM_PULLUP 11, USB_PAD_ENABLE 14 (reset one), all R/W. usb_serial_jtag_struct.h sha256 1791e1f478cd17b96f657e5adc50224184eb13e79ec5318e4bebfbe3c1df7b96 declares EP1 bits 31:8, EP1_CONF bits 31:3, the interrupt words' bits 31:16 and CONF0 bits 0 and 31:17 reserved. reg_base.h sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d sets DR_REG_USB_SERIAL_JTAG_BASE to 0x20391000."

