id = "ESP_IDF_4D59230D_S31_CORE_CONTROL"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7. components/soc/esp32s31/register/soc/pmu_reg.h sha256 b1a04a306b9d7ee908e2f7b083d42b7a634f8687b6ee034cfe6f54f385e0d816 (lines 4099-4116): CPU_STALL_SW at DR_REG_PMU_BASE + 0x1ec with HPCORE1_SW_STALL_CODE 23:16 and HPCORE0_SW_STALL_CODE 31:24 (R/W, reset zero); pmu_struct.h sha256 5fc84c7569f9f24e193b0205728a647768c7c289b39d5ce679c50db7d8352e28 (line 1025) declares bits 15:0 reserved. components/hal/esp32s31/include/hal/cpu_utility_ll.h writes 0x86 to stall a core and 0xFF to let it run, and after the run code waits for its CORESTALLED_ST bit to clear. hp_system_reg.h sha256 808e417c1cfbf10b686c1ca0beb9ba6a4309d415e855149303ca847a225e9d6f (lines 202-217): CPU_CORESTALLED_ST at DR_REG_HP_SYS_BASE + 0x64 with CORE0_CORESTALLED_ST 0 and CORE1_CORESTALLED_ST 1 (RO); hp_system_struct.h sha256 9c3373f5ee1a99777761740e22d429d7937e128be7eff5c971fad8274d270b2b (line 243) declares bits 31:2 reserved. hp_sys_clkrst_reg.h sha256 1ea5f6783bf861b4f59e90799db46e5746ce0f6d52440ec0339661a5f9241043 (lines 175-202): HPCORE1_CTRL0 at DR_REG_HP_SYS_CLKRST_BASE + 0x20 with CORE1_CLIC_CLK_EN 0, CORE1_CPU_CLK_EN 1, CORE1_GLOBAL_RST_EN 2 (reset one) and CORE1_FORCE_NORST 3, all R/W; hp_sys_clkrst_struct.h sha256 63c4fbb7c0cc56e830630050d407d58c27a32314cbc96c69d4fd19052eb3a359 (line 202) declares bits 31:4 reserved; (lines 1365-1432) UART0_CTRL0 at + 0x88 with SYS_CLK_EN 0 and APB_CLK_EN 1 (reset one), CORE_RST_EN 2, APB_RST_EN 3, FORCE_NORST 4, CLK_SRC_SEL 6:5, CLK_EN 7 (reset one), SCLK_DIV_NUM 15:8, SCLK_DIV_NUMERATOR 23:16 and SCLK_DIV_DENOMINATOR 31:24, all R/W. lp_clkrst_reg.h sha256 0f545692ddb5bc4fd5fee64752871425cd0012090ee203701978bb654874f211 (lines 439-582): HPCORE0_RESET_CTRL at DR_REG_LP_AONCLKRST_BASE + 0x3c and HPCORE1_RESET_CTRL at + 0x40, each with SW_RESET 20 (WT) beside R/W fields: RESET_LENGTH 18:16 and STAT_VECTOR_SEL 30 reset one, so each resets to 0x40010000; lp_clkrst_struct.h sha256 c20b1f7074c95a46e9c12058f012b42ab334e8f5accfdc1b1fb80387a15b31d6 (lines 429-478) declares bits 28:21 reserved. reg_base.h sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d sets DR_REG_HP_SYS_BASE 0x20586000, DR_REG_HP_SYS_CLKRST_BASE 0x20587000, DR_REG_LP_AONCLKRST_BASE 0x20701000 and DR_REG_PMU_BASE 0x20704000."

