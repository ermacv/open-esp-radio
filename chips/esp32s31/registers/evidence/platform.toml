id = "ESP_IDF_4D59230D_S31_BUS_MONITOR_DEBUG_MODE"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/bus_monitor_reg.h sha256 7129bbf40d204e19a8bf605b1e7ac67f48d5b3e03c4c171acd3be05d9dd0cc2f. BUS_MONITOR_CORE_0_DEBUG_MODE_REG at DR_REG_BUS_MONITOR_BASE + 0x64 (lines 562-580) and BUS_MONITOR_CORE_1_DEBUG_MODE_REG at + 0xec (lines 1230-1248): DEBUG_MODE RO bit 0 and DEBUG_MODULE_ACTIVE RO bit 1, default 0; the last word of the block is DATE at + 0x3fc. components/soc/esp32s31/include/soc/assist_debug_reg.h:11-14 names the block ASSIST_DEBUG (DR_REG_ASSIST_DEBUG_BASE is DR_REG_BUS_MONITOR_BASE; ASSIST_DEBUG_CORE_0_DEBUG_MODULE_ACTIVE is BUS_MONITOR_CORE_0_DEBUG_MODULE_ACTIVE), the bit esp-hal 1f646c5 esp-hal/src/debugger.rs (debugger_connected) and ESP-IDF's rv_utils_dbgr_is_attached read."

