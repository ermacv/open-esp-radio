[[sources]]
id = "BLOB_LIBPHY_PHY_TSENS_READ_INIT"
description = "Pinned ESP32-S31 libphy.a member phy_tsens.o, complete phy_tsens_read_init body size 0x36; exact five preserving MMIO updates are independently projected by the source-owned HAL test esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, libphy.a sha256 116c7c3a55e2ddfd7937edad2667b5d64717f1967519a0201ca6354246f0b1a2: phy_tsens_read_init +0x1c..+0x2c separately fresh-load/OR/store bits23 and9 of 0x20818018. These direct writes contradict the public tsens_clk_conf_reg_t reserved_1 declaration on exactly those two bits; no hardware meaning beyond their observed role is assigned."

[[sources]]
id = "S31_REG_BASE"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe, https://raw.githubusercontent.com/espressif/esp-idf/7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe/components/soc/esp32s31/register/soc/reg_base.h, sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d. It names IEEE802154_REG_BASE as 0x20103000 and the surrounding HP-system, LP-system and LP-peripheral blocks."

[[sources]]
id = "ESP_IDF_S31_INTERRUPT_SOURCES"
description = "Official ESP-IDF commit aeab6dcfbeb44aba4b1f8ed102e3086172833153, components/soc/esp32s31/include/soc/interrupts.h, sha256 1a4f155b87090376b1a40ac62e19de344c7f10dc53d9b4451b66d545e9e4717d. The hardware source table assigns MODEM_BT_MAC to 124 and MODEM_BT_MAC_INT1 to 133, and, counting from ETS_SYS_ICM_INTR_SOURCE = 0 at line 19, ETS_USB_SERIAL_JTAG_INTR_SOURCE to 2 (line 21), ETS_CPU_INTR_FROM_CPU_0_SOURCE to ETS_CPU_INTR_FROM_CPU_3_SOURCE to 65 to 68 (lines 84 to 87) and ETS_MODEM_ZB_MAC_INTR_SOURCE to 132 (line 151); ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7 holds the same bytes. The identical file is also present at the public-source review commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe."

[[sources]]
id = "ESP_IDF_BTDM_OSAL_INTERRUPT_POLICY"
description = "Official ESP-IDF commit aeab6dcfbeb44aba4b1f8ed102e3086172833153, components/bt/porting_btdm/controller/btdm_common/src/btdm_osal_freertos.c, sha256 436d009f67fbe7c83fa367a6b80dbf87316727605e751febc03c5118a669b5c8. The complete public wrapper always requests interrupt level three, additionally requests IRAM only when the controller caller passes flags zero, and allocates on CONFIG_BT_CTRL_PINNED_TO_CORE through blocking IPC on multicore builds. FreeRTOS and IPC are replaceable platform mechanisms; source, priority, residency and same-core policy are the recovered contract."

[[sources]]
id = "ESP_IDF_7B9CC1AC_S31_IEEE802154_STRUCT"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe, https://raw.githubusercontent.com/espressif/esp-idf/7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe/components/soc/esp32s31/register/soc/ieee802154_struct.h, sha256 da13c2bc78cd6ef35a4e54ddddf11ce48fda967746193f1a0ad03578a5881752. The public volatile esp_ieee802154_t declaration fixes register and field geometry through offset 0x1a0, but its TODO ZB-93 says the file still awaits generation from IEEE802154.csv; it therefore supports a selective partial model, not a claim that every word or access policy is complete."

[[sources]]
id = "ESP_IDF_7B9CC1AC_S31_IEEE802154_REG"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe, https://raw.githubusercontent.com/espressif/esp-idf/7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe/components/soc/esp32s31/register/soc/ieee802154_reg.h, sha256 fd3f944ac97634605083031f96c0f942af26a81a9e9a3123281c59e5719f9d9c. The public register macros independently restate the selected offsets and masks, but carry the same TODO ZB-93, omit several struct-only words and disagree with struct/common_ll naming for ED_CONFIG bits 13 and 12:11; they are corroboration for selected geometry only."

[[sources]]
id = "esp-idf-7b9cc1ac-ieee802154-common-ll"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe, https://raw.githubusercontent.com/espressif/esp-idf/7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe/components/esp_hal_ieee802154/include/hal/ieee802154_common_ll.h, sha256 ba4ce294b402df311f25c4d0ce9cb33449e3eb41993aff94a25df5a66142d471. Public inline accessors prove the selected software read/write directions, command/event values and field use; they do not establish reset values or semantics for untouched fields."

[[sources]]
id = "ESP_IDF_7B9CC1AC_IEEE802154_RECENT_RSSI"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe: components/ieee802154/driver/esp_ieee802154_dev.c sha256 9aaccfa2832cb89bfdfd98086a984269e621400a272b02926c4e088d16222830. ieee802154_get_recent_rssi, the body of the public esp_ieee802154_get_recent_rssi, returns (int8_t)(bt_bb_get_cur_rx_info() & 0xff) with no lock and no radio-state condition. With the complete bt_bb_get_cur_rx_info load of BT_V3_2_BASEBAND.CURRENT_RX_INFO (BLOB_LIBBTBB_BT_BB_V2_ACCESSORS), this proves the low byte as the signed RSSI the IEEE 802.15.4 driver reports. It does not prove the upper bits, read side effects or which protocol's reception the byte reflects while Bluetooth shares the baseband."

[[sources]]
id = "ESP_IDF_7B9CC1AC_IEEE802154_DRIVER_TIMERS"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe: components/ieee802154/driver/esp_ieee802154_dev.c sha256 9aaccfa2832cb89bfdfd98086a984269e621400a272b02926c4e088d16222830, components/ieee802154/driver/esp_ieee802154_timer.c sha256 66a2b68bb718d8fa878cbf28488af810ecb902288fde26dc7a0e5b32dcbd1326, and components/ieee802154/private_include/esp_ieee802154_timer.h sha256 e5ab8062c0c4b9195bd597a79a6aabb692fdb686a9599a034db36a46d8f89bd6. After TX_DONE of an ACK-requesting frame, the driver enables TIMER0 overflow and starts a 200000-microsecond watchdog from two truncated esp_timer_get_time samples; the timer helper clamps wrapping-expired deadlines to zero with the header's exact sign-bit test, writes the remaining threshold, and starts TIMER0. ACK completion stops TIMER0 and removes its event. Generic event teardown stops TIMER0 and TIMER1. This is behavioral evidence over already reviewed register leaves, not a new register geometry claim."

[[sources]]
id = "ESP_IDF_7B9CC1AC_S31_SOC_ETM"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe: components/soc/esp32s31/register/soc/soc_etm_reg.h sha256 5b2b2433cd45a21841ec9dc009e39f82f78a6ba934173b2d4216dc60f7c6a6d2 and components/soc/esp32s31/register/soc/soc_etm_struct.h sha256 df4a549b594de89af0afbb9f4ac1ec5d4d8fde34fca9207b9bff34d1e80e69d8. The ESP32-S31 SoC ETM places a channel-enable status word (R/WTC/WTS) at +0x0, write-trigger set and clear words (WT; writing 1 enables or clears a channel, writing 0 has no effect) at +0x4 and +0x8, and per-channel event/task words from +0xc at an eight-byte stride. The modem ETM of ieee802154_reg.h has the identical layout, so this source corroborates the write-trigger semantics of the modem ETM set and clear words by layout identity only; the semantics is a hypothesis not yet verified on the modem ETM hardware."

[[sources]]
id = "ESP_IDF_7B9CC1AC_IEEE802154_DRIVER_ETM"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe: components/ieee802154/driver/esp_ieee802154_util.c sha256 e1a012d5f359e2445128977e82a304ba94c100c2994729e062e26586596df38a and components/ieee802154/driver/esp_ieee802154_dev.c sha256 9aaccfa2832cb89bfdfd98086a984269e621400a272b02926c4e088d16222830. ieee802154_etm_channel_clear reads the modem ETM channel-enable word and, only when the channel bit is set, writes the clear word back with that bit added; ieee802154_etm_set_event_task clears the channel, writes the complete event and task words at the channel stride and writes the set word back with the channel bit added. The driver clears channels zero and one at every operation stop, programs channel zero from TIMER0 overflow to TX_START or ED_TRIG_TX for timed transmit and channel one from TIMER1 overflow to RX_START for timed receive. Register offsets, the eight-byte channel stride and the event/task identifiers come from ESP_IDF_7B9CC1AC_S31_IEEE802154_REG."

[[sources]]
id = "ESP_IDF_7B9CC1AC_S31_IEEE802154_LL"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe, https://raw.githubusercontent.com/espressif/esp-idf/7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe/components/esp_hal_ieee802154/esp32s31/include/hal/ieee802154_ll.h, sha256 a66a3562ff6ef62ffa6dda90bc08e97f0d4509bcf3817cdc57795fd97daeaa30. The ESP32-S31 extension independently reads the two high-half diagnostic counters declared by the public struct."

[[sources]]
id = "ESP_RADIO_7F914782_S31_IEEE802154_INIT"
description = "Pinned public esp-radio commit 7f914782f5c689a74f37df83b89a0827d3800323, https://github.com/ermacv/esp-hal/blob/7f914782f5c689a74f37df83b89a0827d3800323/esp-radio/src/ieee802154/raw.rs, sha256 36785d992099512dce4cd23f95b8de0355d0cc4849157712ce57ec846f8d709a. The public ESP32-S31 enable path calls bt_bb_v2_init_cmplx(1) before ieee802154_mac_init; that initializer then calls bt_bb_set_zb_tx_on_delay(50) immediately before set_rx_on_delay(50). This source proves the protocol-specific values and order, while the closed setter evidence separately proves the shared-register encoding."

[[sources]]
id = "ESP_RADIO_7F914782_S31_IEEE802154_HAL"
description = "Pinned public esp-radio commit 7f914782f5c689a74f37df83b89a0827d3800323, https://github.com/ermacv/esp-hal/blob/7f914782f5c689a74f37df83b89a0827d3800323/esp-radio/src/ieee802154/hal.rs, sha256 1a7c806723c050f4de3e150fb0255ca97eed0080f3eb43ba4252672e500b8b1b. The complete public set_rx_on_delay accessor performs one preserving field update of IEEE802154.RXON_DELAY.RXON_DELAY from its u16 argument."

[[sources]]
id = "ESP_PACS_AAA5C2EA_S31_IEEE802154_RXON_DELAY"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/soc/esp32s31/register/soc/ieee802154_reg.h:378-380 (IEEE802154_RXON_DELAY_REG +0x110, mask 0x7ff, shift zero) and ieee802154_struct.h:403-407 (rx_on_delay with an 11-bit delay field). These declarations supply the offset and field geometry. No reset-value claim is imported."

[[sources]]
id = "ESP_PACS_AAA5C2EA_S31_INTERRUPT_MATRIX"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/soc/esp32s31/register/soc/reg_base.h (DR_REG_INTR0_BASE 0x20585000), interrupt_core0_reg.h and interrupt_core1_reg.h. Each source-indexed route word has four-byte stride; core1 is at +0x800 and source132 at +0x210 on each core. The route fields MAP bits5:0 and PASS_LEVEL bits9:8 default to zero in both headers."

[[sources]]
id = "ESP_IDF_25FE69F_S31_PHY_RETENTION"
description = "Official ESP-IDF commit 25fe69f946311abdaf9ad56591f25fedbc20ac98. components/esp_phy/esp32s31/phy_init_data.c sha256 03176e75102562df905e7ec342860ddd120443c2bff043f06d66faef4285b217 defines the FECOEX, FEDATA, FECTRL, FEDATA_WIFI, AGC, NRX, BB and BRX retention bases and register counts. components/esp_phy/esp32s31/include/btbb_retention_reg.h sha256 8acdbdff2393e3d4dc15f1a6aedd240afeb95010e50446c9d596a878fc8af7f3 defines the BTAGC/BB_PART_1 base and count."

[[sources]]
id = "S31_PMU_HEADERS"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/soc/esp32s31/register/soc/pmu_reg.h and pmu_struct.h. pmu_struct.h:58 declares pmu_hp_clk_power_reg_t low19 and bit31 reserved. Current ROM phy_open_fe_bb_clk at 0x2f823eea..0x2f823ef4 reads, ORs 0x0040000f and stores 0x2070401c: low4 are observed use despite that reserved declaration; low4 remain opaque and only other reserved lanes retain the source annotation."

[[sources]]
id = "ESP_IDF_ESP32S31_MODEM_REG_BASE"
description = "Official ESP-IDF master commit 873d612fdeebf5dadc068670d320dbf4bcd742bc, components/soc/esp32s31/include/modem/reg_base.h, sha256 86a9909938d4db06b3d11c4c386a2c3dbdcd9657b6d194a216202b796ada13b9. It defines MODEM_BASE 0x20100000, MODEM_PWR_BASE 0x2010d000 and the FE, WIFI_MAC, WIFI_BB, WIFI_BB_BRX, MODEM_TIMER, MODEM_ETM, MODEM_DATADUMP, MODEM_WIDGETS, MODEM_SYSCON, MODEM_LPCON, I2C_ANA_MST and I2C_ANA_MST_MEM sub-block bases."

[[sources]]
id = "IEEE80211_HT_SIG"
description = "IEEE Std 802.11 HT-SIG field layout: HT-SIG1 bit 7 is CBW, with zero selecting 20 MHz and one selecting 40 MHz. This standard semantic is joined only to the instruction-exact descriptor-word1-bit-15 mapping proved by BLOB_LIBPP_HAL_MAC_TX."

[[sources]]
id = "IEEE80211_HE_PHY_CAP_DCM"
description = "IEEE 802.11 HE PHY Capabilities byte three field semantics as exposed by Linux include/linux/ieee80211-he.h: bits 1:0 encode DCM maximum TX constellation and bits 4:3 encode DCM maximum RX constellation, with encodings NotSupported, BPSK, QPSK and 16-QAM."

[[sources]]
id = "ESP_WIFI_SYS_S31_RXCTRL"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/esp_wifi/include/esp_wifi_he_types.h:177-246, packed esp_wifi_rxctrl_t for CONFIG_SOC_WIFI_MAC_VERSION_NUM == 3; components/soc/esp32s31/include/soc/soc_caps.h defines SOC_WIFI_MAC_VERSION_NUM 3. In that branch the 64-byte structure places signed rssi in byte 0, the five-bit rate in byte 1 bits 4:0, he_siga1 at bytes 4..8, rxend_state (0 successful) in byte 8, he_siga2 at bytes 9..11, is_group in byte 11 bit 7, the 32-bit local-time timestamp at bytes 12..16, cur_bb_format in byte 0x25 bits 7:4, the ten-bit rx_channel_estimate_len at bytes 0x26..0x28 bits 9:0 with rx_channel_estimate_info_vld at bit 10, and, in the last eight bytes, sig_len in bits 13:0 of the first halfword, dump_len in bits 13:0 of the second and rx_state (0 successful) in the following byte. Byte 0x1f, the byte after rx_state and the HE-SIG-B option fields are reserved in this branch."

