id = "IDF_S31_TSENS_POWER_LIFECYCLE"
description = "Pinned ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7; linked phy_override.c::phy_set_tsens_power dispatches to sar_tsens_ctrl.c temperature power acquire/release. Last release disables TSENS, its clock and SAR-I2C power. First acquire asserts PERIF_I2C reset, settles 1 us, enables its power and releases reset, then enables/resets TSENS and powers it. sar_tsens_ctrl.c sha256 212a4a717ff4ca1cbe2daebb3d99030d321966fa33e5a713e5a22965a1ab1e4e; S31 hal/regi2c_ctrl_ll.h sha256 590a4548f84d2ba30fc8e77d7a6253e913f8553115fba10238cd406587a702f7."

