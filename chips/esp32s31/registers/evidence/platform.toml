id = "ESP_IDF_4D59230D_S31_TIMG_WDT"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/timer_group_reg.h sha256 e3299695b4e6ab7d414a168d6115a683462ed261d0c8b41921f195f746d6e808 (lines 355-580): WDTCONFIG0 at REG_TIMG_BASE(i) + 0x48 with APPCPU_RESET_EN 12, PROCPU_RESET_EN 13, FLASHBOOT_MOD_EN 14 (reset one), SYS_RESET_LENGTH 17:15 and CPU_RESET_LENGTH 20:18 (reset one), CONF_UPDATE_EN 22 (WT), STG3 24:23, STG2 26:25, STG1 28:27, STG0 30:29, EN 31; WDTCONFIG1 at + 0x4c with DIVCNT_RST 0 (WT) and CLK_PRESCALE 31:16 (reset one); WDTCONFIG2 at + 0x50 STG0_HOLD (reset 26000000); WDTFEED at + 0x60 (WT, any value); WDTWPROTECT at + 0x64 WKEY (reset 0x50D83AA1). timer_group_struct.h sha256 6add061971adf862684950e567434a9df62bdd1fa43e08c4f5f44cf0703774eb declares WDTCONFIG0 bits 11:0 and 21 and WDTCONFIG1 bits 15:1 reserved. reg_base.h sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d sets DR_REG_TIMERG0_BASE 0x20580000 and DR_REG_TIMERG1_BASE 0x20581000. components/esp_hal_wdt/esp32s31/include/hal/mwdt_ll.h sha256 61b581140f173c833c1f09468aafc2652c0f7e1123d2c7a2b597ff3712a8c421 writes the key 0x50D83AA1 to unlock and zero to lock, and sets CONF_UPDATE_EN after each configuration change."

