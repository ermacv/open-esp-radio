id = "ESP_IDF_4D59230D_S31_CLIC"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/include/soc/clic_reg.h sha256 84dc973bdc352ed8952d4399ed7b079b91ee3d207a6648c5568af862225e09da. DR_REG_CLIC_BASE 0x10800000, the accessing hart's own controller (DUALCORE_CLIC_CTRL_OFF 0x10000 reaches the other one); NLBITS 3; CLIC_INT_CTRL_REG(i) at 0x10801000 + 4i holds IP bit 0, IE bit 8, ATTR_SHV bit 16, ATTR_TRIG bits 18:17 (trig[0] clear is level), ATTR_MODE bits 23:22 and CTL bits 31:24. CLIC_INT_CONFIG_REG at DR_REG_CLIC_BASE + 0x0 (lines 20-38): NVBITS RO bit 0, MNLBITS R/W bits 4:1, NMBITS RO bits 6:5; defaults NVBITS 1, MNLBITS 0, NMBITS 0. INT_INFO at +0x4 (lines 40-59): NUM_INT RO bits 12:0 default 48, VERSION RO bits 20:13 default 0, CTLBITS RO bits 24:21 default 3. Legacy INT_THRESH at +0x8 (lines 61-67): CPU_INT_THRESH R/W bits 31:24 default 0. CTRL fields (lines 70-116): CTL R/W default 0x1f; ATTR_MODE RO default 0b11; IP, IE, ATTR_SHV and ATTR_TRIG reset zero. Unassigned bits have no stated reset."

