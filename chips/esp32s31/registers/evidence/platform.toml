[[sources]]
id = "ESP_HAL_63E97BE_S31_MODEM_CLOCK_MAP"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/esp_hw_support/modem/port/esp32s31/modem_clock_impl.c:378-399 (modem_clock_domain_icg_config), components/esp_hw_support/modem/include/modem/modem_clock_impl.h:149-151 and components/hal/esp32s31/include/hal/modem_lpcon_ll.h. The LP_APB, I2C_MASTER, COEX and WIFIPWR domains all use ICG_NOGATING_ACTIVE | ICG_NOGATING_MODEM, bits two and one; the low-power accessors update the four shared state-map nibbles while preserving other fields."

[[sources]]
id = "ESP_IDF_7B9CC1AC_S31_MODEM_CLOCK"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe: components/esp_hw_support/modem/modem_clock.c sha256 f6cd061416a1356a7ca3cadb84ad9d8c137971cd9c167a74507ecd57d80f7edd, components/esp_hw_support/modem/port/esp32s31/modem_clock_impl.c sha256 c89ae6110cb4ca4e1208db3ef7263c729c84c84b2b5edaed3e9a3ce7c3c1e4df, components/hal/esp32s31/modem_clock_hal.c sha256 53c1f8c25b86cbb8eff5d06633615dde605763310fa97bcd3261e9bd84cce56e, and components/hal/esp32s31/include/hal/modem_syscon_ll.h sha256 565e2246dfd4af00c073b8668ee0b81b2eef9992b24030d814055159fec30b0c. Together they prove the refcounted Wi-Fi, Bluetooth and IEEE 802.15.4 dependency sets, low-bit-first transition order, MODEM_SYSCON clock-map updates, individual clock gates and reset pulses."

[[sources]]
id = "ESP_IDF_7B9CC1AC_S31_MODEM_LPCON_LL"
description = "Official ESP-IDF commit 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe: components/hal/esp32s31/include/hal/modem_lpcon_ll.h sha256 5e6ce588f2e029aa3b895b57b0cfdad25efeacfc3cea835cdc320bcd06d5608f and components/hal/esp32s31/modem_clock_hal.c sha256 53c1f8c25b86cbb8eff5d06633615dde605763310fa97bcd3261e9bd84cce56e. Each Bluetooth RTC-timer low-power clock accessor writes one LP_TIMER_CONF field (the four source selectors and the divider) or the CLK_CONF timer gate; modem_clock_hal_deselect_all_ble_rtc_timer_lpclk_source clears the slow-oscillator, fast-oscillator, 32-kHz crystal and XTAL selectors in that order."

[[sources]]
id = "ESP_IDF_4D59230D_S31_WIFI_LOW_POWER_CLOCK"
description = "Pinned vendor-firmware ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/esp_system/port/soc/esp32s31/clk.c sha256 1d2d27c434fd8e112435332f46e8f041445804e7623f312c8ab41e4e5715f1a8, components/esp_hw_support/modem/modem_clock.c sha256 e698cc6596430724b2fec5b8e631706f6ae112f12e0ae22119ff9e79b21c69d3, components/hal/esp32s31/modem_clock_hal.c sha256 6348b8fb6eee516bbcaf73e3706d08ec2b87091ecca97245f2409d22da5bd75e, components/hal/esp32s31/include/hal/modem_lpcon_ll.h sha256 5e6ce588f2e029aa3b895b57b0cfdad25efeacfc3cea835cdc320bcd06d5608f and components/soc/esp32s31/include/modem/modem_lpcon_reg.h sha256 8b70d89d270234d39bc6e0ae439a7e63a86cecceff10c9d4ebeccefb81e62752. When Wi-Fi is enabled, esp_perip_clk_init first selects the Wi-Fi power-domain low-power clock: XTAL32K when the RTC slow clock runs from the 32 kHz crystal, otherwise RC_SLOW, with divider zero. modem_clock_hal_deselect_all_wifi_lpclk_source clears WIFI_LP_CLK_CONF bits 0, 1, 3 and 2 in that order, each as its own field write; the select sets the one source bit (XTAL32K also writes CLK_MODEM_32K_SEL zero), the divider is written to bits 15:4, and the refcounted modem_clock_hal_enable_wifipwr_clock sets CLK_CONF bit 0 on its first enable. No caller deselects the Wi-Fi source."

[[sources]]
id = "ESP_IDF_4D59230D_S31_RTC_SLOW_CLOCK_SOURCE"
description = "Pinned vendor-firmware ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/esp_hal_clock/esp32s31/include/hal/clk_tree_ll.h sha256 606a1206ace38f81a00a498255841ae7547b4811f779913650935e84ae7996ac, components/soc/esp32s31/register/soc/lp_clkrst_reg.h sha256 0f545692ddb5bc4fd5fee64752871425cd0012090ee203701978bb654874f211 and lp_clkrst_struct.h sha256 c20b1f7074c95a46e9c12058f012b42ab334e8f5accfdc1b1fb80387a15b31d6. clk_ll_rtc_slow_get_src reads LP_AONCLKRST_ROOT_CLK_CONF (offset 0) SLOW_CLK_SEL bits 25:23: zero is RC_SLOW, one XTAL32K, any other value invalid."

[[sources]]
id = "ESP_RADIO_7F914782_S31_WIFI_CLOCKS"
description = "Pinned public esp-radio commit 7f914782f5c689a74f37df83b89a0827d3800323, esp-radio/src/radio_clocks/clocks_ll/esp32s31.rs sha256 eece62426050ac22647bb31d75cf83c7acd41f551cacc31bcb2377e8dc4df4eb. The S31 Wi-Fi path preserves one MODEM_SYSCON RMW for the complete CLK_CONF1 low eleven-bit clock set, pulses the Wi-Fi MAC reset independently, and pulses the Wi-Fi baseband and MAC reset pair together."

[[sources]]
id = "S31_ESP_PACS_SVD"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/include/modem/modem_syscon_reg.h (CLK_CONF at +0x4: CLK_DATA_DUMP_MUX bit21 defaults to one and PWDET_CLK_DIV_NUM bits8:1 defaults to one, giving 0x00200002), modem_lpcon_reg.h and i2c_ana_mst_reg.h; components/soc/esp32s31/register/soc/lp_clkrst_reg.h, lp_peri_clkrst_reg.h, tsens_reg.h, hp_sys_clkrst_reg.h and pmu_reg.h, with their corresponding *_struct.h files. These vendor declarations supply the selected register/field geometry and reset defaults. LP_AONCLKRST_ROOT_CLK_CONF is an exception: FAST_CLK_SEL defaults to one at bits27:26 (vendor word 0x04000000), whereas the curated read-only word retains resetValue zero; the published SLOW_CLK_SEL field defaults to zero in both. This evidence does not corroborate the curated whole-word zero reset."

