id = "ESP_HAL_1F646C5_CLIC_LEVEL_LINES"
description = "Pinned esp-hal fork commit 1f646c5af4f4ca2774f493783581237fea2379dc: esp-hal/src/interrupt/riscv/clic.rs sha256 6eb3270df3965a435173f193dc170394a0b19935c65b90c0a1d221e4aa83223d, whose init sets every CLIC line hardware-vectored and positive-level triggered, and esp-hal/src/interrupt/riscv.rs sha256 ea219e90206625ac1770bda13e3e042127fc08e4806d1f7dcd36cd35cbae46a4, whose init_vectoring calls it and gives line 15 + n level n (CTL 0x1f | (n - 1) << 5). ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7 components/hal/include/hal/interrupt_clic_ll.h sha256 f67f3972c229931602991529174e54aa354852c1104f703bd99383b31bca0126 reads ATTR_TRIG bit 0 clear as level-triggered."

