description = "ESP32-S31 rev0 ROM (esp-rom-elfs/20260528, pin esp32s31/rom), sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, read with cargo blobray function-records and register-accesses. The complete reset-reason getter at 0x2f805938 (seven instructions) loads 0x20701030 for core argument zero and 0x20701034 for any other, shifts right by one and masks with 63: exactly bits 6:1 of the selected word reach the returned value and no other bit is read."

