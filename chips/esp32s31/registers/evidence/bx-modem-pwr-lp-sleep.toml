id = "BX4_S31_LP_SLEEP0_OBSERVERS_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member19.o::r_sym_bt_p3Bpnx3z1Aic11OpE6oK+0xa/+0x14/+0x1a/+0x20/+0x2c sets ETM+110 bit26, sleep-bank bit0, MODEM_PWR+78 bit26, zero30 and set78 bit25; +0x3e/+0x42/+0x4e/+0x58/+0x60/+0x6c clears25, issues disable bit0, clears26, issues ETM+114 bit26, zero30 and sets25. This complete helper contains no completion read/wait. r_sym_bt_32zs9B7Gv9vHIVpsl2A7+0x130/+0x13a/+0x140 and +0x14c/+0x154/+0x156/+0x158/+0x162 check ETM+10c bit26 and MODEM_PWR+78 bit26 before the disable helper. r_sym_bt_5Dfi2QIOt0scmslG0Tl3+0x8/+0x14/+0x24/+0x2c/+0x30/+0x34 reconstructs an LP-time reference from+78 low24 and the counter epoch, correcting the epoch when the low counter precedes the reference; r_sym_bt_pbhEvou1xoQkWh324aIj+0x10/+0x1a stores that reference and +0x48/+0x4c/+0x4e/+0x52 logs low24. Capture producer, electrical control meanings and independent completion remain unknown. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

