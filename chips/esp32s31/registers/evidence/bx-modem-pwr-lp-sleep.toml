id = "BX4_S31_LP_SLEEP_TARGET_PUBLICATIONS_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member19.o::r_sym_bt_aOsjkDNQyOII2OseK6av+0x20e reads the full MODEM_PWR+0x64 word; +0x30a/+0x30c/+0x312 truncates a near-boundary replacement to24 bits before its32-bit store. r_sym_bt_eWPtqXHNjmAXFWXVrbNl+0x4e/+0x52/+0x56/+0x58 constructs a runtime low24 image and stores32 bits to+0x68 with upper8 zero and no preceding load68. This does not establish target68 readback, counter units or a PMU wake route. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

