id = "BX4_S31_LP_WAKE_CALLBACK_BOUNDARY_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member19.o::r_btdm_sleep_set_sleep_cb+0x1a/+0x1e/+0x20/+0x22 stores callbacks in environment+12/+16 and associated inputs in sleep context. r_sym_bt_aOsjkDNQyOII2OseK6av+0xac/+0xae calls slot16; r_sym_bt_32zs9B7Gv9vHIVpsl2A7+0xb6/+0xb8/+0x1b0/+0x1b2 calls slot12; r_sym_bt_7fnk0Rolbv3xIcBaDoFv+0x26/+0x2c tail-calls slot16. Targets are unresolved. This boundary supplies no PMU wake owner, input mask, SLEEP_REQ sequence or completion contract; negative survey results are not absence proofs. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."
