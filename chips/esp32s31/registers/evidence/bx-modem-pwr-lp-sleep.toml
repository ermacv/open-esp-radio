id = "BX4_S31_LP_SLEEP_FLAG_CONSUMERS_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member19.o::r_sym_bt_aOsjkDNQyOII2OseK6av+0x20e/+0x22a/+0x236/+0x254/+0x25c/+0x280/+0x286 reads target64, zeroes whole flag1c, issues sleep-bank16 and consumes low8 of1c. r_sym_bt_8vsaW1r7vBA6atycX0nr+0x12/+0x14/+0x16/+0x18/+0x24/+0x34 disables sleep-bank17, samples low8 of20, zeroes the full word, then disables ETM6/7. Low8 of20 is also branched on by r_sym_bt_C0B6WsJES1DZlVd8Ki6D+0x7c/+0x84/+0x86, r_sym_bt_0eozxYq5hbG5r38u4fdy+0x82/+0x88 and r_sym_bt_NWi3dF5sWH7BJHkO8AlH+0x7e/+0x84/+0x94/+0x9c. These are local flag/acknowledgement consumers, not an IRQ/PMU routing contract. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

