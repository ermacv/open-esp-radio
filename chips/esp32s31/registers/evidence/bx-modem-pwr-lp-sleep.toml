id = "BX4_S31_LP_STATUS_CONSUMER_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member9.o::r_sym_bt_FYr6kIOvDbNGoOHfaRvK+0x12/+0x14/+0x1a consumes MODEM_PWR+0x38 as a complete32-bit nonzero predicate. The separate full+0x6c predicate is sourced by BX4_S31_LP_COMPARE_PUBLICATIONS_20261027. r_sym_bt_atiitVoBKMplOJVvjTHP+0x4/+0x10/+0x14/+0x20/+0x46/+0x52 samples low bytes24/2c and conditionally stores whole-word zero. Neither predicate decodes an exhaustive set of physical causes; hardware identities are separately sourced. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

