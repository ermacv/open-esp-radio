id = "BX4_S31_LP_DELIVERY_SITES_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member9.o::r_sym_bt_waDX0omCE7oLuPVSoPOK+0x24 stores complete image2 at MODEM_PWR+0x10; r_sym_bt_86dRVPWrmTMQpChjYeWi+0x3e/+0x58/+0x6c and r_sym_bt_xPWv1Z87N9d40AR9yCcT+0x3c store0x40000 after target/software publication. These are the five resolved stores, not an exhaustive writer census. Measured lane meanings remain with HW2_S31_LP_GATES_20261026, HW2_S31_LP_PENDING_20261026 and HW16_S31_LP_DELIVERY_20261026. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

