id = "BX4_S31_LP_COMPARE_PUBLICATIONS_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member9.o::r_sym_bt_86dRVPWrmTMQpChjYeWi+0xe/+0x1e/+0x4a/+0x50/+0x52/+0x5c/+0x64/+0x66 has two32-bit MODEM_PWR+6c stores: ordinary target masks low24 and clears upper8; checkpoint adds0x800000 to the selected full counter read without final truncation or a load6c. r_sym_bt_FYr6kIOvDbNGoOHfaRvK+0x16/+0x18 tests the complete read word for zero. Store/predicate width is not physical comparator width; HW22_S31_LP_COMPARE_WIDTH_20261027 remains bounded to its tested mode. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

