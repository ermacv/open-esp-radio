id = "BX4_S31_LP_MODE58_USERS_20261027"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196, libbtdm_common.a SHA-256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member9.o::r_sym_bt_f0O4BjwUvyoDFI9I7XYU+0x78/+0x82 and member19.o::r_sym_bt_4rvxZOzOAXSWYF1EgDjY+0x46/+0x50 set MODEM_PWR+0x58 bits0/4 together. Member19.o::r_sym_bt_baKevzrkdXpVxt0dGQWd+0x46/+0x4a/+0x4c/+0x52/+0x58 and r_sym_bt_32zs9B7Gv9vHIVpsl2A7+0x76/+0x7a/+0x7c/+0x82/+0x88 clear the pair, test bit2 and freshly read before setting bit1. Member9.o::r_sym_bt_FYr6kIOvDbNGoOHfaRvK+0x30/+0x34/+0x36/+0x3c has the ISR test/fresh-read/bit1 update. CONTROL4 individual purpose, IRQ masking and PMU wake roles remain unknown. Report: oer-notes/research/bx-modem-pwr-lp-sleep.md."

