[[sources]]
id = "HW5_PSRAM_USER_ADDRESS_20261026"
kind = "unattested-hil-observation"
description = "s31-c, hw5-20261026-density-04, lease 793: public psram::bring_up with a forwarding owner recorded reads at MR addresses 0, 4, 8, 2 as 0x8d3b, 0x8d38, 0x8d78, 0x8d3b. Each read followed the preceding write to MR0 instead of selecting the requested address. Pinned esp32s31 rev0 ROM (esp-rom-elfs 20260528), Blobray esp_rom_spi_cmd_config @0x2f811516-0x2f811524 sets controller+0x3c bit 1 for a 32-bit address; the HAL omitted it. With the selector supplied by the same public command setup, hw5-20261026-density-05 (lease 794) read MR2/MR3 as 0xa0dd: density code 5, 16 MiB, and bring-up succeeded. The uninstrumented production into_region path also succeeded in hw5-20261026-density-11-park (lease 800), then the image halted before staging. Report: /home/ermacv/dev/oer-notes/research/hw-psram-density.md."

[[sources]]
id = "ESP_IDF_4D59230D_S31_SPIMEM_FLASH_LL_H_L616"
description = "ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7, esp-idf:components/esp_hal_mspi/esp32s31/include/hal/spimem_flash_ll.h:616, pinned in chips/esp32s31/vendor/artifacts.toml (Apache-2.0). spimem_flash_ll_set_addr_bitlen sets cache_usr_addr_4byte when the address length is 32 bits, separately from usr_addr_bitlen and usr_addr."
