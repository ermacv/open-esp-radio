# Short isolated PAC-only SAR observations, not a calibrated RF specification or a production lifetime contract.
schema = 1

[[sources]]
id = "HW17_S31_SAR_HOLD_20261027"
description = "SOURCE: s31-a rev0 run hw17-20261027-sar-isolated-03, lease #896, selections 141..144; ermacv/oer-notes research/hw-sar-hold.md. At 40 MHz, P2, background PWDET disabled, manual arm/trigger and no other PHY client: the FE +0x81c upper thirteen-bit lane retained a nonzero sample across repeated reads through observed ready+100 us and delayed-first-read controls, with and without clearing tone arm immediately after ready. Ready read 7 before and after every result read. Observed on one board in one run: four HOLD conversions among ten total conversions (two preflight, four HOLD, four EDGE); this is a 100 us observation, with the former incomplete preparation (XTAL enabled, missing cold-prefix steps and premature SAR2 initialization), not production equivalence or indefinite retention, every SAR mode, a completion timestamp or an electrical calibration claim."

[[sources]]
id = "HW17_S31_SAR_EDGE_20261027"
description = "SOURCE: s31-a rev0 run hw17-20261027-sar-isolated-03, lease #896, selections 140/145/146; ermacv/oer-notes research/hw-sar-hold.md. On one board in one run (four EDGE conversions among ten total), in the isolated P2 reference epoch, immediate reference 0/0x5555 publication preserved the previous sample and ready 7; arm also preserved observed ready 7. A manual trigger produced nonmonotone partial codes 0,1,2,3,4,5,6 across selections 140..146, then 7 near 20 us (3 is present in 146; 5 in 142..144), with distinct final reference samples. Old sample data persisted at early non-ready reads, then changed at a later non-ready read before final ready data: the word is not guaranteed valid or frozen while busy. The run used the former incomplete preparation (XTAL enabled, missing cold-prefix steps and premature SAR2 initialization); it does not validate the production epoch. No physical minimum/maximum latency, read at exactly 2 us, reference settling guarantee or voltage/power units is established."

[[sources]]
id = "HW17_S31_SAR_PREPARATION_20261027"
description = "SOURCE: firmware/probes/esp32s31-facts/README.md preparation ledger D1..D7; ermacv/oer-notes research/hw-sar-hold.md. Corrected probe repeats finite production common-power readbacks, whole-word PLL 0x15/0x1d (XTAL off), calibration clock, FE clocks, BBPLL mode, bias, open_i2c_xpd RF down/100 us/up/reset, SDM predicate, 10 us delay, PBus clear, I2C timing/BBPLL/ADC-rate/master, PWDET tables, FE initialization and TSENS first-acquire, in that order. Remaining differences: D1 ROM/SRAM 40 MHz context instead of staged bootstrap/PSRAM, platform reference counting and the Wi-Fi client cold baseline/LP-clock selection/combined BB+MAC reset entry, because there is no Wi-Fi client epoch and a standalone reset cannot reproduce its complete parent lifecycle; D2 100 us mcycle SDM bound instead of 9999 MAC ticks, 20 us byte/PBus bounds and 100 us SAR bound instead of production timer scheduling, to keep the run short; D3 background control disabled to isolate manual conversion; D4 RC settings/calibration, filter-DCAP, parameter snapshots, analog init1, RFPLL charge-pump, command RAM, later conditional SAR2 init, front-end update, crystal-duty/channel initialization omitted because they are the full RF calibration suffix with calibrated parameters; D5 full BB/RX/TX DC/IQ calibration and the 15 calibrated PBus reference-setup commands/forced TX clock omitted because no calibrated RF epoch exists; D6 stop-tone/TSENS release then ROM-download reset instead of restoring a shared tracked lifecycle, because the image has no other client; D7 nominal observations can be late at 40 MHz and use logged cycle intervals, without a real executor or completion IRQ. These differences prevent claiming production equivalence or qualifying PR #707 from this probe alone."

[[sources]]
id = "HW17_S31_SAR_REVIEW_20261027"
description = "SOURCE: s31-a rev0 run hw17-20261027-sar-review-04, lease #898, selections 140..146/149; ermacv/oer-notes research/hw-sar-hold.md. Measured commit 17e5ad48e577d8fd80071f7adb0305147e94174c; loaded ELF and exact probe sources retained under target/hw-hw17/hw17-20261027-sar-review-04/. The final rebased ELF differs: upstream base 6000f22f68284ceb4841065be54a13641fe887f5 adds BLE/local/generic/opaque probes (#683/#686/#689/#691/#692/#697/#699/#701/#703), PAC ownership/model/generator and watchdog support; root storage, registry, generic-IRQ dispatch, the new in-progress completion marker and retained LP-reset boot dispatch alter linked code/layout. BLE/local/opaque helpers borrow the single PHY/chip-clock/boot owners held in Session.sar. sar_prepare.rs remains byte-identical to capture. SAR sar.rs replaces the removed broad host-map setter with the production named-lane setters from #703; they preserve the same 0x3fa0 field image and preservation mask, checked from the model. No other SAR operation changes. README and SAR evidence/field/generated documentation also change after capture. The report inventories exact changed files and final revision; no final-head timing equivalence or stand run is claimed. With the corrected finite production prefix and remaining preparation differences D1..D7 above, all eight power readbacks passed, XTAL was off and SDM read 0x5b. One board, one short run, ten conversions: two preflight, four HOLD, four EDGE. Four HOLD conversions retained nonzero upper-lane data through observed ready+100 us, repeated/delayed first reads and arm-clear controls, with ready 7 before/after every read. Four adjacent reference publications and subsequent arm observations preserved ready 7 and the old result. Triggers showed nonmonotone partial codes (0,2,3,4,6 in this run), then 7; the earliest logged completed status-only ready read was 20.125 us after the post-trigger stamp, whose 0.725 us trigger-store uncertainty is separate. The previous result persisted at early busy reads and changed in a non-ready approximately 10 us window. Reference 0/0x5555 outputs differed only by a few codes, comparable with conversion variation; reference-caused distinct final data is inconclusive, despite unequal preflight values passing the syntactic gate. No physical minimum/maximum, exact nominal read time, sustained reference-only stability, production/#707 qualification or electrical calibration follows."
