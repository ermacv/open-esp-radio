id = "BLOB_WIFI_PWR_RAW18_BEACON_SERVICE_20261027"
description = "SOURCE: Blobray, esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21, esp32s31/libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4. wdev.o::wDev_ProcessFiq+0x58..0x70 samples power STATUS and RAW separately, then +0xa6..0xb6 acknowledges both full images through hal_tsf.o::hal_pwr_interrupt_clr_event+0x4 (0x2010d8c0). The exit test +0x6a..0x72 includes MAC STATUS, BSS-color status and power STATUS, but not power RAW. Given MAC STATUS14, +0x14c..0x15e chooses lmacProcessModemStateRxBeacon if power RAW & 0x60000 is nonzero, otherwise +0x19e calls lmacProcessRxSucData. lmac.o::lmacProcessModemStateRxBeacon+0x0..0xa posts message32 carrying the sampled RAW word; pp.o::ppTask dispatch case32 at +0xb4 selects +0x218..0x21e, which calls wdevProcessModemStateRxBeacon. That weak wdev.o body +0x2..0x10 copies 12 bytes from 0x20106000, +0x14..0x1e installs RX buffer address 0x20106010 in its local view, and +0x20..0x24 calls wDev_ProcessBeaconMemoryRxSuc with mode1; it does not consume the incoming RAW argument. This establishes a joint RAW17/18 service selector and early snapshot acknowledgement, not a separate RAW18 physical identity or ENABLE18 writer. The FIQ/weak consumer have complete instruction flow but partial call semantics; ppTask flow is partial although the reported case32 edge is resolved. Report: oer-notes/research/bx-wifi-mac-causes.md."
