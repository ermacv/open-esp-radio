id = "BLOB_WIFI_MAC_LOW_CAUSE_CONSUMERS_20261027"
description = "SOURCE: Blobray, esp32-wifi-lib f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a sha256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391, hal_sniffer.o::hal_sniffer_rx_set_promis+0xa..0x1e changes only ENABLE2 on its arg0=0 branch, according to arg1; this complete leaf establishes a sniffer accessor use, not an event identity or a proven caller of that branch. esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/librftest.a sha256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a, mac_common.o::mac_init+0xb8 writes ENABLE=0x1f. bb_common.o::beacon_print+0xa4/+0xac..0xb8 tests STATUS2 to select inspection of sampled RX end state and packet metadata; +0x168..0x178 tests STATUS3 and samples WIFI_BB+0x6c low8. +0x50..0x5c/+0x122..0x12a/+0x13e..0x14a RMW-OR CLEAR with 0xc, and +0x170..0x17c joins the common store after OR 8. do_rx_poll+0x1b2/+0x1d2/+0x582..0x5a2 has corresponding STATUS2/3 tests and a CLEAR3 operation. These are bounded observations in partial RF-test functions; their flow decodes, but opaque calls/value limits remain and do_rx_poll read-flow reaches a work limit. No physical start/end/error identity, safe CLEAR read-modify-write contract, or RAW4 producer follows. Report: oer-notes/research/bx-wifi-mac-causes.md."

[[sources]]
id = "BLOB_WIFI_MAC_SNAPSHOT_SERVICE_20261027"
description = "SOURCE: Blobray, esp32-wifi-lib f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a sha256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. hal_mac.o::hal_init+0x30/+0x3a writes ENABLE=0 then CLEAR=0xffffffff, and +0xdc publishes ENABLE=0x19a879e0, including 6/12/13/23/24. hal_enable_mac+0x14 restores its supplied whole enable image; hal_deinit+0x52/+0x5c masks all and clears all. wdev.o::wDev_ProcessFiq+0x44..0x4c obtains MAC STATUS via hal_mac_interrupt_get_event (hal_mac.o+0x4 reads 0x20104c48); +0x76..0x80 forwards the full snapshot to hal_mac_interrupt_clr_event (hal_mac.o+0x4 writes 0x20104c4c) before dispatch. Its instruction CFG has no separate bit test or task dispatch for MAC2/3/4/6/12/13/23/24: these bits participate in the aggregate nonempty test at +0x6a..0x72 and full-snapshot acknowledgement. This is a property of this FIQ, whose control-flow coverage is complete but call/value semantics are partial; it is not proof that another callback cannot service them or that an acknowledgement stops a hardware producer. No independent event identity or positive producer is established for 6/12/13/23/24. A 2026-11-04 cross-check of esp-rom-elfs 20260528 rev0 ROM sha256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87, wDev_ProcessFiq at 0x2f83885a..0x2f838a32, finds the same primary-bit dispatch set: 7/8/14/15/19/21/27/28. The full STATUS image is read at 0x2f8388a6 and acknowledged at 0x2f8388d0, with no separate branch on 1/2/3/4/6/12/13/23/24; ROM indirect callback bodies remain a coverage limit. Report: oer-notes/research/bx-wifi-mac-causes.md."

