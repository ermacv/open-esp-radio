id = "BLOB_WIFI_MAC_SNAPSHOT_SERVICE_20261027"
description = "SOURCE: Blobray, esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21, esp32s31/libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4. hal_mac.o::hal_init+0x30/+0x3a writes ENABLE=0 then CLEAR=0xffffffff, and +0xdc publishes ENABLE=0x19a879e0, including 6/12/13/23/24. hal_enable_mac+0x14 restores its supplied whole enable image; hal_deinit+0x52/+0x5c masks all and clears all. wdev.o::wDev_ProcessFiq+0x44..0x4c obtains MAC STATUS via hal_mac_interrupt_get_event (hal_mac.o+0x4 reads 0x20104c48); +0x76..0x80 forwards the full snapshot to hal_mac_interrupt_clr_event (hal_mac.o+0x4 writes 0x20104c4c) before dispatch. Its instruction CFG has no separate bit test or task dispatch for MAC2/3/4/6/12/13/23/24: these bits participate in the aggregate nonempty test at +0x6a..0x72 and full-snapshot acknowledgement. This is a property of this FIQ, whose control-flow coverage is complete but call/value semantics are partial; it is not proof that another callback cannot service them or that an acknowledgement stops a hardware producer. No independent event identity or positive producer is established for 6/12/13/23/24. Report: oer-notes/research/bx-wifi-mac-causes.md."

