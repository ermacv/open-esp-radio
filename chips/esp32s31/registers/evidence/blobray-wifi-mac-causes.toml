id = "BLOB_WIFI_MAC_LOW_CAUSE_CONSUMERS_20261027"
description = "SOURCE: Blobray, esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21, esp32s31/libpp.a sha256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4, hal_sniffer.o::hal_sniffer_rx_set_promis+0xa..0x1e changes only ENABLE2 on its arg0=0 branch, according to arg1; this complete leaf establishes a sniffer accessor use, not an event identity or a proven caller of that branch. esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/librftest.a sha256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a, mac_common.o::mac_init+0xb8 writes ENABLE=0x1f. bb_common.o::beacon_print+0xa4/+0xac..0xb8 tests STATUS2 to select inspection of sampled RX end state and packet metadata; +0x168..0x178 tests STATUS3 and samples WIFI_BB+0x6c low8. +0x50..0x5c/+0x122..0x12a/+0x13e..0x14a RMW-OR CLEAR with 0xc, and +0x170..0x17c joins the common store after OR 8. do_rx_poll+0x1b2/+0x1d2/+0x582..0x5a2 has corresponding STATUS2/3 tests and a CLEAR3 operation. These are bounded observations in partial RF-test functions; their flow decodes, but opaque calls/value limits remain and do_rx_poll read-flow reaches a work limit. No physical start/end/error identity, safe CLEAR read-modify-write contract, or RAW4 producer follows. Report: oer-notes/research/bx-wifi-mac-causes.md."

