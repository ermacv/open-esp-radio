id = "BLOB_WIFI_PWR_RAW18_BEACON_SERVICE_20261027"
description = "SOURCE: Blobray, esp32-wifi-lib f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a sha256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. wdev.o::wDev_ProcessFiq+0x58..0x70 samples power STATUS and RAW separately, then +0xa6..0xb6 acknowledges both full images through hal_tsf.o::hal_pwr_interrupt_clr_event+0x4 (0x2010d8c0). The exit test +0x6a..0x72 includes MAC STATUS, BSS-color status and power STATUS, but not power RAW. Given MAC STATUS14, +0x14c..0x15e chooses lmacProcessModemStateRxBeacon if power RAW & 0x60000 is nonzero, otherwise +0x19e calls lmacProcessRxSucData. lmac.o::lmacProcessModemStateRxBeacon+0x0..0xa posts message32 carrying the sampled RAW word; pp.o::ppTask dispatch case32 at +0xb4 selects +0x218..0x21e, which calls wdevProcessModemStateRxBeacon. That weak wdev.o body +0x2..0x10 copies 12 bytes from 0x20106000, +0x14..0x1e installs RX buffer address 0x20106010 in its local view, and +0x20..0x24 calls wDev_ProcessBeaconMemoryRxSuc with mode1; it does not consume the incoming RAW argument. This establishes a joint RAW17/18 service selector and early snapshot acknowledgement, not a separate RAW18 physical identity or ENABLE18 writer. The FIQ/weak consumer have complete instruction flow but partial call semantics; ppTask flow is partial although the reported case32 edge is resolved. Report: oer-notes/research/bx-wifi-mac-causes.md."

[[sources]]
id = "BLOB_WIFI_MAC_RFTEST_TX_IRQ1_20261104"
description = "SOURCE: Blobray, esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/librftest.a sha256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a. bb_common.o::tx_a_frame+0x40..0x58 sets primary ENABLE1 and RMW-ORs primary CLEAR with 3; +0x5c..0x78 modifies its selected TX configuration and PLCP words; +0x86..0xa2 returns when primary STATUS1 is nonzero, otherwise +0xa4..0xbc continues the wait with a timeout path. trig_tx_frame+0x2a..0x30 tests the same STATUS1; +0x32..0x50 also requires its elapsed-time condition before +0x52..0x82 repeats ENABLE1, CLEAR0/1 and the TX configuration/PLCP writes. By contrast, tx_data_frame+0x1e..0x2e enables/clears primary bit7, +0x32..0x3a updates its selected PLCP word, and +0x48..0x5a waits for STATUS7 then clears bit7. These are bounded instruction-path observations in partial RF-test functions. They establish a distinct test-TX polling use of bit1, not its physical cause, a general TX-completion alias, an independent bit0 identity, a RAW producer, or a safe CLEAR read-modify-write contract. Report: oer-notes/research/wifi-mac-irq-static-2026-11-04.md."

[[sources]]
id = "BLOB_WIFI_MAC_RFTEST_TX_BOUNDARY_20261104"
description = "SOURCE: Blobray, esp-phy-lib 20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/librftest.a sha256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a. Complete mac_common.o::ConfAddrGet+0x0..0x22 uses a table only for arguments 11..17 and otherwise returns 0x20104d6c (CONFIG3). Complete Plcp0AddrGet+0x0..0x22 uses a table for 1..27 and otherwise returns 0x20104d70 (CONTROL3); its argument10 entry at .rodata.CSWTCH.96+0x24 also contains 0x20104d70. Blobray data::export of archive member ordinal3, static table section108 symbol31 (.LANCHOR26), 108 bytes, confirms a read-only section with zero relocations, overlapping relocations and unknown relocation extents; symbol20 (.LANCHOR31), 28 bytes, independently captures the CONFIG table. Thus arguments0 and10 alias this same queue pair, rather than selecting different TX engines or independently asserting a mode. wifi.o::WifiTxStart+0xc0..0xc6/+0x116..0x11c passes zero to bb_common.o::test_tx_frame; +0x52..0x58 of that function forwards it to tx_a_frame, whose +0x6c..0x78 publishes CONTROL3 VALID/ENABLE. A positive STATUS1 selects its immediate return +0x8e..0xa2 without reading PRIMARY3; test_tx_frame+0x5c..0x7e then optionally runs background power control, delays and advances its software count. tx_data_frame+0x6..0xe instead passes10 to Plcp0AddrGet, publishes the same CONTROL3 VALID/ENABLE at +0x32..0x3a, waits STATUS7, clears7 and returns PRIMARY3 (0x2010553c) at +0x5e. tx_ack_start+0x66..0x7e first selects CONTROL3 format1, +0x138..0x13c calls tx_data_frame and +0x140..0x148 tests returned bits15:8 for its ACK-test result accounting. tx_ack_init+0xea..0xee uses FillTxPacket, whose +0x4e..0x52 calls the same direct fill_tx_frame preparation used by the bit1 test path. This recovers software publication/consumption boundaries; it does not establish the physical STATUS1 producer, its order relative to STATUS7 or ACK reception, a safe descriptor-reuse boundary, or a new CONTROL[21:20] mode meaning. Reported callers have complete instruction flow in the selected views but partial value/call semantics. Report: oer-notes/research/wifi-mac-test-tx-boundary-2026-11-04.md."
