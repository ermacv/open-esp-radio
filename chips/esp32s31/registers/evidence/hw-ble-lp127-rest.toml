description = "SOURCE: same s31-c rev0 run hw21-20261027-ble-lp127-rest-01/#901, selections170/171/172, report /home/ermacv/dev/oer-notes/research/hw-ble-lp127-rest.md. CONTROL0 stays1; one near target crosses in each initial CONTROL4 state, then only CONTROL4 toggles with its flag pending, followed by CONTROL1 and all-ones+34. Compare byte24/cause0x40000/127/LPCON vector0x80 persist across CONTROL4 toggles. Compare-associated CONTROL2 persists when CONTROL4 changes and clears on CONTROL1 without acknowledging compare; sampled readable mode images5/0x15 become0x11/1 on CONTROL1. Sleep16/17 isolated low-byte flags are positive in either CONTROL4 state, CONTROL2 stays0, toggling CONTROL4 and CONTROL1 preserve those flags, and+34 clears them. Bits3/31:5 of readable mode58 stay0. Bit1 is a write-trigger without a read accessor; state-word upper bytes are not sampled. No observed CONTROL4 effect is established for these stimuli; its purpose, unobserved producers and simultaneous transitions remain unknown. Poll bound200000 cycles, ordinary window4096; no statistical series or real system sleep."
