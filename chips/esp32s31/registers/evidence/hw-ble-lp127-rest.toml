description = "SOURCE: s31-c rev0, hw21-20261027-ble-lp127-rest-01 selections170..172, compare/sleep16/sleep17.json: compare gives byte24=1/cause0x40000/source 127/LPCON vector0x80; +34 clears. Sleep16/17 byte1c/20 positives do not produce those outputs in tested setup. Inherited wake enables and zero PMU/ETM observations have no positive wake control; no actual sleep or PMU-route absence proof. Digital-only, CPU masked, hart1 held. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-ble-lp127-rest.toml (source HW21_S31_LP_AWAKE_ROUTE_20261027)."

