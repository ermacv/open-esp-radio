description = "SOURCE: s31-c rev0, hw21-20261027-ble-lp127-rest-01 selections170..172: with CONTROL0=1, compare pending/output survives CONTROL4 toggles; CONTROL1 clears CONTROL2 without acknowledging compare. Sleep16/17 flags survive toggles/CONTROL1 and clear via+34. No CONTROL4 effect is established for these stimuli; upper state bytes, unobserved producers and simultaneous transitions remain unknown. No real system sleep. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-ble-lp127-rest.toml (source HW21_S31_LP_CONTROL4_20261027)."
