description = "SOURCE: s31-c rev0 run hw21-20261027-ble-lp127-rest-01, lease #901, selections170/171/172, compare.json/sleep16.json/sleep17.json, state bases0x17100/0x17300 with phases0/0x10/0x20/0x30/0x40. Report: /home/ermacv/dev/oer-notes/research/hw-ble-lp127-rest.md; raw logs: target/hw-hw21/<run>/. Near+6c compare gives byte24=1,cause0x40000,matrix127 high and LPCON MODEM_INTR_VECTOR=0x80; all-ones+34 returns each to0. Every modeled LPCON wake-enable field reads1 (image0x3fff), including LP_TIMER_INTR_WAKEUP_EN. Sleep16/17 future+64/+68 crossings produce isolated low byte1c/20=1 but no LP cause,127 or LPCON vector, with known+10 enables1/18 issued. Every modeled HP/LP RAW/ST/ENA field, PMU WAKEUP_ENA,wake/reject and LP-CPU cause reads0; MAIN_STATE last/target/current reads1/4/4 and LP ETM wake flag0 throughout. Wake enables are inherited and unchanged; no PMU sleep request or transition is made. This establishes compare visibility at the LPCON observation boundary, not successful PMU wake routing or absence of a masked/unobserved route. Sleep17 uses advancing completed BTLC captures (two deltas216), digital clocks, ETM6/7 and bit11, without isolating prerequisites. CPU IRQs masked,hart1 held,no RF/DMA."

