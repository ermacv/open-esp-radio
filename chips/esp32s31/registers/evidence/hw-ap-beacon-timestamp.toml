description = "SOURCE: s31-a rev0, 2026-11-10, run 4 of the beacon-stamp probe images at 2583c01c7 (probe on s31-a, ACK responder on s31-b), air capture SHA-256 1383e7af43136ec8a473d9189d82756ce2737272e1b524a847abe32b29ab217a (175 frames, all with TSFT). 32 beacons and 4 probe responses, each matched once to the capture by its tag: on a SoftAP's ordinary voice-queue management transmission on interface one (MacInterface::AccessPoint, the AP TSF started by reset_and_start_access_point_tsf), the MAC writes that interface's TSF into octets 24..32 of the transmitted MPDU at a fixed point of the transmission after its queue and medium wait. The value on air was inside the AP TSF interval of the frame's publication and completion samples in 36/36 frames, never the MAC local time, never the caller's value K; the sniffer TSFT minus the on-air Timestamp is one line (4.75 ppm) for undelayed and 11.4-ms delayed frames alike. The transmit buffer read back after completion still held K in 36/36: the write is to the air copy. Limits: DSSS 1 Mb/s, one attempt, AIFSN 2 / CW 0, beacons to broadcast and probe responses to an absent receiver; no action frame; the exact write moment is bracketed between about 100 us before the PPDU start and 10 us after it, not established. Details: oer-notes/research/s31-beacon-queue.md, sections Run 4 of the 2583c01c7 images and BeaconStamp from run 4."
