description = "SOURCE: s31-a, run hw27-20261027-btlc-natural-01, lease #926; one 38-minute PAC-only observation (selection 230), following bounded readiness 231. Digital BT MAC/APB/timer reset, CLOCK_SHIFT=3, CONFIG_24=0, CONTROL0=1; no BTLC VALUE writes or TIMER_ARM assertion (read-back 0); CPU XTAL / 1 read-back 0/0/0, nominal 40 MHz; MIE remained disabled. 230-natural.json / analysis.json: one natural raw decrease in [2147.476077875, 2147.486089350] nominal seconds after initial capture, overlapping the first-90-second rate prediction [2147.483588156, 2147.483705034]. Across 2280.004402800 nominal seconds the rate interval is [1999999.998026320, 2000000.002214908] ticks/s, using bracketed mcycle and one-tick quantization; journal every 90 s and digital polls approximately 10 ms. One observed primary-positive episode, STATUS_1=2 / matrix 124 high; retained unserviced for approximately 102.519 nominal seconds until the single positive affine image 2 ack at about 2250 s. Ack lowered both, still quiet approximately 29.999 s afterward. NRT snapshot 1 and source 133 stayed zero in all journaled observations. This establishes one natural period and the measured retention interval, not hidden event multiplicity, ISR service count, production #713 continuity, multi-period delivery, a universal shift/rate equation or oscillator calibration. Evidence: hw27/hw27-20261027-btlc-natural-01/230-natural.bin, 230-natural.json, 230-natural.log, journal.csv and analysis.json in the XDG data open-esp-radio/evidence store. Notes: https://github.com/ermacv/oer-notes/blob/main/research/hw-btlc-natural-wrap.md."
