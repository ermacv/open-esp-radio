id = "BLOB_MAC_TX_SOFTWARE_SEQUENCE_RETRY_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Inspected libnet80211[ieee80211_output.o]::ieee80211_send_setup+0xf4..0x100 increments a software sequence counter; +0x180..0x182 publishes Sequence Control at frame+22. ieee80211_encap_esfbuf+0x41e..0x420 also publishes Sequence Control. libpp[lmac.o]::lmacProcessShortRetryFail+0x206..0x20a and lmacProcessLongRetryFail+0x16e..0x172 set the frame header Retry flag in software, with other inspected branches doing likewise before re-entering lmacTxFrame via lmacRetryTxFrame. These positive software users do not exclude other hardware facilities and do not identify CONTROL bit 22 as an automatic retry/sequence gate. Its physical function remains opaque despite the separately proven TXOP-slot/descriptor-class condition."
