id = "BLOB_MAC_BA_SCALAR_ARRAY_CONTRACT_20261104"
description = "SOURCE: Blobray static and concrete execution, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. libnet80211[ieee80211_ht.o]::ampdu_process_multicast_address_qos_frame+0x28..0x46 passes addresses of scalar SSN/low/high words at SP+4/+8/+12 and the hardware index from state+32. libpp[hal_ampdu.o]::hal_ba_session_restore_by_hw_index+0x26..0x50 adds four times that index to each supplied pointer, an array-shaped contract. Concrete caller cases with SSN=100, window=64, buffered-count=0, incoming SN=228 and active target bank publish SSN=100/zero bitmaps at index 0, but SSN=0/low=0/high=0xa5a5a5a5 at index 1 with explicit stack fill 0xa5. Unknown padding stops before the unknown high-bitmap write. Direct calls with three eight-element arrays select their independently supplied values for every index 0..7; inactive banks do not perform these writes. The retained wifi-ba-contract vendor scenario checks these conditional observations. The rev0 ROM caller at 0x2f83e29a statically contains the same inlined indexing. Original whole-firmware selection, complete production-state reachability and on-air malfunction remain unproved. No opaque BA lane identity or new open-driver restore ABI is inferred."

