id = "BLOB_MAC_KEY_COPY_EXECUTION_20261104"
description = "SOURCE: Blobray in-process linking/execution, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391; esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. Eight concrete cases execute hal_crypto_set_key_entry with aligned distinct input bytes and the actual ROM memcpy, for entries 0/24 and API types 3 length 16, 9 lengths 16/32 and 2 length 32. Explicit register-storage models start key words at 0xa5a5a5a5. All eight return: CCMP/GCMP-128 write four key words without touching the tail; GCMP-256/TKIP write eight key words including input bytes 16..31. The cipher codes are 3/5/5/2; bit 26 is set only for GCMP length 32. Allocation/logging/free references are explicitly absent and unreached, without call-response models. The separate clear operation zeros the entry. This establishes concrete register publication, not concurrent silicon key use, arbitrary lengths, hardware consumption of every tail byte or hardware Michael-MIC computation."

[[sources]]
id = "ESP_IDF_4D80C1B2_KEY_MATERIAL"
description = "SOURCE: espressif/esp-idf@4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d. components/wpa_supplicant/src/common/wpa_common.c::wpa_cipher_key_len returns 32 for TKIP/GCMP-256 and 16 for CCMP/GCMP; wpa_cipher_to_alg maps both GCMP variants to WIFI_WPA_ALG_GCMP. esp_supplicant/src/esp_wifi_driver.h::wpa_alg defines API TKIP=2 and GCMP=9, distinct from public cipher enum and hardware selector domains. src/rsn_supp/wpa.c::wpa_supplicant_install_ptk -> wpa_sm_set_key -> esp_supplicant/src/esp_wpa_main.c::wpa_install_key preserves key pointer/length into esp_wifi_set_sta_key_internal. The TKIP GTK installation at wpa.c lines 965..971 separately handles the sixteen-byte temporal key and two eight-byte Michael MIC keys. This identifies the software input bytes; BLOB_MAC_KEY_COPY_EXECUTION_20261104 independently establishes their MAC-table publication."

[[sources]]
id = "BLOB_MAC_MGMT_CCMP_CALLBACK_PATH_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da; ESP-IDF@4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d. Inspected libnet80211[ieee80211_crypto_ccmp.o]::ieee80211_ccmp_decrypt+0x1fe..0x21a loads wpa_crypto_funcs+0x1c and invokes a callback with temporal-key bytes at software-key+168, frame inputs and output length; +0x222..0x23e copies returned plaintext and frees the result. A separate NAN branch bypasses the call. The function has partial control-flow coverage. esp_wifi_crypto_types.h::wpa_crypto_funcs_t identifies RV32 offset 0x1c as ccmp_decrypt; src/crypto/crypto_ops.c's default table selects ccmp_decrypt, whose ccmp.c body calls aes_ccm_ad. wpa_crypto_funcs_init copies the supplied 52-byte table. Protected STA/AP management branches and nan_input reach ieee80211_ccmp_decrypt, whereas the bit-17 hostap consumer selects two framing/key-metadata paths described in BLOB_MAC_MGMT_RX_CRYPTO_INDICATOR_20261104. The callback is configurable and its AES backend may be hardware accelerated. This does not establish a cycle saving or prove that bit 17 controls whether this separate callback executes."

