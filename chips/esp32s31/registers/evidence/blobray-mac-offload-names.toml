id = "BLOB_MAC_RX_CONTROL_NAMES_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_tsf.o]::tsf_hal_set_rx_control_timestamp_use_tsf_enable/disable+0x08..0x0e set/clear WIFI_MAC.RX_CONTROL bit 1. Complete libpp[hal_mac.o]::hal_mac_set_rx_beacon_memory_addr_map+0x0a..0x16 replaces bits 9:2 with the low eight argument bits; wDev_BeaconMemory_Init calls it with 0xf0. Complete libpp[hal_mac_ctl.o]::hal_mac_rx_set_abort_frames_from_transbss+0x08..0x1c sets/clears bit 17, and the matching getter+0x04..0x0a returns it. hal_he_set_multi_bssid+0x1c..0x24 independently sets bit 17. Complete libpp[hal_mac.o]::hal_mac_set_rxbuf_reload_use_hw_beacon_enable+0x08..0x10 sets bit 27; hal_init+0x110 calls that leaf. Function-derived names establish no general address mapping, frame acceptance qualification or new offload lifecycle."

[[sources]]
id = "BLOB_MAC_BEACON_FILTER_ABORT_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391; esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. Complete libpp[hal_pwr.o]::pwr_hal_set_beacon_filter_abort_enable/disable+0x08..0x0e set/clear STA_BEACON_FILTER_CONTROL bit 3. Complete pwr_hal_set_beacon_filter_abort_length+0x0a..0x1a preserves 0xffff000f and inserts its argument shifted left four through bits 15:4. ROM enable/length copies agree. pm_mac_enable_tsf_tbtt_soc_wakeup+0x70..0x86 and pm_mac_enable_tsf_tbtt_modem_wakeup+0xa4..0xba conditionally call length then enable. Length units and receive-abort timing are unestablished."

[[sources]]
id = "BLOB_MAC_TXOP_LIST_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[hal_mac_tx.o]::mac_tx_set_txop_q+0x30 admits list slots 0..2; +0x58..0x68 preserves bits 31:30 and publishes the slot in LENGTH_CONTROL bits 29:28. libpp[lmac.o]::lmacRequestTxopQueue independently allocates those three slots; software sentinel 3 takes the formatter's count-clear branch and is not a published selector. Complete hal_mac_fill_hwtxop addresses 0x2010558c+0x3c*slot-4*(position-1), writes the low twenty descriptor-address bits at +0x1c..0x2e, then copies metadata word zero low twelve bits into bits 31:20 at +0x30..0x3c. ppCalTxopDur+0xcc..0xd0 caps the continuation count at fifteen; lmacSetTxFrame+0x156..0x162 passes that result to the formatter. This yields three fifteen-word lists at offsets 0x1554..0x1604, with positions reversed within each list. The top six words overlap HE_SCRATCH elements 0..5. No concurrent-use exclusion, detach contract or arbitrary-length truncation safety is established."

[[sources]]
id = "BLOB_MAC_BEACON_RX_MEMORY_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[wdev.o]::wDev_BeaconMemory_Init+0x1c..0x26 clears 1024 bytes at CPU/APB address 0x20106000; +0x40 writes descriptor SIZE bits 13:0=0x3f0; +0x50 copies SIZE into LENGTH bits 27:14; +0x5a/+0x64 set OWNER31/EOF30 and +0x70 clears SOSF29. +0x7c/+0x7e write BUFFER=0x408f0010 and NEXT=0x408f0000 at CPU offsets 4/8. wdevProcessModemStateRxBeacon+0x02..0x10 copies the twelve-byte descriptor and +0x14..0x1e substitutes CPU buffer 0x20106010 before delivery. wDev_IndicateBeaconMemoryFrame+0x44..0x50 and +0x9e..0xb8 consume LENGTH as received bytes. libpp[hal_debug.o]::dbg_dump_rx_links+0x38..0x8a supplies ordinary RX layout names size, length, offset28, sosf29, eof30, owner31, buf and next; OFFSET/SOSF names transfer by the matching descriptor geometry, not by a beacon-specific diagnostic. The two 1-KiB address views are observed for this fixed window only. Hardware writeback phases are conservative; EOF is already one at arm and is not an established completion predicate. No general alias mapping, allocator, release or ownership invariant is established."

[[sources]]
id = "BLOB_MAC_BEACON_TAG_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_pwr.o]::pwr_hal_set_mac_beacon_memory_tag_start_offset+0x08..0x1c replaces MODEM_PWR word 0x2010d854 bits 24:17 with eight argument bits. Complete pwr_hal_reset_mac_beacon_memory_tag_start_offset+0x08..0x10 sets bit 25; self-clear is unestablished. Complete pwr_hal_set_mac_beacon_memory_tag_enable/disable set/clear bit 26. Complete wDev_BeaconMemory_tag_apb_start and wDev_BeaconMemory_tag_start_offset map admitted byte count n=1..1023 to 0x20106400-n and (1024-n)>>2 respectively. tbtt_adaptive_setup supplies (software_halfword+1)*4 and calls offset, enable then reset; tbtt_adaptive_servo uses the CPU address helper. Tag contents and remaining word bits are not established."
