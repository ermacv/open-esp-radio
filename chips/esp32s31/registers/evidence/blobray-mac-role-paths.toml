id = "BLOB_MAC_TSF_ROLE_API_MASKS_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. wifi_station_start calls complete hal_enable_sta_tsf on 0x2010d858, while nan_start calls complete hal_enable_nan_tsf on 0x2010d868. Those enable bits 27/31 before setting mode bits 22:19 to 1/4. The AP path ieee80211_hostap_attach -> ic_reset_tbtt -> wDev_Reset_TBTT calls hal_mac_tsf_reset(0): at 0x2010d860 it clears bits 30/31, clears shared load data, requests the AP TSF load and sets bits 30/31. Complete hal_disable_softap_tsf clears that pair. Separately, complete tsf_hal_set_tsf_enable/disable accept generic domain index 1 and set/clear bits 27/31 of the same AP word; no direct caller of those generic entries was recovered in the six-input scan. This does not equate bits 27/30 or prove either individual hardware role. Generic indices 0/1/2/3 address STA/AP/NAN/BTWT; legacy hal_mac_tsf_reset opcodes 0/1/3 instead reset AP, STA then AP, or NAN. nan_update_tsf passes legacy selector 3 to reset/time publication. These are distinct selector domains; reset opcode one is not evidence of an APSTA mode bit."
