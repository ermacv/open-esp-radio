id = "BLOB_MAC_MISC_FCS_FILTER_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391; ESP-IDF@4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d components/esp_wifi/include/esp_wifi_types_generic.h defines WIFI_PROMIS_FILTER_MASK_MISC=1<<3 and WIFI_PROMIS_FILTER_MASK_FCSFAIL=1<<6. libpp[wdev.o]::wdev_set_promis_filter+0x0..0x14 copies the public four-byte filter unchanged. wdev_set_promis_misc_pkt+0xe..0x26 forwards it to hal_sniffer_set_promis_misc_pkt(1,filter) only when sniffer state and MISC are enabled, otherwise passing (0,0). Complete libpp[hal_sniffer.o]::hal_sniffer_set_promis_misc_pkt reads 0x201040f4. With enable nonzero, +0x14..0x1a publishes bits 26:17=0x3c3; +0x1c tests filter bit 6 and +0x22..0x2c then replaces that range with 0x1c3 when FCSFAIL is requested. Their sole difference is bit 26, cleared when requested and set otherwise. Disable restores the bit-26-set base and clears the dump enable. Twelve isolated executions over zero/ones/distinct initial storage and enable/FCS combinations return with matching full final words and write counts; enabled paired cases differ only in bit 26. Bits 31:27 are preserved. The low byte becomes 0x78 when enabled and zero when disabled; its units/function remain unknown. The register model names the vendor filter intent, not a measured packet-delivery result, global RX acceptance rule or CPU saving. No silicon FCS consumer is modeled."

