id = "BLOB_MAC_ROLE_CONTEXT_PATHS_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. wifi_station_start+0x90, wifi_softap_start+0xba, nan_start+0x34 and wifi_set_promis_process+0x44 call ic_set_vif with context 0/1/2/3 respectively. ic_set_vif selects wifi_set_rx_policy operations 1/8/10 for STA/AP/NAN, or ic_enable_sniffer for context three. NAN policy operation 11 separately programs MAC address two and nan_get_clust_id as BSSID two; operation 12 disables that receive policy. Complete hal_mac_set_addr writes the high address word from two bytes, clearing upper bits before setting RX_POLICY_ENABLE. Complete hal_sniffer_enable changes only named fields of RX policy queue three. nan_disc_enable_rx/disable_rx only change a software byte, not a discovered hardware gate. wifi_mode_set's recovered jump table selects the STA-creation path for public modes 1/3, with mode three continuing to the AP callback-table path; this is context composition, not identification of a separate hardware APSTA bit. Larger callers have partial semantics/control flow and callback targets remain bounded observations. This source does not establish whole-mode lifecycle equivalence, a complete per-mode opaque census or on-air concurrent operation."

