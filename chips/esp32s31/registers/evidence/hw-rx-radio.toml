id = "HW18_RX_UNCOMMITTED_WRITES_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: the same single run hw18-20261027-rx-radio-01-s31b, lease 895, unpushed image composition 1f5309321f000c0fe7e81525b6eed118d432937b; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. E rows show 13 observed clusters of changing leading words with both CONTROL samples 0x80200080, no RX_DONE, original descriptor NEXT, and stationary sampled MAC BASE/LAST/NEXT. In all 13 clusters the leading word of the current NEXT head is unchanged: changes begin at its linked successor, node 0 after R, 3 after NEXT=2, or 6 after NEXT=5. This is a sampled leading-word result, not an untouched-whole-head claim. Clusters overwrite already non-sentinel words and include nodes 3/4/6/7 which later contain beacon segments. The first starts at scan 0x3f; others include 0xad, 0x10b, 0x2b9, 0x37b, 0x43e and 0x741. Grouping leading-value changes separated by at most four scans gives 3-26 observed changed nodes per cluster; this is not packet boundary detection or a complete write count. Twenty-four ring nodes outside the three completed chains retain changed leading words at stop. These are repeated writes without visible descriptor/cursor commit. Aborted/filtered reception with rollback is a hypothesis, not a confirmed cause. A changed sentinel is not established as accepted-frame membership, completeness or ownership evidence."

