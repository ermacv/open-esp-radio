id = "HW_RX_CHAIN_LAPS_20261117"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run d3 of tasks/156 (probe esp32s31-rx-chain --features laps, commit 662648e91), cargo stand lease of s31-a and c5-a, air exclusive; the esp32c5-wifi-injector sending non-QoS Data at 6 Mb/s to the station at seven lengths around the buffer, 15 s each. Rings of 32 descriptors of 128 and of 256 bytes, taken and recycled through the frozen LAST: 30 995 and 30 992 of the injector's units over 2 752 and 2 096 laps, up to 13 and 7 descriptors a unit. In every unit (n - 1) x SIZE + the terminal LENGTH equals the joined bytes, and the frame's bytes are at their offsets for its whole length. The terminal LENGTH is the last buffer's bytes rounded up to a word (0 to 3 bytes of padding after the frame); the frame's length is the RX-control tail's signal length less the FCS. The RX-control metadata in the first descriptor is the frame's (rate, signal length). OFFSET and SOSF read zero in every descriptor. Every frame of one length carries the same body, so provenance between frames of one length rests on the descriptors' count alone. 13 frames the injector counted acknowledged completed no unit; cause not established. Details: oer-notes/research/rx-chain-laps-2026-11-17.md."

