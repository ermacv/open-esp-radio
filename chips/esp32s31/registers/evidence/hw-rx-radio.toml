id = "HW_RX_RING_STOP_RELEASE_RESTART_20261120"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 1504 of tasks/277 (PR #1368 at 3d7c179ba, images built from that commit), probe esp32s31-rx-ring, case R4; s31-b sending case C (esp32s31-case-c-sender) on channel 13 at 20 MHz. A ring of 16 descriptors and R over an arena of 32 buffers of 256 octets (floor 64), 15 spares. 50 turns, each: 200 ms served; the stop in the HAL's order (RxRing::stop_walker, WifiMacHal::request_stop with its 20 us hold, RadioDomain::reset_stopped_wifi_mac_block, RxRing::release), 27 to 29 us; every one of the 32 handles back after the release in every turn; the cold start from the preparation (initialize_wifi_mac, the channel, open_core, publish_cold, enable_walker, start_receive), 794 to 829 us; then 200 ms served. Every turn received the sender's units after its start (120 to 165, 7 607 in all) and before its stop (at least 114, 7 676 in all), with no byte mismatch and no Length or DoorbellPending anomaly. Other channels, widths, ring geometries and a stop under a full ring were not exercised. Logs in evidence/277/run3."

[[sources]]
id = "HW_RX_RING_CHAINS_COPIED_IN_PLACE_20261120"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 1504 of tasks/277 (PR #1368 at 3d7c179ba), probe esp32s31-rx-ring, cases R1 and R2 over one 2 s window, ring as in HW_RX_RING_STOP_RELEASE_RESTART_20261120. 1 519 of the sender's units: 750 singles lent for spares (every handle back to the spares) and 769 chains copied in place by RxRing's Chain::copy_in_place and re-armed where they stood: 258 long A-MSDUs of 6 descriptors, 257 frames of 700 octets of 3 and 254 of 1 500 octets of 7, each the count (64 + the MPDU without its FCS, rounded up to a word) / 256 rounded up gives. Every byte the sender sets agreed in every unit (Duration, Sequence Control and Retry excepted), and every unit's bytes after the header were its MPDU without the FCS rounded up to a word (HW_RX_CHAIN_LAPS_20261117). No Length or DoorbellPending anomaly. R3 after it: 100 ms unserved, the walker standing with NEXT on the armed tail and the tail not completed, the cursor read twice unchanged; then 800 units in 1 s, no mismatch. Logs in evidence/277/run3."

[[sources]]
id = "HW_RX_CHAIN_CONTINUATION_WORD_20261120"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 1504 of tasks/277 (PR #1368 at 3d7c179ba), probe esp32s31-rx-ring, case R2, the chains of HW_RX_RING_CHAINS_COPIED_IN_PLACE_20261120; also lease 1503 (541e974b0) with 784 chains. The CONTROL word of every non-terminal descriptor of a chain, read as the walker left it before the copy: 0x80400100 in all, the first descriptor of 769 chains and 2 559 middle ones; OWNER 1, RX_DONE 0, SOSF 0, OFFSET 0, LENGTH 256, SIZE 256, buffers of 256 octets. The walker writes no RX_DONE and leaves OWNER set on a continuation, and its LENGTH equals SIZE. Other buffer sizes and frames longer than 1 500 octets were not exercised. Logs in evidence/277/run2 and run3."
