id = "HW_RST_WIFIMAC_AFTER_STOP_REQUEST_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 233 (branch probe/rx-rebind-4 at cd11e8f9d, images built from that commit), probe esp32s31-mac-reset --features settle,only-r4 after a short pass; s31-b sending as in HW_RST_WIFIMAC_RUNNING_RX_20261119. The last resort's shape. A cycle of R4, edge for edge: a receive window of 20 ms; the walker's edge, the MAC's stop request, one read of the activity field, the walker's stop proof (a register read), then at once, with no settle and no poll, one RST_WIFIMAC pulse, the cold preparation, the channel, the ring rebuilt and started; a receive window checked by payload. The activity read just after the request was still set in 2 642 of the 3 500 cycles with long rows (75 percent) and in 516 of the short pass's 718: the MAC was reset while active. Result: 14 366 cycles (7 182 under steady air, 3 591 under aggregates, 3 593 under other air), a short row kept for each: no silent start; the receive-success cause of RAW stood in every steady and every aggregate window. Long rows for the first 3 500 (steady air): 65 729 frames checked by payload after their starts, none bad; NEXT and LAST zero after the reset and after the cold preparation in all. The sender: its two steady turns 147 884 of 153 920 and 146 024 of 152 003 acknowledged; its first aggregates turn, inside the part, 269 572 of 277 623 aggregates with a usable Block Ack (97.1 percent); its second aggregates turn ran after the part had ended. Against a cycle of 219/3 (HW_RST_WIFIMAC_RUNNING_RX_20261119), whose reception died: the walker's edge and the stop request before the reset, and one reset a cycle where 219/3 had two; which of them matters is not isolated. So a reset that follows the walker's edge and the stop request, whether or not the activity has cleared, kept reception in these 14 366 cycles. Not run: a MAC whose activity never clears (a hung MAC), frames longer than a buffer. Details: oer-notes tasks/233 and 234; logs in evidence/233/r1."

