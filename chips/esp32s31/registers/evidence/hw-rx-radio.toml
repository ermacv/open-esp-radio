id = "HW18_RX_COMMITTED_PREFIX_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: the same run hw18-20261027-rx-radio-03-s31b, lease 900, clean pushed commit f38ee37038df35a2da858490035ff9503ff464fb; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. Three matched channel-13 AP beacons, sequences 1938-1940, occupy R/0/1, 2/3/4 and 5/6/7 with LENGTH 128+128+12 (268 bytes, header offset 64). Full snapshots at scans 0x91/0x278/0x460 preserve each committed chain with stable CONTROL and before/after cursors. Sampled LAST progresses 0 to 1/4/7 and NEXT R to 2/5/8 only at the three data-success/terminal transitions; an in-scan mixed observation LAST=4,NEXT=2 precedes NEXT=5, so cursor pairs are not atomic. Rejected-write clusters leave the sampled cursors stationary. The next accepted chain begins at the preceding NEXT and replaces abandoned data in its path; head 5 had dirty words at scans 0x13e and 0x22c before the third accepted beacon. Every word of each of the nine committed buffers is unchanged from its commit snapshot to stop. Unused terminal tails at nodes 4/7 are observed dirty beyond LENGTH=12 and are not accepted payload. Their attribution to old/abandoned data is an inference from the clean unused tail at node 1 and the earlier leading-word changes at nodes 4/7, not a direct observation of all tail writes. This supports exact accepted-node prefixes for these three commits, not a universal fresh-byte or release proof, independent air-byte comparison, in-flight drain proof or production consumer execution. SOSF/OFFSET stay zero in all control samples."

