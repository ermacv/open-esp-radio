id = "HW_RST_WIFIMAC_RUNNING_RX_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, runs 219/1 (lease 1483, fb73d5ea6) and 219/3 (lease 1485, 7388d3cfe), probe esp32s31-mac-reset --features settle; the same sender and ring. RST_WIFIMAC pulsed on a running MAC through the domain's reset_wifi_mac_block (716 to 883 cycles), in run 219/3 then the walker's edge as the vendor's wifi_reset_mac orders it (the reset, then hal_mac_rx_disable); records from the reset's proof as in HW_WIFIMAC_STOP_THEN_WALKER_EDGE_20261119: no change of any frame region, prefix or descriptor word after the first record in 467 stops (219/1) and in the 4 512 of 6 194 stops the probe's table held (219/3; 65 with a unit in flight). WALKER_ENABLE read set after the pulse without the edge (219/1, 467 of 467) and clear after it with the edge (219/3). After each, the cold preparation, the channel and a start: in 219/3 reception lived through stops 0 to 618 (about 19 units and 20 data successes a start, 25 488 frames acknowledged to the sender) and from stop 619 on received nothing and did not come back; in 219/1 (no walker's edge after the pulse) the acknowledgements ended at the first start after the first reset. The cause of either loss is not established; the receive filter's policy words and the interface addresses did not differ from the first start's in any of the 4 512. Not exercised: a reset after a whole stop, the vendor's hal_deinit before it. Details: oer-notes tasks/219 to 226; logs in evidence/219/r1 and r3."

[[sources]]
id = "HW_WIFIMAC_STOP_WALKER_FIRST_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run 230/3a (branch probe/rx-rebind-4 at 841b8539f, images built from that commit), probe esp32s31-mac-reset --features settle,only-vendor, one part a boot after a short pass of 125 stops; s31-b sending as in HW_WIFIMAC_STOP_THEN_WALKER_EDGE_20261119 in turns of 150 s. The order the port carries for a stop (decided in oer-notes tasks/232): the walker's edge first (ROM_REV0_HAL_MAC_RX_GATE), then the MAC's stop as one atom, the request (request_mac_channel_stop_without_power_save), a settle of 20 us, the activity field polled to zero within 10 ms, a settle of 5 us (the vendor's hal_mac_deinit, read with Blobray in oer-notes research/vendor-mac-stop-start-2026-11-19.md); then a wait, during which the records run. Records from the activity's clear as in HW_WIFIMAC_STOP_THEN_WALKER_EDGE_20261119 (every descriptor's words and every buffer's prefix and frame region at 20 us, 100 us, 1 ms, 20 ms and 200 ms): no change after the first record in 2 983 stops (1 243 steady, 896 aggregates, 844 other air), 972 with a unit in flight; the first record ended at most 482 us after the clear. From the request to the clear 20.3 to 20.7 us (6 505 to 6 614 cycles): the activity read clear at the first poll after the settle in every stop, against 0.5 to 3.0 us when polled at once in our order. Two sums of NEXT's node and the next one (descriptor words, word-wise sum and xor of each buffer) at the clear and from 27 to 32 us after it, the second ending at most 58 us after the clear, saw no change. After each stop the ring rebuilt and the MAC resumed: 22 779 frames checked by payload after the starts, none bad, no start without a data success. So the release point the port cites is the activity's clear and a wait the first record covers: nothing was written after the first record, ending at most 482 us after the clear, in these 2 983 stops and in the 3 978 of our order, and a wait of 1 ms on the port's timer stands on that. Not exercised: frames longer than a buffer, rates below the sender's, a MAC whose activity does not clear. Details: oer-notes tasks/227 to 232; logs in evidence/230/r3a."

[[sources]]
id = "HW_RST_WIFIMAC_AFTER_STOP_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run 230/3b (branch probe/rx-rebind-4 at 2bb3a6bba, images built from that commit), probe esp32s31-mac-reset --features settle,only-r1 after a short pass of 718 cycles; s31-b sending as in HW_RST_WIFIMAC_RUNNING_RX_20261119. A cycle of R1, edge for edge: a receive window of 20 ms; the MAC's stop request (request_mac_channel_stop_without_power_save), the activity polled at once to its clear, the walker's edge (ROM_REV0_HAL_MAC_RX_GATE; our order, not the one the port carries); the walker's stop proof (try_stop); one RST_WIFIMAC pulse through reset_wifi_mac_block, the cold preparation (initialize_wifi_mac), the channel, the ring rebuilt and started, the walker enabled last; a receive window checked by payload. A cycle of 219/3 differed: its pulse came with the MAC running and the walker enabled, with no stop request and no walker's edge before it (the edge after it); 200 ms of records followed with the block reset and not prepared; and its cold preparation began with a second pulse (probe settle.rs at 7388d3cfe, lines 305 and 366), two resets a cycle against one. Which of these matters is not isolated. Result: 15 804 cycles (the receiver's end row: 7 184 under steady air, 3 756 under aggregates, 4 864 under other air), about 42 ms each; every cycle checked for a silent start (frames of the sender received and no data success counted): none; the receive-success cause of RAW stood in all 7 184 steady and all 3 756 aggregate windows. The probe kept long rows for the first 3 500 cycles only, all under steady air: 64 639 frames checked by payload after their starts, none bad, at least 9 data successes a start; after the reset and after the cold preparation NEXT and LAST read zero in all 3 500, and after the start NEXT named a descriptor while LAST stayed zero until the first frame completed. The sender, from its journal (completion status 0 with its ACK or Block Ack, 5 an ACK timeout): the two steady turns 145 539 of 151 449 and 146 906 of 152 901 acknowledged; the first aggregates turn 272 541 of 280 662 aggregates with a usable Block Ack (97.1 percent), all inside the part; the second aggregates turn began about seven seconds before the part ended, 12 146 of 277 815, the rest after the receiver had stopped. So R1 crossed the turn from steady air to aggregates, where 219/3 died, once in full and a second time for its first seconds. The survival rests on every cycle (the silent-start check, the RAW counts and the sender's acknowledgements); the checked frames rest on the 3 500 long rows. Not run: R2 and R3 (hal_deinit's edges, the vendor's whole stop) before a reset, nor the vendor's order before a reset. Details: oer-notes tasks/227 to 234; logs in evidence/230/r3b."

