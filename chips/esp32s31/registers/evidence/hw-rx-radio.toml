id = "HW_RX_EXHAUSTED_TAIL_APPEND_EXIT_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 235 (branch probe/rx-rebind-4 at d91c6621f, images built from that commit), probe esp32s31-rx-rebind --features exit and exit,long-segments: a ring of 32 descriptors of 640 bytes with one hole (31 armed), s31-b sending 500-octet frames back to back, then aggregates of 16 QoS subframes under a receive Block Ack agreement. In every stand of this run an exhausted ring was NEXT on the accepted tail, the tail armed, empty and its link zero: the walker did not write the descriptor whose link is zero, and with the hole the ring gave 30 units before it stood. The ring has a second exhausted state, not seen in this run: the tail written and NEXT zero, 31 units (HW_RX_STALL_UNDER_LOAD_EXIT_20261119). Stands is read as the cursor, the tail's words, the cursor again, unchanged. The exit is the ordinary append: the next descriptor linked at the tail, then the reload doorbell. Exits in the full runs: 102 424 under single frames and 373 672 under aggregates, every one with NEXT on the tail; in every one NEXT read between the link and the doorbell still named the old tail (the link alone never moved the walker); the old tail completed after the doorbell within 10 ms in all, within 921 us (single frames) and 325 us (aggregates) in the 64 recorded. NEXT never read zero (0 of 1 977 scans while stalled and 0 of 20 after an exit). Rebinds 102 429 and 373 674, each covered by a later frame; single frames checked by payload 102 415, none bad (aggregates not checked by payload); retired buffers returned unchanged after two laps 102 397 of 102 429 and 373 642 of 373 674 (the run's FINAL rows), the other 32 of each kept to the end with their lap; no violation; the sender lost 5 frames in the single-frame exit segments. Almost every exit came between two frames, the ring at a reserve of nothing: the stalls under load, where the taker had stopped and the air went on while the ring stood, were seven (five under single frames, two under aggregates), and they alone show a doorbell landing while the MAC refused frames. The MAC's BUFFER_FULL counter does not count the frames refused on the tail: over 20 ms of standing in eight exhaust records (no hole) it did not move while the MPDU count rose by up to 578 with no data success; it rose 20 and 15 times over the exit segments, by what is not known. So BUFFER_FULL does not read the ring's exhaustion; LAST_UNMATCHED_ERROR, not read in this run, counts while the ring stands (HW_RX_STALL_UNDER_LOAD_EXIT_20261119). Without the hole the exhaust records do not show a stand one descriptor before the tail: on single frames the record came while the walker was still filling (the data-success count rose by 30 to the record and by one more after it); on aggregates NEXT stood on the tail. Both interrupt banks were read in every scan (RAW acknowledged each scan, so its counts here are per scan and do not compare with HW_RST_WIFIMAC_AFTER_STOP_20261119's per window): no cause rose only as the ring emptied in the seven stalls; bits 11, 12 and 13 stood in none of some 9.3 million scans. The exit from a stall under load: HW_RX_STALL_UNDER_LOAD_EXIT_20261119. Not run: frames longer than a buffer. Details: oer-notes tasks/234 to 236; logs in evidence/235/r1."

[[sources]]
id = "HW_RX_STALL_UNDER_LOAD_EXIT_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 236 (branch probe/rx-rebind-4 at fa6085093, images built from that commit), probe esp32s31-rx-rebind --features stall-load,long-segments after a short pass of stall-load; ring and sender as in HW_RX_EXHAUSTED_TAIL_APPEND_EXIT_20261119. Each exit came from a stall under load: with the hole kept the probe took nothing until the walker stood, then kept it standing 5 to 20 ms (a length drawn each time) with the air on, then made the exit through the HAL's publication (the recycle credit's append: the link at the tail, the reload doorbell, then complete_pending_reload, which rings the doorbell once more if it settled with NEXT zero and LAST short of the new tail). Exits: 7 866 under single frames and 7 951 under aggregates (958 and 1 014 in the short passes); the cursor moved after every one; rebinds 7 871 and 7 956, each covered by a later frame; single frames checked by payload 7 859, none bad (aggregates not checked by payload nor by the sender's sequence); retired buffers returned unchanged after two laps 7 839 of 7 871 and 7 924 of 7 956 (the run's FINAL rows), the other 32 of each kept to the end with their lap; no violation. An exhausted ring has two states. Usually the walker stands on the armed tail and writes nothing. Rarely it writes the tail and NEXT reads zero, the tail's link: 11 of the 7 866 exits under single frames began with NEXT zero (3 of 958 in the short pass), none of the 8 965 under aggregates; of the 1 500 recorded stalls the four with NEXT zero before the exit are exactly the four in which the data-success count rose by one. Both states were left by the same exit; the HAL's count of second doorbells (reload_rerings) was not recorded by the probe. A stall that turned to NEXT zero was left at the next scan, before its drawn length. Over a stall the MAC's MPDU count rose by 2 to 59 under single frames and 49 to 606 under aggregates while the data-success count stayed: the frames refused on the tail. LAST_UNMATCHED_ERROR counts while the ring stands, about a frame refused each: it equalled the MPDU count less the data successes in 770 and 601 of the 1 500 recorded stalls, fell short of it by up to 46 and 75 in most of the rest and exceeded it by one in 6 and 37 (the MPDU count takes every frame on air, ours or not). BUFFER_FULL rose by 0 in 1 465 and 1 449 stalls, by 1 in 32 and 45, by 2 in 3 and 6: it does not count them. Bit 11 of RAW stood in no stall; bit 9 rose in two stalls and in no scan outside one, with no name given. Not run: frames longer than a buffer. Details: oer-notes tasks/236 and 237; logs in evidence/236/r1."


