id = "HW_RX_REBIND_AT_LAST_20261118"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run of tasks/199 (lease 1481) on the unmerged branch probe/rx-rebind-3 at fbf601e5e (probe/rx-rebind-2's probe on clean-architecture; the HAL's experimental detach admits the frozen LAST, never the descriptor NEXT names). Ring of 32 descriptors of 640 bytes, 15 segments of 2.5 s, fixed binding and rebind alternated, every one under hold 0: a completed single-descriptor unit is taken, and in a rebind segment its descriptor rebound to an unbound spare, as soon as it completed, LAST included, whenever at least one armed descriptor lies ahead of the walker. Sender s31-b, three kinds of air in turn: isolated 500-octet frames with a counter every 64 octets and a 3 ms pause after each; the same frames back to back; aggregates of 16 QoS Data subframes of 100 octets at HT MCS7 with a receive Block Ack agreement. Rebinds at LAST / before LAST: isolated 4 380 / 5, steady 17 869 / 102, aggregates 4 / 125 779 (several subframes are complete at a take, so LAST is rarely the unit taken: the kind's nature, not a shortfall). In every rebind segment every rebind was covered (a later frame landed in the new spare with every check run); frames checked by their own counter in rebind segments 4 385 and 17 969, 0 bad; every byte of every unit equal between the take's copy and its buffer outside the receive header; retired buffers 4 385, 17 971 and 125 783, each returned after two laps with an unchanged CRC (32 of each kept to the end and checked); never-bound spares kept their canary; 0 violations of any kind; the probe's verdict pass in all three. The receive header's late write (HW_RX_HEADER_LATE_WRITE_20261118) after a rebind at LAST landed in the buffer taken out, never in the spare put in: 2 450 and 13 360 against 0 (the rest were written before the take). The injector's one burst ended before each stream. Details: oer-notes research/rx-descriptor-rebind.md and tasks/193 to 199; logs in evidence/199."

[[sources]]
id = "HW_RX_HEADER_LATE_WRITE_20261118"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, runs of tasks/193, 194, 196 and 199 (leases 1478 to 1481) on probe/rx-rebind-3. The MAC writes bytes 48 to 52 of a unit's 56-byte receive header (the RX-control prefix) after the unit's descriptor completion is visible: a copy taken at the completion reads them zero and the buffer later holds a value (a clock's low byte at a fixed step between frames). Over 12 042 frames of run 199 that showed it (isolated and steady), no differing byte lay elsewhere in the header, in the 8-byte tail or in the frame. Measured from the take in fixed segments, at LAST: from 0.5 us to 50.4 us, median about 30 us (isolated) and 38 us (steady); already written at the take in 710 of 4 980 and 1 777 of 20 395 takes. A unit taken not at LAST read zero at the take and unchanged within 16 us (10 and 90 takes) and changed by the first read about 93 us after the take in rebind segments (run 196). Under aggregates the bytes did not change after any take. ESP-IDF 4d80c1b2 components/esp_wifi/include/esp_wifi_he_types.h:234-238 (the SOC_WIFI_MAC_VERSION_NUM == 3 branch) has bytes 48 to 55 as unnamed reserved fields. Details: oer-notes tasks/193 to 199; logs in evidence/193, 194, 196, 199."

[[sources]]
id = "HW_RX_RING_EXHAUSTED_NO_ACK_20261118"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run of tasks/200 (lease 1482) on the unmerged branch probe/rx-rebind-3 at 47363944e, feature exhaust. Ring of 32 descriptors of 640 bytes, 15 segments of 2.5 s; in the seven odd segments the probe takes every completed unit and re-arms none until a scan finds no completed unit with 31 held (NEXT then names the descriptor after LAST in all 21 events), keeps the ring out for 20 ms while the sender goes on, then re-arms the held units; the even segments are ordinary. Sender s31-b without retransmissions, three kinds of air in turn: isolated 500-octet frames with a 3 ms pause, the same back to back, aggregates of 16 QoS Data subframes of 100 octets at HT MCS7 under a receive Block Ack agreement (window 64) the MAC answers with compressed BlockAcks. While the ring is out the MAC acknowledges nothing: no ACK to a single frame (seven windows of 12 ms isolated and 17 ms steady, every frame unacknowledged, one per exhaust segment) and no BlockAck at all under aggregates (0 in each of the seven 20 ms pauses). Over the aggregates' exhaust windows (each from the first held subframe to the 64th after the restore, aligned on the capture by the held and restored sequence numbers), a subframe acknowledged in a BlockAck was always one the probe took and one the probe took was always acknowledged: 657 acknowledged and delivered, 0 acknowledged and not delivered, 4 786 neither (3 732 in the pauses with no BlockAck, 373 in the gap answered with their bit clear, 681 before the out or after the restore answered with their bit clear). The MAC's buffer-full counter stayed 0 (once 1) through every event, its data-success counter did not move while the ring was out. Capture: transmitters the sender, the receiver, one neighbour beacon and corrupt addresses; the injector's one burst ended before each stream. Details: oer-notes tasks/200, research/rx-descriptor-rebind.md; logs in evidence/200."

[[sources]]
id = "HW_RX_WALKER_EDGE_NOT_A_RELEASE_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, run 219/1 (lease 1483) on the unmerged branch probe/rx-rebind-4 at fb73d5ea6, probe esp32s31-mac-reset --features settle part (a); s31-b sending 500-octet frames back to back and aggregates of 16 QoS subframes under a receive Block Ack agreement in turns of 600 s; ring of 32 descriptors of 1 600 bytes and R. The walker's edge alone, as the ROM makes it (rom[]::hal_mac_rx_disable, RX_CONTROL bit 31 cleared by one read-modify-write; ROM_REV0_HAL_MAC_RX_GATE), with the MAC receiving: at delays from the edge's write every descriptor's three words and, apart, every buffer's 64-byte prefix and frame region recorded (the first record from 20 us, ending at about 436 us), each against the one before. The edge read back as disabled in all 4 045 stops (277 to 285 cycles after it), and still the walker wrote: the frame region changed after the first record in 1 289 stops by 100 us, 186 by 1 ms, 2 by 20 ms, 0 by 200 ms; a descriptor word in 1 038 and 174; in 1 235 of the 1 289 one node only, the unit in flight written to its end and completed. The two changes between 1 and 20 ms were in stops 7 and 40, before the sender's air, with NEXT zero. So the edge stops the walker from taking a new descriptor and is no release of the memory it holds. The per-frame payload check after starts in this run was the probe's error and is not evidence. Details: oer-notes tasks/219 to 221; logs in evidence/219/r1."

[[sources]]
id = "HW_WIFIMAC_STOP_THEN_WALKER_EDGE_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, runs 219/3 (lease 1485, branch probe/rx-rebind-4 at 7388d3cfe) and 219/4 (lease 1486, at f86f32c78), probe esp32s31-mac-reset --features settle,only-a2 and only-a3, one part a boot; s31-b sending back-to-back 500-octet frames and aggregates of 16 QoS subframes under a receive Block Ack agreement in turns of 150 s. The order run, ours and not the vendor's: the MAC's stop request (request_mac_channel_stop_without_power_save, hal_mac_deinit's edge), the activity field polled at once until zero (154 to 952 cycles, median 160, never past the 10 ms bound), then the walker's edge (ROM_REV0_HAL_MAC_RX_GATE); no settle before the poll and none after it. Records from the activity's clear: (a2) every descriptor's words and every buffer's prefix and frame region at 20 us (ending at 435 to 438 us), 100 us, 1 ms, 20 ms, 200 ms: no change after the first record in 2 735 stops (678 steady, 1 215 aggregates, 842 other air), 669 with the unit at NEXT written before the first record. (a3) the same with a copy of NEXT's node and the next one taken at once after the clear (8 775 to 9 870 cycles, at most about 31 us after it) and compared with the first record: no change in 1 243 stops (622 steady, 331 aggregates, 290 other), 465 with a unit in flight. So nothing is written later than about 31 us after the activity's clear; a write between the clear and the copy's read of a byte, up to 31 us, is not excluded by these runs. After each stop the ring rebuilt and the MAC resumed: the sender's frames checked by payload after the starts 12 493 and 11 659, none bad; the MAC's data successes counted after every start; acknowledgements kept. Not exercised: the vendor's order (the walker first, then the stop with its 20 us and 5 us), frames longer than a buffer, rates below the sender's. Details: oer-notes tasks/222 to 228; logs in evidence/219/r3 and r4."

