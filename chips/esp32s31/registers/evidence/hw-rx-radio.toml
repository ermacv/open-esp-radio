id = "HW_RST_WIFIMAC_RUNNING_RX_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, runs 219/1 (lease 1483, fb73d5ea6) and 219/3 (lease 1485, 7388d3cfe), probe esp32s31-mac-reset --features settle; the same sender and ring. RST_WIFIMAC pulsed on a running MAC through the domain's reset_wifi_mac_block (716 to 883 cycles), in run 219/3 then the walker's edge as the vendor's wifi_reset_mac orders it (the reset, then hal_mac_rx_disable); records from the reset's proof as in HW_WIFIMAC_STOP_THEN_WALKER_EDGE_20261119: no change of any frame region, prefix or descriptor word after the first record in 467 stops (219/1) and in the 4 512 of 6 194 stops the probe's table held (219/3; 65 with a unit in flight). WALKER_ENABLE read set after the pulse without the edge (219/1, 467 of 467) and clear after it with the edge (219/3). After each, the cold preparation, the channel and a start: in 219/3 reception lived through stops 0 to 618 (about 19 units and 20 data successes a start, 25 488 frames acknowledged to the sender) and from stop 619 on received nothing and did not come back; in 219/1 (no walker's edge after the pulse) the acknowledgements ended at the first start after the first reset. The cause of either loss is not established; the receive filter's policy words and the interface addresses did not differ from the first start's in any of the 4 512. Not exercised: a reset after a whole stop, the vendor's hal_deinit before it. Details: oer-notes tasks/219 to 226; logs in evidence/219/r1 and r3."
