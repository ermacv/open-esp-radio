id = "BLOB_RX_DESCRIPTOR_DIAGNOSTIC_NAMES"
description = "SOURCE: pinned esp32-wifi-lib af55a0ca258ce9d791d1661d7c2bbb65f08c0c21 libpp.a, hal_debug.o::dbg_dump_rx_links: control load +0x3e; bit29 extraction at +0x5e/+0x76 is printed as sosf at +0x8a. Adjacent diagnostic arguments name bit28 offset and bit30 EOF (the model RX_DONE field). These are RX-list diagnostic names, not physical definitions or evidence of hardware writes. The complete wDev_AppendRxBlocks clears sosf on rearm. Blobray direct-name evidence and limits: /home/ermacv/dev/oer-notes/research/opaque-blobray-wifi.md, WIFI_RX_DMA_DESCRIPTOR L1."

[[sources]]
id = "HW18_RX_UNCOMMITTED_WRITES_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: the same single run hw18-20261027-rx-radio-01-s31b, lease 895, unpushed image composition 1f5309321f000c0fe7e81525b6eed118d432937b; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. E rows show 13 observed clusters of changing leading words with both CONTROL samples 0x80200080, no RX_DONE, original descriptor NEXT, and stationary sampled MAC BASE/LAST/NEXT. Clusters start at ring node 0, 3 or 6, overwrite already non-sentinel words and include nodes 3/4/6/7 which later contain beacon segments. The first starts at scan 0x3f; others include 0xad, 0x10b, 0x2b9, 0x37b, 0x43e and 0x741. Grouping leading-value changes separated by at most four scans gives 3-26 observed changed nodes per cluster; this is not packet boundary detection or a complete write count. Twenty-four ring nodes outside the three completed chains retain changed leading words at stop. These are repeated writes without visible descriptor/cursor commit. Aborted/filtered reception with rollback is a hypothesis, not a confirmed cause. A changed sentinel is not established as accepted-frame membership, completeness or ownership evidence."

[[sources]]
id = "HW18_RX_FCS_CORRELATION_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: s31-b rev0, run hw18-20261027-rx-radio-02-s31b, cargo stand lease 899; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. The exact measured source is pushed PR-branch commit 85badedb23144ee29022c18086d3693b81f314b6, clean, rebased on main after #682; no unpublished composition or local merge. One capture capped at three terminals/700 ms receives matched channel-13 beacons 784-786 in R/0/1, 2/3/4, 5/6/7; 246 E records and 98 C counter/semantic-STATUS records, no overflow. Eleven stationary-cursor write clusters accompany eleven unit FCS-error increments: nine increments inside cluster scan intervals, one a scan before, one a scan after. RX-success/combined-aux STATUS are both zero at those counter samples; only the three beacon completions show RX-success plus at least one auxiliary. Counter deltas are MPDU/END 84, FCS 11, data-success 3, power-drop 2, buffer-full 1; abort, abort-FCS-pass, FIFO-overflow and recorded decoder errors zero. These are bracketed multi-register correlations, not controlled bad-FCS packet identification or proof of an internal cursor rollback. FCS-rejected reception is supported as the candidate cause; exact staging/discard/rollback semantics remain unknown. Dirty successor words can persist when they later become the current head; a changed leading word still does not prove membership in the accepted frame. SOSF/OFFSET are zero in every recorded control sample. Initial/masked/remasked ENABLE reads classify as Disabled (all fields clear); RX-only capture reads Unknown (outside Disabled/Station), not an individual enable image. STATUS is acknowledged during this run, so its final Q phases do not replicate R1 pending replay. RAW, individual 5/24 behavior, CPU IRQ ordering, production take/drain and writes into released storage remain unmeasured."
