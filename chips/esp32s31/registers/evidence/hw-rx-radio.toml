id = "HW18_RX_OWNER_BARRIER_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: s31-b rev0, run hw18-20261027-rx-radio-03-s31b, cargo stand lease 900; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. Exact measured source is clean pushed PR commit f38ee37038df35a2da858490035ff9503ff464fb, rebased on main eec9a2987b2b346ecdb398cf80b33ebc63e93ed0; no local composition. One passive channel-13 capture, three terminals/700 ms maximum. Before BASE publication all 33 buffers receive known 32-word patterns; after the public start validates the armed list and before outer RX, typed OWNER is cleared at ring nodes 12/20/28 and fenced. The walker is already enabled at that store, matching the live-store aspect of detach; prefetch is not excluded. CONTROL at all three barriers remains 0x00200080 in every control sample. All 96 protected words compare equal on every one of 1122 scans and at the stopped dump, not only the leading word. Repeated writes reach node 11 immediately before barrier 12 while sampled NEXT is 2 or 5; all words of nodes 12-31 retain their initial patterns at stop. Counter deltas are MPDU/END 72, FCS 9, buffer-full 8, data-success 3, NRX-restart 3, HT-SIG 1; other recorded counters zero. Eight FCS increments share a sampled scan with buffer-full, with no RX-success/auxiliary STATUS. This supports an effective first OWNER=0 barrier under observed rejected/long-write pressure; it does not establish an internal fetch/stop instant, independent pressure at the two shielded barriers, controlled bad-FCS identities, universal prefetch safety or safety after arbitrary detach/recycle. No buffer or descriptor is taken/recycled/rearmed/detached. 140/512 E, 66/192 C, 6/64 G rows, 3 K plus 99 F full-node snapshot rows and 33 D full dumps; no overflow. No RF stimulus or power configuration is changed."

