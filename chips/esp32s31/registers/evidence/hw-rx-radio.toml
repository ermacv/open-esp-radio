id = "HW_RX_REBIND_BEFORE_LAST_20261118"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, runs c7 and c8 of tasks/165 and 169 on the unmerged branch probe/rx-rebind-2 (c7 at 507d77bf7, c8 at 04838b206; the HAL ring carries rebind_next of 46081ae2f and a return of a retired spare), probe esp32s31-rx-rebind; one stand lease each, the AX211 capture holding only s31-b's 500-octet frames (a counter every 64 octets), the ACKs to it and a few dozen foreign frames. Ring of 32 descriptors of 640 bytes. A completed single-descriptor unit taken only when at least K completed descriptors lie between it and the frozen LAST and NEXT does not name it, detached and rearmed with another buffer through the production order (BUFFER, NEXT, CONTROL with OWNER last, the tail's link, the doorbell): 15 470 rebinds in c7 (K 8 and 1) and 18 031 in c8 (K 8, 1, 24, 28, 30, the armed reserve between NEXT and the tail at a rebind 23, 30, 7, 3 and 1 of 32). Every later frame landed in the buffer the rearm bound, with one counter in every 64-octet stretch; no retired buffer changed its CRC over two laps before it was bound again (33 373 returned) or to the run's end (128 kept); 16 never-bound spares kept their canary; 0 violations. A rebind behind an exhausted walker (reserve 0), at LAST or under NEXT was not exercised. Details: oer-notes/research/rx-descriptor-rebind.md, 2026-11-18 sections."

