id = "HW18_RX_CHAIN_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: s31-b rev0, run hw18-20261027-rx-radio-01-s31b, cargo stand lease 895; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. The measured image is the unpushed local composition 1f5309321f000c0fe7e81525b6eed118d432937b: RX probe plus merges of #687 (including #684) and #700, with probe-side fallible-root adaptation. It is not PR #706's head. All RX_DONE-only, LENGTH and unchanged-CONTROL observations below come from this one capture, three beacons total; they are not independently replicated facts. The 32 nodes plus R have SIZE=LENGTH=128 and the leading sentinel. Three matched laboratory AP beacons (sequences 623-625, channel 13) occupy R/0/1, 2/3/4, 5/6/7. First and intermediate CONTROL stays 0x80200080; terminals have 0xc0030080 (RX_DONE=1, LENGTH=12). OWNER=1, SOSF bit29=0, OFFSET bit28=0 and NEXT retains its original link on all sampled nodes. An unchanged LENGTH=128 proves neither a hardware store nor consumption. Repeated uncommitted writes also dirty future beacon nodes; the descriptor alone does not mark consumption, and this run does not validate the leading sentinel as a consumption predicate. No recycle, IRQ-entry timing or all-beat ordering proof. Execution: 2026-10-26; the run ID uses the task-wave date."

[[sources]]
id = "HW18_RX_MASK_STATUS_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: the same unpushed local composition 1f5309321f000c0fe7e81525b6eed118d432937b, s31-b rev0, run hw18-20261027-rx-radio-01-s31b, cargo stand lease 895; /home/ermacv/dev/oer-notes/research/hw-rx-radio.md. Source code clears all MAC events and requests ENABLE=0 before the three-beacon capture; ENABLE was not read back in this run, so bank masked is a code-derived inference. Initial and masked semantic STATUS zeroes are trivial under that intended mask, not RAW or retention evidence. After MAC/walker stop, enabling RX group 5/14/24 exposes RX_SUCCESS=1 and combined auxiliary=1; remasking hides them, enabling again restores them, acknowledging the full sample leaves both zero. At least one of auxiliary 5/24 was pending; this grouped observation cannot identify which or establish both. RAW, individual auxiliary transitions, other masked causes and CPU delivery are unmeasured. This is pending STATUS replay after producer stop, not a production drain or IRQ-to-payload proof."

