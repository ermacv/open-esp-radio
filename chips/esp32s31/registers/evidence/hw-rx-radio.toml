id = "HW_RST_WIFIMAC_AFTER_STOP_PORT_ORDER_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: s31-a rev v0.0, ring lease 233 (branch probe/rx-rebind-4 at cd11e8f9d, images built from that commit), probe esp32s31-mac-reset --features settle,only-r5 after a short pass; s31-b sending as in HW_RST_WIFIMAC_RUNNING_RX_20261119. A cycle of R5, edge for edge: a receive window of 20 ms; the stop in the order the port carries (HW_WIFIMAC_STOP_WALKER_FIRST_20261119): the walker's edge, the MAC's stop request, 20 us, the activity polled to its clear, 5 us, a wait of 1 ms on the timer; the walker's stop proof; one RST_WIFIMAC pulse, the cold preparation, the channel, the ring rebuilt and started; a receive window checked by payload. Result: 14 021 cycles (7 010 under steady air, 3 506 under aggregates, 3 505 under other air), a short row kept for each: no silent start; the receive-success cause of RAW stood in every steady and every aggregate window. Long rows for the first 3 500 (steady air): 65 597 frames checked by payload after their starts, none bad; NEXT and LAST zero after the reset and after the cold preparation in all. The sender: its two steady turns 143 937 of 153 547 and 142 335 of 151 825 acknowledged; its first aggregates turn, inside the part, 262 706 of 277 195 aggregates with a usable Block Ack (94.8 percent); its second aggregates turn ran after the part had ended. Not run: hal_deinit's edges before the reset. Details: oer-notes tasks/233 and 234; logs in evidence/233/r1."

