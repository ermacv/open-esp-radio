id = "HW18_RX_HEAD_LEADING_PRESERVATION_20261027"
kind = "unattested-hil-observation"
description = "SOURCE: existing s31-b rev0 captures hw18-20261027-rx-radio-01-s31b (lease 895, measured composition 1f5309321f000c0fe7e81525b6eed118d432937b) and hw18-20261027-rx-radio-03-s31b (lease 900, measured pushed source f38ee37038df35a2da858490035ff9503ff464fb); /home/ermacv/dev/oer-notes/research/hw-rx-radio.md, final-head-audit.json/log in slot 5 target/hw-hw18. A recount of 13 stationary-cursor uncommitted leading-write clusters in the first capture and 10 in the barrier capture (23 total, not independently identified peer-frame counts) finds no leading-word change at the current sampled NEXT head. The first changed node is its linked successor: 0 after reserved R, 3 after NEXT=2, 6 after NEXT=5. The recount checks all leading changes in each selected interval, not only rows passing the cluster selector; accepted-transition staging is excluded. Conditions: one board, passive channel 13, 32 ring nodes plus R, SIZE=128, three accepted beacons per capture, each capped at three terminals/700 ms, no take/recycle/rearm. The first capture uses the production sentinel and a code-requested all-zero delivery mask without ENABLE readback; the barrier capture uses full initial patterns and live OWNER=0 stores at nodes 12/20/28 before outer RX, FCS=9 and buffer-full=8. Controls stay armed and sampled cursors stationary during the selected series. This is the observed footprint of uncommitted/rejected reception; exact peer frames, rejection causes, unsampled transient writes and whole-head preservation are not established. The head can already be dirty from an earlier series before becoming NEXT. The result narrows the observed rejected-write footprint; it neither validates sentinel accepted-frame membership nor proves arbitrary in-flight detach/recycle safety. No new hardware run."
