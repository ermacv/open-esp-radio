description = "SOURCE: s31-b rev0 run hw9-20261027-mac-04, lease #830, mac-mapping.json: CC0 target crossing produced primary bank 1=0x10, CC1=0x20; a verified seed/capture first-word crossing0xfffffc01 to2 produced bank 1=2 with source1 enabled. Each raised matrix 124 (bank3=0x10000000); bank 0, NRT snapshots and matrix 133 (bank4 bit5) stayed zero. These positively attribute three local primary causes, not every NRT or bank 0 producer. Report: /home/ermacv/dev/oer-notes/research/hw-ble-irq-wave2.md; raw logs in target/hw-hw9/<run>/."

