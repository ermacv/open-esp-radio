id = "HW9_S31_SHUTDOWN_ORDER_20261027"
description = "SOURCE: s31-b rev0 run hw9-20261027-lp-06, lease #835, shutdown-soft.json and shutdown-wrap.json: isolated LP software/rollover pending plus primary seeded overflow produced matrix 124+127. Primary release commands/masks retained124. The exact #685 LP sequence all-ones+0x14,STOP+0x4,fence,sample,zero +0x24/+0x2c,fence lowered127 at disable, stopped the counter and cleared the bytes. Primary124 persisted through BT MAC assert/release and went low by BT MAC APB reset completion. At the no-MMIO reunion-equivalent boundary and after all digital Bluetooth clocks were released/restored without START/rearm, matrix 124/127/133 stayed low and the LP counter stayed fixed across 4096-cycle windows. These are the reproduced PAC register boundaries, not execution of HAL typestate or a product lifecycle qualification; task enable17 was zero on the measured ROM path. Report: /home/ermacv/dev/oer-notes/research/hw-ble-irq-wave2.md; raw logs in target/hw-hw9/<run>/."

