id = "HW9_S31_MAC_MASK_ACK_20261027"
description = "SOURCE: s31-b rev0 run hw9-20261027-mac-05, lease #831, mac-masks.json tags 0x9200-0x92b4: on isolated CC0/CC1/wrap pending, masking its enable lowered primary status and124; restoring it redelivered without a new event. NRT snapshots remained zero, including while primary status was positive. A positive primary snapshot retained across mask cleared the cause while disabled; unmask stayed quiet. Separately, crossing with its enable masked was hidden, then revealed on enable. mac-arrivals.json tags 0x9500-0x9564: savedCC0=0x10 acknowledged after newCC1 arrived (0x30) left0x20/124. Same-bit target crossing while already pending left one indication, then old-image ack cleared it; this does not independently count the second compare or establish coincident priority. Report: /home/ermacv/dev/oer-notes/research/hw-ble-irq-wave2.md; raw logs in target/hw-hw9/<run>/."

