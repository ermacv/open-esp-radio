id = "HW9_S31_MAC_RELEASE_20261027"
description = "SOURCE: s31-b rev0 run hw9-20261027-mac-05, lease #831, mac-controls.json and mac-groups.json: with positively pending seeded overflow and ENA1[1]=1, CONTROL1=1, CONTROL2=1 and1then2 each retained primary bank 1=2/matrix 124 high. Reopening CONTROL0 did not clear it. Each individual production baseline bank 0/bank1 and dynamic bank 0/bank1 enable/removal preserved the unrelated source1 cause. Production dynamic-mask/clear, CONTROL1/2, baseline 0x8000/0x1300 removal retained it too. NRT snapshots/133 remained zero. This refutes universal pending-safe primary output-low for that inherited enable, without qualifying exception or scheduler producer identities. Report: /home/ermacv/dev/oer-notes/research/hw-ble-irq-wave2.md; raw logs in target/hw-hw9/<run>/."

