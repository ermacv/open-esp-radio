description = "SOURCE: s31-b rev0 run hw9-20261027-lp-08, lease #838; lp-masked-clear.json tags 0x9600-0x9633. One real LP wrap plus software pending produced bytes 1/1, status 0x40002 and matrix 127 high. All-ones disable at+0x14 lowered status/output and retained both bytes. Whole-word zero +0x24 while disabled followed by bit18 enable left byte 0/status 0/output0 while rollover byte remained 1. A separate all-disable, zero +0x2c and bit1 enable left both bytes/status/output zero. This positively verifies disabled zero-clear of each tested lane, not collision priority or unknown sources. Report /home/ermacv/dev/oer-notes/research/hw-ble-irq-wave2.md; target/hw-hw9/hw9-20261027-lp-08/."
