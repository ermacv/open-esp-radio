description = "SOURCE: s31-b rev0 run hw9-20261027-lp-06, lease #835, lp-sleep16.json tags 0x9700-0x97e3: for mode58 controls 0/4 images0,1,0x10,0x11, a low24 target at+0x64 was programmed 512 ticks ahead; +0x44/+0x40 image 0x10000 disable/enable and a positively witnessed crossing set+0x1c low byte from0 to1. +0x44 image 0x10000 retained that byte; whole-word zero +0x1c cleared it. Status+0x38 and matrix 127/129 remained zero. Initialization had disabled the +0x14 delivery bank, so this does not establish absence of sleep routing or unknown delivery-enable requirements. Bit 2 of mode58 was never positive, leaving its conditional bit1 branch unexercised. Report: /home/ermacv/dev/oer-notes/research/hw-ble-irq-wave2.md; raw logs in target/hw-hw9/<run>/."

