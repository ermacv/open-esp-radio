id = "BLOB_MAC_MISC_PACKET_DUMP_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_sniffer.o]::hal_sniffer_set_promis_misc_pkt size 0x84 uses argument zero to select the enable and disable paths at 0x201040f4. Nonzero sets bit 16 through +0x36..0x3e; zero clears it through +0x66..0x6e. Other lanes are programmed by separate RMWs. This proves a misc-packet-dump enable rather than the read-only BASEBAND_ERROR identity formerly inferred solely from hal_ifc_get_bb_err_bitmap's read of bit 16. The other opaque lanes' individual meanings remain unestablished."
