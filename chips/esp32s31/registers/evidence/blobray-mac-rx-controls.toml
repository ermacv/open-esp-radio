[[sources]]
id = "BLOB_MAC_CONTROL_FRAME_DUMP_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Complete libpp[hal_debug.o]::hal_get_dump_ctrl_frame_cfg+0x0..0x10 returns the high sixteen bits of 0x201040fc+4*queue. hal_set_dump_ctrl_frame_cfg+0x5a..0x78 bounds individual queues to 0..3; +0xcc..0xfc replaces all four high halves otherwise, preserving their low halves. Its diagnostic labels name WDEV_RXCTLDUMP_ENA. The decoded instruction/control-flow coverage is complete; its logging calls remain opaque. libnet80211[ieee80211_api.o]::esp_wifi_set_promiscuous_ctrl_filter reaches wifi_set_promis_ctrl_filter_process, libpp[if_hwctrl.o]::ic_set_promis_ctrl_filter, and libpp[wdev.o]::wdev_set_promis_ctrl_filter. The latter copies the four-byte public filter mask unchanged; wdev_set_promis_ctrl_pkt+0x1a..0x2a passes it as argument three to hal_sniffer_rx_set_promis(1,1,mask). Complete libpp[hal_sniffer.o]::hal_sniffer_rx_set_promis+0x34..0x4c ORs that mask into 0x20104108/0x201040fc/0x20104100. libpp[if_hwctrl.o]::ic_csi_set_config+0x32..0x74 separately sets/clears bit 29 in 0x201040fc and 0x20104100 from configuration bit 16. ESP_IDF_4D80C1B2_WIFI_CONTROL_FILTER_MASKS supplies the frame-class spellings at the same physical positions; bits 16..22 and 0..15 are not identified. No new running dump lifecycle or performance claim is established."

[[sources]]
id = "ESP_IDF_4D80C1B2_WIFI_CONTROL_FILTER_MASKS"
description = "SOURCE: espressif/esp-idf@4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d, components/esp_wifi/include/esp_wifi_types_generic.h lines 695..704: WIFI_PROMIS_CTRL_FILTER_MASK_* assigns bits 23..31 to Control Wrapper, Block Ack Request, Block Ack, PS-Poll, RTS, CTS, ACK, CF-End and CF-End+CF-Ack. components/esp_wifi/include/esp_wifi_he_types.h lines 40..60 places dump_ack_en at configuration bit 16 for MAC version three. These public definitions corroborate the unchanged-mask binary path in BLOB_MAC_CONTROL_FRAME_DUMP_20261103; the header alone does not establish an MMIO address."

[[sources]]
id = "BLOB_MAC_ERROR_FRAME_DUMP_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[hal_debug.o]::dbg_dump_rx_errors size 0x124 has complete decoded instruction, reference and control-flow coverage; esp_wifi_get_mode and wifi_log remain opaque calls. Its stores +0x44/+0xbe/+0x120 replace 0x201040a4 bits 15:12 with 1/2/3 for station/AP/AP+station modes respectively. Its +0x5a/+0x62 and +0xd4/+0xdc RMWs replace bits 26:17 and set bit 16 at 0x201040e8 and 0x201040ec. The pinned format strings name these words WDEVRX_DUMP_ERRCODE(ifx:0/1), bits 26:17 ERR_BIT_MASK, bit 16 BB_ERRCODE_ENA and bits 7:0 BB_ERRCODE; exact extraction is +0x64..0x94 and +0xde..0x104. Non-selected and unknown lanes are replayed unchanged by those RMWs. Complete decoded hal_ifc_get_bb_err_bitmap samples bit 16 at 0x201040e8/ec/f0/f4; that observation alone does not identify the f0 lane as error status or prove the first two words' format at f0. No error-code dictionary, reset, or read/write lifecycle is established."

[[sources]]
id = "BLOB_MAC_FIXED_ERROR_COUNT_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_debug.o]::hal_bb_count_fixed_err_code size 0x4a reaches 0x20104318 only when argument zero is two. Argument one zero clears bit 17 at +0x10..0x18; otherwise +0x28..0x32 sets bit 17 and +0x34..0x46 replaces bits 16:10 with the low seven argument bits. Each operation replays all other lanes unchanged. libpp[hal_debug.o]::esp_test_get_hw_rx_statistics+0xf8..0xfe independently reads bits 9:0 as the existing NRX error count. This identifies a fixed-error-code selector and enable beside the counter, without establishing code meanings, reset, overflow or latching behavior."

[[sources]]
id = "BLOB_MAC_RX_HANG_TIME_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_mac_ctl.o]::hal_he_set_bbrxhung_time size 0x1e replaces 0x20104c1c bits 11:0 with 15 for zero input and 58 otherwise, preserving all other bits; its store is +0x14. libpp[hal_mac.o]::hal_mac_enable_low_rate+0x32..0x3a passes one, hal_mac_disable_low_rate+0xe..0x16 passes zero, and mac_txrx_init+0xea passes zero. The function-derived hang-time name does not establish units, the recovery mechanism, or bits 30/31."

[[sources]]
id = "BLOB_MAC_VHT_BW_SIGNALING_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_mac_ctl.o]::hal_vht_enable_bwsignaling_rts size 0x20 reads 0x20104c7c at +0x8 and changes exactly bit 18 with mask 0x00040000: nonzero argument sets it at +0xc..0x12; zero clears it at +0x16..0x1e. hal_he_init+0x16a calls it with zero. This supersedes the model's former bit-22 placement attributed to BLOB_LIBPP_HAL_HE_INIT_SUFFIX's older oracle SHA f863c65c3ed89cf5d2a2cbe0d6bca3b783ca35788a704bb68e13958e4b94958e. The current bit-22 meaning is unestablished and its read image must be preserved; no second bandwidth-signaling enable or hardware layout migration is inferred."

[[sources]]
id = "BLOB_MAC_COLOR_COLLISION_GATE_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_mac_ctl.o]::hal_mac_color_enable_collision_isr+0x8..0xe sets 0x20104c2c bit 12; complete hal_mac_color_disable_collision_isr+0x8..0x10 clears it. libpp[hal_debug.o]::print_isr_regs independently labels this physical word INT1_ENA_WDEV. The field is the BSS-color-collision producer gate, distinct from the main interrupt bank's event enable. Other lanes, reset and event acknowledgment behavior are not identified."

