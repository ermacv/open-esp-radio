id = "BLOB_MAC_CCA_SND20_20261103"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Complete libpp[hal_mac_ctl.o]::hal_cca_set_snd20_cfg size 0x28 replaces 0x20104c94 bits 7:0 with 0x20 when argument zero is one, otherwise with 0x17, preserving the upper 24 bits; its store is +0x18. CCA SND20 is the symbol-derived configuration context only: units, internal subfields and the electrical expansion of SND20 remain unestablished. The observed images are not a hardware value dictionary."

