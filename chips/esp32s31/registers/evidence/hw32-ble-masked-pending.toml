id = "HW32_S31_BT_04BC_READ_SCOPE_20261027"
description = "SOURCE: s31-a run hw32-20261027-ble-masked-01, stand lease #944; selections300-302 JSON/raw captures, tags32a0-32e5/3300, report /home/ermacv/dev/oer-notes/research/hw32-ble-masked-pending.md. Three consecutive complete BT_MAC+0x4bc reads while each known primary timer indication was positively pending, then three while hidden, all returned zero. Enabled primary status/matrix124/modem-vector stayed positive; the hidden indication redelivered on reopen and fixed W1C then cleared it. Completed BTLC captures advance before/across/after each read group (deltas208-209/5-6/208-209). These scoped positive pending and progressing-counter controls show no removal of these indications or timer stop in this digital setup. The word's own task indications were never positive; arbitrary read side effects, other counters, other states and task-bit clear-on-read remain unestablished. Access remains diagnostic-only, with no general read-safety capability. Archive: hw32-ble-masked-pending-evidence.tar.zst; members hw32-20261027-ble-masked-01/300-compare0.bin, hw32-20261027-ble-masked-01/301-compare1.bin and hw32-20261027-ble-masked-01/302-overflow.bin (decoded .json beside each; archive location and SHA-256 in the report)."
