id = "HW32_S31_BT_MASKED_FIXED_W1C_20261027"
description = "SOURCE: s31-a run hw32-20261027-ble-masked-01, stand lease #944, measured probe commit 6db856563feb26735b5292251c623a604be28b44; 300-compare0.json, 301-compare1.json and 302-overflow.json (raw .bin beside each). At route124/133 MAP=0, MIE=0 and all CLIC IE=0, fresh masked BTLC compare0/compare1/seeded-overflow crossings were hidden, then enabling the single lane revealed primary bank1 images 0x10/0x20/2 and matrix3 0x10000000 (tags3210/3220); mask/reopen retained them (3230/3240). A single fixed W1C image while enabled left the enable unchanged and cleared status/output through another reopen (3250/3260). A fresh crossing while masked followed by the same fixed W1C, without opening or taking a positive sample of that occurrence, left the subsequent reopen quiet (3270-3290). The earlier unacknowledged masked crossing is the positive retention control; a fresh later occurrence restores the positive (32a0). No bank0/NRT producer, all-lane discard, producer drain, simultaneous set/clear priority or full release lifecycle is qualified. Report: /home/ermacv/dev/oer-notes/research/hw32-ble-masked-pending.md; archive: hw32-ble-masked-pending-evidence.tar.zst; members hw32-20261027-ble-masked-01/300-compare0.bin, hw32-20261027-ble-masked-01/301-compare1.bin and hw32-20261027-ble-masked-01/302-overflow.bin (decoded .json beside each; archive location and SHA-256 in the report)."

[[sources]]
id = "HW32_S31_BT_OUTPUT_OBSERVER_20261027"
description = "SOURCE: s31-a run hw32-20261027-ble-masked-01, stand lease #944; selections300-302 JSON/raw captures, report /home/ermacv/dev/oer-notes/research/hw32-ble-masked-pending.md. Each leaf positively checks both CLIC edge observers with FROM_CPU2 at IE0 (3001/3002). Opening an isolated pending BTLC compare0/compare1/seeded-overflow enable raises matrix source124 and MODEM_LPCON.MODEM_INTR_VECTOR image0x10 even with both BLE routes parked at MAP0 (32fe,3220/3240); masking or W1C lowers both. In the separate MAP16/17, IE0/MIE0 phase, opening a fresh pending cause also latches primary CLIC IP (32ff,32a0/32a2); final W1C plus IP clear returns zero (3300). Matrix INT_STATUS is the observed source-level bank; no separate matrix RAW/ST pair is asserted. HP/LP PMU RAW, selected PMU ST/wakeup and ETM+10c[26] read zero throughout, but have no positive event control. No actual wake, PMU-event absence or ETM-event absence follows from those zeros; source133/NRT remained zero without a positive NRT producer. Archive: hw32-ble-masked-pending-evidence.tar.zst; members hw32-20261027-ble-masked-01/300-compare0.bin, hw32-20261027-ble-masked-01/301-compare1.bin and hw32-20261027-ble-masked-01/302-overflow.bin (decoded .json beside each; archive location and SHA-256 in the report)."

