[[sources]]
id = "HW26_S31_LOCAL_TBTT_20261027"
description = "SOURCE: s31-c rev0, hw26-20261027-generic-02, cargo stand lease #915; ermacv/oer-notes research/hw-irq-generic-2.md, tbtt.json tags 0x22000-0x220f0. A local station TBTT schedule follows the complete HAL programming order and uses a future station-TSF target, without RF or received beacons. Station TSF advances from 0x1006c to 0x10c03. Positive TBTT0 RAW, STATUS=8 and matrix source122/bank3 bit26 are observed. Disabling the TBTT producer and masking the interrupt retains RAW and lowers STATUS/output; a positive affine sample retained across the mask clears RAW while masked. Re-enable remains quiet over 4096 cycles. This does not qualify timer2/3, other TBTT domains, periodic recurrence or coincident arrival/clear priority."

[[sources]]
id = "HW26_S31_IEEE_ABORT_20261027"
description = "SOURCE: s31-c rev0, hw26-20261027-generic-01/#913 and hw26-20261027-generic-02/#915; ermacv/oer-notes research/hw-irq-generic-2.md, ed.json and ed-stop.json tags 0x22300-0x223f1. Digital ED_START without RF immediately yields positive RX_ABORT/event bit4, RX_STATUS abort reason26/ED_COEX_REJECT and matrix source132/bank4 bit4. In run02 TXRX_PTI=ACK_PTI=3 reads back but the same rejection remains. ENA=0 hides EVENT_STATUS/output while preserving hidden pending, which reappears on unmask. A positive sample retained across masking clears while ENA=0. A fresh enabled abort clears at ENA=1. The STOP variant already has reason26 before STOP, so it is not evidence for ED_STOP. ED_DONE, other abort reasons, other event lanes and coincident arrivals remain unqualified."

[[sources]]
id = "HW26_S31_USB_EVENTS_20261027"
description = "SOURCE: s31-c rev0, hw26-20261027-generic-01, cargo stand lease #913; ermacv/oer-notes research/hw-irq-generic-2.md, usb-setup.json and usb-packet.json. First USB observation after ROM RAM loading and local digital-radio setup, before probe USB writes: RAW=0x310f, ST=ENA=0x0c. This is an observation in that session, with the enable-image writer unknown. HW7_S31_USB_20261026 instead records ENA=ST=0 in the first probe observations after ROM-download/RAM-loader entry on s31-a rev0, hw7-20261026-generic-02/#813 and hw7-20261026-generic-03/#815. The two observations have different boards and observed setup sequences; neither identifies the writer, isolates a power-on value or establishes a loader write. Exactly one host OUT byte0x51 produces RAW/ST bit2 and source2 delivery. Masking retains RAW and lowers ST/output. A positive console sample retained across ENA=0 clears RAW while the OUT FIFO remains occupied; no reassert over4096 cycles or on unmask. Reading the byte empties the FIFO. Two separate consumed IN byte0x55 publications, separated by CLR/quiet RAW, each produce new IN_EMPTY bit3; an empty available FIFO alone stays quiet. An explicitly seeded SOF enable survives endpoint-only RMW enable and console-only CLR: ST=2, ENA=0x0e, source2 remains high and repeatedly delivers after console causes are cleared. The SOF case is constructed, not an observed boot enable. No same-cycle priority or all-boot-path guarantee."

[[sources]]
id = "HW26_S31_SYSTIMER_REARM_WRAP_20261027"
description = "SOURCE: s31-c rev0, hw26-20261027-generic-01, cargo stand lease #913; ermacv/oer-notes research/hw-irq-generic-2.md, expiry.json, simultaneous.json and wrap.json. CLR before a fresh unit0 target0 expiry allows RAW/ST/source33 and CPU delivery; CLR after an observed expiry removes it without immediate redelivery; CLR followed by a new future target again delivers. Equal programmed target ticks for comparators0/1 independently latch both bits; CLR0 removes only0 and leaves target1/source34 pending, then CLR1 removes1. Unit0 is stopped and loaded with 0x00000ffffc180 and 0xfffffffffc180; comparator0 is armed for boundary+16000 ticks modulo52 bits, cleared while stopped, then unit0 is started. Neither arm shows early RAW; both boundaries are observed and target0 is pending/delivers after the low32-bit and full52-bit wraps. Final counter snapshots are 0x0000100003eec and 0x3edf respectively. These are ordered, bounded examples, not exact simultaneous set/clear arbitration or a universal no-lost-wakeup proof."

[[sources]]
id = "BLOB_S31_TSF_DOMAIN_MODES_20261027"
description = "SOURCE: cargo blobray function-records --input pp=pin:esp32s31/libpp, complete hal_enable_nan_tsf, hal_enable_sta_btwt_tsf and hal_enable_tsf_timer; pin libpp SHA-256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4. ermacv/oer-notes research/hw-irq-generic-2.md; local log target/hw-hw26/blobray-tsf.log. NAN enable first sets its two gates, then publishes mode4, whereas broadcast-TWT enable uses the same two-stage gate sequence followed by mode1; their disable leaves clear the mode. The mode codes are vendor operational facts, not an independently observed TSF timer-domain mapping."

[[sources]]
id = "HW26_S31_TSF_TIMER2_20261027"
description = "SOURCE: s31-c rev0, hw26-20261027-generic-03, cargo stand lease #916; ermacv/oer-notes research/hw-irq-generic-2.md, wifi2.json tags0x22000-0x220f0. The disposable setup loads station TSF zero, performs sourced two-stage NAN mode4 and BTWT mode1 enables, and programs timer2 target0x16f from station snapshot0x6f. Later station snapshot0x1da accompanies positive timer2 RAW, STATUS0x20 and matrix source122 high. After disabling the timer producer, interrupt masking preserves RAW while STATUS/output fall; a retained positive sample clears while masked and unmask stays quiet4096 cycles. Timer3 did not produce a positive cause with the same station-derived target. This run does not isolate the required domain setup or establish the timer-to-counter mapping."

[[sources]]
id = "BLOB_S31_TSF_COUNTER_SELECT_20261027"
description = "SOURCE: cargo blobray function-records --input pp=pin:esp32s31/libpp, complete tsf_hal_get_counter_value (0x4c), tsf_hal_set_counter_value (0x2e), hal_mac_tsf_set_time (0x68) and tsf_hal_set_timer_target (0x44); pinned libpp SHA-256 0c791ee12225e93dff3bc85fcbde2fb512e7db2964353c0117fff6153eccbda4. ermacv/oer-notes research/hw-irq-generic-2.md; local log target/hw-hw26/blobray-tsf-counters.log. The generic getter/setter guard counter index0..3, use snapshot selector1<<index and load request16<<index in0x2010d814, and share staged low/high and snapshot low/high words. Thus snapshot2/3 occupy bits2/3 and load2/3 bits6/7. These are generic counter indices; hal_mac_tsf_set_time uses a different interface-index mapping, so no interface-name equivalence is inferred. Both getters and setters preserve unrelated bits through fresh-read RMW."

[[sources]]
id = "HW26_S31_TSF_TIMERS23_20261027"
description = "SOURCE: s31-c rev0, hw26-20261027-generic-04, cargo stand lease #917; ermacv/oer-notes research/hw-irq-generic-2.md, wifi2.json and wifi3.json tags0x22000-0x220f0. After the sourced two-stage NAN mode4 and BTWT mode1 enables, the probe loads each selected generic counter2/3 with zero and snapshots that same counter to choose a future target. Counter2 advances0x67 to0x16a across target0x167, with timer2 RAW/STATUS0x20/source122 positive; counter3 advances0x68 to0x16b across target0x168, with timer3 RAW/STATUS0x10/source122 positive. Each producer is disabled after the positive event. Masking its enable retains RAW while STATUS/output drop; a positive affine sample retained before masking clears under the mask, and re-enable stays quiet4096 cycles. Other bank causes, same-bit recurrence and exact set/clear collisions remain unqualified."
