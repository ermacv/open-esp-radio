id = "BLOB_MAC_EXTENDED_KEY_WORDS_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. Inspected libpp[hal_crypto.o]::hal_crypto_set_key_entry+0x150..0x160 copies the rounded supplied key length to 0x20105808+0x28*entry. The inspected GCMP API-type-9, length-32 branch fills eight key words; therefore 0x20105818/1c/20/24+0x28*entry contain key bytes 16..31 in that publication. hal_crypto_clr_key_entry independently clears all ten words of an entry. The setter has partial control-flow coverage. This static source establishes the longer-key copy, not arbitrary key-length admissibility or a new open-driver lifecycle. BLOB_MAC_KEY_COPY_EXECUTION_20261104 additionally establishes the inspected TKIP copy and the unchanged tail of the 16-byte setter."

