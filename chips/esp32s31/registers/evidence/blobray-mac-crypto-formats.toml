id = "BLOB_MAC_CRYPTO_PROFILE_MODES_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. libpp[hal_crypto.o]::hal_crypto_enable selects interface words 0x20104800/804/808 and sets bit 28 only for (API key type & ~4)==1, namely WEP40/WEP104 types 1/5 independently identified in BLOB_MAC_KEY_CIPHER_FORMAT_20261104. Type 4, independently identified as SMS4, sets bit 31 and shared 0x20104810 bits 21:6 as a group; other inspected cipher profiles clear these positions. Bit 30 and each shared-policy lane remain individually unidentified. libpp[wdev.o]::wDev_Insert_KeyEntry assembles metadata at +0x0..0x40, publishes the key table, then programs the interface profile at +0x68..0x7a; SPP comes from its fourth enable argument. libnet80211[ieee80211_sta.o]::ieee80211_sta_new_state+0x3c2..0x3ee also programs the previous PTK algorithm's interface profile on the inspected STA-leave path, before clearing algorithm bookkeeping. Interface profile and key-table ownership are separate. The STA-state function has partial control-flow coverage; no complete transition proof or more specific electrical meaning for WEP_MODE/SMS4_MODE is claimed."

