id = "BLOB_MAC_RX_STARTUP_CONTEXT_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Positive captured startup paths from wifi_start_process and promiscuous/mode-switch startup reach wifi_hw_start -> ic_set_interrupt_handler -> hal_init -> mac_rxbuf_init. The complete decoded mac_rxbuf_init body writes 0xfffff to 0x20104c68 bits 19:0 at +0x12, four to 0x20104c6c bits 19:0 at +0x28, descriptor high window 0x2f0 at +0x34, RX-control buffer offset zero at +0x40 and the descriptor base from wDevCtrl at +0x4e. This establishes RX-walker preparation order in the inspected startup path, not units or individual meanings for the first two fields, nor an exhaustive runtime call graph."

[[sources]]
id = "BLOB_MAC_BA_CALLER_CONTEXT_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Inspected ht_recv_action_ba_addba_request calls ampdu_rx_start.constprop.0 to prepare negotiated RX BA state; the request handler itself selects the extra-SoftAP or ordinary publisher at +0x346..0x372, reaching hal_agreement_add_rx_ba through ic_add_rx_ba on the ordinary branch. DELBA, failed ADDBA response, replacement and peer cleanup reach removal; ieee80211_ampdu_reorder also reaches reset. hal_ba_session_store/restore snapshot/reload SSN and bitmaps through wdev_mac_special_reg_store/load. wdev_funcs_init+0x5aa..0x5bc registers those callbacks in the ROM interface table, installed by esp_wifi_init_internal; final indirect invocation is unresolved. ampdu_rx_start and wdev_funcs_init have partial control-flow coverage. No complete power-transition ordering or independent meaning for opaque BA-control lanes is established. BLOB_MAC_BA_SCALAR_ARRAY_CONTRACT_20261104 separately records concrete isolated execution of the multicast caller and its array-based callee."

