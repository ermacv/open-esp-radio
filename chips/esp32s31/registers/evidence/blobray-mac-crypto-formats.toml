id = "BLOB_MAC_KEY_CIPHER_FORMAT_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Inspected libpp[hal_crypto.o]::hal_crypto_set_key_entry+0x1a8..0x1ae inserts (API key type & 7) into 0x20105804+0x28*entry bits 20:18; hal_crypto_get_key_entry+0xa4..0xa6 independently extracts three bits. The setter's type-5 branch +0xc8..0xd2 publishes 0x00050000 (WEP code 1 plus bit 16); its type-9 branch +0x186..0x1a6 publishes code 5 and additionally bit 26 for key length exactly 32. The getter recognizes those combined encodings at +0x90..0xaa. libnet80211[ieee80211_supplicant.o]::ppInstallKey's proven jump table at +0x136 identifies API types 1/5 as wep, 2 as tkip, 3 as ccmp, 4 as sms4 and 9 as gcmp. libnet80211[wl_cnx.o]::cnx_connect_op+0x168..0x1b2 selects type 1 and five key bytes for WEP40; +0x1bc..0x1fe selects type 5 and thirteen bytes for WEP104. The inspected writer and reader branches establish hardware cipher codes 1..5 and the two conditional flags, not support for every three-bit code or every key length. Bit 17 remains unidentified. The setter, ppInstallKey and cnx_connect_op have partial control-flow coverage despite decoded-instruction/reference coverage; no whole-function equivalence or complete runtime lifecycle is claimed. Public cipher enum values, software profile codes and API key types are distinct domains."

