id = "BLOB_MAC_MBSSID_INDEX_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. libnet80211[ieee80211_mbssid.o]::sta_update_mbssid loads the parsed index byte at +0x30, compares cached profile state, and on a changed nonzero profile passes the index as argument one to hal_he_set_multi_bssid at +0x6e..0x7a. libpp[hal_mac_ctl.o]::hal_he_set_multi_bssid has complete decoded instruction/control-flow coverage; +0xc6..0xd2 replaces 0x20104028 bits 23:16 with that argument; the upstream eight-bit load bounds it without spilling into the preserved top byte. Its pinned .rodata_wlog_warning.9 diagnostic names max_indicator, index and transmitted_bssid[5]. The zero/absent-profile paths disable transmitted-BSSID abort or clear the profile. This establishes a nontransmitted BSSID profile index, not the meaning of bits 31:24 or a new open-driver filtering lifecycle."
