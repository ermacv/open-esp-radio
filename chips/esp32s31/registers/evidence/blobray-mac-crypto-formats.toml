id = "BLOB_MAC_MGMT_RX_CRYPTO_INDICATOR_20261104"
description = "SOURCE: Blobray, esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391 and libnet80211.a SHA-256 3bbc253d1127ec579ebdc6c44cab906959097bed245a5664ea0e10d2c642a2da. Complete libpp[hal_crypto.o]::hal_crypto_mgmt_rx_enabled+0x0..0x1e returns bit 17 at 0x20104804 for input one, otherwise at 0x20104800. libpp[wdev.o]::wdev_is_mgmt_hwdecr_enabled forwards it. The getter does not interpret 0x20104808. hal_crypto_enable's selector-two profile consumes its third argument, derived upstream in ppInstallKey/esp_wifi_set_key_internal from g_ic+0x210==0; libnet80211[ieee80211_supplicant.o]::esp_wifi_sta_pmf_enabled+0x0..0x8 independently identifies that software halfword as PMF state. That dependency does not identify the hardware function of selector-two bits 16/17. libnet80211[ieee80211_hostap.o]::hostap_recv_mgmt+0x302..0x306 tests the getter in an inspected protected ESP-NOW/vendor-action branch. Nonzero +0x30e..0x32e adjusts framing using fixed CCMP header/trailer lengths; zero +0x12da..0x12e0 calls ieee80211_decrypt_espnow_pkt, whose +0x1a..0x48 performs key lookup and buffer pointer/length adjustment without an AES transform call or payload-transform loop. The indicator's vendor name is established; software-versus-hardware AES execution, quantitative CPU savings and general management-frame acceptance are not established by this chain."

