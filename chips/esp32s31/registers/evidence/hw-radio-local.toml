# Short PAC-only local interrupt observations, not lifecycle qualification.
schema = 1

[[sources]]
id = "HW8_S31_LP_PHASED_ACK_20261026"
description = "SOURCE: s31-b rev0 run hw8-20261026-radio-local-01, lease #803; /home/ermacv/dev/oer-notes/research/hw-irq-radio-local.md; target/hw-hw8/hw8-20261026-radio-local-01/lp-compare-ack.json, tags 0x8000-0x8070 and paired byte records. With XTAL/divider 1, a byte-zero read preceded a verified compare arrival (byte +0x24=1, status +0x38=0x40000, matrix127=1); a later whole-word zero cleared byte/status/output. The clear-before-expiry positive ordering control still allowed the next compare. A separate nonzero sample crossed another armed target before zero, but its already-one byte cannot independently attest that second compare. These are separated phases, not coincident set/clear priority or a proof that production's conditional nonzero acknowledgement loses every raced compare."

[[sources]]
id = "HW8_S31_LP_TWO_WRAPS_20261026"
description = "SOURCE: s31-b rev0 run hw8-20261026-radio-local-01, lease #803; /home/ermacv/dev/oer-notes/research/hw-irq-radio-local.md; target/hw-hw8/hw8-20261026-radio-local-01/lp-two-wraps.json. Compare disabled, XTAL/divider 1; two independently observed natural low-counter crossings took 33554340 and 33554014 cycles, each under a 40000000-cycle bound. No acknowledgement or counter seed intervened. After each wrap +0x2c=1, +0x38=2 and matrix127=1; the byte sampled after the first was 1 before the second arrival. One subsequent whole-word zero cleared the byte, status and source, still zero after 4096 cycles. Two wraps expose one pending indication, not a visible count of two or a remaining second credit after zero. Arbitrary capacity, same-cycle priority and other causes are unproved."

[[sources]]
id = "HW8_S31_IEEE_MASKED_STATUS_20261026"
description = "SOURCE: s31-b rev0, hw8-20261026-radio-local-04/-05, ieee-timers.json tags8220..82e0: PAC-only timer8/9 with source 132 parked/CPU masked. ENA0 hides STATUS/output but retains pending; enabled positive sample still clears under mask, zero sample cannot. Selective timer0 W1C retains timer1. ED/RX/ACK/unknown lanes and same-bit recurrence are unqualified. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-radio-local.toml (source HW8_S31_IEEE_MASKED_STATUS_20261026)."

