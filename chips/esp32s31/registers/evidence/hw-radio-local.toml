id = "HW8_S31_WIFI_TSF_MASK_20261026"
description = "SOURCE: s31-b rev0, hw8-20261026-radio-local-07, wifi-timers.json tags8320..83a0: local TSF timer0/1 RAW7/6 survives masking while STATUS/output drops; a retained positive sample clears under mask. Production masked all-ones clear also removes timer0 RAW. No RF/DMA, TBTT/beacon/opaque-lane, simultaneous recurrence or minimal-clock-subset qualification. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-radio-local.toml (source HW8_S31_WIFI_TSF_MASK_20261026)."
