# Short PAC-only local interrupt observations, not lifecycle qualification.
schema = 1

[[sources]]
id = "HW8_S31_LP_PHASED_ACK_20261026"
description = "SOURCE: s31-b rev0 run hw8-20261026-radio-local-01, lease #803; /home/ermacv/dev/oer-notes/research/hw-irq-radio-local.md; target/hw-hw8/hw8-20261026-radio-local-01/lp-compare-ack.json, tags 0x8000-0x8070 and paired byte records. With XTAL/divider 1, a byte-zero read preceded a verified compare arrival (byte +0x24=1, status +0x38=0x40000, matrix127=1); a later whole-word zero cleared byte/status/output. The clear-before-expiry positive ordering control still allowed the next compare. A separate nonzero sample crossed another armed target before zero, but its already-one byte cannot independently attest that second compare. These are separated phases, not coincident set/clear priority or a proof that production's conditional nonzero acknowledgement loses every raced compare."

[[sources]]
id = "HW8_S31_LP_TWO_WRAPS_20261026"
description = "SOURCE: s31-b rev0 run hw8-20261026-radio-local-01, lease #803; /home/ermacv/dev/oer-notes/research/hw-irq-radio-local.md; target/hw-hw8/hw8-20261026-radio-local-01/lp-two-wraps.json. Compare disabled, XTAL/divider 1; two independently observed natural low-counter crossings took 33554340 and 33554014 cycles, each under a 40000000-cycle bound. No acknowledgement or counter seed intervened. After each wrap +0x2c=1, +0x38=2 and matrix127=1; the byte sampled after the first was 1 before the second arrival. One subsequent whole-word zero cleared the byte, status and source, still zero after 4096 cycles. Two wraps expose one pending indication, not a visible count of two or a remaining second credit after zero. Arbitrary capacity, same-cycle priority and other causes are unproved."

[[sources]]
id = "HW8_S31_IEEE_MASKED_STATUS_20261026"
description = "SOURCE: s31-b rev0 runs hw8-20261026-radio-local-04, lease #807, and hw8-20261026-radio-local-05, lease #808; /home/ermacv/dev/oer-notes/research/hw-irq-radio-local.md; target/hw-hw8/<run>/ieee-timers.json, tags 0x8220-0x82e0. PAC-only local timers, threshold 32; source132 route parked at zero and CPU IRQs masked. A timer expiry while its EVENT_ENABLE=0 reads zero from EVENT_STATUS and leaves matrix132 low, but enabling reveals its retained bit and raises matrix132. Masking an already-pending timer hides its status and lowers output without discarding pending. Sampling and acknowledging zero while masked does not clear that hidden event: unmask redelivers it. A positive affine sample retained from before masking does clear its event while masked, verified after unmask. With both timer bits visible, selective timer0 W1C leaves timer1/output high; the remaining enabled W1C lowers output. These observations qualify only timer bits 8/9, not ED, RX/ACK, unknown lanes or concurrent same-bit arrivals."

[[sources]]
id = "HW8_S31_WIFI_TSF_MASK_20261026"
description = "SOURCE: s31-b rev0 run hw8-20261026-radio-local-07, lease #810; /home/ermacv/dev/oer-notes/research/hw-irq-radio-local.md; target/hw-hw8/hw8-20261026-radio-local-07/wifi-timers.json, tags 0x8320-0x83a0. Short PAC-only local TSF timer0/1 expiries, no RF/DMA, source122 parked. Timer0 expiry while ENABLE=0 sets RAW bit7 while STATUS/output stay zero; unmask reveals STATUS0x80/matrix122 high. Masking retains RAW and lowers STATUS/output; acknowledgement of the prior positive sample through CLEAR while masked removes RAW, and unmask stays quiet. Timer1 gives RAW bit6/STATUS0x40/output high; enabled sampled CLEAR removes them. Fresh masked timer0 RAW is also removed by the production mask/all-ones-clear policy. These observations cover only TSF timer0/1, not TBTT/beacon events, other timer lanes, opaque bits or simultaneous recurrence. Digital setup uses the production source selection, fixed-XTAL modem tick, bootstrap SYSTIMER clock opening and Wi-Fi slow-oscillator LP source/divider0; no claim about the minimal necessary clock subset is made."
