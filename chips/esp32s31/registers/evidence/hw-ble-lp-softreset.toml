# Bounded PAC-only next-boot observations, not a product boot qualification.
schema = 1

[[sources]]
id = "HW13_S31_BLE_LP_HP_RESET_20261026"
description = "SOURCE: s31-b rev0 run hw13-20261026-ble-lp-softreset-01, lease #876 released; compare-after.json, rollover-after.json, both-after.json and control-after.json. Retained tags 0xb111/112 establish pre-SYS_SW_RST cause/pending/counter/matrix: real compare 0x40000,1/0,0x10dc,0x80000000; natural rollover 2,0/1,0xee,0x80000000; both 0x40002,1/1,0x10dd,0x80000000; quiet 0,0/0,0xf5,0. All four next ROM MEM_END entries, before probe peripheral writes (0xb100/1), show cause0, pending0/0, counter0, matrix0. Inherited MODEM_PWR gates, LP selector/divider and BLE timer clock are zero; clock-only access restoration without LP prepare/reset/clear/start/enable still gives zeros (0xb120-23). Fresh software pending reads1 but stays silent until bit18 enable, then 0x40000/source127 high (0xb130/132). Both HP reset causes3 and retained record valid (0xb114). The reset follows production fatal::reset_recording MMIO/CSR order for hart0 with hart1 already held, including UART restoration, boot-address clear, other-core pulse/stall, fence and typed SYS_SW_RST; no intervening debugger reset. R1 alone does not establish bit1 retention: its counter wrap had no positive pending-byte control; the separate HW13_S31_BLE_LP_HP_RESTORE_20261026 source supplies valid post-reset producer controls. LP source selector/divider stayed zero during access-gate restoration; pending was acknowledged before restoring the LP source, so internal rollover retention behind that disabled source clock is also unqualified. No immediate reset-edge, POR value, hidden gated counter state or universal boot-path guarantee. Report: /home/ermacv/dev/oer-notes/research/hw-ble-lp-softreset.md; original raw logs: /home/ermacv/dev/open-esp-radio/target/wt-hw13/target/hw-hw13/hw13-20261026-ble-lp-softreset-01/; archived with the report's evidence reference when the temporary worktree is removed."

[[sources]]
id = "HW13_S31_BLE_LP_HP_RESTORE_20261026"
description = "SOURCE: s31-b rev0 run hw13-20261026-ble-lp-softreset-06, lease #881 released; both-after.json and control-after.json. Retained pre-reset images: both cause0x40002, pending1/1, counter0x10d8, matrix0x80000000; quiet cause0, pending0/0, counter0xf6, matrix0. Both HP causes3 and valid reason. Next ROM-loader entry before prepare is all zero; access-gate restoration remains zero. Crucially, selector-only LP XTAL/divider1 restoration before any acknowledge, prepare, start or +0x10 enable also leaves bytes/cause/counter/matrix zero through 4096 cycles (0xb124-27). Fresh software pending remains silent until bit18 enable (0xb130/132). With compare alone disabled, LP source/CONTROL_25/START restored and no new bit1 enable, a positively witnessed natural counter wrap leaves pending/status/output0 (0xb140/142). Immediate bit1 enable does not redeliver (0xb144); a fresh enabled natural wrap sets P2c1, cause2 and matrix0x80000000 (0xb146/148/149). Both delivery lanes operationally require a new enable in this tested post-HP-reset setup; this is not readable enable-state evidence or proof that disabled rollover capture and masking are independent. All waits are bounded; no qualification repeats. Initial RAM loading uses one USB-reset/ROM-MEM_END connection; next-boot RAM loads use no reset. Cleanup returns ROM download successfully. Report: /home/ermacv/dev/oer-notes/research/hw-ble-lp-softreset.md; original raw logs: /home/ermacv/dev/open-esp-radio/target/wt-hw13/target/hw-hw13/hw13-20261026-ble-lp-softreset-06/; archive reference in the report after temporary-worktree removal."
