id = "HW13_S31_BLE_LP_HP_RESET_20261026"
description = "SOURCE: s31-b rev0, hw13-20261026-ble-lp-softreset-01, compare/rollover/both/control-after.json: after typed SYS_SW_RST, next ROM-loader entry and access-gate restoration read cause/pending/counter/matrix zero. Fresh software pending requires bit 18 enable. Tested reset ordering differs from full fatal-path publication/election/watchdog handling; disabled rollover capture behind source clocks, immediate reset edge, POR and universal boot behavior remain unqualified. R1 lacks a positive post-reset rollover control; use the separate RESTORE source. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-ble-lp-softreset.toml (source HW13_S31_BLE_LP_HP_RESET_20261026)."

[[sources]]
id = "HW13_S31_BLE_LP_HP_RESTORE_20261026"
description = "SOURCE: s31-b rev0, hw13-20261026-ble-lp-softreset-06, both/control-after.json: selector-only XTAL/divider1 restoration leaves pending/cause/counter/matrix zero before acknowledge/prepare/start/enable. Fresh software pending requires bit 18; a witnessed wrap without bit 1 stays silent and a new enabled wrap asserts. Both delivery lanes operationally require enable in this setup; readable enable/reset state and independence of capture from masking are unqualified. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/hw-ble-lp-softreset.toml (source HW13_S31_BLE_LP_HP_RESTORE_20261026)."
