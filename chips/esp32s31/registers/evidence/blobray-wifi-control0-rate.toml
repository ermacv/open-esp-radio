id = "BX8_WIFI_CONTROL_CONSUMER_LIMITS_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. libpp[hal_debug.o]::dbg_read_tx_ppdu+0x14a..0x154 retains only CONTROL[19:0]; libpp[hal_mac_tx.o]::hal_mac_get_txq_complete+0x3b2/+0x40e..0x434 logs [26:24], discarding [22:20] locally. hal_mac_txq_enable+0xc/+0x1e and rom[]::hal_mac_txq_enable+0xc/+0x24 preserve [22:20] while setting ownership; libpp[hal_mac.o]::hal_mac_is_txq_valid+0xc and hal_mac_is_txq_enabled+0xc select ownership only. Partial scan/value semantics, indexed unresolved addresses, opaque calls and a work limit in the completion body prevent an exhaustive consumer absence proof. No physical identity for the opaque pair or bit22 is established."
