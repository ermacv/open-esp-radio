id = "BX8_WIFI_CONTROL_PREPARATION_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. esp-phy-lib@20f1db053a0e6cb9f1c09d255c43bf42483041d0, esp32s31/librftest.a SHA-256 c76dfc7e80bdbe29dbdafe68f1a09eb18db66ca392a2d66f1c5ddb169d9a2c5a. libpp[hal_mac_tx.o]::mac_tx_set_plcp0+0x18..0x26/+0x6c and rom[]::mac_tx_set_plcp0+0x14..0x22/+0x5c publish CONTROL[21:20]=2 and bit22=1 before family-specific legacy/HT/HE vectors. librftest[mac_common.o]::fill_tx_frame+0x6e/+0x392 publishes the low20 DMA address with these upper lanes zero. Preparation images establish neither physical modes nor successful RFTEST transmission; encodings 01/11 remain unidentified."

[[sources]]
id = "BX8_WIFI_CONTROL_TXOP_SCOPE_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[hal_mac_tx.o]::hal_mac_tx_set_ppdu+0xfe..0x10a gates descriptor-rate codes16..35 away from the TXOP call at +0x11c..0x120; those rates reach HE +0x184..0x194 or HT +0x1f4..0x1f8. mac_tx_set_txop_q+0xe/+0x2e..0x30 selects slots; +0x86..0xae sets CONTROL22 for software-descriptor class2, +0xd0..0xda clears it for classes0/1/3, and +0xfc..0x108 preserves it for slot3. The class comes from frame+0x34 software flags, separately from the DMA head. These are bounded local control-flow facts, without universal cipher, fragment or air semantics."

[[sources]]
id = "BX8_WIFI_TX_FORMAT_DOMAINS_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[hal_mac_tx.o]::mac_tx_set_plcp1+0x8/+0x12..0x38/+0x4e..0x66/+0xac publishes RATE[16:12] and VECTOR_FORMAT[27:25] separately from CONTROL.PLCP_FORMAT[26:24]. libpp[hal_debug.o]::dbg_read_tx_sig+0x24..0x2a selects interpretation from PLCP1[26:25], with later comparisons +0x2a2/+0x2d4; it does not select CONTROL.PLCP_FORMAT. The VHT diagnostic branch establishes no public VHT-transmission capability."

