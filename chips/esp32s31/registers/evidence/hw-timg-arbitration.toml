[[sources]]
id = "HW23_S31_TIMG0_RELOAD_20261027"
description = "SOURCE: s31-a rev0, run hw23-20261027-timg-arbitration-01, stand lease #908; ermacv/oer-notes research/hw-timg0-arbitration.md, reload-rate.json, intervals.json and pending-rearm.json, selections 190-192, measured probe commit e4016ef7. XTAL selector0, divider40, CPU XTAL/divider1, MNLBITS3. While stopped, LOAD strobe loads high3/low12345; changing LOADHI/LO to zero without a strobe retains that count, and the next strobe produces high0/low0. Counting advances 1002 ticks in 40076 CPU cycles including capture overhead, consistent with nominal 1 MHz T0 at 40 MHz CPU. The exact HAL #710 stop/mask/fence/alarm/load-zero/LOAD/armed/fence/unmask/fence sequence from that nonzero seed produces RAW for requested 10/100/1000 ticks. Last-negative/first-positive RAW polling timestamps relative to before the armed configuration are 412/451, 4012/4051 and 40016/40055 cycles; arm return is +57 cycles and subsequent captures are 13/103/1003 with high0. These are instrumented polling observations, not exact comparator or interrupt-entry timestamps. Rearming an already-pending timer to 1000 retains RAW/ST with ALARM_EN set; a separate CLR removes old pending and the fresh expiry is observed at 40020/40059 cycles. No clear/arrival collision, arbitrary delay, wrap or production-load guarantee."

[[sources]]
id = "HW23_S31_TIMG0_COMPARATOR_20261027"
description = "SOURCE: s31-a rev0, run hw23-20261027-timg-arbitration-01, stand lease #908; ermacv/oer-notes research/hw-timg0-arbitration.md, equal-below.json and running-past.json, selections 193-194, measured probe commit e4016ef7. Stopped count is captured as 10000 before programming alarm9999,10000,11000 separately with ENA1 and initial RAW/ST0. Enabling alarm with T_EN0 leaves RAW/ST0 and ALARM_EN1 after 4096 cycles for all three. Starting armed-counting from that count produces below/equal pending at last-negative/first-positive polling marks 27/66 cycles after the pre-start timestamp; target11000 fires at 40023/40061 cycles. Independently, a running counter captured at10001 and RAW/ST0, then armed for target0, fires at 28/69 cycles. Expiry clears ALARM_EN and leaves T_EN1. Thus tested at/below targets do not wait for wrap once counting is enabled; an enabled alarm on the stopped counter does not immediately assert. No single-cycle comparator equation or exact running-equality alignment is established."

[[sources]]
id = "HW23_S31_P2_ARBITRATION_20261027"
description = "SOURCE: s31-a rev0, run hw23-20261027-timg-arbitration-01, stand lease #908; ermacv/oer-notes research/hw-timg0-arbitration.md, timer-low.json and timer-high.json, selections 195-196, measured probe commit e4016ef7. TIMG0 T0/source25 and FROM_CPU2/source67 are both positively pending before MIE: matrix bank0=0x02000000, bank2=8, T0 RAW/ST1, FROM_CPU2=1; CLIC lines16/17 each IP1/IE1/CTL0x3f with MNLBITS3 (the image's P2 encoding, no priority bits). First TIMG25 maps16/FROM_CPU67 maps17, then the assignment swaps. Both admissions enter line17 then16, raw mcause0xb8000011 then0xb8000010 and mintstatus0x3f000000, exactly two entries; handler timestamps +124/+378 and +124/+379 cycles after pre-MIE timestamp. Each handler disables only its own CPU line, retaining both peripheral causes, so source-clear order does not select the winner. Supports the highest-line family tie-break on this S31 hart0 line pair at P2, independently of which source owns the higher line. Other line pairs, levels, harts and sustained pending fairness are unmeasured."
