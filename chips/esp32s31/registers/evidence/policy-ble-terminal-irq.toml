id = "POLICY_S31_BLE_TERMINAL_NONFAULT_ACK_20261027"
description = "SOURCE: terminal BLE policy. The fixed CLEAR0 image 0x18212103 combines scheduler lanes21/27/28 with vendor feature-mask/ack lanes0/1/8/13/16; CLEAR1 image0x207a combines overflow1, scheduler3 and feature4/5/6/13. BLOB_LIBBTDM_CONTROLLER_IRQ, BLOB_S31_BLE_IRQ_RELEASE_SCOPE_20261027 and BLOB_LIBBLE_ISO_COEX_REGISTERS supply the vendor mask/W1C scopes; BLOB_S31_BLE_NRT_DISPOSITION_20261027 establishes that NRT uses these same CLEAR words. Fault lanes bank0[15] and bank1[8/9/12] are excluded, including from NRT acknowledgement admission. Fixed W1C under a closed enable is hardware-confirmed only for bank1 CC0/CC1/overflow (images0x10/0x20/2), run hw32-20261027-ble-masked-01, lease944, selections300-302, report oer-notes/research/hw32-ble-masked-pending.md (PR#757). Bank0, NRT and the other feature lanes are vendor-covered policy, not hardware-verified. Opening a lane at MAP0 raises matrix124 and modem wake vector0x10 in that run, so terminal cleanup never reopens ENA. Masked STATUS zero cannot prove pending zero; readback verifies disabled enables and rejects residual visible observations, without a producer-drain or output-low claim."
