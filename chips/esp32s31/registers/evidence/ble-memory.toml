id = "BLOB_LIBBLE_MEMORY_BUFFER_HEADER"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete memMgmt_3.o r_sym_memMgmt_2LOgKQI4pa8z243VUnLR, r_sym_memMgmt_vqXcstfse8788iyCxlJf and r_sym_memMgmt_wH5HONweyQB0WZipVFDn establish the 0x18-byte TX/RX header, compressed byte-buffer base and TX packet+0x10 target. memMgmt_4.o receive recycling, as recorded in oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-scheduler-lists.md and oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-passive-scanning.md, establishes header-next compressed links, completion word +0x0c bit31, software terminal/extent word +0x10 and full CPU predecessor +0x14. The open memory owner uses the terminal marker and LLID completion metadata as software state; no independent silicon meaning is asserted for them. Preserved high lanes retain their image without bit fields. See also BLOB_LIBBLE_DTM_PACKET_HEADER_BINDING."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_RX_PREFIX"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete memMgmt_3.o RX allocators r_sym_memMgmt_vqXcstfse8788iyCxlJf and r_sym_memMgmt_wH5HONweyQB0WZipVFDn and dtm_4.o sym_dtm_ikQ7xyHA5qBHWlaqAjZu/sym_dtm_JMPstxdIRcEVY1YJeXkA establish the prefix extent +0x1e, result +0x0c with RSSI high byte, producer sentinel low24 and auxiliary sentinel halfword +0x18. oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-direct-test-mode.md, oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-passive-scanning.md and oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-peripheral-connection.md retain the capture at +0x10, two-byte PDU at +0x1c and current role rejection gates. Individual result-bit meanings, capture epoch and hardware production of the allocation tag are not established; their fields remain opaque."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_TX_PREFIX"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete memMgmt_3.o r_sym_memMgmt_2LOgKQI4pa8z243VUnLR and dtm_4.o sym_dtm_25YOj8pPkiCiy504xJbR establish the TX allocator class/state bytes +5/+6, PDU header +0x10, length +0x11 and payload +0x12. oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-direct-test-mode.md and oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-legacy-advertising.md distinguish the complete DTM/data payload from legacy advertising data for which hardware inserts AdvA. Remaining prefix bytes have allocation-position evidence only and no bit fields."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_SCHEDULER_ITEM"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete scheduler list, insertion, merge and recycle bodies recorded in oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-scheduler-lists.md establish the 0x60-byte item and common links, status, raw times, kind and software bookkeeping. libbtdm_common.a sha256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0 at the same pin supplies the common hardware-list consumers. Role producers: dtm_4.o sym_dtm_2zeOUjc7g55zkDNQuZkg and sym_dtm_C15YAGhOCEEdWMnhjaY3.part.1; ble_2.o r_sym_ble_GlcyfUkkhUzGUt8un0d8; ble_6.o r_sym_ble_aQLjUHo25zeoHGKf9dby; ble_3.o r_sym_ble_tPr7egUaNHmqfcieCA5O and r_sym_ble_rsCCyH2B22gdYkN4LOOJ. Their archived role investigations in oer-notes/evidence/chips-notes/chips/esp32s31/notes/ records cover every role image. Coexistence lanes are described in oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth/le-coexistence-priorities.md. Source callback identities and used numerical profiles are retained without assigning hardware meanings. Role kind at +8 bits23:20, duplicated priority at +0x18 bits7:4 and the two mode-to-rate codes at +0x14 bits29:28/31:30 have established software meanings. Complete ble_6.o r_sym_ble_IYA41eW9c6m45QdYupOB +0x15c..0x176 installs receive-buffer recycle callback r_sym_ble_CcSBujbD8nhmAY1yBT4T at item +0x5c, beside the item callback at +0x58. Preserved tails and zero-only allocation positions have no bit fields. Both initial and recurring DTM bodies preserve +0x18 bits31:15 by fresh-load AND 0xffff80ff OR seven-bit frequency shifted eight; no field is published for those high17 preservation-only lanes."

