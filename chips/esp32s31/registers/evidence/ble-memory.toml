id = "BLOB_LIBBLE_MEMORY_PHY_ENVIRONMENT"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete ble_70.o r_sym_ble_ragNLqDkbVnj7GUutTgs (r_ble_phy_env_init), r_sym_ble_F5GRQVjvl0NEWFKuXXJk (r_ble_phy_module_init) and r_sym_ble_nENHlP4KBuQYlFVffaR5 establish the 0x80-byte environment, separate byte lookup buffers through +0x30/+0x34/+0x38, transmit-power buffer +0x48, count byte +0x4c and sign-extended endpoints +0x78/+0x7c. notes/bluetooth-controller-boundary.md and notes/bluetooth/phy-register-init.md record published raw members +0x2c/+0x4d and the resolving-list allocation in 0x40-byte units with initial head 0x80000000. notes/bluetooth-peripheral-connection.md records initialized packet-start calibration. No meaning is assigned to remaining environment or resolving-list fields."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_DF_WORKSPACE"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete ble_4.o r_sym_ble_mIskG2GvbtwJXrhsY5EZ is 60 bytes and requests length0x1c, count1, flags0/1 from ble_35.o r_sym_ble_pzoiUAZUrqXUUY6RB1c3. The latter multiplies length by count, selects allocation and clears exactly that size. On success the former writes byte1 at allocation+8 and word1 at +0x0c. The current open owner retains0x20 bytes, so its last word is retained padding, not a claim about the vendor allocation. The +8 ordinary-role compressed endpoint and +0x0c disabled-CTE descriptor are recorded in notes/bluetooth/controller-memory.md with complete ble_4.o r_sym_ble_FZU452JXpwl3LtErzDPJ and its slot-zero publications through r_sym_ble_0wJYOi1maT14CoxXAvPQ / r_sym_ble_FP0qQtIrPdb7A8lmBaH3; other words are positional opaque fields. This hardware baseline does not describe a software CTE ring."
