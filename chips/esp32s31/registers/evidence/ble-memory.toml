id = "BLOB_LIBBLE_MEMORY_SCHEDULER_CONTEXT"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Role allocators recorded in oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-direct-test-mode.md and oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-legacy-advertising.md allocate a separate zeroed 0x48-byte context, referenced by item +4. In particular dtm_4.o sym_dtm_qzyGhbH1fEoUEmtalnva and ble_2.o advertising allocation/start and item allocation bodies establish this link. No internal context-word interpretation is asserted."

