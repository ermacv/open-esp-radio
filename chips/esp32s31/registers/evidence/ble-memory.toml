id = "BLOB_LIBBLE_MEMORY_LINK_STATE"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete role allocation/reset/event bodies dtm_4.o sym_dtm_qzyGhbH1fEoUEmtalnva and sym_dtm_7gOGApwmDG1TxZOfQhrh; ble_2.o r_sym_ble_BU65xm0Suu1ZxafP2o1R and r_sym_ble_7lsXnox2LxrGG0FmY7qR; ble_6.o r_sym_ble_KkAldzIlkQuEkNQp1g6q; ble_3.o r_sym_ble_bgOSnaHsEjrTC0mkupqH, r_sym_ble_tPr7egUaNHmqfcieCA5O and r_sym_ble_rsCCyH2B22gdYkN4LOOJ establish the shared 0x84-byte physical allocation and the reviewed per-role transforms. See archived role investigations in oer-notes/evidence/chips-notes/chips/esp32s31/notes/. Hardware compressed header consumers at +0/+4/+8 differ from full CPU anchors at +0x64..+0x78. Word +0x18 is scanner policy in scanner mode and a complete controller receive-time image in connection mode. Software advsm+0x0c flags belong to a different object. Advertising reset +0x114..0x15a writes the two mode-to-rate codes at +4 bits29:28/31:30; +0x21c..0x232 and scanner reset +0x474 publish a compressed resolving-entry address at +0x24 bits19:0. Scanner initiating reset +0x382..0x3a0 explicitly masks +0x48 outside bits15:8 and writes +0x44/+0x46/+0x4c halfwords. Connection recurring r_sym_ble_rsCCyH2B22gdYkN4LOOJ +0x216..0x222 clears +0x10 bits30:20. Complete shared DF helper r_sym_ble_FZU452JXpwl3LtErzDPJ clears +0x50 bits23:20 and +0x54 bits30:19. These direct masked uses remain fields even when a restricted role image contains zero. Preserved lanes and zero-only allocation positions retain storage without bit fields. Current memMgmt_3.o r_sym_memMgmt_Y8TRmkkC6iS2xOKx4nb1 +0x38 stores the supplied full CPU configuration pointer at link-state +0x7c; memMgmt_4.o r_sym_memMgmt_fklZTFbPfOGtnTfZVgMq +0 loads it, +2/+8 dereference enable/index bytes22/23 and +0x26/+0x28/+0x2a update RX anchors at +0x68/+0x70/+0x78. The live full32 pointer is described as RX_QUEUE_CONFIGURATION.ADDRESS, without inventing a layout for its pointee or treating it as a compressed hardware link. Scanner reset is 0x478 bytes: option branches and private +0x18/+0x48 transforms differ from the earlier profile; the open restricted profile is not whole-profile equivalence. The c-nibble store is +0x2fa and final RX-path store +0x40e."

