id = "BLOB_LIBBLE_MEMORY_BUFFER_HEADER"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete memMgmt_3.o r_sym_memMgmt_2LOgKQI4pa8z243VUnLR, r_sym_memMgmt_vqXcstfse8788iyCxlJf and r_sym_memMgmt_wH5HONweyQB0WZipVFDn establish the 0x18-byte TX/RX header, compressed byte-buffer base and TX packet+0x10 target. memMgmt_4.o receive recycling, as recorded in notes/bluetooth-scheduler-lists.md and notes/bluetooth-passive-scanning.md, establishes header-next compressed links, completion word +0x0c bit31, software terminal/extent word +0x10 and full CPU predecessor +0x14. The open memory owner uses the terminal marker and LLID completion metadata as software state; no independent silicon meaning is asserted for them. Unknown high lanes have positional evidence only. See also BLOB_LIBBLE_DTM_PACKET_HEADER_BINDING."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_RX_PREFIX"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete memMgmt_3.o RX allocators r_sym_memMgmt_vqXcstfse8788iyCxlJf and r_sym_memMgmt_wH5HONweyQB0WZipVFDn and dtm_4.o sym_dtm_ikQ7xyHA5qBHWlaqAjZu/sym_dtm_JMPstxdIRcEVY1YJeXkA establish the prefix extent +0x1e, result +0x0c with RSSI high byte, producer sentinel low24 and auxiliary sentinel halfword +0x18. notes/bluetooth-direct-test-mode.md, notes/bluetooth-passive-scanning.md and notes/bluetooth-peripheral-connection.md retain the capture at +0x10, two-byte PDU at +0x1c and current role rejection gates. Individual result-bit meanings, capture epoch and hardware production of the allocation tag are not established; their fields remain opaque."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_TX_PREFIX"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete memMgmt_3.o r_sym_memMgmt_2LOgKQI4pa8z243VUnLR and dtm_4.o sym_dtm_25YOj8pPkiCiy504xJbR establish the TX allocator class/state bytes +5/+6, PDU header +0x10, length +0x11 and payload +0x12. notes/bluetooth-direct-test-mode.md and notes/bluetooth-legacy-advertising.md distinguish the complete DTM/data payload from legacy advertising data for which hardware inserts AdvA. Remaining prefix bytes have allocation-position evidence only."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_SCHEDULER_ITEM"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete scheduler list, insertion, merge and recycle bodies recorded in notes/bluetooth-scheduler-lists.md establish the 0x60-byte item and common links, status, raw times, kind and software bookkeeping. libbtdm_common.a sha256 389561cead8a68444b46118fb606d5742813c88f8a37c43d22be271aaa4bdb41 at the same pin supplies the common hardware-list consumers. Role producers: dtm_4.o sym_dtm_2zeOUjc7g55zkDNQuZkg and sym_dtm_C15YAGhOCEEdWMnhjaY3.part.1; ble_2.o r_sym_ble_GlcyfUkkhUzGUt8un0d8; ble_6.o r_sym_ble_aQLjUHo25zeoHGKf9dby; ble_3.o r_sym_ble_tPr7egUaNHmqfcieCA5O and r_sym_ble_rsCCyH2B22gdYkN4LOOJ. Their notes/bluetooth-{direct-test-mode,legacy-advertising,passive-scanning,peripheral-connection}.md records cover every role image. Coexistence lanes are described in notes/bluetooth/le-coexistence-priorities.md. Source callback identities and opaque numerical profiles are retained without assigning hardware meanings."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_LINK_STATE"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Complete role allocation/reset/event bodies dtm_4.o sym_dtm_qzyGhbH1fEoUEmtalnva and sym_dtm_7gOGApwmDG1TxZOfQhrh; ble_2.o r_sym_ble_BU65xm0Suu1ZxafP2o1R and r_sym_ble_7lsXnox2LxrGG0FmY7qR; ble_6.o r_sym_ble_KkAldzIlkQuEkNQp1g6q; ble_3.o r_sym_ble_bgOSnaHsEjrTC0mkupqH, r_sym_ble_tPr7egUaNHmqfcieCA5O and r_sym_ble_rsCCyH2B22gdYkN4LOOJ establish the shared 0x84-byte physical allocation and exact per-role transforms. See notes/bluetooth-{direct-test-mode,legacy-advertising,passive-scanning,peripheral-connection}.md. Hardware compressed header consumers at +0/+4/+8 differ from full CPU anchors at +0x64..+0x78. Word +0x18 is scanner policy in scanner mode and a complete controller receive-time image in connection mode. Software advsm+0x0c flags belong to a different object. Unassigned ranges remain positional opaque fields."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_SCHEDULER_CONTEXT"
description = "esp32s31-bt-lib 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723; Role allocators recorded in notes/bluetooth-direct-test-mode.md and notes/bluetooth-legacy-advertising.md allocate a separate zeroed 0x48-byte context, referenced by item +4. In particular dtm_4.o sym_dtm_qzyGhbH1fEoUEmtalnva and ble_2.o advertising allocation/start and item allocation bodies establish this link. No internal context-word interpretation is asserted."

