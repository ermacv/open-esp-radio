id = "BLOB_LIBBLE_MEMORY_PHY_ENVIRONMENT"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete ble_70.o r_sym_ble_ragNLqDkbVnj7GUutTgs (r_ble_phy_env_init), r_sym_ble_F5GRQVjvl0NEWFKuXXJk (r_ble_phy_module_init) and r_sym_ble_nENHlP4KBuQYlFVffaR5 establish the 0x84-byte environment, separate byte lookup buffers through +0x30/+0x34/+0x38, transmit-power buffer +0x4c, count byte +0x50 and sign-extended endpoints +0x7c/+0x80. oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-controller-boundary.md and oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth/phy-register-init.md record published raw members +0x2c/+0x51 and the resolving-list allocation in 0x40-byte units with initial head 0x80000000. oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-peripheral-connection.md records initialized packet-start calibration. No meaning is assigned to remaining environment or resolving-list fields. The word at +0x48 is retained as opaque storage."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_DF_WORKSPACE"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete ble_4.o r_sym_ble_mIskG2GvbtwJXrhsY5EZ is 60 bytes and requests length0x1c, count1, flags0/1 from ble_35.o r_sym_ble_pzoiUAZUrqXUUY6RB1c3. The latter multiplies length by count, selects allocation and clears exactly that size. On success the former writes byte1 at allocation+8 and word1 at +0x0c. The current open owner retains0x20 bytes, so its last word is retained padding, not a claim about the vendor allocation. The +8 ordinary-role compressed endpoint and +0x0c disabled-CTE descriptor are recorded in oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth/controller-memory.md with complete ble_4.o r_sym_ble_FZU452JXpwl3LtErzDPJ and its slot-zero publications through r_sym_ble_0wJYOi1maT14CoxXAvPQ / r_sym_ble_FP0qQtIrPdb7A8lmBaH3; other words retain their physical storage without bit fields. This hardware baseline does not describe a software CTE ring."

[[sources]]
id = "BLOB_LIBBLE_MEMORY_PHY_LOOKUPS"
description = "esp32s31-bt-lib 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6; Complete ble_70.o r_sym_ble_ragNLqDkbVnj7GUutTgs (r_ble_phy_env_init) allocates and zeros 0x28 bytes for environment+0x30, 2*0x04 bytes for +0x34 and 0x04 bytes for +0x38. Complete r_sym_ble_F5GRQVjvl0NEWFKuXXJk (r_ble_phy_module_init) and r_sym_ble_nENHlP4KBuQYlFVffaR5 initialize the channel-frequency, packet-prefix airtime and receive address-capture delay tables. oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-controller-boundary.md records these exact allocation extents; oer-notes/evidence/chips-notes/chips/esp32s31/notes/bluetooth-peripheral-connection.md records the initialized calibration and mode-indexed normalizer. The open producer derives channel frequency and packet-prefix airtime from the LE channel/PHY definitions and retains the reviewed S31 receive-capture delays."
