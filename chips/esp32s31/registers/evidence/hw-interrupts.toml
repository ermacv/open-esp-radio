# Short PAC-only stand observations; no power-on-reset inference from ROM state.
schema = 1

[[sources]]
id = "HW1_S31_CLIC_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-interrupt-04, lease #772; ermacv/oer-notes research/hw-interrupt-facts.md. ROM download plus ROM MEM_END loaded the PAC-only SRAM image; no HAL ran. INT_INFO reads NUM_INT=48, CTLBITS=3, VERSION=0. Before probe CLIC writes, MNLBITS=1, NVBITS=1, NMBITS=0; external CTRL modes read 3, and the described CTRL fields of some core-local slots read zero. These are post-ROM observations, not power-on-reset images. With other matrix sources parked and line 16 positive-edge/vectored, one typed IP publication read pending=1, produced one handler entry, then read pending=0. This establishes the isolated line-16 operation, not concurrent word-RMW safety or every optional trigger mode."

[[sources]]
id = "HW1_S31_RESET_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-reset-06, lease #774; ermacv/oer-notes research/hw-interrupt-facts.md. The typed SYS_SW_RST trigger reset both HP cores: their next-boot reset causes read 3. A 12-word probe reason record survived in LP RAM. Pre-trigger UART0 read XTAL selector 0, integer/fractional dividers 0 and gate enabled after an observed divider perturbation to 3; hart1 was globally reset with its CPU clock gated and boot address zero. LP wakeup flag read zero before and after: preservation of an already-pending event was not established. ROM MEM_END loaded the observer without a second reset."

[[sources]]
id = "HW1_S31_BOOT_ADDRESS_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-boot-07, lease #775; ermacv/oer-notes research/hw-interrupt-facts.md. With hart1 global reset asserted and CPU clock gated throughout, typed writes of 0, 0x2f001234, complementary words 0x01234567 and 0xfedcba98, then 0 read back exactly, including bits 1:0. Zero was read before and after the hart1 reset pulse. The necessity of clear-before-pulse ordering was not tested. No test word was executed; this does not separately prove the ROM waiting protocol or a running-hart reset/drain."

[[sources]]
id = "HW1_S31_THRESHOLD_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-threshold-sweep-09, lease #785; ermacv/oer-notes research/hw-interrupt-facts.md, claim 4. With MNLBITS=3, line 16 CTL=0x1f, threshold initially zero and MIE enabled before an initially inactive FROM_CPU2 raise, a typed store without readback, its fixed return and K=0..24 unrolled NOPs preceded the CSR mintthresh write to 0x3f. Each K used 0..3 post-write NOPs, with/without CSR readback, three repeats each: 600 trials. Saved mepc was before the write in 145 trials, on the write in 24, never after it; 431 trials had no entry and retained pending until lowering the threshold, when each delivered once. K=18 gave 24 on-write entries and K=19..24 gave 144 before-write entries, covering the admission boundary. No post-write admission window or need for a readback/NOP was observed in this setup; this does not test legacy MMIO INT_THRESH or establish every clock/source/interleaving."
