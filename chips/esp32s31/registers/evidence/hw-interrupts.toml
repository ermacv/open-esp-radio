# Short PAC-only stand observations; no power-on-reset inference from ROM state.
schema = 1

[[sources]]
id = "HW1_S31_CLIC_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-interrupt-04, lease #772; ermacv/oer-notes research/hw-interrupt-facts.md. ROM download plus ROM MEM_END loaded the PAC-only SRAM image; no HAL ran. INT_INFO reads NUM_INT=48, CTLBITS=3, VERSION=0. Before probe CLIC writes, MNLBITS=1, NVBITS=1, NMBITS=0; external CTRL modes read 3, and the described CTRL fields of some core-local slots read zero. These are post-ROM observations, not power-on-reset images. With other matrix sources parked and line 16 positive-edge/vectored, one typed IP publication read pending=1, produced one handler entry, then read pending=0. This establishes the isolated line-16 operation, not concurrent word-RMW safety or every optional trigger mode."

[[sources]]
id = "HW1_S31_RESET_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-reset-06, lease #774; ermacv/oer-notes research/hw-interrupt-facts.md. The typed SYS_SW_RST trigger reset both HP cores: their next-boot reset causes read 3. A 12-word probe reason record survived in LP RAM. Pre-trigger UART0 read XTAL selector 0, integer/fractional dividers 0 and gate enabled after an observed divider perturbation to 3; hart1 was globally reset with its CPU clock gated and boot address zero. LP wakeup flag read zero before and after: preservation of an already-pending event was not established. ROM MEM_END loaded the observer without a second reset."

[[sources]]
id = "HW1_S31_BOOT_ADDRESS_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-boot-07, lease #775; ermacv/oer-notes research/hw-interrupt-facts.md. With hart1 global reset asserted and CPU clock gated throughout, typed writes of 0, 0x2f001234, complementary words 0x01234567 and 0xfedcba98, then 0 read back exactly, including bits 1:0. Zero was read before and after the hart1 reset pulse. The necessity of clear-before-pulse ordering was not tested. No test word was executed; this does not separately prove the ROM waiting protocol or a running-hart reset/drain."

[[sources]]
id = "HW1_S31_THRESHOLD_20261026"
description = "SOURCE: stand s31-a rev0 run hw1-20261026-threshold-sweep-09, lease #785; ermacv/oer-notes research/hw-interrupt-facts.md, claim 4. With MNLBITS=3, line 16 CTL=0x1f, threshold initially zero and MIE enabled before an initially inactive FROM_CPU2 raise, a typed store without readback, its fixed return and K=0..24 unrolled NOPs preceded the CSR mintthresh write to 0x3f. Each K used 0..3 post-write NOPs, with/without CSR readback, three repeats each: 600 trials. Saved mepc was before the write in 145 trials, on the write in 24, never after it; 431 trials had no entry and retained pending until lowering the threshold, when each delivered once. K=18 gave 24 on-write entries and K=19..24 gave 144 before-write entries, covering the admission boundary. No post-write admission window or need for a readback/NOP was observed in this setup; this does not test legacy MMIO INT_THRESH or establish every clock/source/interleaving."

[[sources]]
id = "HW_S31_CLIC_LEVELS_SOFTWARE_PEND_20261118"
kind = "unattested-hil-observation"
description = "SOURCE: stand s31-a rev0, lease #1477, tasks/187 run 2 of the PAC-only facts image (selections 310-316, PR #1341, commit 355b7d315; run 1, lease #1476, lost the board to the armed ROM RTC watchdog after selection 310, whose ten trials matched run 2). Hart 0 only, hart 1 contained, MNLBITS=3, external lines hardware-vectored positive-edge with no routed source except FROM_CPU2 where named; a pend is the typed read-modify-write of the line's own CTRL word setting IP with MIE cleared. Ten repeats each, all identical: levels 1-7 (CTL 0x1f..0xdf) each enter while the level below runs, a pend at the same or a lower level is taken only after the running handler returns, mintstatus.MIL equals the line's CTL in every handler and the seven return in reverse order. A pend from a higher level's handler is entered once after it returns; from the thread or a lower level it is entered before the pending code's next logged step; a pend inside the line's own handler gives exactly one more entry after it returns; two pends before entry give one entry. Pending line 34 between line 33 (edge, IP set, IE clear) and line 35 (FROM_CPU2 raised before the pend, between its read and its write, or after it; level- and edge-triggered) gave one entry of 34 and of 35 and none of 33, which stayed pending with its word unchanged, in all 60 trials. From the write of a level-1 pend in a level-3 handler that then returns to the level-1 handler's first mcycle read: 218 cycles in all 100 samples (isolated, not a bound). Details: oer-notes tasks/187 report; logs in evidence/187."

[[sources]]
id = "HW_S31_CLIC_LINE_BYTES_20261119"
kind = "unattested-hil-observation"
description = "SOURCE: stand s31-a rev0, tasks/241 run of the PAC-only facts image (selections 317-321 on the unmerged branch probe/rx-rebind-4 at de26cc2f3, each from its own ROM-download reset and SRAM load; hart 0 only, no radio). Line 34 bound as HW_S31_CLIC_LEVELS_SOFTWARE_PEND_20261118 bound it: level 2, hardware-vectored, positive-edge, its pending bit cleared before its enable, MNLBITS=3. Each store is one volatile byte write to the line's byte register (ESP_IDF_4D59230D_S31_CLIC lines 113-160), with no read of the word. A hundred trials of each, every one as stated: a store of 1 to the IP byte from the thread entered the line once, IP read clear again after it and the other three bytes (IE, ATTR, CTL) read back unchanged; the entry came later than the next instruction in all hundred and within 60 000 cycles in all hundred (the delay not measured); a store from a level-3 handler entered the line once, after that handler returned; two stores with MIE cleared before the entry gave one entry; a store in the line's own handler gave exactly one more entry; with lines 33 and 35 edge-triggered, disabled and pending, a store of line 34's IP byte entered 34 once and left both neighbours' words unchanged. With MIE cleared and the line disabled, a store of the CTL byte (another level's), of the ATTR byte (level-triggered) and of the IE byte each changed its own byte and no other of the line's word, and the stored-back byte restored it. Only bit 0 of the IP byte was read: its bits 7:1, unassigned in the header, were not observed. Not exercised: lines other than 34, hart 1, a store racing the hardware's clear of IP at the vectored entry. Details: oer-notes tasks/241 and 242; logs in evidence/241/r1."

