[[sources]]
id = "ESP_IDF_4D59230D_S31_TIMER0_LL"
description = "SOURCE: pinned ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7, components/esp_hal_timg/esp32s31/include/hal/timer_ll.h: _timer_ll_set_clock_source selects XTAL=0, RC_FAST=1, REF_F80M=2; timer_ll_enable_counter and timer_ll_enable_alarm assign their software-writable, hardware-updated bits; timer_ll_set_clock_prescale writes the divisor then resets its divider counter; timer_ll_trigger_soft_capture sets UPDATE and waits for hardware to clear it; timer_ll_set_reload_value (:293-297) writes LOADHI/LOADLO and timer_ll_trigger_soft_reload (:319-322) stores one to LOAD. The stop/load-zero/strobe/start sequence is sourced from this ESP-IDF interface and is unverified on S31; The past-target arming observed in HW7 run03 does not qualify that sequence. timer_ll_set_alarm_value writes ALARMHI/ALARMLO. The T0 fixed configurations select increment, no auto-reload, divider 40 with T_DIVCNT_RST asserted, and independently stopped, counting or armed-counting state. The clock source/gate operations select XTAL and enable T0 independently of reset, APB, T1 and watchdog lanes. These are composed field configurations, not a recovered whole-word store or a silicon frequency measurement."

[[sources]]
id = "HW7_S31_MATRIX_20261026"
description = "SOURCE: s31-a rev0 run hw7-20261026-generic-03, stand lease #815; ermacv/oer-notes research/hw-irq-generic.md, matrix.json tags 0x4010-0x41ff and 0x14010-0x141ff. FROM_CPU2/source67 follows low/high as bank2 bit3=0/1, including while MAP=0. MAP0 leaves CLIC line16 and local IP0 low and admits no handler; binding to line16 exposes pending, repeatedly delivers the unacknowledged level, parking suppresses it, and unpark redelivers. Selected source routes 2/25/33/34/67 inherited MAP=0/PASS_LEVEL=0 after ROM RAM load. PASS_LEVEL writes 0/1/2/3 read back and each delivers the single source to the machine-mode line with NMBITS=0; no S-mode or all-source remap claim. USB2/TIMG25 in bank0 and SYSTIMER33/34 in bank1 were active-high in their separate positive-cause leaves. Hart1 stayed reset and clock gated."

[[sources]]
id = "HW7_S31_USB_20261026"
description = "SOURCE: s31-a rev0 runs hw7-20261026-generic-02 (lease #813) and hw7-20261026-generic-03 (lease #815); ermacv/oer-notes research/hw-irq-generic.md, usb.json. At the first probe observation after the ROM RAM loader, ENA0..15=0, ST=0, RAW=0xb30f. With only IN_EMPTY enabled, RAW bit3/ST bit3/matrix source2 assert and repeated CPU admission delivers without acknowledgement. Enabled CLR removes bit3 and it stays low through the 4096-cycle observation while FIFO availability remains high: FIFO availability alone does not continuously reassert this event. In run03 a bounded host IN reader consumes the probe byte and provides a new positive IN_EMPTY. ENA=0 preserves its RAW while ST/output are low; enabling redelivers. CLR using an enabled ST snapshot retained across ENA=0 removes the pending cause and restoring ENA does not redeliver. All-16 ENA masking silences output despite other RAW causes. Only IN_EMPTY and the tested sequential windows are qualified; no other-cause equation, reset image or collision guarantee."

[[sources]]
id = "HW7_S31_SYSTIMER_20261026"
description = "SOURCE: s31-a rev0 runs hw7-20261026-generic-02 (stand lease #813) and hw7-20261026-generic-04 (stand lease #820); ermacv/oer-notes research/hw-irq-generic.md, systimer0.json and systimer1.json tags 0x6010-0x60f3 and 0x6110-0x6133. Isolated unit0 one-shot comparators 0 and 1 each assert their own RAW/ST/source33/34 and repeatedly deliver without CLR. WORK_EN=0 retains already pending RAW/ST/output. INT_ENA=0 retains RAW, suppresses ST/output, and re-enable redelivers. CLR with WORK_EN=0 clears pending with INT_ENA both 0 and 1; CLR with WORK_EN=1 and INT_ENA both 0 and 1 also clears it. Run04 masks an already-active enabled cause (0x6110), preserves RAW, restores ENA and redelivers (0x6123); masked WORK_EN=1 CLR removes the fresh cause at 0x6130. Tested ST equals RAW AND ENA for these two lanes. One masked CLR followed by programming a target 16 ticks in the past sets RAW by the first observation and delivers after enabling. Final WORK_EN=0/ENA=0/CLR leaves RAW/ST/output low. No all-interleaving no-lost-wakeup or counter-wrap guarantee."

[[sources]]
id = "HW7_S31_TIMG0_20261026"
description = "SOURCE: s31-a rev0 run hw7-20261026-generic-03, stand lease #815; ermacv/oer-notes research/hw-irq-generic.md, timer0.json tags 0x7000-0x70ff. With XTAL selector0, divider40, increasing/no-autoreload T0, count advances 1002 ticks in 40084 measured CPU cycles including capture overhead; nominal XTAL is 40 MHz from the loader, consistent with 1 MHz T0 and this run's 40 MHz CPU. One-shot alarm clears T_ALARM_EN while counter enable remains set; RAW/ST/source25 stay high until CLR and repeat CPU admission delivers. Counter stop preserves pending. ENA=0 retains RAW, suppresses ST/output; re-enable redelivers. CLR at ENA=0 and ENA=1 clears pending; future rearm works. After an explicit zero-RAW control, arming target zero behind the advancing counter sets RAW within the first bounded observation (53 cycles in the subsequent wait) and alarm enable reads cleared. Final stopped counter reads identically twice, ENA/RAW/ST/output are zero and T0 clock is gated. WDTCONFIG0/1/2 match before/after, and watchdog source/gate/IRQ enable plus T1 gate are unchanged. Watchdog IRQ enable was zero; no active-watchdog qualification or other-divider equation."
