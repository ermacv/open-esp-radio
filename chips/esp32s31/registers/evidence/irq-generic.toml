id = "ESP_IDF_4D59230D_S31_TIMER0_LL"
description = "SOURCE: pinned ESP-IDF 4d59230ddff16327812782151ef0afef202dc6d7, components/esp_hal_timg/esp32s31/include/hal/timer_ll.h: _timer_ll_set_clock_source selects XTAL=0, RC_FAST=1, REF_F80M=2; timer_ll_enable_counter and timer_ll_enable_alarm assign their software-writable, hardware-updated bits; timer_ll_set_clock_prescale writes the divisor then resets its divider counter; timer_ll_trigger_soft_capture sets UPDATE and waits for hardware to clear it. The T0 fixed configurations select increment, no auto-reload, divider 40, and independently stopped, counting or armed-counting state. These are composed field configurations, not a recovered whole-word store or a silicon frequency measurement."
