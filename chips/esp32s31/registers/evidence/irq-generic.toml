[[sources]]
id = "ESP_IDF_4D59230D_S31_TIMER0_LL"
description = "SOURCE: pinned ESP-IDF 4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d, components/esp_hal_timg/esp32s31/include/hal/timer_ll.h: _timer_ll_set_clock_source selects XTAL=0, RC_FAST=1, REF_F80M=2; timer_ll_enable_counter and timer_ll_enable_alarm assign their software-writable, hardware-updated bits; timer_ll_set_clock_prescale writes the divisor then resets its divider counter; timer_ll_trigger_soft_capture sets UPDATE and waits for hardware to clear it; timer_ll_set_reload_value (:293-297) writes LOADHI/LOADLO and timer_ll_trigger_soft_reload (:319-322) stores one to LOAD. The stop/load-zero/strobe/start sequence is sourced from this ESP-IDF interface; HW23_S31_TIMG0_RELOAD_20261027 separately confirms the tested S31 transaction. HW7 run03 past-target arming alone does not qualify reload. timer_ll_set_alarm_value writes ALARMHI/ALARMLO. The T0 fixed configurations select increment, no auto-reload, divider 40 with T_DIVCNT_RST asserted, and independently stopped (alarm disabled or enabled), counting or armed-counting state; timer_ll_enable_alarm (:179-182) controls alarm enable independently of timer_ll_enable_counter (:236-239). The running-alarm configuration is the armed-counting state without T_DIVCNT_RST, the word timer_ll_enable_alarm leaves on a counting timer, so re-enabling an alarm keeps the divider phase. The clock source/gate operations select XTAL and enable T0 independently of reset, APB, T1 and watchdog lanes. These are composed field configurations, not a recovered whole-word store or a silicon frequency measurement."

[[sources]]
id = "HW7_S31_MATRIX_20261026"
description = "SOURCE: s31-a rev0 run hw7-20261026-generic-03, stand lease #815; ermacv/oer-notes research/hw-irq-generic.md, matrix.json tags 0x4010-0x41ff and 0x14010-0x141ff. FROM_CPU2/source67 follows low/high as bank2 bit3=0/1, including while MAP=0. MAP0 leaves CLIC line16 and local IP0 low and admits no handler; binding to line16 exposes pending, repeatedly delivers the unacknowledged level, parking suppresses it, and unpark redelivers. Selected source routes 2/25/33/34/67 inherited MAP=0/PASS_LEVEL=0 after ROM RAM load. PASS_LEVEL writes 0/1/2/3 read back and each delivers the single source to the machine-mode line with NMBITS=0; no S-mode or all-source remap claim. USB2/TIMG25 in bank0 and SYSTIMER33/34 in bank1 were active-high in their separate positive-cause leaves. Hart1 stayed reset and clock gated."

[[sources]]
id = "HW7_S31_USB_20261026"
description = "SOURCE: s31-a rev0, hw7-20261026-generic-02/-03 usb.json:first post-loader ENA/ST0, RAW0xb30f, not reset values. IN_EMPTY repeatedly delivers unacked; CLR stays quiet4096cycles despite available FIFO. Fresh host-consumed IN produces positive; mask retainsRAW, reenable redelivers, and retained positive sample clears under mask. All16-enable mask silences output. Only IN_EMPTY/sequential windows, not other-cause equations or collisions. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/irq-generic.toml (source HW7_S31_USB_20261026)."

[[sources]]
id = "HW7_S31_SYSTIMER_20261026"
description = "SOURCE: s31-a rev0, hw7-20261026-generic-02/-04 systimer0/1.json:unit0 one-shot comparators0/1 independently assertRAW/ST/source 33/34. WORK_EN0 retainspending; INT_ENA0 hidesST/output, reenable redelivers. CLR clears at WORK_EN0/1 and ENA0/1; masked CLR then past target16ticks produces newRAW/delivery. Tested ST=RAW&ENA for these lanes only; no universal interleaving/wrap guarantee. Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/irq-generic.toml (source HW7_S31_SYSTIMER_20261026)."

[[sources]]
id = "HW7_S31_TIMG0_20261026"
description = "SOURCE: s31-a rev0, hw7-20261026-generic-03 timer0.json:XTAL/div40, increasing one-shot count agrees nominal1MHz. Expiry clearsALARM_EN but retains counter/pending; stop/mask retainsRAW, reenable redelivers; CLR works at ENA0/1 and future rearm succeeds. Past target0 fires after zeroRAW control. WDT configuration/source/gate/IRQ and T1 gate unchanged; no active-WDT, other-divider or reload qualification (see HW23). Details: oer-notes/evidence/chips-notes/chips/esp32s31/registers/evidence/irq-generic.toml (source HW7_S31_TIMG0_20261026)."
