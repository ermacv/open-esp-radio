id = "BLOB_WIFI_MAC_STALE_CLEAR_FORMS_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. libpp[hal_mac.o]::hal_init+0x30/+0x3a and hal_deinit+0x52/+0x5c mask ENABLE then write CLEAR=0xffffffff. hal_enable_mac+0x12/+0x14 opens core gates and publishes ENABLE without a RAW store. hal_mac_interrupt_clr_event+0x4 stores its argument to CLEAR at 0x20104c4c. libpp[wdev.o]::wDev_ProcessFiq+0x44..0x4c/+0x76..0x80 forwards its saved MAC STATUS to this clear leaf; rom[]::wDev_ProcessFiq+0x4c/+0x76 likewise samples STATUS then stores CLEAR. Masked stale clear and sampled acknowledgement are distinct from disabled-engine RAW-zero publication. No all-lane positive-clear or arrival-priority qualification follows."
