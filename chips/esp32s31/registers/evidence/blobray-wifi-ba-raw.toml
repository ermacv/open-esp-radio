id = "BLOB_WIFI_MAC_RAW_ZERO_STORE_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. libpp[hal_mac.o]::hal_disable_mac (size 0x2c) sets common MAC disable gates at +0x0e, reads ENABLE at +0x14, stores ENABLE=0 at +0x16, stores the complete WIFI_MAC.RAW (0x20104c44) as zero at +0x1e, then INTERRUPT_1_RAW (0x20104c30) as zero at +0x26. No subsequent RAW read or CLEAR store occurs in this leaf. libpp[hal_debug.o]::print_isr_regs+0x0e reads RAW diagnostically. These are publication/order facts, not a reset value, W0C, writable-storage or positive-pending clear contract. Partial indexed/unresolved census observations prevent an exhaustive nonzero-writer absence claim."

