id = "BLOB_WIFI_EXTRA_SOFTAP_BA_CONTROL_LIFECYCLE_20261027"
description = "esp32-wifi-lib@f856b5db55cb18e2d1826044430f3f4089e47cf9, esp32s31/libpp.a SHA-256 4b9cd74b26de88e3964ae02f75446a28be827c166eda120dab11b3f045b77391. esp-rom-elfs@20260528, esp32s31_rev0_rom.elf SHA-256 a52ad7513deb656a910a5740125f1cce2c7941f11ce57213b7b43aea93d5ab87. libpp[hal_ampdu.o]::hal_agreement_add_extra_softap_rx_ba+0x20 selects INDEX preserving bits10/11; +0xc4 publishes those bits zero; +0xd2/+0xda commit and +0xe2 latches. The full control read +0xf2 goes through logging arguments +0xfa to wifi_log+0x11c; +0x128 is also a cited add-lifecycle site. hal_agreement_clr_extra_softap_rx_ba+0x12..0x32, hal_agreement_del_extra_softap_rx_ba+0x28/+0x60..0x68 and rom[]::ic_reset_extra_softap_rx_ba+0x08..0x1a preserve bits10/11 during selection or VALID-clear deletion. hal_debug_read_extra_softap_rx_ba+0x2a..0x3a selects INDEX, +0x5e reads the control for logging at +0x84. No local zero-readback test establishes a live invariant or physical identity."

