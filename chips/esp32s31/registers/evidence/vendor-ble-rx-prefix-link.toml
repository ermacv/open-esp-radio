id = "BXB9_BLE_RX_ASSOCIATION_TAG"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib revision 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical same-chip revision 31c30949541a5d3abd4043a1cb66d55aa55577dd, libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. Current memMgmt_4.o::r_sym_memMgmt_HzBmGkHAh4mavF5QJM0o+0x8c..+0xa4 obtains the packet via header+4 and passes prefix+0x18 low16 to r_sym_memMgmt_i12d5sbSaRnPvHCb07XD+0x00/+0x02/+0x08/+0x0e. The matcher follows link+0x7c, tests configuration byte23 and compares all16 received bits with configuration halfword+24. r_sym_memMgmt_232y4Maqyh8DfDo3KxfV+0x14/+0x16/+0x1c..+0x24 supplies that expected tag from item+0x20 low12. ble_6.o::r_sym_ble_CcSBujbD8nhmAY1yBT4T+0xc4/+0xc8 calls the setter; r_sym_ble_IYA41eW9c6m45QdYupOB+0x116..+0x14a derives item numbers from role limits and index. Historical sm_num_match/sm_num_set use enable byte22 and are not byte-identical current helpers. The low12 projection aliases source numbers differing by4096; it proves neither a time epoch, a hardware event-count wrap, received upper-bit meaning nor uniqueness across reuse. Hardware production and retention remain unqualified."

