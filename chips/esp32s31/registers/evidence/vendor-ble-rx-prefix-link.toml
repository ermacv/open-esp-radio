description = "SOURCE: Blobray, espressif/esp32s31-bt-lib revision 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical same-chip revision 31c30949541a5d3abd4043a1cb66d55aa55577dd, libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. Current ble_62.o::r_sym_ble_Hja67yKHXnf531oCQ6t1+0x00/+0x04/+0x08/+0x14..+0x28 suppresses the all-ones low24 sentinel before selecting bit0. Its unique whole instruction-byte match is historical ble_lll_iso_utils.c.o::r_ble_lll_iso_rx_hbuf_sync_err; this supplies the ISO name, without proving relocated-callee or whole-program equivalence. Current ordinary ble_2.o::r_sym_ble_FIWq8aA22dyZEBUlBzzX+0x2c/+0x4e/+0x54 rejects bits0/9/10, and connection ble_3.o::r_sym_ble_ylR31pPDJz3Z2BiYbLv7+0x2a..+0x48/+0x82/+0x86 rejects0/1/2/4 after sentinel checks. Ordinary physical identity and on-air consequences remain unqualified."

