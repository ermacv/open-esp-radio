id = "BXB9_BLE_CONNECTED_DEVICE_TAG"
description = "SOURCE: Blobray, espressif/esp32s31-bt-lib revision 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. Historical same-chip revision 31c30949541a5d3abd4043a1cb66d55aa55577dd, libble_app.a sha256 ec10a20eaf869f7cd2300100fe54826980525911f8417206af5a0745a9f85f63. Current ble_68.o::r_sym_ble_Jcse7k9ztYevPpDbNxVL+0x06/+0x1e/+0x22/+0x28..+0x32 replaces entry byte1 bit5 (word0 bit13) with argument2 bit0, preserving neighboring bits. Its unique whole instruction-byte match is historical ble_hw.c.o::r_ble_hw_set_connected_dev; relocated-callee and whole-program equivalence are not claimed. Current ble_3.o::r_sym_ble_NlrFwOoukimT9ZVi9DE9+0x19e and r_sym_ble_tPr7egUaNHmqfcieCA5O+0x204 call with argument2=1, while r_sym_ble_eYACQLpxQkuXg27cewZX+0x184 calls with0. Bits12:2 and physical filtering effects remain unresolved."
