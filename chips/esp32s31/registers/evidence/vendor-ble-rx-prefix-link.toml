description = "SOURCE: Blobray, espressif/esp32s31-bt-lib revision 10c507788e9da0993709cf82e405c896561172d8; libble_app.a sha256 e61c5f8b0e558df8c520bcedd78dd8b930c2b61350b08c03430b774275385723. ble_2.o::r_sym_ble_7lsXnox2LxrGG0FmY7qR+0x80..+0xa4 selects RX_PATH[31:28]=0xe. ble_6.o::r_sym_ble_KkAldzIlkQuEkNQp1g6q+0x18c..+0x198/+0x362..+0x372 selects0x4/0xc on different scanner branches. ble_3.o::r_sym_ble_bgOSnaHsEjrTC0mkupqH+0x14..+0x22/+0x48..+0x64/+0x182..+0x18e and dtm_4.o::sym_dtm_7gOGApwmDG1TxZOfQhrh+0x10..+0x1e/+0x60..+0x80/+0xe6..+0xf2 preserve the incoming high nibble in direct link+8 stores. Zero describes a fresh connection/DTM profile image, not an independently established unconditional reset value. Per-bit meanings, complete callee effects and physical behavior remain unknown."

