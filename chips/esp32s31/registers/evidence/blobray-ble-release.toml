id = "BLOB_S31_BLE_NRT_DISPOSITION_20261027"
description = "SOURCE: Blobray symbols/function-records, espressif/esp32s31-bt-lib revision 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6, nrtIsr_1.o r_sym_nrtIsr_kgxM2CJfVperrlVjmB4B+0x4/+0xe samples BT_MAC+0x340/+0x348, +0x16/+0x18 copies both complete saved images to+0x58/+0x64, then+0x28/+0x2e dispatches entry0 of _nrtIsr_linear_broker_flash. No NRT subscriber descriptor is defined in this BLE archive, libbtdm_common.a sha256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0 or libbredr_app.a sha256 08301519c231a02a797c47a69b3eacec2be2f31080581d688a2f749da4f42c80. Corroborating SDK source: ESP-IDF 4d80c1b29aeabc8e735ffc6e1be9bb23e95d1d5d components/bt/controller/esp32s31/btdm_broker.c:790-792 defines the empty NRT node. The common archive member2.o r_sym_bt_OBoFn3bgoHEVQdNFtCsb+0x0/+0x4 bounds the entry index by the node count. This establishes the inspected composition's default sample/ack with no broker callback, not a decoded hardware cause, a positive producer, an ENA-independent RAW view or a route-preserving output-low transaction."
