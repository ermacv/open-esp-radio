id = "BLOB_S31_BLE_IRQ_RELEASE_SCOPE_20261027"
description = "SOURCE: Blobray function-records/register-accesses, espressif/esp32s31-bt-lib revision 7a85006f35f6839ae7ea5adee16e68a757759196; libbtdm_common.a sha256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0, member 8.o. r_sym_bt_1KrVyC4xCx3TSzt0Ukgs+0xc/+0x18 replaces only enable bits selected by 0x8000 at BT_MAC+0x54 and 0x1302 at+0x60 with zero. The separate r_sym_bt_Ak3CRkSbyZRhUlneqclG+0xe/+0x14 replaces only 0x18200000 and 8 with zero. Each leaf preserves all other enable bits in its stores and neither writes task ENA+0x4b4. In libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6, coexIso.c.o_1.o r_sym_coexIso_b24kWhZaxtKURlSMNhS1+0x2c/+0x36/+0x3c/+0x46/+0x4e/+0x54 separately masks bank0 bits0/1/8/13/16 and bank1 bit13 before selected acknowledgements at+0x7e..+0x90. These are explicit software mask scopes, not proof that enables or pending survive an intervening hardware command, or that every listed bit drives output124 or133. No reset value or all-cause output-low equation is established."

