id = "BLOB_S31_BLE_IRQ_COMMAND_CONTEXT_20261027"
description = "SOURCE: Blobray function-records, espressif/esp32s31-bt-lib revision 7a85006f35f6839ae7ea5adee16e68a757759196; libbtdm_common.a sha256 838d19fe086c016d18729255716274b2df6145d01fffec8f6de1648194e7f6d0. Member 7.o r_sym_bt_R9CEh2lOqbDmQQGs1gBe+0x14 conditionally calls interrupt-handle free, then+0x2c/+0x2e stores complete image1 to BT_MAC+0x10/+0x14 before tail-calling the baseline-mask leaf at+0x32. Member 19.o r_sym_bt_aOsjkDNQyOII2OseK6av+0x40 and r_sym_bt_32zs9B7Gv9vHIVpsl2A7+0x70/+0x178 also store image1 to+0x10 in sleep paths. Thus the first command is used outside terminal release. The stores do not reveal either command's internal action, pending effects or NRT output gating."

