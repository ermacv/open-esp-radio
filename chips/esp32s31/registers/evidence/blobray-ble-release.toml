id = "BLOB_S31_BLE_TASK_IRQ_INHERITANCE_20261027"
description = "SOURCE: Blobray function-records, espressif/esp32s31-bt-lib revision 7a85006f35f6839ae7ea5adee16e68a757759196; libble_app.a sha256 e9f0b462e5deaca7da82d91d0cbeaca54d9b3f97e25b033a8597eca72a06ebc6. Member ble_70.o r_sym_ble_nENHlP4KBuQYlFVffaR5+0x26/+0x34 retains only inherited bit17 in BT_MAC+0x4b4; +0x3a writes all ones to the separate task clear+0x4b8. Member scan_2.o brk_sym_scan_b8ogEC3hTjGmqL5oRuyw+0x6/+0x12 clears then enables only task bit14; brk_sym_scan_fd4yzdFac8vdFTlQ4BPA+0xe masks only bit14, preserving bit17 and every other enable in that store. Member ble_75.o sym_ble_xss4cVKBYR7fsD0QQWKv+0x48/+0x54/+0x88 changes the task enable bank using an argument-supplied mask; this is not a fixed bit17 producer. No bit17 event identity, output124/133 relation, pending retention or reset state is established."

