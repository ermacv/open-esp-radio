# The ESP32-S31 vendor blocks `cargo registers import` writes into block
# types (`types/`) and the chip root (`chip.toml`): every block a PAC, HAL,
# platform or firmware consumer uses, from the pinned vendor SVD and the
# pinned ESP-IDF headers (`vendor/artifacts.toml`). A type is the header's
# device layout; an instance is the SVD's peripheral, or the `reg_base.h`
# block for one the SVD lacks.
schema = 1
chip = "esp32s31"
svd = "esp-pacs/esp32s31/svd/esp32s31.base.svd"
esp-idf = "esp-idf"
overlay = "model/strictness.toml"
root = "chip.toml"
types-directory = "types"
evidence = "evidence/imported.toml"
interrupts = "components/soc/esp32s31/include/soc/interrupts.h"
bases = [
    "components/soc/esp32s31/register/soc/reg_base.h",
    "components/soc/esp32s31/include/modem/reg_base.h",
]

[[types]]
name = "CACHE"
description = "The L1 and L2 caches: control, synchronization, preload, lock and the access-fault interrupts."
registers = "components/soc/esp32s31/register/soc/cache_reg.h"
layout = "components/soc/esp32s31/register/soc/cache_struct.h"

[[types.instances]]
name = "CACHE"
svd = "CACHE"
base = "DR_REG_CACHE_BASE"

