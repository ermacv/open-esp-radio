[package]
name = "oer-chips-esp32s31-compose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The ESP32-S31 side of an image's platform over the Espressif staged runtime and executor: the executor's chip binding and the chip's retained fault records"

[features]
## Shared retained Wi-Fi fatal assertion record, reset and next-boot
## reporting; images without Wi-Fi leave it out.
wifi-fault = []
## The shared RF actor's retained tracking fault, reset and next-boot
## reporting; images without the actor leave it out.
radio-fault = []

[dependencies]
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
oer-chips-esp32s31-crypto = { path = "../crypto" }
oer-portable-embassy-time = { path = "../../../portable/embassy/time" }
oer-portable-time = { path = "../../../portable/time" }
oer-chips-family-interrupt-table = { path = "../../family/interrupt-table" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-chips-esp32s31-hal = { path = "../hal" }
oer-chips-family-staged-runtime.workspace = true
oer-portable-memory = { path = "../../../portable/memory" }
oer-portable-trace = { path = "../../../portable/trace" }

# The executor runs on the chip target only.
[target.'cfg(target_arch = "riscv32")'.dependencies]
embedded-io-async = "0.7.0"
oer-chips-family-usb-serial-jtag.workspace = true
oer-portable-embassy-time = { path = "../../../portable/embassy/time" }
oer-chips-esp32s31-phy = { path = "../phy" }
oer-chips-family-interrupt-table = { path = "../../family/interrupt-table" }
oer-chips-family-platform-port = { path = "../../family/platform-port" }
oer-portable-memory = { path = "../../../portable/memory" }
oer-portable-riscv = { path = "../../../portable/riscv" }
oer-portable-time = { path = "../../../portable/time" }
static_cell.workspace = true
oer-chips-family-executor = { path = "../../family/executor", features = ["chip"] }
oer-chips-family-boot = { path = "../../family/boot" }

[lints]
workspace = true

[dev-dependencies]
oer-chips-esp32s31-hal = { path = "../hal", features = ["test-support"] }
