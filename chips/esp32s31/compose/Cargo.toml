[package]
name = "oer-esp32s31-compose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The ESP32-S31 side of an image's platform over the Espressif staged runtime and executor: the executor's chip binding and the chip's retained fault records"

[features]
## Shared retained Wi-Fi fatal assertion record, reset and next-boot
## reporting; images without Wi-Fi leave it out.
wifi-fault = []

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-esp32s31-crypto = { path = "../crypto" }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-espressif-interrupt-table = { path = "../../espressif/interrupt-table" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-esp32s31-hal = { path = "../hal" }
oer-espressif-staged-runtime.workspace = true
oer-memory = { path = "../../../portable/memory" }
oer-trace = { path = "../../../portable/trace" }

# The executor runs on the chip target only.
[target.'cfg(target_arch = "riscv32")'.dependencies]
embedded-io-async = "0.7.0"
oer-espressif-usb-serial-jtag.workspace = true
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-esp32s31-phy = { path = "../phy" }
oer-espressif-interrupt-table = { path = "../../espressif/interrupt-table" }
oer-espressif-platform-port = { path = "../../espressif/platform-port" }
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-time = { path = "../../../portable/time" }
static_cell.workspace = true
oer-espressif-executor = { path = "../../espressif/executor", features = ["chip"] }

[lints]
workspace = true

[dev-dependencies]
oer-esp32s31-hal = { path = "../hal", features = ["test-support"] }
