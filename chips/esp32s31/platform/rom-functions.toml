# Reviewed facts about functions of the ROM that `esp32s31-eco0.x` links the
# images against and that the stack analysis cannot bound from their machine
# code alone: each one's frame (bytes below its entry `sp`) and the functions
# it calls or jumps to.
#
# The analysis checks each address against the symbol of the pinned ROM ELF
# (`esp32s31_rev0_rom.elf`) and requires a summary to agree with the machine
# code wherever the analysis bounds the function itself. Provenance keeps each
# cited function's code fingerprint, so a changed ROM fails until reviewed.

# SOURCE(esp32s31): rev0 ROM `memset` (newlib's RISC-V assembly) never writes
# `sp` and calls nothing. Its two computed transfers stay inside it: `jr
# 0xa(a3)` enters its unrolled byte-store sequence at 15 - (length & 15) stores
# from its end (the length is below 16 on every path to it: `li t1, 15` with
# `bgeu t1, a2`, or `andi a2, a2, 15`), and the `jalr` that keeps `ra` in `t0`
# enters the same sequence for the 1-15 bytes before a 16-byte boundary
# (`andi a5, a4, 15`, nonzero) and returns through `ra`.
[[function]]
name = "memset"
address = 0x2f8220c6
frame = 0
calls = []

# SOURCE(esp32s31): Blobray on the pinned rev0 ROM: no stack adjustment;
# the tail transfer uses rom_cache_internal_table_ptr's autoload-resume
# slot. ROM initialization installs rom_default_cache_internal_table, whose
# slot names the ROM leaf below. The writer review covers the ROM, the
# staged bootstrap/runtime and pinned esp-hal: none replaces this pointer
# or slot. The table is in ROM, so its entries cannot be rewritten.
[[function]]
name = "Cache_Enable_L1_CORE0_ICache"
address = 0x2f8027c6
frame = 0
calls = ["Cache_Resume_L1_CORE0_ICache_Autoload"]

# SOURCE(esp32s31): Blobray on the same ROM: __riscv_save_3 retains 16
# bytes until __riscv_restore_3; no further stack adjustment. The three
# indirect calls use the same unchanged ROM cache table's autoload-suspend
# and freeze-enable/disable slots, with exactly the ROM targets below.
# Save/restore transfers are retained as calls too; their separate frames
# make the resulting bound conservative.
[[function]]
name = "Cache_Suspend_L1_CORE0_ICache"
address = 0x2f8027dc
frame = 16
calls = [
    "__riscv_save_3",
    "__riscv_restore_3",
    "Cache_Suspend_L1_CORE0_ICache_Autoload",
    "Cache_Freeze_L1_ICache0_Enable",
    "Cache_Freeze_L1_ICache0_Disable",
]

# SOURCE(esp32s31): Blobray on the same ROM: __riscv_save_3 retains 16
# bytes, restored by __riscv_restore_3. ROM initialization sets
# rom_spiflash_legacy_funcs to rom_default_spiflash_legacy_funcs; its read
# hook is null. The ROM, staged bootstrap/runtime and pinned esp-hal have
# no writer of that pointer or hook. The non-null branch is therefore not
# taken; the read calls _esp_rom_spiflash_read. Save/restore are retained.
[[function]]
name = "esp_rom_spiflash_read"
address = 0x2f80f1c8
frame = 16
calls = ["__riscv_save_3", "__riscv_restore_3", "_esp_rom_spiflash_read"]

# SOURCE(esp32s31): Blobray on the same ROM: __riscv_save_3 retains 16
# bytes, restored by __riscv_restore_3. All three indirect calls load the
# reset-rw-mode slot of rom_spi_usr_cmd_legacy_funcs. ROM initialization
# installs rom_default_spi_usr_cmd_legacy_funcs, in ROM; its slot names
# esp_rom_spi_reset_rw_mode. No ROM, staged bootstrap/runtime or pinned
# esp-hal writer replaces the pointer. The computed switch stays inside
# this function. Save/restore transfers are retained as well.
[[function]]
name = "esp_rom_spi_set_op_mode"
address = 0x2f811334
frame = 16
calls = ["__riscv_save_3", "__riscv_restore_3", "esp_rom_spi_reset_rw_mode"]

# SOURCE(esp32s31): Blobray on the same ROM: `ets_install_putc1` is `lui a5`,
# one `sw a0` to `_putc1` (0x2f07fa28) and `ret`; `ets_install_putc2` the same
# store to `_putc2` (0x2f07fa24). Neither adjusts `sp` or calls anything.
[[function]]
name = "ets_install_putc1"
address = 0x2f8055a6
frame = 0
calls = []

[[function]]
name = "ets_install_putc2"
address = 0x2f8055b0
frame = 0
calls = []
