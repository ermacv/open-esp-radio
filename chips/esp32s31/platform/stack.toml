schema = 6

# Every linked function without a compiler frame record (`-Z emit-stack-sizes`)
# needs exactly one review there: assembly, vector data or compiler runtime.
coverage_policy = "../../espressif/staged-layout/stack-coverage.toml"

# Reject implicit copies/moves large enough to hide owner graphs or buffers in
# compiler temporaries. The lint is enforced while building the final fat-LTO
# selected runtime image.
max_move_bytes = 4096

# Default PSRAM task allocations, indexed by the platform hart geometry.
# A contained hart has an explicit zero allocation.
default_task_stack_bytes = { 0 = 0x30000, 1 = 0 }

# Each stack is bounded from the function that runs on it from its top: the
# worst-case call chain of that root, from the image's machine code and the
# pinned ROM, must leave the stack's storage `minimum_free_bytes`. A root that
# reaches indirect sites no fact resolves (the executor's task polls, trait
# objects) has a partial bound: it passes with its unresolved sites listed in
# the report, and the part it proves must fit. The same reserves are the
# absolute headroom runtime stack painting holds every exercised workload to.

# `_runtime_start` switches to the top of this stack (`_runtime_stack_bootstrap`)
# and tail-calls `runtime_main`, which runs the boot hart's executor.
[core.0.task_stack]
root = "runtime_main"
bottom_symbol = "__runtime_cpu0_task_stack_bottom"
top_symbol = "__runtime_cpu0_task_stack_top"
minimum_free_bytes = 16384

# The dedicated SRAM interrupt stacks are bounded by the interrupt-stack gate
# against the platform interrupt contract's percentage margin; there is no
# separate fixed free-byte reserve.
# The IRQ sum includes three complete exception entry/handler bounds, from
# staged-runtime::trap::MAX_EXCEPTION_FRAMES and _runtime_exception_frames.
# fatal::reset_platform_once admits one reset attempt; with intact SRAM,
# entry and local mask code, stop/hook reentry plus a reset fault add at most
# two frames above the first. Link-time sizing retains the existing margin.
[core.0.interrupt_stack]

# Secondary harts remain contained by the HAL. The image gate proves no
# linked starter, route or stack allocation admits them.
[core.1.task_stack]
unused = true

[core.1.interrupt_stack]
unused = true

# The bootstrap reset entry installs `_stack_end`..`_stack_start` and enters
# `bootstrap_main` after clearing BSS. The stack analysis starts at that Rust root.
[bootstrap_stack]
root = "bootstrap_main"
bottom_symbol = "_stack_end"
top_symbol = "_stack_start"
minimum_free_bytes = 4096
# The bootstrap jumps to stage two's entry and never uses its stack again;
# the checks verify both facts in the ELFs.
handoff = "_runtime_start"
