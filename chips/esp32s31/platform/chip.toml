# The chip layer of the ESP32-S31's facts: what host tools cannot derive from
# the chip id. It extends the ISA of its harts and the Espressif family; its
# ROM layer (rom-<revision>.toml), module and board (modules/, boards/)
# extend it. Paths follow the id by
# convention, such as registers/<id>.
schema = 2
id = "esp32s31"
extends = ["../../espressif/platform/isa/rv32imafc.toml", "../../espressif/platform/family.toml"]
espflash-chip = "esp32s31"
revisions = ["rev0"]

# What the chip has: its radio bands, Bluetooth modes, IEEE 802.15.4 and
# cores. Differences of address or layout belong in the register model.
[properties]
wifi-bands = ["2g4"]
# BTDM controller (BR/EDR and LE) in the vendor Bluetooth library.
bluetooth = ["le", "br-edr"]
ieee802154 = true
cores = 2

# Where every image lies in flash. The image pipeline encodes the ESP-IDF
# bootloader, the partition table and the OTA selection for these offsets at
# build time; a flash writes the bundle there. `application` and `otadata`
# are the partitions of `partitions` (the image pipeline holds them to it).
[flash]
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
otadata = 0xd000
partitions = "chips/esp32s31/platform/partitions/applications.csv"
# The application image's header: ESP-IDF's bootloader switches the module's
# flash (its size is the module's) to QIO at 80 MHz before it loads the
# bootstrap (the bootstrap then tunes 120 MHz itself). The ROM reads the
# bootloader in DIO.
application-encoding = { mode = "qio", frequency-mhz = 80 }
bootloader-mode = "dio"
# How a written image starts: the writer's hard reset.
start = "reset"

# The staged-boot address map: host tools check images against it, and
# chips/esp32s31/layout generates its LAYOUT, which the linker scripts read,
# from it. The PSRAM's size is the module's; stage two lies in it after the
# bootstrap's probe page (`runtime-psram`).
[memory]
# The internal HP SRAM, the ROM's and the boot chain's reserves at its top
# included; the application's SRAM (`sram`) is the part below what the boot
# chain keeps (`[boot-chain] application-sram-end`).
#
# SOURCE: ESP-IDF 4d59230d `components/soc/esp32s31/include/soc/soc.h:152-155`
# (`SOC_IRAM_LOW`/`SOC_DRAM_LOW 0x2F000000`, `SOC_IRAM_HIGH`/`SOC_DRAM_HIGH
# 0x2F080000`).
internal-sram = { origin = 0x2f000000, length = 0x00080000 }
# The unified 64-MiB Flash XIP instruction/data window.
#
# SOURCE: ESP-IDF 4d59230d `components/soc/esp32s31/include/soc/soc.h:138-141`
# (`SOC_IROM_LOW`..`SOC_IROM_HIGH`, 64 MiB, DROM the same). Two other sources
# state a wider window: esp-metadata's `irom` memory range is
# 0x40000000..0x50000000 (256 MiB), and the PMA entry 15 the ESP-IDF bootloader
# programs covers 512 MiB (`chips/esp32s31/board/README.md`, "Boot state on the
# board"). The host checks treat only these 64 MiB as cached flash.
flash-xip = { origin = 0x40000000, length = 0x04000000 }
# Where the module's PSRAM lies: the start of the cached external RAM aperture.
psram-origin = 0x50000000
# LP RAM (RTC fast memory), which no reset entry initializes.
#
# SOURCE: ESP-IDF 4d59230d `components/esp_system/ld/esp32s31/memory.ld.in`
# (lp_reserved_seg at 0x2E008000 - RESERVE_RTC_MEM).
retained = { origin = 0x2e000000, length = 0x8000 }
# The runtime's task stacks lie in PSRAM.
task-stacks = "psram"

# What each region is. The internal SRAM is instruction and data RAM at one
# address and the radio's DMA window; LP RAM is executable and outside that
# window; flash and PSRAM are reached through the cache, PSRAM outside the
# DMA window.
#
# SOURCE: ESP-IDF 4d59230d `components/soc/esp32s31/include/soc/soc.h:138-144`
# (`SOC_IROM_LOW..SOC_IROM_HIGH` flash, `SOC_EXTRAM_LOW..SOC_EXTRAM_HIGH`
# PSRAM), `:156-159` (`SOC_RTC_IRAM`/`SOC_RTC_DRAM`), `:167-170` (`SOC_DIRAM_*`),
# `:177-178` (`SOC_DMA_LOW 0x2F000000`, `SOC_DMA_HIGH 0x2F080000`).
[memory.attributes]
sram = { executable = true, cached = false, dma = true, retained = false, writable = true }
retained = { executable = true, cached = false, dma = false, retained = true, writable = true }
flash-xip = { executable = true, cached = true, dma = false, retained = false, writable = false }
psram = { executable = true, cached = true, dma = false, retained = false, writable = true }

# What the pinned second-stage bootloader keeps for itself.
[boot-chain]
# The end of ESP-IDF's application memory map, `SRAM_START..SRAM_SEG_END`:
# the application's SRAM ends here. The internal SRAM above it holds the
# ROM's boot stacks and data (rom-rev0.toml).
#
# SOURCE: ESP-IDF 4d59230d `components/esp_system/ld/esp32s31/ld.hp_mem_defs:9`
# (`SRAM_SEG_END 0x2F07AFC0`) and `memory.ld.in:19-23`
# (`SRAM_SIZE = SRAM_SEG_END - SRAM_START`, without the ULP HP-memory reserve).
application-sram-end = 0x2f07afc0
# SOURCE: ESP-IDF 4d59230d
# `components/bootloader/subproject/main/ld/esp32s31/bootloader.memory.ld.in:39-64`
# (usable end 0x2f07afb0 minus the 0x2000 stack, 0x5000 `dram_seg` and 0x7000
# `iram_loader_seg`; asserted as `bootloader_iram_loader_seg_start`).
second-stage-loader-start = 0x2f06cfb0
# ESP-IDF keeps the tail of LP RAM as lp_reserved_seg: the RTC timer data
# (RTC_TIMER_RESERVE_RTC, 24 bytes) + the bootloader's retained data + the
# secure-boot fast-wake digest; the espflash bootloader this platform boots
# through enables neither of the last two.
#
# SOURCE: ESP-IDF 4d59230d `components/esp_system/ld/esp32s31/memory.ld.in`
# (lp_reserved_seg, RESERVE_RTC_MEM).
retained-reserved-tail = 24

# The bootstrap's `Flash::tune_120mhz` needs at least fifteen distinct 4-KiB
# XIP pages.
[staged]
flash-tuning-reference-bytes = 0x1_0000

# The chip's harts and the guard of each one's interrupt stack; the family
# states the rest of the interrupt contract.
[interrupts]
harts = [0, 1]
irq-stack-guard-bytes = { "0" = 4096, "1" = 1024 }

# What releases core 1 from the reset the esp-hal fork holds it in
# (chips/esp32s31/notes/core1-boot.md). An image links none of these unless its
# stack policy declares core 1 used and proves its roots; the image gate
# looks the patterns up among the linked functions. `ipc` is the cross-core
# call, which the fork's `ipc` feature (off in every image) links; no image
# links any of it until the call is typed.
[core-start]
ipc = [
    "esp_hal::interrupt::ipc::*",
    "<esp_hal::interrupt::ipc::*",
]
starters = [
    "*CpuControl*::start_app_core*",
    "*CpuControl*::unpark_core*",
    "*::start_core1*",
]

# The Rust probe images of the vendor comparison (firmware/probes),
# in build order: the artifact role each serves. The Bluetooth probe returns
# with its hooks (chips/esp32s31/notes/open-questions.md).
[[probe]]
role = "rust-artifact"
package = "oer-firmware-probes-esp32s31-radio"

[[probe]]
role = "rust-artifact:wifi-registers"
package = "oer-firmware-probes-esp32s31-register"

# Why the core last reset, which the host reads through JTAG after a power
# cycle: the board lost power only if it reads a power-on reset. The field is
# the platform publication's (chips/esp32s31/registers/publication/platform.toml), with
# its evidence; cause 1 is the power-on reset of ESP-IDF 4d59230d's
# `components/soc/esp32s31/register/soc/lp_clkrst_reg.h`.
[reset-cause]
field = "LP_AON_RESET_CAUSE.HPCORE0_RESET_CAUSE.HPCORE0_RESET_CAUSE"
power-on = 1

