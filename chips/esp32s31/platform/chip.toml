# The chip layer of the ESP32-S31's facts: what host tools cannot derive from
# the chip id. It extends the ISA of its harts and the Espressif family; its
# module and board (modules/, boards/) extend it. Paths follow the id by
# convention, such as registers/<id>.
schema = 2
id = "esp32s31"
extends = ["../../espressif/platform/isa/rv32imafc.toml", "../../espressif/platform/family.toml"]
espflash-chip = "esp32s31"
revisions = ["rev0"]

# What the chip has: its radio bands, Bluetooth modes, IEEE 802.15.4 and
# cores. Differences of address or layout belong in the register model.
[properties]
wifi-bands = ["2g4"]
# BTDM controller (BR/EDR and LE) in the vendor Bluetooth library.
bluetooth = ["le", "br-edr"]
ieee802154 = true
cores = 2

# Where every image lies in flash. The image pipeline encodes the ESP-IDF
# bootloader, the partition table and the OTA selection for these offsets at
# build time; a flash writes the bundle there. `application` and `otadata`
# are the partitions of `partitions` (the image pipeline holds them to it).
[flash]
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
otadata = 0xd000
partitions = "chips/esp32s31/platform/partitions/applications.csv"
# The application image's header: ESP-IDF's bootloader switches the module's
# flash (its size is the module's) to QIO at 80 MHz before it loads the
# bootstrap (the bootstrap then tunes 120 MHz itself). The ROM reads the
# bootloader in DIO.
application-encoding = { mode = "qio", frequency-mhz = 80 }
bootloader-mode = "dio"
# How a written image starts: the writer's hard reset.
start = "reset"

# The staged-boot address map as host tools check images against it: the
# firmware's own copy is chips/esp32s31/layout (LAYOUT), which the linker
# scripts read. The PSRAM's size is the module's; stage two lies in it after
# the bootstrap's probe page (`runtime-psram`).
[memory]
# Application-owned internal SRAM (ESP-IDF's SRAM_START..SRAM_SEG_END).
sram = { origin = 0x2f000000, length = 0x0007afc0 }
# The unified 64-MiB Flash XIP instruction/data window.
#
# SOURCE: ESP-IDF 4d59230d `components/soc/esp32s31/include/soc/soc.h:138-141`
# (`SOC_IROM_LOW`..`SOC_IROM_HIGH`, 64 MiB, DROM the same). Two other sources
# state a wider window: esp-metadata's `irom` memory range is
# 0x40000000..0x50000000 (256 MiB), and the PMA entry 15 the ESP-IDF bootloader
# programs covers 512 MiB (`chips/esp32s31/board/README.md`, "Boot state on the
# board"). The host checks treat only these 64 MiB as cached flash.
flash-xip = { origin = 0x40000000, length = 0x04000000 }
# Where the module's PSRAM lies: the start of the cached external RAM aperture.
psram-origin = 0x50000000
# The runtime's task stacks lie in PSRAM.
task-stacks = "psram"

# The chip's harts and the guard of each one's interrupt stack; the family
# states the rest of the interrupt contract.
[interrupts]
harts = [0, 1]
irq-stack-guard-bytes = { "0" = 4096, "1" = 1024 }

# What releases core 1 from the reset the esp-hal fork holds it in
# (chips/esp32s31/notes/core1-boot.md). An image links none of these unless its
# stack policy declares core 1 used and proves its roots; the image gate
# looks the patterns up among the linked functions. `ipc` is the cross-core
# call, which the fork's `ipc` feature (off in every image) links; no image
# links any of it until the call is typed.
[core-start]
ipc = [
    "esp_hal::interrupt::ipc::*",
    "<esp_hal::interrupt::ipc::*",
]
starters = [
    "*CpuControl*::start_app_core*",
    "*CpuControl*::unpark_core*",
    "*::start_core1*",
]

# The mask ROM the stack analyses read: the pinned ROM ELF
# (chips/esp32s31/vendor/artifacts.toml), the reviewed function summaries
# and the vendor radio ROM no image may call into: the stack and interrupt
# checks fail when a root's walk reaches it.
[rom]
elf = "rom"
summaries = "chips/esp32s31/platform/rom-functions.toml"
forbidden = [
    { name = "eco0-radio-api", start = 0x2f800bf0, end = 0x2f8016bc },
    { name = "eco0-radio-body", start = 0x2f823c12, end = 0x2f83e6d0 },
]

# The Rust probe images of the vendor comparison (firmware/probes),
# in build order: the artifact role each serves. The Bluetooth probe returns
# with its hooks (chips/esp32s31/notes/open-questions.md).
[[probe]]
role = "rust-artifact"
package = "oer-firmware-probes-esp32s31-radio"

[[probe]]
role = "rust-artifact:wifi-registers"
package = "oer-firmware-probes-esp32s31-register"

# Why the core last reset, which the host reads through JTAG after a power
# cycle: the board lost power only if it reads a power-on reset. The field is
# the platform publication's (chips/esp32s31/registers/publication/platform.toml), with
# its evidence; cause 1 is the power-on reset of ESP-IDF 4d59230d's
# `components/soc/esp32s31/register/soc/lp_clkrst_reg.h`.
[reset-cause]
field = "LP_AON_RESET_CAUSE.HPCORE0_RESET_CAUSE.HPCORE0_RESET_CAUSE"
power-on = 1

