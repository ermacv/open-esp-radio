# The facts of the ESP32-S31 that host tools cannot derive from the chip id.
# Paths follow the id by convention, such as registers/<id>.
schema = 1
id = "esp32s31"
# The family whose shared code the chip uses (`platform = "family"` packages).
family = "espressif"
rust-target = "riscv32imafc-unknown-none-elf"
# The ROM loads the ESP-IDF bootloader, which loads firmware/bootstrap/esp32s31;
# the bootstrap stages the runtime into PSRAM.
boot = "staged"
espflash-chip = "esp32s31"
revisions = ["rev0"]

# What the chip has: its radio bands, Bluetooth modes, IEEE 802.15.4 and
# cores. Differences of address or layout belong in the register model.
[properties]
wifi-bands = ["2g4"]
# BTDM controller (BR/EDR and LE) in the vendor Bluetooth library.
bluetooth = ["le", "br-edr"]
ieee802154 = true
cores = 2

# Where every image lies in flash. The image pipeline encodes the ESP-IDF
# bootloader, the partition table and the OTA selection for these offsets at
# build time; a flash writes the bundle there. `application` and `otadata`
# are the partitions of `partitions` (the image pipeline holds them to it).
[flash]
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
otadata = 0xd000
partitions = "chips/esp32s31/platform/partitions/applications.csv"
# The application image's header: ESP-IDF's bootloader switches the board's
# 16-MiB flash to QIO at 80 MHz before it loads the bootstrap (the bootstrap
# then tunes 120 MHz itself). The ROM reads the bootloader in DIO.
application-encoding = { mode = "qio", frequency-mhz = 80, size-mib = 16 }
bootloader-mode = "dio"
# How a written image starts: the writer's hard reset.
start = "reset"

# The staged-boot address map as host tools check images against it: the
# firmware's own copy is chips/esp32s31/layout (LAYOUT), which the linker
# scripts read. Sizes describe the fitted memories.
[memory]
# Application-owned internal SRAM (ESP-IDF's SRAM_START..SRAM_SEG_END).
sram = { origin = 0x2f000000, length = 0x0007afc0 }
# The unified 64-MiB Flash XIP instruction/data window.
flash-xip = { origin = 0x40000000, length = 0x04000000 }
# Cached external RAM aperture of the fitted 16-MiB PSRAM.
psram = { origin = 0x50000000, length = 0x01000000 }
# Stage-two code relocated to PSRAM, after the bootstrap's 64-KiB probe page.
runtime-psram = { origin = 0x50010000, length = 0x00ff0000 }
# The runtime's task stacks lie in PSRAM.
task-stacks = "psram"

# The interrupt contract the interrupt-stack check reads: the staged runtime
# (chips/espressif/staged-runtime) installs these vectors and stacks; the
# chip-neutral symbols are chips/espressif/staged-layout (interrupts.rs).
[interrupts]
table-symbol = "__OER_INTERRUPT_TABLE"
# `Binding<Interrupt, Priority, Cpu>`: source u16 at 0, level u8 at 2, core
# u32 at 4, handler word at 8; fields as [offset, bytes].
table-entry-bytes = 12
table-source = [0, 2]
table-level = [2, 1]
table-core = [4, 4]
table-handler = 8
vector-table-symbol = "_runtime_psram_mtvt_source"
exception-entry-symbol = "_start_trap"
source-table-symbol = "__EXTERNAL_INTERRUPTS"
harts = [0, 1]
# Maximum allocation of each hart's dedicated SRAM interrupt stack.
irq-stack-bytes = 0x8000
irq-stack-guard-bytes = { "0" = 4096, "1" = 1024 }
irq-stack-margin-percent = 10

[[interrupts.level-writers]]
writer = "esp_hal::interrupt::arch::cpu_int::set_priority_raw"
contexts = [
    "esp_hal::interrupt::arch::init_vectoring",
]

[[interrupts.level-writers]]
writer = "esp_hal::interrupt::map_raw"
contexts = [
    "esp_hal::interrupt::setup_interrupts",
    "<esp_hal::interrupt::CoreInterruptRoutes>::enable",
    "<esp_hal::interrupt::CoreInterruptRoutes>::disable",
]

# What releases core 1 from the reset the esp-hal fork holds it in
# (chips/esp32s31/notes/core1-boot.md). An image links none of these unless its
# stack policy declares core 1 used and proves its roots; the image gate
# looks the patterns up among the linked functions. `ipc` is the cross-core
# call, which the fork's `ipc` feature (off in every image) links; no image
# links any of it until the call is typed.
[core-start]
ipc = [
    "esp_hal::interrupt::ipc::*",
    "<esp_hal::interrupt::ipc::*",
]
starters = [
    "*CpuControl*::start_app_core*",
    "*CpuControl*::unpark_core*",
    "*::start_core1*",
]

# The mask ROM the stack analyses read: the pinned ROM ELF
# (chips/esp32s31/vendor/artifacts.toml), the reviewed function summaries
# and the vendor radio ROM no image may call into: the stack and interrupt
# checks fail when a root's walk reaches it.
[rom]
elf = "rom"
summaries = "chips/esp32s31/platform/rom-functions.toml"
forbidden = [
    { name = "eco0-radio-api", start = 0x2f800bf0, end = 0x2f8016bc },
    { name = "eco0-radio-body", start = 0x2f823c12, end = 0x2f83e6d0 },
]

# The staged runtime's placement contract (chips/espressif/staged-layout/linker/runtime
# script): code, data and the CPU0 task stack in PSRAM; interrupt entries,
# vector tables, interrupt stacks, critical code and data, DMA data and the
# panic entry and hook in SRAM; the interrupt table's handlers in SRAM or ROM.
[placement]
name = "psram-code-psram-data-psram-stack"
image = { start = "__runtime_image_start", end = "__runtime_payload_end", origin = "runtime-psram" }
entry = { symbol = "_runtime_start", text = ["__runtime_text_start", "__runtime_text_end"] }
range = [
    { range = ["__runtime_data_start", "__runtime_data_bss_end"], region = "psram" },
    { range = ["__runtime_isr_start", "__runtime_isr_end"], region = "sram" },
    { range = ["__runtime_critical_data_start", "__runtime_critical_bss_end"], region = "sram" },
    { range = ["__runtime_dma_data_start", "__runtime_dma_bss_end"], region = "sram" },
    { range = ["_stack_end", "_stack_start"], region = "psram", bytes = 0x30000 },
    { range = ["__runtime_cpu0_irq_stack_bottom", "__runtime_cpu0_irq_stack_top"], region = "sram", maximum-bytes = 0x8000 },
    { range = ["__runtime_cpu1_irq_stack_bottom", "__runtime_cpu1_irq_stack_top"], region = "sram", maximum-bytes = 0x8000 },
]
symbol = [
    { name = "_start_trap", bytes = 4, region = "sram" },
    { name = "_runtime_psram_irq_entry_{n}", numbers = [1, 47], bytes = 4, region = "sram" },
    { name = "_runtime_psram_mtvt_source", bytes = 192, region = "sram" },
    { name = "_mtvt_table", bytes = 192, region = "sram" },
    { name = "_mtvt_table2", bytes = 192, region = "sram" },
    { name = "__rustc::rust_begin_unwind", bytes = 4, region = "sram" },
    { name = "oer_platform_panic_hook", bytes = 4, region = "sram", optional = true },
]
# Code reachable from an interrupt runs from SRAM or the mask ROM.
interrupt-handlers = ["sram", "rom"]
section = [{ prefix = ".critical", region = "sram" }]
stack-swap = [
    { name = "_start_trap" },
    { name = "_runtime_psram_irq_entry_{n}", numbers = [1, 47] },
]

# The staged boot's host contract: the stage-two header the image build
# packs (chips/espressif/staged-layout stage_two.rs) and the input sections
# the runtime linker script zeroes (zeroed.rs); that none of them carries
# initialized bytes is to be checked by `cargo fw` after the link (planned).
[staged]
zeroed-inputs = [
    ".dram2_uninit.bss", ".dram2_uninit.bss.*", ".dram2_uninit", ".dram2_uninit.*",
    ".rtc_fast.bss", ".rtc_fast.bss.*",
    ".critical.bss", ".critical.bss.*", ".flash.critical.bss", ".flash.critical.bss.*",
    ".dma.bss", ".dma.bss.*",
    ".psram.bss", ".psram.bss.*", ".sbss", ".sbss.*", ".bss", ".bss.*", "COMMON",
]

# The stage-two header: little-endian words; "STG2" magic, the handoff ABI
# version, the header's own size and the payload CRC-32 (computed with its
# field read as zero) at these byte offsets.
[staged.stage-two]
magic = 0x32475453
abi-version = 1
header-bytes = 44
magic-offset = 0
abi-version-offset = 4
header-size-offset = 28
crc-offset = 40

# The Rust probe images of the vendor comparison (firmware/probes),
# in build order: the artifact role each serves. The Bluetooth probe returns
# with its hooks (chips/esp32s31/notes/open-questions.md).
[[probe]]
role = "rust-artifact"
package = "oer-firmware-probes-esp32s31-radio"

[[probe]]
role = "rust-artifact:wifi-registers"
package = "oer-firmware-probes-esp32s31-register"

# Why the core last reset, which the host reads through JTAG after a power
# cycle: the board lost power only if it reads a power-on reset. The field is
# the platform publication's (chips/esp32s31/registers/publication/platform.toml), with
# its evidence; cause 1 is the power-on reset of ESP-IDF 4d59230d's
# `components/soc/esp32s31/register/soc/lp_clkrst_reg.h`.
[reset-cause]
field = "LP_AON_CLKRST.HPCORE0_RESET_CAUSE.HPCORE0_RESET_CAUSE"
power-on = 1

[hil]

[hil.images.system-watchdog]
package = "oer-firmware-hil-esp32s31"
manifest = "firmware/hil/esp32s31/Cargo.toml"
stack-policy = "firmware/hil/esp32s31/stack.toml"

[hil.images.system-panic-reset]
