[package]
name = "oer-chips-esp32s31-platform-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Staged-boot address map of ESP32-S31-Function-CoreBoard-1"

[features]
# Link a binary with the shared linker scripts from a Cargo build script
# (requires std).
build = ["oer-chips-family-platform-layout/build"]

[dependencies]
oer-chips-family-platform-layout = { path = "../../../family/platform/layout" }

[build-dependencies]
oer-chips-family-facts = { path = "../../../family/facts" }

[dev-dependencies]
oer-chips-family-facts = { path = "../../../family/facts" }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["build"]
