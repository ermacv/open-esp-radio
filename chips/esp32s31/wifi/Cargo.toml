[package]
name = "oer-esp32s31-wifi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "ESP32-S31 station facade over the portable runtime and S31 backend"

[dependencies]
embassy-futures = "0.1.2"
zeroize = { version = "1.8.1", default-features = false }
oer-sync = { path = "../../../portable/sync" }
heapless = { version = "0.9.3", features = ["zeroize"] }
static_cell.workspace = true
bytemuck = { version = "1.25.2", features = ["derive"] }
oer-crypto = { path = "../../../portable/crypto" }
oer-ieee80211-rsn = { path = "../../../protocols/ieee80211/rsn" }
oer-network = { path = "../../../protocols/network" }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime", features = ["placement"] }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port" }
oer-radio-port = { path = "../../../protocols/radio/port" }
oer-ieee80211-arbiter = { path = "../../../protocols/ieee80211/arbiter" }
oer-espressif-ieee80211-policy = { path = "../../../chips/espressif/ieee80211-policy" }
oer-espressif-coex = { path = "../../../chips/espressif/coex" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-time = { path = "../../../portable/time" }
oer-ieee80211-instrumentation = { path = "../../../protocols/ieee80211/instrumentation" }
oer-trace = { path = "../../../portable/trace" }
oer-memory = { path = "../../../portable/memory" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-espressif-radio = { path = "../../espressif/radio" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose", features = ["wifi-fault"] }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
oer-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client" }
oer-esp32s31-radio-system = { path = "../../../chips/esp32s31/radio/system" }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver" }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["port-slots"] }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-embassy-time = { path = "../../../portable/embassy/time" }

[dev-dependencies]
oer-espressif-radio = { path = "../../espressif/radio" }
oer-esp32s31-hal = { path = "../hal" }
oer-esp32s31-phy = { path = "../phy" }
oer-esp32s31-radio-client = { path = "../radio/client" }
oer-esp32s31-ieee80211-driver = { path = "../ieee80211/driver" }

oer-memory = { path = "../../../portable/memory", features = ["host-context"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }

[lints]
workspace = true
