[package]
name = "oer-chips-esp32s31-radio-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Allocation-free Rust ESP32-S31 PHY state machines"

[features]
radio-health = []

[dependencies]
oer-chips-family-radio-phy = { path = "../../../family/radio/phy" }
oer-chips-family-drivers-regi2c = { path = "../../../family/drivers/regi2c" }
oer-portable-diagnostics = { path = "../../../../portable/diagnostics" }
oer-portable-time = { path = "../../../../portable/time" }
oer-portable-cooperate = { path = "../../../../portable/cooperate" }
oer-portable-memory = { path = "../../../../portable/memory" }
oer-chips-family-platform-interrupt-table = { path = "../../../family/platform/interrupt-table" }
pin-project-lite = "0.2.17"
oer-chips-esp32s31-hal = { path = "../../hal" }

[dev-dependencies]
oer-chips-family-platform-interrupt-table = { path = "../../../family/platform/interrupt-table", features = ["host-signal"] }
oer-portable-time-virtual = { path = "../../../../portable/time-virtual" }
oer-chips-esp32s31-hal = { path = "../../hal", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
