[package]
name = "oer-esp32s31-radio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ESP32-S31 radio system's client contract: membership cells, PHY membership typestate, RF epochs and the LP clock"

[features]
# Host-test construction of cells outside the one static claim.
test-support = []
bluetooth = ["dep:oer-bluetooth-le-radio", "oer-esp32s31-hal/bluetooth-engine"]

[dependencies]
oer-bluetooth-le-radio = { path = "../../../../protocols/bluetooth/le/radio", optional = true }
oer-memory = { path = "../../../../portable/memory" }
oer-radio-regulatory = { path = "../../../../protocols/radio/regulatory" }
oer-time = { path = "../../../../portable/time" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-phy = { path = "../../phy" }
oer-ieee80211-wire = { path = "../../../../protocols/ieee80211/wire" }

[dev-dependencies]
embassy-futures = "0.1.2"
oer-esp32s31-hal = { path = "../../hal", features = ["test-support"] }

[lints]
workspace = true
