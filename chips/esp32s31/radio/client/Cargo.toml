[package]
name = "oer-chips-esp32s31-radio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "The ESP32-S31 radio system's client contract: membership cells, PHY membership typestate, RF epochs and the LP clock"

[features]
# Host-test construction of cells outside the one static claim.
test-support = []
bluetooth = ["dep:oer-protocols-bluetooth-le-port", "oer-chips-esp32s31-hal/bluetooth-engine"]

[dependencies]
oer-protocols-bluetooth-le-port = { path = "../../../../protocols/bluetooth/le/port", optional = true }
oer-portable-memory = { path = "../../../../portable/memory" }
oer-protocols-radio-regulatory = { path = "../../../../protocols/radio/regulatory" }
oer-portable-time = { path = "../../../../portable/time" }
oer-chips-esp32s31-hal = { path = "../../hal" }
oer-chips-esp32s31-radio-phy = { path = "../phy" }
oer-portable-diagnostics = { path = "../../../../portable/diagnostics" }
oer-protocols-ieee80211-wire = { path = "../../../../protocols/ieee80211/wire" }
oer-protocols-ieee80211-contracts-port = { path = "../../../../protocols/ieee80211/contracts/port" }

[dev-dependencies]
oer-chips-esp32s31-hal = { path = "../../hal", features = ["test-support"] }

[lints]
workspace = true
