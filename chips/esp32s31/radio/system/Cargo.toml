[package]
name = "oer-esp32s31-radio-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The ESP32-S31 radio system: one actor that owns the shared RF front-end"

[features]
# The registration's diagnostics in `PhyPreparation::Registered`.
registration-diagnostics = ["oer-esp32s31-radio-client/registration-diagnostics"]

[dependencies]
embassy-futures = "0.1.2"
oer-base-time = { path = "../../../../portable/base/time" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-ieee80211-mac = { path = "../../ieee80211/mac" }
oer-esp32s31-phy = { path = "../../phy" }
oer-esp32s31-radio-client = { path = "../client" }
oer-ieee80211-mac = { path = "../../../../portable/ieee80211/mac" }

[dev-dependencies]
oer-esp32s31-radio-client = { path = "../client", features = ["test-support"] }
oer-esp32s31-hal = { path = "../../hal", features = ["test-support"] }
oer-base-time-virtual = { path = "../../../../portable/base/time-virtual" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
