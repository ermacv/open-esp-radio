# The single pin of every ESP32-C5 vendor artifact this repository compares
# against.
#
# Each artifact names its upstream source and SHA-256. A fetch places every
# artifact at `target/vendor/<source>/<revision>/<path>` and verifies it;
# every comparison authenticates its inputs against this file. The library
# revisions are the submodules of the pinned ESP-IDF revision, which are the
# same PHY, Wi-Fi and coexistence revisions the ESP32-S31 pin uses. Historical
# hashes in reviewed register evidence record the artifact a fact was
# observed in; they are not pins.
schema = 1

