# Words that a typed block or a write transaction of the ESP32-C5 radio PAC
# and pinned esp-hal both store to, with how the two writers are kept from
# racing. `cargo registers check shared-words` finds the shared words from
# policy/api.toml (every declared word of a typed block counts),
# published/radio.svd, the pinned esp-hal sources with the clock and reset
# writers of its esp-metadata-generated file (peripheral aliases such as
# SYSTEM = PCR resolved) and the platform PAC sources, and
# fails on a shared word without an entry or an entry for a word no longer
# shared. Reviewed against esp-hal 1f646c5.
#
# On the ESP32-C5 the radio handoff does not keep esp-hal's analog-I2C,
# ADC, TSENS, sleep or interrupt-mapping paths away by type: they use
# `regs()` or singletons the handoff does not consume. Each entry names
# the lifecycle or the missing caller that separates the writers.
#
# coordination:
#   shared-lock           both writers store only under the named lock
#   disjoint-lifecycle    esp-hal stores only where no radio owner exists
#   unreached-esp-hal-path  esp-hal's storing function has no caller here
#   unreached-radio-writer  the radio PAC's writer has no caller; esp-hal alone writes
#   whole-word-stores     both sides store whole words, no read-modify-write
#   radio-reads-only      the radio view is read-only in the publication and no
#                         API transaction stores to it (checked); esp-hal alone writes
schema = 1

[[word]]
address = 0x6000e000
radio = "APB_SARADC_RADIO.CTRL"
esp_hal = "APB_SARADC.ctrl in init_hardware (analog/adc/dig_ctrl.rs)"
coordination = "unreached-esp-hal-path"
reason = "Only the one-shot ADC driver stores it: Adc::<ADC1>::new and AdcConfig::adc_calibrate reach init_hardware (esp-hal 1f646c5 analog/adc/dig_ctrl.rs); the C5 does not self-calibrate at init (SUPPORTS_SELF_CALIBRATION is false for esp32c5) and no C5 image constructs an Adc or calls adc_calibrate. adc_calibrate needs no singleton, so only the missing caller keeps it away."

[[word]]
