[[peripherals]]
name = "FROM_CPU_0"
description = """
Software interrupt line 0 (interrupt source FROM_CPU_INTR0): one level bit a
store of one raises and a store of zero lowers. Wakers raise it from every
context and the line's handler lowers it, so it is a shared block whose one
register is stored whole."""
baseAddress = 0x600c5090

[[peripherals.registers]]

[peripherals.registers.register]
name = "LINE"
description = "The level of software interrupt line 0."
addressOffset = 0x0
size = 32
access = "read-write"
resetValue = 0x0

[[peripherals.registers.register.fields]]
name = "RAISED"
description = "One raises the line's interrupt; zero lowers it."
bitOffset = 0
bitWidth = 1

