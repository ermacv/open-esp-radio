schema = 2

[[peripherals]]
name = "WIFI_MAC_INTERRUPT"
description = """
Wi-Fi MAC interrupt mask, masked status and write-to-clear aperture.
        The two complete hal_mac leaves independently prove the status and
        clear addresses. The recovered common FIQ and cold initializer prove
        the event-bit mapping and mask transaction used by the open ISR."""
baseAddress = 0x600A4C40

[[peripherals.registers]]

[peripherals.registers.register]
name = "ENABLE"
description = "Complete hal_init first publishes 0x19a879e0 here before its remaining tail. Complete hal_enable_mac independently publishes its argument after clearing the shared MAC disable gates. The common FIQ samples it with each interrupt status snapshot."
addressOffset = 0x0
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "BITS_0_4_OPAQUE"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 0
bitWidth = 5

[[peripherals.registers.register.fields]]
name = "RX_ASSOCIATED_AUXILIARY_5"
description = "Enable for the status bit observed together with RX_SUCCESS during sustained receive traffic."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_6_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TX_COMPLETE"
description = "Enable for the TX-complete event."
bitOffset = 7
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BSS_COLOR_COLLISION"
description = "Enable for the HE BSS-color collision event."
bitOffset = 8
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_9_10_OPAQUE"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 9
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "WATCHDOG"
description = "Enable for the MAC watchdog event."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_12_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 12
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_13_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 13
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RX_SUCCESS"
description = "Enable for successful receive completion."
bitOffset = 14
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "STA_BEACON_FILTER"
description = "Enable for the station beacon-filter event; the complete disable leaf clears this bit after disabling the filter hardware."
bitOffset = 15
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_16_18_OPAQUE"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 16
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "TX_TIMEOUT"
description = "Enable for the hardware TX queue timeout/abort event."
bitOffset = 19
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_20_OPAQUE"
description = "Interrupt-enable bit whose event identity remains unknown."
bitOffset = 20
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_21_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 21
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_22_OPAQUE"
description = "Interrupt-enable bit whose event identity remains unknown."
bitOffset = 22
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_23_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RX_ASSOCIATED_AUXILIARY_24"
description = "Enable for the status bit observed together with RX_SUCCESS during sustained receive traffic."
bitOffset = 24
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_25_26_OPAQUE"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 25
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "BIT_27_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 27
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_28_OPAQUE"
description = "Unknown event enabled by the complete cold receive mask."
bitOffset = 28
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_29_31_OPAQUE"
description = "Interrupt-enable bits whose event identities remain unknown."
bitOffset = 29
bitWidth = 3

[[peripherals.registers]]

[peripherals.registers.register]
name = "RAW"
description = "Unmasked WDEV interrupt snapshot read by print_isr_regs. Complete hal_disable_mac writes zero after masking ENABLE."
addressOffset = 0x4
size = 32
access = "read-write"

[[peripherals.registers.register.fields]]
name = "EVENTS"
bitOffset = 0
bitWidth = 32

[peripherals.registers.register.fields.writeConstraint.range]
minimum = 0x0
maximum = 0xFFFFFFFF

[[peripherals.registers]]

[peripherals.registers.register]
name = "STATUS"
description = "Masked MAC event snapshot read by the complete hal_mac_interrupt_get_event leaf. Its bit geometry matches the complete ENABLE event bank; only independently recovered event identities are named semantically."
addressOffset = 0x8
size = 32
access = "read-only"

[[peripherals.registers.register.fields]]
name = "BITS_0_4_OPAQUE"
description = "Masked event bits whose identities remain unknown."
bitOffset = 0
bitWidth = 5

[[peripherals.registers.register.fields]]
name = "RX_ASSOCIATED_AUXILIARY_5"
description = "Enabled by the cold MAC mask 0x19a879e0 and observed asserted with RX_SUCCESS throughout sustained HE20 receive traffic. Complete libpp[wdev.o]::wDev_ProcessFiq acknowledges this bit as part of the full STATUS image but does not dispatch independent work for it. Its hardware meaning and independent transition rules remain unknown; software must not treat it as RX ownership or work multiplicity."
bitOffset = 5
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_6_OPAQUE"
description = "Masked event bit enabled by the complete cold receive mask; its event identity remains unknown."
bitOffset = 6
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "TX_COMPLETE"
description = "At least one hardware TX queue completed."
bitOffset = 7
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BSS_COLOR_COLLISION"
description = "HE BSS-color collision event."
bitOffset = 8
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_9_10_OPAQUE"
description = "Masked event bits whose identities remain unknown."
bitOffset = 9
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "WATCHDOG"
description = "MAC watchdog event cleared by the complete dedicated leaf."
bitOffset = 11
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_12_OPAQUE"
description = "Masked event bit enabled by the complete cold receive mask; its event identity remains unknown."
bitOffset = 12
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_13_OPAQUE"
description = "Masked event bit enabled by the complete cold receive mask; its event identity remains unknown."
bitOffset = 13
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RX_SUCCESS"
description = "Successfully received frame is ready for the RX completion path."
bitOffset = 14
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "STA_BEACON_FILTER"
description = "Masked station beacon-filter event. The paired ENABLE field identity is recovered from the complete disable leaf; no task-side dispatch is claimed here."
bitOffset = 15
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_16_18_OPAQUE"
description = "Masked event bits whose identities remain unknown."
bitOffset = 16
bitWidth = 3

[[peripherals.registers.register.fields]]
name = "TX_TIMEOUT"
description = "Hardware TX queue timeout/abort event."
bitOffset = 19
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_20_OPAQUE"
description = "Masked event bit whose identity remains unknown."
bitOffset = 20
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_21_OPAQUE"
description = "Masked event bit enabled by the complete cold receive mask; its event identity remains unknown."
bitOffset = 21
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_22_OPAQUE"
description = "Masked event bit whose identity remains unknown."
bitOffset = 22
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BIT_23_OPAQUE"
description = "Masked event bit enabled by the complete cold receive mask; its event identity remains unknown."
bitOffset = 23
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "RX_ASSOCIATED_AUXILIARY_24"
description = "Enabled by the cold MAC mask 0x19a879e0 and observed asserted with RX_SUCCESS throughout sustained HE20 receive traffic. Complete libpp[wdev.o]::wDev_ProcessFiq acknowledges this bit as part of the full STATUS image but does not dispatch independent work for it. Its hardware meaning and independent transition rules remain unknown; software must not treat it as RX ownership or work multiplicity."
bitOffset = 24
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_25_26_OPAQUE"
