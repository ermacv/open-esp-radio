schema = 2

[[peripherals]]
name = "INTERRUPT_CORE0"
description = """
The interrupt-matrix route words of core 0, one per peripheral source, by source
number. Source 12 (ZB_MAC) is left out: its route word belongs to the
IEEE 802.15.4 view IEEE802154_INTERRUPT_ROUTE, so the routes are two arrays
around it."""
baseAddress = 0x60010000

[[peripherals.registers]]

[peripherals.registers.register]
dim = 12
dimIncrement = 0x4
name = "MAP_LOW%s"
description = "Route of source %s (sources 0 to 11)."
addressOffset = 0x0
size = 32
access = "read-write"
reserved = { mask = 0xfffffec0, sources = ["ESP_IDF_4D59230D_C5_INTERRUPT_MATRIX"] }
resetValue = 0x0

[[peripherals.registers.register.fields]]
name = "MAP"
description = "The CPU interrupt line the source is routed to; zero routes it nowhere."
bitOffset = 0
bitWidth = 6

[[peripherals.registers.register.fields]]
name = "PASS_IN_SEC"
description = "The PASS_IN_SEC flag of the source."
bitOffset = 8
bitWidth = 1

[[peripherals.registers]]

[peripherals.registers.register]
dim = 71
dimIncrement = 0x4
name = "MAP_HIGH%s"
description = "Route of source 13 + %s (sources 13 to 83)."
addressOffset = 0x34
size = 32
access = "read-write"
reserved = { mask = 0xfffffec0, sources = ["ESP_IDF_4D59230D_C5_INTERRUPT_MATRIX"] }
resetValue = 0x0

[[peripherals.registers.register.fields]]
name = "MAP"
description = "The CPU interrupt line the source is routed to; zero routes it nowhere."
bitOffset = 0
bitWidth = 6

[[peripherals.registers.register.fields]]
name = "PASS_IN_SEC"
description = "The PASS_IN_SEC flag of the source."
bitOffset = 8
bitWidth = 1

[[peripherals]]
name = "INTERRUPT_CORE0_STATUS"
description = """
The pending state of every peripheral source at core 0's interrupt matrix.
Every context polls it, so it is a shared block of side-effect-free reads."""
baseAddress = 0x60010150

[[peripherals.registers]]

[peripherals.registers.register]
name = "INT_STATUS_0"
description = "Pending state of sources 0 to 31, one bit each."
addressOffset = 0x0
size = 32
access = "read-only"
resetValue = 0x0

[[peripherals.registers.register.fields]]
name = "SOURCES"
description = "Bit k is set while source 0 + k raises its interrupt."
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "INT_STATUS_1"
description = "Pending state of sources 32 to 63, one bit each."
addressOffset = 0x4
size = 32
access = "read-only"
resetValue = 0x0

[[peripherals.registers.register.fields]]
name = "SOURCES"
description = "Bit k is set while source 32 + k raises its interrupt."
bitOffset = 0
bitWidth = 32

[[peripherals.registers]]

[peripherals.registers.register]
name = "INT_STATUS_2"
description = "Pending state of sources 64 to 83, one bit each."
addressOffset = 0x8
size = 32
access = "read-only"
resetValue = 0x0

[[peripherals.registers.register.fields]]
name = "SOURCES"
description = "Bit k is set while source 64 + k raises its interrupt."
bitOffset = 0
bitWidth = 20

