schema = 2

[[peripherals]]
name = "IEEE802154_INTERRUPT_ROUTE"
description = """
The CPU interrupt-matrix word for ESP32-C5 modem source 12 (ZB_MAC). This
source-specific view is retained with the IEEE 802.15.4 owner and publishes
only the generated field readers needed to prove that a polled or validation
transaction starts with the CPU route detached."""
baseAddress = 0x60010030

[[peripherals.registers]]

[peripherals.registers.register]
name = "CORE0_ROUTE"
description = "Destination and security routing for ZB_MAC."
addressOffset = 0x000
size = 32
access = "read-write"
resetValue = 0

[[peripherals.registers.register.fields]]
name = "MAP"
description = "CPU-interrupt destination selected for the peripheral source."
bitOffset = 0
bitWidth = 6

[[peripherals.registers.register.fields]]
name = "BITS_6_7_OPAQUE"
description = "Bits the vendor declares reserved, retained solely so reset-state observation cannot erase an unexpected nonzero value."
bitOffset = 6
bitWidth = 2

[[peripherals.registers.register.fields]]
name = "PASS_IN_SEC"
description = "Secure-world pass-through selection for the peripheral source."
bitOffset = 8
bitWidth = 1

[[peripherals.registers.register.fields]]
name = "BITS_9_31_OPAQUE"
description = "Bits the vendor declares reserved, retained solely so reset-state observation cannot erase an unexpected nonzero value."
bitOffset = 9
bitWidth = 23

