[[peripherals.registers]]
[peripherals.registers.register]
name = "CLK_EN"
description = "Clock gates of the low-power peripherals. The word is shared with the LP UART, LP IO, LP I2C, eFuse and LP CPU gates; only the generator's gate is described, and every change keeps the other bits."
addressOffset = 0x00
size = 32
access = "read-write"
resetValue = 0x7f000000
reserved = { mask = 0x00ffffff, sources = ["ESP_IDF_4D59230D_C5_LPPERI_RNG"] }

