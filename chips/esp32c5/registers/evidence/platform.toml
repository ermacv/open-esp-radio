id = "ESP_IDF_4D59230D_C5_PCR_TIMG1"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32c5/register/soc/pcr_reg.h sha256 050c5eabe196672c096e7dd74b8ace4c95eb60ac00e7357c96d6e5b082341d5b (lines 673-752): TIMERGROUP1_CONF at DR_REG_PCR_BASE + 0x60 with TG1_CLK_EN 0 (reset one), TG1_RST_EN 1, TG1_WDT_READY 2 (RO, reset one), TG1_TIMER0_READY 3 and TG1_TIMER1_READY 4 (RO); TIMERGROUP1_WDT_CLK_CONF at + 0x68 with TG1_WDT_CLK_SEL 21:20 and TG1_WDT_CLK_EN 22 (reset one). reg_base.h sets DR_REG_PCR_BASE 0x60096000. mwdt_ll.h selects the watchdog clock through TG1_WDT_CLK_SEL (0 XTAL) and enables it through TG1_WDT_CLK_EN."
