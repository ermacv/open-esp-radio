# Reviewed register evidence: platform.
schema = 1

[[sources]]
id = "C5_REG_BASE"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/reg_base.h, sha256 b71b182aedcd6b4bb4d4878f5387b5541cd4c3ff511a17ad3c2a8e46cb660233. It names DR_REG_MODEM0_BASE as 0x600A0000 and IEEE802154_REG_BASE as 0x600A3000."

[[sources]]
id = "ESP_IDF_4D59230D_C5_IEEE802154_STRUCT"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/ieee802154_struct.h, sha256 cd2f8f9bc6718a285275b88a4c3785ec366d3c4bb159dfdfe50c7ed30e4bd5cc. The public volatile esp_ieee802154_t declaration fixes register and field geometry through offset 0x184, but its TODO ZB-93 says the file still awaits generation from IEEE802154.csv; it therefore supports a selective partial model. Against the ESP32-S31 struct at the same commit it declares a seven-bit frequency code, a five-bit power code, thirteen events, four-bit TX/RX and ACK PTI fields at bits 3:0 and 7:4, no receive current-channel index and no upper-half diagnostic counters."

[[sources]]
id = "ESP_IDF_4D59230D_C5_IEEE802154_REG"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/ieee802154_reg.h, sha256 28051ca940282680697130f980126e6bfa5a804672b2ffbf6c2a1fe5b3d84269. The public register macros independently restate the selected offsets and masks with the same TODO ZB-93; they are corroboration for selected geometry only."

[[sources]]
id = "esp-idf-4d59230d-ieee802154-common-ll"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hal_ieee802154/include/hal/ieee802154_common_ll.h, sha256 ba4ce294b402df311f25c4d0ce9cb33449e3eb41993aff94a25df5a66142d471. Public inline accessors prove the selected software read/write directions, command/event values and field use; they do not establish reset values or semantics for untouched fields. The ESP32-C5 extension https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hal_ieee802154/esp32c5/include/hal/ieee802154_ll.h, sha256 c369a2418ddd61cc65d536ab288ceb0fa78970abd91106be0b2a0f4ee3ad9cd1, adds no register accessor."

[[sources]]
id = "ESP_IDF_4D59230D_IEEE802154_DRIVER_ETM"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/ieee802154/driver/esp_ieee802154_util.c sha256 e1a012d5f359e2445128977e82a304ba94c100c2994729e062e26586596df38a and components/ieee802154/driver/esp_ieee802154_dev.c sha256 9aaccfa2832cb89bfdfd98086a984269e621400a272b02926c4e088d16222830. ieee802154_etm_channel_clear reads the modem ETM channel-enable word and, only when the channel bit is set, reads the clear word and writes it back with that bit added; ieee802154_etm_set_event_task clears the channel, writes the complete event and task words at the channel stride and reads the set word and writes it back with the channel bit added. The driver programs channel zero from TIMER0 overflow to TX_START or ED_TRIG_TX and channel one from TIMER1 overflow to RX_START. The ESP32-C5 ieee802154_reg.h (https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/ieee802154_reg.h) places ETM_REG_BASE at 0x600A8800, the set and clear words at +0x4 and +0x8, CH0 event and task at +0x18 and +0x1c with an eight-byte stride, and names events TIMER1_OVERFLOW 58 and TIMER0_OVERFLOW 59 and tasks ED_TRIG_TX 65, RX_START 66 and TX_START 69."

[[sources]]
id = "ESP_IDF_4D59230D_C5_INTERRUPT_SOURCES"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/soc/esp32c5/include/soc/interrupts.h, sha256 b9c461a3a6a86e77ba2ee0f8db999dc75f098bae31aa4f8ade0fcf7a070def00. The hardware source table assigns ETS_ZB_MAC_INTR_SOURCE to 12."

[[sources]]
id = "ESP_PACS_5CD68D2_C5_INTERRUPT_MATRIX"
description = "Official esp-rs/esp-pacs commit 5cd68d2, https://github.com/esp-rs/esp-pacs/blob/5cd68d2/esp32c5/src/lib.rs publishes INTERRUPT_CORE0 at 0x60010000; esp32c5/src/interrupt_core0.rs sha256 265966e91e656261ca8dccef1115c84d26de056bd61589e27e1cb344c688293a places 84 source-indexed CORE_0_INTR_MAP words at four-byte stride, so source 12 resolves to offset 0x30; interrupt_core0/core_0_intr_map.rs sha256 da2da18dc58eabd5f07f84974e8bd39b4b5ba44774e550344aa77d3f7e9a45bf exposes MAP at bits 5:0 and PASS_IN_SEC at bit 8 with a zero reset value."

[[sources]]
id = "ESP_IDF_4D59230D_C5_MODEM_SYSCON_STRUCT"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/modem_syscon_struct.h sha256 5310ec5a02347b25f955b2fc3604df63ed392a8889591a92e4733efd5d851c04 and https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/modem_syscon_reg.h sha256 94cc7ea3d2acc5fcdd87eef5967cabdbaa12cdc625559d4f388179b9a2886ddf. The struct places CLK_CONF at 0x4, MODEM_RST_CONF at 0x10 and CLK_CONF1 at 0x14 by declaration order; CLK_ETM_EN, CLK_ZB_APB_EN, CLK_ZBMAC_EN and CLK_MODEM_SEC_APB_EN at CLK_CONF bits 22, 23, 24 and 28; RST_ZBMAC_APB and RST_ZBMAC at MODEM_RST_CONF bits 23 and 24; CLK_BT_APB_EN and CLK_BTBB_EN at CLK_CONF1 bits 16 and 17. The register header restates the same offsets and bits as read-write and gives field defaults that compose to reset images 0x00200002, 0 and 0. https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/reg_base.h sha256 b80d3594c383afaf2566820ed0ce729a1dccd8d8f36e5906665105fb15f5b17f names DR_REG_MODEM_SYSCON_BASE 0x600A9C00 and DR_REG_MODEM_LPCON_BASE 0x600AF000."

[[sources]]
id = "ESP_IDF_4D59230D_C5_MODEM_SYSCON_POWER_ST_RESET"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7, components/soc/esp32c5/include/modem/modem_syscon_reg.h lines 259-301 (https://github.com/espressif/esp-idf/blob/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/modem_syscon_reg.h#L259-L301), the same pinned header identified by ESP_IDF_4D59230D_C5_MODEM_SYSCON_STRUCT. CLK_CONF_POWER_ST is at MODEM_SYSCON + 0x0c. Its six four-bit clock state-map fields occupy bits 31:8 and each has default zero, establishing reset value 0 with known-mask 0xffffff00. No reset value is established for bits 7:0; no whole-word reset image is inferred."

[[sources]]
id = "ESP_IDF_4D59230D_C5_MODEM_LPCON_STRUCT"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/modem_lpcon_struct.h sha256 3b31903e3e6b858fef0203ee6f6ab9f9b99bb81ceec5b0285b25dbc96b83c508 places CLK_CONF at 0x18 by declaration order with CLK_COEX_EN at bit 1 and CLK_I2C_MST_EN at bit 2, and CLK_CONF_POWER_ST at 0x20 with CLK_I2C_MST_ST_MAP at bits 27:24; https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/modem_lpcon_reg.h sha256 0c361db253cb8d729471a907ed9a4435cc02de973c7e119e62b0d24e59e1076e restates those offsets and fields as read-write with reset images 0."

[[sources]]
id = "ESP_IDF_4D59230D_C5_MODEM_CLOCK"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hw_support/modem/port/esp32c5/modem_clock_impl.c sha256 86a6699e04ef19b222c62ed47bf76600a29d7efae6679e5081f46f2c70789013 sets IEEE802154_CLOCK_DEPS to 802154_MAC, BT_I154_COMMON_BB, ETM, COEXIST and BT_APB; its configure actions write CLK_ZB_APB_EN then CLK_ZBMAC_EN (802154_MAC), CLK_BTBB_EN (BT_I154_COMMON_BB), CLK_ETM_EN (ETM), CLK_BT_APB_EN then CLK_MODEM_SEC_APB_EN (BT_APB) and MODEM_LPCON CLK_COEX_EN (COEXIST) through https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/hal/esp32c5/include/hal/modem_syscon_ll.h sha256 e03d3aa035ae5b3f8a5246e783e3996351293bcb32e863f099b7ceb9ba1f8c69 and https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/hal/esp32c5/include/hal/modem_lpcon_ll.h sha256 65455789d369f219bbebf8fc5bf093dc0a7af7b971096c8a03d158da655bf55d. https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hw_support/modem/modem_clock.c sha256 e698cc6596430724b2fec5b8e631706f6ae112f12e0ae22119ff9e79b21c69d3 applies the actions at reference-count edges in the device order of https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hw_support/modem/include/modem/modem_clock_impl.h sha256 497fbee5c4e07adb01cfa5980ee58dbf9ecbffde6b60855f8d5df82fc9027bc7, and its modem_clock_module_mac_reset pulses RST_ZBMAC, then RST_ZBMAC_APB, each by a write of one followed by a write of zero."

[[sources]]
id = "ESP_IDF_4D59230D_C5_I2C_ANA_MST"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/include/modem/i2c_ana_mst_reg.h sha256 ee3eaf9f6cb38f0e12d7d2d0de6a09df29a4ef1bcf17fe3b2e93ce2774a3961c places I2C0_CTRL and I2C1_CTRL at 0x0 and 0x4 with a read-only BUSY at bit 25 and a read-write control field at 24:0, ANA_CONF1 at 0x1C with reset 0x2D and ANA_CONF2 at 0x20 with reset 0x4, from DR_REG_I2C_ANA_MST_BASE 0x600AF800 of modem/reg_base.h. https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hal_regi2c/esp32c5/regi2c_impl.c sha256 e7b4d9be634d2ce2410fd3d8989af85c1045890c5da485dbd37a5616f1fb5bb5 corroborates the command geometry (block 7:0, register 15:8, data 23:16, write bit 24, busy 25), the complemented one-hot read mask in ANA_CONF1 (BIAS 0x6A bit 6, BBPLL 0x66 bit 7, ULP_CAL 0x61 bit 8, SAR_I2C 0x69 bit 9, DIG_REG 0x6D bit 10) and host selection by the ANA_CONF2 bits 8 to 12 of those blocks, set meaning host 0. https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/esp_hal_regi2c/esp32c5/include/hal/regi2c_ctrl_ll.h sha256 6ad4f6518468ab8cfdedcbaf493638dd5ed27c68bbd8e0359ecc7b7558ef3f10 gates the master clock with MODEM_LPCON CLK_CONF CLK_I2C_MST_EN."

[[sources]]
id = "ESP_IDF_4D59230D_C5_PMU"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/pmu_reg.h sha256 c3120d0bc75133e98dbe5143b1be0b6c2999d01c70a4d37ff8dadff41cd67b96 places PMU_IMM_HP_CK_POWER at DR_REG_PMU_BASE 0x600B0000 + 0xCC with the write-trigger TIE_HIGH_XPD_BB_I2C at bit 28, and PMU_RF_PWC at + 0x158 with read-write XPD_CKGEN5G, XPD_TC5G_I2C, XPD_RX5G_I2C, PERIF_I2C_RSTB, XPD_PERIF_I2C (default 1), XPD_TXRF_I2C, XPD_RFRX_PBUS, XPD_CKGEN_I2C and XPD_PLL_I2C at bits 23 to 31; https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/pmu_struct.h sha256 8c2182865c43655273217ba788e4e6465a914906d5347f2ac0075e0ad17b5c9a restates them. The same header places I2C_ANA_MST I2C0_CTRL1, I2C1_CTRL1 and HW_I2C_CTRL at 0x600AF824, 0x600AF828 and 0x600AF82C with SCL_PULSE_DUR at bits 5:0 and SDA_SIDE_GUARD at bits 10:6, reset 0x42, in modem/i2c_ana_mst_reg.h (ESP_IDF_4D59230D_C5_I2C_ANA_MST)."

[[sources]]
id = "ESP_IDF_4D59230D_C5_LP_AON_SARADC"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/lp_aon_reg.h sha256 ec5f3bc1bf5ef9160bdca40c7e2575e2c992a8ca6ce45d7dc9dc94a0ec69a081 places LP_AON_SAR_CCT at DR_REG_LP_AON_BASE 0x600B1000 + 0x54 with the read-write SAR2_PWDET_CCT at bits 31:29; https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/apb_saradc_reg.h sha256 4d82b7207af0bd4b448a1d964de996cbbd77cd211daa1c055beb76f79bc9059b places APB_SARADC_CTRL at DR_REG_APB_SARADC_BASE 0x6000E000 with the read-write SARADC2_PWDET_DRV at bit 29 and field defaults composing to 0x40038240, and I2C_ANA_MST_ANA_CONF0 of modem/i2c_ana_mst_reg.h resets to 0xE408."

[[sources]]
id = "ESP_IDF_4D59230D_C5_PCR_TSENS"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: https://raw.githubusercontent.com/espressif/esp-idf/4d59230ddff16327812782151ef0afef202dc6d7/components/soc/esp32c5/register/soc/pcr_reg.h sha256 050c5eabe196672c096e7dd74b8ace4c95eb60ac00e7357c96d6e5b082341d5b places PCR_SARADC_CONF at DR_REG_PCR_BASE 0x60096000 + 0x88 with SARADC_CLK_EN at bit 0 (default 1) and SARADC_REG_CLK_EN at bit 2, and PCR_TSENS_CLK_CONF at + 0x90 with TSENS_CLK_SEL at bit 20, TSENS_CLK_EN at bit 22 and TSENS_RST_EN at bit 23; it describes PCR_SAR_CLK_DIV at + 0x148 and PCR_BS_CONF at + 0x150 and nothing at + 0x14C. apb_saradc_reg.h (ESP_IDF_4D59230D_C5_LP_AON_SARADC) places APB_SARADC_APB_TSENS_CTRL at + 0x58 with TSENS_PU at bit 22 (reset 0x18080) and APB_SARADC_TSENS_CTRL2 at + 0x5C with TSENS_CLK_SEL at bit 15 (reset 0x4002). The same pinned components/soc/esp32c5/register/soc/pcr_struct.h, sha256 baf3b9c9a32477608eea0f8514d3a84dfef99cbbc8e74ee354d4f45c0789a03c, line2353 declares the whole +0x14c word reserved_14c. Complete pinned phy_rf_init +0x1ae..+0x1ba and phy_wakeup_init +0x3c..+0x48 fresh-load, AND away low8, OR 0x0a and store it, contradicting that reserved claim on low8; these stay opaque and high24 retain the source-reserved annotation."

[[sources]]
id = "ESP_IDF_4D59230D_C5_INTERRUPT_MATRIX_ZB_MAC_MAP"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32c5/register/soc/interrupt_matrix_reg.h sha256 036f157d297e7b10cdb72cef7d697ec964ebc8f381187588a549415b7d42b341 and interrupt_matrix_struct.h sha256 4758fbff05ac1e4e9014362ed4ee67571b4f39c12165f49d0a7e8595340554c3 (interrupt_core0_zb_mac_intr_map_reg_t). The ZB_MAC_INTR map word at +0x30 holds zb_mac_intr_map in bits 5:0 and zb_mac_intr_pass_in_sec in bit 8; bits 7:6 (reserved_6) and 31:9 (reserved_9) are declared reserved, without a name or meaning."

[[sources]]
id = "ESP_IDF_4D59230D_C5_LP_CLKRST"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32c5/register/soc/lp_clkrst_reg.h sha256 9f10cfbb4a653e92ec914826d700a54f0e79745471528996b5fda8078e5a7bf4 defines LP_CLKRST_RESET_CAUSE_REG at DR_REG_LP_CLKRST_BASE + 0x10, read-only RESET_CAUSE at bits 4:0 and CORE0_RESET_FLAG at bit 5; components/soc/esp32c5/register/soc/reg_base.h sha256 b71b182aedcd6b4bb4d4878f5387b5541cd4c3ff511a17ad3c2a8e46cb660233 sets DR_REG_LP_CLKRST_BASE to 0x600B0400. The cause codes are the chip's common reset reasons, POWERON_RESET being 1."

[[sources]]
id = "ESP_IDF_4D59230D_C5_LPPERI_RNG"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32c5/register/soc/lpperi_reg.h sha256 36f0fc9a005334bceb84ea36c71489dbc76cab1a52d5d6e1474ada5e75b135f3 places LPPERI_CLK_EN_REG at DR_REG_LPPERI_BASE + 0x0 with RNG_CK_EN bit 24 (R/W, reset one), OTP_DBG_CK_EN 25, LP_UART_CK_EN 26, LP_IO_CK_EN 27, LP_EXT_I2C_CK_EN 28, LP_ANA_I2C_CK_EN 29, EFUSE_CK_EN 30 (all R/W, reset one) and LP_CPU_CK_EN 31 (R/W, reset zero); LPPERI_RNG_CFG_REG at + 0x24 with RNG_SAMPLE_ENABLE bit 0 (R/W, reset zero), RNG_TIMER_PSCALE 8:1 (R/W, reset 255), RNG_TIMER_EN 9 (R/W, reset one), RTC_TIMER_EN 11:10 (R/W, reset three) and RNG_SAMPLE_CNT 31:24 (RO); LPPERI_RNG_DATA_SYNC_REG at + 0x28 with RND_SYNC_DATA 31:0 (RO). lpperi_struct.h sha256 ff9ef7dc4f65dbe02b2b92b9146b43d62f5c5a15e9a935ceb921e59a0f3d949f declares CLK_EN bits 23:0 (reserved_0) and RNG_CFG bits 23:12 (reserved_12) reserved. reg_base.h sha256 b71b182aedcd6b4bb4d4878f5387b5541cd4c3ff511a17ad3c2a8e46cb660233 sets DR_REG_LPPERI_BASE to 0x600B2800. components/hal/esp32c5/include/hal/rng_ll.h sha256 eb356e925977f9d5f4dcfff55fcc5a68085ddc5e7e18ae5afe78caae7039a171 enables the generator (rng_ll_enable) by setting RNG_CK_EN through lp_clkrst_ll.h (sha256 b8430d6b7f9d327335f7bfb90c513e6e8f3ca7b9e0a3f81d2b083c5127c1cf3e, which calls CLK_EN a shared register), RNG_TIMER_PSCALE to RNG_LL_CFG_PSCALE 255, RNG_SAMPLE_ENABLE, RTC_TIMER_EN to three and RNG_TIMER_EN, and reads random data from RNG_DATA_SYNC (rng_ll_read_data); components/esp_hw_support/hw_random.c sha256 020c732d5ca90f8182acb91c1c7fed0d88fecff4b0237717041520887fd7f4f7 calls rng_ll_enable from init_rng and spaces reads by APB_CYCLE_WAIT_NUM, 16 APB cycles on the ESP32-C5."

[[sources]]
id = "ESP_IDF_4D59230D_C5_TIMG_WDT"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32c5/register/soc/timer_group_reg.h sha256 a6953cec3acc994c45d5a06b65288b0ce73b476ef2e70ec054c4b674421a2a74 (lines 183-404): WDTCONFIG0 at REG_TIMG_BASE(i) + 0x48 with APPCPU_RESET_EN 12, PROCPU_RESET_EN 13, FLASHBOOT_MOD_EN 14 (reset one), SYS_RESET_LENGTH 17:15 and CPU_RESET_LENGTH 20:18 (reset one), CONF_UPDATE_EN 22 (WT), STG3 24:23, STG2 26:25, STG1 28:27, STG0 30:29, EN 31; WDTCONFIG1 at + 0x4c with DIVCNT_RST 0 (WT) and CLK_PRESCALE 31:16 (reset one); WDTCONFIG2 at + 0x50 STG0_HOLD (reset 26000000); WDTFEED at + 0x60 (WT, any value); WDTWPROTECT at + 0x64 WKEY (reset 0x50D83AA1). timer_group_struct.h sha256 8e654889a9ee1191e7f926574f4cac57e459fa09d243b2ab6794d69eae4d3eb3 declares WDTCONFIG0 bits 11:0 and 21 and WDTCONFIG1 bits 15:1 reserved. reg_base.h sha256 b71b182aedcd6b4bb4d4878f5387b5541cd4c3ff511a17ad3c2a8e46cb660233 sets DR_REG_TIMERG0_BASE 0x60008000 and DR_REG_TIMERG1_BASE 0x60009000. components/esp_hal_wdt/esp32c5/include/hal/mwdt_ll.h sha256 c219ca0e6650ff481248a512ac9230fc28d58501fc51a6705c942d50c9f58bf1 writes the key 0x50D83AA1 to unlock and zero to lock, and sets CONF_UPDATE_EN after each configuration change."

[[sources]]
id = "ESP_IDF_4D59230D_C5_LP_WDT"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32c5/register/soc/lp_wdt_reg.h sha256 30e63946a4d6e39a2c38399974bbc0f299da99495ead5d139812a787926fcc26 (lines 13-292): CONFIG0 at DR_REG_LP_WDT_BASE + 0x0 with CHIP_RESET_WIDTH 7:0 (reset 20), CHIP_RESET_EN 8, PAUSE_IN_SLP 9 (reset one), APPCPU_RESET_EN 10, PROCPU_RESET_EN 11, FLASHBOOT_MOD_EN 12 (reset one), SYS_RESET_LENGTH 15:13 and CPU_RESET_LENGTH 18:16 (reset one), STG3 21:19, STG2 24:22, STG1 27:25, STG0 30:28, EN 31; WPROTECT at + 0x18 WKEY (reset zero); SWD_CONFIG at + 0x1c with SWD_RESET_FLAG 0 (RO), SWD_AUTO_FEED_EN 18, SWD_RST_FLAG_CLR 19 (WT), SWD_SIGNAL_WIDTH 29:20 (reset 300), SWD_DISABLE 30, SWD_FEED 31 (WT); SWD_WPROTECT at + 0x20 SWD_WKEY (reset zero). lp_wdt_struct.h sha256 815cf13cd4d4387b638d92dedc3c8ab68ee879c5af957c44fc113dfae85e8cbe declares SWD_CONFIG bits 17:1 reserved. reg_base.h sets DR_REG_LP_WDT_BASE 0x600B1C00. components/esp_hal_wdt/esp32c5/include/hal/lpwdt_ll.h sha256 b48581feb9985d8a126da55fac4426e42b9780ceea3f14671e9ba3ab01717536 names both keys 0x50D83AA1."

