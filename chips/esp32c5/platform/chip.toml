# The chip layer of the ESP32-C5's facts: what host tools cannot derive from
# the chip id. It extends the ISA of its hart and the Espressif family; its
# module and board (modules/, boards/) extend it. Paths follow the id by
# convention: chips/<id>/{vendor,registers}, firmware/hil/<id>,
# target/hil/<id>.
schema = 2
id = "esp32c5"
extends = ["../../espressif/platform/isa/rv32imac.toml", "../../espressif/platform/family.toml"]
espflash-chip = "esp32c5"
revisions = ["rev100"]

# What the chip has: its radio bands, Bluetooth modes, IEEE 802.15.4 and
# cores. Differences of address or layout belong in the register model.
[properties]
# Dual-band: 2.4 GHz and 5 GHz.
wifi-bands = ["2g4", "5g"]
# LE-only controller in the vendor Bluetooth library.
bluetooth = ["le"]
ieee802154 = true
cores = 1

# Where every image lies in flash. The image pipeline encodes the ESP-IDF
# bootloader, the partition table and the OTA selection for these offsets at
# build time; a flash writes the bundle there. `application` and `otadata`
# are the partitions of `partitions` (the image pipeline holds them to it).
[flash]
# SOURCE(esp32c5): ESP-IDF 4d59230d `components/esp_rom/esp32c5/esp_rom_caps.h:40`
# (the ROM loads the second-stage bootloader from flash offset 0x2000).
bootloader = 0x2000
partition-table = 0x8000
application = 0x10000
otadata = 0xd000
partitions = "chips/esp32c5/platform/partitions/applications.csv"
# The application image's header: the fastest settings an ESP image header
# holds for the module's quad flash (its size is the module's), QIO at 80 MHz
# (ESP-IDF's 120-MHz option also writes 80m and tunes at run time); the ROM
# reads the bootloader in DIO.
# SOURCE(esp32c5): ESP-IDF 4d59230d `components/spi_flash/esp32c5/Kconfig.flash_freq`
# and `components/esptool_py/Kconfig.projbuild:47-60,75-82,104-109`.
application-encoding = { mode = "qio", frequency-mhz = 80 }
bootloader-mode = "dio"
# How a written image starts: the writer leaves the ROM in download mode,
# and a power-on reset (RTS without power control) starts the image; an RTS
# reset out of download mode leaves the esp32c5's USB console silent.
start = "power-on"

# The staged-boot address map: host tools check images against it, and
# chips/esp32c5/layout generates its LAYOUT, which the linker scripts read,
# from it. One MMU window serves flash and PSRAM: the bootstrap's flash pages
# in its lower half, the module's PSRAM at the fixed start of its upper half.
# Stage two lies in the PSRAM after the bootstrap's probe page
# (`runtime-psram`).
[memory]
# Application-owned internal SRAM, `SRAM_START..SRAM_SEG_END`; the
# second-stage loader, the ROM's download buffers, its stack and its data lie
# above it.
#
# SOURCE: ESP-IDF 4d59230d `components/esp_system/ld/esp32c5/ld.hp_mem_defs:9`
# (`SRAM_SEG_END 0x4084E5A0`) and `components/soc/esp32c5/include/soc/soc.h:156`
# (`SOC_DRAM_LOW 0x40800000`).
sram = { origin = 0x40800000, length = 0x0004e5a0 }
# The cache window flash and PSRAM share.
#
# SOURCE: ESP-IDF 4d59230d `components/soc/esp32c5/include/soc/soc.h:144-149`
# (`SOC_IROM_LOW 0x42000000`, `SOC_IROM_HIGH 0x44000000`, DROM the same) and
# `soc_caps.h:309` (`SOC_MMU_DI_VADDR_SHARED`); esp-hal's metadata places
# PSRAM in it (`esp-metadata/devices/esp32c5/soc.toml` `extmem_origin`).
cache-window = { origin = 0x42000000, length = 0x02000000 }
# The lower half of the cache window: the bootstrap's text and read-only
# data, mapped by the second-stage loader from the window's start.
flash-xip = { origin = 0x42000000, length = 0x01000000 }
# Where the bootstrap maps the module's PSRAM: the start of the window's
# upper half, a multiple of its 64-KiB MMU pages (esp-hal `PsramOrigin::Fixed`).
psram-origin = 0x43000000
# LP RAM, which no reset entry initializes: the panic record survives every
# reset but a power loss.
#
# SOURCE: ESP-IDF 4d59230d `components/soc/esp32c5/include/soc/soc.h:160-161`
# (`SOC_RTC_DRAM_LOW 0x50000000`, `SOC_RTC_DRAM_HIGH 0x50004000`).
retained = { origin = 0x50000000, length = 0x4000 }
# The runtime's task stacks lie in PSRAM.
task-stacks = "psram"

# What the pinned second-stage bootloader keeps for itself.
[boot-chain]
# SOURCE: ESP-IDF 4d59230d
# `components/bootloader/subproject/main/ld/esp32c5/bootloader.memory.ld.in:26-51`
# (usable end 0x4085c5a0 minus the 0x2000 stack, 0x5000 `dram_seg` and 0x7000
# `iram_loader_seg`; asserted as `bootloader_iram_loader_seg_start`).
second-stage-loader-start = 0x4084e5a0
# ESP-IDF keeps the tail of LP RAM as lp_reserved_seg: the RTC timer data
# (RTC_TIMER_RESERVE_RTC, 24 bytes) + the bootloader's retained data; the
# espflash bootloader this platform boots through reserves none.
#
# SOURCE: ESP-IDF 4d59230d `components/esp_system/ld/esp32c5/memory.ld.in:86-136`
# (lp_reserved_seg at 0x50004000 - RESERVE_RTC_MEM) and
# `components/esp_system/ld/ld.common:64`.
retained-reserved-tail = 24

# The bootstrap does not tune flash: esp-hal runs the ESP32-C5 MSPI at the
# image header's 80 MHz.
[staged]
flash-tuning-reference-bytes = 0

# The chip's hart and the guard of its interrupt stack; the family states
# the rest of the interrupt contract. One hart, no inter-processor call.
[interrupts]
harts = [0]
irq-stack-guard-bytes = { "0" = 4096 }

# The mask ROM the stack analyses read: the pinned ROM ELF of the revision
# the profile describes (chips/esp32c5/vendor/artifacts.toml) and the
# reviewed function summaries of the ROM the images link
# (chips/esp32c5/layout/linker/rom/esp32c5-eco2.x).
[rom]
elf = "rom-rev100"
# SOURCE: ESP-IDF 4d59230d `components/esp_rom/esp32c5/ld/esp32c5.rom.ld`
# (the ECO2 ROM the images link).
linker-script = "rom/esp32c5-eco2.x"
summaries = "chips/esp32c5/platform/rom-functions.toml"

# The HIL agent's graph is the source-only stack: the root lock and
# firmware/hil/esp32c5 must not pull in esp-rtos, whose scheduler and
# interrupt bindings the staged runtime's static table replaces.
[hil]
forbidden-packages = ["esp-rtos"]

# The chip's packages by the role the repository policies give them.
[packages]
closed-pac = ["oer-esp32c5-pac"]
pac-consumers = ["oer-esp32c5-pac", "oer-esp32c5-hal"]

# The Rust probe images of the vendor comparison (firmware/probes).
[[probe]]
role = "rust-artifact"
package = "oer-firmware-probes-esp32c5-radio"

# Why the core last reset, which the stand reads through JTAG after a power
# cycle: the board lost power only if it reads a power-on reset. The field is
# the platform publication's (chips/esp32c5/registers/publication/platform.toml), with
# its evidence; cause 1 is the power-on reset of ESP-IDF 4d59230d's
# `components/soc/esp32c5/register/soc/lp_clkrst_reg.h`.
[reset-cause]
field = "LP_CLKRST_RESET_CAUSE.RESET_CAUSE.RESET_CAUSE"
power-on = 1

[hil.images.system-watchdog]
package = "oer-firmware-hil-esp32c5"
manifest = "firmware/hil/esp32c5/Cargo.toml"
stack-policy = "firmware/hil/esp32c5/stack.toml"

[hil.images.boot-smoke]
package = "oer-firmware-hil-esp32c5"
manifest = "firmware/hil/esp32c5/Cargo.toml"
stack-policy = "firmware/hil/esp32c5/stack.toml"
