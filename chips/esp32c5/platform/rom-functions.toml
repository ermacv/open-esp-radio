# Reviewed facts about functions of the ROM that `esp32c5-eco2.x` links the
# images against and that the stack analysis (`tools/riscv/stack`) cannot
# bound from their machine code alone: each one's frame (bytes below its entry
# `sp`) and the functions it calls or jumps to.
#
# The analysis checks each address against the symbol of the pinned ROM ELF
# (`esp32c5_rev100_rom.elf`, artifact `rom-rev100`) and requires a summary to
# agree with the machine code wherever the analysis bounds the function
# itself. `cargo vendor-check check provenance` keeps each cited function's
# code fingerprint, so a changed ROM fails until reviewed.

# SOURCE(esp32c5): rev100 ROM `memset` (newlib's RISC-V assembly, the same
# sequence as the ESP32-S31 rev0 ROM's) never writes `sp` and calls nothing.
# Its two computed transfers stay inside it: `jr 0xa(a3)` enters its unrolled
# byte-store sequence at 15 - (length & 15) stores from its end (the length is
# below 16 on every path to it: `li t1, 15` with `bgeu t1, a2`, or `andi a2,
# a2, 15`), and the `jalr` that keeps `ra` in `t0` enters the same sequence for
# the 1-15 bytes before a 16-byte boundary (`andi a5, a4, 15`, nonzero) and
# returns through `ra`.
[[function]]
name = "memset"
address = 0x40038610
frame = 0
calls = []

# SOURCE(esp32c5): Blobray on the pinned rev100 ROM: __riscv_save_3
# retains 16 bytes, restored by __riscv_restore_3. The indirect call loads
# rom_spi_usr_cmd_legacy_funcs's reset-rw-mode slot. ROM initialization
# installs rom_default_spi_usr_cmd_legacy_funcs, in ROM; the slot names
# esp_rom_spi_reset_rw_mode. The writer review covers the ROM, staged
# bootstrap/runtime and pinned esp-hal: none replaces the pointer. The
# computed switch stays inside this function. Save/restore transfers are
# retained too; their separate frames make the bound conservative.
[[function]]
name = "esp_rom_spi_set_op_mode"
address = 0x4002c168
frame = 16
calls = ["__riscv_save_3", "__riscv_restore_3", "esp_rom_spi_reset_rw_mode"]

# SOURCE(esp32c5): Blobray on the same ROM: __riscv_save_7 retains 32
# bytes (its transient 64-byte depth is bounded by the helper's own frame),
# then this function reserves another 16 bytes until __riscv_restore_7.
# ROM initialization sets rom_spiflash_legacy_funcs to
# rom_default_spiflash_legacy_funcs; its SPI command wait hook is null.
# No ROM, staged bootstrap/runtime or pinned esp-hal writer replaces the
# pointer or hook, so the optional indirect call is not taken. The remaining
# call is memcpy. Save/restore transfers, including their frames, remain.
[[function]]
name = "esp_rom_spi_cmd_start"
address = 0x4002c4a8
frame = 48
calls = ["__riscv_save_7", "__riscv_restore_7", "memcpy"]
