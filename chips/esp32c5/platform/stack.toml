schema = 5

# Formatting entry points watched by the host reachability report.
observed_functions = [
    "core::fmt::write",
    "<core::fmt::Formatter>::*",
    "<core::fmt::rt::Argument>::fmt*",
    "<core::fmt::builders::*",
    "* as core::fmt::Debug>::fmt*",
    "* as core::fmt::Display>::fmt*",
    "* as core::fmt::Binary>::fmt*",
    "* as core::fmt::Octal>::fmt*",
    "* as core::fmt::LowerHex>::fmt*",
    "* as core::fmt::UpperHex>::fmt*",
    "* as core::fmt::Pointer>::fmt*",
    "* as core::fmt::LowerExp>::fmt*",
    "* as core::fmt::UpperExp>::fmt*",
    "* as core::fmt::Write>::write_fmt*",
]

# Every linked function without a compiler frame record (`-Z emit-stack-sizes`)
# needs exactly one review there: assembly, vector data or compiler runtime.
coverage_policy = "../../espressif/staged-layout/stack-coverage.toml"

# Reject implicit copies/moves large enough to hide owner graphs or buffers in
# compiler temporaries. The lint is enforced while building the final fat-LTO
# selected runtime image.
max_move_bytes = 4096

# Each stack is bounded from the function that runs on it from its top, as
# chips/esp32s31/platform/stack.toml states.

# `_runtime_start` switches to the top of this stack (`_runtime_stack_bootstrap`)
# and tail-calls `runtime_main`, which runs the executor for good.
[cpu0_task_stack]
root = "runtime_main"
bottom_symbol = "__runtime_cpu0_task_stack_bottom"
top_symbol = "__runtime_cpu0_task_stack_top"
minimum_free_bytes = 16384

# The dedicated SRAM interrupt stack is bounded by the interrupt-stack gate
# against the platform interrupt contract's percentage margin; there is no
# separate fixed free-byte reserve.
[interrupt_stacks]

# The bootstrap runs on the linker script's `_stack_end`..`_stack_start` from
# riscv-rt's `_start_rust`, which calls `hal_main` and then the bootstrap's
# `main`.
[bootstrap_stack]
root = "_start_rust"
bottom_symbol = "_stack_end"
top_symbol = "_stack_start"
minimum_free_bytes = 4096
# The bootstrap jumps to stage two's entry and never uses its stack again;
# the checks verify both facts in the ELFs.
handoff = "_runtime_start"
