# The ROM layer of the ESP32-C5's facts: the mask ROM of the revision 1.0
# chip the board carries. It extends the chip layer; the module (modules/)
# extends it.
schema = 2
extends = "chip.toml"

# The mask ROM the stack analyses read: the pinned ROM ELF of the revision
# the profile describes (chips/esp32c5/vendor/artifacts.toml), the reviewed
# function summaries of the ROM the images link
# (chips/esp32c5/layout/linker/rom/esp32c5-eco2.x) and what the ROM uses of
# the internal SRAM.
[rom]
revision = "rev100"
elf = "rom-rev100"
# SOURCE: ESP-IDF 4d59230d `components/esp_rom/esp32c5/ld/esp32c5.rom.ld`
# (the ECO2 ROM the images link).
linker-script = "rom/esp32c5-eco2.x"
summaries = "chips/esp32c5/platform/rom-functions.toml"
# The ROM's SRAM, from its ELF's symbols: no ROM symbol lies in
# 0x40800000..0x4084e5a0. The boot stack is the span between the download
# buffers and the first data symbol.
#
# SOURCE: Blobray (`cargo blobray symbols --input rom-rev100=pin:esp32c5/rom-rev100`):
# `rom-rev100[]::g_shared_buffers` 0x4084e5a0, 0xe000 bytes
# (`.bss_shared_bufs`); `rom-rev100[]::s_is_rsa` 0x4085e5a0 (`.data_ets`), the
# lowest `.data`/`.bss` symbol; `rom-rev100[]::g_saved_pc` 0x4085fffc, 4 bytes
# (`.bss.interface.common`), the highest. They agree with ESP-IDF 4d59230d
# `components/bootloader/subproject/main/ld/esp32c5/bootloader.memory.ld.in:12-15`
# (shared buffers, PRO CPU startup stack, ROM `.bss` and `.data`).
sram = [
    { name = "download-buffers", start = 0x4084e5a0, end = 0x4085c5a0, kept = "download" },
    { name = "boot-stack", start = 0x4085c5a0, end = 0x4085e5a0, kept = "boot" },
    { name = "data", start = 0x4085e5a0, end = 0x40860000, kept = "running" },
]
