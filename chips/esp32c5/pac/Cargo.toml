[package]
name = "oer-esp32c5-pac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Closed typed ESP32-C5 radio peripheral access crate"

[features]
# Analog vocabulary and bus operations for the HAL's host tests.
test-support = []

[dependencies]
oer-espressif-analog = { path = "../../espressif/analog" }
oer-espressif-ieee802154-mac-values = { path = "../../espressif/ieee802154-mac-values" }
oer-mmio = { path = "../../../portable/mmio" }
oer-espressif-watchdog = { path = "../../espressif/watchdog" }
oer-espressif-ieee80211-pac = { path = "../../espressif/ieee80211-pac" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics"] }


[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

