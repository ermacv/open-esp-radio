[package]
name = "oer-esp32c5-esp-hal-soc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-C5 SoC services backed by esp-hal"

[features]
default = []
esp32c5 = ["dep:esp-hal"]

[dependencies]
oer-esp32c5-hal = { path = "../hal" }
oer-time = { path = "../../../portable/time" }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "2b665dd27104c6ec9983b675113551fc696050c9", default-features = false, features = ["esp32c5", "unstable"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

