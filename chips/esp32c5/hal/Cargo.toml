[package]
name = "oer-esp32c5-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ownership boundaries of the ESP32-C5 radio over its closed PAC"

[features]
# Synthetic placement for explicit host model builds.
test-support = ["oer-esp32c5-pac/test-support"]

[dependencies]
oer-esp32c5-pac = { path = "../pac" }
oer-memory = { path = "../../../portable/memory" }
oer-espressif-coex = { path = "../../espressif/coex" }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154-engine" }
oer-espressif-analog = { path = "../../espressif/analog" }
oer-espressif-modem-clock = { path = "../../espressif/modem-clock" }

[dev-dependencies]
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }
oer-espressif-ieee802154-engine = { path = "../../espressif/ieee802154-engine", features = ["test-support"] }
oer-esp32c5-pac = { path = "../pac", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

