[package]
name = "oer-espressif-staged-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Stage-two entry, relocation, traps, per-hart interrupt stacks, critical-section, panic record and fatal paths of the Espressif staged boot"

[features]
# The chip; an image selects exactly one. The build generates the vectors
# from its facts (its harts and CLIC lines); the chip's HAL holds the fatal
# path's proof, the stop of the other hart and the software reset.
esp32s31 = ["dep:oer-esp32s31-hal"]
## Hart 1 runs code. No image enables it, and the crate refuses it: the
## runtime's critical-section masks only the current hart, so a second
## running hart needs a cross-hart lock without spinning first.
cpu1-runs = []
## After the record, call the image's `oer_platform_panic_hook`, which
## records more of its state without formatting, then reset.
panic-hook = []

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-staged-layout.workspace = true
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-interrupt-table = { path = "../../../portable/interrupt-table" }

oer-esp32s31-hal = { path = "../../esp32s31/hal", optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = { workspace = true, features = ["restore-state-u32"] }

[build-dependencies]
oer-espressif-facts = { path = "../facts" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
