[package]
name = "oer-espressif-staged-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Stage-two entry, relocation, traps, per-hart interrupt stacks, critical-section, panic record and fatal paths of the Espressif staged boot"

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-boot = { path = "../boot" }
oer-espressif-staged-layout.workspace = true
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-espressif-interrupt-table = { path = "../interrupt-table" }
# The chip the HAL selects reaches the build script as this package's
# `chip` metadata; the fatal path's primitives are its `Platform`.
oer-espressif-platform-port = { path = "../platform-port" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = { workspace = true, features = ["restore-state-u32"] }

[build-dependencies]
oer-espressif-facts = { path = "../facts" }

[dev-dependencies]
tempfile = "=3.27.0"
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }
oer-espressif-watchdog = { path = "../watchdog" }

[lints]
workspace = true
