[package]
name = "oer-espressif-staged-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Stage-two entry, relocation, traps, per-hart interrupt stacks, critical-section and panic record of the Espressif staged boot"

[features]
# The chip; an image selects exactly one. esp-hal remains for the panic's
# software reset alone.
esp32s31 = ["esp-hal/esp32s31"]
esp32c5 = ["esp-hal/esp32c5"]
# A second hart: its SRAM interrupt stack and vector table (the chip
# layout's `harts` is 2).
two-harts = []
## Hart 1 runs code. No image enables it, and the crate refuses it: the
## runtime's critical-section masks only the current hart, so a second
## running hart needs a cross-hart lock without spinning first.
cpu1-runs = []
## After the record, call the image's `oer_platform_panic_hook`, which
## records more of its state without formatting, then reset.
panic-hook = []

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-staged-layout.workspace = true
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-interrupt-table = { path = "../../../portable/interrupt-table" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = { workspace = true, features = ["restore-state-u32"] }
esp-hal = { workspace = true }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
