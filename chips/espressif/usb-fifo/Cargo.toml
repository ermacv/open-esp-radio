[package]
name = "oer-espressif-usb-fifo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The synchronous USB Serial/JTAG FIFO writer of the early boot, without ROM printf"

[features]
# The chip of esp-hal; a consumer selects exactly one.
esp32s31 = ["esp-hal/esp32s31"]
esp32c5 = ["esp-hal/esp32c5"]

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics" }
critical-section = "1.2.0"
esp-hal = { workspace = true, features = ["static-interrupts", "unstable"] }

[lints]
workspace = true
