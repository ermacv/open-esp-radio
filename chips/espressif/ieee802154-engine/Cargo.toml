[package]
name = "oer-espressif-ieee802154-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "IEEE 802.15.4 MAC driver engine of the Espressif chips, ported from the public ESP-IDF driver"

[features]
# Recording LL and synthetic addresses for explicit host models.
test-support = []

[dependencies]
oer-espressif-ieee802154-mac-values = { path = "../ieee802154-mac-values" }
oer-memory = { path = "../../../portable/memory" }
oer-espressif-coex = { path = "../coex" }
oer-ieee802154-port = { path = "../../../protocols/ieee802154/port" }
oer-ieee802154-wire = { path = "../../../protocols/ieee802154/wire" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }

[dev-dependencies]
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }

[lints]
workspace = true
