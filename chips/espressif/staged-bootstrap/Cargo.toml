[package]
name = "oer-espressif-staged-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The chip-neutral steps of the Espressif staged-boot bootstrap: stage-two validation, relocation into PSRAM and handoff"

[features]
# A bootstrap selects its chip HAL and early USB writer.
esp32s31 = ["dep:oer-esp32s31-hal"]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false }
oer-memory = { path = "../../../portable/memory" }
oer-espressif-boot = { path = "../boot" }
oer-riscv = { path = "../../../portable/riscv" }
oer-espressif-staged-layout.workspace = true
oer-esp32s31-hal = { path = "../../esp32s31/hal", optional = true }

[lints]
workspace = true
