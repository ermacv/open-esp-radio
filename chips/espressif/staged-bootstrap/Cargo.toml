[package]
name = "oer-espressif-staged-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The chip-neutral steps of the Espressif staged-boot bootstrap: stage-two validation, relocation into PSRAM and handoff"

[features]
# The chip of esp-hal and of the early USB writer; a bootstrap selects
# exactly one.
esp32s31 = ["esp-hal/esp32s31", "dep:oer-esp32s31-hal"]
esp32c5 = ["esp-hal/esp32c5", "dep:oer-esp32c5-hal"]

[dependencies]
oer-riscv = { path = "../../../portable/riscv" }
oer-espressif-staged-layout.workspace = true
oer-esp32s31-hal = { path = "../../esp32s31/hal", optional = true }
oer-esp32c5-hal = { path = "../../esp32c5/hal", optional = true }
esp-hal = { workspace = true, features = ["static-interrupts", "rt", "unstable"] }

[lints]
workspace = true
