[package]
name = "oer-espressif-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio"
description = "Scheduler-free static task executor and time driver for Espressif staged-boot applications"

[features]
default = []
# Nominal static radio-slot declarations. Images without a port slot retain
# their dependency graph and linked bytes.
port-slots = ["dep:oer-radio-port"]
# The executor and time driver over a chip binding (`bind!`), which the
# chip's composition crate selects together with the HAL's chip.
chip = [
    "dep:embassy-time-driver",
    "dep:portable-atomic",
    "dep:oer-espressif-interrupt-table",
    "dep:oer-espressif-staged-runtime",
    "dep:oer-riscv",
    "dep:oer-mmio",
]

[dependencies]
oer-trace = { path = "../../../portable/trace" }
oer-espressif-boot = { path = "../boot" }
static_cell = "2.1.1"
oer-cooperate = { path = "../../../portable/cooperate" }
oer-time = { path = "../../../portable/time" }
bytemuck = { version = "1.25.2", default-features = false }
oer-memory = { path = "../../../portable/memory" }
oer-espressif-platform-port = { path = "../platform-port" }
oer-radio-port = { path = "../../../protocols/radio/port", optional = true }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"], optional = true }
portable-atomic = { version = "1.11", default-features = false, optional = true }
oer-espressif-interrupt-table = { path = "../interrupt-table", optional = true }
oer-riscv = { path = "../../../portable/riscv", optional = true }
oer-mmio = { path = "../../../portable/mmio", optional = true }
oer-espressif-staged-runtime = { path = "../staged-runtime", optional = true }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
tempfile = "=3.27.0"
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }

[dev-dependencies]
oer-riscv = { path = "../../../portable/riscv" }
oer-radio-port = { path = "../../../protocols/radio/port", features = ["test-support"] }
oer-espressif-staged-runtime = { path = "../staged-runtime" }
oer-espressif-interrupt-table = { path = "../interrupt-table", features = ["host-signal"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }

[lints]
workspace = true

[[test]]
name = "slots"
required-features = ["port-slots"]

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
