[package]
name = "oer-espressif-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio"
description = "Scheduler-free Embassy executor and time driver for Espressif staged-boot applications"

[features]
default = []
# The chip of esp-hal; an image selects exactly one.
esp32s31 = [
    "chip",
    "esp-hal/esp32s31",
    "oer-espressif-esp-hal-irq/esp32s31",
]
esp32c5 = [
    "chip",
    "esp-hal/esp32c5",
    "oer-espressif-esp-hal-irq/esp32c5",
]
# The executor and time driver, which a chip feature selects.
chip = [
    "dep:embassy-executor",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:esp-hal",
    "dep:portable-atomic",
    "dep:riscv",
    "dep:oer-espressif-esp-hal-irq",
    "dep:oer-interrupt-table",
]

[dependencies]
static_cell = "2.1.1"
bytemuck = { version = "1.25.2", default-features = false }
oer-memory = { path = "../../../portable/memory" }
embassy-executor = { version = "0.10.0", default-features = false, optional = true }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"], optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "d1167e740b3ec947d56f97b5091ebcb67a0cebfa", default-features = false, features = ["static-interrupts", "rt", "unstable"], optional = true }
portable-atomic = { version = "1.11", default-features = false, optional = true }
oer-interrupt-table = { path = "../../../portable/interrupt-table", optional = true }
oer-espressif-esp-hal-irq = { path = "../esp-hal-irq", optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = { version = "0.15", optional = true }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }
esp32s31-pac = { package = "esp32s31", git = "https://github.com/ermacv/esp-pacs", rev = "a1f6cf68e", default-features = false }
esp32c5-pac = { package = "esp32c5", git = "https://github.com/ermacv/esp-pacs", rev = "a1f6cf68e", default-features = false }

[dev-dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
embassy-time-queue-utils = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "adapter"
platform = "family"
family = "espressif"
# An image selects exactly one chip of esp-hal; each profile builds for its
# chip's target only.
supported-feature-profiles = ["esp32s31", "esp32c5"]
