[package]
name = "oer-espressif-esp-hal-soc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 SoC cache, flash and DMA services backed by esp-hal, and the per-domain platform handoffs"

[features]
default = []
esp32s31 = ["dep:esp-hal", "dep:oer-espressif-esp-hal-irq", "dep:oer-esp32s31-pac"]

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
oer-memory = { path = "../../../../portable/memory" }
critical-section = "1.2.0"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "1f646c5af4f4ca2774f493783581237fea2379dc", default-features = false, features = ["esp32s31", "static-interrupts", "unstable"], optional = true }
oer-interrupt-table = { path = "../../../../portable/interrupt-table" }
oer-espressif-esp-hal-irq = { path = "../../esp-hal-irq", features = ["esp32s31"], optional = true }
oer-esp32s31-pac = { path = "../../../esp32s31/pac", optional = true }

# Host tests need the std implementation; chip doctests use esp-hal's.
[target.'cfg(not(target_os = "none"))'.dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []
