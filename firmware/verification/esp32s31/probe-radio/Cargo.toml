[package]
name = "oer-firmware-verification-esp32s31-probe-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Retained ESP32-S31 Rust entry points for compiled vendor verification"

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-tool-service-probe-macros = { path = "../../../../tools/lib/service/probe-macros" }
embassy-futures = { version = "0.1.2" }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["esp32s31", "static-interrupts", "unstable"] }
oer-esp32s31-radio-coex = { path = "../../../../crates/esp32s31/radio/coex", features = ["validation-probes"] }
oer-base-memory = { path = "../../../../crates/base/memory" }
oer-esp32s31-hal = { path = "../../../../crates/esp32s31/hal", features = ["validation-probes"] }
oer-esp32s31-pac = { path = "../../../../crates/esp32s31/pac", features = ["validation-probes"] }
oer-esp32s31-phy = { path = "../../../../crates/esp32s31/phy", features = ["validation-probes"] }
oer-tool-analysis-phy-relation-esp32s31 = { path = "../../../../tools/lib/analysis/phy-relation-esp32s31", features = ["projection"] }
oer-esp32s31-ieee80211-mac = { path = "../../../../crates/esp32s31/ieee80211/mac", features = ["validation-probes", "validation-raw-dma"] }
oer-esp32s31-ieee80211-driver = { path = "../../../../crates/esp32s31/ieee80211/driver" }
oer-ieee80211-mac = { path = "../../../../crates/ieee80211/mac" }
oer-ieee80211-softmac = { path = "../../../../crates/ieee80211/softmac" }
oer-adapters-esp-hal-radio = { path = "../../../../crates/adapters/esp-hal/radio", features = ["esp32s31"] }
oer-ieee80211-lower-mac = { path = "../../../../crates/ieee80211/lower-mac" }
oer-base-time = { path = "../../../../crates/base/time" }

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

