[workspace]
resolver = "3"
members = [
    "bluetooth/elf",
    "bluetooth/library",
    "radio/elf",
    "radio/library",
    "register/elf",
    "register/library",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
debug_assert_with_mut_call = "deny"
# The repository `clippy.toml` lists methods radio code must not call.
disallowed_methods = "deny"

[workspace.dependencies]
embassy-futures = "0.1.2"
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["esp32s31", "unstable"] }
oer-esp32s31-radio-esp-hal = { path = "../../../crates/adapters/esp-hal/esp32s31/radio", features = ["esp32s31"] }
oer-memory = { path = "../../../crates/memory" }
oer-esp32s31-hal = { path = "../../../crates/hardware/esp32s31/hal", features = ["validation-probes"] }
oer-esp32s31-bluetooth = { path = "../../../crates/hardware/esp32s31/driver/bluetooth", features = ["validation-probes"] }
oer-esp32s31-coex = { path = "../../../crates/hardware/esp32s31/driver/coex", features = ["validation-probes"] }
oer-esp32s31-pac = { path = "../../../crates/hardware/esp32s31/pac", features = ["validation-probes"] }
oer-esp32s31-phy = { path = "../../../crates/hardware/esp32s31/phy" }
oer-esp32s31-ieee80211-mac = { path = "../../../crates/hardware/esp32s31/driver/ieee80211/mac", features = ["validation-probes", "validation-raw-dma"] }
oer-esp32s31-ieee80211 = { path = "../../../crates/hardware/esp32s31/driver/ieee80211" }
oer-esp32s31-ieee80211-dma = { path = "../../../crates/hardware/esp32s31/driver/ieee80211/dma" }
oer-ieee80211-mac = { path = "../../../crates/protocols/ieee80211/mac" }
oer-ieee80211-softmac = { path = "../../../crates/protocols/ieee80211/softmac" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
