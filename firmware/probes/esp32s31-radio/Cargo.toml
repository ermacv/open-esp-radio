[package]
name = "oer-firmware-probes-esp32s31-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
description = "Retained ESP32-S31 Rust entry points for compiled vendor verification, and the linked probe image"

[dependencies]
oer-cooperate = { path = "../../../portable/cooperate" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-espressif-ieee80211-policy = { path = "../../../chips/espressif/ieee80211-policy" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-probe-macros = { path = "../../../tools/probe/macros" }
embassy-futures = { version = "0.1.2" }
oer-esp32s31-radio-coex = { path = "../../../chips/esp32s31/radio/coex" }
oer-memory = { path = "../../../portable/memory" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal", features = ["test-support"] }
oer-esp32s31-pac = { path = "../../../chips/esp32s31/pac" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port" }
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "oer-firmware-probes-esp32s31-radio"
path = "src/main.rs"

[build-dependencies]
oer-probe-codegen = { path = "../../../tools/probe/codegen" }

[lints]
workspace = true

