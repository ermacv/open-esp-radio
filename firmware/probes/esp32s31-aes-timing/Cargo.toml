[package]
name = "oer-firmware-probes-esp32s31-aes-timing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "A staged image that times the protocol layer's AES operations in software and on the S31 AES accelerator: waiting on its state flag, on its interrupt, and as the Wi-Fi station's engine waits"
build = "build.rs"

[dependencies]
oer-crypto = { path = "../../../portable/crypto" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-crypto = { path = "../../../chips/esp32s31/crypto" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-executor = { path = "../../../chips/espressif/executor" }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-riscv = { path = "../../../portable/riscv" }
oer-ieee80211-core-security-cipher = { path = "../../../protocols/ieee80211/core/security/cipher" }
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
ccm = { version = "=0.5.0", default-features = false }
cmac = { version = "0.7.2", default-features = false }

[dev-dependencies]
aes = { version = "0.8.4", default-features = false }
ccm = { version = "=0.5.0", default-features = false }
cmac = { version = "0.7.2", default-features = false }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
