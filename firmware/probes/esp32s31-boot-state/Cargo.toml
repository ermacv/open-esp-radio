[package]
name = "oer-firmware-probes-esp32s31-boot-state"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false
description = "Board observation of ESP32-S31 boot state the esp-hal fork relies on: PMA, MMU entry width, PMU latch bits and watchdog disable"

[dependencies]
esp-backtrace = { git = "https://github.com/ermacv/esp-hal", rev = "2b665dd27104c6ec9983b675113551fc696050c9", default-features = false, features = ["esp32s31", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "2b665dd27104c6ec9983b675113551fc696050c9", default-features = false, features = ["esp32s31"] }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "2b665dd27104c6ec9983b675113551fc696050c9", default-features = false, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", rev = "2b665dd27104c6ec9983b675113551fc696050c9", default-features = false, features = ["auto", "esp32s31"] }

[lints]
workspace = true
