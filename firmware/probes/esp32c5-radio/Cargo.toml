[package]
name = "oer-firmware-probes-esp32c5-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
description = "Retained ESP32-C5 Rust entry points for compiled vendor verification, and the linked probe image"

[dependencies]
oer-probe-macros = { path = "../../../tools/probe/macros" }
oer-esp32c5-hal = { path = "../../../chips/esp32c5/hal" }
oer-esp32c5-pac = { path = "../../../chips/esp32c5/pac" }
oer-espressif-analog = { path = "../../../chips/espressif/analog" }
[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "oer-firmware-probes-esp32c5-radio"
path = "src/main.rs"

[[bin]]
name = "oer-firmware-probes-esp32c5-radio-dma"
path = "src/dma.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { workspace = true, features = ["esp32c5", "static-interrupts", "rt", "unstable"] }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32c5"] }

[build-dependencies]
oer-probe-codegen = { path = "../../../tools/probe/codegen" }
oer-esp32c5-layout = { path = "../../../chips/esp32c5/layout", features = ["build"] }

[lints]
workspace = true

