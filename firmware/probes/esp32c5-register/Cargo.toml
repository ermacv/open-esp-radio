[package]
name = "oer-firmware-probes-esp32c5-register"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false
description = "Board observation of the ESP32-C5 radio register model"

[dependencies]
oer-esp32c5-esp-hal-soc = { path = "../../../chips/esp32c5/esp-hal-soc", features = ["esp32c5"] }
esp-backtrace = { git = "https://github.com/ermacv/esp-hal", rev = "0f67296516aa33703fcd23e2402acc557705bf6a", default-features = false, features = ["esp32c5", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "0f67296516aa33703fcd23e2402acc557705bf6a", default-features = false, features = ["esp32c5"] }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "0f67296516aa33703fcd23e2402acc557705bf6a", default-features = false, features = ["esp32c5", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", rev = "0f67296516aa33703fcd23e2402acc557705bf6a", default-features = false, features = ["auto", "esp32c5"] }
esp32c5 = { git = "https://github.com/ermacv/esp-pacs", rev = "a1f6cf68e", default-features = false }
oer-esp32c5-hal = { path = "../../../chips/esp32c5/hal" }
oer-esp32c5-pac = { path = "../../../chips/esp32c5/pac" }
oer-esp32c5-pac-raw = { path = "../../../chips/esp32c5/pac-raw" }
oer-espressif-analog = { path = "../../../chips/espressif/analog" }

[lints]
workspace = true
