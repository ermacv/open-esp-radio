[package]
name = "oer-firmware-platform-esp32c5-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oer-firmware-platform-esp32c5-layout.workspace = true
oer-firmware-platform-espressif-staged-bootstrap = { path = "../../espressif/staged-bootstrap", features = ["esp32c5"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c5"] }
esp-hal = { workspace = true, features = ["esp32c5", "static-interrupts", "rt", "unstable"] }
oer-firmware-platform-esp32c5-board = { path = "../board" }

[build-dependencies]
oer-firmware-platform-esp32c5-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

