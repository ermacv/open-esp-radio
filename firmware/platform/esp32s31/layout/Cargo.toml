[package]
name = "oer-firmware-platform-esp32s31-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Staged-boot address map of ESP32-S31-Function-CoreBoard-1"

[features]
# Link a binary with the shared linker scripts from a Cargo build script
# (requires std).
build = ["oer-firmware-platform-espressif-staged-layout/build"]

[dependencies]
oer-firmware-platform-espressif-staged-layout = { path = "../../espressif/staged-layout" }

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["build"]

[package.metadata.open-radio]
layer = "platform"
platform = "chip"
chip = "esp32s31"
