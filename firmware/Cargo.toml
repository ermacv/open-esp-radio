# The chip-target workspace: the staged boot shared by the Espressif chips
# (`platform/espressif`), the ESP32-S31 board, bootstrap and address map
# (`platform/esp32s31`) and, later, the images. It builds for
# `riscv32imafc-unknown-none-elf`; the radio libraries it links live in the
# host workspace at the repository root and are tested there.
[workspace]
resolver = "3"
members = [
    "platform/espressif/staged-bootstrap",
    "platform/espressif/staged-layout",
    "platform/espressif/staged-runtime",
    "platform/esp32s31/board",
    "platform/esp32s31/bootstrap",
    "platform/esp32s31/layout",
    "apps/boot-smoke",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
debug_assert_with_mut_call = "deny"
# The repository `clippy.toml` lists methods radio code must not call.
disallowed_methods = "deny"

[workspace.dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false }
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false }
static_cell = "2.1.1"
oer-espressif-staged-layout = { path = "platform/espressif/staged-layout" }
oer-espressif-interrupt-table-esp-hal = { path = "../crates/exec/esp-hal-irq" }
oer-esp32s31-platform-layout = { path = "platform/esp32s31/layout" }
oer-esp32s31-soc-esp-hal = { path = "../crates/adapters/esp-hal/soc", features = ["esp32s31"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = true
panic = "abort"
strip = false

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
