[package]
name = "oer-firmware-bootstrap-esp32c5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oer-platform-esp32c5-layout.workspace = true
oer-platform-staged-bootstrap = { path = "../../../chips/platform/staged-bootstrap", features = ["esp32c5"] }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c5"] }
esp-hal = { workspace = true, features = ["esp32c5", "static-interrupts", "rt", "unstable"] }
oer-platform-esp32c5-board = { path = "../../../chips/platform/esp32c5-board" }

[build-dependencies]
oer-platform-esp32c5-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

