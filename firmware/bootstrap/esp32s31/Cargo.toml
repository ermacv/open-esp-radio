[package]
name = "oer-firmware-bootstrap-esp32s31"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
oer-esp32s31-layout.workspace = true
oer-espressif-staged-bootstrap = { path = "../../../chips/espressif/staged-bootstrap", features = ["esp32s31"] }
esp-bootloader-esp-idf = { workspace = true, features = ["embedded-storage", "esp32s31"] }
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-esp-hal-soc.workspace = true
static_cell.workspace = true

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true
