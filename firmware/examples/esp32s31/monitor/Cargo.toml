[package]
name = "oer-esp32s31-example-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
oer-espressif-staged-runtime = { path = "../../../platform/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-esp32s31-platform-board = { path = "../../../platform/esp32s31/board", features = ["stage-two"] }
embassy-executor = { version = "0.10.0", default-features = false }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
esp-println = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["auto", "esp32s31", "log-04"] }
oer = { package = "open-esp-radio", path = "../../../crates/oer", default-features = false, features = ["owned-xarxa"] }
oer-espressif-executor-embassy = { path = "../../../crates/adapters/embassy/espressif/executor", features = ["esp32s31"] }
static_cell = "2.1.1"

[build-dependencies]
oer-esp32s31-platform-layout = { path = "../../../platform/esp32s31/layout", features = ["build"] }


[lints]
workspace = true
