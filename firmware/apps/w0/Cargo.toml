[package]
name = "oer-firmware-apps-w0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "W0: the radio system registers the PHY, joins, tracks and leaves Wi-Fi once, and logs what it measured"
build = "build.rs"

[dependencies]
embassy-executor = { version = "0.10.0", default-features = false }
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
static_cell = { workspace = true }
oer-platform-esp32s31-board = { path = "../../../chips/platform/esp32s31-board" }
oer-platform-staged-runtime = { path = "../../../chips/platform/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-exec-executor = { path = "../../../chips/exec/executor", features = ["esp32s31"] }
oer-adapters-esp-hal-radio = { path = "../../../chips/adapters/esp-hal/radio", features = ["esp32s31"] }
oer-adapters-embassy-time = { path = "../../../portable/adapters/embassy/time" }
oer-base-time = { path = "../../../portable/base/time" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy", features = ["registration-diagnostics"] }
oer-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client", features = ["registration-diagnostics"] }
oer-esp32s31-radio-system = { path = "../../../chips/esp32s31/radio/system", features = ["registration-diagnostics"] }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver" }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac" }
oer-ieee80211-mac = { path = "../../../portable/ieee80211/mac" }
oer-ieee80211-softmac = { path = "../../../portable/ieee80211/softmac" }

[build-dependencies]
oer-platform-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true
