[package]
name = "oer-firmware-apps-boot-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The smallest staged image: boots through the staged runtime, reports the previous panic and passes"
build = "build.rs"

[dependencies]
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31"] }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
# Every task stack of this image is fully analysed: an unresolved path fails `cargo fw build`.
task-stack = "proven"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { chips = 1, firmware = 21, esp-hal = 6, unnamed = 2 }
bootstrap = { esp-hal = 8, unnamed = 2 }
