[package]
name = "oer-firmware-apps-boot-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The smallest staged image: boots through the staged runtime, reports the previous panic and passes"
build = "build.rs"

[dependencies]
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
oer-firmware-platform-esp32s31-board = { path = "../../platform/esp32s31/board" }
oer-firmware-platform-espressif-staged-runtime = { path = "../../platform/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }

[build-dependencies]
oer-firmware-platform-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true
