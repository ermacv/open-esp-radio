[package]
name = "oer-firmware-apps-radio-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Claims the radio root and requests and releases each platform clock once; no RF"
build = "build.rs"

[dependencies]
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31"] }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
# Every task stack of this image is fully analysed: an unresolved path fails `cargo fw build`.
task-stack = "proven"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { chips = 1, firmware = 21, unnamed = 2 }
bootstrap = { unnamed = 2 }
