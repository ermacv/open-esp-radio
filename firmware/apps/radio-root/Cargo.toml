[package]
name = "oer-firmware-apps-radio-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Takes the radio root from esp-hal and requests and releases each platform clock once; no RF"
build = "build.rs"

[dependencies]
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
oer-firmware-platform-esp32s31-board = { path = "../../platform/esp32s31/board" }
oer-firmware-platform-espressif-staged-runtime = { path = "../../platform/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-adapters-esp-hal-radio = { path = "../../../crates/adapters/esp-hal/radio", features = ["esp32s31"] }
oer-esp32s31-hal = { path = "../../../crates/esp32s31/hal" }

[build-dependencies]
oer-firmware-platform-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true
