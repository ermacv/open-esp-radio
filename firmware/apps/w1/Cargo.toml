[package]
name = "oer-esp32s31-w1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "W1: a passive scan on the product receive path, which measures the receive runner's provisional constants and checks the stand's beacons"
build = "build.rs"

[dependencies]
atomic-waker = "1.1.2"
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
heapless = "0.9.3"
static_cell = { workspace = true }
oer-esp32s31-platform-board = { path = "../../platform/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../platform/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-espressif-interrupt-table-esp-hal = { workspace = true }
oer-espressif-executor-embassy = { path = "../../../crates/exec/executor", features = ["esp32s31", "timer-observation", "poll-timing"] }
oer-esp32s31-radio-esp-hal = { path = "../../../crates/adapters/esp-hal/radio", features = ["esp32s31"] }
oer-time-embassy = { path = "../../../crates/adapters/embassy/time" }
oer-time = { path = "../../../crates/base/time" }
oer-memory = { path = "../../../crates/base/memory" }
oer-esp32s31-hal = { path = "../../../crates/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../crates/esp32s31/phy" }
oer-esp32s31-radio-client = { path = "../../../crates/esp32s31/radio/client" }
oer-esp32s31-radio-system = { path = "../../../crates/esp32s31/radio/system" }
oer-esp32s31-ieee80211 = { path = "../../../crates/esp32s31/ieee80211/driver" }
oer-esp32s31-ieee80211-dma = { path = "../../../crates/esp32s31/ieee80211/dma" }
oer-esp32s31-ieee80211-mac = { path = "../../../crates/esp32s31/ieee80211/mac" }
oer-ieee80211-mac = { path = "../../../crates/ieee80211/mac" }
oer-ieee80211-runtime = { path = "../../../crates/ieee80211/runtime" }
oer-ieee80211-softmac = { path = "../../../crates/ieee80211/softmac" }

[build-dependencies]
oer-esp32s31-platform-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true
