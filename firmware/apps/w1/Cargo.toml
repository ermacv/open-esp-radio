[package]
name = "oer-firmware-apps-w1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "W1: a passive scan on the product receive path, which measures the receive runner's provisional constants and checks the stand's beacons"
build = "build.rs"

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-sort = { path = "../../../portable/sort" }
oer-sync = { path = "../../../portable/sync" }
crc = { version = "=3.4.0", default-features = false }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port" }
embassy-futures = "0.1.2"
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
heapless = "0.9.3"
static_cell = { workspace = true }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-espressif-esp-hal-irq = { workspace = true }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["esp32s31"] }
oer-espressif-esp-hal-radio = { path = "../../../chips/espressif/esp-hal/radio", features = ["esp32s31"] }
oer-espressif-esp-hal-soc.workspace = true
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-interrupt-table = { path = "../../../portable/interrupt-table" }
oer-memory = { path = "../../../portable/memory" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
oer-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client" }
oer-esp32s31-radio-system = { path = "../../../chips/esp32s31/radio/system" }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver" }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime" }
oer-ieee80211-softmac = { path = "../../../protocols/ieee80211/softmac" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
# `cargo fw` builds this image with `cfg(oer_profile)`: the executor's poll cycles and timer windows it measures.
instrumentation = ["profile"]

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { pac = 11, hal = 24, chips = 356, portable = 17, firmware = 65, core = 3, embassy = 2, esp-hal = 7, third-party = 2, unnamed = 13, hardware = 12 }
bootstrap = { esp-hal = 8, unnamed = 2 }
