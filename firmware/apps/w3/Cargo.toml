[package]
name = "oer-firmware-apps-w3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "W3: open station association, DHCP and bidirectional ICMP acceptance"

[dependencies]
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "4868fd9acfd4191173cd6531b537d6009d3ae5d0", features = ["medium-ethernet", "ipv4", "dhcpv4", "raw-ip", "icmp-ping-reply"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-sync = "0.8.0"
embassy-executor = { version = "0.10.0", default-features = false }
embassy-futures = "0.1.2"
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
heapless = "0.9.3"
static_cell = { workspace = true }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "9e0e3293724c30c5892e6af56150c849f5231eb2", features = ["async"] }
oer-radio-port = { path = "../../../protocols/radio/port" }
oer-ieee80211-arbiter = { path = "../../../protocols/ieee80211/arbiter" }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta" }
oer-espressif-ieee80211-policy = { path = "../../../chips/espressif/ieee80211-policy" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port" }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-espressif-esp-hal-irq = { workspace = true }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["esp32s31", "port-slots"] }
oer-espressif-esp-hal-radio = { path = "../../../chips/espressif/esp-hal/radio", features = ["esp32s31"] }
oer-embassy-net = { path = "../../../portable/embassy/net" }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-interrupt-table = { path = "../../../portable/interrupt-table" }
oer-memory = { path = "../../../portable/memory" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
oer-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client" }
oer-esp32s31-radio-system = { path = "../../../chips/esp32s31/radio/system" }
oer-esp32s31-radio-coex = { path = "../../../chips/esp32s31/radio/coex" }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver" }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime" }

[dev-dependencies]
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true
