[package]
name = "oer-firmware-apps-w3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "W3: open station association, DHCP and bidirectional ICMP acceptance"

[dependencies]
oer-esp32s31-wifi = { path = "../../../chips/esp32s31/wifi" }
oer-network = { path = "../../../protocols/network" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-ieee80211-cipher = { path = "../../../protocols/ieee80211/cipher" }
oer-ieee80211-instrumentation = { path = "../../../protocols/ieee80211/instrumentation" }
oer-trace = { path = "../../../portable/trace" }
oer-memory = { path = "../../../portable/memory" }
oer-embassy-net = { path = "../../../portable/embassy/net" }
embassy-futures = "0.1.2"
oer-time = { path = "../../../portable/time" }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "17f796c8ddb90ff510d995e24c2dcb758a97e8f8", features = ["medium-ethernet", "ipv4", "dhcpv4", "raw-ip", "icmp-ping-reply"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
heapless = "0.9.3"
static_cell = { workspace = true }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "6f5ae91f9269ec3151d1aa61d0cfe0f3ae1b0798", features = ["async"] }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose", features = ["wifi-fault"] }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["port-slots"] }
oer-espressif-usb-serial-jtag.workspace = true
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }

[dev-dependencies]
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime" }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta" }
oer-memory = { path = "../../../portable/memory", features = ["host-context"] }
tempfile = "=3.27.0"
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "6f5ae91f9269ec3151d1aa61d0cfe0f3ae1b0798", features = ["async"] }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"
# The report's service receive row counts the station service's observations.
instrumentation = ["trace"]
# Every task stack of this image is fully analysed: an unresolved path fails `cargo fw build`.
task-stack = "proven"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { pac = 11, hal = 39, chips = 488, portable = 49, protocols = 187, firmware = 80, core = 17, embassy = 34, third-party = 63, unnamed = 13, hardware = 11 }
bootstrap = { unnamed = 2 }
