schema = 5
coverage_policy = "../../../chips/espressif/staged-layout/stack-coverage.toml"
max_move_bytes = 4096

# W3's portable station and IP call chain runs on P1 in PSRAM. The task
# stack is sized by the linker from its proven bound; IRQ stacks likewise.
[cpu0_task_stack]
root = "runtime_main"
bottom_symbol = "__runtime_cpu0_task_stack_bottom"
top_symbol = "__runtime_cpu0_task_stack_top"
minimum_free_bytes = 16384

[interrupt_stacks]

[bootstrap_stack]
root = "_start_rust"
bottom_symbol = "_stack_end"
top_symbol = "_stack_start"
minimum_free_bytes = 4096
# The bootstrap jumps to stage two's entry and never uses its stack again;
# the checks verify both facts in the ELFs.
handoff = "_runtime_start"
