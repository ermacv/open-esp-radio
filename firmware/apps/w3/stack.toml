schema = 5
coverage_policy = "../../../chips/espressif/staged-layout/stack-coverage.toml"
max_move_bytes = 4096

# W3's portable station and IP call chain runs on P1 in PSRAM. This
# allocation belongs only to this image; interrupt stacks keep the chip size.
[cpu0_task_stack]
root = "runtime_main"
bottom_symbol = "__runtime_cpu0_task_stack_bottom"
top_symbol = "__runtime_cpu0_task_stack_top"
minimum_free_bytes = 16384
# Observed P1 bound: 41120 + ? bytes, plus the 16384-byte reserve.
allocation_bytes = 57504

[interrupt_stacks]
minimum_free_bytes = 4096

[bootstrap_stack]
root = "_start_rust"
bottom_symbol = "_stack_end"
top_symbol = "_stack_start"
minimum_free_bytes = 4096
