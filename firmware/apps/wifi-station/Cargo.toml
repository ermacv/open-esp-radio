[package]
name = "oer-firmware-apps-wifi-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "Wi-Fi station of a build profile; without a profile it reports NotConfigured and starts no RF"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-esp32s31-wifi = { path = "../../../chips/esp32s31/wifi" }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose", features = ["wifi-fault", "radio-fault"] }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["port-slots"] }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-memory = { path = "../../../portable/memory" }
oer-time = { path = "../../../portable/time" }
oer-trace = { path = "../../../portable/trace" }
static_cell = { workspace = true }

[dev-dependencies]
toml = "=1.1.4"
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-contracts-port = { path = "../../../protocols/ieee80211/contracts/port" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }
toml = "=1.1.4"
# The profile's country and channel are checked against the same domain
# table and channel permit as the image's configuration.
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-contracts-port = { path = "../../../protocols/ieee80211/contracts/port" }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
