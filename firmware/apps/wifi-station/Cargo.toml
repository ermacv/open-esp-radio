[package]
name = "oer-firmware-apps-wifi-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "Wi-Fi station of a build profile; without a profile it reports NotConfigured and starts no RF"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-espressif = { path = "../../../sdk/espressif", features = ["esp32s31", "hart1"] }

[features]
# The station of a profile: the SDK's Wi-Fi. A build with a profile needs it,
# one without builds the NotConfigured image, which links no Wi-Fi.
station = ["oer-espressif/wifi"]

[dev-dependencies]
toml = "=1.1.4"
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-contracts-port = { path = "../../../protocols/ieee80211/contracts/port" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }
toml = "=1.1.4"
# The profile's country and channel are checked against the same domain
# table and channel permit as the image's configuration.
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-contracts-port = { path = "../../../protocols/ieee80211/contracts/port" }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"
# The harts this image runs: hart 1 starts during boot and runs the second
# boot's IP service and TCP exchange on its own executor.
harts = ["boot", 1]

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
