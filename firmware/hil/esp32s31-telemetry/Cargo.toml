[package]
name = "oer-hil-esp32s31-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ESP32-S31 qualification observers for open-esp-radio HIL"

[features]
tx-wait-probe = []
rx-ownership-observation = ["dep:oer-esp32s31-ieee80211-dma", "oer-esp32s31-ieee80211-dma/rx-ownership-observation"]

[dependencies]
oer-esp32s31-ieee80211-dma = { path = "../../../crates/esp32s31/ieee80211/dma", optional = true }
oer-ieee80211-softmac = { path = "../../../crates/ieee80211/softmac" }
oer-ieee80211-mac = { path = "../../../crates/ieee80211/mac" }
oer-esp32s31-ieee80211-mac = { path = "../../../crates/esp32s31/ieee80211/mac" }
oer-esp32s31-ieee80211-runtime = { path = "../../../crates/esp32s31/ieee80211/runtime", default-features = false }
oer-hil-protocol = { path = "../../../tools/lib/data/hil-protocol", default-features = false, features = ["wifi"] }


[lints]
workspace = true
