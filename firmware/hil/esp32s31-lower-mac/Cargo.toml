[package]
name = "oer-firmware-hil-esp32s31-lower-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "Lower-MAC hardware conformance through the ESP32-S31 port"
build = "build.rs"

[features]
diagnostic-lower-mac = []

[target.'cfg(target_arch = "riscv32")'.dependencies]
sha2 = { version = "0.10", default-features = false }
embassy-sync = "0.8.0"
oer-trace = { path = "../../../portable/trace" }
oer-hil-agent = { path = "../../../protocols/hil/agent" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", default-features = false, features = ["lower-mac", "async-io"] }
oer-radio-port = { path = "../../../protocols/radio/port" }
oer-espressif-coex = { path = "../../../chips/espressif/coex" }
oer-espressif-ieee80211-policy = { path = "../../../chips/espressif/ieee80211-policy" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port", features = ["test-support"] }
atomic-waker = "1.1.2"
embassy-futures = "0.1.2"
heapless = "0.9.3"
static_cell = { workspace = true }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-usb-serial-jtag.workspace = true
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31", "wifi-fault"] }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["esp32s31", "port-slots"] }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-memory = { path = "../../../portable/memory" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
oer-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client" }
oer-esp32s31-radio-system = { path = "../../../chips/esp32s31/radio/system" }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver" }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true


[package.metadata.open-radio]
critical-section-hart = "boot"
instrumentation = ["trace", "debug-control"]

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { pac = 11, hal = 40, chips = 492, portable = 29, protocols = 44, firmware = 170, core = 28, embassy = 2, third-party = 1, unnamed = 13, hardware = 11 }
bootstrap = { unnamed = 2 }
