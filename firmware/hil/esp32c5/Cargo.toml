[package]
name = "oer-firmware-hil-esp32c5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The minimal image that proves the esp32c5 staged boot: the bootstrap
# stages this runtime into PSRAM, which starts Embassy and wakes once on its
# timer.
boot-smoke = []
# The radio-free SoC image: the HIL protocol console, the SoC deadline
# watchdog and the reset-retained post-mortem, for the `system-watchdog`
# scenarios. A panic records the post-mortem through the platform's panic
# entry before the reset.
system-watchdog = [
    "oer-espressif-staged-runtime/panic-hook",
    "dep:critical-section",
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:oer-embassy-time",
    "dep:oer-hil-protocol",
    "dep:oer-hil-agent",
    "dep:oer-hil-protocol",
]

[dependencies]
embassy-time.workspace = true
esp-hal.workspace = true
oer-espressif-staged-runtime = { workspace = true, features = ["esp32c5"] }
oer-esp32c5-board.workspace = true
oer-espressif-usb-serial-jtag.workspace = true
embedded-io-async = "0.7.0"
oer-interrupt-table = { path = "../../../portable/interrupt-table" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-executor = { workspace = true, features = ["esp32c5"] }
oer-espressif-esp-hal-irq = { workspace = true, features = ["esp32c5"] }
critical-section = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
oer-esp32c5-esp-hal-soc = { workspace = true, features = ["esp32c5"] }
oer-esp32c5-hal = { path = "../../../chips/esp32c5/hal" }
oer-embassy-time = { path = "../../../portable/embassy/time", optional = true }
oer-hil-protocol = { workspace = true, optional = true }
oer-hil-agent = { workspace = true, optional = true }
static_cell.workspace = true

[build-dependencies]
oer-esp32c5-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { chips = 71, portable = 37, firmware = 23, core = 2, embassy = 4, esp-hal = 14, unnamed = 7, hardware = 6 }
bootstrap = { esp-hal = 9 }
