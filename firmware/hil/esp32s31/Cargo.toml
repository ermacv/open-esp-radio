[package]
name = "oer-firmware-hil-esp32s31"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
build = "build.rs"

[features]
# The HIL report of a panic instead of the product's record-and-reset, which
# the image's entry names as its panic hook; every image but
# `system-panic-reset` has it.
panic-hook = []
boot-smoke = ["panic-hook"]
system-watchdog = [
    "panic-hook",
    "dep:oer-hil-protocol",
    "dep:embassy-sync",
    "dep:oer-hil-agent",
    "dep:oer-hil-protocol",
]
# The system image that, on request, switches its USB Serial/JTAG off its
# pads: the board leaves USB, as a stand recovery must handle.
usb-jtag-off = ["system-watchdog"]
# Host-requested resets use the product's retained path without a panic hook;
# the next boot reports HilRequested.
system-panic-reset = [
    "dep:oer-hil-protocol",
    "dep:embassy-sync",
    "dep:oer-hil-agent",
    "dep:oer-hil-protocol",
]
wifi-station = [
    "oer-esp32s31-compose/wifi-fault",
    "dep:oer-network-control",
    "dep:oer-ieee80211-control",
    "dep:oer-esp32s31-wifi",
    "panic-hook",
    "dep:oer-hil-protocol",
    "dep:embassy-sync",
    "dep:oer-hil-agent",
    "dep:embassy-futures",
    "dep:heapless",
    "dep:oer-embassy-net",
    "dep:oer-ieee80211-runtime",
    "dep:oer-ieee80211-cipher",
    "dep:owned-embassy-net",
    "oer-espressif-executor/port-slots",
    "dep:oer-ieee80211-instrumentation",
    "dep:oer-trace",
]

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-network-control = { path = "../../../protocols/network-control", optional = true }
oer-ieee80211-control = { path = "../../../protocols/ieee80211/control", optional = true }
oer-esp32s31-wifi = { path = "../../../chips/esp32s31/wifi", optional = true }
oer-time = { path = "../../../portable/time" }
embassy-futures = { version = "0.1.2", optional = true }
heapless = { version = "0.9.3", optional = true }
oer-embassy-net = { path = "../../../portable/embassy/net", optional = true }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime", features = ["placement"], optional = true }
oer-ieee80211-cipher = { path = "../../../protocols/ieee80211/cipher", optional = true }
oer-ieee80211-instrumentation = { path = "../../../protocols/ieee80211/instrumentation", optional = true }
oer-trace = { path = "../../../portable/trace", optional = true }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "17f796c8ddb90ff510d995e24c2dcb758a97e8f8", optional = true, features = ["medium-ethernet", "ipv4", "dhcpv4", "icmp-ping-reply"] }
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
embassy-sync = { workspace = true, optional = true }
embassy-time.workspace = true
critical-section = "1.2.0"
oer-espressif-executor.workspace = true
oer-hil-protocol = { workspace = true, optional = true, features = ["async-io"] }
oer-hil-agent = { path = "../../../protocols/hil/agent", optional = true, default-features = false }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose" }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-usb-serial-jtag.workspace = true
embedded-io-async = "0.7.0"
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout" }
static_cell.workspace = true

[dev-dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-network-control = { path = "../../../protocols/network-control" }
oer-ieee80211-control = { path = "../../../protocols/ieee80211/control" }
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-hil-protocol = { workspace = true }

[lints]
workspace = true

[build-dependencies]
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout", features = ["build"] }

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { pac = 11, hal = 39, chips = 489, portable = 122, protocols = 191, firmware = 69, core = 20, embassy = 66, third-party = 63, unnamed = 13, hardware = 11 }
bootstrap = { unnamed = 2 }

[package.metadata.open-radio]
critical-section-hart = "boot"
# The wifi-station class reports the station service's observations; the
# class is declared for the package, so every class builds with it.
instrumentation = ["trace"]
