[package]
name = "oer-firmware-hil-esp32s31"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# The HIL report of a panic instead of the product's record-and-reset; every
# image but `system-panic-reset` has it.
panic-hook = ["oer-espressif-staged-runtime/panic-hook"]
boot-smoke = ["panic-hook"]
system-watchdog = [
    "panic-hook",
    "dep:oer-hil-protocol",
    "dep:embassy-sync",
    "dep:oer-hil-agent",
    "dep:oer-hil-protocol",
]
# The system image that, on request, switches its USB Serial/JTAG off its
# pads: the board leaves USB, as a stand recovery must handle.
usb-jtag-off = ["system-watchdog"]
# The product panic entry alone: a panic records itself and resets the chip,
# and the next boot reports the record.
system-panic-reset = [
    "dep:oer-hil-protocol",
    "dep:embassy-sync",
    "dep:oer-hil-agent",
    "dep:oer-hil-protocol",
]
wifi-station = [
    "dep:oer-firmware-apps-w3",
    "panic-hook",
    "dep:oer-hil-protocol",
    "oer-hil-protocol/wifi",
    "oer-hil-protocol/network",
    "dep:embassy-sync",
    "dep:oer-hil-agent",
    "dep:embassy-futures",
    "dep:heapless",
    "dep:xarxa-driver",
    "dep:oer-radio-port",
    "dep:oer-ieee80211-sta",
    "dep:oer-espressif-ieee80211-policy",
    "dep:oer-ieee80211-upper-mac",
    "dep:oer-ieee80211-port",
    "dep:oer-espressif-esp-hal-radio",
    "dep:oer-embassy-net",
    "dep:oer-embassy-time",
    "dep:oer-interrupt-table",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-radio-client",
    "dep:oer-esp32s31-radio-system",
    "dep:oer-esp32s31-radio-coex",
    "dep:oer-esp32s31-ieee80211-driver",
    "dep:oer-esp32s31-ieee80211-mac",
    "dep:oer-ieee80211-wire",
    "dep:oer-radio-regulatory",
    "dep:oer-ieee80211-runtime",
    "dep:oer-ieee80211-rsn",
    "dep:owned-embassy-net",
    "oer-espressif-executor/port-slots",
    "dep:oer-time",
    "dep:oer-ieee80211-arbiter",
]

[dependencies]
oer-firmware-apps-w3 = { path = "../../apps/w3", optional = true }
oer-time = { path = "../../../portable/time", optional = true }
oer-ieee80211-arbiter = { path = "../../../protocols/ieee80211/arbiter", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
heapless = { version = "0.9.3", optional = true }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "ed9bf37f25c610566033e31abd14d7eb5096d93f", features = ["async"], optional = true }
oer-radio-port = { path = "../../../protocols/radio/port", optional = true }
oer-ieee80211-sta = { path = "../../../protocols/ieee80211/sta", optional = true }
oer-espressif-ieee80211-policy = { path = "../../../chips/espressif/ieee80211-policy", optional = true }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac", optional = true }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port", optional = true }
oer-espressif-esp-hal-radio = { path = "../../../chips/espressif/esp-hal/radio", features = ["esp32s31"], optional = true }
oer-embassy-net = { path = "../../../portable/embassy/net", optional = true }
oer-embassy-time = { path = "../../../portable/embassy/time", optional = true }
oer-interrupt-table = { path = "../../../portable/interrupt-table", optional = true }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal", optional = true }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy", optional = true }
oer-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client", optional = true }
oer-esp32s31-radio-system = { path = "../../../chips/esp32s31/radio/system", optional = true }
oer-esp32s31-radio-coex = { path = "../../../chips/esp32s31/radio/coex", optional = true }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver", optional = true }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac", optional = true }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire", optional = true }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", optional = true }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime", features = ["placement"], optional = true }
oer-ieee80211-rsn = { path = "../../../protocols/ieee80211/rsn", optional = true }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "0c018c843303508300cbb15fb3be0ee7d58862ab", optional = true, features = ["medium-ethernet", "ipv4", "dhcpv4", "raw-ip", "icmp-ping-reply"] }
oer-memory = { path = "../../../portable/memory" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
embassy-executor.workspace = true
embassy-sync = { workspace = true, optional = true }
embassy-time.workspace = true
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
critical-section = "1.2.0"
oer-espressif-esp-hal-soc.workspace = true
oer-espressif-executor = { workspace = true, features = ["esp32s31"] }
oer-espressif-esp-hal-irq.workspace = true
oer-hil-protocol = { workspace = true, optional = true, features = ["async-io"] }
oer-hil-agent = { path = "../../../portable/hil-agent", optional = true, default-features = false }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-usb-fifo = { workspace = true, features = ["esp32s31"] }
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout" }
static_cell.workspace = true

[lints]
workspace = true

[build-dependencies]
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout", features = ["build"] }

