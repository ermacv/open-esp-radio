[package]
name = "oer-firmware-hil-esp32s31-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Diagnostic PHY capture through public state and typed register reads"
build = "build.rs"

[package.metadata.open-radio]
instrumentation = ["profile", "debug-control"]

[features]
diagnostic-phy = []

[dependencies]
oer-memory = { path = "../../../portable/memory" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
heapless = { version = "0.9.3", features = ["serde"] }
embassy-sync = "0.8.0"
oer-hil-protocol = { path = "../../../protocols/hil/protocol", default-features = false, features = ["phy", "async-io"] }
oer-hil-agent = { path = "../../../portable/hil-agent" }
oer-espressif-esp-hal-irq = { path = "../../../chips/espressif/esp-hal-irq" }
embassy-executor = { version = "0.10.0", default-features = false }
esp-hal = { workspace = true, features = ["esp32s31", "static-interrupts", "rt", "unstable"] }
static_cell = { workspace = true }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-usb-fifo = { workspace = true, features = ["esp32s31"] }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime", features = ["esp32s31", "two-harts"] }
oer-espressif-executor = { path = "../../../chips/espressif/executor", features = ["esp32s31"] }
oer-espressif-esp-hal-radio = { path = "../../../chips/espressif/esp-hal/radio", features = ["esp32s31"] }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-phy = { path = "../../../chips/esp32s31/phy" }
oer-esp32s31-ieee80211-driver = { path = "../../../chips/esp32s31/ieee80211/driver" }
oer-esp32s31-ieee80211-mac = { path = "../../../chips/esp32s31/ieee80211/mac" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }

oer-espressif-ieee802154-engine = { path = "../../../chips/espressif/ieee802154-engine" }
oer-esp32s31-knowledge = { path = "../../../chips/esp32s31/knowledge" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }
oer-registers-model = { path = "../../../tools/registers/model" }

[lints]
workspace = true
