# The check of main, run after every merge. Pull requests run nothing:
# the owner merges them and main may be red; the result tells whoever broke
# it to fix it.
name: ci

on:
  push:
    branches: [main]
  # A run of main or of a branch started by hand.
  workflow_dispatch:

# Runs of one ref queue behind each other; runs of different refs never touch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Pinned ESP-IDF sources
        # The IEEE 802.15.4 host stand compiles the pinned ESP-IDF driver
        # sources in its build script; fetch exactly those pins.
        run: |
          cargo pins fetch --chip esp32s31 $(sed -n 's/^id = "\(esp-idf\/[^"]*\)"/\1/p' \
            chips/esp32s31/vendor/artifacts.toml)
      - name: Clippy
        run: |
          # One JSON run: its errors fail the step, its warnings are only
          # counted per package.
          status=0
          cargo clippy --all-targets --locked --message-format=json \
            > "$RUNNER_TEMP/clippy.json" || status=$?
          jq -rs '[.[] | select(.reason == "compiler-message") | .message.rendered]
            | unique | .[]' "$RUNNER_TEMP/clippy.json" || true
          echo "Clippy warnings per package:"
          jq -rs '
            [ .[]
              | select(.reason == "compiler-message" and .message.level == "warning")
              | { package: (.package_id
                            | (capture("#(?<name>[^@]+)@").name
                               // (split("#")[0] | split("/") | last))),
                  message: .message.rendered } ]
            | unique
            | group_by(.package)
            | map([.[0].package, length])
            | sort_by(-.[1], .[0])
            | (["package", "warnings"], .[], ["total", (map(.[1]) | add // 0)])
            | @tsv' "$RUNNER_TEMP/clippy.json" \
            | awk -F '\t' '{ printf "%-40s %s\n", $1, $2 }' || true
          exit "$status"
      - name: Tests
        # The default members: every package but the chip-only firmware ones.
        # This includes host tests of chips/espressif/interrupt-table.
        run: cargo test --locked
      - name: Tests in the feature sets the workspace run does not build
        run: |
          # The workspace run unifies features: sta and the S31 driver are built
          # with test-support. This list records the other sets.
          cargo test --locked -p oer-hil-agent -p oer-esp32s31-phy --features oer-hil-agent/health,oer-esp32s31-phy/radio-health
          cargo clippy --locked -p oer-hil-agent -p oer-esp32s31-phy --features oer-hil-agent/health,oer-esp32s31-phy/radio-health --all-targets
          cargo test --locked -p oer-ieee80211-sta
          cargo test --locked -p oer-esp32s31-ieee80211-driver
          cargo test --locked -p oer-time --features serde
          cargo test --locked -p oer-time --features schema
          cargo test --locked -p oer-espressif-executor --features port-slots --lib --test slots
          cargo clippy --locked -p oer-espressif-executor --features port-slots --all-targets
      - name: Tests under each instrumentation cfg
        # The default members whose sources hold code under an
        # instrumentation class's cfg, tested once with it, each cfg in a
        # target directory of its own.
        run: |
          meta=$(cargo metadata --format-version 1 --no-deps --locked)
          members=$(jq -r '.workspace_default_members as $members | .packages[]
            | select(.id as $id | $members | index($id))
            | .name + " " + (.manifest_path | rtrimstr("/Cargo.toml"))' <<<"$meta")
          for cfg in oer_trace oer_debug_control; do
            packages=$(while read -r name directory; do
              if grep -rqE --include='*.rs' "cfg!?\(.*\b$cfg\b" "$directory"; then
                echo "-p $name"
              fi
            done <<<"$members")
            echo "cfg($cfg):" $packages
            # UI tests run nested Cargo from the package directory. Keep its
            # target directory identical to the outer workspace invocation.
            RUSTFLAGS="--cfg $cfg" CARGO_TARGET_DIR="$PWD/target/cfg/$cfg" \
              cargo test --locked $packages
          done

  chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Portable and chip libraries for the chip target
        # Every library of protocols/, portable/ and chips/ builds for the chip;
        # the platform packages (the boards and the staged runtime and
        # bootstrap) are checked with the images.
        # chips/espressif/interrupt-table is included by the chips/ selection.
        run: |
          packages=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.manifest_path | test("/(protocols|portable|chips)/"))
              | select(.manifest_path | test("/chips/(esp32s31/board|espressif/staged-(runtime|bootstrap))/") | not) | "-p " + .name')
          cargo check --locked --target riscv32imafc-unknown-none-elf $packages
      - name: Clippy for the chip target
        # Firmware chip APIs are checked separately from host packages.
        run: |
          : > "$RUNNER_TEMP/empty-runtime.bin"
          export PSRAM_RUNTIME_BIN="$RUNNER_TEMP/empty-runtime.bin"
          meta=$(cargo metadata --format-version 1 --no-deps --locked)
          # A package that declares instrumentation classes is checked apart,
          # with their cfgs, as `cargo fw` builds it.
          firmware() {
            jq -r '.packages[]
              | select(.manifest_path | test("/firmware/(apps|bootstrap)/|/chips/(esp32s31/board|espressif/staged-(runtime|bootstrap))/"))
              | select(.metadata."open-radio".instrumentation == null)
              | "-p " + .name' <<<"$meta"
          }
          # HIL classes use their build recipes for features and cfgs.
          cargo hil images check --instrumented --clippy
          # `<package> <target> <cfg flags>` of each other instrumented image.
          instrumented() {
            jq -r '.packages[]
              | select(.metadata."open-radio".instrumentation != null)
              | select(.manifest_path | contains("/firmware/hil/") | not)
              | [.name,
                 "riscv32imafc-unknown-none-elf",
                 (.metadata."open-radio".instrumentation
                  | map("--cfg oer_" + gsub("-"; "_")) | join(" "))]
              | join(" ")' <<<"$meta"
          }
          # The image crates that declare tasks take `type_alias_impl_trait`
          # through RUSTC_BOOTSTRAP in .cargo/config.toml.
          cargo clippy --locked --target riscv32imafc-unknown-none-elf $(firmware)
          # Each in a target directory of its own, as `cargo fw` keeps the
          # plain cache free of the cfgs.
          while read -r package target cfgs; do
            RUSTFLAGS="$cfgs" CARGO_TARGET_DIR="target/instrumented/$package" \
              cargo clippy --locked --target "$target" -p "$package"
          done < <(instrumented)
      - name: Firmware packages for the chip target
        run: |
          # The bootstrap embeds a packed stage-two runtime; an empty one
          # suffices to type-check it.
          : > "$RUNNER_TEMP/empty-runtime.bin"
          export PSRAM_RUNTIME_BIN="$RUNNER_TEMP/empty-runtime.bin"
          meta=$(cargo metadata --format-version 1 --no-deps --locked)
          # The clippy step checks the instrumented images, with their cfgs.
          firmware() {
            jq -r '.packages[]
              | select(.manifest_path | test("/firmware/(apps|bootstrap)/|/chips/(esp32s31/board|espressif/staged-(runtime|bootstrap))/"))
              | select(.metadata."open-radio".instrumentation == null)
              | "-p " + .name' <<<"$meta"
          }
          cargo check --locked --target riscv32imafc-unknown-none-elf $(firmware)
      - name: Image build
        # Build unconfigured and fixed configured images for analysis without a board.
        run: |
          cargo fw build boot-smoke
          cargo fw build radio-root
      - name: HIL image builds
        # Every class, with the linked image's checks.
        run: cargo hil images check --all
      - name: Probe images
        # Compile every probe, including board self-checks, without vendor pins.
        # Discover packages from the workspace so new probes join this check.
        run: |
          meta=$(cargo metadata --format-version 1 --no-deps --locked)
          packages=$(jq -r '.packages[]
            | select(.manifest_path | contains("/firmware/probes/"))
            | .name' <<<"$meta")
          while read -r package; do
            cargo fw probe "$package"
          done <<<"$packages"
