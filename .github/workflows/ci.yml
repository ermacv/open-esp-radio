# The check of main, run after every merge. Pull requests run nothing:
# a ready pull request merges at once (merge.yml) and main may be red; the
# result tells whoever broke it to fix it.
name: ci

on:
  push:
    branches: [main]
  # merge.yml merges with the workflow token, whose push starts no workflow,
  # so it dispatches this one.
  workflow_dispatch:

# Every merge gets its own result: a newer run waits, it never cancels one.
concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Pinned ESP-IDF sources
        # The IEEE 802.15.4 host stand compiles the pinned ESP-IDF driver
        # sources in its build script; fetch exactly those pins.
        run: |
          cargo pins fetch --chip esp32s31 $(sed -n 's/^id = "\(esp-idf\/[^"]*\)"/\1/p' \
            knowledge/esp32s31/vendor/artifacts.toml)
      - name: Clippy
        run: |
          # One JSON run: its errors fail the step, its warnings are only
          # counted per package.
          status=0
          cargo clippy --all-targets --locked --message-format=json \
            > "$RUNNER_TEMP/clippy.json" || status=$?
          jq -rs '[.[] | select(.reason == "compiler-message") | .message.rendered]
            | unique | .[]' "$RUNNER_TEMP/clippy.json" || true
          echo "Clippy warnings per package:"
          jq -rs '
            [ .[]
              | select(.reason == "compiler-message" and .message.level == "warning")
              | { package: (.package_id
                            | (capture("#(?<name>[^@]+)@").name
                               // (split("#")[0] | split("/") | last))),
                  message: .message.rendered } ]
            | unique
            | group_by(.package)
            | map([.[0].package, length])
            | sort_by(-.[1], .[0])
            | (["package", "warnings"], .[], ["total", (map(.[1]) | add // 0)])
            | @tsv' "$RUNNER_TEMP/clippy.json" \
            | awk -F '\t' '{ printf "%-40s %s\n", $1, $2 }' || true
          exit "$status"
      - name: Tests
        # The default members: every package but the chip-only firmware ones.
        run: cargo test --locked
      - name: Tests in the feature sets the workspace run does not build
        run: |
          # The workspace run unifies features: runtime is built without
          # test-support, sta and the S31 MAC only with it. This list is the
          # one record of the other sets.
          cargo test --locked -p oer-ieee80211-runtime --features test-support
          cargo test --locked -p oer-ieee80211-sta
          cargo test --locked -p oer-esp32s31-ieee80211-mac
          cargo test --locked -p oer-base-time --features serde
          cargo test --locked -p oer-base-time --features schema

  chip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Portable and chip libraries for the chip target
        # Every library of portable/ and chips/ builds for the chip; the
        # platform packages of chips/platform are checked with the images.
        run: |
          packages=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.manifest_path | test("/(portable|chips)/"))
              | select(.manifest_path | test("/chips/platform/") | not) | "-p " + .name')
          cargo check --locked --target riscv32imafc-unknown-none-elf $packages
      - name: Clippy for the chip target
        # The esp-hal halves of the adapters exist only for the chip, so the
        # host clippy never sees them, nor the firmware images. Each chip's
        # firmware is checked apart: esp-hal takes one chip feature per build.
        run: |
          cargo clippy --locked --target riscv32imafc-unknown-none-elf \
            -p oer-adapters-esp-hal-radio --features esp32s31
          : > "$RUNNER_TEMP/empty-runtime.bin"
          export PSRAM_RUNTIME_BIN="$RUNNER_TEMP/empty-runtime.bin"
          meta=$(cargo metadata --format-version 1 --no-deps --locked)
          firmware() {
            jq -r --arg c5 "$1" '.packages[]
              | select(.manifest_path | test("/firmware/(apps|bootstrap)/|/chips/platform/"))
              | select((.manifest_path | test("esp32c5")) == ($c5 == "true"))
              | "-p " + .name' <<<"$meta"
          }
          cargo clippy --locked --target riscv32imafc-unknown-none-elf $(firmware false)
          cargo clippy --locked --target riscv32imac-unknown-none-elf $(firmware true)
      - name: Firmware packages for the chip target
        run: |
          # The bootstrap embeds a packed stage-two runtime; an empty one
          # suffices to type-check it.
          : > "$RUNNER_TEMP/empty-runtime.bin"
          export PSRAM_RUNTIME_BIN="$RUNNER_TEMP/empty-runtime.bin"
          meta=$(cargo metadata --format-version 1 --no-deps --locked)
          firmware() {
            jq -r --arg c5 "$1" '.packages[]
              | select(.manifest_path | test("/firmware/(apps|bootstrap)/|/chips/platform/"))
              | select((.manifest_path | test("esp32c5")) == ($c5 == "true"))
              | "-p " + .name' <<<"$meta"
          }
          cargo check --locked --target riscv32imafc-unknown-none-elf $(firmware false)
          cargo check --locked --target riscv32imac-unknown-none-elf $(firmware true)
      - name: Shared words with esp-hal
        # Every MMIO word the radio PAC and the pinned esp-hal both write has a
        # reviewed entry (registers/esp32s31/shared-words.toml). Cargo resolves
        # the pinned esp-hal and PAC sources of the workspace.
        run: |
          meta="$RUNNER_TEMP/firmware-metadata.json"
          cargo metadata --locked --format-version 1 > "$meta"
          source_of() {
            dirname "$(jq -er --arg name "$1" '.packages[] | select(.name == $name) | .manifest_path' "$meta")"
          }
          cargo registers check shared-words --chip esp32s31 \
            --esp-hal-src "$(source_of esp-hal)/src" \
            --pac-src "$(source_of esp32s31)/src"
      - name: Image build
        # The whole staged pipeline without a board: runtime, packing,
        # bootstrap and flash encoding.
        run: |
          cargo fw build boot-smoke
          cargo fw build radio-root
          cargo fw build w0
          # Unconfigured: only `run w1` builds it for the stand router; this
          # one reports `fail w1 unconfigured` when run, same layout.
          cargo fw build w1
