# A pull request merges when it is ready: opened as a draft, worked on, then
# marked ready for review, which squash-merges it and deletes its branch.
# Nothing runs on pull requests; ci.yml checks main after the merge.
name: merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: merge-${{ github.event.pull_request.number }}

jobs:
  merge:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Squash-merge and delete the branch
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
      - name: Check main
        # A push made with the workflow token starts no workflow.
        run: gh workflow run ci.yml --ref main
