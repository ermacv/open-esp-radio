[package]
name = "oer-interrupt-table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Each image's static table of interrupt bindings: source from the part's type, CPU line, level, hart and handler per entry; the router that writes routes and lines"

[dependencies]
oer-memory = { path = "../memory" }
oer-mmio = { path = "../mmio" }
static_cell = "2.1.1"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
oer-test-ui-cases = { path = "../../tools/test/ui-cases" }

[dev-dependencies]
oer-interrupt-table = { path = ".", features = ["host-signal"] }

[lints]
workspace = true

[features]
# The host executor of `signal::host`, for the tests of a signal's users.
host-signal = []
