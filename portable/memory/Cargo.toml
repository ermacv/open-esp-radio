[package]
name = "oer-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Audited buffer ownership boundaries for open ESP radio drivers"

[dependencies]
oer-sync = { path = "../sync" }
bytemuck = { version = "1.25.2", default-features = false, features = ["const_zeroed", "derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }

[features]
default = []

[dev-dependencies]
oer-test-ui-cases = { path = "../../tools/test/ui-cases" }

[lints]
workspace = true
