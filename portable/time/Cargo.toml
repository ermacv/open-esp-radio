[package]
name = "oer-time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chip-neutral monotonic time, clock and timer contract for open ESP radio drivers"

[features]
# Finite task-group shutdown; protocol cores do not enable this feature.
connected-tasks = ["dep:embassy-futures", "dep:oer-memory", "dep:oer-sync"]
# `Duration` serializes transparently as its `u64` microseconds, so that a
# port's typed bounds travel from the firmware to the host.
serde = ["dep:serde"]
# `postcard_schema::Schema` for `Duration`, as `u64`, for a host
# protocol's message lock.
schema = ["serde", "dep:postcard-schema"]

[dependencies]
embassy-futures = { version = "0.1.2", optional = true }
oer-memory = { path = "../memory", optional = true }
oer-sync = { path = "../sync", optional = true }
postcard-schema = { version = "0.2.5", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
oer-time-virtual = { path = "../time-virtual" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
toml = "1.1"

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["serde", "schema", "connected-tasks"]
