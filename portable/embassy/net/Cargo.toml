[package]
name = "oer-portable-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[dependencies]
embassy-futures = "0.1.2"
oer-portable-sync = { path = "../../sync" }
oer-protocols-network-port = { path = "../../../protocols/network/port" }
oer-protocols-network-wire = { path = "../../../protocols/network/wire" }
oer-portable-memory = { path = "../../memory" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "45ddde5904aad35bd81a802897e18b98fe70e654", features = ["async", "external-origin"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "a743267fa9735e4d4b9cd1ea6baf30dbf1694a86", features = ["medium-ethernet", "ipv4", "dhcpv4", "icmp-ping-reply"] }

[dev-dependencies]
# Link the pinned runner's time ABI. Tests never set or advance this driver;
# service deadlines and stack events use a per-test oer-portable-time-virtual clock.
# The queue size is oer-portable-embassy-time's: the workspace unifies the features of
# both test builds, and two generic-queue sizes do not compile together.
embassy-time = { version = "0.5.1", features = ["mock-driver", "generic-queue-64"] }
oer-portable-time = { path = "../../time" }
oer-portable-time-virtual = { path = "../../time-virtual" }
oer-portable-memory = { path = "../../memory", features = ["host-context"] }
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "a743267fa9735e4d4b9cd1ea6baf30dbf1694a86", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[lints]
workspace = true
