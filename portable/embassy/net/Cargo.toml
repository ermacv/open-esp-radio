[package]
name = "oer-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[dependencies]
embassy-sync = "0.8.0"
oer-network = { path = "../../../protocols/network" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "9b9644014ae2d405a2a5611337cbc207cf439f8b", features = ["async"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "d0df4863318fd029daebba25048d34a8baf1490e", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[lints]
workspace = true
