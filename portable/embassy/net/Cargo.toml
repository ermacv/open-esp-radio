[package]
name = "oer-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[features]
# Detached DMA payload adoption is opt-in. Firmware images keep only pool
# ownership; host integration tests exercise the external owner separately.
external-rx = ["xarxa-driver/external-origin"]

[[test]]
name = "external_rx"
required-features = ["external-rx"]

[dependencies]
embassy-sync = "0.8.0"
oer-memory = { path = "../../memory" }
oer-network = { path = "../../../protocols/network" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "ed9bf37f25c610566033e31abd14d7eb5096d93f", features = ["async"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "0c018c843303508300cbb15fb3be0ee7d58862ab", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[lints]
workspace = true
