[package]
name = "oer-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[dependencies]
embassy-futures = "0.1.2"
oer-sync = { path = "../../sync" }
oer-network = { path = "../../../protocols/network" }
oer-memory = { path = "../../memory" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "6f5ae91f9269ec3151d1aa61d0cfe0f3ae1b0798", features = ["async"] }

[dev-dependencies]
oer-time = { path = "../../time" }
oer-time-virtual = { path = "../../time-virtual" }
oer-memory = { path = "../../memory", features = ["host-context"] }
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "17f796c8ddb90ff510d995e24c2dcb758a97e8f8", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[features]
default = []
# `datapath::memory::MemoryTxQueues`: a host model of a network's TX source.
model = []

[lints]
workspace = true
