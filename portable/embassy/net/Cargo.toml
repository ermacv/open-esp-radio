[package]
name = "oer-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[dependencies]
embassy-futures = "0.1.2"
oer-sync = { path = "../../sync" }
oer-network-port = { path = "../../../protocols/network/port" }
oer-network-wire = { path = "../../../protocols/network/wire" }
oer-memory = { path = "../../memory" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "7c12e8e161ad8038c390a8153868c2cb92d7f0a0", features = ["async", "external-origin"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "bbc0d923a2f5f30c38e272b5ce937a57a33c8bd7", features = ["medium-ethernet", "ipv4", "dhcpv4", "icmp-ping-reply"] }

[dev-dependencies]
# Link the pinned runner's time ABI. Tests never set or advance this driver;
# service deadlines and stack events use a per-test oer-time-virtual clock.
embassy-time = { version = "0.5.1", features = ["mock-driver", "generic-queue-8"] }
oer-time = { path = "../../time" }
oer-time-virtual = { path = "../../time-virtual" }
oer-memory = { path = "../../memory", features = ["host-context"] }
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "bbc0d923a2f5f30c38e272b5ce937a57a33c8bd7", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[features]
default = []
# `datapath::memory::MemoryTxQueues`: a host model of a network's TX source.
model = []

[lints]
workspace = true
