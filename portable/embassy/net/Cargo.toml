[package]
name = "oer-embassy-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned-packet boundary for the optimized open ESP radio Embassy/Xarxa integration"

[features]
# Detached DMA payload adoption is opt-in. Firmware images keep only pool
# ownership; host integration tests exercise the external owner separately.
external-rx = ["xarxa-driver/external-origin"]

[[test]]
name = "external_rx"
required-features = ["external-rx"]

[dependencies]
embassy-sync = "0.8.0"
oer-memory = { path = "../../memory" }
oer-network = { path = "../../../protocols/network" }
oer-ieee80211-datapath = { path = "../../../protocols/ieee80211/datapath" }
xarxa-driver = { git = "https://github.com/ermacv/xarxa.git", rev = "1b606362bd9214fbc8f5835aaab4980971a41e89", features = ["async"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
owned-embassy-net = { package = "embassy-net", git = "https://github.com/ermacv/embassy.git", rev = "2c93136deefdeea273f1d7539f9a078953e21379", features = ["medium-ethernet", "ipv4", "ipv4-fragmentation", "ipv4-reassembly", "udp"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "adapter"
platform = "portable"
