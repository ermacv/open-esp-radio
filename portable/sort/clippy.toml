# The workspace panic lints (`unwrap_used`, `expect_used`, `panic`,
# `indexing_slicing`) apply to production code; tests may assert freely.
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

# Check runtime-accessible const functions as well as ordinary code.
suppress-restriction-lint-in-const = false

# Complete sans-IO assertion catalogue.
disallowed-macros = [
    "core::assert",
    "core::assert_eq",
    "core::assert_ne",
    "core::debug_assert",
    "core::debug_assert_eq",
    "core::debug_assert_ne",
    "oer_espressif_ieee802154_engine::engine::vendor_assert",
]
