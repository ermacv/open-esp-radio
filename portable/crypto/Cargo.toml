[package]
name = "oer-portable-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owned cryptographic operation contracts and the mode algorithms over synchronous AES-128 engines"

[features]
default = []
# The shared engine conformance cases.
test-support = []

[dependencies]
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[dev-dependencies]
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
ccm = { version = "=0.5.0", default-features = false }
cmac = { version = "0.7.2", default-features = false }

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["test-support"]
