[package]
name = "oer-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[dependencies]
crc = "3.3.0"
embassy-sync = "0.8.0"
heapless = "0.9.3"
oer-diagnostics = { path = "../diagnostics" }
oer-memory = { path = "../memory" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-hil-protocol = { path = "../../protocols/hil/protocol", default-features = false, features = ["async-io"] }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true

