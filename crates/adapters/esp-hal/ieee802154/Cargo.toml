[package]
name = "oer-esp32s31-ieee802154-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL interrupt-route ownership and time for the ESP32-S31 IEEE 802.15.4 MAC"

[features]
default = []
esp32s31 = [
    "dep:critical-section",
    "dep:esp-hal",
    "dep:oer-interrupt-table",
    "dep:oer-espressif-interrupt-table-esp-hal",
]

[dependencies]
critical-section = { version = "1.2.0", optional = true }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["esp32s31", "static-interrupts", "unstable"], optional = true }
oer-interrupt-table = { path = "../../../exec/interrupt-table", optional = true }
oer-espressif-interrupt-table-esp-hal = { path = "../../../exec/esp-hal-irq", features = ["esp32s31"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

