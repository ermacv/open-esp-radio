[package]
name = "oer-esp32c5-soc-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-C5 SoC services backed by esp-hal"

[features]
default = []
esp32c5 = ["dep:esp-hal"]

[dependencies]
critical-section = "1.2.0"
oer-soc-deadline = { path = "../../../../hardware/soc/deadline" }
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["esp32c5", "unstable"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imac-unknown-none-elf"
targets = []

