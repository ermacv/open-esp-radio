[package]
name = "oer-esp32s31-ieee80211-esp-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-HAL Wi-Fi MAC platform adapter for ESP32-S31"

[features]
default = []
esp32s31 = [
    "dep:esp-hal",
    "dep:oer-esp32s31-hal",
    "dep:oer-esp32s31-phy",
    "dep:oer-esp32s31-ieee80211",
    "dep:oer-esp32s31-ieee80211-mac",
    "dep:oer-esp32s31-ieee80211-form",
    "dep:oer-interrupt-table",
    "dep:oer-espressif-interrupt-table-esp-hal",
]

[dependencies]
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false, features = ["esp32s31", "static-interrupts", "unstable"], optional = true }
oer-esp32s31-hal = { path = "../../../../hardware/esp32s31/hal", optional = true }
oer-esp32s31-phy = { path = "../../../../hardware/esp32s31/phy", optional = true }
oer-esp32s31-ieee80211 = { path = "../../../../hardware/esp32s31/driver/ieee80211", optional = true }
oer-esp32s31-ieee80211-mac = { path = "../../../../hardware/esp32s31/driver/ieee80211/mac", optional = true }
oer-esp32s31-ieee80211-form = { path = "../../../../runtime/esp32s31/ieee80211-form", optional = true }
oer-interrupt-table = { path = "../../../../runtime/interrupt-table", optional = true }
oer-espressif-interrupt-table-esp-hal = { path = "../../espressif/interrupt-table", features = ["esp32s31"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

