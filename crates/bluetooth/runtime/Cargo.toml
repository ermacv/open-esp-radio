[package]
name = "oer-bluetooth-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent service loop between an in-process HCI transport, the LE Controller core and a radio port"

[dependencies]
oer-bluetooth-port = { path = "../le/port" }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-bluetooth-controller = { path = "../le/controller" }
oer-bluetooth-hci = { path = "../hci" }
oer-bluetooth-hci-transport = { path = "../hci-transport" }
oer-bluetooth-radio = { path = "../le/radio" }
oer-radio-port = { path = "../../radio/port" }
oer-time = { path = "../../base/time" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../base/time-virtual" }

[lints]
workspace = true

