[package]
name = "oer-ieee80211-rsn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free RSN (WPA2/WPA3) protocol types and four-way-handshake state machines"
readme = "README.md"

[dependencies]
oer-ieee80211-mac = { path = "../mac" }
oer-time = { path = "../../base/time" }
aes = { version = "0.8.4", default-features = false }
hmac = { version = "0.12.1", default-features = false }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha1 = { version = "0.10.7", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
cmac = { version = "0.7.2", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "expose-field"] }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
