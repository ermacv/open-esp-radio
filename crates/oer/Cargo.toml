[package]
name = "open-esp-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Public radio protocols, chip backends and system compositions"
readme = "README.md"

[lib]
name = "oer"

[features]
default = ["wifi"]
wifi = [
    "dep:mac",
    "dep:softmac",
    "dep:datapath",
    "dep:sta",
    "dep:ap",
    "dep:rsn",
    "dep:rsn-service",
]
bluetooth = ["dep:hci", "dep:le-ll"]
ieee802154 = ["dep:ieee802154"]
esp32s31 = ["dep:chip-hal"]
esp32s31-bluetooth = ["esp32s31", "bluetooth", "dep:chip-bluetooth"]
esp32s31-ieee802154 = ["esp32s31", "ieee802154", "dep:chip-ieee802154"]


[dependencies]
memory = { package = "oer-memory", path = "../base/memory" }
network = { package = "oer-network-interface", path = "../base/network" }
mac = { package = "oer-ieee80211-mac", path = "../ieee80211/mac", optional = true }
softmac = { package = "oer-ieee80211-softmac", path = "../ieee80211/softmac", optional = true }
datapath = { package = "oer-ieee80211-datapath", path = "../ieee80211/datapath", optional = true }
sta = { package = "oer-ieee80211-sta", path = "../ieee80211/sta", optional = true }
ap = { package = "oer-ieee80211-ap", path = "../ieee80211/ap", optional = true }
rsn = { package = "oer-ieee80211-rsn", path = "../ieee80211/rsn", optional = true }
rsn-service = { package = "oer-ieee80211-rsn-service", path = "../ieee80211/rsn-service", optional = true }
hci = { package = "oer-bluetooth-hci", path = "../bluetooth/hci", optional = true }
le-ll = { package = "oer-bluetooth-ll", path = "../bluetooth/le/ll", optional = true }
ieee802154 = { package = "oer-ieee802154", path = "../ieee802154/mac", optional = true }
chip-hal = { package = "oer-esp32s31-hal", path = "../esp32s31/hal", optional = true }
chip-bluetooth = { package = "oer-esp32s31-bluetooth", path = "../esp32s31/bluetooth/driver", optional = true }
chip-ieee802154 = { package = "oer-espressif-ieee802154-engine", path = "../espressif/ieee802154-engine", optional = true }

[lints]
workspace = true
