[package]
name = "oer-espressif-ieee802154-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent Espressif IEEE 802.15.4 radio runtime over the ported MAC engine and the oer-time contract"

[features]
# Host models of the hardware (`model_interrupt`, `with_model`) on host
# targets, for tests of this runtime and the crates that drive it.
model = ["oer-espressif-ieee802154-engine/model"]
# Record the engine's and the runtime's trace points into `oer-trace`.
trace = ["oer-espressif-ieee802154-engine/trace", "oer-trace/record"]

[dependencies]
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-espressif-ieee802154-engine = { path = "../ieee802154-engine" }
oer-ieee802154-trace = { path = "../ieee802154-trace" }
oer-trace = { path = "../../base/trace" }
oer-espressif-ieee802154-radio = { path = "../ieee802154-radio" }
oer-ieee802154 = { path = "../../ieee802154/mac" }
oer-ieee802154-port = { path = "../../ieee802154/port" }
oer-radio-permit-pool = { path = "../../radio/permit-pool" }
oer-radio-port = { path = "../../radio/port" }
oer-time = { path = "../../base/time" }

[dev-dependencies]
oer-time-virtual = { path = "../../base/time-virtual" }
oer-esp32s31-hal = { path = "../../esp32s31/hal" }
oer-espressif-ieee802154-engine = { path = "../ieee802154-engine", features = ["model"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

