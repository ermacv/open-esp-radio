[package]
name = "oer-espressif-ieee802154-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-free Espressif IEEE 802.15.4 radio role: the portable radio contract over the ported MAC engine"

[dependencies]
oer-espressif-ieee802154-engine = { path = "../ieee802154-engine" }
oer-ieee802154 = { path = "../../ieee802154/mac" }
oer-time = { path = "../../base/time" }

[dev-dependencies]
oer-time-virtual = { path = "../../base/time-virtual" }
oer-espressif-ieee802154-engine = { path = "../ieee802154-engine", features = ["model"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

