[package]
name = "oer-esp32s31-ieee80211-ap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Wi-Fi access-point composition"

[dependencies]
oer-espressif-ieee80211-policy = { path = "../../../espressif/ieee80211-policy" }
oer-memory = { path = "../../../base/memory" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-ieee80211 = { path = "../driver" }
oer-esp32s31-ieee80211-mac = { path = "../mac" }
oer-ieee80211-lower-mac = { path = "../../../ieee80211/lower-mac" }
oer-ieee80211-mac = { path = "../../../ieee80211/mac" }
oer-ieee80211-ap = { path = "../../../ieee80211/ap" }
oer-ieee80211-softmac = { path = "../../../ieee80211/softmac" }
oer-ieee80211-rsn = { path = "../../../ieee80211/rsn" }
oer-time = { path = "../../../base/time" }

[dev-dependencies]
oer-time-virtual = { path = "../../../base/time-virtual" }

[features]
default = []
# Value-only AP protocol/MAC observations. Ordinary builds retain no
# diagnostic counters in the live AP owner graph.
diagnostics = []

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

