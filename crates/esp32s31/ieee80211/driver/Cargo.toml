[package]
name = "oer-esp32s31-ieee80211"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Role-neutral ESP32-S31 Wi-Fi device composition"

[dependencies]
atomic-waker = "1.1.2"
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics", "zeroable_maybe_uninit"] }
oer-esp32s31-coex = { path = "../../radio/coex" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-phy = { path = "../../phy" }
oer-esp32s31-ieee80211-dma = { path = "../dma" }
oer-esp32s31-ieee80211-mac = { path = "../mac" }
oer-esp32s31-radio-client = { path = "../../radio/client" }
oer-ieee80211-lower-mac = { path = "../../../ieee80211/lower-mac" }
oer-memory = { path = "../../../base/memory" }
oer-radio-port = { path = "../../../radio/port" }
oer-ieee80211-mac = { path = "../../../ieee80211/mac" }
oer-ieee80211-softmac = { path = "../../../ieee80211/softmac" }
oer-time = { path = "../../../base/time" }

[features]
default = []
test-support = ["oer-esp32s31-ieee80211-mac/test-support"]

[dev-dependencies]
oer-time-virtual = { path = "../../../base/time-virtual" }
oer-ui-cases = { path = "../../../../tools/lib/ui-cases" }
oer-espressif-ieee80211-policy = { path = "../../../espressif/ieee80211-policy" }
oer-ieee80211-upper-mac = { path = "../../../ieee80211/upper-mac" }

# Host unit tests use the allocating MAC model. RV32 API doctests exercise
# the production API without introducing an allocator into their binaries.
[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
oer-esp32s31-ieee80211-mac = { path = "../mac", features = ["test-support"] }
# The W1 survey consumes the frames the host receive tests hand to P1.
oer-ieee80211-runtime = { path = "../../../ieee80211/runtime" }
oer-ieee80211-sta = { path = "../../../ieee80211/sta" }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
chip = "esp32s31"
