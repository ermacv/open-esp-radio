[package]
name = "oer-esp32s31-bluetooth-radio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The portable Bluetooth LE radio event contract over the ESP32-S31 scheduler executor and role pools"

[features]
# Record the role's trace points (`oer-bluetooth-trace`) into `oer-trace`.
trace = ["oer-trace/record"]
# Host model memory for dependent crates' tests.
test-support = [
    "oer-esp32s31-bluetooth/test-support",
    "oer-esp32s31-bluetooth-memory/validation-probes",
    "oer-esp32s31-hal/validation-probes",
]

[dependencies]
oer-bluetooth-radio = { path = "../../../bluetooth/le/radio" }
oer-bluetooth-trace = { path = "../../../bluetooth/trace" }
oer-esp32s31-bluetooth = { path = "../driver" }
oer-esp32s31-bluetooth-memory = { path = "../memory" }
oer-esp32s31-hal = { path = "../../hal" }
oer-trace = { path = "../../../base/trace" }

[dev-dependencies]
oer-esp32s31-bluetooth-memory = { path = "../memory", features = ["validation-probes"] }
oer-esp32s31-bluetooth = { path = "../driver", features = ["test-support"] }
oer-esp32s31-hal = { path = "../../hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

