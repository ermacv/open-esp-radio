[package]
name = "oer-esp32s31-bluetooth-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor-independent ESP32-S31 Bluetooth LE radio runtime over the oer-time contract"

[features]
# Record the runtime's trace points (`oer-bluetooth-trace`) into `oer-trace`.
trace = ["oer-trace/record"]

[dependencies]
oer-bluetooth-port = { path = "../../../bluetooth/le/port" }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-bluetooth-radio = { path = "../../../bluetooth/le/radio" }
oer-bluetooth-trace = { path = "../../../bluetooth/trace" }
oer-radio-port = { path = "../../../radio/port" }
oer-esp32s31-bluetooth = { path = "../driver" }
oer-esp32s31-bluetooth-memory = { path = "../memory" }
oer-esp32s31-bluetooth-radio = { path = "../radio" }
oer-esp32s31-hal = { path = "../../hal" }
oer-time = { path = "../../../base/time" }
oer-trace = { path = "../../../base/trace" }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../../base/time-virtual" }
oer-esp32s31-bluetooth = { path = "../driver", features = ["test-support"] }
oer-esp32s31-bluetooth-memory = { path = "../memory", features = ["validation-probes"] }
oer-esp32s31-bluetooth-radio = { path = "../radio", features = ["test-support"] }
oer-esp32s31-hal = { path = "../../hal", features = ["validation-probes"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

