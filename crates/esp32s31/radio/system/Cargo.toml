[dependencies]
embassy-futures = "0.1.2"
oer-time = { path = "../../../base/time" }
oer-esp32s31-radio-client = { path = "../client" }

[dev-dependencies]
oer-esp32s31-radio-client = { path = "../client", features = ["test-support"] }
oer-esp32s31-hal = { path = "../../hal", features = ["test-support"] }
oer-time-virtual = { path = "../../../base/time-virtual" }
oer-esp32s31-phy = { path = "../../phy" }
oer-esp32s31-ieee80211-mac = { path = "../../ieee80211/mac" }
oer-ieee80211-mac = { path = "../../../ieee80211/mac" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "hardware"
platform = "chip"
