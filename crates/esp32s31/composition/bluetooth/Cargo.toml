[package]
name = "oer-esp32s31-bluetooth-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP32-S31 Bluetooth LE composition: static memory, powered epoch, interrupts, radio runtime and HCI Controller"

[dependencies]
oer-bluetooth-port = { path = "../../../bluetooth/le/port" }
oer-bluetooth-radio = { path = "../../../bluetooth/le/radio" }
oer-time-embassy = { path = "../../../adapters/embassy/time" }

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = "1.2.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
oer-bluetooth-controller = { path = "../../../bluetooth/le/controller" }
oer-bluetooth-hci = { path = "../../../bluetooth/hci" }
oer-bluetooth-hci-transport = { path = "../../../bluetooth/hci-transport" }
oer-bluetooth-runtime = { path = "../../../bluetooth/runtime" }
oer-esp32s31-bluetooth = { path = "../../bluetooth/driver" }
oer-esp32s31-bluetooth-memory = { path = "../../bluetooth/memory" }
oer-esp32s31-bluetooth-radio = { path = "../../bluetooth/radio" }
oer-esp32s31-bluetooth-runtime = { path = "../../bluetooth/runtime" }
oer-esp32s31-coex = { path = "../../radio/coex" }
oer-esp32s31-hal = { path = "../../hal" }
oer-esp32s31-phy = { path = "../../phy" }
oer-esp32s31-soc-esp-hal = { path = "../../../adapters/esp-hal/soc", features = ["esp32s31"] }
oer-esp32s31-radio-esp-hal = { path = "../../../adapters/esp-hal/radio", features = ["esp32s31"] }
oer-esp32s31-radio-runtime = { path = "../../radio/runtime" }
static_cell = "2.1.1"

[features]
# Diagnostic images only: forwards the Controller's vendor command 0xFC01,
# which arms one received-MIC corruption.
diagnostic-mic-fault = ["oer-bluetooth-controller/diagnostic-mic-fault"]
# Diagnostic images only: record the Controller, radio role and runtime trace
# points (`oer-bluetooth-trace`).
trace = [
    "oer-bluetooth-controller/trace",
    "oer-esp32s31-bluetooth-radio/trace",
    "oer-esp32s31-bluetooth-runtime/trace",
]

[lints]
workspace = true

[package.metadata.docs.rs]
# Chip APIs exist only for the chip target; document them there alone.
default-target = "riscv32imafc-unknown-none-elf"
targets = []

