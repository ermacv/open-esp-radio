oer-hil-protocol = { path = "../../../protocols/hil/protocol", features = ["wifi", "network", "lower-mac"] }
oer-hil-link = { path = "../link" }
oer-hil-lab = { path = "../lab" }
oer-lab-router = { path = "../../lab/router" }
oer-os-durable = { path = "../../os/durable" }
oer-os-process = { path = "../../os/process" }
serde = { version = "1.0", features = ["derive"] }
