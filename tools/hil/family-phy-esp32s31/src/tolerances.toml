# Reviews of the hardware calibration cross-check fields.
#
# One entry per field of the `phy_param` relation
# (chips/esp32s31/knowledge/src/phy_relation/committed.rs). A field's margin is
# the widest range its vendor boots span in any one element; a production
# element passes within its vendor range widened by that margin. `signed`
# reads elements as two's-complement values, `mask` compares only the bits
# the relation models per element, and `excluded` skips only value comparison.
# Every vendor-readable register, including an excluded one, must have a
# readable production sample in every boot; otherwise the result is INCOMPLETE.
# A field without an entry leaves the cross-check INCOMPLETE.
# Schema 3 adds `initial-pair = "rx-dc-gain0"`: a later RX-DC gain pair
# may also pass when BOTH codes equal gain0 of that same capture. Applies
# only to shared gains 1..10 and Wi-Fi gains 1..7; gain0 and the five Wi-Fi
# fine-calibration pairs retain the range rule. Each out-of-range acceptance
# is reported as "initial pair, vendor-faithful" with capture/gain/pair.
schema = 3

# SOURCE: complete rev0 ROM phy_set_cca_cnt / phy_get_cca_cnt (#240), and
# SOURCE: s31-b E1/E3/E4/E5 (#254), CCA result words vary with the sampled window;
# details: oer-notes/evidence/chips-notes/chips/esp32s31/notes/phy/cca-counter.md.
# A Wi-Fi baseband reset release restarts the measurement window. The vendor
# leaves both result words unconsumed; window/control remains compared by value.
[registers."WIFI_BB.CCA_COUNTER_RESULT_0"]
excluded = true
reason = "hardware measurement result over a window, not calibration"

[registers."WIFI_BB.CCA_COUNTER_RESULT_1"]
excluded = true
reason = "hardware measurement result over a window, not calibration"

[fields.current-temperature]
excluded = true
reason = "the latest sensor sample follows the board temperature at each boot, not a calibration result"

[fields.common-reference]
signed = true
reason = "temperature the common calibration commits as its tracking reference"

[fields.transmit-reference]
signed = true
reason = "temperature the TX calibration commits as its tracking reference"

[fields.channel]
reason = "channel the calibration ran on"

[fields.bandwidth]
reason = "bandwidth the calibration ran with"

[fields.wifi-dc-rows]
reason = "Wi-Fi TX DC calibration codes"

[fields.bluetooth-dc-rows]
reason = "Bluetooth TX DC calibration codes"

[fields.wifi-rx-dc]
# SOURCE: #297; vendor-010 in 1792622032981-000474e9 has gains1/4/5
# equal to its gain0 (260,303). Only the first eight pairs are per-gain;
# the remaining five are phy_rxdc_fine_cal, outside this rule.
initial-pair = "rx-dc-gain0"
reason = "Wi-Fi per-gain RX DC codes and the phy_rxdc_fine_cal pairs"

[fields.shared-rx-dc]
# SOURCE: https://github.com/ermacv/open-esp-radio/issues/297;
# vendor-006 and production-004 in #305 cold1792622032981-000474e9,
# production-003 in #305 restart1792623738264-0006c2cc, and
# production-010 in #295 restart1792612465408-0039aa30: gain10 equals
# that capture's gain0 initial pair (243,288). Convergence is not captured.
initial-pair = "rx-dc-gain0"
reason = "shared RX DC codes"

[fields.power-temperature]
signed = true
reason = "temperature the TX power calibration commits as its power tracking reference"

[fields.shared-cache]
signed = true
reason = "gain base the power tracking retains as its previous result"

[fields.wifi-gain-base]
signed = true
reason = "Wi-Fi TX gain base the power calibration commits"

[fields.bluetooth-gain-base]
signed = true
reason = "Bluetooth and IEEE 802.15.4 TX gain base the power calibration commits"

[fields.gain-adjustment]
signed = true
reason = "retained TX gain adjustment"

[fields.i2c-band]
reason = "Wi-Fi I2C tracking band the calibration temperature selects"

[fields.rfpll-reference]
signed = true
reason = "temperature the RFPLL calibration commits as its tracking reference"

[fields.dcode]
reason = "DCODE calibration codes"

[fields.calibration-status]
mask = [0x80, 0x02]
reason = "the relation models the RX-gain DC (0x80 of the first byte) and RX-gain table (0x02 of the second) completion bits; the vendor's other status bits are outside it"

[fields.rx-table-last-indices]
reason = "shared and Wi-Fi RX-gain table last indices"

[fields.sensor-index]
reason = "temperature sensor window the calibration selected"

