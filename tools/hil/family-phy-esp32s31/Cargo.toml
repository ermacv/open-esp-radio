[package]
name = "oer-hil-family-phy-esp32s31"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "The vendor-versus-production ESP32-S31 PHY calibration comparison on data: register images, vendor console protocol and the reviewed relation over the projection the firmware reports; the HIL phy family captures it"

[dependencies]
oer-hil-scenario = { path = "../scenario" }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
oer-hil-family-phy = { path = "../family-phy" }
oer-esp32s31-knowledge = { path = "../../../chips/esp32s31/knowledge" }
oer-registers-model = { path = "../../registers/model" }
oer-os-durable = { path = "../../os/durable" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
serde_json = "1.0"

[dev-dependencies]
tempfile = "=3.27.0"
oer-os-process = { path = "../../os/process" }
serde_json = "1.0"

[lints]
workspace = true

