[package]
name = "oer-hil-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL host/target link: one session with the board under test (UART capture, generic exchange, readiness, reboots) and the reference peers' line console"

[features]
# The capture fixtures of other packages' tests; the fake target reports the
# system watchdog image's keys.
test-support = []

[dependencies]
oer-hil-registry = { path = "../registry" }
oer-network-control = { path = "../../../protocols/network-control" }
oer-ieee80211-control = { path = "../../../protocols/ieee80211/control" }
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-lab-board = { path = "../../lab/board" }
oer-os-durable = { path = "../../os/durable" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", features = ["registry"] }
oer-os-process = { path = "../../os/process" }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
postcard = { version = "1.1.3", default-features = false }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.8.1"

[dev-dependencies]
postcard-schema = { version = "0.2.5", features = ["derive"] }

[lints]
workspace = true

