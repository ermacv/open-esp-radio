[package]
name = "oer-hil-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "HIL host link: one board's serial line, the protocol's frames on it, their boot and request/response exchange"

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-hil-protocol = { path = "../../../protocols/hil/protocol" }
oer-os-process = { path = "../../os/process" }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
postcard = { version = "1.1.3", default-features = false }
rustix = { version = "1.1.4", features = ["fs"] }
zeroize = "1.8.1"

[dev-dependencies]
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true
