[package]
name = "oer-tool-hil-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The runner contract of the HIL fixture helpers: the Bluetooth and probe requests and replies, and the Linux socket they share"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
oer-ieee80211-mac = { path = "../../../protocols/ieee80211/mac" }
oer-tool-lab-fixture-install = { path = "../../lab/fixture-install" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol" }
serde = { version = "1.0", features = ["derive"] }
bt-hci = "=0.10.1"
bt-hci-transport = "=0.1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
libc = "0.2"
oer-os-process = { path = "../../os/process", features = ["linux-socket"] }
serde_json = "1.0"

[lints]
workspace = true

[dev-dependencies]
oer-bluetooth-le-ll = { path = "../../../protocols/bluetooth/le/ll" }
