[package]
name = "oer-tool-hil-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The finite Linux fixture helpers of the HIL stand: the Bluetooth DTM and connection helper and the probe load"

[dependencies]
oer-bluetooth-control = { path = "../../../protocols/bluetooth/control" }
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
oer-lab-fixture = { path = "../../lab/fixture" }
oer-bluetooth-hci = { path = "../../../protocols/bluetooth/hci" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol" }
serde = { version = "1.0", features = ["derive"] }
bt-hci = "=0.10.1"
bt-hci-transport = "=0.1.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
libc = "0.2"
oer-os-process = { path = "../../os/process", features = ["linux-socket"] }
serde_json = "1.0"

[lints]
workspace = true

[dev-dependencies]
