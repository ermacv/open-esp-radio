[package]
name = "oer-hil-family-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "PHY HIL workloads: the vendor-versus-production calibration cross-check on the board under test"
readme = "README.md"

[dependencies]
oer-esp32s31-instrumentation = { path = "../../../chips/esp32s31/instrumentation" }
oer-esp32s31-instrumentation-hil = { path = "../../../chips/esp32s31/instrumentation-hil" }
oer-esp32s31-phy-probe = { path = "../../../chips/esp32s31/phy-probe" }
oer-hil-runs = { path = "../runs" }
oer-cooperate = { path = "../../../portable/cooperate" }
heapless = { version = "0.9.3", features = ["serde"] }
oer-hil-model = { path = "../model" }
oer-hil-link = { path = "../link" }
oer-hil-session = { path = "../session" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", features = ["registry"] }
oer-image-build = { path = "../../image/build" }
oer-os-durable = { path = "../../os/durable" }
hex = "=0.4.3"
oer-lab-board = { path = "../../lab/board" }
oer-hil-scenario = { path = "../scenario" }
serde_json = "1.0"
oer-analysis-elf = { path = "../../analysis/elf" }
oer-os-process = { path = "../../os/process" }
tempfile = "=3.27.0"
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true


[dev-dependencies]
oer-hil-runs = { path = "../runs", features = ["test-support"] }
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-hil-scenario = { path = "../scenario", features = ["test-support"] }
oer-hil-link = { path = "../link", features = ["test-support"] }
oer-hil-session = { path = "../session", features = ["test-support"] }
toml = "1.1"
