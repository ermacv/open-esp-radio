[package]
name = "oer-hil-family-lower-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "Hardware lower-MAC conformance compared with the reference model"

[dependencies]
oer-ieee80211-conformance-control = { path = "../../../protocols/ieee80211/conformance-control" }
oer-hil-model = { path = "../model" }
oer-hil-scenario = { path = "../scenario" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol" }
oer-hil-session = { path = "../session" }
oer-lab-router = { path = "../../lab/router" }
oer-os-durable = { path = "../../os/durable" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port", features = ["test-support"] }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-ieee80211-model = { path = "../../../protocols/ieee80211/model", features = ["test-support"] }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
toml = "1.1"

[lints]
workspace = true
