[package]
name = "oer-hil-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL runner: its command line, a run of scenarios on the stand, and the image, flash and executor work it does"

[dependencies]
oer-hil-family-wifi = { path = "../family-wifi" }
oer-hil-family-lower-mac = { path = "../family-lower-mac" }
oer-vendor-phy-esp32s31 = { path = "../../vendor/phy-esp32s31" }
oer-image-checks = { path = "../../image/checks" }
oer-lab-board = { path = "../../lab/board" }
oer-hil-runs = { path = "../runs" }
oer-hil-model = { path = "../model" }
oer-image-build = { path = "../../image/build" }
oer-os-toolchain = { path = "../../os/toolchain" }
oer-hil-lab = { path = "../lab" }
oer-hil-link = { path = "../link" }
oer-chip-profile = { path = "../../chip/profile" }
oer-hil-analysis = { path = "../analysis" }
oer-hil-scenario = { path = "../scenario" }
oer-os-durable = { path = "../../os/durable" }
oer-hil-family-system = { path = "../family-system" }
oer-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
oer-os-process = { path = "../../os/process" }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
oer-hil-protocol = { path = "../../../protocols/hil/protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

oer-lab-arbiter = { path = "../../lab/arbiter" }
oer-image-compare = { path = "../../image/compare" }
toml = "1.1"

[dev-dependencies]
oer-espressif-facts = { path = "../../../chips/espressif/facts" }
oer-hil-lab = { path = "../lab", features = ["test-support"] }
oer-hil-runs = { path = "../runs", features = ["test-support"] }
toml = "1.1"
oer-hil-scenario = { path = "../scenario", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true


