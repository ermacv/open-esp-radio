[package]
name = "oer-hil-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL run-level stand operation: the laboratory configuration, the run's fixture lock, the cell's pre-run observation, fixture software leases, recovery and post-mortem"

[features]
# The laboratory fixtures of the runner's cross-package tests.
test-support = []

[dependencies]
oer-esp32s31-phy-probe = { path = "../../../chips/esp32s31/phy-probe" }
hex = "=0.4.3"
oer-lab-router = { path = "../../lab/router" }
oer-lab-board = { path = "../../lab/board" }
oer-hil-runs = { path = "../runs" }
oer-hil-model = { path = "../model" }
oer-analysis-elf = { path = "../../analysis/elf" }
oer-chip-profile = { path = "../../chip/profile" }
oer-lab-arbiter = { path = "../../lab/arbiter" }
oer-lab-model = { path = "../../lab/model" }
oer-os-durable = { path = "../../os/durable" }
oer-lab-fixture = { path = "../../lab/fixture" }
oer-hil-link = { path = "../link" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", features = ["registry"] }
oer-os-process = { path = "../../os/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml = "1.1"
zeroize = "1.8.1"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true

