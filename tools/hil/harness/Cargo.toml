[package]
name = "oer-tools-hil-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The life cycle every HIL scenario program runs through: build the image, lease and flash the board, connect, run the cases, release"

[dependencies]
oer-tools-hil-link = { path = "../link" }
oer-protocols-hil-protocol = { path = "../../../protocols/hil/protocol" }
oer-tools-image-build = { path = "../../image/build" }
oer-tools-image-bundle = { path = "../../image/bundle" }
oer-tools-image-checks = { path = "../../image/checks" }
oer-tools-lab-arbiter = { path = "../../lab/arbiter" }
oer-tools-lab-model = { path = "../../lab/model" }
oer-tools-lab-client = { path = "../../lab/client" }
oer-tools-os-process = { path = "../../os/process" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-tools-hil-link = { path = "../link", features = ["test-support"] }
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[lints]
workspace = true
