[package]
name = "oer-hil-fixtures-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Linux Bluetooth fixture over BlueZ: DTM peer check, discovery, ATT parameters and the secure GATT agent"

[dependencies]
oer-bluetooth-control = { path = "../../../protocols/bluetooth/control" }
oer-os-durable = { path = "../../os/durable" }
oer-os-process = { path = "../../os/process", features = ["linux-socket"] }
oer-hil-protocol = { path = "../../../protocols/hil/protocol" }
oer-hil-runs = { path = "../runs" }
oer-lab-fixture = { path = "../../lab/fixture" }
oer-hil-lab = { path = "../lab" }
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
zbus = "=5.19.0"

[lints]
workspace = true
