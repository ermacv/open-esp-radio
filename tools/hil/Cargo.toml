[package]
name = "oer-tool-hil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The `cargo hil` command line: argument parsing and calls into the stand, run store, analysis and experiment packages"

[[bin]]
name = "hil"
path = "src/main.rs"

[dependencies]
oer-image-esp-idf = { path = "../../host/image/esp-idf" }
oer-hil-run-bundle-format = { path = "../../host/hil/run-bundle-format" }
oer-image-profile = { path = "../../host/image/profile" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
oer-lab-arbiter = { path = "../../host/lab/arbiter" }
oer-lab-board = { path = "../../host/lab/board" }
oer-hil-run-bundle = { path = "../../host/hil/run-bundle" }
oer-hil-analysis = { path = "../../host/hil/analysis" }
oer-hil-experiment = { path = "../../host/hil/experiment" }
oer-image-build = { path = "../../host/image/build" }
oer-image-checks = { path = "../../host/image/checks" }
oer-image-compare = { path = "../../host/image/compare" }
oer-hil-image = { path = "../../host/hil/image" }
oer-hil-image-class = { path = "../../host/hil/image-class" }
oer-hil-schema = { path = "../../host/hil/schema" }
oer-hil-observer = { path = "../../host/hil/observer" }
oer-hil-lab = { path = "../../host/hil/lab" }
oer-lab-router = { path = "../../host/lab/router" }
oer-os-durable = { path = "../../host/os/durable" }
oer-os-process = { path = "../../host/os/process" }
oer-image-toolchain = { path = "../../host/image/toolchain" }
clap = { version = "=4.5.48", features = ["derive"] }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"

[dev-dependencies]
oer-hil-run-bundle = { path = "../../host/hil/run-bundle", features = ["test-support"] }

[lints]
workspace = true

