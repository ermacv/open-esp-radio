[package]
name = "oer-tool-hil"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The `cargo hil` command line: argument parsing and calls into the stand, run store, analysis and experiment packages"

[[bin]]
name = "hil"
path = "src/main.rs"

[dependencies]
oer-image-esp-idf = { path = "../../host/image/esp-idf" }
oer-hil-runs = { path = "../../host/hil/runs" }
oer-chip-profile = { path = "../../host/chip/profile" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
oer-lab-arbiter = { path = "../../host/lab/arbiter" }
oer-lab-board = { path = "../../host/lab/board" }
oer-hil-analysis = { path = "../../host/hil/analysis" }
oer-image-build = { path = "../../host/image/build" }
oer-image-checks = { path = "../../host/image/checks" }
oer-image-compare = { path = "../../host/image/compare" }
oer-hil-run = { path = "../../host/hil/run" }
oer-hil-model = { path = "../../host/hil/model" }
oer-hil-observer = { path = "../../host/hil/observer" }
oer-hil-lab = { path = "../../host/hil/lab" }
oer-lab-router = { path = "../../host/lab/router" }
oer-os-durable = { path = "../../host/os/durable" }
oer-os-process = { path = "../../host/os/process" }
oer-os-toolchain = { path = "../../host/os/toolchain" }
clap = { version = "=4.5.48", features = ["derive"] }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"
oer-lab-model = { path = "../../host/lab/model" }

[dev-dependencies]
oer-hil-runs = { path = "../../host/hil/runs", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

