[package]
name = "oer-os-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
clap = ["dep:clap"]
# The Linux socket addresses and options rustix does not model
# (`linux_socket`); the HIL fixtures enable it, the root fixture installer
# does not.
linux-socket = ["rustix/net"]
# Child setup only tests use: the unprivileged user namespace.
test-support = ["rustix/thread"]

[dependencies]
clap = { version = "=4.5.48", features = ["derive"], optional = true }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["fs", "param", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
