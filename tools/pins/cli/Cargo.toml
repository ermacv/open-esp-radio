[package]
name = "oer-tool-pins-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "cargo pins: fetch and verify a chip's pinned vendor artifacts"

[dependencies]
oer-pins-artifacts = { path = "../artifacts" }
oer-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }

[lints]
workspace = true

[[bin]]
name = "pins"
path = "src/main.rs"
