[package]
name = "oer-tool-pins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo pins`: fetch and verify a chip's pinned vendor artifacts into the host-wide store"

[[bin]]
name = "pins"
path = "src/main.rs"

[dependencies]
oer-vendor-artifacts = { path = "../../host/vendor/artifacts" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }

[lints]
workspace = true
