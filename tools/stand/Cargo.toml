[package]
name = "oer-tool-stand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "cargo stand: the shared stand's queue, leases, boards, owners, host setup and fixture software"

[[bin]]
name = "stand"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
oer-image-profile = { path = "../../host/image/profile" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
oer-lab-board = { path = "../../host/lab/board" }
oer-os-durable = { path = "../../host/os/durable" }
oer-os-process = { path = "../../host/os/process" }
oer-lab-arbiter = { path = "../../host/lab/arbiter" }
oer-lab-model = { path = "../../host/lab/model" }
oer-lab-fixtures = { path = "../../host/lab/fixtures" }
oer-lab-router = { path = "../../host/lab/router" }
oer-image-toolchain = { path = "../../host/image/toolchain" }
rustix = { version = "=1.1.4", features = ["process"] }
serde_json = "=1.0.151"

[dev-dependencies]
libc = "0.2"
tempfile = "=3.27.0"

[lints]
workspace = true

