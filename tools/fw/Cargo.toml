[package]
name = "oer-tool-fw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo fw`: build, flash and run staged firmware images on the stand's boards"

[[bin]]
name = "fw"
path = "src/main.rs"

[dependencies]
oer-image-firmware = { path = "../../host/image/firmware" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }

[lints]
workspace = true
