[package]
name = "oer-tool-fw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo fw`: build, flash and run staged firmware images on the stand's boards"

[[bin]]
name = "fw"
path = "src/main.rs"

[dependencies]
oer-image-build = { path = "../../host/image/build" }
oer-image-checks = { path = "../../host/image/checks" }
oer-chip-profile = { path = "../../host/chip/profile" }
oer-lab-board = { path = "../../host/lab/board" }
oer-lab-model = { path = "../../host/lab/model" }
oer-lab-router = { path = "../../host/lab/router" }
oer-os-durable = { path = "../../host/os/durable" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "1.1"
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
