[package]
name = "oer-analysis-riscv-stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Worst-case stack bounds of a static RV32 image from its machine code"

[dependencies]
oer-analysis-elf = { path = "../elf" }
oer-analysis-riscv-analysis = { path = "../riscv-analysis" }
oer-analysis-riscv-decode = { path = "../riscv-decode" }
oer-analysis-riscv-lift = { path = "../riscv-lift" }
oer-analysis-riscv-model = { path = "../riscv-model" }
oer-analysis-riscv-program = { path = "../riscv-program" }
oer-riscv = { path = "../../../portable/riscv" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]
oer-chip-profile = { path = "../../chip/profile" }
oer-espressif-facts = { path = "../../../chips/espressif/facts" }
tempfile = "=3.27.0"
clap = { version = "4.5", features = ["derive"] }
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

