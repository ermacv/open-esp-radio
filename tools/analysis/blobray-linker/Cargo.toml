[package]
name = "oer-tools-analysis-blobray-linker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Linux adapters of Blobray's in-process linking: external ELF linkers"

[dependencies]
oer-tools-os-process = { path = "../../os/process" }
oer-tools-analysis-blobray-application = { path = "../blobray-application" }
oer-tools-analysis-blobray-domain = { path = "../blobray-domain" }
oer-tools-analysis-riscv-model = { path = "../riscv-model" }
sha2 = "=0.10.9"
rustix = { version = "=1.1.4", features = ["event", "fs", "pipe"] }

[dev-dependencies]
tempfile = "=3.27.0"
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }

[lints]
workspace = true

