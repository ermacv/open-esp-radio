[package]
name = "oer-tools-analysis-blobray-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Blobray operations over captured executables inside the calling process"

[dependencies]
toml = "=1.1.4"
oer-tools-analysis-elf = { path = "../elf" }
rustc-demangle = "=0.1.28"
oer-tools-analysis-riscv-program = { path = "../riscv-program" }
oer-tools-analysis-riscv-analysis = { path = "../riscv-analysis" }
oer-tools-analysis-blobray-verification = { path = "../blobray-verification" }
oer-tools-analysis-blobray-analysis = { path = "../blobray-analysis" }
oer-tools-analysis-blobray-domain = { path = "../blobray-domain" }
oer-tools-analysis-riscv-model = { path = "../riscv-model" }
oer-tools-analysis-blobray-artifacts = { path = "../blobray-artifacts" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

tempfile = "=3.27.0"

[dev-dependencies]
oer-tools-analysis-riscv-lift = { path = "../riscv-lift" }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }

[lints]
workspace = true

