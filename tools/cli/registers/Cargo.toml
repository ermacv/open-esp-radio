[package]
name = "oer-tool-cli-registers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo registers`: validate the register model and publish SVD, PAC and bindings"

[[bin]]
name = "registers"
path = "src/main.rs"

[dependencies]
oer-tool-service-registers = { path = "../../lib/service/registers" }
oer-tool-base-command-tree = { path = "../../lib/base/command-tree", features = ["clap"] }
oer-tool-base-process = { path = "../../lib/base/process" }
clap = { version = "=4.5.48", features = ["derive"] }

[dev-dependencies]
oer-tool-data-register-model = { path = "../../lib/data/register-model" }
oer-tool-data-register-bindings = { path = "../../lib/data/register-bindings" }
tempfile = "=3.27.0"

[lints]
workspace = true
