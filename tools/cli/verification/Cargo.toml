[package]
name = "oer-tool-cli-verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo verification`: vendor pins fetched, vendor diffs, provenance, typed scenarios, evidence shards, comparison probes and host stands"

[[bin]]
name = "verification"
path = "src/main.rs"

[dependencies]
oer-tool-analysis-blobray-application = { path = "../../lib/analysis/blobray-application" }
oer-tool-analysis-blobray-domain = { path = "../../lib/analysis/blobray-domain" }
oer-tool-data-chip-profile = { path = "../../lib/data/chip-profile" }
oer-tool-analysis-elf = { path = "../../lib/analysis/elf" }
oer-tool-data-register-model = { path = "../../lib/data/register-model" }
oer-tool-analysis-riscv-lift = { path = "../../lib/analysis/riscv-lift" }
oer-tool-analysis-riscv-model = { path = "../../lib/analysis/riscv-model" }
oer-tool-base-command-tree = { path = "../../lib/base/command-tree", features = ["clap"] }
oer-tool-base-process = { path = "../../lib/base/process" }
oer-tool-base-toolchain = { path = "../../lib/base/toolchain" }
oer-tool-data-vendor-artifacts = { path = "../../lib/data/vendor-artifacts" }
oer-tool-service-vendor-evidence = { path = "../../lib/service/vendor-evidence", features = ["producers"] }
oer-tool-service-vendor-provenance = { path = "../../lib/service/vendor-provenance" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

