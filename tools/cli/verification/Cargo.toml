[package]
name = "oer-verification-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo verification`: vendor pins fetched, vendor diffs, provenance, typed scenarios, evidence shards, comparison probes and host stands"

[[bin]]
name = "verification"
path = "src/main.rs"

[dependencies]
blobray-application = { path = "../../lib/analysis/blobray-application" }
blobray-domain = { path = "../../lib/analysis/blobray-domain" }
oer-chip-profile = { path = "../../lib/data/chip-profile" }
oer-elf = { path = "../../lib/analysis/elf" }
oer-register-model = { path = "../../lib/data/register-model" }
oer-riscv-lift = { path = "../../lib/analysis/riscv-lift" }
oer-riscv-model = { path = "../../lib/analysis/riscv-model" }
oer-command-tree = { path = "../../lib/base/command-tree", features = ["clap"] }
oer-process = { path = "../../lib/base/process" }
oer-repo = { path = "../../tools/repo" }
oer-toolchain = { path = "../../lib/service/toolchain" }
oer-vendor-artifacts = { path = "../../lib/data/vendor-artifacts" }
oer-vendor-evidence = { path = "../evidence", features = ["producers"] }
oer-vendor-provenance = { path = "../../lib/service/vendor-provenance" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

