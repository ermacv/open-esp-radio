[package]
name = "oer-tool-service-devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Board discovery, serial consoles, resets, OpenOCD and receipted image writes under a device lock"

[features]
default = []
# Console and reset consumers do not need the espflash image writer.
image = ["dep:espflash", "dep:oer-tool-data-chip-profile", "dep:oer-tool-service-image-bundle", "dep:serde_json", "dep:tempfile"]

[dependencies]
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"], optional = true }
oer-tool-data-chip-profile = { path = "../../data/chip-profile", optional = true }
oer-tool-data-device-mac = { path = "../../data/device-mac" }
oer-tool-service-device-lock = { path = "../device-lock" }
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-service-image-bundle = { path = "../image-bundle", optional = true }
oer-tool-base-process = { path = "../../base/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serialport = { version = "4.8.1", default-features = false }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

