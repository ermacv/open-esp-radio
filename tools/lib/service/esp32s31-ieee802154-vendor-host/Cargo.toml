# Host differential stand for the ported ESP32-S31 IEEE 802.15.4 driver.
#
# This workspace compiles the public ESP-IDF driver from an explicit checkout
# (`OER_ESP_IDF_DIR`), so it is intentionally excluded from the root workspace:
# ordinary builds never need the vendor sources.

[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"

[package]
name = "oer-esp32s31-ieee802154-vendor-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host stand that runs the pinned public ESP-IDF IEEE 802.15.4 driver against recorded register and platform boundaries"
build = "build.rs"
links = "oer_esp32s31_ieee802154_vendor"

[[bin]]
name = "oer-esp32s31-ieee802154-vendor-host"
path = "src/main.rs"

[dependencies]
oer-process = { path = "../../base/process" }
oer-esp32s31-hal = { path = "../../../../crates/esp32s31/hal" }
oer-espressif-ieee802154-engine = { path = "../../../../crates/espressif/ieee802154-engine" }
oer-ieee802154 = { path = "../../../../crates/ieee802154/mac" }
oer-durable = { path = "../../base/durable" }
oer-vendor-artifacts = { path = "../../data/vendor-artifacts" }
oer-vendor-evidence = { path = "../../../evidence" }
oer-vendor-evidence-shard = { path = "../../../../qualification/evidence-shard" }

[features]
# Build the vendor driver and the port with multi-PAN and two interfaces.
multipan = []
# Build the vendor driver with software coexistence and the port with the
# driver's default scene levels.
sw-coex = []

[build-dependencies]
cc = "=1.4.3"
oer-vendor-artifacts = { path = "../../data/vendor-artifacts" }
oer-vendor-pins = { path = "../../data/vendor-pins" }

[lints]
workspace = true

