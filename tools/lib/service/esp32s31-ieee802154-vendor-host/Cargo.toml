# Host differential stand for the ported ESP32-S31 IEEE 802.15.4 driver.
#
# This workspace compiles the public ESP-IDF driver from an explicit checkout
# (`OER_ESP_IDF_DIR`), so it is intentionally excluded from the root workspace:
# ordinary builds never need the vendor sources.

[package]
name = "oer-tool-service-esp32s31-ieee802154-vendor-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host stand that runs the pinned public ESP-IDF IEEE 802.15.4 driver against recorded register and platform boundaries"
build = "build.rs"
links = "oer_esp32s31_ieee802154_vendor"

[[bin]]
name = "oer-tool-service-esp32s31-ieee802154-vendor-host"
path = "src/main.rs"

[dependencies]
oer-tool-base-process = { path = "../../base/process" }
oer-esp32s31-hal = { path = "../../../../crates/esp32s31/hal" }
oer-espressif-ieee802154-engine = { path = "../../../../crates/espressif/ieee802154-engine" }
oer-ieee802154-mac = { path = "../../../../crates/ieee802154/mac" }
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-data-vendor-artifacts = { path = "../../data/vendor-artifacts" }
oer-tool-service-vendor-evidence = { path = "../vendor-evidence" }
oer-tool-data-vendor-evidence-shard = { path = "../../data/vendor-evidence-shard" }

[features]
# Build the vendor driver and the port with multi-PAN and two interfaces.
multipan = []
# Build the vendor driver with software coexistence and the port with the
# driver's default scene levels.
sw-coex = []

[build-dependencies]
cc = "=1.4.3"
oer-tool-data-vendor-artifacts = { path = "../../data/vendor-artifacts" }
oer-tool-data-vendor-pins = { path = "../../data/vendor-pins" }

[lints]
workspace = true
