[package]
name = "oer-tool-service-stand-fixture-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Linux Bluetooth fixture over BlueZ: DTM peer check, discovery, ATT parameters and the secure GATT agent"

[dependencies]
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-base-process = { path = "../../base/process" }
oer-tool-data-hil-protocol = { path = "../../data/hil-protocol" }
oer-tool-data-hil-run-bundle-format = { path = "../../data/hil-run-bundle-format" }
oer-tool-service-hil-fixture = { path = "../hil-fixture" }
oer-tool-service-hil-lab = { path = "../hil-lab" }
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
zbus = "=5.19.0"

[lints]
workspace = true
