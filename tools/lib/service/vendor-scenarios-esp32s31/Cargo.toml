[package]
name = "oer-esp32s31-vendor-scenarios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Typed ESP32-S31 vendor-comparison scenarios driven through the Blobray CLI"

[dependencies]
oer-elf = { path = "../../analysis/elf" }
oer-durable = { path = "../../base/durable" }
oer-process = { path = "../../base/process" }
oer-vendor-evidence-shard = { path = "../../../qualification/evidence-shard" }
oer-riscv-model = { path = "../../analysis/riscv-model" }
blobray-application = { path = "../../analysis/blobray-application" }
blobray-domain = { path = "../../analysis/blobray-domain" }
oer-vendor-scenario-engine = { path = "../vendor-scenario-engine" }
oer-esp32s31-phy-relation = { path = "../../analysis/phy-relation-esp32s31" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]
oer-vendor-pins = { path = "../../data/vendor-pins" }
oer-esp-idf = { path = "../esp-idf" }
oer-image = { path = "../image" }

[lints]
workspace = true

