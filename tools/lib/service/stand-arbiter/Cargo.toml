[package]
name = "oer-tool-service-stand-arbiter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The stand arbiter: the queue and its job tickets, balances, preemption, maintenance and the device locks of every leased board"

[dependencies]
oer-tool-service-devices = { path = "../devices" }
oer-tool-service-device-lock = { path = "../device-lock" }
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-base-process = { path = "../../base/process" }
oer-tool-service-stand-claims = { path = "../stand-claims" }
oer-tool-data-stand-file = { path = "../../data/stand-file" }
oer-tool-service-stand-journal = { path = "../stand-journal" }
oer-tool-service-stand-owners = { path = "../stand-owners" }
oer-tool-service-stand-power = { path = "../stand-power" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

