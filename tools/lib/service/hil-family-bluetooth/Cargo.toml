[package]
name = "oer-hil-family-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bluetooth LE HIL workloads and the Linux Bluetooth fixture"

[dependencies]
oer-hil-schema = { path = "../../data/hil-schema" }
oer-hil-lab = { path = "../hil-lab" }
oer-hil-link = { path = "../hil-link" }
oer-hil-scenario = { path = "../hil-scenario" }
oer-hil-scenario-catalog = { path = "../../data/hil-scenario-catalog" }
oer-hil-run-bundle-format = { path = "../../run-bundle/format" }
oer-durable = { path = "../../base/durable" }
oer-hil-workload = { path = "../hil-workload" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
oer-process = { path = "../../base/process" }
oer-hil-fixture = { path = "../hil-fixture" }
tempfile = "3"
oer-hil-protocol = { path = "../../data/hil-protocol" }
oer-bluetooth-trace = { path = "../../../../crates/bluetooth/trace" }
oer-trace = { path = "../../../../crates/base/trace" }
heapless = "0.9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "=5.19.0"
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"

[dev-dependencies]
toml = "1.1"
oer-hil-workload = { path = "../hil-workload", features = ["test-support"] }

[lints]
workspace = true

