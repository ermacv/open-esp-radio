[package]
name = "oer-tool-service-image-check-stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The stack check of an image: task and bootstrap stacks bounded from their roots with the pinned ROM, and the frame coverage review"

[dependencies]
oer-tool-data-chip-profile = { path = "../../data/chip-profile" }
oer-tool-analysis-elf = { path = "../../analysis/elf" }
oer-tool-data-image-policy = { path = "../../data/image-policy" }
oer-tool-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-tool-analysis-riscv-program = { path = "../../analysis/riscv-program" }
oer-tool-analysis-riscv-stack = { path = "../../analysis/riscv-stack" }
oer-tool-data-vendor-artifacts = { path = "../../data/vendor-artifacts" }
rustc-demangle = "=0.1.28"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

