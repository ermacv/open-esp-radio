[package]
name = "oer-tool-service-hil-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Analysis of HIL run bundles: measurement samples, statistics and comparison, run queries, performance baselines and the sealed views"

[dependencies]
oer-tool-base-process = { path = "../../base/process" }
oer-tool-data-hil-run-bundle-format = { path = "../../data/hil-run-bundle-format" }
oer-tool-analysis-elf = { path = "../../analysis/elf" }
oer-tool-data-hil-protocol = { path = "../../data/hil-protocol", features = ["registry"] }
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-service-hil-run-bundle = { path = "../../service/hil-run-bundle" }
oer-tool-data-hil-schema = { path = "../../data/hil-schema" }
oer-tool-service-stats = { path = "../../service/stats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-tool-service-hil-run-bundle = { path = "../../service/hil-run-bundle", features = ["test-support"] }
roxmltree = "0.20"
tempfile = "3"

[lints]
workspace = true

