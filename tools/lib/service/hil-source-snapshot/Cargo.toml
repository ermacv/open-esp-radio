[package]
name = "oer-tool-service-hil-source-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL source snapshots: capture, identity and verified materialization of build inputs"

[features]
# The snapshot fixtures of the runner's cross-package tests.
test-support = []

[dependencies]
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-data-hil-schema = { path = "../../data/hil-schema" }
oer-tool-data-chip-profile = { path = "../../data/chip-profile" }
oer-tool-base-process = { path = "../../base/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
oer-tool-base-toolchain = { path = "../../base/toolchain" }

[lints]
workspace = true

