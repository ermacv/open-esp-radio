[package]
name = "oer-tool-service-hil-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL experiments: the one run launch, A/B comparisons and bisection"

[dependencies]
oer-tool-data-hil-run-bundle-format = { path = "../../data/hil-run-bundle-format" }
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-service-hil-analysis = { path = "../hil-analysis" }
oer-tool-service-stand-arbiter = { path = "../stand-arbiter" }
oer-tool-service-hil-image = { path = "../hil-image" }
oer-tool-service-hil-observer = { path = "../hil-observer" }
oer-tool-service-hil-run-bundle = { path = "../hil-run-bundle" }
oer-tool-data-hil-schema = { path = "../../data/hil-schema" }
oer-tool-service-hil-source-snapshot = { path = "../hil-source-snapshot" }
oer-tool-data-stand-file = { path = "../../data/stand-file" }
oer-tool-base-process = { path = "../../base/process" }
oer-tool-service-stats = { path = "../stats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

oer-tool-service-stand-claims = { path = "../stand-claims" }
oer-tool-service-stand-owners = { path = "../stand-owners" }
[dev-dependencies]
oer-tool-service-hil-run-bundle = { path = "../hil-run-bundle", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

