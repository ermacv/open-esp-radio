[package]
name = "oer-registers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reviewed register validation and SVD/PAC publication: the service behind `cargo registers`"

[dependencies]
oer-register-model = { path = "../../data/register-model" }
oer-register-review = { path = "../../data/register-review" }
oer-register-contracts = { path = "../../data/register-contracts" }
oer-process = { path = "../../base/process" }
oer-durable = { path = "../../base/durable" }
roxmltree = "=0.20.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
toml_edit = { version = "=0.25.13", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
syn = { version = "=2.0.119", features = ["full"] }
quote = "=1.0.47"
tempfile = "=3.27.0"

[dev-dependencies]
cargo_metadata = "=0.23.1"

[lints]
workspace = true
