[package]
name = "oer-tool-service-hil-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Host build, placement-audit and HIL runner for open ESP radio"

[dependencies]
oer-tool-service-image-check-interrupts = { path = "../image-check-interrupts" }
oer-tool-service-devices = { path = "../devices", features = ["image"] }
oer-tool-data-hil-run-bundle-format = { path = "../../data/hil-run-bundle-format" }
oer-tool-data-hil-schema = { path = "../../data/hil-schema" }
oer-tool-data-hil-scenario-catalog = { path = "../../data/hil-scenario-catalog" }
oer-tool-service-image-bundle = { path = "../image-bundle" }
oer-tool-base-toolchain = { path = "../../base/toolchain" }
oer-tool-service-hil-lab = { path = "../hil-lab" }
oer-tool-service-hil-link = { path = "../hil-link" }
oer-tool-service-hil-image = { path = "../hil-image" }
oer-tool-service-image = { path = "../image" }
oer-tool-data-chip-profile = { path = "../../data/chip-profile" }
oer-tool-service-hil-run-bundle = { path = "../hil-run-bundle" }
oer-tool-analysis-hil-analysis = { path = "../../analysis/hil-analysis" }
oer-tool-service-hil-scenario = { path = "../hil-scenario" }
oer-tool-service-hil-source-snapshot = { path = "../hil-source-snapshot" }
oer-tool-base-durable = { path = "../../base/durable" }
oer-tool-data-hil-image-class = { path = "../../data/hil-image-class" }
oer-tool-service-stand-board = { path = "../stand-board" }
oer-tool-service-hil-flash = { path = "../hil-flash" }
oer-tool-service-hil-workload = { path = "../hil-workload" }
oer-tool-service-hil-family-system = { path = "../hil-family-system" }
oer-tool-base-command-tree = { path = "../../base/command-tree", features = ["clap"] }
oer-tool-base-process = { path = "../../base/process" }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
oer-tool-data-hil-protocol = { path = "../../data/hil-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

oer-tool-service-device-lock = { path = "../device-lock" }
oer-tool-service-stand-journal = { path = "../stand-journal" }
oer-tool-service-stand-owners = { path = "../stand-owners" }
[dev-dependencies]
oer-tool-service-hil-run-bundle = { path = "../hil-run-bundle", features = ["test-support"] }
oer-tool-service-hil-source-snapshot = { path = "../hil-source-snapshot", features = ["test-support"] }
toml = "1.1"
oer-tool-service-hil-workload = { path = "../hil-workload", features = ["test-support"] }

[lints]
workspace = true


[build-dependencies]
oer-tool-base-process = { path = "../../base/process" }
oer-tool-service-hil-observer = { path = "../hil-observer" }
oer-tool-data-hil-run-bundle-format = { path = "../../data/hil-run-bundle-format" }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = { version = "=0.25.13", features = ["serde"] }
