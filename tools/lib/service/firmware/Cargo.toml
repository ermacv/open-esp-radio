[package]
name = "oer-tool-service-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Build, flash and run staged firmware images on the stand's boards: the service behind `cargo fw`"

[dependencies]
oer-tool-base-process = { path = "../../base/process" }
oer-tool-service-lab = { path = "../lab" }
oer-tool-data-stand-file = { path = "../../data/stand-file" }
oer-tool-data-chip-profile = { path = "../../data/chip-profile" }
oer-firmware-platform-espressif-staged-layout = { path = "../../../../firmware/platform/espressif/staged-layout" }
oer-firmware-platform-esp32s31-layout = { path = "../../../../firmware/platform/esp32s31/layout" }
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serialport = { version = "4.7", default-features = false }
toml = "=1.1.4"

[dev-dependencies]
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "std", "write"] }
tempfile = "=3.27.0"

[lints]
workspace = true
