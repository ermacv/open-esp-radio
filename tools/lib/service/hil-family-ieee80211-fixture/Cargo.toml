[package]
name = "oer-hil-family-ieee80211-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Wi-Fi HIL fixtures: laptop hostapd and wpa_supplicant, the OpenWrt AP, clients and monitors, air captures and the host route, and their fixture provider"

[dependencies]
oer-hil-run-bundle-format = { path = "../../run-bundle/format" }
oer-hil-scenario-catalog = { path = "../../data/hil-scenario-catalog" }
oer-durable = { path = "../../base/durable" }
oer-hil-fixture = { path = "../hil-fixture" }
oer-hil-lab = { path = "../hil-lab" }
oer-hil-net-traffic = { path = "../hil-net-traffic" }
oer-hil-scenario = { path = "../hil-scenario" }
oer-stand-ssh = { path = "../stand-ssh" }
oer-hil-workload = { path = "../hil-workload" }
oer-process = { path = "../../base/process" }
oer-toolchain = { path = "../toolchain" }
mio = { version = "=1.2.2", features = ["os-poll", "os-ext"] }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "stdio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
zeroize = "1.8.1"

[dev-dependencies]
oer-hil-workload = { path = "../hil-workload", features = ["test-support"] }

[lints]
workspace = true

