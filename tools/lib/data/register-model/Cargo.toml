[package]
name = "oer-tool-data-register-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Versioned editable register model and clean CMSIS-SVD materialization"

[dependencies]
oer-tool-data-register-bindings = { path = "../register-bindings" }
oer-tool-data-register-contracts = { path = "../register-contracts" }
oer-tool-data-register-review = { path = "../register-review" }
serde = { version = "=1.0.229", features = ["derive"] }
svd-encoder = "=0.14.7"
svd-parser = { version = "=0.14.9", features = ["expand"] }
svd-rs = { version = "=0.14.12", features = ["serde"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
thiserror = "=2.0.19"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
