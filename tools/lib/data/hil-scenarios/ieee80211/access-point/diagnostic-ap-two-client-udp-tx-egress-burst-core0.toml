schema = 5
id = "diagnostic-ap-two-client-udp-tx-egress-burst-core0"
description = "Two-client AP UDP TX pre-DMA destination-burst coarse Core0 diagnostic"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "multi-client", "udp", "tx", "txq", "egress", "core0", "coarse", "air-strict"]

[wifi]
image = "diagnostic-core0-rx-coarse"

[wifi.datapath]
tx_buffer = "owned-sram-promotion-burst-diagnostic"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 150
clients = { kind = "laptop-and-openwrt" }

[wifi.workload.traffic]
kind = "udp-multi-client"
duration_seconds = 16
payload_bytes = 1472
offer = { tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
minimum_bps_per_flow = 1
maximum_flow_skew_percent = 100
