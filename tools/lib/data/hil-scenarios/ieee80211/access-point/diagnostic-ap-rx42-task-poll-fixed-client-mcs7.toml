schema = 5
id = "diagnostic-ap-rx42-task-poll-fixed-client-mcs7"
description = "AP 42 Mbit/s fixed-MCS7 uplink control with Core0 task-poll telemetry"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "ht40", "rx", "task-poll", "fixed-client-mcs", "air-strict"]

[wifi]
image = "diagnostic-core0-rx-cycles"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt", fixed_ht_mcs = 7 }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 42000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
