schema = 5
id = "diagnostic-ap-rx43-tx40-threshold"
description = "Temporary AP duplex threshold probe with 43 Mbit/s uplink and 40 Mbit/s downlink"
role = "investigation"
repetitions = 1
tags = ["diagnostic-ap-airtime-threshold", "air-strict"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40" }
cycles = 2
boots = 1
timeout_seconds = 120
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 43000000, tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
