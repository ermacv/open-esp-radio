schema = 5
id = "diagnostic-ap-airtime-tx40-observed"
description = "Temporary AP downlink-only control for terminal MAC RX error correlation"
role = "investigation"
repetitions = 1
tags = ["diagnostic-ap-airtime", "diagnostic-ap-rx-hardware", "air-strict"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt" }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { tx_bps = 40000000 }

[wifi.workload.traffic.criteria]
minimum_tx_bps = 1
