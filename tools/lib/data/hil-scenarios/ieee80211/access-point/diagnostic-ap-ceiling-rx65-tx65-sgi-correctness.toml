schema = 5
id = "diagnostic-ap-ceiling-rx65-tx65-sgi-correctness"
description = "AP 65/65 Mbit/s SGI ceiling with driver observation but no per-phase cycle accounting"
role = "investigation"
repetitions = 1
tags = ["diagnostic", "wifi", "access-point", "ht40", "bidirectional", "ceiling", "fixed-client-mcs", "short-gi", "driver-observation", "air-strict"]

[wifi]
image = "correctness"

[wifi.workload]
kind = "access-point"
link = { phy = "ht40", minimum_mcs = 7, guard_interval = "short" }
cycles = 2
boots = 1
timeout_seconds = 180
clients = { kind = "openwrt", fixed_ht_mcs = 7, fixed_guard_interval = true }
independent_air_monitor = true

[wifi.workload.traffic]
kind = "udp"
duration_seconds = 10
payload_bytes = 1472
offer = { rx_bps = 65000000, tx_bps = 65000000 }

[wifi.workload.traffic.criteria]
minimum_rx_bps = 1
minimum_tx_bps = 1
