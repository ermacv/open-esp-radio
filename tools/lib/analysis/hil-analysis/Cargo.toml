[package]
name = "oer-hil-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Analysis of HIL run bundles: measurement samples, statistics and comparison, run queries, performance baselines and the sealed views"

[dependencies]
oer-process = { path = "../../base/process" }
oer-hil-run-bundle-format = { path = "../run-bundle/format" }
oer-elf = { path = "../elf" }
oer-hil-protocol = { path = "../../data/hil-protocol", features = ["registry"] }
oer-durable = { path = "../../base/durable" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-schema = { path = "../../data/hil-schema" }
oer-stats = { path = "../../service/stats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }
roxmltree = "0.20"
tempfile = "3"

[lints]
workspace = true

