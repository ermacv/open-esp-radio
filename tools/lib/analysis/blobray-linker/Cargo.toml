[package]
name = "blobray-linker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Linux adapters of Blobray's in-process linking: external ELF linkers"

[dependencies]
oer-process = { path = "../../base/process" }
blobray-application = { path = "../blobray-application" }
blobray-domain = { path = "../blobray-domain" }
oer-riscv-model = { path = "../riscv-model" }
sha2 = "=0.10.9"
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.27.0"
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }

[lints]
workspace = true

