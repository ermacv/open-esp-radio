[package]
name = "oer-tool-registers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo registers`: validate the register model and publish SVD, PAC and bindings"

[[bin]]
name = "registers"
path = "src/main.rs"

[dependencies]
oer-registers-generate = { path = "../../host/registers/generate" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
oer-os-process = { path = "../../host/os/process" }
clap = { version = "=4.5.48", features = ["derive"] }

[dev-dependencies]
oer-registers-model = { path = "../../host/registers/model" }
oer-registers-bindings = { path = "../../host/registers/bindings" }
tempfile = "=3.27.0"

[lints]
workspace = true
