[package]
name = "oer-registers-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The register model of a chip: block types, the chip root, layouts, the ownership policy and the thin PAC renderer"

[dependencies]
oer-registers-contracts = { path = "../contracts" }
serde = { version = "=1.0.229", features = ["derive"] }
toml_edit = { version = "=0.25.13", features = ["serde"] }
thiserror = "=2.0.19"
syn = { version = "=2.0.119", features = ["full"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
