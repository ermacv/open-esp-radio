[package]
name = "oer-vendor-lineage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Recover vendor function names across obfuscated archive revisions"
readme = "README.md"

[dependencies]
hex = "=0.4.3"
oer-vendor-provenance = { path = "../provenance" }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
oer-analysis-elf = { path = "../../analysis/elf" }
object = { version = "=0.39.1", default-features = false, features = ["archive", "elf", "read_core", "std", "write"] }

[lints]
workspace = true

