[package]
name = "oer-vendor-scenario-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reviewer reports of the typed vendor-comparison scenarios: untriaged locations, closure gateways and standalone inspection of pinned vendor code"

[dependencies]
oer-analysis-elf = { path = "../../analysis/elf" }
oer-os-process = { path = "../../os/process" }
oer-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-analysis-blobray-application = { path = "../../analysis/blobray-application" }
oer-analysis-blobray-domain = { path = "../../analysis/blobray-domain" }
oer-vendor-scenario = { path = "../scenario" }
clap = { version = "=4.5.48", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }

[lints]
workspace = true

