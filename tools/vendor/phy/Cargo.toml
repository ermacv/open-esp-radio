[package]
name = "oer-vendor-phy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "PHY HIL workloads: the vendor-versus-production calibration cross-check on the board under test"
readme = "README.md"

[dependencies]
heapless = { version = "0.9.3", features = ["serde"] }
oer-hil-model = { path = "../../hil/model" }
oer-hil-link = { path = "../../hil/link" }
oer-hil-lab = { path = "../../hil/lab" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", features = ["registry"] }
oer-image-build = { path = "../../image/build" }
oer-os-durable = { path = "../../os/durable" }
hex = "=0.4.3"
oer-lab-board = { path = "../../lab/board" }
oer-hil-scenario = { path = "../../hil/scenario" }
serde_json = "1.0"
oer-analysis-elf = { path = "../../analysis/elf" }
oer-os-process = { path = "../../os/process" }
oer-os-toolchain = { path = "../../os/toolchain" }
tempfile = "=3.27.0"
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true


[dev-dependencies]
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-hil-scenario = { path = "../../hil/scenario", features = ["test-support"] }
oer-hil-link = { path = "../../hil/link", features = ["test-support"] }
oer-hil-lab = { path = "../../hil/lab", features = ["test-support"] }
toml = "1.1"
