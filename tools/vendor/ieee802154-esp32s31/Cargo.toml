# Host differential stand for the ported ESP32-S31 IEEE 802.15.4 driver.
#
# This workspace compiles the public ESP-IDF driver from an explicit checkout
# (`OER_ESP_IDF_DIR`), so it is intentionally excluded from the root workspace:
# ordinary builds never need the vendor sources.

[package]
name = "oer-vendor-ieee802154-esp32s31"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "Host stand that runs the pinned public ESP-IDF IEEE 802.15.4 driver against recorded register and platform boundaries"
build = "build.rs"
links = "oer_esp32s31_ieee802154_vendor"


[dependencies]
oer-espressif-ieee802154-mac-values = { path = "../../../chips/espressif/ieee802154-mac-values" }
hex = "=0.4.3"
oer-esp32s31-knowledge = { path = "../../../chips/esp32s31/knowledge" }
oer-espressif-coex = { path = "../../../chips/espressif/coex" }
oer-espressif-ieee802154-engine = { path = "../../../chips/espressif/ieee802154-engine" }
oer-ieee802154-port = { path = "../../../protocols/ieee802154/port" }
oer-ieee802154-wire = { path = "../../../protocols/ieee802154/wire" }
# The comparison runs scenarios on any channel and power the vendor driver
# takes, so it uses the open domain.
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory", features = ["test-support"] }

[features]
# Build the vendor driver and the port with multi-PAN and two interfaces.
multipan = []
# Build the vendor driver with software coexistence and the port with the
# driver's default scene levels.
sw-coex = []

[build-dependencies]
cc = "=1.4.3"
oer-tool-pins = { path = "../../pins" }

[dev-dependencies]
cc = "=1.4.3"
oer-tool-pins = { path = "../../pins" }
tempfile = "=3.27.0"

[lints]
workspace = true
