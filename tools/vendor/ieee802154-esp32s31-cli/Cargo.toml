[package]
name = "oer-tool-vendor-ieee802154-esp32s31-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The IEEE 802.15.4 host stand's program: list, run and compare the catalog scenarios, one per process,"

[dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
oer-os-process = { path = "../../os/process" }
oer-vendor-ieee802154-esp32s31 = { path = "../ieee802154-esp32s31" }

[features]
# The stand library's builds with multi-PAN and with software coexistence.
multipan = ["oer-vendor-ieee802154-esp32s31/multipan"]
sw-coex = ["oer-vendor-ieee802154-esp32s31/sw-coex"]

[lints]
workspace = true

[[bin]]
name = "oer-tool-vendor-ieee802154-esp32s31"
path = "src/main.rs"
