[package]
name = "oer-tools-vendor-scenario"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The typed vendor-comparison scenarios: the chip-neutral engine (Blobray sessions, comparison harness, observation and state analysis), the ESP32-S31 scenarios and the reviewer reports"

[dependencies]
oer-tools-analysis-elf = { path = "../../analysis/elf" }
oer-tools-os-process = { path = "../../os/process" }
oer-tools-registers-model = { path = "../../registers/model" }
oer-tools-os-durable = { path = "../../os/durable" }
oer-tools-pins-artifacts = { path = "../../pins/artifacts" }
oer-tools-image-build = { path = "../../image/build" }
oer-tools-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-tools-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-tools-analysis-blobray-application = { path = "../../analysis/blobray-application" }
oer-tools-analysis-blobray-riscv = { path = "../../analysis/blobray-riscv" }
oer-tools-analysis-blobray-domain = { path = "../../analysis/blobray-domain" }
oer-tools-analysis-blobray-linker = { path = "../../analysis/blobray-linker" }
oer-tools-analysis-blobray-verification = { path = "../../analysis/blobray-verification" }
oer-tools-probe-codegen = { path = "../../probe/codegen" }
oer-chips-esp32s31-knowledge = { path = "../../../chips/esp32s31/knowledge" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.4"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }
oer-tools-image-esp-idf = { path = "../../image/esp-idf" }

[lints]
workspace = true

