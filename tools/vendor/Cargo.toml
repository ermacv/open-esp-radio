[package]
name = "oer-tool-vendor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo vendor-check`: vendor pins fetched, vendor diffs, provenance, typed scenarios, evidence shards, comparison probes, host stands, symbol lineage and the PHY archive audit"

[dependencies]
oer-analysis-blobray-application = { path = "../../host/analysis/blobray-application" }
oer-analysis-blobray-domain = { path = "../../host/analysis/blobray-domain" }
oer-chip-profile = { path = "../../host/chip/profile" }
oer-analysis-elf = { path = "../../host/analysis/elf" }
oer-registers-model = { path = "../../host/registers/model" }
oer-analysis-riscv-lift = { path = "../../host/analysis/riscv-lift" }
oer-analysis-riscv-model = { path = "../../host/analysis/riscv-model" }
oer-os-command-tree = { path = "../../host/os/command-tree", features = ["clap"] }
oer-os-process = { path = "../../host/os/process" }
oer-os-toolchain = { path = "../../host/os/toolchain" }
oer-pins = { path = "../../host/pins" }
oer-vendor-evidence = { path = "../../host/vendor/evidence", features = ["producers"] }
oer-vendor-lineage = { path = "../../host/vendor/lineage" }
oer-vendor-phy = { path = "../../host/vendor/phy" }
oer-vendor-provenance = { path = "../../host/vendor/provenance" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

