# reference peer's line protocol, for on-air comparison with the open driver.
image = "ieee802154-vendor-reference"
chip = "esp32s31"
pins = "esp32s31"
# Files outside this directory its build reads: they take part in its
# build recipe.
shared = [
    "../../../../lab/peers/esp32c5-ieee802154/main/peer.c",
    "../../../../../chips/esp32s31/facts/partitions/applications.csv",
]
