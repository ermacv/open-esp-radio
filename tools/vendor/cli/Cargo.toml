[package]
name = "oer-tools-vendor-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "`cargo vendor-check`: vendor pins fetched, vendor diffs, provenance, typed scenarios, comparison probes, host stands, symbol lineage and the PHY archive audit"

[dependencies]
oer-tools-image-build = { path = "../../image/build" }
oer-tools-probe-codegen = { path = "../../probe/codegen" }
oer-tools-analysis-blobray-application = { path = "../../analysis/blobray-application" }
oer-tools-analysis-blobray-domain = { path = "../../analysis/blobray-domain" }
oer-tools-chip-profile = { path = "../../chip/profile" }
oer-tools-analysis-elf = { path = "../../analysis/elf" }
oer-tools-registers-model = { path = "../../registers/model" }
oer-tools-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-tools-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-tools-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
oer-tools-os-process = { path = "../../os/process" }
oer-tools-os-toolchain = { path = "../../os/toolchain" }
oer-tools-pins-artifacts = { path = "../../pins/artifacts" }
oer-tools-vendor-lineage = { path = "../lineage" }
oer-tools-os-durable = { path = "../../os/durable" }
oer-tools-vendor-provenance = { path = "../provenance" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[dev-dependencies]
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

[[bin]]
name = "oer-tools-vendor"
path = "src/main.rs"
