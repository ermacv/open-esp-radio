[package]
name = "oer-tool-vendor-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo vendor-check`: vendor pins fetched, vendor diffs, provenance, typed scenarios, comparison probes, host stands, symbol lineage and the PHY archive audit"

[dependencies]
oer-image-build = { path = "../../image/build" }
oer-probe-codegen = { path = "../../probe/codegen" }
oer-analysis-blobray-application = { path = "../../analysis/blobray-application" }
oer-analysis-blobray-domain = { path = "../../analysis/blobray-domain" }
oer-chip-profile = { path = "../../chip/profile" }
oer-analysis-elf = { path = "../../analysis/elf" }
oer-registers-model = { path = "../../registers/model" }
oer-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
oer-os-process = { path = "../../os/process" }
oer-os-toolchain = { path = "../../os/toolchain" }
oer-tool-pins = { path = "../../pins" }
oer-vendor-lineage = { path = "../lineage" }
oer-vendor-phy = { path = "../phy" }
oer-vendor-provenance = { path = "../provenance" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

[[bin]]
name = "oer-tool-vendor"
path = "src/main.rs"
