[package]
name = "oer-vendor-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The vendor-comparison evidence index: shard format, validation, currency, the one shard writer, the verdict source policy and the producer contract"
readme = "README.md"

[dependencies]
oer-os-process = { path = "../../os/process" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
oer-chip-profile = { path = "../../chip/profile", optional = true }
oer-probe-codegen = { path = "../../probe/codegen", optional = true }
oer-os-toolchain = { path = "../../os/toolchain", optional = true }
oer-tool-pins = { path = "../../pins", optional = true }
oer-image-build = { path = "../../image/build", optional = true }
sha2 = "=0.10.9"

[features]
# The producers' orchestration (`run`): probe builds, the Blobray scenario
# runs and shard regeneration. Off for the Blobray workspace and the stands.
producers = ["dep:oer-chip-profile", "dep:oer-image-build", "dep:oer-probe-codegen", "dep:oer-os-toolchain", "dep:oer-tool-pins"]

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

