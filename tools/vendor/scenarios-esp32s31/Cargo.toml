[package]
name = "oer-vendor-scenarios-esp32s31"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Typed ESP32-S31 vendor-comparison scenarios driven through the Blobray CLI"

[dependencies]
oer-analysis-elf = { path = "../../analysis/elf" }
oer-os-durable = { path = "../../os/durable" }
oer-os-process = { path = "../../os/process" }
oer-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-analysis-blobray-application = { path = "../../analysis/blobray-application" }
oer-analysis-blobray-domain = { path = "../../analysis/blobray-domain" }
oer-vendor-scenario = { path = "../scenario" }
oer-esp32s31-knowledge = { path = "../../../chips/esp32s31/knowledge" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]
embassy-futures = "0.1.2"
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-tool-pins = { path = "../../pins" }
oer-image-esp-idf = { path = "../../image/esp-idf" }
oer-image-build = { path = "../../image/build" }

[lints]
workspace = true

# Compile the architecture-independent probe timer on the host without the
# RV32-only probe library, so its Pending/deadline/resume contract is tested.
[[test]]
name = "probe-trace-timer"
path = "../../../firmware/probes/esp32s31-radio/src/trace_timer.rs"

