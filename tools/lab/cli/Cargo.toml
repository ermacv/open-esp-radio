[package]
name = "oer-tools-lab-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "cargo stand: the shared stand's queue, leases, boards, owners, host setup and fixture software"

[[bin]]
name = "stand"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
oer-tools-chip-profile = { path = "../../chip/profile" }
oer-chips-family-facts = { path = "../../../chips/family/facts" }
oer-tools-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
oer-tools-os-durable = { path = "../../os/durable" }
oer-tools-os-process = { path = "../../os/process", features = ["clap"] }
oer-tools-lab-arbiter = { path = "../arbiter" }
oer-tools-lab-model = { path = "../model" }
oer-tools-lab-fixture = { path = "../fixture" }
oer-tools-lab-client = { path = "../client" }
oer-tools-os-toolchain = { path = "../../os/toolchain" }
rustix = { version = "=1.1.4", features = ["process"] }
serde_json = "=1.0.151"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true

