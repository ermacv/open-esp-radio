# Firmware catalog entry: `cargo fw idf build openthread-peer`.
# ESP-IDF's OpenThread stack over its IEEE 802.15.4 driver, the Thread
# reference peer for the device under test's OpenThread radio.
image = "openthread-peer"
chip = "esp32c5"
# The ESP32-C5 pins: the same ESP-IDF revision with the ESP32-C5 archives.
pins = "esp32c5"
