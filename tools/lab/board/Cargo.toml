[package]
name = "oer-tools-lab-board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Board discovery, serial consoles, resets, OpenOCD and receipted image writes under a device lock"

[dependencies]
hex = "=0.4.3"
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
oer-tools-chip-profile = { path = "../../chip/profile" }
oer-chips-family-facts = { path = "../../../chips/family/facts" }
oer-tools-lab-model = { path = "../model" }
oer-tools-os-durable = { path = "../../os/durable" }
oer-tools-image-bundle = { path = "../../image/bundle" }
oer-tools-os-process = { path = "../../os/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serialport = { version = "4.8.1", default-features = false }
oer-tools-os-serial = { path = "../../os/serial" }
tempfile = { version = "3" }
oer-tools-lab-router = { path = "../router" }
oer-tools-registers-model = { path = "../../registers/model" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

