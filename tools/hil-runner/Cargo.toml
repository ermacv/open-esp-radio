[package]
name = "oer-tool-hil-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL runner executable, which `cargo hil` builds and runs"

[dependencies]
oer-hil-run = { path = "../../host/hil/run" }

[build-dependencies]
oer-os-process = { path = "../../host/hil/../os/process" }
oer-hil-observer = { path = "../../host/hil/observer" }
oer-hil-runs = { path = "../../host/hil/runs" }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = { version = "=0.25.13", features = ["serde"] }

[dev-dependencies]
oer-hil-runs = { path = "../../host/hil/runs" }
oer-os-durable = { path = "../../host/os/durable" }
oer-os-process = { path = "../../host/os/process" }
serde_json = "1.0"
tempfile = "3"

[lints]
workspace = true
