[package]
name = "oer-tools-image-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Resolve an image's execution configuration and check its declared links on the host"

[dependencies]
oer-chips-family-facts = { path = "../../../chips/family/facts" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"
thiserror = "=2.0.19"

[dev-dependencies]
oer-chips-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-chips-esp32s31-radio-ieee80211-backend = { path = "../../../chips/esp32s31/radio/ieee80211/backend" }
oer-portable-mmio = { path = "../../../portable/mmio" }
oer-tools-registers-model = { path = "../../registers/model" }
syn = { version = "=2.0.119", features = ["full"] }
quote = "=1.0.47"

[lints]
workspace = true
