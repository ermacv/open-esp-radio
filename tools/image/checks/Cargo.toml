[package]
name = "oer-image-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The checks of an image: the stack, interrupt-stack and placement checks, the post-link input check, and the image linker that runs it"


[dependencies]
oer-analysis-elf = { path = "../../analysis/elf" }
oer-analysis-riscv-decode = { path = "../../analysis/riscv-decode" }
oer-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-analysis-riscv-program = { path = "../../analysis/riscv-program" }
oer-analysis-riscv-stack = { path = "../../analysis/riscv-stack" }
oer-chip-profile = { path = "../../chip/profile" }
oer-espressif-facts = { path = "../../../chips/espressif/facts" }
oer-os-durable = { path = "../../os/durable" }
oer-os-process = { path = "../../os/process" }
oer-tool-pins = { path = "../../pins" }
rustc-demangle = "=0.1.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "1.1"

[dev-dependencies]
oer-os-toolchain = { path = "../../os/toolchain" }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }
tempfile = "=3.27.0"

[lints]
workspace = true
