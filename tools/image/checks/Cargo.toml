[package]
name = "oer-tools-image-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The checks of an image: the stack, interrupt-stack and placement checks, the post-link input check, and the image linker that runs it"


[dependencies]
oer-tools-analysis-elf = { path = "../../analysis/elf" }
oer-tools-analysis-riscv-decode = { path = "../../analysis/riscv-decode" }
oer-tools-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-tools-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-tools-analysis-riscv-program = { path = "../../analysis/riscv-program" }
oer-tools-image-stack = { path = "../stack" }
oer-tools-chip-profile = { path = "../../chip/profile" }
oer-tools-image-bundle = { path = "../bundle" }
oer-chips-family-facts = { path = "../../../chips/family/facts" }
oer-tools-os-durable = { path = "../../os/durable" }
oer-tools-os-process = { path = "../../os/process" }
oer-tools-pins-artifacts = { path = "../../pins/artifacts" }
rustc-demangle = "=0.1.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "1.1"

[dev-dependencies]
oer-chips-family-platform-runtime = { path = "../../../chips/family/platform/runtime" }
oer-tools-os-toolchain = { path = "../../os/toolchain" }
object = { version = "=0.39.1", default-features = false, features = ["elf", "read", "std", "write"] }
tempfile = "=3.27.0"

[lints]
workspace = true
