[package]
name = "oer-tool-image-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo fw`: build, flash and run staged firmware images on the stand's boards"

[[bin]]
name = "fw"
path = "src/main.rs"

[dependencies]
oer-hil-lab = { path = "../../hil/lab" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-image-build = { path = "../build" }
oer-image-checks = { path = "../checks" }
oer-chip-profile = { path = "../../chip/profile" }
oer-lab-board = { path = "../../lab/board" }
oer-lab-model = { path = "../../lab/model" }
oer-lab-router = { path = "../../lab/router" }
oer-os-durable = { path = "../../os/durable" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "1.1"
oer-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
