[package]
name = "oer-tool-image-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "`cargo fw`: build, flash and run staged firmware images on the stand's boards"

[[bin]]
name = "fw"
path = "src/main.rs"

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-trace = { path = "../../../portable/trace" }
oer-espressif-esp-hal-radio = { path = "../../../chips/espressif/esp-hal/radio" }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
hex = "=0.4.3"
oer-hil-lab = { path = "../../hil/lab" }
oer-hil-link = { path = "../../hil/link" }
oer-radio-regulatory = { path = "../../../protocols/radio/regulatory" }
oer-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-ieee80211-port = { path = "../../../protocols/ieee80211/port" }
oer-ieee80211-upper-mac = { path = "../../../protocols/ieee80211/upper-mac" }
oer-image-build = { path = "../build" }
oer-image-checks = { path = "../checks" }
oer-chip-profile = { path = "../../chip/profile" }
oer-lab-board = { path = "../../lab/board" }
oer-lab-model = { path = "../../lab/model" }
oer-lab-router = { path = "../../lab/router" }
oer-lab-arbiter = { path = "../../lab/arbiter" }
oer-os-process = { path = "../../os/process" }
oer-tool-lab-fixture-install = { path = "../../lab/fixture-install" }
oer-os-durable = { path = "../../os/durable" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
oer-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }
tempfile = "=3.27.0"

[dev-dependencies]
oer-firmware-apps-w3 = { path = "../../../firmware/apps/w3" }
crc = { version = "=3.4.0", default-features = false }
oer-memory = { path = "../../../portable/memory" }

[lints]
workspace = true
