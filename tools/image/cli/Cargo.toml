[package]
name = "oer-tool-image-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "`cargo fw`: build, flash and run staged firmware images on the stand's boards"

[[bin]]
name = "fw"
path = "src/main.rs"

[dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-trace = { path = "../../../portable/trace" }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
oer-image-build = { path = "../build" }
oer-image-bundle = { path = "../bundle" }
oer-image-checks = { path = "../checks" }
oer-image-esp-idf = { path = "../esp-idf" }
oer-chip-profile = { path = "../../chip/profile" }
oer-lab-arbiter = { path = "../../lab/arbiter" }
oer-lab-client = { path = "../../lab/client" }
oer-os-process = { path = "../../os/process" }
oer-lab-model = { path = "../../lab/model" }
serde_json = "1.0"
oer-os-command-tree = { path = "../../os/command-tree", features = ["clap"] }
clap = { version = "=4.5.48", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"
oer-espressif-facts = { path = "../../../chips/espressif/facts" }

[lints]
workspace = true
