[package]
name = "oer-tools-image-linker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The image linker: input checks and analysis-driven strict code placement through the target's rust-lld"

# The cargo configuration and the image pipeline name the linker binary.
[[bin]]
name = "oer-image-linker"
path = "src/main.rs"

# The first-pass analysis of a saved runtime ELF, without a link.
[[bin]]
name = "oer-image-analyze-saved"
path = "src/bin/analyze_saved.rs"

[dependencies]
oer-tools-image-checks = { path = "../checks" }

[lints]
workspace = true
