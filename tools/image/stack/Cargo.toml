[package]
name = "oer-tools-image-stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Worst-case stack bounds of a static RV32 image from its machine code"

[dependencies]
oer-tools-analysis-elf = { path = "../../analysis/elf" }
oer-tools-analysis-riscv-analysis = { path = "../../analysis/riscv-analysis" }
oer-tools-analysis-riscv-decode = { path = "../../analysis/riscv-decode" }
oer-tools-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-tools-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-tools-analysis-riscv-program = { path = "../../analysis/riscv-program" }
oer-portable-riscv = { path = "../../../portable/riscv" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]
oer-tools-chip-profile = { path = "../../chip/profile" }
oer-chips-family-facts = { path = "../../../chips/family/facts" }
tempfile = "=3.27.0"
clap = { version = "4.5", features = ["derive"] }
object = { version = "=0.39.1", default-features = false, features = ["elf", "std", "write"] }

[lints]
workspace = true

