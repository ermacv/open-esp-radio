[alias]
# The register tool: validate the register model and generate SVD, PAC and
# bindings (tools/lib/service/registers/README.md).
registers = "run --quiet --profile tools -p oer-registers-cli --"
# The firmware tool: build, flash and run staged images on the stand's
# boards (tools/lib/service/firmware/README.md).
fw = "run --quiet --profile tools -p oer-fw --"

[net]
# GitHub access uses HTTPS credentials managed by Git. Delegate git
# dependencies to the CLI so Cargo shares the configured credential helper.
git-fetch-with-cli = true

[env]
# Cargo reads this file for every workspace below the repository root,
# the firmware members included.
# Staged images keep esp-hal's PMP region setup off: its single
# "read/write, no execute" TOR region from `_data_start` to `_noinit_end`
# would span stage two's PSRAM code between SRAM data and PSRAM noinit, and
# the image would fault right after the handoff.
ESP_HAL_CONFIG_ENABLE_PMP = "false"
