[alias]
# The captured binary analysis tool (tools/analysis/blobray-README.md).
blobray = "run --quiet --profile tools -p oer-tool-analysis-cli --"
# The register tool: validate the register model and generate SVD, PAC and
# bindings (tools/registers/generate/README.md).
registers = "run --quiet --profile tools -p oer-tool-registers-cli --"
# The firmware tool: build, flash and run staged images on the stand's
# boards (tools/image/cli/README.md).
fw = "run --quiet --profile tools -p oer-tool-image-cli --"
# Fetch and verify a chip's pinned vendor artifacts into the host-wide store
# (tools/pins).
pins = "run --quiet --profile tools -p oer-tool-pins --"
# Regenerate the regulatory tables from a wireless-regdb db.txt
# (tools/regulatory/generate).
regdb = "run --quiet --profile tools -p oer-tool-regulatory-generate --"
# The stand: boards, leases, power, fixtures (tools/lab/cli).
stand = "run --quiet --profile tools -p oer-tool-lab-cli --"
# HIL runs (tools/hil/run/HIL.md).
hil = "run --quiet --profile tools -p oer-tool-hil-cli --"
# The vendor comparison: provenance, scenarios and the probe
# images (tools/vendor/cli).
vendor-check = "run --quiet --profile tools -p oer-tool-vendor-cli --"

[net]
# GitHub access uses HTTPS credentials managed by Git. Delegate git
# dependencies to the CLI so Cargo shares the configured credential helper.
git-fetch-with-cli = true

[env]
# Cargo reads this file for every workspace below the repository root,
# the firmware members included.
# Staged images keep esp-hal's PMP region setup off: its single
# "read/write, no execute" TOR region from `_data_start` to `_noinit_end`
# would span stage two's PSRAM code between SRAM data and PSRAM noinit, and
# the image would fault right after the handoff.
ESP_HAL_CONFIG_ENABLE_PMP = "false"
