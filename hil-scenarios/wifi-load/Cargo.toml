[package]
name = "oer-hil-scenarios-wifi-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The HIL Wi-Fi station load scenario: UDP load between the host and the image's station through the lab router, RX, TX and both, with throughput, loss, RTT and CPU measurements"

[dependencies]
oer-hil-agent = { path = "../../protocols/hil/agent" }
oer-analysis-elf = { path = "../../tools/analysis/elf" }
oer-hil-harness = { path = "../../tools/hil/harness" }
oer-image-build = { path = "../../tools/image/build" }
oer-image-checks = { path = "../../tools/image/checks" }
oer-os-process = { path = "../../tools/os/process" }
oer-lab-model = { path = "../../tools/lab/model" }
oer-services-load = { path = "../services/load" }
oer-services-wifi-station = { path = "../services/wifi-station" }
heapless = "0.9.3"
serde_json = "1.0"

[lints]
workspace = true

[package.metadata.open-radio]
# `cargo hil` lists and runs it.
hil-scenario = true
