[package]
name = "oer-hil-scenarios-images-esp32s31-wifi-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-time = { path = "../../../portable/time" }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-embassy-net = { path = "../../../portable/embassy/net" }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-esp32s31-wifi = { path = "../../../chips/esp32s31/wifi" }
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-trace = { path = "../../../portable/trace" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
critical-section = "1.2.0"
embassy-futures = "0.1.2"
oer-espressif-executor = { workspace = true, features = ["port-slots"] }
oer-hil-protocol = { workspace = true, features = ["async-io"] }
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-services-wifi-station = { path = "../../services/wifi-station" }
oer-services-load = { path = "../../services/load" }
heapless = "0.9.3"
# The pinned stack's UDP sockets for the load service (the revision
# `oer-embassy-net` pins), and each socket's receive queue at its largest.
embassy-net = { git = "https://github.com/ermacv/embassy.git", rev = "f11388d0af7c43347f8ccd9f26a6505dedf098da", default-features = false, features = ["udp"] }
xarxa = { git = "https://github.com/ermacv/xarxa.git", rev = "5b6f11a793c3b07e5ef5be39f3ad5e9b6e0fa711", default-features = false, features = ["udp-rx-queue-count-16"] }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose", features = ["wifi-fault", "radio-fault"] }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout" }
static_cell.workspace = true

[dev-dependencies]
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-memory = { path = "../../../portable/memory" }
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-hil-protocol = { workspace = true }
oer-services-wifi-station = { path = "../../services/wifi-station" }
oer-services-load = { path = "../../services/load" }
heapless = "0.9.3"
oer-trace = { path = "../../../portable/trace" }
postcard = { version = "1.1.3", default-features = false }

[lints]
workspace = true

[build-dependencies]
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout", features = ["build"] }

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { pac = 0, hal = 48, chips = 264, portable = 32, protocols = 114, firmware = 7, core = 16, embassy = 3, third-party = 56, unnamed = 0, hardware = 0 }
bootstrap = { unnamed = 0 }

[package.metadata.open-radio]
critical-section-hart = "boot"
# Every task stack of this image is fully analysed: an unresolved path fails `cargo fw build`.
task-stack = "proven"
# The harts this image runs: hart 1 starts during boot and runs the
# station's network end, its IP stack and the load server on its own
# interrupt-mode executor with its own timer.
harts = ["boot", 1]
# The load service's CPU report collects the executors' activity
# observations, which only `oer_trace` builds emit.
instrumentation = ["trace"]
