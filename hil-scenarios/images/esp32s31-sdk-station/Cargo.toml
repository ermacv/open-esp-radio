[package]
name = "oer-hil-scenarios-images-esp32s31-sdk-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "The HIL image of the SDK station scenario: an oer-espressif Wi-Fi station and IP service served over the HIL console"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-espressif = { path = "../../../sdk/espressif", features = ["esp32s31", "wifi", "console"] }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-memory = { path = "../../../portable/memory" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-hil-protocol = { workspace = true, features = ["async-io"] }
oer-services-sdk-station = { path = "../../services/sdk-station" }
oer-services-wifi-station = { path = "../../services/wifi-station" }
embassy-futures = "0.1.2"
heapless = "0.9.3"
static_cell.workspace = true

[dev-dependencies]
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-hil-protocol = { workspace = true }
oer-services-sdk-station = { path = "../../services/sdk-station" }
heapless = "0.9.3"
postcard = { version = "1.1.3", default-features = false }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
