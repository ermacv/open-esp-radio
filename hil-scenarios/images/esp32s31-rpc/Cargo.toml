[package]
name = "oer-hil-scenarios-images-esp32s31-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-time = { path = "../../../portable/time" }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-espressif-interrupt-table = { path = "../../../chips/espressif/interrupt-table" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-memory = { path = "../../../portable/memory" }
oer-riscv = { path = "../../../portable/riscv" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
embassy-sync.workspace = true
embassy-time.workspace = true
critical-section = "1.2.0"
oer-espressif-executor.workspace = true
oer-hil-protocol = { workspace = true, features = ["async-io"] }
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-services-aes = { path = "../../services/aes" }
oer-espressif-staged-runtime = { path = "../../../chips/espressif/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose" }
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-espressif-usb-serial-jtag.workspace = true
embedded-io-async = "0.7.0"
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout" }
static_cell.workspace = true

[dev-dependencies]
oer-time = { path = "../../../portable/time" }
oer-diagnostics = { path = "../../../portable/diagnostics", features = ["render"] }
oer-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-hil-protocol = { workspace = true }
oer-services-aes = { path = "../../services/aes" }
heapless = "0.9.3"
postcard = { version = "1.1.3", default-features = false }

[lints]
workspace = true

[build-dependencies]
oer-esp32s31-layout = { path = "../../../chips/esp32s31/layout", features = ["build"] }

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each only shrinks, toward 0.
runtime = { pac = 11, hal = 39, chips = 489, portable = 122, protocols = 191, firmware = 69, core = 20, embassy = 66, third-party = 63, unnamed = 13, hardware = 11 }
bootstrap = { unnamed = 2 }

[package.metadata.open-radio]
critical-section-hart = "boot"
