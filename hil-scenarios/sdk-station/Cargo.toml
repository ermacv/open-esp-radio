[package]
name = "oer-hil-scenarios-sdk-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The HIL SDK station scenario: an oer-espressif station refuses a wrong passphrase without a reset, joins, takes a DHCP address, exchanges a line over TCP with the host, rejoins after a deauthentication and times out without DHCP"

[dependencies]
oer-hil-agent = { path = "../../protocols/hil/agent" }
oer-hil-harness = { path = "../../tools/hil/harness" }
oer-lab-model = { path = "../../tools/lab/model" }
oer-services-sdk-station = { path = "../services/sdk-station" }
heapless = "0.9.3"
serde_json = "1.0"

[lints]
workspace = true

[package.metadata.open-radio]
# `cargo hil` lists and runs it.
hil-scenario = true
