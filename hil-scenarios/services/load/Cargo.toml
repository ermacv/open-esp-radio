[package]
name = "oer-services-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL load service: UDP load the image receives, sends and echoes over the test network, its counters, the image's CPU load, and the datagram header both ends share"

[dependencies]
oer-hil-agent = { path = "../../../protocols/hil/agent" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false }

[lints]
workspace = true
