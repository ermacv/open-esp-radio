[package]
name = "oer-services-wifi-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The HIL Wi-Fi station service: join, status and leave requests to the image's station facade, their responses and their mapping from the product station runtime"

[dependencies]
oer-hil-agent = { path = "../../../protocols/hil/agent" }
oer-hil-protocol = { path = "../../../protocols/hil/protocol", default-features = false }
oer-ieee80211-runtime = { path = "../../../protocols/ieee80211/runtime" }
oer-network-port = { path = "../../../protocols/network/port" }
heapless = { version = "0.9.3", features = ["serde"] }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false }

[lints]
workspace = true
