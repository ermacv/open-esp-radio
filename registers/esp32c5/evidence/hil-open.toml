# Reviewed register evidence: hil open.
schema = 1

[[sources]]
id = "HIL_OPEN_C5_REGISTER_PROBE_2026_09_27"
kind = "unattested-hil-observation"
description = "ESP32-C5 v1.0 board, predecessor HIL run, 2026-09-27: an open register probe image, flashed and captured over USB Serial/JTAG. After opening the IEEE 802.15.4 MAC clocks, a read-modify-write of all ones read back CHANNEL 0x000000ff, TX_POWER 0x0000001f, EVENT_ENABLE 0x00001fff and COEX_PTI 0x000001ff. This establishes which bits of those words are implemented and read-write; it assigns no meaning to CHANNEL bit 7, which the public struct declares reserved."

[[sources]]
id = "HIL_OPEN_C5_MODEM_CLOCK_PROBE_2026_09_27"
kind = "unattested-hil-observation"
description = "ESP32-C5 v1.0 board, predecessor HIL run, 2026-09-27: the open register probe image, flashed and captured with the air interface unused. Through the predecessor's ESP32-C5 PAC modem-clock registers, disabling and re-enabling each of the Coexistence, Etm, BluetoothApb, BluetoothIeee802154CommonBaseband and Ieee802154Mac devices made its vendor enable check read false and then true; pulsing the IEEE 802.15.4 MAC reset left both reset lines released. esp-pacs reads of MODEM_SYSCON CLK_CONF, MODEM_RST_CONF and CLK_CONF1 and MODEM_LPCON CLK_CONF showed 0x11e01002, 0, 0x00030000 and 0x5 before and 0x11e01002, 0, 0x00030000 and 0x7 after, so no bit outside the published fields changed; LPCON CLK_COEX_EN was clear after esp-hal initialization and was left set."

[[sources]]
id = "hil-open-c5-i2c-mst-st-map-usb-reset-2026-09-27"
kind = "unattested-hil-observation"
description = "ESP32-C5 v1.0 board, predecessor HIL runs, 2026-09-27, recorded as the ESP32-C5 rev 1.0 USB Serial/JTAG reset erratum in docs/hardware-errata.md. ESP-IDF's modem clock initialisation (ESP_IDF_4D59230D_C5_MODEM_CLOCK, modem_clock_impl.c MODEM_CLOCK_DOMAIN_I2C_MASTER default ICG_NOGATING_ACTIVE | ICG_NOGATING_MODEM) leaves MODEM_LPCON CLK_CONF_POWER_ST CLK_I2C_MST_ST_MAP at 0x6, while the ROM and esp-hal leave 0x4. With 0x6, a USB Serial/JTAG RTS reset booted the ROM into UART/SDIO download (boot:0x0); restoring only this field to 0x4 in the running ESP-IDF image made the same reset boot from flash, and restoring every other differing LP register, including CLK_LP_APB_ST_MAP, did not. The field therefore survives the HP-system reset and is read-write at bits 27:24; the meaning of each state bit is the ESP-IDF one and is not otherwise observed."

[[sources]]
id = "HIL_OPEN_C5_PHY_I2C_READ_PROBE_2026_09_27"
kind = "unattested-hil-observation"
description = "ESP32-C5 v1.0 board, predecessor HIL run, 2026-09-27: the open register probe image, flashed and captured through JTAG. With the analog I2C master clock enabled by esp-hal, the predecessor's ESP32-C5 PAC PHY I2C registers read registers 0 to 15 of blocks 0x66, 0x6A, 0x6D and 0x61 by publishing the host map, the read mask and the command and observing completion; every byte equalled the byte the ROM leaf rom-rev100[]::phy_chip_i2c_readReg_org at 0x4000754A returned for the same block, read mask, host and register."
