id = "ESP_IDF_4D59230D_S31_INTERRUPT_ZB_MAC_MAP"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/interrupt_core0_reg.h sha256 60785a48a2b2be35670a789bf2e0a82a45f4bd85f110fc18c197de14211f311e (lines 2786-2805), interrupt_core0_struct.h sha256 fff9ca086bd0f10f6f931cdf104c27fe80a8edb58f5898de55b966eaf8318f75 (interrupt_core0_modem_zb_mac_intr_map_reg_t) and interrupt_core1_reg.h sha256 e7966b5cda22b0df047182c6f7758c385b95edb991cdc40d0794127fdfdaf335. The MODEM_ZB_MAC_INTR map word at +0x210 of each core holds modem_zb_mac_intr_map in bits 5:0 and modem_zb_mac_intr_pass_level in bits 9:8; bits 7:6 (reserved_6) and 31:10 (reserved_10) are declared reserved, without a name or meaning."

