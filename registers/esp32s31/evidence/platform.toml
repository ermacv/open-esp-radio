id = "ESP_IDF_4D59230D_S31_LP_CLKRST"
description = "Official ESP-IDF commit 4d59230ddff16327812782151ef0afef202dc6d7: components/soc/esp32s31/register/soc/lp_clkrst_reg.h sha256 0f545692ddb5bc4fd5fee64752871425cd0012090ee203701978bb654874f211 defines LP_AONCLKRST_HPCORE0_RESET_CAUSE_REG at DR_REG_LP_AONCLKRST_BASE + 0x30, read-only HPCORE0_RESET_FLAG at bit 0 and HPCORE0_RESET_CAUSE at bits 6:1 (6'h1 POR reset); components/soc/esp32s31/register/soc/reg_base.h sha256 24a0c98ca63b042ed32d42c5566b979d412e04ec7b1b9d305bb7addc12577f9d sets DR_REG_LP_AONCLKRST_BASE to 0x20701000."
