id = "HIL_OPEN_HT40_SOFTWARE_CTS_2026_09_21"
kind = "unattested-hil-observation"
description = "ESP32-S31 rev0, 2026-09-21, diagnostic-tx-protection-air with a source-snapshotted experimental HT SOFTWARE_CTS request in the production PAC and ordinary production DMA/retry owner. Snapshot 70397fa8e1ed793d941144ffead1f798c651cb8d5cd85af32df94f4dd46d624a; runtime ELF sha256 048c5ec016d7ce191b9b0f1af221b1ad1be6d0fa0ae094adb8988bcf82f108af. HIL run 1789981709062-0027be8b passed the UDP workload; its independent primary-channel pcap sha256 1faed0c26d5672fd8ceffe6c4b656b8dac1e31ca2ec3805208311170effea0c5 records CTS addressed to the DUT before its HT40 MCS7 SGI unicast data and ACK/BlockAck. The single-MPDU exchange records CTS Duration 104 and data Duration 44 at a 24-Mbit/s control rate. Repeat run 1789982329025-0027f28d passed; separate secondary-channel-9 HT20 capture sha256 f68d688c8f8ba2f91f1c333960e251962ad1da34bbafc66e21d8b457b2cff9da records the same CTS destination on the other 20-MHz half of primary-channel-13 HT40-below. External capture ownership, channel, firmware identity and restoration are in its provenance.json; it is a diagnostic sidecar, not a qualification seal. This establishes the bounded hardware-generated CTS request. It does not qualify other PHY/rate/receiver combinations, every NAV value, CTS-timeout recovery or warm protected-to-unprotected queue turnover. Production protection admission remains closed."

[[sources]]
id = "HIL_OPEN_HT40_SOFTWARE_RTS_2026_09_21"
kind = "unattested-hil-observation"
description = "ESP32-S31 rev0, 2026-09-21, diagnostic-tx-protection-air with experimental HT SOFTWARE_RTS in the source-snapshotted production PAC and the ordinary DMA/retry owner. Snapshot 65c68d60e570e88adefd7c29332436d1688fe266fff27cbfc4fe9d2b5c71c271; runtime ELF sha256 85165d09f79670fa2d3141b90d1a720ce827e49c301b8a0cc82b3c24eb4e3d23. Run 1789981986182-0027d860 primary-channel capture sha256 eab9c6bda6be51a37011239934e8915dd0363f0e8468bcdd54d17bff5fcd3198 records DUT-to-AP RTS, CTS addressed to DUT, HT40 MCS7 SGI data and ACK; single-MPDU RTS/CTS Duration is 152/108, with 24-Mbit/s control frames. Its delivery completed but 88 aggregates did not meet the workload's 100-aggregate threshold. Twelve-second repeat 1789982495219-0027f53c passed with 128 full32 aggregates. Independent secondary-channel-9 HT20 capture sha256 56cc2de6388a8d2e97c2171f97ad89948cdae4632a079e3c28d17349b848340b records DUT-to-AP RTS and CTS responses on the other 20-MHz half of primary-channel-13 HT40-below. Its provenance.json records ownership, geometry, selected firmware and successful restoration; the sidecar is not a qualification seal. Full32 RTS/CTS Duration is 5680/5636; this diagnostic does not establish the complete automatic NAV algorithm. Other PHY/rate/receiver combinations, missing-CTS recovery and warm queue turnover remain outside the observation. Production protection admission remains closed."

[[sources]]
id = "HIL_OPEN_HT40_PROTECTION_TURNOVER_2026_09_21"
kind = "unattested-hil-observation"
description = "ESP32-S31 rev0, 2026-09-21, diagnostic-tx-protection-air run 1789985071050-0028227b passed with the production descriptor-bound protection parameter and idle-queue CTS/RTS replacement. Snapshot 72f34f0549acdb3be5c5a0148a8e5f2719573c9806717eab6c37e5969e1b7a6c; runtime ELF sha256 fb0529938fc6ea26768b5a462c6a754f47fda99e928d7e48c5623ba4134aaf4a. An explicitly snapshotted experiment cycles the ordinary HT aggregate configuration through CtsToSelf, RtsCts and None; the PAC has no experimental forcing. Independent primary-channel capture sha256 8ee12918fee911f973d4bc059ed82ac3c7e2840cd560a7980dd09d5e079b583f contains 58 DUT-origin RTS frames and 66 CTS frames addressed to the DUT. Its opening sequence includes CTS frame 5 before DATA 6, RTS/CTS 41/42 before DATA 43, and DATA 64 without an observed preceding protection frame. Passive capture losses prevent treating absence as proof for every exchange. The best-effort HT40 MCS7 SGI workload completed 175 aggregates across 185 publications, with 4089 acknowledged subframes, two individual fallback retries and no hardware timeout or collision. This is bounded on-air evidence for per-publication queue turnover, not qualification of every PHY, queue, receiver, NAV value or missing-CTS recovery. Normal protocol admission remains closed."

[[sources]]
id = "HIL_OPEN_HT40_MISSING_CTS_RECOVERY_2026_09_21"
kind = "unattested-hil-observation"
description = "ESP32-S31 rev0, 2026-09-21, diagnostic-tx-protection-air run 1790007947790-002b0d7d; source snapshot 7fdc60164eb33afe7344db71724e41a897be1597bd1e653d0949466f9d81cedd, runtime ELF sha256 aedbc0ec6a7584dffccd71d14ecabe4079eb234b14c284c4145d47e367023cba. The source-snapshotted experiment paces individual UDP datagrams at 200 kbit/s and cycles RtsCts, CtsToSelf and None by MPDU sequence modulo three. Only workload UDP is affected. The first RTS publication addresses absent receiver 02:4f:45:52:ff:fe; the existing ordinary retry owner re-publishes to the fixture AP. Protection selection and receiver mutation occur before DMA reservation. Frozen OTXR reports 204 terminal successes, 68 CTS-timeout re-publications and 68 recovered transactions, one ACK retry, no missing report, terminal CTS failure, collision or hardware timeout. Independent primary-channel capture sha256 4b908a3b579556820d7387bc3fc3b064ee12dab2f24a6fe77adcd0aa0c88932a contains 66 RTS to the absent receiver, 64 RTS to the AP and 158 DUT data frames, all HT40 MCS7 SGI; no data to the absent receiver was captured. Frames 22 through 26 show absent-receiver RTS, AP RTS, CTS, DATA sequence 2091 with Retry clear, and ACK; RTS/CTS/DATA Duration is 316/272/44. The laptop capture sha256 d98e0a81388e144db9867c9cdc67da9e1c81d7477058d66f755dd08acfa9f34f records all 68 absent/AP RTS pairs and 136 CTS addressed to the DUT, but no DUT data. Capture loss prevents exhaustive per-packet inference. The overall scenario failed its complete-burst criterion with 204 host datagrams (sequence 0 through 203); this is bounded recovery evidence, not a passed qualification workload. Fixture cleanup succeeded. This does not establish retry exhaustion, other PHY/rate/queue/receiver combinations, aggregate CTS recovery, every NAV value or production protection admission."

[[sources]]
id = "HIL_OPEN_MAC_LOCAL_TIME_RATE_2026_10_03"
kind = "unattested-hil-observation"
description = "Diagnostic RX-clock run on ESP32-S31 rev0, open PHY/MAC, diagnostic-rx-clock image and a controlled AP over HE20, 2026-10-03, run 1791029233233-001511d2. 335 readings of WIFI_MAC_LOCAL_TIME.COUNTER, each between two system-timer readings 1-3 us apart, over 34 s fitted one microsecond per tick at 1.000000003 times the system-timer rate with a residual of -0.5 to +0.6 ticks and no step; receive timestamps of the RX-control prefix were readings of the same counter, 131-442 us before their executor handoff."

[[sources]]
id = "HIL_W1_RX_WALKER_2026_10_18"
kind = "unattested-hil-observation"
description = "W1 stand runs 1-6 of 2026-10-18 on ESP32-S31 rev0, the open driver on the W1 image (firmware/apps/w1): a 32-descriptor ring of 1664-byte buffers, 32 staging leases, 2.4 GHz, two hold cycles per run. A doorbell rung with NEXT = 0 resumed the walker at LAST.next; a bare RX_DESCRIPTOR_BASE write with NEXT = 0 was picked up; no held lease changed. Armed descriptors carried word0 0x81a00680: size 1664 in bits 13:0, length 1664 in bits 27:14, bit 31 set, bits 30:29 clear; completed ones bit 30 set with the received length in bits 27:14. Described in knowledge/esp32s31/wifi/rx-walker.md; console logs in the ignored target/fw/runs/."

[[sources]]
id = "HIL_W1_OWNER_BIT_2026_10_18"
kind = "unattested-hil-observation"
description = "ESP32-S31 rev0 (board s31-a), receive-only on channel 13 with the stand AP, ring of 32 descriptors x 1664 bytes plus the reserved descriptor, 2026-10-18, six runs. Clearing bit 31 of an armed descriptor word0 (0x81a00680 to 0x01a00680) ahead of the walker stopped it there without writing the descriptor or its buffer (12 repeats); restoring the bit and one reload doorbell resumed it in place (9); with bit 31 cleared on LAST at exhaustion, a rearm behind it and a doorbell continued in order: the walker does not check LAST's own bit (6). Hardware leaves bit 31 set when it completes a descriptor and sets bit 30. Method and results in knowledge/esp32s31/wifi/rx-walker.md, \"Owner bit\"."
