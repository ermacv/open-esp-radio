[device]
name = "ESP32S31_RADIO"
version = "3.52"
description = """
Recovered ESP32-S31 modem/radio core plus the minimum platform dependencies
    no longer delegated to an external platform PAC. Unclaimed MODEM_LPCON,
    PMU and HP_SYS_CLKRST words remain platform-owned.
    I2C_ANA_MST, PMU_RADIO, HP_SYS_CLKRST_RADIO, MODEM_SYSCON_RADIO, MODEM_LPCON_SHARED_CLOCK, MODEM_LPCON_PHY_TICK, LP_AON_CLKRST,
    LP_PERICLKRST and LP_TSENS are canonical reviewed radio-PHY dependencies.
    These are independently decoded
    MMIO windows, not one monolithic radio peripheral. Covered functions include PHY-PBus,
    PHY-I2C, IQ estimation, RX-DCO, cold deadlines, temperature sensing,
    Wi-Fi MAC RX-DMA and receive BlockAck. Unknown fields are omitted; OPAQUE
    and UNKNOWN names describe instruction-level evidence without assigning an
    unproven hardware meaning."""
vendor = "Espressif"
vendor-id = "ESP"
series = "ESP32-S31"
license-text = "MIT OR Apache-2.0"
address-unit-bits = 8
width = 32
svd-schema = "1.3"
svd-schema-location = "CMSIS-SVD.xsd"

[device.register-defaults]
