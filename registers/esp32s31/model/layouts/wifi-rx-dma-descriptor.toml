schema = 1

[layout]
name = "WIFI_RX_DMA_DESCRIPTOR"
description = """
The 12-byte node the Wi-Fi RX DMA walker follows: the control word, the
buffer address and the link to the next node."""
size = 12
align = 4
placement = ["dma-window"]

[[layout.words]]
name = "CONTROL"
offset = 0x00
access = "shared"

[[layout.words.fields]]
name = "OWNER"
bits = "31"
writer = "cpu"
description = "1: the walker may fill this descriptor; it stops at one with 0 without writing it, and a reload doorbell after the bit is set again resumes it there. The hardware checks it and never clears it: completion is RX_DONE. It does not check the bit of LAST when a doorbell follows LAST's link."

[[layout.words.fields]]
name = "RX_DONE"
bits = "30"
writer = "hardware"
description = "Set by the hardware on a receive unit's terminal descriptor when the unit completes; a walk is delimited by it through the saved LAST. Software clears it on rearm."

[[layout.words.fields]]
name = "BIT_29_OPAQUE"
bits = "29"
writer = "cpu"
description = "Cleared when the descriptor is rearmed and clear on every armed descriptor; what the hardware does with it is unknown."

[[layout.words.fields]]
name = "LENGTH"
bits = "27:14"
writer = "hardware"
description = "The bytes the hardware wrote into the buffer; software sets it to SIZE when it arms the descriptor."

[[layout.words.fields]]
name = "SIZE"
bits = "13:0"
writer = "cpu"
description = "The buffer's capacity in bytes."

[[layout.words]]
name = "BUFFER"
offset = 0x04
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The buffer's address."
placement = ["dma-window"]

[[layout.words]]
name = "NEXT"
offset = 0x08
access = "shared"

[[layout.words.fields]]
name = "ADDRESS"
bits = "31:0"
writer = "cpu"
description = "The next descriptor's address, or zero at the end."
layout = "WIFI_RX_DMA_DESCRIPTOR"

