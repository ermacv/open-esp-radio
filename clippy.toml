disallowed-methods = [
    { path = "core::hint::spin_loop", reason = "production radio code must yield through its executor or platform" },
    # esp-hal's `regs()` reaches a block without its singleton; these blocks
    # pass to the radio HAL at the handoff (oer-adapters-esp-hal-radio).
    { path = "esp_hal::peripherals::IEEE802154::regs", reason = "radio blocks belong to our HAL after the handoff (docs/decisions.md)" },
    { path = "esp_hal::peripherals::MODEM_SYSCON::regs", reason = "radio blocks belong to our HAL after the handoff (docs/decisions.md)" },
    { path = "esp_hal::peripherals::MODEM_LPCON::regs", reason = "radio blocks belong to our HAL after the handoff (docs/decisions.md)" },
    { path = "esp_hal::peripherals::I2C_ANA_MST::regs", reason = "radio blocks belong to our HAL after the handoff (docs/decisions.md)" },
    { path = "esp_hal::peripherals::LP_TSENS::regs", reason = "radio blocks belong to our HAL after the handoff (docs/decisions.md)" },
    # A typed DMA address comes from placed storage or a loan, made only in
    # `oer_esp32s31_hal::dma_address` (docs/hardware-memory.md).
    { path = "oer_esp32s31_pac::layouts::DmaWindowAddress::new_unchecked", reason = "typed DMA addresses come from oer_esp32s31_hal::dma_address" },
    { path = "oer_esp32s31_pac::layouts::DmaRef::new_unchecked", reason = "typed DMA addresses come from oer_esp32s31_hal::dma_address" },
]

# The workspace panic lints (`unwrap_used`, `expect_used`, `panic`,
# `indexing_slicing`) apply to production code; tests may assert freely.
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
