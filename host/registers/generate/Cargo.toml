[package]
name = "oer-registers-generate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reviewed register validation and SVD/PAC publication: the service behind `cargo registers`"

[dependencies]
oer-registers-model = { path = "../model" }
oer-registers-review = { path = "../review" }
oer-registers-contracts = { path = "../contracts" }
oer-os-process = { path = "../../os/process" }
oer-os-durable = { path = "../../os/durable" }
oer-os-toolchain = { path = "../../os/toolchain" }
oer-analysis-elf = { path = "../../analysis/elf" }
oer-pins = { path = "../../pins" }
oer-vendor-provenance = { path = "../../vendor/provenance" }
roxmltree = "=0.20.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.4"
toml_edit = { version = "=0.25.13", features = ["serde"] }
svd2rust = { version = "=0.37.1", default-features = false }
syn = { version = "=2.0.119", features = ["full"] }
quote = "=1.0.47"
tempfile = "=3.27.0"

[dev-dependencies]
cargo_metadata = "=0.23.1"

[lints]
workspace = true
