[package]
name = "oer-hil-source-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL source snapshots: capture, identity and verified materialization of build inputs"

[features]
# The snapshot fixtures of the runner's cross-package tests.
test-support = []

[dependencies]
oer-os-durable = { path = "../../os/durable" }
oer-hil-schema = { path = "../schema" }
oer-image-profile = { path = "../../image/profile" }
oer-os-process = { path = "../../os/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
oer-image-toolchain = { path = "../../image/toolchain" }

[lints]
workspace = true

