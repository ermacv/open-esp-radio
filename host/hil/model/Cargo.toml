[package]
name = "oer-hil-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL scenario model: a scenario's typed specification and pure verdict, derived waits and the stand profile, repetition statistics, resources, target capabilities and tier budgets"

[dependencies]
oer-base-time = { path = "../../../portable/base/time" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
oer-chip-profile = { path = "../../chip/profile" }
oer-hil-image-keys = { path = "../../../portable/hil/image-keys" }
oer-hil-protocol = { path = "../../../portable/hil/protocol", features = ["registry"] }
toml = "1.1"
oer-os-durable = { path = "../../os/durable" }

[build-dependencies]
oer-chip-profile = { path = "../../chip/profile" }

[lints]
workspace = true

[package.metadata.docs.rs]
