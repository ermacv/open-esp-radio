[package]
name = "oer-hil-flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL flash operation: a leased board written by the devices layer's one write, receipted, then journaled as history"

[dependencies]
oer-image-bundle = { path = "../../image/bundle" }
oer-image-profile = { path = "../../image/profile" }
oer-os-durable = { path = "../../os/durable" }
oer-lab-devices = { path = "../../lab/devices", features = ["image"] }
oer-lab-device-lock = { path = "../../lab/device-lock" }
oer-lab-stand-board = { path = "../../lab/stand-board" }
oer-lab-stand-journal = { path = "../../lab/stand-journal" }
oer-image-build = { path = "../../image/build" }
oer-os-process = { path = "../../os/process" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

