[package]
name = "oer-hil-fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The runner contract of the HIL fixture helpers: the Bluetooth and probe requests and replies, and the Linux socket they share"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
oer-ieee80211-mac = { path = "../../../portable/ieee80211/mac" }
oer-lab-fixtures = { path = "../../lab/fixtures" }
oer-hil-protocol = { path = "../../../portable/hil/protocol" }
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true

