[package]
name = "oer-hil-experiment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL experiments: the one run launch, A/B comparisons and bisection"

[dependencies]
oer-hil-run-bundle-format = { path = "../run-bundle-format" }
oer-os-durable = { path = "../../os/durable" }
oer-hil-analysis = { path = "../analysis" }
oer-lab-arbiter = { path = "../../lab/arbiter" }
oer-hil-image = { path = "../image" }
oer-hil-observer = { path = "../observer" }
oer-hil-run-bundle = { path = "../run-bundle" }
oer-hil-schema = { path = "../schema" }
oer-lab-model = { path = "../../lab/model" }
oer-os-process = { path = "../../os/process" }
oer-hil-stats = { path = "../stats" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
oer-hil-run-bundle = { path = "../run-bundle", features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

