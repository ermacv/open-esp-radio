[package]
name = "oer-hil-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "HIL run-level stand operation: the laboratory configuration, the run's fixture lock, the cell's pre-run observation, fixture software leases, recovery and post-mortem"

[features]
# The laboratory fixtures of the runner's cross-package tests.
test-support = []

[dependencies]
oer-lab-router = { path = "../../lab/router" }
oer-lab-devices = { path = "../../lab/devices" }
oer-hil-run-bundle-format = { path = "../run-bundle-format" }
oer-hil-scenario-catalog = { path = "../scenario-catalog" }
oer-analysis-elf = { path = "../../analysis/elf" }
oer-image-profile = { path = "../../image/profile" }
oer-lab-stand-arbiter = { path = "../../lab/stand-arbiter" }
oer-hil-fixture = { path = "../fixture" }
oer-lab-model = { path = "../../lab/model" }
oer-lab-stand-board = { path = "../../lab/stand-board" }
oer-lab-stand-ssh = { path = "../../lab/stand-ssh" }
oer-os-durable = { path = "../../os/durable" }
oer-lab-stand-fixture-install = { path = "../../lab/stand-fixture-install" }
oer-hil-link = { path = "../link" }
oer-hil-protocol = { path = "../../../portable/hil/protocol", features = ["registry"] }
oer-os-process = { path = "../../os/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
toml = "1.1"
zeroize = "1.8.1"

oer-lab-device-lock = { path = "../../lab/device-lock" }
oer-lab-stand-claims = { path = "../../lab/stand-claims" }
oer-lab-stand-journal = { path = "../../lab/stand-journal" }
oer-lab-stand-resource-lock = { path = "../../lab/stand-resource-lock" }
[lints]
workspace = true

