[package]
name = "oer-hil-run-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The HIL run bundle: format, writer and seal, the one typed reader, integrity, the run store and build provenance"

[features]
# The run-session fixtures of the image builder's record tests.
test-support = []

[dependencies]
oer-hil-scenario-catalog = { path = "../scenario-catalog" }
oer-image-toolchain = { path = "../../image/toolchain" }
oer-os-durable = { path = "../../os/durable" }
oer-hil-protocol = { path = "../../../portable/hil/protocol", features = ["registry"] }
oer-hil-run-bundle-format = { path = "../run-bundle-format" }
oer-hil-scenario = { path = "../scenario" }
oer-hil-schema = { path = "../schema" }
oer-hil-source-snapshot = { path = "../source-snapshot" }
oer-os-process = { path = "../../os/process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
flate2 = "1.1.9"

[dev-dependencies]
oer-hil-scenario = { path = "../scenario", features = ["test-support"] }
oer-hil-source-snapshot = { path = "../source-snapshot", features = ["test-support"] }

[lints]
workspace = true

