[package]
name = "oer-vendor-scenario-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-neutral engine of the typed vendor-comparison scenarios: Blobray sessions, comparison harness, coverage, observation, state and evidence shards"

[dependencies]
oer-analysis-elf = { path = "../../analysis/elf" }
oer-os-process = { path = "../../os/process" }
oer-vendor-evidence = { path = "../evidence" }
oer-vendor-evidence-shard = { path = "../evidence-shard" }
oer-registers-bindings = { path = "../../registers/bindings" }
oer-os-durable = { path = "../../os/durable" }
oer-vendor-pins = { path = "../pins" }
oer-image-build = { path = "../../image/build" }
oer-analysis-riscv-model = { path = "../../analysis/riscv-model" }
oer-analysis-riscv-lift = { path = "../../analysis/riscv-lift" }
oer-analysis-blobray-application = { path = "../../analysis/blobray-application" }
oer-analysis-blobray-riscv = { path = "../../analysis/blobray-riscv" }
oer-analysis-blobray-domain = { path = "../../analysis/blobray-domain" }
oer-analysis-blobray-linker = { path = "../../analysis/blobray-linker" }
oer-analysis-blobray-verification = { path = "../../analysis/blobray-verification" }
oer-probe-codegen = { path = "../../probe/codegen" }
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
toml = "=1.1.4"

[lints]
workspace = true

