[package]
name = "oer-lab-stand-arbiter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The stand arbiter: the queue and its job tickets, balances, preemption, maintenance and the device locks of every leased board"

[dependencies]
oer-lab-devices = { path = "../devices" }
oer-lab-device-lock = { path = "../device-lock" }
oer-os-durable = { path = "../../os/durable" }
oer-os-process = { path = "../../os/process" }
oer-lab-stand-claims = { path = "../stand-claims" }
oer-lab-model = { path = "../model" }
oer-lab-stand-journal = { path = "../stand-journal" }
oer-lab-stand-owners = { path = "../stand-owners" }
oer-lab-stand-power = { path = "../stand-power" }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

