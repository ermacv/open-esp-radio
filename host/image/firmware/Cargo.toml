[package]
name = "oer-image-firmware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Build, flash and run staged firmware images on the stand's boards: the service behind `cargo fw`"

[dependencies]
oer-os-process = { path = "../../os/process" }
oer-os-durable = { path = "../../os/durable" }
oer-lab-device-lock = { path = "../../lab/device-lock" }
oer-lab-router = { path = "../../lab/router" }
oer-lab-model = { path = "../../lab/model" }
oer-image-chip-profile = { path = "../chip-profile" }
oer-image-policy = { path = "../policy" }
oer-image-toolchain = { path = "../toolchain" }
oer-image-check-stack = { path = "../check-stack" }
oer-image-check-interrupts = { path = "../check-interrupts" }
oer-platform-staged-layout = { path = "../../../portable/platform/staged-layout" }
oer-platform-esp32s31-layout = { path = "../../../portable/platform/esp32s31-layout" }
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serialport = { version = "4.7", default-features = false }
toml = "=1.1.4"

[dev-dependencies]
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "std", "write"] }
tempfile = "=3.27.0"

[lints]
workspace = true
