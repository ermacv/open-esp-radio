[package]
name = "oer-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[dependencies]
oer-trace = { path = "../../../portable/trace" }
postcard = { version = "1.1.3", default-features = false }
crc = "3.3.0"
embassy-sync = "0.8.0"
heapless = "0.9.3"
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-memory = { path = "../../../portable/memory" }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
oer-hil-protocol = { path = "../protocol", default-features = false, features = ["async-io"] }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true

