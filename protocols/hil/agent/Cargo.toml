[package]
name = "oer-protocols-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Chip-independent HIL target logic shared by the firmware runtime and its host tests"

[dependencies]
postcard = { version = "1.1.3", default-features = false }
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
oer-protocols-hil-protocol = { path = "../protocol", default-features = false }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"

[dev-dependencies]
postcard-schema = { version = "0.2.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[lints]
workspace = true

