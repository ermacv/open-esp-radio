[package]
name = "oer-ieee80211-conformance-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HIL lower-mac vocabulary shared by images and the host"

[features]
default = []
registry = ["oer-hil-protocol/registry"]

[dependencies]
oer-hil-protocol = { path = "../../hil/protocol", default-features = false }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
oer-ieee80211-port = { path = "../port", features = ["test-support"] }
oer-ieee80211-wire = { path = "../wire" }

[lints]
workspace = true
