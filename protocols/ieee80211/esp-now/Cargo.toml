[package]
name = "oer-ieee80211-esp-now"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable ESP-NOW and Espressif long-range protocol owners"
readme = "README.md"

[dependencies]
oer-ieee80211-arbiter = { path = "../arbiter" }
oer-ieee80211-instrumentation = { path = "../instrumentation" }
oer-ieee80211-port = { path = "../port" }
oer-ieee80211-upper-mac = { path = "../upper-mac" }
oer-ieee80211-wire = { path = "../wire" }
oer-time = { path = "../../../portable/time" }
oer-trace = { path = "../../../portable/trace" }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[dev-dependencies]
oer-ieee80211-instrumentation = { path = "../instrumentation", features = ["test-support"] }

