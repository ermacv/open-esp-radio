[package]
name = "oer-ieee80211-cipher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateless IEEE 802.11 CCMP, BIP and bounded AES key-wrap transforms"

[dependencies]
oer-ieee80211-wire = { path = "../wire" }
aes = { version = "0.8.4", default-features = false }
subtle = { version = "2.6.1", default-features = false }
cmac = { version = "0.7.2", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[dev-dependencies]
oer-ieee80211-wire = { path = "../wire", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
