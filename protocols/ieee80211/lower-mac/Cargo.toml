[package]
name = "oer-ieee80211-lower-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable IEEE 802.11 lower-MAC radio port: one hardware transmission attempt, receive events and controls"
readme = "README.md"

[features]
# The shared port's host testing support, used by model consumers.
test-support = ["oer-radio-port/test-support"]

[dependencies]
heapless = "0.9.3"
oer-ieee80211-mac = { path = "../mac" }
oer-radio-coex = { path = "../../radio/coex" }
oer-radio-port = { path = "../../radio/port" }
oer-radio-regulatory = { path = "../../radio/regulatory" }
oer-time = { path = "../../../portable/time" }

[dev-dependencies]
oer-radio-regulatory = { path = "../../radio/regulatory", features = ["test-support"] }
# The crate's own tests run the shared conformance suite on the model.
oer-radio-port = { path = "../../radio/port", features = ["test-support"] }
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
