[package]
name = "oer-ieee80211-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocating host reference backend for the IEEE 802.11 lower-MAC port"

[dependencies]
heapless = "0.9.3"
oer-ieee80211-port = { path = "../port" }
oer-ieee80211-wire = { path = "../wire" }
oer-ieee80211-cipher = { path = "../cipher" }
oer-radio-port = { path = "../../radio/port" }
oer-time = { path = "../../../portable/time" }

[dev-dependencies]
atomic-waker = "1.1.2"
embassy-futures = "0.1.2"
oer-ieee80211-port = { path = "../port", features = ["test-support"] }
oer-radio-port = { path = "../../radio/port", features = ["test-support"] }
oer-radio-regulatory = { path = "../../radio/regulatory", features = ["test-support"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
