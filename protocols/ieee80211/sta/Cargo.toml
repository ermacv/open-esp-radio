[package]
name = "oer-ieee80211-sta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Executor- and chip-independent Wi-Fi station MLME and policy"

[features]
default = []
# Caller-owned construction and retirement without whole-value moves.
placement = []
# Resource accounting visible to host compositions that test retirement.
test-support = []

[dependencies]
oer-memory = { path = "../../../portable/memory" }
oer-crypto = { path = "../../../portable/crypto" }
oer-ieee80211-cipher = { path = "../cipher" }
heapless = "0.9.3"
oer-ieee80211-arbiter = { path = "../arbiter" }
oer-ieee80211-port = { path = "../port" }
oer-ieee80211-wire = { path = "../wire" }
oer-ieee80211-rsn = { path = "../rsn" }
oer-ieee80211-upper-mac = { path = "../upper-mac" }
oer-time = { path = "../../../portable/time" }
oer-radio-port = { path = "../../radio/port" }
oer-radio-regulatory = { path = "../../radio/regulatory" }

[dev-dependencies]
oer-ieee80211-rsn = { path = "../rsn", features = ["test-support"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-radio-regulatory = { path = "../../radio/regulatory", features = ["test-support"] }
oer-ieee80211-wire = { path = "../wire", features = ["test-support"] }
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["test-support"]
