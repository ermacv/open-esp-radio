[package]
name = "oer-ieee80211-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Wi-Fi async glue between the lower-MAC port and the sans-IO cores: the station service and monitor handoffs"

[features]
# Placed station construction, polling and retirement for firmware tasks.
placement = ["oer-ieee80211-core-roles-sta/placement"]

[dependencies]
oer-events = { path = "../../../portable/events" }
oer-sync = { path = "../../../portable/sync" }
oer-network-port = { path = "../../network/port" }
heapless = "0.9.3"
embassy-futures = "0.1.2"
oer-memory = { path = "../../../portable/memory" }
oer-ieee80211-contracts-port = { path = "../contracts/port" }
oer-radio-port = { path = "../../radio/port" }
oer-time = { path = "../../../portable/time", features = ["connected-tasks"] }
oer-ieee80211-core-arbiter = { path = "../core/arbiter" }
oer-ieee80211-core-roles-sta = { path = "../core/roles/sta" }
oer-crypto = { path = "../../../portable/crypto" }
oer-ieee80211-core-upper-mac = { path = "../core/upper-mac" }
oer-bridges-ieee80211-ethernet = { path = "../../bridges/ieee80211-ethernet" }
oer-ieee80211-core-security-rsn = { path = "../core/security/rsn" }

[dev-dependencies]
oer-ieee80211-contracts-security = { path = "../contracts/security" }
oer-crypto = { path = "../../../portable/crypto", features = ["test-support"] }
# The compile-fail example of a shareable command channel.
embassy-sync = "0.8.0"
oer-ieee80211-testing-model = { path = "../testing/model", features = ["test-support"] }
oer-ieee80211-core-security-cipher = { path = "../core/security/cipher" }
oer-radio-regulatory = { path = "../../radio/regulatory", features = ["test-support"] }
oer-ieee80211-core-roles-sta = { path = "../core/roles/sta", features = ["test-support"] }
oer-ieee80211-wire = { path = "../wire" }
critical-section = { version = "1.2.0", features = ["std"] }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-radio-port = { path = "../../radio/port", features = ["test-support"] }
oer-espressif-ieee80211-policy = { path = "../../../chips/espressif/ieee80211-policy" }
oer-ieee80211-core-security-rsn = { path = "../core/security/rsn" }
oer-test-ui-cases = { path = "../../../tools/test/ui-cases" }

[lints]
workspace = true
