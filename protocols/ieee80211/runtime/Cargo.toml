[package]
name = "oer-protocols-ieee80211-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Wi-Fi async glue between the lower-MAC port and the sans-IO cores: the station lifecycle, its datapath actor and monitor handoffs"

[features]
# Placed lifecycle construction, running and retirement for firmware tasks.
placement = ["oer-protocols-ieee80211-core-roles-sta/placement"]

[dependencies]
oer-portable-events = { path = "../../../portable/events" }
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
oer-portable-sync = { path = "../../../portable/sync" }
oer-protocols-network-port = { path = "../../network/port" }
heapless = "0.9.3"
embassy-futures = "0.1.2"
oer-portable-memory = { path = "../../../portable/memory" }
oer-protocols-ieee80211-contracts-port = { path = "../contracts/port" }
oer-protocols-radio-port = { path = "../../radio/port" }
oer-portable-time = { path = "../../../portable/time", features = ["connected-tasks"] }
oer-protocols-ieee80211-core-arbiter = { path = "../core/arbiter" }
oer-protocols-ieee80211-core-roles-sta = { path = "../core/roles/sta" }
oer-portable-crypto = { path = "../../../portable/crypto" }
oer-protocols-ieee80211-core-upper-mac = { path = "../core/upper-mac" }
oer-protocols-bridges-ieee80211-ethernet = { path = "../../bridges/ieee80211-ethernet" }
oer-protocols-ieee80211-core-security-rsn = { path = "../core/security/rsn" }

[dev-dependencies]
oer-protocols-ieee80211-contracts-security = { path = "../contracts/security" }
oer-portable-crypto = { path = "../../../portable/crypto", features = ["test-support"] }
# The compile-fail example of a shareable command channel.
embassy-sync = "0.8.0"
oer-protocols-ieee80211-testing-model = { path = "../testing/model", features = ["test-support"] }
oer-protocols-ieee80211-core-security-cipher = { path = "../core/security/cipher" }
oer-protocols-radio-regulatory = { path = "../../radio/regulatory", features = ["test-support"] }
oer-protocols-ieee80211-core-roles-sta = { path = "../core/roles/sta", features = ["test-support"] }
oer-protocols-ieee80211-wire = { path = "../wire" }
critical-section = { version = "1.2.0", features = ["std"] }
oer-portable-time-virtual = { path = "../../../portable/time-virtual" }
oer-protocols-radio-port = { path = "../../radio/port", features = ["test-support"] }
oer-chips-family-radio-ieee80211-policy = { path = "../../../chips/family/radio/ieee80211/policy" }
oer-protocols-ieee80211-core-security-rsn = { path = "../core/security/rsn" }
oer-tools-test-ui-cases = { path = "../../../tools/test/ui-cases" }

[lints]
workspace = true
