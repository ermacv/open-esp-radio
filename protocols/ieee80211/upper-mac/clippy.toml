disallowed-methods = [
    # Clippy uses the nearest config; retain every common workspace ban.
    { path = "oer_memory::DmaWindowAddress::new_unchecked", reason = "typed DMA addresses come from the chip HAL's dma_address module" },
    { path = "oer_memory::DmaRef::new_unchecked", reason = "typed DMA addresses come from the chip HAL's dma_address module" },
    { path = "oer_mmio::assume_owned", reason = "register blocks are claimed by the chip PAC's root from the single reset root" },
    { path = "core::mem::zeroed", reason = "zero initialization uses a Zeroable proof" },
    { path = "core::mem::transmute", reason = "representation changes use typed conversions or a documented narrow boundary" },
    { path = "std::mem::zeroed", reason = "zero initialization uses a Zeroable proof" },
    { path = "std::mem::transmute", reason = "representation changes use typed conversions or a documented narrow boundary" },
    { path = "core::hint::spin_loop", reason = "production radio code must yield through its executor or platform" },
]

suppress-restriction-lint-in-const = false
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-macros = [
    { path = "core::assert", reason = "retain invariants in closed types; dynamic refusals return their owners" },
    { path = "core::assert_eq", reason = "retain invariants in closed types; dynamic refusals return their owners" },
    { path = "core::assert_ne", reason = "retain invariants in closed types; dynamic refusals return their owners" },
    { path = "core::debug_assert", reason = "retain invariants in closed types; dynamic refusals return their owners" },
    { path = "core::debug_assert_eq", reason = "retain invariants in closed types; dynamic refusals return their owners" },
    { path = "core::debug_assert_ne", reason = "retain invariants in closed types; dynamic refusals return their owners" },
]
