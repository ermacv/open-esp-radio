[package]
name = "oer-ieee80211-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "HIL wifi vocabulary shared by images and the host"

[features]
default = []
descriptors = ["oer-hil-protocol/descriptors"]

[dependencies]
oer-hil-agent = { path = "../../hil/agent" }
oer-trace = { path = "../../../portable/trace" }
oer-ieee80211-instrumentation = { path = "../instrumentation" }
oer-network = { path = "../../network" }
oer-ieee80211-runtime = { path = "../runtime" }
oer-hil-protocol = { path = "../../hil/protocol", default-features = false }
heapless = { version = "0.9.3", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
postcard-schema = { version = "0.2.5", default-features = false, features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
zeroize = { version = "1.8.1", default-features = false }

[dev-dependencies]
serde_json = "1.0"
oer-time = { path = "../../../portable/time" }
oer-time-virtual = { path = "../../../portable/time-virtual" }
oer-memory = { path = "../../../portable/memory" }

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["descriptors"]
