[package]
name = "oer-protocols-ieee80211-core-roles-sta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Executor- and chip-independent Wi-Fi station MLME and policy"

[features]
default = []
# Caller-owned construction and retirement without whole-value moves.
placement = []
# Resource accounting visible to host compositions that test retirement.
test-support = []

[dependencies]
oer-protocols-network-port = { path = "../../../../network/port" }
oer-portable-memory = { path = "../../../../../portable/memory" }
oer-portable-crypto = { path = "../../../../../portable/crypto" }
oer-protocols-ieee80211-core-security-cipher = { path = "../../security/cipher" }
heapless = "0.9.3"
oer-protocols-ieee80211-core-arbiter = { path = "../../arbiter" }
oer-protocols-ieee80211-contracts-port = { path = "../../../contracts/port" }
oer-protocols-ieee80211-wire = { path = "../../../wire" }
oer-protocols-ieee80211-contracts-security = { path = "../../../contracts/security" }
oer-protocols-ieee80211-core-security-rsn = { path = "../../security/rsn" }
oer-protocols-ieee80211-core-upper-mac = { path = "../../upper-mac" }
oer-portable-time = { path = "../../../../../portable/time" }
oer-portable-events = { path = "../../../../../portable/events" }
oer-protocols-radio-port = { path = "../../../../radio/port" }
oer-protocols-radio-regulatory = { path = "../../../../radio/regulatory" }

[dev-dependencies]
oer-protocols-ieee80211-core-security-rsn = { path = "../../security/rsn", features = ["test-support"] }
oer-portable-time-virtual = { path = "../../../../../portable/time-virtual" }
oer-protocols-radio-regulatory = { path = "../../../../radio/regulatory", features = ["test-support"] }
oer-protocols-ieee80211-wire = { path = "../../../wire", features = ["test-support"] }
oer-tools-test-ui-cases = { path = "../../../../../tools/test/ui-cases" }

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["test-support"]
