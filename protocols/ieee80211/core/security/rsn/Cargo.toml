[package]
name = "oer-protocols-ieee80211-core-security-rsn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Allocation-free RSN (WPA2/WPA3) protocol types and four-way-handshake state machines"
readme = "README.md"

[features]
test-support = []

[dependencies]
oer-portable-wire = { path = "../../../../../portable/wire" }
heapless = { version = "0.9.3", features = ["zeroize"] }
# Erase the stream wrapper's buffered keystream as well as the ChaCha core.
cipher = { version = "0.5", default-features = false, features = ["zeroize"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher", "zeroize"] }
oer-portable-crypto = { path = "../../../../../portable/crypto" }
oer-protocols-ieee80211-core-security-cipher = { path = "../cipher" }
oer-protocols-ieee80211-core-upper-mac = { path = "../../upper-mac" }
oer-protocols-ieee80211-wire = { path = "../../../wire" }
oer-protocols-ieee80211-contracts-security = { path = "../../../contracts/security" }
oer-portable-time = { path = "../../../../../portable/time" }
hmac = { version = "0.12.1", default-features = false }
sha1 = { version = "0.10.7", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "expose-field"] }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[dev-dependencies]
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
oer-tools-test-ui-cases = { path = "../../../../../tools/test/ui-cases" }
oer-protocols-ieee80211-wire = { path = "../../../wire", features = ["test-support"] }

[lints]
workspace = true
