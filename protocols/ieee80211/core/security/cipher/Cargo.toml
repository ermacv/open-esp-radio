[package]
name = "oer-protocols-ieee80211-core-security-cipher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateless IEEE 802.11 CCMP and BIP transforms and the WPA2 key data's place, over a caller's AES engine"

[dependencies]
oer-portable-crypto = { path = "../../../../../portable/crypto" }
oer-portable-wire = { path = "../../../../../portable/wire" }
oer-protocols-ieee80211-wire = { path = "../../../wire" }
oer-protocols-ieee802-wire = { path = "../../../../ieee802/wire" }
oer-protocols-ieee80211-contracts-security = { path = "../../../contracts/security" }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[dev-dependencies]
oer-portable-aes-software = { path = "../../../../../portable/aes-software" }
oer-portable-crypto = { path = "../../../../../portable/crypto", features = ["test-support"] }
oer-tools-test-ui-cases = { path = "../../../../../tools/test/ui-cases" }
oer-protocols-ieee80211-wire = { path = "../../../wire", features = ["test-support"] }

[lints]
workspace = true
