[package]
name = "oer-ieee80211-core-security-cipher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateless IEEE 802.11 CCMP, BIP and bounded AES key-wrap transforms over a caller's AES engine"

[dependencies]
oer-crypto = { path = "../../../../../portable/crypto" }
oer-ieee80211-wire = { path = "../../../wire" }
oer-ieee80211-contracts-security = { path = "../../../contracts/security" }
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9.0", default-features = false, features = ["derive"] }

[dev-dependencies]
oer-crypto = { path = "../../../../../portable/crypto", features = ["test-support"] }
oer-test-ui-cases = { path = "../../../../../tools/test/ui-cases" }
oer-ieee80211-wire = { path = "../../../wire", features = ["test-support"] }

[lints]
workspace = true
