[package]
name = "oer-protocols-network-testing-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Host model of one shared medium with several peers, for the network's egress, and the end-to-end station and network simulation"
readme = "README.md"

[dependencies]
oer-portable-time = { path = "../../../../portable/time" }
oer-protocols-ieee80211-core-upper-mac = { path = "../../../ieee80211/core/upper-mac" }
oer-protocols-ieee80211-runtime = { path = "../../../ieee80211/runtime" }
oer-protocols-network-port = { path = "../../port" }
oer-protocols-network-wire = { path = "../../wire" }

[dev-dependencies]
embassy-futures = "0.1.2"
heapless = "0.9.3"
oer-chips-family-radio-ieee80211-policy = { path = "../../../../chips/family/radio/ieee80211/policy" }
oer-portable-events = { path = "../../../../portable/events" }
oer-portable-memory = { path = "../../../../portable/memory" }
oer-portable-time-virtual = { path = "../../../../portable/time-virtual" }
oer-portable-wire = { path = "../../../../portable/wire" }
oer-protocols-ieee80211-contracts-port = { path = "../../../ieee80211/contracts/port" }
oer-protocols-ieee80211-core-arbiter = { path = "../../../ieee80211/core/arbiter" }
oer-protocols-ieee80211-core-roles-sta = { path = "../../../ieee80211/core/roles/sta" }
oer-protocols-ieee80211-core-security-cipher = { path = "../../../ieee80211/core/security/cipher" }
oer-protocols-ieee80211-core-security-rsn = { path = "../../../ieee80211/core/security/rsn" }
oer-protocols-ieee80211-testing-model = { path = "../../../ieee80211/testing/model", features = ["test-support"] }
oer-protocols-ieee80211-wire = { path = "../../../ieee80211/wire" }
oer-protocols-network-core = { path = "../../core", features = ["test-support"] }
oer-protocols-network-runtime = { path = "../../runtime" }
# The test-only link publisher, for a network side composed without a lifecycle.
oer-protocols-ieee80211-runtime = { path = "../../../ieee80211/runtime", features = ["test-support"] }
oer-protocols-radio-port = { path = "../../../radio/port", features = ["test-support"] }
oer-protocols-radio-regulatory = { path = "../../../radio/regulatory", features = ["test-support"] }

[lints]
workspace = true
