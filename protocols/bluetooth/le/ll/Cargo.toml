[package]
name = "oer-bluetooth-le-ll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Allocation-free Bluetooth LE Link Layer protocol and role state"

[dependencies]
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
oer-bluetooth-le-radio = { path = "../radio" }

[dev-dependencies]
zeroize = { version = "1.9.0", default-features = false }
oer-radio-regulatory = { path = "../../../radio/regulatory", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
layer = "protocol"
platform = "portable"
