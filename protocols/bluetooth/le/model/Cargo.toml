[package]
name = "oer-protocols-bluetooth-le-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic Bluetooth LE DTM reference model"

[features]
test-support = ["oer-protocols-radio-port/test-support", "oer-protocols-bluetooth-le-port/test-support"]

[dependencies]
oer-protocols-bluetooth-le-wire = { path = "../wire" }
oer-protocols-bluetooth-le-port = { path = "../port" }
oer-protocols-radio-port = { path = "../../../radio/port" }
oer-portable-time = { path = "../../../../portable/time" }
oer-portable-time-virtual = { path = "../../../../portable/time-virtual" }

[dev-dependencies]
oer-protocols-radio-regulatory = { path = "../../../radio/regulatory", features = ["test-support"] }
oer-tools-test-ui-cases = { path = "../../../../tools/test/ui-cases" }
oer-protocols-radio-port = { path = "../../../radio/port", features = ["test-support"] }
oer-protocols-bluetooth-le-port = { path = "../port", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["test-support"]
