[package]
name = "oer-protocols-ieee802154-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "In-memory IEEE 802.15.4 reference backend for host tests and simulation"

[features]
test-support = ["oer-protocols-radio-port/test-support"]

[dependencies]
oer-protocols-ieee802154-port = { path = "../port" }
oer-protocols-ieee802154-wire = { path = "../wire" }
oer-protocols-radio-port = { path = "../../radio/port" }

[dev-dependencies]
oer-protocols-radio-port = { path = "../../radio/port", features = ["test-support"] }
oer-tools-test-ui-cases = { path = "../../../tools/test/ui-cases" }

[lints]
workspace = true

[package.metadata.open-radio]
test-feature-sets = ["test-support"]
