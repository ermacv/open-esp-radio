[package]
name = "oer-hil-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The HIL agent on the oer application entry: the console, the boot evidence and the request mailbox through which an SDK test image serves its services"

[dependencies]
oer-protocols-hil-protocol = { workspace = true }
oer-portable-memory = { path = "../../portable/memory" }

# The console and the boot evidence run on the chip target only.
[target.'cfg(target_arch = "riscv32")'.dependencies]
oer = { path = "../../oer", features = ["esp32s31", "console"] }
oer-portable-diagnostics = { path = "../../portable/diagnostics" }
oer-chips-esp32s31-compose = { path = "../../chips/esp32s31/compose" }
oer-chips-family-staged-runtime = { path = "../../chips/family/staged-runtime" }
oer-protocols-hil-agent = { path = "../../protocols/hil/agent", default-features = false }
oer-protocols-hil-protocol = { workspace = true, features = ["async-io"] }
oer-portable-riscv = { path = "../../portable/riscv" }
embassy-futures = "0.1.2"

[lints]
workspace = true
