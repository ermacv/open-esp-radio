[package]
name = "oer-firmware-probes-esp32s31-mcycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "A staged image that measures the RISC-V cycle counter against the system timer on both harts: its read cost, its rate, whether it runs through a wait for interrupt, and how hart 0's and hart 1's counters relate"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-espressif-staged-runtime = { path = "../../../chips/family/staged-runtime" }
oer-esp32s31-compose = { path = "../../../chips/esp32s31/compose" }
oer-diagnostics = { path = "../../../portable/diagnostics" }
oer-espressif-executor = { path = "../../../chips/family/executor" }
oer-espressif-platform-port = { path = "../../../chips/family/platform-port", features = ["esp32s31"] }
oer-embassy-time = { path = "../../../portable/embassy/time" }
oer-time = { path = "../../../portable/time" }
oer-espressif-interrupt-table = { path = "../../../chips/family/interrupt-table" }
oer-riscv = { path = "../../../portable/riscv" }

[build-dependencies]
oer-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"
# Hart 1 starts during boot and samples its cycle counter on the boot
# hart's requests; it runs no executor.
harts = ["boot", 1]
task-stack = "proven"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
