[package]
name = "oer-hil-probes-esp32s31-mac-reset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "The Wi-Fi MAC block reset mid-run and how long a stop takes, over the radio domain the probe holds"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics"] }
oer-portable-riscv = { path = "../../../portable/riscv" }
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
heapless = "0.9.3"
static_cell = { workspace = true }
oer-chips-esp32s31-platform-board = { path = "../../../chips/esp32s31/platform/board" }
oer-chips-family-platform-runtime = { path = "../../../chips/family/platform/runtime" }
oer-chips-esp32s31-platform-runtime = { path = "../../../chips/esp32s31/platform/runtime" }
oer-chips-family-platform-executor = { path = "../../../chips/family/platform/executor" }
oer-chips-family-drivers-usb-serial-jtag.workspace = true
embedded-io-async = "0.7.0"
oer-portable-embassy-time = { path = "../../../portable/embassy/time" }
oer-portable-time = { path = "../../../portable/time" }
oer-portable-trace = { path = "../../../portable/trace" }
oer-chips-family-platform-interrupt-table = { path = "../../../chips/family/platform/interrupt-table" }
oer-portable-memory = { path = "../../../portable/memory" }
oer-chips-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-chips-esp32s31-radio-phy = { path = "../../../chips/esp32s31/radio/phy" }
oer-portable-cooperate = { path = "../../../portable/cooperate" }
oer-chips-esp32s31-radio-client = { path = "../../../chips/esp32s31/radio/client" }
oer-protocols-ieee80211-contracts-port = { path = "../../../protocols/ieee80211/contracts/port" }
oer-protocols-ieee80211-wire = { path = "../../../protocols/ieee80211/wire" }
oer-chips-esp32s31-radio-ieee80211-backend = { path = "../../../chips/esp32s31/radio/ieee80211/backend", optional = true }
oer-protocols-ieee80211-core-security-cipher = { path = "../../../protocols/ieee80211/core/security/cipher" }
oer-protocols-ieee80211-contracts-security = { path = "../../../protocols/ieee80211/contracts/security" }
oer-protocols-radio-regulatory = { path = "../../../protocols/radio/regulatory" }

[dev-dependencies]
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }

[build-dependencies]
oer-chips-esp32s31-platform-layout = { workspace = true, features = ["build"] }

[features]
# Part two's transmit series (`tasks/144` A) in place of part one's.
transmit = []
# Part two's receiver (`tasks/158`, A2): listens and acknowledges the
# transmitting probe's frames to its station, counting them.
receiver = []
# Part A on a quiet air (`tasks/168`): the medium observed with the peer
# silent only, since nothing else transmits.
quiet = ["transmit"]
# Case C's sender (`tasks/154`, `159`): A-MSDU cases and the provenance
# series to the receiving rx-chain probe, in place of part two's A.
amsdu = ["transmit"]
# Cell E of `tasks/161`: case C's QoS cases protected under CCMP, sealed in
# software, in place of case C's rounds.
ccmp = ["amsdu"]
# Cell F of `tasks/161`: case C's QoS cases in A-MPDUs through the backend's
# A-MPDU owner, the control first, in place of case C's rounds.
ampdu = ["amsdu", "dep:oer-chips-esp32s31-radio-ieee80211-backend"]
# Cell G of `tasks/161` (`tasks/174`): cell F's aggregates under CCMP sealed
# by this board's MAC, after single sealed MPDUs as the control.
gcell = ["ampdu"]
# B6 of `tasks/144` (`tasks/177`): aggregates of full and short subframes at
# HT MCS7 and MCS0 to the probe polling its receive cause.
b6 = ["ampdu"]
# Part A of `tasks/184`: the three words inside `WIFI_MAC` that are the
# PHY's and the shared radio's, read before an `RST_WIFIMAC` pulse, after
# it and after the cold preparation again, ten times, on a 40 MHz channel;
# then (`tasks/185`) with the PHY's channel and I2C TX-rate writes made
# again after the preparation, before the pulse.
foreign = []
# `tasks/193` (probe-only, branch `probe/rx-rebind-3`): the rebind probe's
# three kinds of air. `stream`: 500-octet frames with their counter every
# 64 octets, each awaited, one after another; `stream-isolated`: the same
# with a pause between frames, so each is alone in the receiver's ring;
# `stream-ampdu`: aggregates of 16 short QoS Data subframes back to back.
stream = ["amsdu"]
stream-isolated = ["stream"]
stream-ampdu = ["ampdu"]
# `tasks/219` (a) and (b), `tasks/220` (probe-only, branch `probe/rx-rebind-4`):
# the receiver of `stream` and `stream-ampdu`, its walker stopped by the
# ROM's edge alone and its block reset under that traffic, every descriptor
# and buffer recorded at fixed delays after each.
settle = ["dep:oer-chips-esp32s31-radio-ieee80211-backend"]
# `tasks/219`: the sender's `stream` and `stream-ampdu` run 600 s a turn.
long-run = []
# `tasks/222`: the short pass of a lease, every part for about a minute.
short = ["settle"]
# `tasks/224`: one part a boot.
only-a2 = ["settle"]
only-reset = ["settle"]
# `tasks/226`: (a3) alone.
only-a3 = ["settle"]
# `tasks/227` and `228`: S1 in the vendor's order, S2's three variants.
only-vendor = ["settle"]
only-r1 = ["settle"]
only-r2 = ["settle"]
only-r3 = ["settle"]
# `tasks/233`: the last resort's shape, and the whole stop in the port's order.
only-r4 = ["settle"]
only-r5 = ["settle"]

[lints]
workspace = true


[package.metadata.open-radio]
critical-section-hart = "boot"

[package.metadata.open-radio.panic-budget]
# Initial composition inventory: existing production/macro sites, no new
# handwritten panic sites. This diagnostic image is not a panic-free product.
runtime = { hal = 15, chips = 310, portable = 1, firmware = 23, unnamed = 5, hardware = 1 }
bootstrap = { unnamed = 2 }
