[package]
name = "oer-hil-probes-esp32s31-light-sleep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish.workspace = true
description = "A staged image that puts the S31's HP system into PMU light sleep until an LP-timer target, with no domain powered down: whether it wakes or is rejected, and the LP timer and the system timer across each sleep"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer-chips-esp32s31-board = { path = "../../../chips/esp32s31/board" }
oer-chips-esp32s31-hal = { path = "../../../chips/esp32s31/hal" }
oer-chips-family-staged-runtime = { path = "../../../chips/family/staged-runtime" }
oer-chips-esp32s31-compose = { path = "../../../chips/esp32s31/compose" }
oer-portable-diagnostics = { path = "../../../portable/diagnostics" }
oer-chips-family-executor = { path = "../../../chips/family/executor" }
oer-chips-family-platform-port = { path = "../../../chips/family/platform-port", features = ["esp32s31"] }
oer-chips-family-power = { path = "../../../chips/family/power" }
oer-portable-embassy-time = { path = "../../../portable/embassy/time" }
oer-portable-time = { path = "../../../portable/time" }
oer-chips-family-interrupt-table = { path = "../../../chips/family/interrupt-table" }
oer-portable-riscv = { path = "../../../portable/riscv" }

[build-dependencies]
oer-chips-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"
# Hart 1 stays held: the sleep covers the boot hart alone.
harts = ["boot"]
task-stack = "proven"

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
