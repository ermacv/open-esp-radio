[package]
name = "oer-hil-scenarios-radio-pair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The HIL radio pair: the receive ring's cases R1 to R4 over case C's frames from the sender, each boot's snapshots and receive counters, and the compare of two runs' words"

[dependencies]
oer-protocols-hil-agent = { path = "../../../protocols/hil/agent" }
oer-tools-hil-harness = { path = "../../../tools/hil/harness" }
oer-hil-services-radio-pair = { path = "../../services/radio-pair" }
serde_json = "1.0"
serde = "1.0"

[[bin]]
name = "oer-hil-scenarios-radio-pair"
path = "src/main.rs"

[[bin]]
name = "radio-pair-compare"
path = "src/bin/compare.rs"

[lints]
workspace = true

[package.metadata.open-radio]
# `cargo hil` lists and runs it.
hil-scenario = true
