[package]
name = "oer-hil-scenarios-wifi-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "The HIL Wi-Fi station load scenario: UDP load between the host and the image's station through the lab router, RX, TX and both, with throughput, loss, RTT and CPU measurements"

[dependencies]
oer-protocols-hil-agent = { path = "../../../protocols/hil/agent" }
oer-tools-analysis-elf = { path = "../../../tools/analysis/elf" }
oer-tools-hil-harness = { path = "../../../tools/hil/harness" }
oer-tools-image-build = { path = "../../../tools/image/build" }
oer-tools-image-checks = { path = "../../../tools/image/checks" }
oer-tools-image-esp-idf = { path = "../../../tools/image/esp-idf" }
oer-tools-os-process = { path = "../../../tools/os/process" }
oer-tools-lab-arbiter = { path = "../../../tools/lab/arbiter" }
oer-tools-lab-client = { path = "../../../tools/lab/client" }
oer-tools-lab-model = { path = "../../../tools/lab/model" }
oer-hil-services-load = { path = "../../services/load" }
oer-hil-services-wifi-station = { path = "../../services/wifi-station" }
clap = { version = "4.5", features = ["derive"] }
heapless = "0.9.3"
serde_json = "1.0"

[dev-dependencies]
oer-portable-time = { path = "../../../portable/time" }
oer-portable-time-virtual = { path = "../../../portable/time-virtual" }
tempfile = "=3.27.0"

[lints]
workspace = true

[package.metadata.open-radio]
# `cargo hil` lists and runs it.
hil-scenario = true
