[package]
name = "oer-hil-images-station"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish.workspace = true
description = "The HIL image of the SDK station scenario: an oer Wi-Fi station and IP service served over the HIL console"
build = "build.rs"

[target.'cfg(target_arch = "riscv32")'.dependencies]
oer = { path = "../../../oer", features = ["esp32s31", "wifi", "console", "hart1", "observe", "udp"] }
oer-protocols-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-hil-agent = { path = "../../agent" }
oer-protocols-hil-protocol = { workspace = true }
oer-hil-services-fault = { path = "../../services/fault" }
oer-hil-services-load = { path = "../../services/load" }
oer-hil-services-sdk-station = { path = "../../services/sdk-station" }
oer-hil-services-wifi-station = { path = "../../services/wifi-station" }
oer-portable-trace = { path = "../../../portable/trace" }
embassy-futures = "0.1.2"
heapless = "0.9.3"
static_cell.workspace = true

[dev-dependencies]
oer = { path = "../../../oer", features = ["observe"] }
oer-protocols-hil-agent = { path = "../../../protocols/hil/agent", default-features = false }
oer-protocols-hil-protocol = { workspace = true }
oer-hil-services-load = { path = "../../services/load" }
oer-hil-services-sdk-station = { path = "../../services/sdk-station" }
oer-portable-trace = { path = "../../../portable/trace" }
oer-hil-services-wifi-station = { path = "../../services/wifi-station" }
heapless = "0.9.3"
postcard = { version = "1.1.3", default-features = false }

[build-dependencies]
oer-chips-esp32s31-layout = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.open-radio]
critical-section-hart = "boot"
# The harts this image runs: hart 1 starts during boot and runs the second
# boot's IP service and line exchanges on its own executor.
harts = ["boot", 1]
# Every task stack of this image is fully analysed: an unresolved path fails `cargo fw build`.
task-stack = "proven"
# Profiled hot task code the image linker moves into SRAM (`cargo fw hot-code`).
hot-code = "hot-code.toml"
# The SDK's observations (`observe`) report through the executors', the
# station's and the RF actor's observers, which only `oer_trace` builds call.
instrumentation = ["trace"]

[package.metadata.open-radio.panic-budget]
# Reachable panic sites by layer (the image check's `*-panics.txt`): each a
# report with a target of 0, never a build gate.
runtime = {}
bootstrap = {}
