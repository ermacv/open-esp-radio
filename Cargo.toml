    "crates/esp32s31/bluetooth/driver",
    # not building: its tests need `oer-esp32s31-hal`'s `validation-probes`, which main does not have
    "crates/esp32s31/bluetooth/memory",
    # not building: needs feature `validation-probes` of `oer-esp32s31-phy`, which main does not have
    "tools/lib/analysis/phy-relation-esp32s31",
    # not building: needs `oer-firmware-verification-esp32s31-probe-register`, which does not build
    "firmware/verification/esp32s31/probe-register-elf",
    # not building: needs feature `validation-probes` of `oer-esp32s31-hal`, which main does not have
    "firmware/verification/esp32s31/probe-register",
    # not building: needs `oer-firmware-verification-esp32s31-probe-radio`, which does not build
    "firmware/verification/esp32s31/probe-radio-elf",
    # not building: needs feature `validation-probes` of `oer-esp32s31-hal`, which main does not have
    "firmware/verification/esp32s31/probe-radio",
    # needs tools/lib/service/vendor-scenario-report
    "tools/cli/vendor-scenario",
    # needs tools/lib/service/vendor-scenarios-esp32c5
    "tools/cli/vendor-scenarios-esp32c5",
    # needs tools/lib/service/vendor-scenarios-esp32s31
    "tools/cli/vendor-scenarios-esp32s31",
    # not building: reads the predecessor's repository model (`oer-repo`) for its host stands
    "tools/cli/verification",
    # needs tools/lib/service/vendor-evidence
    "tools/lib/service/esp32s31-ieee802154-vendor-host",
    # not building: classifies packages by `[package.metadata.open-radio]`, which the single workspace dropped (layers by folder); its policy needs a new source of the evidence classes
    "tools/lib/service/vendor-evidence",
    # not building: its shard closures read the predecessor's repository model (`oer-repo`)
    "tools/lib/service/vendor-scenario-engine",
    # needs tools/lib/service/vendor-scenario-engine
    "tools/lib/service/vendor-scenario-report",
    # needs tools/lib/service/vendor-scenario-engine
    "tools/lib/service/vendor-scenarios-esp32c5",
    # needs tools/lib/service/vendor-scenario-engine
    "tools/lib/service/vendor-scenarios-esp32s31",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio"
publish = false

[workspace.dependencies]
# The firmware packages' shared dependencies.
esp-hal = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false }
esp-bootloader-esp-idf = { git = "https://github.com/ermacv/esp-hal", rev = "4fd4ba9b78aa9f96e54115c3d784491c1e12df02", default-features = false }
static_cell = "2.1.1"
oer-firmware-platform-espressif-staged-layout = { path = "firmware/platform/espressif/staged-layout" }
oer-exec-esp-hal-irq = { path = "crates/exec/esp-hal-irq" }
oer-firmware-platform-esp32s31-layout = { path = "firmware/platform/esp32s31/layout" }
oer-adapters-esp-hal-soc = { path = "crates/adapters/esp-hal/soc", features = ["esp32s31"] }
# The HIL agent images' shared dependencies.
embassy-executor = { version = "0.10.0", default-features = false }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
log = { version = "0.4.27", features = ["max_level_trace", "release_max_level_info"] }
oer-exec-executor = { path = "crates/exec/executor" }
oer-tool-data-hil-protocol = { path = "tools/lib/data/hil-protocol", default-features = false }
oer-tool-data-hil-image-keys = { path = "tools/lib/data/hil-image-keys" }
oer-firmware-hil-agent = { path = "firmware/hil/agent", default-features = false }
oer-firmware-platform-espressif-staged-runtime = { path = "firmware/platform/espressif/staged-runtime" }
# The ESP32-C5 platform's shared dependencies.
oer-firmware-platform-esp32c5-layout = { path = "firmware/platform/esp32c5/layout" }
oer-firmware-platform-esp32c5-board = { path = "firmware/platform/esp32c5/board" }
oer-adapters-esp-hal-soc-esp32c5 = { path = "crates/adapters/esp-hal/soc-esp32c5" }
embassy-futures = "0.1.2"
critical-section = "1.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"
# Panics are visible but do not block yet: each crate moves to `deny` once
# its sites are fixed, air-input parsers first.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Full debug info was most of each checkout's target/debug, tens of GB in
# millions of files, and a large share of host link time. Line tables keep
# panics and backtraces readable.
# The staged images: `cargo build --profile firmware --target
# riscv32imafc-unknown-none-elf -p <image>` (`cargo fw`).
[profile.firmware]
inherits = "release"
panic = "abort"
strip = false

[profile.dev]
debug = "line-tables-only"

# The register tool runs its generator optimized; ordinary builds and tests
# keep the dev profile.
[profile.tools]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# The async-platform branch uses register accessor fixes that are
# still carried by the matching PAC fork.
[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-sync = { version = "0.8.0", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
