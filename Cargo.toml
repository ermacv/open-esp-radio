[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio"
publish = false

[workspace.dependencies]
# The firmware packages' shared dependencies.
static_cell = "2.1.1"
oer-chips-family-platform-layout = { path = "chips/family/platform/layout" }
oer-chips-family-drivers-usb-serial-jtag = { path = "chips/family/drivers/usb-serial-jtag" }
oer-chips-esp32s31-platform-layout = { path = "chips/esp32s31/platform/layout" }
# The HIL agent images' shared dependencies.
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
oer-chips-family-platform-executor = { path = "chips/family/platform/executor" }
oer-protocols-hil-protocol = { path = "protocols/hil/protocol", default-features = false }
oer-protocols-hil-agent = { path = "protocols/hil/agent", default-features = false }
oer-chips-family-platform-runtime = { path = "chips/family/platform/runtime" }
critical-section = "1.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `oer_probe`: `cargo fw` sets it for the images of `hil/probes/`
# alone, in their own target directory; no production crate of the S31
# reads it. `oer_trace` (what happened: values and
# events and execution cost collected by the image) and
# `oer_debug_control` (knobs that force execution paths) and
# `oer_fault_injection` (a one-shot fault on a real path, nothing else) are set by
# `cargo fw` for an image that declares the class in its manifest
# (`[package.metadata.open-radio] instrumentation`), also in a target
# directory of their own.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(oer_probe)",
    "cfg(oer_trace)",
    "cfg(oer_debug_control)",
    "cfg(oer_fault_injection)",
] }

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"
# Panics are visible but do not block yet: each crate moves to `deny` once
# its sites are fixed, air-input parsers first.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Full debug info was most of each checkout's target/debug, tens of GB in
# millions of files, and a large share of host link time. Line tables keep
# panics and backtraces readable.
# The staged images: `cargo build --profile firmware --target
# riscv32imafc-unknown-none-elf -p <image>` (`cargo fw`).
[profile.firmware]
inherits = "release"
panic = "abort"
strip = false

[profile.dev]
debug = "line-tables-only"

# The register tool runs its generator optimized; ordinary builds and tests
# keep the dev profile.
[profile.tools]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

# One copy of the Embassy utilities in the network fork and the workspace;
# `embassy-sync` is its 0.8.0 release whose mutex and channel run no foreign
# code inside their state.
[patch.crates-io]
embassy-sync = { git = "https://github.com/ermacv/embassy", rev = "cbeed6a32ba1c3135f1518f046c5a5c60e86945d" }

[patch."https://github.com/ermacv/embassy.git"]
embassy-futures = { version = "0.1.2", registry = "crates-io" }
embassy-time = { version = "0.5.1", registry = "crates-io" }
