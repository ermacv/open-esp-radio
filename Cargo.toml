[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermacv/open-esp-radio"
publish = false

[workspace.dependencies]
# The firmware packages' shared dependencies.
static_cell = "2.1.1"
oer-chips-family-platform-layout = { path = "chips/family/platform/layout" }
oer-chips-family-drivers-usb-serial-jtag = { path = "chips/family/drivers/usb-serial-jtag" }
oer-chips-esp32s31-platform-layout = { path = "chips/esp32s31/platform/layout" }
# The HIL agent images' shared dependencies.
embassy-time = "0.5.1"
oer-chips-family-platform-executor = { path = "chips/family/platform/executor" }
oer-protocols-hil-protocol = { path = "protocols/hil/protocol", default-features = false }
oer-protocols-hil-agent = { path = "protocols/hil/agent", default-features = false }
oer-chips-family-platform-runtime = { path = "chips/family/platform/runtime" }
critical-section = "1.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `oer_probe`: `cargo fw` sets it for the images of `hil/probes/`
# alone, in their own target directory; no production crate of the S31
# reads it. `oer_trace` (what happened: values and
# events and execution cost collected by the image) and
# `oer_debug_control` (knobs that force execution paths) and
# `oer_fault_injection` (a one-shot fault on a real path, nothing else) and
# `oer_cpu_load` (each hart's idle account: two clock reads a wake) are set by
# `cargo fw` for an image that declares the class in its manifest
# (`[package.metadata.open-radio] instrumentation`), also in a target
# directory of their own.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(oer_probe)",
    "cfg(oer_trace)",
    "cfg(oer_debug_control)",
    "cfg(oer_fault_injection)",
    "cfg(oer_cpu_load)",
] }

[workspace.lints.clippy]
# A mutable call inside `debug_assert!` disappears from optimized firmware.
# Driver protocol state must advance identically in debug and release builds.
debug_assert_with_mut_call = "deny"
# `clippy.toml` lists methods radio code must not call, such as busy waiting
# instead of yielding; an intentional use carries a local `allow` with a reason.
disallowed_methods = "deny"
# A state is a sum (CLAUDE.md): flags in a struct and a `bool` parameter
# that selects behaviour are errors. The root `clippy.toml` sets the
# thresholds for every product crate (the tools' file sets none that fire);
# a package with sites left expects the lint at its crate root, naming the
# step that cleans it, and no source allows it (the layer tests).
struct_excessive_bools = "deny"
fn_params_excessive_bools = "deny"
# A cast that drops bits, a sign or wraps loses a value in silence, as a
# dropped `must_use` result loses an error: `try_from` with the refusal
# handled, or a type whose range makes the conversion lossless. A package
# with existing sites expects the lint at its crate root, naming the step
# that cleans it (tasks/312).
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
let_underscore_must_use = "deny"
# Runtime code has no panic (CLAUDE.md, "Panic lints"): the panic lints are
# stated here once, for every package, and no crate states them again. A
# package with sites left expects a lint at its crate root, naming the step
# that removes them; a host tool expects with the reason "host tool". Tests
# may panic: Clippy's in-tests options (`clippy.toml`) cover `unwrap`,
# `expect`, `panic!` and indexing in a test, and a crate root carries one
# `cfg_attr(test, allow(…))` line for the rest. `disallowed_macros` refuses
# what the root `clippy.toml` lists, or a crate's local one.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"
disallowed_macros = "deny"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1

# Full debug info was most of each checkout's target/debug, tens of GB in
# millions of files, and a large share of host link time. Line tables keep
# panics and backtraces readable.
# The staged images: `cargo build --profile firmware --target
# riscv32imafc-unknown-none-elf -p <image>` (`cargo fw`).
[profile.firmware]
inherits = "release"
panic = "abort"
strip = false

[profile.dev]
debug = "line-tables-only"

# The register tool runs its generator optimized; ordinary builds and tests
# keep the dev profile.
[profile.tools]
inherits = "dev"
opt-level = 3
debug = 1
incremental = true
codegen-units = 16

